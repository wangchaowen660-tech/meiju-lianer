// 生成解锁码
function generateUnlockCode(amount) {
    const random = Math.random().toString(36).substring(2, 6).toUpperCase();
    return `CN-${amount}-${random}`;
}

// 处理收到的消息
async function handleMessage(message) {
    const chatId = message.chat.id;
    const text = message.text || '';

    const amount = 20;
    const code = generateUnlockCode(amount);

    const reply = 
`✅ Your unlock code: ${code}

Enter it in the app to activate Chinese audio.
Thank you for your payment! 🎉

💳 M-PESA Paybill: 0768033524
💰 $1 = 20 Chinese audio sentences`;

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chat_id: chatId,
            text: reply
        })
    });
}

export default {
    async fetch(request, env) {
        const url = new URL(request.url);

        if (request.method === 'POST' && url.pathname === '/webhook') {
            const update = await request.json();
            if (update.message) {
                await handleMessage(update.message);
            }
            return new Response('OK', { status: 200 });
        }

        if (url.pathname === '/register') {
            const webhookUrl = `${url.origin}/webhook`;
            const resp = await fetch(
                `https://api.telegram.org/bot${BOT_TOKEN}/setWebhook?url=${webhookUrl}`
            );
            const result = await resp.json();
            return new Response(JSON.stringify(result, null, 2), {
                headers: { 'Content-Type': 'application/json' }
            });
        }

        return new Response('Telegram Bot Worker is running', { status: 200 });
    }
};

// 全局状态
let currentSceneIndex = 0;
let groupIndex = 0;
let playRate = 1.0;
let currentSentenceEn = "";
let currentSentenceCn = "";
let isSpeaking = false;
const synth = window.speechSynthesis;

// 渲染标签
function renderTabs(){
  const wrap = document.getElementById("tabWrap");
  wrap.innerHTML = "";
  sceneData.forEach((s,i)=>{
    const btn = document.createElement("button");
    btn.className = "tab"+(i===currentSceneIndex?" active":"");
    btn.innerText = s.name;
    btn.onclick = ()=>{
      currentSceneIndex = i;
      groupIndex = 0;
      renderTabs();
      renderQA();
    };
    wrap.appendChild(btn);
  })
}

//渲染问答
function renderQA(){
  if(!sceneData[currentSceneIndex]) return;
  const scene = sceneData[currentSceneIndex];
  const item = scene.list[groupIndex];
  const block = document.getElementById("qaBlock");
  block.innerHTML = `
    <p>Q：${item.q}</p>
    <p class="cn">${item.qzh}</p>
    <p>A：${item.a}</p>
    <p class="cn">${item.azh}</p>
  `;
  document.getElementById("sceneCountInfo").innerText = `当前场景：${scene.name}｜第 ${groupIndex+1} / ${scene.list.length} 组`;
}

function prevGroup(){
  if(groupIndex>0){
    groupIndex--;renderQA();
  }
}
function nextGroup(){
  const arr = sceneData[currentSceneIndex].list;
  if(groupIndex < arr.length-1){
    groupIndex++;renderQA();
  }
}

//iOS语音防卡顿核心
function speakText(text){
  if(isSpeaking) return;
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "en-US";
  utt.rate = playRate;
  isSpeaking = true;
  utt.onend = ()=>{ isSpeaking = false; };
  utt.onerror = ()=>{ isSpeaking = false; };
  synth.speak(utt);
}

function playQuestion(){
  const item = sceneData[currentSceneIndex].list[groupIndex];
  speakText(item.q);
}
function playAnswer(){
  const item = sceneData[currentSceneIndex].list[groupIndex];
  speakText(item.a);
}

//倍速按钮
document.querySelectorAll(".speed-btn").forEach(b=>{
  b.onclick = function(){
    document.querySelectorAll(".speed-btn").forEach(x=>x.classList.remove("active"));
    this.classList.add("active");
    playRate = Number(this.dataset.rate);
  }
})

//造句模块
function genRandomSentence(){
  if(verbList.length===0)return;
  const obj = verbList[Math.floor(Math.random()*verbList.length)];
  currentSentenceEn = `I want to ${obj.en}.`;
  currentSentenceCn = `我想要${obj.zh}。`;
  document.getElementById("makeSentenceBox").innerHTML = `
    <p>${currentSentenceEn}</p>
    <p class="cn">${currentSentenceCn}</p>
  `;
}
function playMakeSentence(){
  if(!currentSentenceEn) return;
  speakText(currentSentenceEn);
}

//初始化
if(sceneData.length>0){
  renderTabs();
  renderQA();
}
genRandomSentence();
document.getElementById("makeWordCountInfo").innerText = `词块总数量：${verbList.length} 条`;
</script>
