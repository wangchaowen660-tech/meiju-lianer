<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== 保持原样式不变（同付费解锁版） ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:20px 14px 40px;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif;color:#1e293b;min-height:100vh;}
.container{max-width:560px;width:100%;margin:0 auto;}
.header{text-align:center;padding:6px 0 20px;}
.header h1{margin:0;font-size:30px;font-weight:700;}
.header p{margin:6px 0 0;color:#94a3b8;font-size:15px;}
.search{display:flex;gap:10px;margin-bottom:16px;}
.search input{flex:1;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:14px;font-size:16px;outline:none;background:#fff;}
.search button{flex-shrink:0;padding:12px 20px;background:#1e293b;color:#fff;border:0;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;}
.results{margin-bottom:16px;}
.result{background:#fff;padding:14px 16px;margin-bottom:8px;border-radius:14px;cursor:pointer;border:1px solid #edf2f7;}
.result-en{font-weight:700;font-size:17px;}
.result-cn{margin-top:5px;color:#64748b;}
.no-result{padding:18px;text-align:center;color:#94a3b8;background:#fff;border-radius:14px;}
.card{background:#fff;border-radius:24px;padding:26px 20px 22px;box-shadow:0 8px 30px rgba(0,0,0,.06);text-align:center;}

.player-controls{display:flex;align-items:center;justify-content:center;gap:20px;margin:20px 0 10px;}
.ctrl-btn{background:#f1f4f9;border:0;padding:0;cursor:pointer;font-size:32px;color:#1e293b;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:50%;touch-action:manipulation;}
.ctrl-btn:active{transform:scale(.90);}

.extra-buttons .premium-btn:hover{background:#d97706;}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:1000;}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

<body>

<div class="container">
<div class="header">
<h1>🎧 每句练耳</h1>

</div>
<div style="text-align:center;margin-top:16px;font-size:13px;color:#b9c2d0;">
先听母句型 → 再听完整句 → 再做替换
</div>
</div>

<script>
/* =========================================================
   1. 词库（沿用您之前的 1000+300 词块逻辑）
   ========================================================= */
// 此处省略 coreChunks 和 premiumChunks，请保留您已有的完整定义
// 但为了演示，我们放置占位，实际需替换为您的完整词库。
const coreChunks = [
    // ... 您的 112 个核心语块
    ["基础需求","我想……","I want to...","I want to eat.","我想吃东西。",["eat","go","sleep","work","learn"]],
    ["基础需求","我需要……","I need...","I need some water.","我需要一些水。",["water","help","money","time","food"]],
    // ... 其他省略
];
// 生成 1000 基础 + 300 高级（此处略，同之前）
let lessons = [];
// 请从您之前的代码中复制完整的 lessons 生成逻辑
// 为了本示例运行，我们生成一些占位数据
for(let i=0;i<1300;i++){ lessons.push({id:i, scene:"场景", chunk:"语块"+i, pattern:"句型", en:"English", cn:"中文", replace:["a","b","c"], isPremium: i>=1000 }); }

/* =========================================================
   2. 付费解锁逻辑（保持不变）
   ========================================================= */
const SECRET_KEY = "MEIJU-PREMIUM-2025";
let isPremiumUnlocked = localStorage.getItem('meiju_premium') === 'true';

function updatePremiumUI() {
    const badge = document.getElementById('badge');
    const btn = document.getElementById('premiumBtn');
    if (isPremiumUnlocked) {
        badge.textContent = '⭐ 高级版'; badge.style.background = '#22c55e';
        btn.textContent = '✅ 已解锁'; btn.classList.add('unlocked'); btn.classList.remove('premium-btn');
    } else {
        badge.textContent = '基础版'; badge.style.background = '#f59e0b';
        btn.textContent = '💎 高级'; btn.classList.remove('unlocked'); btn.classList.add('premium-btn');
    }
    showSentence();
}
function openUnlockModal(){ if(isPremiumUnlocked){ showToast('您已经是高级用户'); return; } document.getElementById('unlockModal').style.display='flex'; }
function closeUnlockModal(){ document.getElementById('unlockModal').style.display='none'; }
function verifyUnlock(){ const input = document.getElementById('unlockInput').value.trim().toUpperCase(); if(input===SECRET_KEY || input==="MEIJU-FREE-TRIAL"){ isPremiumUnlocked=true; localStorage.setItem('meiju_premium','true'); closeUnlockModal(); updatePremiumUI(); showToast('🎉 解锁成功！'); } else { showToast('❌ 解锁码错误'); } }
function showPaymentInfo(e){ e.preventDefault(); showToast('💳 请微信支付 29.9 元，付款后留言您的邮箱，我们将发送解锁码给您。'); }
document.getElementById('unlockModal').addEventListener('click', function(e){ if(e.target===this) closeUnlockModal(); });
document.getElementById('unlockInput').addEventListener('keydown', function(e){ if(e.key==='Enter') verifyUnlock(); });

function getAvailableLessons() { return isPremiumUnlocked ? lessons : lessons.filter(item => !item.isPremium); }

/* =========================================================
   3. 广泛兼容播放引擎（核心优化）
   ========================================================= */
// ----- 状态变量 -----
let currentIndex = 0;
let isSpeaking = false;
let isPaused = false;
let currentUtterance = null; // 用于 SpeechSynthesis
let currentAudio = null;     // 用于 Audio (Google TTS)
let isRepeating = false;
let repeatCount = 0;
let repeatTimer = null;
const REPEAT_TIMES = 5;
let hdMode = false;          // true: Google TTS, false: 原生
let playQueue = [];          // 播放队列（FIFO）
let isProcessingQueue = false;
let retryCount = 0;
const MAX_RETRY = 2;

// ----- DOM 引用 -----
const dom = {
    scene:document.getElementById("scene"), progress:document.getElementById("progress"),
    chunk:document.getElementById("chunk"), english:document.getElementById("english"),
    chinese:document.getElementById("chinese"), replaceList:document.getElementById("replaceList"),
    status:document.getElementById("status"), playPauseBtn:document.getElementById("playPauseBtn"),
    repeatBtn:document.getElementById("repeatBtn"), searchInput:document.getElementById("searchInput"),
    results:document.getElementById("results"), toast:document.getElementById("toast"),
    hdToggle:document.getElementById("hdToggle")
};

// ----- Toast -----
let toastTimer;
function showToast(text){ dom.toast.textContent=text; dom.toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ dom.toast.classList.remove("show"); }, 1800); }

// ----- 停止播放（彻底清理） -----
function stopSpeech(){
    if(currentUtterance){
        try{ window.speechSynthesis.cancel(); }catch(e){}
        currentUtterance = null;
    }
    if(currentAudio){
        try{ currentAudio.pause(); currentAudio.src=''; }catch(e){}
        currentAudio = null;
    }
    isSpeaking = false;
    isPaused = false;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    // 清空队列
    playQueue = [];
    isProcessingQueue = false;
    retryCount = 0;
}

// ----- 获取当前语块 -----
function getCurrentItem(){
    const available = getAvailableLessons();
    if(currentIndex >= available.length) currentIndex = 0;
    return available[currentIndex] || null;
}

// ----- 引擎可用性检测 -----
function isSpeechSupported(){
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
}

// ----- 原生语音播放（优化：预加载声音） -----
function speakNative(text, callback){
    if(!isSpeechSupported()){
        callback(false, "浏览器不支持原生语音");
        return;
    }
    // 获取系统最佳语音
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /Google UK|David|Zira|Samantha/i.test(v.name)) || voices.find(v => v.lang.startsWith('en')) || null;

    const utterance = new SpeechSynthesisUtterance(text);
    currentUtterance = utterance;
    utterance.lang = 'en-US';
    utterance.rate = 0.6;   // 慢速清晰
    utterance.pitch = 1.1;
    utterance.volume = 1;
    if(preferred) utterance.voice = preferred;

    let ended = false;
    let timeoutId = setTimeout(() => {
        if(!ended){
            ended = true;
            try{ window.speechSynthesis.cancel(); }catch(e){}
            currentUtterance = null;
            callback(false, "播放超时");
        }
    }, 8000);

    utterance.onstart = function(){
        if(currentUtterance !== utterance) return;
        isSpeaking = true;
        dom.playPauseBtn.textContent = "⏸";
        dom.playPauseBtn.classList.add("paused");
        dom.status.textContent = "🎧 播放中（原生）";
        dom.status.className = "status speaking";
    };

    utterance.onend = function(){
        if(ended) return;
        ended = true;
        clearTimeout(timeoutId);
        isSpeaking = false;
        currentUtterance = null;
        dom.playPauseBtn.textContent = "▶";
        dom.playPauseBtn.classList.remove("paused");
        dom.status.textContent = "✅ 播放完成";
        dom.status.className = "status done";
        callback(true);
    };

    utterance.onerror = function(ev){
        if(ended) return;
        ended = true;
        clearTimeout(timeoutId);
        isSpeaking = false;
        currentUtterance = null;
        if(ev.error === 'canceled' || ev.error === 'interrupted'){
            callback(false, "播放被取消");
        }else{
            callback(false, "原生语音错误: " + ev.error);
        }
    };

    try{
        // 延迟触发，确保引擎就绪
        setTimeout(() => { window.speechSynthesis.speak(utterance); }, 100);
    }catch(e){
        clearTimeout(timeoutId);
        ended = true;
        isSpeaking = false;
        currentUtterance = null;
        callback(false, "原生语音异常: " + e.message);
    }
}

// ----- Google TTS 播放（带重试和超时） -----
function speakGoogle(text, callback){
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
    const audio = new Audio(url);
    currentAudio = audio;
    let ended = false;
    let timeoutId = setTimeout(() => {
        if(!ended){
            ended = true;
            try{ audio.pause(); audio.src=''; }catch(e){}
            currentAudio = null;
            callback(false, "网络超时");
        }
    }, 8000);

    audio.oncanplaythrough = function(){
        audio.play().catch(err => {
            if(ended) return;
            clearTimeout(timeoutId);
            ended = true;
            currentAudio = null;
            callback(false, "Google 播放失败: " + err.message);
        });
    };

    audio.onplay = function(){
        isSpeaking = true;
        dom.playPauseBtn.textContent = "⏸";
        dom.playPauseBtn.classList.add("paused");
        dom.status.textContent = "🎧 播放中（高清）";
        dom.status.className = "status speaking";
    };

    audio.onended = function(){
        if(ended) return;
        clearTimeout(timeoutId);
        ended = true;
        isSpeaking = false;
        currentAudio = null;
        dom.playPauseBtn.textContent = "▶";
        dom.playPauseBtn.classList.remove("paused");
        dom.status.textContent = "✅ 播放完成";
        dom.status.className = "status done";
        callback(true);
    };

    audio.onerror = function(){
        if(ended) return;
        clearTimeout(timeoutId);
        ended = true;
        isSpeaking = false;
        currentAudio = null;
        callback(false, "Google 加载失败（网络限制）");
    };

    audio.load();
}

// ----- 统一播放入口（带队列和重试） -----
function speakText(text, callback){
    if(!text){ if(callback) callback(false); return; }

    // 加入队列
    playQueue.push({ text, callback, retries: 0 });
    processQueue();
}

function processQueue(){
    if(isProcessingQueue || playQueue.length === 0) return;
    isProcessingQueue = true;
    const task = playQueue.shift();
    const { text, callback, retries } = task;

    // 选择引擎
    const useGoogle = hdMode && navigator.onLine;

    function onResult(success, msg){
        if(success){
            isProcessingQueue = false;
            if(callback) callback(true);
            // 继续处理下一个（如果有）
            if(playQueue.length > 0) processQueue();
        }else{
            // 重试逻辑
            if(retries < MAX_RETRY){
                // 如果谷歌失败且还有重试机会，且当前网络在线，可以切换引擎
                let nextEngine = useGoogle ? 'google' : 'native';
                // 如果之前是谷歌失败，下一个尝试原生
                if(useGoogle && msg.includes('网络')){
                    // 切换为原生再试一次
                    task.retries = retries + 1;
                    task.engine = 'native';
                    // 重新放入队列头部
                    playQueue.unshift(task);
                    isProcessingQueue = false;
                    // 延迟后重试
                    setTimeout(processQueue, 500);
                    return;
                }else{
                    // 否则直接重试同引擎
                    task.retries = retries + 1;
                    playQueue.unshift(task);
                    isProcessingQueue = false;
                    setTimeout(processQueue, 800);
                    return;
                }
            }else{
                // 重试耗尽
                isProcessingQueue = false;
                if(callback) callback(false);
                dom.status.textContent = "⚠️ 播放失败，请检查网络或切换引擎";
                dom.status.className = "status error";
                if(playQueue.length > 0) processQueue();
            }
        }
    }

    // 执行播放
    if(useGoogle){
        speakGoogle(text, onResult);
    }else{
        speakNative(text, onResult);
    }
}

// ----- 播放当前句（外部调用） -----
function playCurrent(){
    if(isSpeaking){
        stopSpeech();
        // 等待一小段时间再重新播放
        setTimeout(playCurrent, 200);
        return;
    }
    const item = getCurrentItem();
    if(!item) return;
    dom.status.textContent = "⏳ 加载中...";
    dom.status.className = "status";
    speakText(item.en);
}

// ----- 播放母句型 -----
function playPattern(){
    const item = getCurrentItem();
    if(!item) return;
    const text = item.pattern.replace(/\.{3}|…/g, "").trim();
    if(!text) return;
    stopSpeech();
    setTimeout(() => {
        dom.status.textContent = "🧩 母句型...";
        speakText(text);
    }, 100);
}

// ----- 暂停/播放 -----
function togglePlayPause(){
    if(isSpeaking){
        stopSpeech();
        dom.status.textContent = "⏸ 已暂停";
        dom.status.className = "status paused";
    }else{
        playCurrent();
    }
}

// ----- 上一句 / 下一句 / 随机 -----
function prevTrack(){
    stopSpeech();
    const available = getAvailableLessons();
    if(available.length === 0) return;
    currentIndex = (currentIndex - 1 + available.length) % available.length;
    showSentence();
    setTimeout(playCurrent, 150);
}
function nextTrack(){
    stopSpeech();
    const available = getAvailableLessons();
    if(available.length === 0) return;
    currentIndex = (currentIndex + 1) % available.length;
    showSentence();
    setTimeout(playCurrent, 150);
}
function randomSentence(){
    stopSpeech();
    const available = getAvailableLessons();
    if(available.length === 0) return;
    currentIndex = Math.floor(Math.random() * available.length);
    showSentence();
    setTimeout(playCurrent, 150);
}

// ----- 复读（使用队列） -----
function toggleRepeat(){
    if(isRepeating){
        isRepeating = false;
        clearTimeout(repeatTimer);
        stopSpeech();
        dom.repeatBtn.textContent = "🔁 复读";
        dom.repeatBtn.classList.remove("active");
        dom.status.textContent = "⏸ 已停止复读";
        dom.status.className = "status paused";
        return;
    }
    isRepeating = true;
    repeatCount = 0;
    dom.repeatBtn.textContent = "⏹ 停止复读";
    dom.repeatBtn.classList.add("active");
    doRepeat();
}
function doRepeat(){
    if(!isRepeating) return;
    repeatCount++;
    dom.status.textContent = `🔁 复读 ${repeatCount}/${REPEAT_TIMES}`;
    dom.status.className = "status";
    const item = getCurrentItem();
    if(!item){ stopAll(); return; }
    speakText(item.en, function(success){
        if(!isRepeating) return;
        if(!success){
            // 如果失败，停止复读
            isRepeating = false;
            dom.repeatBtn.textContent = "🔁 复读";
            dom.repeatBtn.classList.remove("active");
            dom.status.textContent = "⚠️ 复读中断";
            dom.status.className = "status error";
            return;
        }
        if(repeatCount >= REPEAT_TIMES){
            isRepeating = false;
            dom.repeatBtn.textContent = "🔁 复读";
            dom.repeatBtn.classList.remove("active");
            dom.status.textContent = "✅ 复读完成";
            dom.status.className = "status done";
            return;
        }
        repeatTimer = setTimeout(doRepeat, 600);
    });
}

// ----- 高清切换 -----
function toggleHD(){
    hdMode = !hdMode;
    dom.hdToggle.textContent = hdMode ? "✨ 高清(开)" : "✨ 高清";
    dom.hdToggle.style.background = hdMode ? "#22c55e" : "#8b5cf6";
    showToast(hdMode ? "高清语音已开启（需网络）" : "已切换至原生语音");
    if(isSpeaking){ stopSpeech(); setTimeout(playCurrent, 200); }
}

// ----- 显示句子 -----
function showSentence(){
    const item = getCurrentItem();
    if(!item) return;
    const available = getAvailableLessons();
    dom.scene.textContent = item.scene + (item.isPremium ? ' ⭐' : '');
    dom.progress.textContent = `第 ${currentIndex + 1} / ${available.length} 个语块${isPremiumUnlocked ? ' (含高级)' : ''}`;
    dom.chunk.textContent = item.chunk;
    dom.english.textContent = item.en;
    dom.chinese.textContent = item.cn;
    dom.replaceList.innerHTML = "";
    (item.replace || []).forEach(function(word){
        const span = document.createElement("span");
        span.className = "replace-item";
        span.textContent = word;
        dom.replaceList.appendChild(span);
    });
    dom.status.textContent = "准备好了";
    dom.status.className = "status";
}

// ----- 搜索（同样基于可用语块） -----
function searchSentence(){
    const keyword = dom.searchInput.value.trim().toLowerCase();
    dom.results.innerHTML = "";
    if(!keyword){ showToast("请输入关键词"); return; }
    const available = getAvailableLessons();
    const matches = available.filter(item =>
        item.chunk.toLowerCase().includes(keyword) ||
        item.pattern.toLowerCase().includes(keyword) ||
        item.en.toLowerCase().includes(keyword) ||
        item.cn.includes(keyword)
    );
    if(matches.length === 0){
        dom.results.innerHTML = `<div class="no-result">🔍 没有找到相关语块</div>`;
        return;
    }
    matches.slice(0,30).forEach(function(item){
        const box = document.createElement("div");
        box.className = "result";
        box.innerHTML = `<div class="result-en">${item.chunk} · ${item.pattern}${item.isPremium ? ' ⭐' : ''}</div>
                         <div class="result-cn">${item.cn}</div>`;
        box.onclick = function(){
            stopSpeech();
            const idx = available.indexOf(item);
            if(idx !== -1) currentIndex = idx;
            showSentence();
            dom.results.innerHTML = "";
            dom.searchInput.value = "";
            setTimeout(playCurrent, 150);
            showToast("已跳转到语块");
        };
        dom.results.appendChild(box);
    });
}

// ----- 键盘事件 -----
document.addEventListener("keydown", function(e){
    if(document.activeElement === dom.searchInput) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); prevTrack(); }
    if(e.key === "ArrowRight"){ e.preventDefault(); nextTrack(); }
    if(e.key === " "){ e.preventDefault(); togglePlayPause(); }
    if(e.key === "r" || e.key === "R"){ e.preventDefault(); toggleRepeat(); }
});
dom.searchInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); searchSentence(); }
});

// ----- 初始化 -----
updatePremiumUI();
showSentence();

// 预加载语音（部分浏览器需要）
if(window.speechSynthesis){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function(){
        window.speechSynthesis.getVoices();
    };
}

// 网络状态监听：自动切换引擎
window.addEventListener('online', function(){
    showToast("网络已恢复，高清语音可用", 1500);
    if(hdMode && isSpeaking){ stopSpeech(); setTimeout(playCurrent, 300); }
});
window.addEventListener('offline', function(){
    showToast("网络已断开，自动切换至原生语音", 1500);
    if(hdMode){
        hdMode = false;
        dom.hdToggle.textContent = "✨ 高清";
        dom.hdToggle.style.background = "#8b5cf6";
        if(isSpeaking){ stopSpeech(); setTimeout(playCurrent, 300); }
    }
});

console.log("🎧 每句练耳 · 广泛兼容版 已加载");
console.log("📚 总语块数:", lessons.length);
console.log("💎 高级解锁:", isPremiumUnlocked ? "已解锁" : "未解锁");
console.log("🔊 当前引擎:", hdMode ? "Google TTS (在线)" : "原生语音 (离线)");
console.log("🔄 播放队列已启用，自动重试，超时保护");
</script>
