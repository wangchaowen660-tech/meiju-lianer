<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 对话版 · 场景 + 造句</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f0f4f8;padding:12px 10px 28px;color:#1e293b;}
.container{max-width:500px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px;}
.header-left{display:flex;align-items:center;gap:8px;}
.header-left h1{font-size:24px;font-weight:700;}
.header-left p{color:#94a3b8;font-size:13px;background:#eef2f6;padding:2px 12px;border-radius:30px;}
.header-right{display:flex;gap:6px;}
.fav-count{cursor:pointer;background:#e94560;color:#fff;padding:0 10px;border-radius:20px;font-size:13px;font-weight:600;line-height:24px;border:0;}
.pattern-selector{background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid #e2e8f0;}
.pattern-selector label{font-weight:600;font-size:13px;white-space:nowrap;}
.pattern-selector select{flex:1;min-width:100px;padding:4px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;outline:none;cursor:pointer;}
.pattern-selector .badge{background:#e94560;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.custom-chunk{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.custom-chunk input{flex:1;min-width:60px;padding:3px 6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;}
.custom-chunk button{padding:3px 10px;background:#8b5cf6;color:#fff;border:0;border-radius:6px;font-size:12px;cursor:pointer;}
.search-wrapper{display:flex;gap:4px;margin-bottom:8px;}
.search-wrapper .input-group{flex:1;display:flex;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:0 4px;height:34px;}
.search-wrapper .input-group input{flex:1;border:0;outline:none;font-size:13px;padding:0 4px;background:transparent;height:100%;}
.search-wrapper .input-group button{background:transparent;border:0;font-size:16px;cursor:pointer;padding:0 6px;color:#94a3b8;}
.search-wrapper .input-group button:hover{color:#1e293b;}
.results{margin-bottom:8px;}
.result{background:#fff;padding:8px 12px;margin-bottom:4px;border-radius:10px;cursor:pointer;border:1px solid #e2e8f0;}
.result-en{font-weight:600;font-size:15px;}
.result-cn{margin-top:2px;color:#475569;font-size:13px;}
.card{background:#fff;border-radius:16px;padding:16px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #e2e8f0;}
.scene{color:#94a3b8;font-size:12px;font-weight:500;}
.progress{color:#94a3b8;font-size:11px;margin-top:1px;}
.dialog-area{margin:8px 0;max-height:320px;overflow-y:auto;}
.dialog-item{display:flex;flex-direction:column;margin-bottom:8px;border-radius:12px;padding:8px 12px;background:#f8fafc;border-left:3px solid #e94560;}
.dialog-item .q-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.dialog-item .q-label{font-weight:700;font-size:13px;color:#e94560;}
.dialog-item .q-text{font-weight:600;font-size:15px;color:#1e293b;flex:1;}
.dialog-item .a-row{display:flex;align-items:center;gap:6px;margin-top:2px;padding-left:16px;border-left:2px solid #e2e8f0;}
.dialog-item .a-label{font-weight:700;font-size:13px;color:#8b5cf6;}
.dialog-item .a-text{font-size:15px;color:#475569;flex:1;}
.dialog-item .cn-text{font-size:13px;color:#94a3b8;margin-top:4px;padding-left:16px;}
.dialog-item .play-btns{display:flex;gap:4px;flex-shrink:0;}
.dialog-item .play-btns button{background:transparent;border:0;font-size:18px;cursor:pointer;color:#94a3b8;padding:0 2px;}
.dialog-item .play-btns button:hover{color:#1e293b;}
.dialog-controls{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap;}
.dialog-controls button{background:#e2e8f0;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;color:#1e293b;}
.dialog-controls button:hover{background:#cbd5e1;}
.dialog-controls .play-all{background:#e94560;color:#fff;}
.dialog-controls .play-all:hover{background:#c73a54;}
.english{min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px 4px;font-size:22px;font-weight:700;background:#f8fafc;border-radius:8px;margin:4px 0;position:relative;}
.english .fav-btn{background:transparent;border:0;font-size:20px;cursor:pointer;color:#94a3b8;padding:0 4px;}
.english .fav-btn.active{color:#f59e0b;}
.english .copy-btn{background:transparent;border:0;font-size:18px;cursor:pointer;color:#94a3b8;padding:0 4px;}
.english .copy-btn:hover{color:#1e293b;}
.chinese{min-height:28px;font-size:16px;color:#475569;padding:4px 8px;background:#f8fafc;border-radius:8px;}
.sentence-hint{font-size:11px;color:#94a3b8;margin-top:2px;}
.sentence-hint .highlight{color:#e94560;font-weight:600;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
.ctrl-btn{background:#e2e8f0;border:0;padding:0;cursor:pointer;font-size:22px;color:#1e293b;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:active{transform:scale(0.9);}
.ctrl-btn.play-btn{width:52px;height:52px;font-size:28px;background:#e94560;color:#fff;}
.ctrl-btn.cn-btn{background:#f59e0b;color:#fff;width:38px;height:38px;font-size:18px;}
.speed-control{display:flex;align-items:center;gap:4px;}
.speed-btn{background:#e2e8f0;border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;cursor:pointer;}
.speed-btn.active{background:#e94560;color:#fff;border-color:#e94560;}
.extra-buttons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;justify-content:center;}
.extra-buttons button{padding:4px 10px;border:0;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:#e2e8f0;color:#1e293b;}
.extra-buttons button.active{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn:hover{background:#dc2626;}
.extra-buttons .chunk-toggle-btn{background:#8b5cf6;color:#fff;}
.chunk-area-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.3s ease, opacity 0.2s ease;margin:0;}
.chunk-area-wrap.open{max-height:400px;opacity:1;margin-top:8px;}
.chunk-area{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;max-height:200px;overflow-y:auto;}
.chunk-item{cursor:pointer;padding:3px 10px;background:#eef2f6;border-radius:14px;font-size:13px;border:1px solid transparent;transition:0.15s;user-select:none;}
.chunk-item:hover{background:#dce2ea;}
.chunk-item.active{background:#e94560;color:#fff;border-color:#e94560;}
.chunk-item.custom{background:#8b5cf6;color:#fff;}
.chunk-item.custom:hover{background:#7c3aed;}
.status{min-height:20px;margin-top:4px;color:#94a3b8;font-size:12px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}
.status.paused{color:#f59e0b;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:6px 16px;border-radius:40px;opacity:0;pointer-events:none;transition:0.3s;z-index:999;font-size:13px;font-weight:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.divider{height:1px;background:#e2e8f0;margin:12px 0;}
@media(max-width:480px){.english{font-size:18px;}.chunk-item{font-size:12px;padding:2px 8px;}.ctrl-btn{width:34px;height:34px;font-size:18px;}.ctrl-btn.play-btn{width:46px;height:46px;font-size:24px;}.ctrl-btn.cn-btn{width:34px;height:34px;font-size:16px;}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header">
  <div class="header-left"><h1>🧩 对讲机</h1><p>场景对话 + 造句</p></div>
  <div class="header-right">
    <button class="fav-count" id="favCountBtn">⭐ 0</button>
  </div>
</div>

<!-- 场景选择 -->
<div class="pattern-selector">
  <label>📌 场景</label>
  <select id="dialogSceneSelect"></select>
  <span class="badge" id="dialogCount">0 组</span>
</div>

<!-- 搜索 -->
<div class="search-wrapper">
  <div class="input-group">
    <input type="text" id="searchInput" placeholder="搜索英文或中文...">
    <button id="clearSearchBtn">✕</button>
  </div>
</div>

<!-- 搜索结果展示区 -->
<div class="results" id="searchResults" style="display: none;"></div>

<!-- 主卡片区 -->
<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div class="scene" id="sceneName">加载中...</div>
    <div class="progress" id="progressIndex">0 / 0</div>
  </div>

  <!-- 对话上下文区域 -->
  <div class="dialog-area" id="dialogArea"></div>
  
  <div class="dialog-controls">
    <button class="play-all" id="playSceneBtn">🔊 连读本组</button>
    <button id="toggleDialogVisibleBtn">👁️ 隐藏/显示对话</button>
  </div>

  <div class="divider"></div>

  <!-- 核心造句/跟读练习区 -->
  <div class="english">
    <button class="fav-btn" id="favBtn">⭐</button>
    <div style="flex: 1; text-align: center;" id="enText">Loading...</div>
    <button class="copy-btn" id="copyBtn">📋</button>
  </div>
  
  <div class="chinese" id="cnText">加载中...</div>
  <div class="sentence-hint" id="sentenceHint">点击下方切片可进行拼句组装</div>

  <!-- 语速控制与状态 -->
  <div class="player-controls">
    <button class="ctrl-btn" id="prevBtn">⏮</button>
    <button class="ctrl-btn cn-btn" id="toggleCnBtn">中</button>
    <button class="ctrl-btn play-btn" id="playBtn">▶</button>
    <button class="ctrl-btn" id="nextBtn">⏭</button>
    
    <div class="speed-control">
      <button class="speed-btn" data-speed="0.8">0.8x</button>
      <button class="speed-btn active" data-speed="1.0">1.0x</button>
      <button class="speed-btn" data-speed="1.2">1.2x</button>
    </div>
  </div>

  <div class="status" id="statusText">准备就绪</div>

  <!-- 功能拓展按钮 -->
  <div class="extra-buttons">
    <button class="chunk-toggle-btn" id="chunkToggleBtn">🧩 展开单词切片</button>
