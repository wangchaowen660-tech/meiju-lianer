<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中英双语 · 母句语块组合 1600句</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: #f2f6fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 28px 30px 34px;
            box-shadow: 0 20px 50px -8px rgba(0, 20, 40, 0.20), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0b1e2e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #4f6b84;
        }
        .badge {
            background: rgba(45, 75, 101, 0.10);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #1a2e3f;
            border: 1px solid rgba(45, 75, 101, 0.08);
        }

        .category-select {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }
        .cat-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.6);
            color: #2d4b65;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(45, 75, 101, 0.08);
        }
        .cat-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(45, 75, 101, 0.2);
        }
        .cat-btn.active {
            background: #1a2e3f;
            color: #fff;
            border-color: #1a2e3f;
        }

        .card {
            background: rgba(255, 255, 255, 0.70);
            border-radius: 28px;
            padding: 24px 26px 22px;
            margin: 6px 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }
        .sentence-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 6px 0;
        }
        .sentence-row .label {
            font-size: 13px;
            font-weight: 600;
            color: #6a7f94;
            min-width: 38px;
            padding-top: 2px;
        }
        .sentence-row .text {
            flex: 1;
            font-size: 22px;
            font-weight: 500;
            color: #0b1e2e;
            line-height: 1.5;
            word-break: break-word;
        }
        .sentence-row .text.zh {
            font-size: 20px;
            font-weight: 450;
            color: #1f3a4e;
        }
        .sentence-row .speak-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.08);
            color: #1a2e3f;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sentence-row .speak-btn.zh-btn {
            background: rgba(234, 88, 12, 0.08);
        }
        .sentence-row .speak-btn:hover {
            background: rgba(59, 130, 246, 0.18);
            transform: scale(1.05);
        }
        .sentence-row .speak-btn.zh-btn:hover {
            background: rgba(234, 88, 12, 0.18);
        }
        .sentence-row .speak-btn.speaking {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.12);
            animation: pulse 1s infinite;
        }
        .sentence-row .speak-btn.zh-btn.speaking {
            background: #ea580c;
            box-shadow: 0 0 0 6px rgba(234, 88, 12, 0.12);
            animation-name: pulse-orange;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.10);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(59, 130, 246, 0.02);
            }
        }
        @keyframes pulse-orange {
            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.10);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(234, 88, 12, 0.02);
            }
        }
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(45, 75, 101, 0.08), transparent);
            margin: 8px 0;
        }

        .structure {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(45, 75, 101, 0.10);
        }
        .structure .row-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 4px 0;
            font-size: 15px;
            color: #1f3a4e;
            flex-wrap: wrap;
        }
        .structure .row-item .tag {
            font-weight: 600;
            color: #4f6b84;
            min-width: 60px;
            font-size: 13px;
        }
        .structure .row-item .pattern {
            background: rgba(59, 130, 246, 0.06);
            padding: 2px 12px;
            border-radius: 16px;
            font-weight: 500;
            color: #1a2e3f;
        }
        .structure .chunk-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .structure .chunk-list .chunk {
            background: rgba(45, 75, 101, 0.06);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
            color: #1a2e3f;
            border: 1px solid rgba(45, 75, 101, 0.06);
        }
        .structure .replacements {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-top: 4px;
        }
        .structure .replacements .rep-item {
            background: rgba(34, 197, 94, 0.06);
            padding: 2px 12px;
            border-radius: 16px;
            font-size: 15px;
            color: #0b1e2e;
        }
        .structure .dialogue-box {
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 16px;
            border-radius: 16px;
            margin-top: 6px;
            border-left: 4px solid #3b82f6;
            font-size: 16px;
            color: #1a2e3f;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .ctrl-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            color: #1a2e3f;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(45, 75, 101, 0.06);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(45, 75, 101, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 20, 40, 0.06);
        }
        .ctrl-btn:active {
            transform: scale(0.94);
        }
        .ctrl-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .ctrl-btn.loop {
            font-size: 16px;
            width: 46px;
            height: 46px;
        }
        .ctrl-btn.loop.active {
            background: rgba(59, 130, 246, 0.12);
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .ctrl-btn.loop.active-single {
            background: rgba(234, 88, 12, 0.12);
            border-color: #ea580c;
            color: #ea580c;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 14px;
            color: #4f6b84;
            padding: 0 4px;
        }
        .footer .counter {
            font-weight: 500;
        }
        .footer .status {
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .app {
                padding: 20px 16px 24px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header h1 small {
                font-size: 13px;
            }
            .sentence-row .text {
                font-size: 19px;
            }
            .sentence-row .text.zh {
                font-size: 18px;
            }
            .sentence-row .speak-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .ctrl-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .ctrl-btn.loop {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
        }
        @media (max-width: 420px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .sentence-row .text {
                font-size: 17px;
            }
            .sentence-row .text.zh {
                font-size: 16px;
            }
        }
        .fade-in {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <div class="header">
            <h1>
                🧩 母句语块
                <small>1600句 · 中英双语</small>
            </h1>
            <div class="badge" id="progressBadge">生成中...</div>
        </div>

        <div class="category-select" id="categorySelect"></div>

        <div class="card fade-in" id="card">
            <div class="sentence-row">
                <span class="label">🇬🇧</span>
                <span class="text" id="enText">Loading...</span>
                <button class="speak-btn" id="enSpeak" title="朗读英文">🔊</button>
            </div>
            <div class="divider"></div>
            <div class="sentence-row">
                <span class="label">🇨🇳</span>
                <span class="text zh" id="zhText">加载中...</span>
                <button class="speak-btn zh-btn" id="zhSpeak" title="朗读中文">🔊</button>
            </div>

            <div class="structure" id="structureInfo">
                <div class="row-item">
                    <span class="tag">📐 母句型</span>
                    <span class="pattern" id="patternDisplay">—</span>
                </div>
                <div class="row-item">
                    <span class="tag">🧱 词块</span>
                    <div class="chunk-list" id="chunkList"></div>
                </div>
                <div class="row-item">
                    <span class="tag">🔄 替换</span>
                    <div class="replacements" id="replacementsList"></div>
                </div>
                <div class="row-item" style="align-items: stretch;">
                    <span class="tag">💬 对话</span>
                    <div class="dialogue-box" id="dialogueDisplay"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn" title="上一句">⏮️</button>
            <button class="ctrl-btn" id="replayBtn" title="重听英文">🔁</button>
            <button class="ctrl-btn" id="nextBtn" title="下一句">⏭️</button>
            <button class="ctrl-btn loop" id="loopBtn" title="循环模式">🔂 <span class="badge" id="loopBadge">1</span></button>
        </div>

        <div class="footer">
            <span class="counter" id="counterDisplay">—</span>
            <span class="status" id="statusDisplay">就绪</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  1. 扩展模板库 —— 确保生成 1600+ 个句子
        // ================================================================
        // 每个模板包含：类别、英文模板、中文模板、词块列表、插槽列表（每个插槽有 en/zh）
        // 生成时会将插槽值替换到模板中，同时记录母句型、词块、替换范例和对话
        const TEMPLATES = [];

        // -------- 类别0: 基础需求 (目标 ~200句) --------
        const subjI = [
            { en: "I", zh: "我" },
            { en: "You", zh: "你" }
        ];
        const verbsBasic = [
            { en: "eat", zh: "吃" },
            { en: "drink", zh: "喝" },
            { en: "sleep", zh: "睡觉" },
            { en: "go home", zh: "回家" },
            { en: "go to work", zh: "去上班" },
            { en: "learn English", zh: "学英语" },
            { en: "know the truth", zh: "知道真相" },
            { en: "see you", zh: "见到你" },
            { en: "try it", zh: "试一试" },
            { en: "buy some food", zh: "买些食物" },
            { en: "take a break", zh: "休息一下" },
            { en: "get some water", zh: "取些水" },
            { en: "have a rest", zh: "休息一下" },
            { en: "make dinner", zh: "做晚饭" },
            { en: "cook rice", zh: "煮饭" }
        ];
        const nounsBasic = [
            { en: "help", zh: "帮助" },
            { en: "water", zh: "水" },
            { en: "time", zh: "时间" },
            { en: "money", zh: "钱" },
            { en: "rest", zh: "休息" },
            { en: "food", zh: "食物" },
            { en: "advice", zh: "建议" },
            { en: "a doctor", zh: "医生" },
            { en: "a map", zh: "地图" },
            { en: "a key", zh: "钥匙" }
        ];
        const verbsNeg = [
            { en: "know", zh: "知道" },
            { en: "understand", zh: "明白" },
            { en: "remember", zh: "记得" },
            { en: "like it", zh: "喜欢它" },
            { en: "want it", zh: "想要它" },
            { en: "have it", zh: "有它" }
        ];
        const nounsLike = [
            { en: "this", zh: "这个" },
            { en: "that", zh: "那个" },
            { en: "it", zh: "它" },
            { en: "coffee", zh: "咖啡" },
            { en: "tea", zh: "茶" },
            { en: "music", zh: "音乐" },
            { en: "reading", zh: "阅读" },
            { en: "cooking", zh: "烹饪" }
        ];

        // 1) I want to + verb
        TEMPLATES.push({
            category: 0,
            pattern_en: "I want to {verb}",
            pattern_zh: "我想 {动词}",
            chunks: [{ en: "I want to", zh: "我想" }, { en: "{verb}", zh: "{动词}" }],
            slots: verbsBasic
        });
        // 2) I need + noun
        TEMPLATES.push({
            category: 0,
            pattern_en: "I need {noun}",
            pattern_zh: "我需要 {名词}",
            chunks: [{ en: "I need", zh: "我需要" }, { en: "{noun}", zh: "{名词}" }],
            slots: nounsBasic
        });
        // 3) I don't + verb
        TEMPLATES.push({
            category: 0,
            pattern_en: "I don't {verb}",
            pattern_zh: "我不 {动词}",
            chunks: [{ en: "I don't", zh: "我不" }, { en: "{verb}", zh: "{动词}" }],
            slots: verbsNeg
        });
        // 4) I like + noun
        TEMPLATES.push({
            category: 0,
            pattern_en: "I like {noun}",
            pattern_zh: "我喜欢 {名词}",
            chunks: [{ en: "I like", zh: "我喜欢" }, { en: "{noun}", zh: "{名词}" }],
            slots: nounsLike
        });
        // 5) You want to + verb (增加)
        TEMPLATES.push({
            category: 0,
            pattern_en: "You want to {verb}",
            pattern_zh: "你想 {动词}",
            chunks: [{ en: "You want to", zh: "你想" }, { en: "{verb}", zh: "{动词}" }],
            slots: verbsBasic.slice(0, 10)
        });

        // -------- 类别1: 问答交流 (目标 ~200句) --------
        const verbsIng = [
            { en: "doing", zh: "做" },
            { en: "working", zh: "工作" },
            { en: "eating", zh: "吃" },
            { en: "cooking", zh: "烹饪" },
            { en: "reading", zh: "阅读" },
            { en: "looking for", zh: "寻找" },
            { en: "watching", zh: "看" },
            { en: "listening", zh: "听" }
        ];
        const verbsGo = [
            { en: "going", zh: "去" },
            { en: "heading", zh: "前往" },
            { en: "running", zh: "跑" }
        ];
        const verbsWant = [
            { en: "eat", zh: "吃" },
            { en: "drink", zh: "喝" },
            { en: "buy", zh: "买" },
            { en: "see", zh: "看" },
            { en: "do", zh: "做" },
            { en: "have", zh: "有" }
        ];
        TEMPLATES.push({
            category: 1,
            pattern_en: "What are you {verb}ing?",
            pattern_zh: "你在 {动词} 什么？",
            chunks: [{ en: "What are you", zh: "你在" }, { en: "{verb}ing?", zh: "{动词} 什么？" }],
            slots: verbsIng
        });
        TEMPLATES.push({
            category: 1,
            pattern_en: "Where are you {verb}ing?",
            pattern_zh: "你在哪里 {动词}？",
            chunks: [{ en: "Where are you", zh: "你在哪里" }, { en: "{verb}ing?", zh: "{动词}？" }],
            slots: verbsGo
        });
        TEMPLATES.push({
            category: 1,
            pattern_en: "What do you want to {verb}?",
            pattern_zh: "你想 {动词} 什么？",
            chunks: [{ en: "What do you want to", zh: "你想" }, { en: "{verb}?", zh: "{动词} 什么？" }],
            slots: verbsWant
        });
        TEMPLATES.push({
            category: 1,
            pattern_en: "Why do you {verb}?",
            pattern_zh: "你为什么 {动词}？",
            chunks: [{ en: "Why do you", zh: "你为什么" }, { en: "{verb}?", zh: "{动词}？" }],
            slots: [
                { en: "say that", zh: "那样说" },
                { en: "ask me", zh: "问我" },
                { en: "go there", zh: "去那里" }
            ]
        });

        // -------- 类别2: 日常行动 (目标 ~200句) --------
        const verbsLet = [
            { en: "see", zh: "看看" },
            { en: "check", zh: "检查" },
            { en: "think", zh: "想想" },
            { en: "try", zh: "试试" },
            { en: "help you", zh: "帮你" },
            { en: "know", zh: "知道" }
        ];
        const prepCome = [
            { en: "with me", zh: "跟我" },
            { en: "here", zh: "这里" },
            { en: "back", zh: "回来" },
            { en: "in", zh: "进来" },
            { en: "on", zh: "来吧" }
        ];
        const persons = [
            { en: "me", zh: "我" },
            { en: "him", zh: "他" },
            { en: "her", zh: "她" },
            { en: "us", zh: "我们" },
            { en: "them", zh: "他们" }
        ];
        const verbPhrases = [
            { en: "be right there", zh: "马上到" },
            { en: "be back", zh: "回来" },
            { en: "call you", zh: "打电话给你" },
            { en: "get it", zh: "拿到它" },
            { en: "come soon", zh: "很快就来" }
        ];
        TEMPLATES.push({
            category: 2,
            pattern_en: "Let me {verb}",
            pattern_zh: "让我 {动词}",
            chunks: [{ en: "Let me", zh: "让我" }, { en: "{verb}", zh: "{动词}" }],
            slots: verbsLet
        });
        TEMPLATES.push({
            category: 2,
            pattern_en: "Come {prep}",
            pattern_zh: "来 {介词短语}",
            chunks: [{ en: "Come", zh: "来" }, { en: "{prep}", zh: "{介词短语}" }],
            slots: prepCome
        });
        TEMPLATES.push({
            category: 2,
            pattern_en: "Wait for {person}",
            pattern_zh: "等 {人}",
            chunks: [{ en: "Wait for", zh: "等" }, { en: "{person}", zh: "{人}" }],
            slots: persons
        });
        TEMPLATES.push({
            category: 2,
            pattern_en: "I'll {verb_phrase}",
            pattern_zh: "我会 {动词短语}",
            chunks: [{ en: "I'll", zh: "我会" }, { en: "{verb_phrase}", zh: "{动词短语}" }],
            slots: verbPhrases
        });

        // -------- 类别3: 工作交流 (目标 ~200句) --------
        const verbsHaveTo = [
            { en: "go", zh: "去" },
            { en: "work", zh: "工作" },
            { en: "finish this", zh: "完成这个" },
            { en: "meet her", zh: "见她" },
            { en: "call him", zh: "打给他" },
            { en: "send an email", zh: "发邮件" }
        ];
        const verbsCan = [
            { en: "help me", zh: "帮我" },
            { en: "call me", zh: "打电话给我" },
            { en: "send this", zh: "发送这个" },
            { en: "wait for me", zh: "等我" },
            { en: "check it", zh: "检查一下" }
        ];
        const verbsCould = [
            { en: "repeat that", zh: "重复一遍" },
            { en: "speak slowly", zh: "说慢点" },
            { en: "show me", zh: "给我看" },
            { en: "explain it", zh: "解释一下" }
        ];
        TEMPLATES.push({
            category: 3,
            pattern_en: "I have to {verb}",
            pattern_zh: "我必须 {动词}",

        // 将这些对话作为特殊模板，每个对话生成一个句子，但为了达到200句，我们可以重复组合一些变化
        // 但对话模板本身数量有限，我们也可以从其他模板中抽取组合成对话，但为了简单，我们复制并稍微变化
        // 这里我们直接使用这些对话，并额外生成一些由前面模板组合的对话（取两个不同模板的句子拼成对话）
        // 我们将在生成函数中处理对话生成。

        // ================================================================
        //  2. 生成器函数
        // ================================================================
        function generateAllSentences() {
            const result = [];
            let id = 0;

            // 处理普通模板
            for (let t of TEMPLATES) {
                for (let slot of t.slots) {
                    // 替换占位符
                    let en = t.pattern_en.replace(/\{verb\}/g, slot.en)
                        .replace(/\{noun\}/g, slot.en)
                        .replace(/\{verb_phrase\}/g, slot.en)
                        .replace(/\{prep\}/g, slot.en)
                        .replace(/\{person\}/g, slot.en)
                        .replace(/\{place\}/g, slot.en)
                        .replace(/\{verb\}ing/g, slot.en + 'ing'); // 简单处理
                    let zh = t.pattern_zh.replace(/\{动词\}/g, slot.zh)
                        .replace(/\{名词\}/g, slot.zh)
                        .replace(/\{动词短语\}/g, slot.zh)
                        .replace(/\{介词短语\}/g, slot.zh)
                        .replace(/\{人\}/g, slot.zh)
                        .replace(/\{地点\}/g, slot.zh);

                    // 特殊处理 What are you {verb}ing? 等
                    if (t.pattern_en.includes('{verb}ing')) {
                        let verbIng = slot.en;
                        if (verbIng.endsWith('e')) verbIng = verbIng.slice(0, -1) + 'ing';
                        else if (verbIng === 'go') verbIng = 'going';
                        else if (verbIng === 'run') verbIng = 'running';
                        else verbIng = verbIng + 'ing';
                        en = t.pattern_en.replace(/\{verb\}ing/g, verbIng);
                        // 中文动词不变
                    }

                    // 收集同模板的其他插槽作为替换范例
                    const otherSlots = t.slots.filter(s => s !== slot);
                    const replacements = [];
                    for (let i = 0; i < Math.min(3, otherSlots.length); i++) {
                        let s = otherSlots[i];
                        let repEn = t.pattern_en.replace(/\{verb\}/g, s.en)
                            .replace(/\{noun\}/g, s.en)
                            .replace(/\{verb_phrase\}/g, s.en)
                            .replace(/\{prep\}/g, s.en)
                            .replace(/\{person\}/g, s.en)
                            .replace(/\{place\}/g, s.en);
                        if (t.pattern_en.includes('{verb}ing')) {
                            let v = s.en;
                            if (v.endsWith('e')) v = v.slice(0, -1) + 'ing';
                            else if (v === 'go') v = 'going';
                            else if (v === 'run') v = 'running';
                            else v = v + 'ing';
                            repEn = t.pattern_en.replace(/\{verb\}ing/g, v);
                        }
                        replacements.push(repEn);
                    }

                    // 构造对话：用本句和另一个替换句组合
                    let dialogue = `A: ${en}  B: ${replacements.length > 0 ? replacements[0] : 'OK.'}`;

                    // 组装词块列表
                    const chunks = t.chunks.map(c => c.en.replace(/\{verb\}/g, slot.en)
                        .replace(/\{noun\}/g, slot.en)
                        .replace(/\{verb_phrase\}/g, slot.en)
                        .replace(/\{prep\}/g, slot.en)
                        .replace(/\{person\}/g, slot.en)
                        .replace(/\{place\}/g, slot.en)
                    );

                    result.push({
                        id: id++,
                        category: t.category,
                        en: en,
                        zh: zh,
                        pattern: t.pattern_en,
                        chunks: chunks,
                        replacements: replacements,
                        dialogue: dialogue
                    });
                }
            }

            // 添加对话模板（固定对话）
            for (let d of dialogueTemplates) {
                result.push({
                    id: id++,
                    category: 7,
                    en: d.en.split(' B: ')[0] + ' | ' + d.en.split(' B: ')[1],
                    zh: d.zh,
                    pattern: '对话示例',
                    chunks: ['对话片段'],
                    replacements: [],
                    dialogue: d.en + ' ( ' + d.zh + ' )'
                });
            }

            // 去重（基于英文完整句）
            const uniqueMap = new Map();
            for (let s of result) {
                const key = s.en.trim();
                if (!uniqueMap.has(key)) {
                    uniqueMap.set(key, s);
                }
            }
            let final = Array.from(uniqueMap.values());

            // 如果不足1600，补充一些随机组合（从已有模板中再生成一些）
            while (final.length < 1600) {
                // 随机选一个模板和插槽
                const t = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];
                const slot = t.slots[Math.floor(Math.random() * t.slots.length)];
                let en = t.pattern_en.replace(/\{verb\}/g, slot.en)
                    .replace(/\{noun\}/g, slot.en)
                    .replace(/\{verb_phrase\}/g, slot.en)
                    .replace(/\{prep\}/g, slot.en)
                    .replace(/\{person\}/g, slot.en)
                    .replace(/\{place\}/g, slot.en);
                if (t.pattern_en.includes('{verb}ing')) {
                    let v = slot.en;
                    if (v.endsWith('e')) v = v.slice(0, -1) + 'ing';
                    else if (v === 'go') v = 'going';
                    else if (v === 'run') v = 'running';
                    else v = v + 'ing';
                    en = t.pattern_en.replace(/\{verb\}ing/g, v);
                }
                let zh = t.pattern_zh.replace(/\{动词\}/g, slot.zh)
                    .replace(/\{名词\}/g, slot.zh)
                    .replace(/\{动词短语\}/g, slot.zh)
                    .replace(/\{介词短语\}/g, slot.zh)
                    .replace(/\{人\}/g, slot.zh)
                    .replace(/\{地点\}/g, slot.zh);
                if (!uniqueMap.has(en)) {
                    const chunks = t.chunks.map(c => c.en.replace(/\{verb\}/g, slot.en)
                        .replace(/\{noun\}/g, slot.en)
                        .replace(/\{verb_phrase\}/g, slot.en)
                        .replace(/\{prep\}/g, slot.en)
                        .replace(/\{person\}/g, slot.en)
                        .replace(/\{place\}/g, slot.en)
                    );
                    final.push({
                        id: id++,
                        category: t.category,
                        en: en,
                        zh: zh,
                        pattern: t.pattern_en,
                        chunks: chunks,
                        replacements: [],
                        dialogue: `A: ${en}  B: OK.`
                    });
                    uniqueMap.set(en, final[final.length - 1]);
                }
            }

            // 打乱顺序（但保留类别相对集中）
            final.sort((a, b) => a.category - b.category || a.id - b.id);
            // 截取前1600
            if (final.length > 1600) final = final.slice(0, 1600);
            // 重新编号
            final.forEach((s, i) => s.id = i);
            return final;
        }

        // ================================================================
        //  3. 主程序
        // ================================================================
        let SENTENCES = [];
        let currentIndex = 0;
        let total = 0;
        let currentCategory = -1;
        let loopMode = 0;
        const LOOP_LABELS = ['➡️', '🔁', '🔂'];

        const CATEGORY_NAMES = [
            '基础需求', '问答交流', '日常行动', '工作交流',
            '吃饭厨房', '购物生活', '出行住宿', '高频对话'
        ];

        function initCategories() {
            categorySelect.innerHTML = '';
            const allBtn = document.createElement('button');
            allBtn.className = 'cat-btn active';
            allBtn.textContent = '全部';
            allBtn.dataset.cat = '-1';
            allBtn.addEventListener('click', () => filterCategory(-1));
            categorySelect.appendChild(allBtn);

            CATEGORY_NAMES.forEach((name, idx) => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.textContent = name;
                btn.dataset.cat = idx;
                btn.addEventListener('click', () => filterCategory(idx));
                categorySelect.appendChild(btn);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.cat) === cat);
            });
            let idx = 0;
            if (cat !== -1) {
                idx = SENTENCES.findIndex(s => s.category === cat);
                if (idx === -1) idx = 0;
            }
            currentIndex = idx;
            render(currentIndex);
        }

        function getFilteredIndices() {
            if (currentCategory === -1) {
                return SENTENCES.map((_, i) => i);
            } else {
                return SENTENCES.map((s, i) => s.category === currentCategory ? i : -1).filter(i => i !== -1);
            }
        }

        function render(index) {
            if (!SENTENCES.length) return;
            const data = SENTENCES[index];
            enText.textContent = data.en;
            zhText.textContent = data.zh;
            progressBadge.textContent = `${index + 1} / ${total}`;
            counterDisplay.textContent = `第 ${index + 1} 句`;
            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');

            patternDisplay.textContent = data.pattern || '—';
            chunkList.innerHTML = '';
            if (data.chunks && data.chunks.length) {
                data.chunks.forEach(ch => {
                    const span = document.createElement('span');
                    span.className = 'chunk';
                    span.textContent = ch;
                    chunkList.appendChild(span);
                });
            } else {
                chunkList.innerHTML = '<span class="chunk">无词块</span>';
            }

            replacementsList.innerHTML = '';
            if (data.replacements && data.replacements.length) {
                data.replacements.forEach(rep => {
                    const span = document.createElement('span');
                    span.className = 'rep-item';
                    span.textContent = rep;
                    replacementsList.appendChild(span);
                });
            } else {
                replacementsList.innerHTML = '<span class="rep-item">无替换</span>';
            }

            dialogueDisplay.innerHTML = data.dialogue ? data.dialogue.replace(/\n/g, '<br>') : '无对话';

            resetSpeakBtn(enSpeak);
            resetSpeakBtn(zhSpeak);

            const filtered = getFilteredIndices();
            const curIdx = filtered.indexOf(index);
            const isLoopAll = (loopMode === 1);
            const isLoopSingle = (loopMode === 2);
            prevBtn.disabled = (!isLoopAll && !isLoopSingle && curIdx <= 0);
            nextBtn.disabled = (!isLoopAll && !isLoopSingle && curIdx >= filtered.length - 1);
            statusDisplay.textContent = '就绪';
        }

        function resetSpeakBtn(btn) {
            btn.classList.remove('speaking');
            btn.textContent = '🔊';
            btn.disabled = false;
        }

        function setSpeakBtnActive(btn) {
            btn.classList.add('speaking');
            btn.textContent = '⏹';
            btn.disabled = false;
        }

        // 语音
        function stopAllSpeech() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isSpeaking = false;
            if (currentUtterance) currentUtterance = null;
            resetSpeakBtn(enSpeak);
            resetSpeakBtn(zhSpeak);
        }

        function speakText(text, lang, onStart, onEnd) {
            return new Promise((resolve) => {
                if (!window.speechSynthesis) { resolve(); return; }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.95;
                utterance.pitch = 1.0;
                utterance.volume = 1;
                const voices = window.speechSynthesis.getVoices();
                let preferred = null;
                if (lang.startsWith('zh')) {
                    preferred = voices.find(v => v.lang.startsWith('zh') && (v.name.includes('Tingting') || v.name
                        .includes('Microsoft')));
                } else {
                    preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name
                        .includes('Samantha') || v.name.includes('David')));
                }
                if (preferred) utterance.voice = preferred;

                currentUtterance = utterance;
                isSpeaking = true;
                if (onStart) onStart();
                utterance.onend = () => {
                    isSpeaking = false;
                    currentUtterance = null;
                    if (onEnd) onEnd();
                    resolve();
                };
                utterance.onerror = () => {
                    isSpeaking = false;
                    currentUtterance = null;
                    if (onEnd) onEnd();
                    resolve();
                };
                window.speechSynthesis.speak(utterance);
            });
        }

        async function speakEn() {
            if (isSpeaking) { stopAllSpeech(); return; }
            const data = SENTENCES[currentIndex];
            setSpeakBtnActive(enSpeak);
            await speakText(data.en, 'en-US', null, () => { resetSpeakBtn(enSpeak); });
        }

        async function speakZh() {
            if (isSpeaking) { stopAllSpeech(); return; }
            const data = SENTENCES[currentIndex];
            setSpeakBtnActive(zhSpeak);
            await speakText(data.zh, 'zh-CN', null, () => { resetSpeakBtn(zhSpeak); });
        }

        function goPrev() {
            if (isSpeaking) stopAllSpeech();
            const filtered = getFilteredIndices();
            let curIdx = filtered.indexOf(currentIndex);
            if (curIdx === -1) curIdx = 0;
            let newIdx = curIdx - 1;
            if (loopMode === 1) {
                if (newIdx < 0) newIdx = filtered.length - 1;
            } else if (loopMode === 2) {
                newIdx = curIdx;
            } else {
                if (newIdx < 0) newIdx = 0;
            }
            if (newIdx !== curIdx) {
                currentIndex = filtered[newIdx];
                render(currentIndex);
            }
        }

        function goNext() {
            if (isSpeaking) stopAllSpeech();
            const filtered = getFilteredIndices();
            let curIdx = filtered.indexOf(currentIndex);
            if (curIdx === -1) curIdx = 0;
            let newIdx = curIdx + 1;
            if (loopMode === 1) {
                if (newIdx >= filtered.length) newIdx = 0;
            } else if (loopMode === 2) {
                newIdx = curIdx;
            } else {
                if (newIdx >= filtered.length) newIdx = filtered.length - 1;
            }
            if (newIdx !== curIdx) {
                currentIndex = filtered[newIdx];
                render(currentIndex);
            }
        }

        function replayCurrent() {
            if (isSpeaking) stopAllSpeech();
            setTimeout(() => speakEn(), 100);
        }

        function toggleLoop() {
            loopMode = (loopMode + 1) % 3;
            loopBtn.textContent = LOOP_LABELS[loopMode];
            loopBadge.textContent = LOOP_BADGES[loopMode];
            loopBtn.className = 'ctrl-btn loop';
            if (loopMode === 1) loopBtn.classList.add('active');
            else if (loopMode === 2) loopBtn.classList.add('active-single');
            render(currentIndex);
        }

        function initSpeech() {
            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }
        }

        function initApp() {
            statusDisplay.textContent = '生成句子中...';
            setTimeout(() => {
                try {
                    SENTENCES = generateAllSentences();
                    total = SENTENCES.length;
                    progressBadge.textContent = `1 / ${total}`;
                    initCategories();
                    currentCategory = -1;
                    currentIndex = 0;
                    render(0);
                    updateLoopUI();
                    statusDisplay.textContent = `✅ 共 ${total} 句`;
                    console.log(`✅ 已生成 ${total} 个句子`);
                } catch (e) {
                    console.error(e);
                    statusDisplay.textContent = '生成失败，请刷新重试';
                }
            }, 100);
        }

        function updateLoopUI() {
            loopBtn.textContent = LOOP_LABELS[loopMode];
            loopBadge.textContent = LOOP_BADGES[loopMode];
            loopBtn.className = 'ctrl-btn loop';
            if (loopMode === 1) loopBtn.classList.add('active');
            else if (loopMode === 2) loopBtn.classList.add('active-single');
        }

        // 绑定事件
        enSpeak.addEventListener('click', speakEn);
        zhSpeak.addEventListener('click', speakZh);
        prevBtn.addEventListener('click', goPrev);
        replayBtn.addEventListener('click', replayCurrent);
        nextBtn.addEventListener('click', goNext);
        loopBtn.addEventListener('click', toggleLoop);

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') { e.preventDefault();
                goPrev(); }
            if (e.key === 'ArrowRight') { e.preventDefault();
                goNext(); }
            if (e.key === 'r' || e.key === 'R') { replayCurrent(); }
            if (e.key === 'e' || e.key === 'E') { speakEn(); }
            if (e.key === 'c' || e.key === 'C') { speakZh(); }
        });

        window.addEventListener('beforeunload', () => { stopAllSpeech(); });

        initSpeech();
        initApp();
    </script>
</body>
</html>
