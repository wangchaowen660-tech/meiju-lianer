<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>每句练耳</title>

<style>

body {
    margin: 0;
    padding: 25px 15px;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.card {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px 20px;
    border-radius: 20px;
    text-align: center;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
    font-size: 18px;
}

.scene {
    color: #777;
    margin-bottom: 10px;
}

.progress {
    color: #999;
    margin-bottom: 20px;
}

.sentence {
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
    line-height: 1.4;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
}

.play {
    background: #222;
    color: white;
}

.repeat {
    background: #dddddd;
}

.next {
    background: #eeeeee;
}

.status {
    min-height: 25px;
    margin-top: 15px;
    color: #777;
    font-size: 15px;
}

</style>
</head>

<body>

<div class="card">

<h1>🎧 每句练耳</h1>

<div class="subtitle">
每一句都是干货
</div>

<div id="scene" class="scene">
日常
</div>

<div id="progress" class="progress">
第 1 / 100 句
</div>

<div id="sentence" class="sentence">
Good morning.
</div>

<button class="play" onclick="playSentence()">
▶ 播放
</button>

<button class="repeat" onclick="playSentence()">
🔁 再听一遍
</button>

<button class="next" onclick="nextSentence()">
➡️ 下一句
</button>

<div id="status" class="status">
准备好了
</div>

</div>

<script>

const lessons = [

["日常","Good morning."],
["日常","How are you?"],
["日常","How is your day?"],
["日常","What are you doing?"],
["日常","Where are you going?"],
["日常","Where do you live?"],
["日常","Where are you from?"],
["日常","What do you do?"],
["日常","Do you speak English?"],
["日常","Could you speak slowly?"],

["日常","Could you say that again?"],
["日常","I don't understand."],
["日常","What does that mean?"],
["日常","Can you help me?"],
["日常","Please wait a moment."],
["日常","Give me a minute, please."],
["日常","Let me check."],
["日常","I'm not sure."],
["日常","I don't know."],
["日常","That's fine."],

["日常","Thank you very much."],
["日常","You're welcome."],
["日常","Have a nice day."],
["日常","See you tomorrow."],
["日常","See you later."],
["日常","Good night."],
["日常","Take care."],
["日常","No problem."],
["日常","That's okay."],
["日常","Of course."],

["餐厅","A table for two, please."],
["餐厅","May I see the menu?"],
["餐厅","What do you recommend?"],
["餐厅","Are you ready to order?"],
["餐厅","I'd like some chicken."],
["餐厅","I'd like some rice."],
["餐厅","Can I have some water?"],
["餐厅","Is this spicy?"],
["餐厅","Can you make it less spicy?"],
["餐厅","What comes with this?"],

["餐厅","Can I get another plate?"],
["餐厅","Could we have the bill, please?"],
["餐厅","Can I pay by card?"],
["餐厅","Is service included?"],
["餐厅","Thank you for your help."],

["购物","How much is this?"],
["购物","Do you have a larger size?"],
["购物","Do you have a smaller size?"],
["购物","Can I try this on?"],
["购物","Do you have another color?"],
["购物","Where can I pay?"],
["购物","Can I pay by card?"],
["购物","Can I have a bag?"],
["购物","Do you have anything cheaper?"],
["购物","I'll take this one."],

["酒店","Do you have a reservation?"],
["酒店","May I see your passport?"],
["酒店","What is your name?"],
["酒店","How many nights are you staying?"],
["酒店","What time is check-in?"],
["酒店","What time is check-out?"],
["酒店","Where is my room?"],
["酒店","Do you have Wi-Fi?"],
["酒店","What is the Wi-Fi password?"],
["酒店","Could I have another towel?"],

["交通","How much is the fare?"],
["交通","How long will it take?"],
["交通","Please take me to this address."],
["交通","Can you stop here?"],
["交通","Where is the bus stop?"],
["交通","Which bus should I take?"],
["交通","What time does the bus leave?"],
["交通","Is this the right train?"],
["交通","Where can I buy a ticket?"],
["交通","Where is the taxi stand?"],

["机场","May I see your passport?"],
["机场","Where are you going?"],
["机场","Do you have any bags?"],
["机场","How many bags do you have?"],
["机场","Do you want a window seat?"],
["机场","Do you need any help?"],
["机场","Here is your boarding pass."],
["机场","What is your flight number?"],
["机场","What time is your flight?"],

["厨房","Are the vegetables ready?"],
["厨房","Can you clean the fish?"],
["厨房","Is the chicken ready?"],
["厨房","Please wash the vegetables."],
["厨房","Cut the onions, please."],
["厨房","The soup is ready."],
["厨房","Taste the soup, please."],
["厨房","Is it too salty?"],
["厨房","Is it spicy enough?"],
["厨房","We need more rice."],

["厨房","We need more vegetables."],
["厨房","Lunch is ready."],
["厨房","Dinner starts at six."],
["厨房","Please clean the kitchen."],
["厨房","Good job."],

["实用","Please write it down."],
["实用","I need some help."],
["实用","One more time, please."],
["实用","Can you show me?"],
["实用","Please speak more slowly."]
];

let current = 0;

let voices = [];

let speaking = false;


/* 获取英语声音 */

function loadVoices() {

    voices = window.speechSynthesis.getVoices();

}


/* 苹果手机有时需要等待声音列表 */

loadVoices();

if ("onvoiceschanged" in speechSynthesis) {

    speechSynthesis.onvoiceschanged = function() {

        loadVoices();

    };

}


/* 找英语声音 */

function getEnglishVoice() {

    loadVoices();

    let voice = voices.find(function(v) {

        return v.lang === "en-US";

    });

    if (!voice) {

        voice = voices.find(function(v) {

            return v.lang &&
                   v.lang.toLowerCase().startsWith("en");

        });

    }

    return voice || null;

}


/* 显示当前句子 */

function showSentence() {

    document.getElementById("scene").innerText =
        lessons[current][0];

    document.getElementById("sentence").innerText =
        lessons[current][1];

    document.getElementById("progress").innerText =
        "第 " + (current + 1) +
        " / " + lessons.length + " 句";

    document.getElementById("status").innerText =
        "准备好了";

}


/* 播放 */

function playSentence() {

    if (speaking) {

        window.speechSynthesis.cancel();

        speaking = false;

    }

    document.getElementById("status").innerText =
        "🎧 正在播放……";


    /* 给播放器一点释放时间 */

    setTimeout(function() {

        const text = lessons[current][1];

        const voice =
            new SpeechSynthesisUtterance(text);


        const englishVoice =
            getEnglishVoice();


        if (englishVoice) {

            voice.voice = englishVoice;

        }


        voice.lang = "en-US";

        voice.rate = 0.72;

        voice.pitch = 1;

        voice.volume = 1;


        voice.onstart = function() {

            speaking = true;

            document.getElementById("status").innerText =
                "🎧 正在听……";

        };


        voice.onend = function() {

            speaking = false;

            document.getElementById("status").innerText =
                "✅ 播放结束";

        };


        voice.onerror = function() {

            speaking = false;

            document.getElementById("status").innerText =
                "声音播放出现问题，请再试一次";

        };


        window.speechSynthesis.speak(voice);


    }, 250);

}


/* 下一句 */

function nextSentence() {

    window.speechSynthesis.cancel();

    speaking = false;

    current++;


    if (current >= lessons.length) {

        current = 0;

    }


    showSentence();


    document.getElementById("status").innerText =
        "下一句准备好了";

}


/* 初始显示 */

showSentence();

</script>

</body>

</html>
