<style>
/* ===== 与之前相同的样式，仅增补聊天相关 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:20px 14px 40px;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1e293b;min-height:100vh;}
.container{max-width:560px;width:100%;margin:0 auto;}
.header{text-align:center;padding:6px 0 20px;}

.search-wrapper{display:flex;align-items:center;gap:8px;margin-bottom:12px;}

<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header"><h1>🎧 Listen & Speak</h1><p>Learn English · AI 对话助手</p></div>

<!-- API 设置区域 -->
<div id="apiSettings">
  <input id="apiKeyInput" type="password" placeholder="API Key (DeepSeek/OpenAI)" style="flex:2;">

  <select id="sceneSelect"><option value="">📂 全部场景</option></select>
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="Search English or Chinese" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>
<div class="card">
<div id="scene" class="scene">Basic Needs</div>
<div id="progress" class="progress">Chunk 1 / 600+</div>
<div class="chunk-label">Core Chunk</div>
<div id="chunk" class="chunk">I want to...</div>

    <select id="levelSelect"><option value="20">Unlock 20</option><option value="50">Unlock 50</option><option value="100">Unlock 100</option></select>

<script>
// ========================================================================
// 0. API 配置管理
// ========================================================================
let apiKey = localStorage.getItem('ai_api_key') || '';
let apiBase = localStorage.getItem('ai_api_base') || 'https://api.deepseek.com/v1';
let chatHistory = []; // 对话上下文
const MAX_HISTORY = 10;

function loadApiConfig() {
    document.getElementById('apiKeyInput').value = apiKey;
    document.getElementById('apiBaseInput').value = apiBase;
    updateApiStatus();
}
function updateApiStatus() {
    const el = document.getElementById('apiStatus');
    if (apiKey) {
        el.textContent = '✅ 已配置';
        el.style.color = '#22c55e';
    } else {
        el.textContent = '⚠️ 请设置 API Key';
        el.style.color = '#ef4444';
    }
}
function saveApiConfig() {
    const key = document.getElementById('apiKeyInput').value.trim();
    const base = document.getElementById('apiBaseInput').value.trim();
    if (key) {
        apiKey = key;
        localStorage.setItem('ai_api_key', key);
    }
    if (base) {
        apiBase = base;
        localStorage.setItem('ai_api_base', base);
    }
    updateApiStatus();
    showToast('✅ API 设置已保存');
}

// ========================================================================
// 1. 完整 coreChunks（112 个模板，与之前完全一致，因篇幅此处仅保留结构）
// 为节省字符，实际使用时应复制完整的 coreChunks。此处提供简写占位。
// 注意：您必须将之前的完整 coreChunks 粘贴到这里，否则短句数量不足。
// 为演示，我们使用一个最小集，但您应当替换。
// ========================================================================
// 为了本答案的可执行性，这里只放几个示例，实际请复制您之前的完整数据。
const coreChunks = [
["基础需求","我想……","I want to...","I want to eat.","我想吃东西。",["eat|吃","go|去","sleep|睡觉"]],
["基础需求","我需要……","I need...","I need some water.","我需要一些水。",["water|水","help|帮助","money|钱"]],
// ... 请务必替换为您的完整 112 个模板，否则短句量不够。
];
// ⚠️ 警告：上面 coreChunks 仅为示例，您必须替换为您的完整数据！
// ========================================================================

// ========================================================================
// 2. 文本清洗 & 展开模板（与之前相同）
// ========================================================================
function cleanSpeechText(text) {
    if (!text) return '';
    let cleaned = text.replace(/\.{3,}/g, '').replace(/…/g, '').replace(/\s+/g, ' ').trim();
    return cleaned || text;
}
function expandTemplates(templates) {
    const result = [];
    templates.forEach(tpl => {
        const [scene, chunk, pattern, en, cn, replacements] = tpl;
        result.push({ scene, chunk, pattern, en: cleanSpeechText(en), cn, replace: replacements, isPremium: false });
        if (replacements && replacements.length) {
            replacements.forEach(r => {
                const parts = r.split('|');
                if (parts.length < 2) return;
                const enWord = parts[0].trim();
                const cnWord = parts[1].trim();
                let newEn = en;
                let newCn = cn;
                if (pattern.includes('...')) {
                    newEn = pattern.replace(/\.{3}/g, enWord);
                } else {
                    const words = en.split(' ');
                    if (words.length > 0) { words[words.length - 1] = enWord; newEn = words.join(' '); }
                    else { newEn = enWord; }
                }
                if (cn.includes('……')) { newCn = cn.replace(/……/g, cnWord); }
                else {
                    const cnWords = cn.split(/[，,、。.]/);
                    if (cnWords.length > 0) {
                        const last = cnWords[cnWords.length - 1];
                        if (last.length > 0) newCn = cn.replace(last, cnWord);
                        else newCn = cn + cnWord;
                    } else newCn = cnWord;
                }
                newEn = cleanSpeechText(newEn);
                if (!newEn) newEn = enWord;
                result.push({
                    scene,
                    chunk: chunk + ' (' + enWord + ')',
                    pattern: newEn,
                    en: newEn,
                    cn: newCn,
                    replace: replacements,
                    isPremium: false
                });
            });
        }
    });
    return result;
}
let lessons = expandTemplates(coreChunks);
console.log('✅ 总短句数:', lessons.length);

// ========================================================================
// 3. 核心播放功能（与之前相同，此处只保留关键函数，略去重复）
// ========================================================================
let currentIndex = 0, isSpeaking = false, isPaused = false, currentUtterance = null, currentAudio = null;
let isRepeating = false, repeatCount = 0, repeatTimer = null, hdMode = false;
let playQueue = [], isProcessingQueue = false, retryCount = 0;
const MAX_RETRY = 2, REPEAT_TIMES = 5, TIMEOUT_SEC = 8;
const dom = {
    scene: document.getElementById("scene"),
    progress: document.getElementById("progress"),
    chunk: document.getElementById("chunk"),
    english: document.getElementById("english"),
    chinese: document.getElementById("chinese"),
    replaceList: document.getElementById("replaceList"),
    status: document.getElementById("status"),
    playPauseBtn: document.getElementById("playPauseBtn"),
    repeatBtn: document.getElementById("repeatBtn"),
    searchInput: document.getElementById("searchInput"),
    results: document.getElementById("results"),
    toast: document.getElementById("toast"),
    hdToggle: document.getElementById("hdToggle"),
    micBtn: document.getElementById("micBtn"),
    chatBox: document.getElementById("chatBox"),
    chatInput: document.getElementById("chatInput"),
    aiToggle: document.getElementById("aiToggle")
};
let toastTimer;
function showToast(t) { dom.toast.textContent = t; dom.toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => dom.toast.classList.remove("show"), 1800); }
function getAvailableLessons() { return lessons; }
function getCurrentItem() { const a = getAvailableLessons(); if (!a.length) return null; if (currentIndex >= a.length) currentIndex = 0; const item = a[currentIndex]; if (!item || !item.en) { currentIndex = 0; return a[0] || null; } return item; }
function stopSpeech() { if (currentUtterance) { try { window.speechSynthesis.cancel(); } catch(e) {} currentUtterance = null; } if (currentAudio) { try { currentAudio.pause(); currentAudio.src = ''; } catch(e) {} currentAudio = null; } isSpeaking = false; isPaused = false; dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused"); playQueue = []; isProcessingQueue = false; retryCount = 0; }
function isSpeechSupported() { return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); }
function speakNative(text, cb) { /* 与之前完全一样，略 */ cb(true); } // 占位
function speakGoogle(text, cb) { /* 略 */ cb(true); }
function speakText(text, cb) { const clean = cleanSpeechText(text); if (!clean) { if(cb)cb(false); return; } playQueue.push({text:clean, cb, retries:0}); processQueue(); }
function processQueue() { /* 略 */ }
function playCurrent() { /* 略 */ }
function togglePlayPause() { /* 略 */ }
function prevTrack() { /* 略 */ }
function nextTrack() { /* 略 */ }
function randomSentence() { /* 略 */ }
function toggleRepeat() { /* 略 */ }
function doRepeat() { /* 略 */ }
function toggleHD() { /* 略 */ }
function playReplaceWord(word) { /* 略 */ }
function showSentence() { /* 略 */ }
function searchSentence() { /* 略 */ }
function populateSceneSelect() { /* 略 */ }
// 中文解锁、Admin、离线等函数（与之前相同，略）
// 为避免代码过长，以上函数请自行补充完整，或从之前版本复制。

// ========================================================================
// 4. 核心升级：AI 对话机器人
// ========================================================================
let chatMode = false;
let isListening = false;
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = 'zh-CN';
recognition.continuous = false;
recognition.interimResults = true;

// 保存对话历史（含系统提示）
function buildMessages(userInput) {
    const systemMsg = { role: 'system', content: 'You are a helpful English teacher and conversation partner. Speak naturally. If the user speaks Chinese, reply in Chinese; if English, reply in English. Keep replies concise.' };
    const history = chatHistory.slice(-MAX_HISTORY);
    const messages = [systemMsg, ...history];
    if (userInput) messages.push({ role: 'user', content: userInput });
    return messages;
}

// 调用 AI API
async function callAI(userInput) {
    if (!apiKey) {
        showToast('⚠️ 请先设置 API Key');
        return null;
    }
    const messages = buildMessages(userInput);
    const url = apiBase + '/chat/completions';
    const body = {
        model: 'deepseek-chat', // 可更换为 gpt-3.5-turbo 等
        messages: messages,
        temperature: 0.7,
        max_tokens: 500,
        stream: false
    };
    try {
        const resp = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify(body)
        });
        if (!resp.ok) {
            const err = await resp.text();
            throw new Error('API 错误: ' + resp.status + ' ' + err);
        }
        const data = await resp.json();
        const reply = data.choices[0].message.content;
        // 保存上下文
        chatHistory.push({ role: 'user', content: userInput });
        chatHistory.push({ role: 'assistant', content: reply });
        if (chatHistory.length > MAX_HISTORY * 2) {
            chatHistory = chatHistory.slice(-MAX_HISTORY * 2);
        }
        return reply;
    } catch (e) {
        showToast('❌ AI 请求失败: ' + e.message);
        return null;
    }
}

// 聊天界面
function appendMessage(role, content) {
    const div = document.createElement('div');
    div.className = `chat-msg ${role}`;
    div.textContent = content;
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString();
    div.appendChild(time);
    dom.chatBox.appendChild(div);
    dom.chatBox.scrollTop = dom.chatBox.scrollHeight;
}

async function processUserInput(text) {
    if (!text.trim()) return;
    appendMessage('user', text);
    dom.status.textContent = '🤖 AI 思考中...';
    dom.status.className = 'status speaking';
    const reply = await callAI(text);
    if (reply) {
        appendMessage('ai', reply);
        dom.status.textContent = '✅ 已回复';
        dom.status.className = 'status done';
        // 可选：语音朗读回复（英文或中文）
        if (window.speechSynthesis) {
            const utter = new SpeechSynthesisUtterance(reply);
            utter.lang = /[\u4e00-\u9fa5]/.test(reply) ? 'zh-CN' : 'en-US';
            utter.rate = 0.8;
            window.speechSynthesis.speak(utter);
        }
    } else {
        dom.status.textContent = '⚠️ 回复失败';
        dom.status.className = 'status error';
    }
}

function toggleChat() {
    chatMode = !chatMode;
    const btn = dom.aiToggle;
    if (chatMode) {
        dom.chatBox.style.display = 'block';
        document.getElementById('chatInputArea').style.display = 'flex';
        btn.textContent = '❌ Close Chat';
        btn.style.background = '#ef4444';
        if (dom.chatBox.children.length === 0) {
            appendMessage('ai', "👋 你好！我是你的 AI 英语学习助手。你可以用中文或英文和我聊天，我会帮你练习。");
        }
    } else {
        dom.chatBox.style.display = 'none';
        document.getElementById('chatInputArea').style.display = 'none';
        btn.textContent = '💬 AI Chat';
        btn.style.background = '#10b981';
        if (isListening) { try { recognition.stop(); } catch(e) {} dom.micBtn.textContent = '🎤 Voice'; dom.micBtn.classList.remove('listening'); isListening = false; }
    }
}

function sendTextMessage() {
    const text = dom.chatInput.value.trim();
    if (!text) return;
    dom.chatInput.value = '';
    processUserInput(text);
}

dom.chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); sendTextMessage(); }
});

// 语音识别输入
function toggleMic() {
    if (isListening) {
        recognition.stop();
        dom.micBtn.textContent = '🎤 Voice';
        dom.micBtn.classList.remove('listening');
        isListening = false;
        return;
    }
    if (!chatMode) toggleChat();
    try {
        recognition.start();
        dom.micBtn.textContent = '⏺ Recording...';
        dom.micBtn.classList.add('listening');
        dom.status.textContent = '🎤 请说话...';
        dom.status.className = 'status speaking';
        isListening = true;
    } catch(e) {
        showToast('❌ 麦克风访问被拒绝。');
        dom.micBtn.textContent = '🎤 Voice';
        dom.micBtn.classList.remove('listening');
        isListening = false;
    }
}
recognition.onresult = function(event) {
    let finalText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
            finalText = event.results[i][0].transcript;
            break;
        }
    }
    if (finalText) {
        dom.status.textContent = '✅ 识别: ' + finalText;
        dom.status.className = 'status done';
        processUserInput(finalText);
        recognition.stop();
        dom.micBtn.textContent = '🎤 Voice';
        dom.micBtn.classList.remove('listening');
        isListening = false;
    }
};
recognition.onerror = function(event) {
    dom.status.textContent = '⚠️ 识别错误: ' + event.error;
    dom.status.className = 'status error';
    dom.micBtn.textContent = '🎤 Voice';
    dom.micBtn.classList.remove('listening');
    isListening = false;
    showToast('语音识别失败，请尝试输入。');
};
recognition.onend = function() {
    if (isListening) {
        dom.micBtn.textContent = '🎤 Voice';
        dom.micBtn.classList.remove('listening');
        isListening = false;
    }
};
