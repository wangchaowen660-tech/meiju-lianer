<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:16px 10px 32px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1e293b;min-height:100vh;}
.container{max-width:540px;width:100%;margin:0 auto;}
.header{text-align:center;padding:4px 0 12px;}
.header h1{margin:0;font-size:26px;font-weight:700;}
.header p{margin:4px 0 0;color:#94a3b8;font-size:14px;background:#f1f5f9;padding:2px 12px;border-radius:30px;display:inline-block;}
.pattern-selector{background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.pattern-selector label{font-weight:600;font-size:14px;color:#1e293b;white-space:nowrap;}
.pattern-selector select{flex:1;min-width:120px;padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff;color:#1e293b;outline:none;cursor:pointer;}
.pattern-selector .badge{background:#e94560;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.search-wrapper{display:flex;gap:6px;margin-bottom:10px;}
.search-wrapper .input-group{flex:1;display:flex;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:0 6px;height:40px;transition:border-color .2s;}
.search-wrapper .input-group:focus-within{border-color:#1e293b;}
.search-wrapper .input-group input{flex:1;border:0;outline:none;font-size:14px;padding:0 6px;background:transparent;height:100%;}
.search-wrapper .input-group button{background:transparent;border:0;font-size:18px;cursor:pointer;padding:0 8px;color:#94a3b8;display:flex;align-items:center;height:100%;}
.search-wrapper .input-group button:hover{color:#1e293b;}
.results{margin-bottom:12px;}
.result{background:#fff;padding:10px 14px;margin-bottom:6px;border-radius:12px;cursor:pointer;border:1px solid #e2e8f0;}
.result-en{font-weight:600;font-size:16px;}
.result-cn{margin-top:3px;color:#64748b;font-size:14px;}
.no-result{padding:16px;text-align:center;color:#94a3b8;background:#fff;border-radius:12px;}
.card{background:#fff;border-radius:20px;padding:20px 16px 16px;box-shadow:0 2px 8px rgba(0,0,0,.04);text-align:center;position:relative;}
.avatar-wrap{position:absolute;top:10px;right:10px;width:80px;height:80px;border-radius:50%;border:2px solid #e2e8f0;overflow:hidden;background:#e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
#avatarCanvas{width:100%;height:100%;display:block;}
.scene{color:#94a3b8;font-size:13px;font-weight:500;padding-right:80px;text-align:left;}
.progress{color:#b9c2d0;font-size:12px;margin-top:2px;text-align:left;}
.pattern-display{background:#f1f5f9;padding:6px 14px;border-radius:10px;margin:10px 0 4px;display:inline-block;}
.pattern-display .label{font-size:11px;color:#94a3b8;}
.pattern-display .text{font-size:20px;font-weight:700;color:#0f172a;}
.flow-arrow{color:#94a3b8;font-size:18px;margin:4px 0;}
.chunk-area{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;max-height:260px;overflow-y:auto;padding:4px;}
.chunk-item{cursor:pointer;padding:4px 12px;background:#eef2f6;border-radius:16px;font-size:14px;color:#1e293b;border:1px solid transparent;transition:all 0.15s;user-select:none;white-space:nowrap;}
.chunk-item:hover{background:#dce2ea;transform:scale(1.03);}
.chunk-item.active{background:#e94560;color:#fff;border-color:#e94560;}
.english{min-height:44px;display:flex;align-items:center;justify-content:center;padding:8px 6px;font-size:24px;font-weight:700;line-height:1.3;color:#0f172a;background:#f8fafc;border-radius:10px;margin:6px 0;}
.chinese{min-height:32px;font-size:17px;color:#475569;padding:4px 10px;background:#f8fafc;border-radius:10px;}
.sentence-hint{font-size:12px;color:#94a3b8;margin-top:2px;}
.sentence-hint .highlight{color:#e94560;font-weight:600;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0 6px;}
.ctrl-btn{background:#f1f4f9;border:0;padding:0;cursor:pointer;font-size:28px;color:#1e293b;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;touch-action:manipulation;transition:background 0.15s;}
.ctrl-btn:active{transform:scale(.90);}
.ctrl-btn.play-btn{width:64px;height:64px;font-size:34px;background:#1e293b;color:#fff;}
.ctrl-btn.cn-btn{background:#f59e0b;color:#fff;width:48px;height:48px;font-size:24px;}
.extra-buttons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center;}
.extra-buttons button{flex:0 1 auto;padding:6px 12px;border:0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;background:#f1f4f9;color:#1e293b;transition:background 0.15s;}
.extra-buttons button.active{background:#ef4444;color:#fff;}
.extra-buttons .ai-toggle{background:#10b981;color:#fff;}
.extra-buttons .ai-toggle:hover{background:#059669;}
.extra-buttons .mic-toggle{background:#f59e0b;color:#fff;}
.extra-buttons .mic-toggle:hover{background:#d97706;}
.extra-buttons .mic-toggle.listening{background:#ef4444;}
.extra-buttons .mic-toggle:disabled{opacity:0.5;cursor:not-allowed;}
.extra-buttons .reset-audio-btn{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn:hover{background:#dc2626;}
.status{min-height:22px;margin-top:6px;color:#94a3b8;font-size:13px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}
.status.paused{color:#f59e0b;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:8px 20px;border-radius:40px;opacity:0;pointer-events:none;transition:.3s;z-index:999;font-size:14px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.api-settings{background:#f1f5f9;border-radius:12px;padding:6px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.api-settings input{flex:2;min-width:80px;padding:4px 8px;border:1px solid #d1d9e6;border-radius:8px;font-size:13px;background:#fff;}
.api-settings input#apiBaseInput{flex:1.5;}

.api-status{font-size:12px;color:#64748b;margin-left:4px;}
.chat-box{background:#f8fafc;border-radius:14px;padding:12px;margin-top:10px;max-height:300px;overflow-y:auto;text-align:left;border:1px solid #e2e8f0;display:none;}
.chat-msg{margin:6px 0;padding:6px 12px;border-radius:12px;max-width:90%;word-break:break-word;}
.chat-msg.user{background:#dbeafe;margin-left:auto;}
.chat-msg.ai{background:#e5e7eb;margin-right:auto;}
.chat-msg .time{font-size:10px;color:#94a3b8;margin-top:3px;}
.chat-input-area{display:flex;gap:6px;margin-top:6px;display:none;}
.chat-input-area input{flex:1;padding:8px;border:1px solid #d1d9e6;border-radius:10px;font-size:14px;outline:none;}
.chat-input-area button{padding:6px 14px;background:#10b981;color:#fff;border:0;border-radius:10px;font-weight:600;cursor:pointer;}
.admin-panel{display:none;margin-top:16px;padding:12px;background:#f1f5f9;border-radius:14px;text-align:left;}
.admin-panel input{width:100%;padding:8px;border:1px solid #d1d9e6;border-radius:8px;margin-bottom:8px;}

</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header"><h1>🧩 Listen & Speak</h1><p>母句 → 词块 → 整句 · 简洁版</p></div>

<!-- API 设置 -->
<div class="api-settings">
  <input id="apiKeyInput" type="password" placeholder="API Key (DeepSeek/OpenAI)" style="flex:2;">
  <input id="apiBaseInput" type="url" placeholder="API Base URL" value="https://api.deepseek.com/v1" style="flex:1.5;">
  <button class="save-btn" onclick="saveApiConfig()">💾 保存</button>
  <span class="api-status" id="apiStatus">未设置</span>
</div>

<!-- 母句选择器 -->
<div class="pattern-selector">
  <label>📌 母句</label>
  <select id="patternSelect"></select>
  <span class="badge" id="chunkCount">0 词块</span>
</div>

<!-- 搜索 -->
<div class="search-wrapper">
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="Search English or Chinese" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<!-- 主卡片 -->
<div class="card">
  <div class="avatar-wrap"><canvas id="avatarCanvas" width="220" height="220"></canvas></div>

  <div class="scene" id="scene">日常表达</div>
  <div class="progress" id="progress">总句数: 2500+</div>

  <div class="pattern-display">
    <div class="label">母句</div>
    <div class="text" id="patternDisplay">I want to...</div>
  </div>

  <div class="flow-arrow">▼ 点击词块造句</div>

  <div class="chunk-area" id="chunkArea"></div>

  <div class="flow-arrow">▼ 生成整句</div>

  <div class="english"><span id="english">I want to eat.</span></div>
  <div class="chinese" id="chinese">我想吃饭。</div>
  <div class="sentence-hint" id="sentenceHint">💡 点击词块 → 造句连读</div>

  <div class="player-controls">
    <button class="ctrl-btn" onclick="prevChunk()">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
    <button class="ctrl-btn" onclick="nextChunk()">⏭</button>
  </div>

  <div class="extra-buttons">
    <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
    <button onclick="playPatternOnly()">🧩 母句</button>
    <button onclick="randomChunk()">🎲 随机</button>
    <button id="micBtn" class="mic-toggle" onclick="toggleMic()">🎤 Voice</button>
    <button id="aiToggle" class="ai-toggle" onclick="toggleChat()">💬 AI Chat</button>
    <button class="reset-audio-btn" onclick="resetAudio()">🔊 修复</button>
  </div>

  <div id="chatBox" class="chat-box"></div>
  <div id="chatInputArea" class="chat-input-area">
    <input id="chatInput" type="text" placeholder="输入消息，Enter 发送" autocomplete="off">
    <button onclick="sendTextMessage()">Send</button>
  </div>
  <div id="status" class="status">Ready</div>
</div>
<div style="text-align:center;margin-top:8px;font-size:12px;color:#b9c2d0;">点击词块 → 自动造句连读</div>
</div>

function buildAllLessons() {
  const result = [];
  patternList.forEach((p, idx) => {
    const end = Math.min(p.start + p.count, chunkPool.length);
    for (let i = p.start; i < end; i++) {
      const chunk = chunkPool[i];
      const fullEn = p.pattern.replace(/\.{3}/g, chunk.en);
      const fullCn = p.cnPrefix + chunk.cn;
      result.push({
        id: result.length + 1,
        scene: '日常表达',
        pattern: p.pattern,
        en: fullEn,
        cn: fullCn,
        chunkEn: chunk.en,
        chunkCn: chunk.cn,
        patternId: p.id,
        chunkIndex: i
      });
    }
  });
  return result;
}

function drawMouth(open) {
  ctx.putImageData(baseImageData, 0, 0);
  const h = mouthHBase + open * 28;
  const x = mouthX - 3;
  ctx.beginPath();
  ctx.ellipse(x, mouthY, mouthW, h, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(200,130,140,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,90,100,0.45)';
  ctx.lineWidth = 1.5;

  if (open > 0.6) {
    ctx.beginPath();
    ctx.ellipse(x, mouthY + 8, 10, 6, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(232,112,122,0.4)';
    ctx.fill();
  }
}
let mouthOpen = 0.1,
  isSpeakingState = false,
  mouthTimer = null;

function updateMouth(target) { mouthOpen += (target - mouthOpen) * 0.15;
  drawMouth(mouthOpen); }

function startSpeaking() {
  isSpeakingState = true;
  if (mouthTimer) clearInterval(mouthTimer);
  let phase = 0;
  mouthTimer = setInterval(() => { phase += 0.3;
    const target = (Math.sin(phase) * 0.5 + 0.5) * 0.8 + 0.2;
    updateMouth(target); }, 50);
}

function stopSpeakingMouth() {
  isSpeakingState = false;
  if (mouthTimer) { clearInterval(mouthTimer);
    mouthTimer = null; }
  let closeStep = 0;

  function closeMouth() {
    if (closeStep < 15) {
      mouthOpen *= 0.9;
      if (mouthOpen < 0.05) mouthOpen = 0.05;
      drawMouth(mouthOpen);
      closeStep++;
      setTimeout(closeMouth, 25);
    } else {
      mouthOpen = 0.05;
      drawMouth(0.05);
    }
  }
  closeMouth();
}

let currentPatternId = 0;
let currentChunkIndex = 0;
let isSpeaking = false,
  currentUtterance = null,
  playQueue = [],
  isProcessingQueue = false;
let isRepeating = false,
  repeatCount = 0,
  repeatTimer = null;
const REPEAT_TIMES = 5;
let playTimeout = null;
let isPlayingLock = false; // 播放锁

function stopSpeech() {
  if (playTimeout) { clearTimeout(playTimeout);
    playTimeout = null; }
  if (currentUtterance) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    currentUtterance = null;
  }
  isSpeaking = false;
  dom.playPauseBtn.textContent = "▶";
  dom.playPauseBtn.classList.remove("paused");
  playQueue = [];
  isProcessingQueue = false;
  isPlayingLock = false;
  stopSpeakingMouth();
}

function speakNative(text, cb) {
  if (!text || text.trim() === '') { cb(false, 'Empty'); return; }
  if (!window.speechSynthesis) { cb(false, 'No speechSynthesis'); return; }
  // 强制取消当前语音
  try { window.speechSynthesis.cancel(); } catch (e) {}
  // 清空队列
  playQueue = [];
  isProcessingQueue = false;

  let voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) {
    let waited = false;
    const onVoices = function() {
      voices = window.speechSynthesis.getVoices();
      if (voices && voices.length > 0 && !waited) {
        waited = true;
        doSpeak();
      }
    };
    window.speechSynthesis.onvoiceschanged = onVoices;
    setTimeout(() => {
      if (!waited) {
        waited = true;
        voices = window.speechSynthesis.getVoices();
        doSpeak();
      }
    }, 200);
    return;
  }
  doSpeak();

  function doSpeak() {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.7;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    const preferred = voices.find(v => /Google UK|David|Zira|Samantha|Alex|Veena/i.test(v.name)) ||
      voices.find(v => v.lang && v.lang.startsWith('en'));
    if (preferred) utterance.voice = preferred;

    let ended = false;
    const timeoutId = setTimeout(() => {
      if (!ended) {
        ended = true;
        try { window.speechSynthesis.cancel(); } catch (e) {}
        currentUtterance = null;
        isSpeaking = false;
        dom.playPauseBtn.textContent = "▶";
        dom.playPauseBtn.classList.remove("paused");
        isPlayingLock = false;
        cb(false, 'Timeout');
        stopSpeakingMouth();
      }
    }, 5000);

    utterance.onstart = function() {
      if (currentUtterance !== utterance) return;
      isSpeaking = true;
      isPlayingLock = true;
      dom.playPauseBtn.textContent = "⏸";
      dom.playPauseBtn.classList.add("paused");
      dom.status.textContent = "🎧 Speaking...";
      dom.status.className = "status speaking";
      startSpeaking();
    };

    utterance.onend = function() {
      if (ended) return;
      ended = true;
      clearTimeout(timeoutId);
      isSpeaking = false;
      currentUtterance = null;
      dom.playPauseBtn.textContent = "▶";
      dom.playPauseBtn.classList.remove("paused");
      dom.status.textContent = "✅ Done";
      dom.status.className = "status done";
      isPlayingLock = false;
      stopSpeakingMouth();
      cb(true);
    };

    utterance.onerror = function(e) {
      if (ended) return;
      ended = true;
      clearTimeout(timeoutId);
      isSpeaking = false;
      currentUtterance = null;
      dom.playPauseBtn.textContent = "▶";
      dom.playPauseBtn.classList.remove("paused");
      isPlayingLock = false;
      stopSpeakingMouth();
      if (e.error === 'canceled' || e.error === 'interrupted') {
        cb(false, 'Canceled');
      } else {
        cb(false, 'TTS error: ' + e.error);
      }
    };

    currentUtterance = utterance;
    try {
      window.speechSynthesis.speak(utterance);
    } catch (err) {
      clearTimeout(timeoutId);
      ended = true;
      isSpeaking = false;
      currentUtterance = null;
      isPlayingLock = false;
      cb(false, 'Exception: ' + err.message);
      stopSpeakingMouth();
    }
  }
}

function speakText(text, cb) {
  const clean = text.replace(/\.{3,}/g, '').replace(/…/g, '').replace(/\s+/g, ' ').trim();
  if (!clean) { if (cb) cb(false); return; }

  // 如果当前有语音播放，立即取消
  if (isPlayingLock || isSpeaking) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    isSpeaking = false;
    currentUtterance = null;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    playQueue = [];
    isProcessingQueue = false;
    isPlayingLock = false;
    stopSpeakingMouth();
  }

  // 延迟一点开始，确保取消完成
  setTimeout(() => {
    speakNative(clean, function(success) {
      if (cb) cb(success);
      if (!success) {
        // 失败则重试一次
        setTimeout(() => {
          speakNative(clean, function(s2) { if (cb) cb(s2); });
        }, 300);
      }
    });
  }, 50);
}

function getChunksForPattern(patternId) {
  const p = patternList[patternId];
  const end = Math.min(p.start + p.count, chunkPool.length);
  const chunks = [];
  for (let i = p.start; i < end; i++) {
    chunks.push({ index: i, ...chunkPool[i] });
  }
  return chunks;
}

function loadPattern(patternId) {
  currentPatternId = patternId;
  currentChunkIndex = 0;
  const p = patternList[patternId];
  const chunks = getChunksForPattern(patternId);

  dom.patternDisplay.textContent = p.pattern;
  dom.chunkCount.textContent = chunks.length + ' 词块';
  dom.scene.textContent = '日常表达 · ' + p.cnPrefix;

  dom.chunkArea.innerHTML = '';
  chunks.forEach((chunk, idx) => {
    const span = document.createElement('span');
    span.className = 'chunk-item';
    span.textContent = chunk.en;
    span.dataset.index = idx;
    span.dataset.en = chunk.en;
    span.dataset.cn = chunk.cn;
    span.onclick = function(e) {
      e.stopPropagation();
      playChunk(this);
    };
    dom.chunkArea.appendChild(span);
  });

  const first = dom.chunkArea.querySelector('.chunk-item');
  if (first) {
    setTimeout(() => playChunk(first), 50);
  }
  dom.progress.textContent = '总句数: ' + lessons.length + ' · 当前母句: ' + chunks.length + ' 词块';
}

let playDebounceTimer = null;

function playChunk(el) {
  if (playDebounceTimer) {
    clearTimeout(playDebounceTimer);
    playDebounceTimer = null;
  }
  // 立即取消当前语音
  if (isSpeaking || isPlayingLock) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    isSpeaking = false;
    currentUtterance = null;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    playQueue = [];
    isProcessingQueue = false;
    isPlayingLock = false;
    stopSpeakingMouth();
  }

  playDebounceTimer = setTimeout(() => {
    playDebounceTimer = null;
    dom.chunkArea.querySelectorAll('.chunk-item').forEach(item => item.classList.remove('active'));
    el.classList.add('active');

    const enWord = el.dataset.en;
    const cnWord = el.dataset.cn;
    const p = patternList[currentPatternId];
    const fullEn = p.pattern.replace(/\.{3}/g, enWord);
    const fullCn = p.cnPrefix + cnWord;

    dom.english.textContent = fullEn;
    dom.chinese.textContent = fullCn;
    dom.sentenceHint.innerHTML = '✅ 造句连读：<span class="highlight">' + enWord + '</span> (' + cnWord + ')';

    const items = dom.chunkArea.querySelectorAll('.chunk-item');
    items.forEach((item, idx) => {
      if (item === el) currentChunkIndex = idx;
    });

    dom.status.textContent = '🔊 整句朗读: ' + fullEn;
    dom.status.className = 'status speaking';

    // 直接播放
    speakText(fullEn, function(success) {
      if (!success) {
        dom.status.textContent = "⚠️ 播放失败，重试...";
        dom.status.className = "status error";
        setTimeout(() => {
          speakText(fullEn, function(s2) {
            if (!s2) dom.status.textContent = "⚠️ 播放失败";
          });
        }, 300);
      }
    });
  }, 100);
}

function playPatternOnly() {
  const p = patternList[currentPatternId];
  const text = p.pattern.replace(/\.{3}/g, '').trim();
  if (!text) return;
  if (isSpeaking || isPlayingLock) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    isSpeaking = false;
    currentUtterance = null;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    stopSpeakingMouth();
  }
  setTimeout(() => {
    dom.status.textContent = "🧩 母句: " + text;
    speakText(text);
  }, 100);
}

function randomChunk() {
  const items = dom.chunkArea.querySelectorAll('.chunk-item');
  if (items.length === 0) return;
  const randIdx = Math.floor(Math.random() * items.length);
  playChunk(items[randIdx]);
}

function prevChunk() {
  const items = dom.chunkArea.querySelectorAll('.chunk-item');
  if (items.length === 0) return;
  let activeIdx = 0;
  items.forEach((el, i) => { if (el.classList.contains('active')) activeIdx = i; });
  const newIdx = (activeIdx - 1 + items.length) % items.length;
  playChunk(items[newIdx]);
}

function nextChunk() {
  const items = dom.chunkArea.querySelectorAll('.chunk-item');
  if (items.length === 0) return;
  let activeIdx = 0;
  items.forEach((el, i) => { if (el.classList.contains('active')) activeIdx = i; });
  const newIdx = (activeIdx + 1) % items.length;
  playChunk(items[newIdx]);
}

function togglePlayPause() {
  if (isSpeaking || isPlayingLock) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    isSpeaking = false;
    currentUtterance = null;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    playQueue = [];
    isProcessingQueue = false;
    isPlayingLock = false;
    stopSpeakingMouth();
    dom.status.textContent = "⏸ Paused";
    dom.status.className = "status paused";
  } else {
    const text = dom.english.textContent;
    if (text && text !== 'I want to eat.') {
      dom.status.textContent = "🔊 重播...";
      dom.status.className = "status speaking";
      speakText(text);
    } else {
      const items = dom.chunkArea.querySelectorAll('.chunk-item');
      let active = dom.chunkArea.querySelector('.chunk-item.active');
      if (!active && items.length > 0) active = items[0];
      if (active) playChunk(active);
    }
  }
}

function toggleRepeat() {
  if (isRepeating) {
    isRepeating = false;
    clearTimeout(repeatTimer);
    if (isSpeaking || isPlayingLock) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
      isSpeaking = false;
      currentUtterance = null;
      dom.playPauseBtn.textContent = "▶";
      dom.playPauseBtn.classList.remove("paused");
      stopSpeakingMouth();
    }
    dom.repeatBtn.textContent = "🔁 Repeat";
    dom.repeatBtn.classList.remove("active");
    dom.status.textContent = "⏸ Repeat stopped";
    dom.status.className = "status paused";
    return;
  }
  isRepeating = true;
  repeatCount = 0;
  dom.repeatBtn.textContent = "⏹ Stop Repeat";
  dom.repeatBtn.classList.add("active");
  doRepeat();
}

function doRepeat() {
  if (!isRepeating) return;
  repeatCount++;
  dom.status.textContent = '🔁 Repeat ' + repeatCount + '/' + REPEAT_TIMES;
  dom.status.className = "status";
  const text = dom.english.textContent;
  if (!text || text === 'I want to eat.') { stopSpeech(); return; }
  if (isSpeaking || isPlayingLock) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    isSpeaking = false;
    currentUtterance = null;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    stopSpeakingMouth();
  }
  setTimeout(() => {
    speakText(text, function(success) {
      if (!isRepeating) return;
      if (!success) {
        isRepeating = false;
        dom.repeatBtn.textContent = "🔁 Repeat";
        dom.repeatBtn.classList.remove("active");
        dom.status.textContent = "⚠️ Repeat interrupted";
        dom.status.className = "status error";
        return;
      }
      if (repeatCount >= REPEAT_TIMES) {
        isRepeating = false;
        dom.repeatBtn.textContent = "🔁 Repeat";
        dom.repeatBtn.classList.remove("active");
        dom.status.textContent = "✅ Repeat done";
        dom.status.className = "status done";
        return;
      }
      repeatTimer = setTimeout(doRepeat, 400);
    });
  }, 200);
}

function playChinese() {
  const text = dom.chinese.textContent;
  if (!text) return;
  if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
    dom.status.textContent = "⚠️ 浏览器不支持 TTS";
    dom.status.className = "status error";
    return;
  }
  if (isSpeaking || isPlayingLock) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    isSpeaking = false;
    currentUtterance = null;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    stopSpeakingMouth();
  }
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.8;
  utterance.pitch = 1;
  utterance.volume = 1;
  try {
    window.speechSynthesis.speak(utterance);
    dom.status.textContent = "🔊 中文朗读...";
    dom.status.className = "status speaking";
    utterance.onend = function() {
      dom.status.textContent = "✅ 中文朗读完成";
      dom.status.className = "status done";
    };
    utterance.onerror = function() {
      dom.status.textContent = "⚠️ 中文朗读失败";
      dom.status.className = "status error";
    };
  } catch (e) {
    dom.status.textContent = "⚠️ 播放错误";
    dom.status.className = "status error";
  }
}

function resetAudio() {
  try {
    if (isSpeaking || isPlayingLock) {
      window.speechSynthesis.cancel();
      isSpeaking = false;
      currentUtterance = null;
      dom.playPauseBtn.textContent = "▶";
      dom.playPauseBtn.classList.remove("paused");
      stopSpeakingMouth();
    }
    window.speechSynthesis.getVoices();
    showToast('🔄 音频已重置');
    dom.status.textContent = "✅ 音频已重置";
    dom.status.className = "status done";
  } catch (e) {
    showToast('⚠️ 重置失败');
  }
}

// ========================================================================
// 6. 母句选择器、搜索、AI对话等（与原代码一致，略作精简）
// ========================================================================
function populatePatternSelect() {
  const select = dom.patternSelect;
  select.innerHTML = '';
  patternList.forEach((p, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = p.pattern.replace(/\.{3}/g, '...');
    select.appendChild(opt);
  });
  select.value = 0;
  select.addEventListener('change', function() {
    const id = parseInt(this.value);
    if (isSpeaking || isPlayingLock) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
      isSpeaking = false;
      currentUtterance = null;
      dom.playPauseBtn.textContent = "▶";
      dom.playPauseBtn.classList.remove("paused");
      stopSpeakingMouth();
    }
    loadPattern(id);
  });
  loadPattern(0);
}

function searchSentence() {
  const keyword = dom.searchInput.value.trim().toLowerCase();
  dom.results.innerHTML = "";
  if (!keyword) { showToast("输入关键词搜索"); return; }
  const matches = lessons.filter(item =>
    (item.en && item.en.toLowerCase().includes(keyword)) ||
    (item.cn && item.cn.includes(keyword))
  );
  if (matches.length === 0) {
    dom.results.innerHTML = '<div class="no-result">🔍 未找到匹配句子</div>';
    return;
  }
  matches.slice(0, 30).forEach(function(item) {
    const box = document.createElement("div");
    box.className = "result";
    box.innerHTML = '<div class="result-en">' + item.en + '</div><div class="result-cn">' + item.cn + '</div>';
    box.onclick = function() {
      const pid = item.patternId;
      const p = patternList[pid];
      const chunks = getChunksForPattern(pid);
      let targetIdx = 0;
      chunks.forEach((ch, idx) => {
        const full = p.pattern.replace(/\.{3}/g, ch.en);
        if (full === item.en) targetIdx = idx;
      });
      dom.patternSelect.value = pid;
      loadPattern(pid);
      setTimeout(() => {
        const items = dom.chunkArea.querySelectorAll('.chunk-item');
        if (items[targetIdx]) playChunk(items[targetIdx]);
      }, 200);
      dom.results.innerHTML = "";
      dom.searchInput.value = "";
      showToast("跳转到句子");
    };
    dom.results.appendChild(box);
  });
}

// 场景筛选（简化）
function populateSceneSelect() {
  const select = document.getElementById('sceneSelect');
  if (!select) return;
  select.innerHTML = '<option value="">📂 全部场景</option>';
  select.addEventListener('change', function() {
    if (this.value) {
      dom.searchInput.value = this.value;
      searchSentence();
    }
  });
}

// AI对话（保留但精简，与之前相同）
let chatMode = false,
  isListening = false;
let apiKey = localStorage.getItem('ai_api_key') || '';
let apiBase = localStorage.getItem('ai_api_base') || 'https://api.deepseek.com/v1';
let chatHistory = [];
const MAX_HISTORY = 10;

function loadApiConfig() {
  document.getElementById('apiKeyInput').value = apiKey;
  document.getElementById('apiBaseInput').value = apiBase;
  updateApiStatus();
}

function updateApiStatus() {
  const el = document.getElementById('apiStatus');
  if (apiKey) { el.textContent = '✅ 已配置';
    el.style.color = '#22c55e'; } else { el.textContent = '⚠️ 请设置 API Key';
    el.style.color = '#ef4444'; }
}

function saveApiConfig() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const base = document.getElementById('apiBaseInput').value.trim();
  if (key) { apiKey = key;
    localStorage.setItem('ai_api_key', key); }
  if (base) { apiBase = base;
    localStorage.setItem('ai_api_base', base); }
  updateApiStatus();
  showToast('✅ API 设置已保存');
}

const recognition = new(window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = 'zh-CN';
recognition.continuous = false;
recognition.interimResults = true;

function buildMessages(userInput) {
  const systemMsg = { role: 'system', content: 'You are a helpful English teacher and conversation partner. Speak naturally. If user speaks Chinese, reply in Chinese; if English, reply in English. Keep replies concise.' };
  const history = chatHistory.slice(-MAX_HISTORY);
  const messages = [systemMsg, ...history];
  if (userInput) messages.push({ role: 'user', content: userInput });
  return messages;
}

async function callAI(userInput) {
  if (!apiKey) { showToast('⚠️ 请先设置 API Key'); return null; }
  const messages = buildMessages(userInput);
  const url = apiBase + '/chat/completions';
  const body = { model: 'deepseek-chat', messages, temperature: 0.7, max_tokens: 500, stream: false };
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const err = await resp.text();
      throw new Error('API 错误: ' + resp.status + ' ' + err);
    }
    const data = await resp.json();
    const reply = data.choices[0].message.content;
    chatHistory.push({ role: 'user', content: userInput });
    chatHistory.push({ role: 'assistant', content: reply });
    if (chatHistory.length > MAX_HISTORY * 2) chatHistory = chatHistory.slice(-MAX_HISTORY * 2);
    return reply;
  } catch (e) {
    showToast('❌ AI 请求失败: ' + e.message);
    return null;
  }
}

function appendMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.textContent = content;
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString();
  div.appendChild(time);
  dom.chatBox.appendChild(div);
  dom.chatBox.scrollTop = dom.chatBox.scrollHeight;
}

async function processUserInput(text) {
  if (!text.trim()) return;
  appendMessage('user', text);
  dom.status.textContent = '🤖 AI 思考中...';
  dom.status.className = 'status speaking';
  const reply = await callAI(text);
  if (reply) {
    appendMessage('ai', reply);
    dom.status.textContent = '✅ 已回复';
    dom.status.className = 'status done';
    if (window.speechSynthesis) {
      const utter = new SpeechSynthesisUtterance(reply);
      utter.lang = /[\u4e00-\u9fa5]/.test(reply) ? 'zh-CN' : 'en-US';
      utter.rate = 0.8;
      window.speechSynthesis.speak(utter);
    }
  } else {
    dom.status.textContent = '⚠️ 回复失败';
    dom.status.className = 'status error';
  }
}

function toggleChat() {
  chatMode = !chatMode;
  const btn = dom.aiToggle;
  if (chatMode) {
    dom.chatBox.style.display = 'block';
    document.getElementById('chatInputArea').style.display = 'flex';
    btn.textContent = '❌ 关闭';
    btn.style.background = '#ef4444';
    if (dom.chatBox.children.length === 0) {
      appendMessage('ai', "👋 你好！我是你的 AI 英语学习助手。");
    }
  } else {
    dom.chatBox.style.display = 'none';
    document.getElementById('chatInputArea').style.display = 'none';
    btn.textContent = '💬 AI Chat';
    btn.style.background = '#10b981';
    if (isListening) { try { recognition.stop(); } catch (e) {} dom.micBtn.textContent = '🎤 Voice';
      dom.micBtn.classList.remove('listening');
      isListening = false; }
  }
}

function sendTextMessage() {
  const text = dom.chatInput.value.trim();
  if (!text) return;
  dom.chatInput.value = '';
  processUserInput(text);
}
dom.chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault();
    sendTextMessage(); }
});

function toggleMic() {
  if (isListening) {
    recognition.stop();
    dom.micBtn.textContent = '🎤 Voice';
    dom.micBtn.classList.remove('listening');
    isListening = false;
    return;
  }
  if (!chatMode) toggleChat();
  try {
    recognition.start();
    dom.micBtn.textContent = '⏺ Recording...';
    dom.micBtn.classList.add('listening');
    dom.status.textContent = '🎤 请说话...';
    dom.status.className = 'status speaking';
    isListening = true;
  } catch (e) {
    showToast('❌ 麦克风访问被拒绝。');
    dom.micBtn.textContent = '🎤 Voice';
    dom.micBtn.classList.remove('listening');
    isListening = false;
  }
}
recognition.onresult = function(event) {
  let finalText = '';
  for (let i = event.resultIndex; i < event.results.length; i++) {
    if (event.results[i].isFinal) {
      finalText = event.results[i][0].transcript;
      break;
    }
  }
  if (finalText) {
    dom.status.textContent = '✅ 识别: ' + finalText;
    dom.status.className = 'status done';
    processUserInput(finalText);
    recognition.stop();
    dom.micBtn.textContent = '🎤 Voice';
    dom.micBtn.classList.remove('listening');
    isListening = false;
  }
};
recognition.onerror = function(event) {
  dom.status.textContent = '⚠️ 识别错误: ' + event.error;
  dom.status.className = 'status error';
  dom.micBtn.textContent = '🎤 Voice';
  dom.micBtn.classList.remove('listening');
  isListening = false;
  showToast('语音识别失败，请尝试输入。');
};
recognition.onend = function() {
  if (isListening) {
    dom.micBtn.textContent = '🎤 Voice';
    dom.micBtn.classList.remove('listening');
    isListening = false;
  }
};

// ========================================================================
// 7. 键盘快捷键
// ========================================================================
document.addEventListener("keydown", function(e) {
  if (document.activeElement === dom.searchInput || document.activeElement === dom.chatInput) return;
  if (e.key === "ArrowLeft") { e.preventDefault();
    prevChunk(); }
  if (e.key === "ArrowRight") { e.preventDefault();
    nextChunk(); }
  if (e.key === " ") { e.preventDefault();
    togglePlayPause(); }
  if (e.key === "r" || e.key === "R") { e.preventDefault();
    toggleRepeat(); }
});
