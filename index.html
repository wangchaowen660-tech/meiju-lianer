<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每句练耳 · 音乐播放器版</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 20px 14px 40px;
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", Arial, sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 6px 0 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }
        .header p {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 15px;
        }
        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search input {
            flex: 1;
            padding: 13px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background: #fff;
        }
        .search input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .search button {
            flex-shrink: 0;
            padding: 12px 20px;
            background: #1e293b;
            color: #fff;
            border: 0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .search button:hover {
            background: #0f172a;
        }
        .results {
            margin-bottom: 16px;
        }
        .result {
            background: #fff;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid #edf2f7;
        }
        .result:hover {
            background: #f8fafc;
        }
        .result-en {
            font-weight: 700;
            font-size: 17px;
            color: #0f172a;
        }
        .result-cn {
            margin-top: 4px;
            color: #64748b;
            font-size: 15px;
        }
        .no-result {
            padding: 18px;
            text-align: center;
            color: #94a3b8;
            background: #fff;
            border-radius: 14px;
            border: 1px dashed #d1d9e6;
        }

        /* 卡片 - 音乐播放器风格 */
        .card {
            background: #fff;
            border-radius: 24px;
            padding: 26px 20px 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .scene {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }
        .progress {
            color: #b9c2d0;
            margin-top: 4px;
            font-size: 14px;
        }
        .english {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 8px 10px;
            font-size: 30px;
            font-weight: 700;
            line-height: 1.4;
            color: #0f172a;
            word-break: break-word;
        }
        .chinese {
            min-height: 44px;
            font-size: 20px;
            color: #475569;
            padding: 0 4px 6px;
        }

        /* 控制栏 - 音乐播放器风格 */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 10px;
        }
        .ctrl-btn {
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            font-size: 32px;
            color: #1e293b;
            transition: transform 0.15s, color 0.2s;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f1f4f9;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            transform: scale(0.90);
        }
        .ctrl-btn:hover {
            background: #e6eaef;
        }
        .ctrl-btn.play-btn {
            width: 80px;
            height: 80px;
            font-size: 40px;
            background: #1e293b;
            color: #fff;
        }
        .ctrl-btn.play-btn:hover {
            background: #0f172a;
        }
        .ctrl-btn.play-btn:active {
            background: #020617;
        }
        .ctrl-btn.play-btn.paused {
            background: #3b82f6;
        }
        .ctrl-btn.play-btn.paused:hover {
            background: #2563eb;
        }

        /* 辅助功能按钮 */
        .extra-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .extra-buttons button {
            flex: 1 1 auto;
            min-width: 60px;
            padding: 10px 12px;
            border: 0;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            touch-action: manipulation;
            background: #f1f4f9;
            color: #1e293b;
        }
        .extra-buttons button:hover {
            background: #e6eaef;
        }
        .extra-buttons button.active {
            background: #ef4444;
            color: #fff;
        }
        .extra-buttons button.active:hover {
            background: #dc2626;
        }
        .extra-buttons .engine-toggle {
            background: #f59e0b;
            color: #fff;
        }
        .extra-buttons .engine-toggle:hover {
            background: #d97706;
        }
        .extra-buttons .test-btn {
            background: #06b6d4;
            color: #fff;
        }
        .extra-buttons .test-btn:hover {
            background: #0891b2;
        }

        .status {
            min-height: 28px;
            margin-top: 12px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 400;
        }
        .status.speaking {
            color: #3b82f6;
            font-weight: 500;
        }
        .status.done {
            color: #22c55e;
            font-weight: 500;
        }
        .status.error {
            color: #ef4444;
            font-weight: 500;
        }
        .status.repeating {
            color: #8b5cf6;
            font-weight: 500;
        }
        .status.paused {
            color: #f59e0b;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.35s, transform 0.35s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .english {
                font-size: 25px;
                min-height: 80px;
            }
            .chinese {
                font-size: 18px;
                min-height: 38px;
            }
            .ctrl-btn {
                width: 50px;
                height: 50px;
                font-size: 28px;
            }
            .ctrl-btn.play-btn {
                width: 70px;
                height: 70px;
                font-size: 36px;
            }
            .extra-buttons button {
                font-size: 13px;
                padding: 8px 10px;
            }
        }
        @media (max-width: 380px) {
            .english {
                font-size: 21px;
            }
            .chinese {
                font-size: 16px;
            }
            .player-controls {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="toast" class="toast"></div>

    <div class="container">
        <div class="header">
            <h1>🎧 每句练耳</h1>
            <p>听清 · 听懂 · 开口</p>
        </div>

        <!-- 搜索栏 -->
        <div class="search">
            <input id="searchInput" type="search" placeholder="输入中文或英文" autocomplete="off">
            <button onclick="searchSentence()">搜索</button>
        </div>
        <div id="results" class="results"></div>

        <!-- 播放器卡片 -->
        <div class="card">
            <div id="scene" class="scene">问候</div>
            <div id="progress" class="progress">第 1 / 308 句</div>

            <div id="english" class="english">Good morning.</div>
            <div id="chinese" class="chinese">早上好。</div>

            <!-- 音乐控制栏 -->
            <div class="player-controls">
                <button class="ctrl-btn" onclick="prevTrack()" aria-label="上一首">⏮</button>
                <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()" aria-label="播放/暂停">▶</button>
                <button class="ctrl-btn" onclick="nextTrack()" aria-label="下一首">⏭</button>
            </div>

            <!-- 辅助功能 -->
            <div class="extra-buttons">
                <button id="repeatBtn" onclick="toggleRepeat()">🔁 复读</button>
                <button id="engineBtn" class="engine-toggle" onclick="toggleEngine()">🌐 自动</button>
                <button class="test-btn" onclick="testEngine()">🔧 测试</button>
                <button onclick="randomSentence()">🎲 随机</button>
            </div>

            <div id="status" class="status">准备好了</div>
        </div>

        <div style="text-align:center;margin-top:16px;font-size:13px;color:#b9c2d0;">
            ⌨ 左右方向键切换 · 空格键播放/暂停 · R 复读
        </div>
    </div>

    <script>
        /* ==============================================================
           🎛️ 用户可调参数
           ============================================================== */
        const SPLIT_THRESHOLD = 30;
        const SUB_INTERVAL = 200;
        const REPEAT_INTERVAL = 600;
        const REPEAT_TIMES = 5;
        const TIMEOUT_SEC = 8;

        /* ==============================================================
           📚 句库 — 请将您的完整 lessons 数组粘贴在下方
           ============================================================== */
        // 👇 粘贴您的完整 lessons 数组（至少包含一条）
        const lessons = [
            { scene: "问候", en: "Good morning.", cn: "早上好。" },
            { scene: "问候", en: "Good afternoon.", cn: "下午好。" },
            { scene: "问候", en: "Good evening.", cn: "晚上好。" },
            { scene: "问候", en: "Hello.", cn: "你好。" },
            { scene: "问候", en: "How are you?", cn: "你好吗？" },
            { scene: "问候", en: "I'm fine, thank you.", cn: "我很好，谢谢。" },
            { scene: "问候", en: "And you?", cn: "你呢？" },
            { scene: "问候", en: "Goodbye.", cn: "再见。" },
            { scene: "问候", en: "See you later.", cn: "待会儿见。" },
            { scene: "日常", en: "What are you doing?", cn: "你在做什么？" },
            // 请替换为您的全部词条（可从旧版复制）
        ];
        console.log('✅ 当前词库数量:', lessons.length);

        /* ==============================================================
           工具函数：智能分句
           ============================================================== */
        function smartSplit(text) {
            if (text.length <= SPLIT_THRESHOLD) return [text];
            const parts = text.match(/[^.!?;，,]+[.!?;，,]*/g);
            if (!parts || parts.length === 0) return [text];
            return parts.map(s => s.trim()).filter(s => s.length > 0);
        }

        /* ==============================================================
           状态变量
           ============================================================== */
        let currentIndex = 0;
        let isSpeaking = false;
        let isPaused = false;          // 是否处于暂停状态（用户主动暂停）
        let currentAudio = null;
        let currentUtterance = null;
        let statusResetTimer = null;
        let isPlayLocked = false;
        let engineMode = 'auto';       // 'auto' | 'web' | 'google'

        let isRepeating = false;
        let repeatCount = 0;
        let repeatTimer = null;

        let subSentences = [];
        let timeoutTimer = null;

        // DOM 元素
        const dom = {
            scene: document.getElementById('scene'),
            progress: document.getElementById('progress'),
            english: document.getElementById('english'),
            chinese: document.getElementById('chinese'),
            status: document.getElementById('status'),
            results: document.getElementById('results'),
            searchInput: document.getElementById('searchInput'),
            repeatBtn: document.getElementById('repeatBtn'),
            engineBtn: document.getElementById('engineBtn'),
            playPauseBtn: document.getElementById('playPauseBtn'),
            toast: document.getElementById('toast'),
        };

        // ===== Toast =====
        let toastTimer = null;
        function showToast(msg, duration) {
            duration = duration || 1800;
            const el = dom.toast;
            el.textContent = msg;
            el.className = 'toast show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.className = 'toast'; }, duration);
        }

        // ===== 彻底停止（重置所有） =====
        function stopAll() {
            if (isRepeating) {
                isRepeating = false;
                dom.repeatBtn.textContent = '🔁 复读';
                dom.repeatBtn.classList.remove('active');
                if (repeatTimer) { clearTimeout(repeatTimer);
                    repeatTimer = null; }
            }
            if (currentUtterance) {
                try { window.speechSynthesis.cancel(); } catch (_) {}
                currentUtterance = null;
            }
            if (currentAudio) {
                try { currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio.src = ''; } catch (_) {}
                currentAudio = null;
            }
            if (timeoutTimer) {
                clearTimeout(timeoutTimer);
                timeoutTimer = null;
            }
            isSpeaking = false;
            isPaused = false;
            isPlayLocked = false;
            subSentences = [];
            if (statusResetTimer) { clearTimeout(statusResetTimer);
                statusResetTimer = null; }
            // 更新播放按钮图标
            dom.playPauseBtn.textContent = '▶';
            dom.playPauseBtn.classList.remove('paused');
            if (!isRepeating) {
                dom.status.textContent = '已暂停';
                dom.status.className = 'status paused';
            }
        }

        // ===== 暂停（仅停止播放，不重置状态锁） =====
        function pausePlayback() {
            if (currentUtterance) {
                try { window.speechSynthesis.cancel(); } catch (_) {}
                currentUtterance = null;
            }
            if (currentAudio) {
                try { currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio.src = ''; } catch (_) {}
                currentAudio = null;
            }
            if (timeoutTimer) {
                clearTimeout(timeoutTimer);
                timeoutTimer = null;
            }
            isSpeaking = false;
            isPaused = true;
            isPlayLocked = false; // 释放锁，允许重新播放
            dom.playPauseBtn.textContent = '▶';
            dom.playPauseBtn.classList.remove('paused');
            dom.status.textContent = '已暂停';
            dom.status.className = 'status paused';
        }

        // ===== 原生语音播放单个子句（带超时） =====
        function playWebSpeechSub(subText, callback) {
            if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
                callback(false, '浏览器不支持原生语音');
                return;
            }
            const utterance = new SpeechSynthesisUtterance(subText);
            currentUtterance = utterance;
            utterance.lang = 'en-US';
            utterance.rate = 0.6;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            let ended = false;
            let timeoutId = null;

            timeoutId = setTimeout(() => {
                if (!ended) {
                    ended = true;
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                    currentUtterance = null;
                    isSpeaking = false;
                    callback(false, '播放超时（网络或系统繁忙）');
                }
            }, TIMEOUT_SEC * 1000);

            utterance.onstart = function() {
                if (currentUtterance !== utterance) return;
                isSpeaking = true;
                isPaused = false;
                dom.playPauseBtn.textContent = '⏸';
                dom.playPauseBtn.classList.add('paused');
            };

            utterance.onend = function() {
                if (ended) return;
                ended = true;
                clearTimeout(timeoutId);
                isSpeaking = false;
                currentUtterance = null;
                callback(true);
            };

            utterance.onerror = function(ev) {
                if (ended) return;
                ended = true;
                clearTimeout(timeoutId);
                isSpeaking = false;
                currentUtterance = null;
                if (ev.error === 'canceled' || ev.error === 'interrupted') {
                    callback(false, '播放被取消');
                    return;
                }
                callback(false, '原生语音错误: ' + ev.error);
            };

            try {
                window.speechSynthesis.speak(utterance);
            } catch (err) {
                clearTimeout(timeoutId);
                ended = true;
                isSpeaking = false;
                currentUtterance = null;
                callback(false, '原生语音异常: ' + err.message);
            }
        }

        // ===== Google TTS 播放单个子句（带超时） =====
        function playGoogleTTSSub(subText, callback) {
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(subText)}&tl=en&client=tw-ob`;
            const audio = new Audio(url);
            currentAudio = audio;
            let ended = false;
            let timeoutId = null;

            timeoutId = setTimeout(() => {
                if (!ended) {
                    ended = true;
                    try { audio.pause();
                        audio.src = ''; } catch (_) {}
                    currentAudio = null;
                    isSpeaking = false;
                    callback(false, '播放超时（网络慢或服务无响应）');
                }
            }, TIMEOUT_SEC * 1000);

            audio.oncanplaythrough = function() {
                audio.play().catch(err => {
                    if (ended) return;
                    clearTimeout(timeoutId);
                    ended = true;
                    currentAudio = null;
                    callback(false, 'Google TTS 播放失败: ' + err.message);
                });
            };

            audio.onplay = function() {
                isSpeaking = true;
                isPaused = false;
                dom.playPauseBtn.textContent = '⏸';
                dom.playPauseBtn.classList.add('paused');
            };

            audio.onended = function() {
                if (ended) return;
                clearTimeout(timeoutId);
                ended = true;
                isSpeaking = false;
                currentAudio = null;
                callback(true);
            };

            audio.onerror = function() {
                if (ended) return;
                clearTimeout(timeoutId);
                ended = true;
                isSpeaking = false;
                currentAudio = null;
                callback(false, 'Google TTS 加载失败（网络限制或服务不可用）');
            };

            audio.load();
        }

        // ===== 分句播放序列（递归，带超时） =====
        function playSubSequence(subList, index, callback, engine) {
            if (index >= subList.length) {
                callback(true);
                return;
            }

            const subText = subList[index];
            if (subList.length > 1) {
                dom.status.textContent = `🎧 ${index+1}/${subList.length}`;
                dom.status.className = 'status speaking';
            }

            const playFunc = (engine === 'google') ? playGoogleTTSSub : playWebSpeechSub;

            playFunc(subText, function(success, msg) {
                if (!success) {
                    callback(false, msg);
                    return;
                }
                // 成功，延迟播放下一个
                setTimeout(() => {
                    playSubSequence(subList, index + 1, callback, engine);
                }, SUB_INTERVAL);
            });
        }

        // ===== 播放当前句（入口，自动分句） =====
        function playCurrent() {
            // 如果处于暂停状态，清除暂停标记并继续
            if (isPaused) {
                isPaused = false;
            }
            // 停止所有并重置（但保留播放锁）
            stopAll();

            const item = lessons[currentIndex];
            if (!item) { showToast('句子不存在'); return; }

            subSentences = smartSplit(item.en);
            if (subSentences.length === 0) {
                showToast('没有可播放的内容');
                return;
            }

            isPlayLocked = true;
            dom.status.textContent = `⏳ 加载中 (${subSentences.length} 段)`;
            dom.status.className = 'status';

            let engine = 'web';
            if (engineMode === 'google') engine = 'google';
            else if (engineMode === 'web') engine = 'web';
            else engine = 'google'; // auto 优先 google

            function startPlay(eng) {
                playSubSequence(subSentences, 0, function(success, msg) {
                    isPlayLocked = false;
                    if (success) {
                        dom.status.textContent = '✅ 播放完成';
                        dom.status.className = 'status done';
                        dom.playPauseBtn.textContent = '▶';
                        dom.playPauseBtn.classList.remove('paused');
                        clearTimeout(statusResetTimer);
                        statusResetTimer = setTimeout(() => {
                            if (!isSpeaking && !currentAudio && !currentUtterance && !isRepeating) {
                                dom.status.textContent = '准备好了';
                                dom.status.className = 'status';
                            }
                            statusResetTimer = null;
                        }, 1500);
                    } else {
                        if (engineMode === 'auto' && eng === 'google') {
                            dom.status.textContent = '⚠️ Google 失败，切换原生...';
                            dom.status.className = 'status warning';
                            setTimeout(() => { startPlay('web'); }, 300);
                        } else {
                            dom.status.textContent = '⚠️ ' + (msg || '播放失败');
                            dom.status.className = 'status error';
                            dom.playPauseBtn.textContent = '▶';
                            dom.playPauseBtn.classList.remove('paused');
                            showToast('播放失败: ' + (msg || '未知错误'));
                        }
                    }
                }, eng);
            }

            startPlay(engine);
        }

        // ===== 播放/暂停切换 =====
        function togglePlayPause() {
            if (isRepeating) {
                // 如果正在复读，点击播放/暂停应停止复读并进入普通模式
                stopAll();
                // 然后播放当前句
                playCurrent();
                return;
            }

            if (isSpeaking) {
                // 正在播放，暂停
                pausePlayback();
                dom.status.textContent = '⏸ 已暂停';
                dom.status.className = 'status paused';
                showToast('已暂停');
            } else {
                // 未播放，开始播放
                if (isPaused) {
                    // 从暂停恢复，重新开始播放当前句
                    isPaused = false;
                }
                playCurrent();
            }
        }

        // ===== 上一首 =====
        function prevTrack() {
            if (isRepeating) stopAll();
            stopAll(); // 停止当前播放
            currentIndex = (currentIndex - 1 + lessons.length) % lessons.length;
            showSentence();
            // 自动播放
            playCurrent();
        }

        // ===== 下一首 =====
        function nextTrack() {
            if (isRepeating) stopAll();
            stopAll();
            currentIndex = (currentIndex + 1) % lessons.length;
            showSentence();
            playCurrent();
        }

        // ===== 复读 =====
        function toggleRepeat() {
            if (isRepeating) {
                stopAll();
                dom.status.textContent = '⏸ 已停止复读';
                dom.status.className = 'status paused';
                showToast('已停止复读');
                return;
            }
            // 如果正在播放，停止
            if (isSpeaking) stopAll();
            repeatCount = 0;
            isRepeating = true;
            dom.repeatBtn.textContent = '⏹ 停止复读';
            dom.repeatBtn.classList.add('active');
            dom.status.textContent = `🔁 复读 ${repeatCount+1}/${REPEAT_TIMES}`;
            dom.status.className = 'status repeating';
            doRepeatPlay();
        }

        function doRepeatPlay() {
            if (!isRepeating) return;
            dom.status.textContent = `🔁 复读 ${repeatCount+1}/${REPEAT_TIMES}`;
            dom.status.className = 'status repeating';

            const item = lessons[currentIndex];
            if (!item) { stopAll(); return; }
            const subs = smartSplit(item.en);
            if (subs.length === 0) { stopAll(); return; }

            let engine = 'web';
            if (engineMode === 'google') engine = 'google';
            else if (engineMode === 'web') engine = 'web';
            else engine = 'google';

            function repeatPlayOnce(eng) {
                playSubSequence(subs, 0, function(success) {
                    if (!isRepeating) return;
                    if (!success) {
                        if (engineMode === 'auto' && eng === 'google') {
                            setTimeout(() => { repeatPlayOnce('web'); }, 300);
                            return;
                        }
                        isRepeating = false;
                        dom.repeatBtn.textContent = '🔁 复读';
                        dom.repeatBtn.classList.remove('active');
                        dom.status.textContent = '⚠️ 复读中断';
                        dom.status.className = 'status error';
                        showToast('复读失败，请检查网络或切换引擎');
                        return;
                    }
                    repeatCount++;
                    if (repeatCount >= REPEAT_TIMES) {
                        isRepeating = false;
                        dom.repeatBtn.textContent = '🔁 复读';
                        dom.repeatBtn.classList.remove('active');
                        dom.status.textContent = `✅ 复读完成 (${REPEAT_TIMES}次)`;
                        dom.status.className = 'status done';
                        dom.playPauseBtn.textContent = '▶';
                        dom.playPauseBtn.classList.remove('paused');
                        clearTimeout(statusResetTimer);
                        statusResetTimer = setTimeout(() => {
                            if (!isSpeaking && !currentAudio && !currentUtterance && !isRepeating) {
                                dom.status.textContent = '准备好了';
                                dom.status.className = 'status';
                            }
                            statusResetTimer = null;
                        }, 1500);
                    } else {
                        repeatTimer = setTimeout(() => {
                            if (isRepeating) doRepeatPlay();
                        }, REPEAT_INTERVAL);
                    }
                }, eng);
            }

            repeatPlayOnce(engine);
        }

        // ===== 引擎切换 =====
        function toggleEngine() {
            stopAll();
            if (engineMode === 'auto') {
                engineMode = 'web';
                dom.engineBtn.textContent = '🌐 原生';
                showToast('已切换至强制原生语音');
            } else if (engineMode === 'web') {
                engineMode = 'google';
                dom.engineBtn.textContent = '🌐 Google';
                showToast('已切换至强制 Google TTS');
            } else {
                engineMode = 'auto';
                dom.engineBtn.textContent = '🌐 自动';
                showToast('已切换至自动模式');
            }
            dom.status.textContent = '准备好了';
            dom.status.className = 'status';
            dom.playPauseBtn.textContent = '▶';
            dom.playPauseBtn.classList.remove('paused');
        }

        // ===== 测试引擎 =====
        function testEngine() {
            stopAll();
            dom.status.textContent = '🧪 测试中...';
            dom.status.className = 'status warning';
            const original = lessons[currentIndex];
            const testItem = { en: "Hello. How are you today?", cn: "你好。今天你好吗？" };
            lessons[currentIndex] = testItem;
            isPlayLocked = false;
            playCurrent();
            setTimeout(() => {
                lessons[currentIndex] = original;
                showSentence();
                dom.status.textContent = '✅ 测试完成';
                dom.status.className = 'status done';
            }, 4000);
        }

        // ===== 显示句子 =====
        function showSentence() {
            const item = lessons[currentIndex];
            if (!item) return;
            dom.scene.textContent = item.scene;
            dom.progress.textContent = `第 ${currentIndex + 1} / ${lessons.length} 句`;
            dom.english.textContent = item.en;
            dom.chinese.textContent = item.cn;
            if (!isSpeaking && !currentAudio && !currentUtterance && !isRepeating) {
                dom.status.textContent = '准备好了';
                dom.status.className = 'status';
                dom.playPauseBtn.textContent = '▶';
                dom.playPauseBtn.classList.remove('paused');
            }
        }

        // ===== 随机跳转 =====
        function randomSentence() {
            if (isRepeating) stopAll();
            stopAll();
            currentIndex = Math.floor(Math.random() * lessons.length);
            showSentence();
            dom.status.textContent = '🎲 随机跳转';
            dom.status.className = 'status';
            showToast('🎲 随机跳转');
            // 自动播放
            playCurrent();
        }

        // ===== 搜索 =====
        function searchSentence() {
            const keyword = dom.searchInput.value.trim();
            const resultsEl = dom.results;
            if (!keyword) { resultsEl.innerHTML = ''; showToast('请输入关键词'); return; }
            const lower = keyword.toLowerCase();
            const matches = [];
            lessons.forEach((item, idx) => {
                if (item.en.toLowerCase().includes(lower) || item.cn.includes(keyword)) {
                    matches.push({ ...item, index: idx });
                }
            });
            if (!matches.length) {
                resultsEl.innerHTML = `<div class="no-result">🔍 没有找到相关句子</div>`;
                return;
            }
            let html = '';
            matches.forEach(m => {
                html += `<div class="result" data-index="${m.index}">
                            <div class="result-en">${m.en}</div>
                            <div class="result-cn">${m.cn}</div>
                        </div>`;
            });
            resultsEl.innerHTML = html;
            resultsEl.querySelectorAll('.result').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < lessons.length) {
                        stopAll();
                        currentIndex = idx;
                        showSentence();
                        resultsEl.innerHTML = '';
                        dom.searchInput.value = '';
                        dom.searchInput.blur();
                        dom.status.textContent = '准备好了';
                        dom.status.className = 'status';
                        showToast('已跳转');
                        // 自动播放
                        playCurrent();
                    }
                });
            });
            resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', function(e) {
            if (document.activeElement === dom.searchInput) return;
            switch (e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    prevTrack();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextTrack();
                    break;
                case ' ':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    toggleRepeat();
                    break;
            }
        });
        dom.searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault();
                searchSentence(); }
        });

        // ===== 初始化 =====
        if (currentIndex >= lessons.length) currentIndex = 0;
        showSentence();

        if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
            engineMode = 'google';
            dom.engineBtn.textContent = '🌐 Google';
            showToast('原生语音不可用，已切换至 Google TTS', 3000);
        }

        // 暴露全局（供 onclick 调用）
        window.togglePlayPause = togglePlayPause;
        window.prevTrack = prevTrack;
        window.nextTrack = nextTrack;
        window.toggleRepeat = toggleRepeat;
        window.toggleEngine = toggleEngine;
        window.testEngine = testEngine;
        window.randomSentence = randomSentence;
        window.searchSentence = searchSentence;
        window.playCurrent = playCurrent;
        window.stopAll = stopAll;

        console.log('🎧 每句练耳 · 音乐播放器版 已加载');
        console.log(`📚 总词块数: ${lessons.length}`);
        console.log(`⚙️ 引擎模式: ${engineMode}`);
        console.log('⌨ 快捷键: 左右方向键切换 · 空格键播放/暂停 · R 复读');
    </script>

</body>

</html>
