<script>

/* =========================================================
   1. 语音系统
   ========================================================= */

const synth = window.speechSynthesis;

let voices = [];
let currentRate = 0.85;
let voiceReady = false;

function loadVoices(){

  if(!synth) return;

  voices = synth.getVoices() || [];

  voiceReady = true;

  updateSoundStatus();

}

if(synth){

  loadVoices();

  synth.onvoiceschanged = function(){
    loadVoices();
  };

}

function updateSoundStatus(){

  const el = document.getElementById("soundStatus");

  if(!synth){

    el.textContent =
      "⚠️ 当前浏览器不支持系统语音";

    return;
  }

  if(voices.length){

    el.textContent =
      "🔊 英语语音已准备 · 点击即可发音";

  }else{

    el.textContent =
      "🔊 系统语音已启动 · 点击即可发音";

  }

}


function getEnglishVoice(){

  if(!voices.length) return null;

  return (

    voices.find(v =>
      /^en-US/i.test(v.lang)
    ) ||

    voices.find(v =>
      /^en-GB/i.test(v.lang)
    ) ||

    voices.find(v =>
      /^en/i.test(v.lang)
    ) ||

    null

  );

}


/*
  关键：
  不使用上一版的 setTimeout 延迟播放。
  点击按钮时直接创建 utterance。
*/

function speakText(text){

  if(!text) return;

  if(!synth){

    alert("当前浏览器不支持语音播放。");

    return;
  }

  try{

    synth.cancel();

    const utter =
      new SpeechSynthesisUtterance(text);

    const voice =
      getEnglishVoice();

    if(voice){

      utter.voice = voice;
      utter.lang = voice.lang;

    }else{

      utter.lang = "en-US";

    }

    utter.rate = currentRate;
    utter.pitch = 1;
    utter.volume = 1;

    utter.onstart = function(){

      updateSoundStatus();

    };

    utter.onerror = function(e){

      console.log(
        "Speech error:",
        e
      );

    };

    synth.speak(utter);

  }catch(error){

    console.log(error);

  }

}


/* 测试声音 */

document
  .getElementById("testSound")
  .addEventListener(
    "click",
    function(){

      speakText(
        "Good morning."
      );

    }

/* =========================================================
   3. 数据整理
   ========================================================= */

const families = FAMILY_DATA.map((item,index)=>{

  return {

    id:index,

    name:item[0],

    type:item[1],

    words:item[2]
      .split("|")
      .map(w=>w.trim())
      .filter(Boolean)

});

let currentFamily =

let currentWord =

/* =========================================================
   5. 通用资料生成
   ========================================================= */

function getDetail(word){

  const key =
    word.toLowerCase();

  if(DETAILS[key]){

    const d=DETAILS[key];

    return {

      pos:d[0],
      zh:d[1],
      block:d[2],
      chunk:d[3],
      sentence:d[4],
      sentenceZh:d[5]

    };

  }

  /*
    没有单独登记的词，
    使用保守模板。
  */

  let pos="单词";
  let zh="常用英语词";

  const verbs=[
    "go","come","make","take","give",
    "have","do","see","say","know",
    "think","want","need","like",
    "love","look","use","find","tell",
    "ask","feel","keep","put","bring",
    "buy","eat","drink","sleep","read",
    "write","speak","learn","work",
    "walk","run","sit","stand","open",
    "close","try","help","wait","start",
    "finish","remember","forget"
  ];

  if(verbs.includes(key)){
    pos="动词";
  }

  return {

    pos,

    zh,

    block:word,

    chunk:word,

    sentence:
      "I use " + word + ".",

    sentenceZh:
      "我使用 " + word + "。"

  };

}


/* =========================================================
   6. 页面渲染
   ========================================================= */

function render(){

  currentFamily =
    families[familyIndex];

  if(
    wordIndex >= currentFamily.words.length
  ){

    wordIndex=0;

  }

  currentWord =
    currentFamily.words[wordIndex];

  const d =
    getDetail(currentWord);


  document.getElementById(
    "familyIndex"
  ).textContent =
    "词族 " +
    (familyIndex+1) +
    " / " +
    families.length;


  document.getElementById(
    "familyName"
  ).textContent =
    currentFamily.name;


  const wordList =
    document.getElementById("wordList");

  wordList.innerHTML="";


  currentFamily.words.forEach(
    (word,index)=>{

      const btn =
        document.createElement("button");

      btn.className =
        "word-btn " +
        (index===wordIndex
          ? "active"
          : "");

      btn.textContent =
        word;

      btn.onclick=function(){

        wordIndex=index;

        render();

        speakText(word);

      };

      wordList.appendChild(btn);

    }
  );


  document.getElementById(
    "currentWord"
  ).textContent =
    currentWord;


  document.getElementById(
    "currentPOS"
  ).textContent =
    d.pos;


  document.getElementById(
    "currentZH"
  ).textContent =
    d.zh;


  renderSoundBlocks(d);

  renderChunks(d);

  renderMotherSentence(d);

  prepareListening(d);

}


/* =========================================================
   7. 声音块
   ========================================================= */

function renderSoundBlocks(d){

  const box =
    document.getElementById(
      "soundBlocks"
    );

  box.innerHTML="";

  /*
    简单的二块音显示。
    后续可以继续扩充为真正音素数据。
  */

  const word =
    currentWord;

  let parts=[];

  if(word.length<=2){

    parts=[word];

  }else{

    const cut =
      Math.max(
        1,
        Math.floor(word.length/2)
      );

    parts=[
      word.slice(0,cut),
      word.slice(cut)
    ];

  }


  parts.forEach(part=>{

    const item =
      document.createElement("div");

    item.className="item";

    item.innerHTML=`
      <div class="item-text">
        <strong>${part}</strong>
      </div>
      <button class="sound">
        🔊
      </button>
    `;

    item.querySelector("button")
      .onclick=function(){

        speakText(part);

      };

    box.appendChild(item);

  });

}


/* =========================================================
   8. 词块
   ========================================================= */

function renderChunks(d){

  const box =
    document.getElementById(
      "chunks"
    );

  box.innerHTML="";

  const chunks=[];

  if(d.chunk){
    chunks.push(d.chunk);
  }

  if(currentWord!=="it"){
    chunks.push(
      "use " + currentWord
    );
  }

  chunks.forEach(chunk=>{

    const item =
      document.createElement("div");

    item.className="item";

    item.innerHTML=`
      <div class="item-text">
        ${chunk}
      </div>
      <button class="sound">
        🔊
      </button>
    `;

    item.querySelector("button")
      .onclick=function(){

        speakText(chunk);

      };

    item.querySelector(
      ".item-text"
    ).onclick=function(){

      speakText(chunk);

    };

    box.appendChild(item);

  });

}


/* =========================================================
   9. 母句
   ========================================================= */

function renderMotherSentence(d){

  const box =
    document.getElementById(
      "motherSentences"
    );

  box.innerHTML="";


  const sentence =
    d.sentence;


  const item =
    document.createElement("div");

  item.className=
    "item mother";

  item.innerHTML=`

    <div class="item-text">

      <strong>
        ${sentence}
      </strong>

      <div class="chinese">
        ${d.sentenceZh}
      </div>

    </div>

    <button class="sound">
      🔊
    </button>

  `;


  item.querySelector(
    "button"
  ).onclick=function(){

    speakText(sentence);

  };


  item.querySelector(
    ".item-text"
  ).onclick=function(){

    speakText(sentence);

  };


  box.appendChild(item);

}


/* =========================================================
   10. 当前单词播放
   ========================================================= */

function speakCurrentWord(){

  speakText(currentWord);

}


/* =========================================================
   11. 听力
   ========================================================= */

let listeningSentence="";
let listeningChinese="";


function prepareListening(d){

  listeningSentence =
    d.sentence;

  listeningChinese =
    d.sentenceZh;


  document.getElementById(
    "listenEnglish"
  ).textContent =
    listeningSentence;


  document.getElementById(
    "listenChinese"
  ).textContent =
    listeningChinese;


  document.getElementById(
    "listenEnglish"
  ).classList.add("hidden");


  document.getElementById(
    "listenChinese"
  ).classList.add("hidden");

}


function playListening(){

  speakText(
    listeningSentence
  );

}


function showEnglish(){

  document.getElementById(
    "listenEnglish"
  ).classList.remove("hidden");

}


function showChinese(){

  document.getElementById(
    "listenChinese"
  ).classList.remove("hidden");

}


/* =========================================================
   12. 语速
   ========================================================= */

function setSpeed(rate,button){

  currentRate=rate;

  document
    .querySelectorAll(".speed")
    .forEach(btn=>{
      btn.classList.remove(
        "active"
      );
    });

  button.classList.add(
    "active"
  );

}


/* =========================================================
   13. 词族切换
   ========================================================= */

function nextFamily(){

  familyIndex++;

  if(
    familyIndex >= families.length
  ){

    familyIndex=0;

  }

  wordIndex=0;

  render();

}


function prevFamily(){

  familyIndex--;

  if(familyIndex<0){

    familyIndex =
      families.length-1;

  }

  wordIndex=0;

  render();

}


/* =========================================================
   14. 单词切换
   ========================================================= */

function nextWord(){

  wordIndex++;

  if(
    wordIndex >=
    currentFamily.words.length
  ){

    wordIndex=0;

  }

  render();

  speakCurrentWord();

}


function prevWord(){

  wordIndex--;

  if(wordIndex<0){

    wordIndex =
      currentFamily.words.length-1;

  }

  render();

  speakCurrentWord();

}


/* =========================================================
   15. 搜索
   ========================================================= */

const searchInput =
  document.getElementById(
    "search"
  );

searchInput.addEventListener(
  "input",
  function(){

    const q =
      this.value
        .trim()
        .toLowerCase();


    const box =
      document.getElementById(
        "searchResult"
      );


    if(!q){

      box.classList.add(
        "hidden"
      );

      box.innerHTML="";

      return;

    }


    const results=[];


    families.forEach(
      (family,fi)=>{

        family.words.forEach(
          (word,wi)=>{

            if(
              word
                .toLowerCase()
                .includes(q)
            ){

              results.push({
                word,
                fi,
                wi
              });

            }

          }
        );

      }
    );


    box.innerHTML="";

    box.classList.remove(
      "hidden"
    );


    if(!results.length){

      box.innerHTML=
        "<div class='item'>没有找到这个词。</div>";

      return;

    }


    results
      .slice(0,30)
      .forEach(r=>{

        const btn =
          document.createElement(
            "button"
          );

        btn.textContent =
          "🔊 " +
          r.word;

        btn.onclick=function(){

          familyIndex=r.fi;

          wordIndex=r.wi;

          render();

          speakText(
            r.word
          );

          box.classList.add(
            "hidden"
          );

          searchInput.value="";

        };

        box.appendChild(btn);

      });

  }
);


/* =========================================================
   16. 启动
   ========================================================= */

render();

updateSoundStatus();


/*
  页面加载后主动读取一次 voices。
  不主动播放声音，避免浏览器阻止自动播放。
*/

if(synth){

  setTimeout(function(){

    loadVoices();

  },300);

}
