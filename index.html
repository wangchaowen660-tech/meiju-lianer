<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>极速词块闯关</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: #1a202c; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* 顶部状态栏 */
    .top-bar { padding: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; }
    .score { color: #f6e05e; }
    .level { color: #63b3ed; }
    
    /* 倒计时条 */
    .timer-bg { width: 100%; height: 6px; background: #2d3748; }
    .timer-fill { height: 100%; background: #48bb78; width: 100%; transition: width 0.1s linear; }
    
    /* 游戏区 */
    .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    
    .question-cn { font-size: 28px; font-weight: 800; margin-bottom: 40px; line-height: 1.4; color: #e2e8f0; }
    
    /* 选项按钮 */
    .options { width: 100%; display: flex; flex-direction: column; gap: 15px; }
    .option-btn {
        width: 100%; padding: 18px; border-radius: 16px; border: 2px solid #4a5568;
        background: #2d3748; color: #fff; font-size: 18px; font-weight: bold;
        transition: all 0.1s;
    }
    .option-btn:active { transform: scale(0.97); }
    .option-btn.correct { background: #48bb78; border-color: #48bb78; }
    .option-btn.wrong { background: #f56565; border-color: #f56565; }
    
    /* 连击提示 */
    .combo { position: absolute; top: 30%; font-size: 40px; font-weight: 900; color: #f6e05e; opacity: 0; pointer-events: none; transform: scale(0.5); transition: all 0.3s; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
    .combo.show { opacity: 1; transform: scale(1.2) translateY(-20px); }

    /* 遮罩层 (开始 / 失败 / 付费) */
    .overlay { position: absolute; inset: 0; background: rgba(26,32,44,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; z-index: 10; text-align: center; backdrop-filter: blur(5px); }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 32px; margin-bottom: 10px; color: #f6e05e; }
    .overlay p { font-size: 16px; color: #a0aec0; margin-bottom: 30px; line-height: 1.6; }
    .btn-main { width: 100%; max-width: 300px; padding: 18px; border-radius: 30px; background: linear-gradient(135deg, #e94560, #f97316); color: #fff; font-size: 20px; font-weight: bold; border: none; box-shadow: 0 8px 20px rgba(233,69,96,0.4); }
    .btn-main:active { transform: scale(0.95); }
    
    /* 付费墙特别样式 */
    .paywall-box { background: #fff; border-radius: 20px; padding: 25px; color: #333; width: 100%; max-width: 320px; }
    .paywall-box h2 { color: #0f172a; margin-bottom: 10px; }
    .paywall-box p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
    .wechat-id { background: #f1f5f9; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 18px; font-weight: bold; color: #e94560; margin-bottom: 20px; user-select: all; }
</style>
</head>
<body>

    <!-- 顶部 -->
    <div class="top-bar">
        <div class="level" id="ui-level">第 1 关</div>
        <div class="score" id="ui-score">0 分</div>
    </div>
    <div class="timer-bg"><div class="timer-fill" id="ui-timer"></div></div>

    <!-- 游戏区 -->
    <div class="game-area">
        <div class="combo" id="ui-combo">Perfect!</div>
        <div class="question-cn" id="ui-question">点击开始游戏</div>
        <div class="options" id="ui-options"></div>
    </div>

    <!-- 遮罩层：开始 -->
    <div class="overlay" id="start-screen">
        <h1>⚡️ 极速词块</h1>
        <p>看中文，选英文。<br>在倒计时结束前尽可能多地得分！</p>
        <button class="btn-main" onclick="startGame()">开始闯关</button>
    </div>

    <!-- 遮罩层：游戏结束 -->
    <div class="overlay hidden" id="gameover-screen">
        <h1>游戏结束</h1>
        <p>你的最终得分：<span id="final-score" style="color:#f6e05e; font-size:24px;">0</span> 分</p>
        <button class="btn-main" onclick="restartGame()">再来一次</button>
    </div>

    <!-- 遮罩层：付费墙 -->
    <div class="overlay hidden" id="paywall-screen">
        <div class="paywall-box">
            <h2>🎉 突破 500 分！</h2>
            <p>你已经解锁了高级语感。<br>支付 ¥9.9 获取专属激活码，继续挑战！</p>
            <div class="wechat-id">加微信：King13142786</div>
            <input type="text" id="code-input" placeholder="输入激活码" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; margin-bottom:15px; font-size:16px; text-align:center;">
            <button class="btn-main" onclick="checkCode()" style="font-size:16px; padding:12px;">激活并继续</button>
        </div>
    </div>

    <script>
        // ================= 数据配置 =================
        // 题库：直接抽取你之前的词块
        const database = [
            { cn: "我想点这个", en: "I'd like to order this" },
            { cn: "我不知道去哪", en: "I have no idea where to go" },
            { cn: "你能帮我一下吗", en: "Can you help me with this" },
            { cn: "你是什么意思", en: "What do you mean" },
            { cn: "我该去哪里", en: "Where should I visit" },
            { cn: "我非常喜欢", en: "I like it very much" },
            { cn: "现在几点了", en: "What time is it now" },
            { cn: "请再说一遍", en: "Could you say that again" },
            { cn: "我马上就到", en: "I'll be there soon" },
            { cn: "我想预订一个房间", en: "I'd like to book a room" },
            { cn: "这个多少钱", en: "How much does it cost" },
            { cn: "我不明白", en: "I don't understand" }
        ];

        // ================= 游戏状态 =================
        let currentScore = 0;
        let currentLevel = 1;
        let comboCount = 0;
        let timeLeft = 100; // 百分比
        let timerInterval = null;
        let currentQuestion = null;
        let isLocked = false; // 付费锁状态

        // ================= 音效引擎 (纯代码生成，绝不挑系统) =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // ================= 核心逻辑 =================
        const $ = id => document.getElementById(id);

        function startGame() {
            $("start-screen").classList.add("hidden");
            $("gameover-screen").classList.add("hidden");
            $("paywall-screen").classList.add("hidden");
            
            currentScore = 0;
            currentLevel = 1;
            comboCount = 0;
            isLocked = false;
            timeLeft = 100;
            
            updateUI();
            nextQuestion();
            startTimer();
            
            // 解锁音频上下文
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                // 随着等级提升，时间流逝更快
                timeLeft -= (0.3 + currentLevel * 0.05); 
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateUI();
                    gameOver();
                } else {
                    updateUI();
                }
            }, 100);
        }

        function nextQuestion() {
            // 每次答对增加一点关卡难度
            currentLevel = Math.floor(currentScore / 100) + 1;
            $("ui-level").textContent = "第 " + currentLevel + " 关";
            
            // 如果分数超过 500 且没解锁，弹付费墙
            if (currentScore >= 500 && !isLocked) {
                pauseGame();
                $("paywall-screen").classList.remove("hidden");
                return;
            }

            // 随机抽题
            const correctAnswer = database[Math.floor(Math.random() * database.length)];
            currentQuestion = correctAnswer;

            // 生成错误选项
            let options = [correctAnswer];
            while (options.length < 4) {
                const randomWrong = database[Math.floor(Math.random() * database.length)];
                if (!options.find(o => o.en === randomWrong.en)) {
                    options.push(randomWrong);
                }
            }
            
            // 打乱选项顺序
            options.sort(() => Math.random() - 0.5);

            // 渲染
            $("ui-question").textContent = correctAnswer.cn;
            const optBox = $("ui-options");
            optBox.innerHTML = "";
            
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.en;
                btn.onclick = () => checkAnswer(btn, opt.en === correctAnswer.en);
                optBox.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            // 禁用所有按钮防连点
            document.querySelectorAll(".option-btn").forEach(b => b.style.pointerEvents = "none");

            if (isCorrect) {
                playSound('correct');
                btn.classList.add("correct");
                
                // 连击奖励
                comboCount++;
                let points = 10 + (comboCount * 2);
                currentScore += points;
                
                // 回复少量时间
                timeLeft = Math.min(100, timeLeft + 10);
                
                // 显示连击提示
                if (comboCount >= 3) {
                    showCombo(comboCount + " Combo!");
                }

                setTimeout(() => nextQuestion(), 400);
            } else {
                playSound('wrong');
                btn.classList.add("wrong");
                
                // 扣除时间惩罚
                comboCount = 0;
                timeLeft = Math.max(0, timeLeft - 15);
                
                // 亮出正确选项
                document.querySelectorAll(".option-btn").forEach(b => {
                    if (b.textContent === currentQuestion.en) b.classList.add("correct");
                });

                setTimeout(() => {
                    if (timeLeft <= 0) { gameOver(); } else { nextQuestion(); }
                }, 800);
            }
            updateUI();
        }

        function showCombo(text) {
            const el = $("ui-combo");
            el.textContent = text;
            el.classList.add("show");
            setTimeout(() => el.classList.remove("show"), 800);
        }

        function updateUI() {
            $("ui-score").textContent = currentScore + " 分";
            const timerEl = $("ui-timer");
            timerEl.style.width = timeLeft + "%";
            // 时间越少变红
            if (timeLeft < 30) {
                timerEl.style.background = "#f56565";
            } else {
                timerEl.style.background = "#48bb78";
            }
        }

        function pauseGame() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function gameOver() {
            pauseGame();
            $("final-score").textContent = currentScore;
            $("gameover-screen").classList.remove("hidden");
        }

        function restartGame() {
            startGame();
        }

        // ================= 付费验证 =================
        function checkCode() {
            const code = document.getElementById("code-input").value.trim();
            // 你的激活码逻辑
            if (code === "VIP888") {
                isLocked = true;
                $("paywall-screen").classList.add("hidden");
                // 奖励时间并继续
                timeLeft = 100;
                updateUI();
                startTimer();
                nextQuestion();
            } else {
                alert("激活码错误");
            }
        }
    </script>
</body>
</html>
