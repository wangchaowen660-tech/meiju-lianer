<style>

@media(max-width:480px){.english{font-size:24px;}.chunk{font-size:24px;}.ctrl-btn{width:50px;height:50px;font-size:28px;}.ctrl-btn.play-btn{width:70px;height:70px;font-size:36px;}.ctrl-btn.cn-btn{width:50px;height:50px;font-size:24px;}#sceneSelect{font-size:13px;padding:0 8px;min-width:90px;}.search-wrapper .input-group input{font-size:14px;}.api-settings input{min-width:80px;font-size:13px;}.avatar-wrap{width:80px;height:80px;top:8px;right:8px;}}

<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header"><h1>🎧 Listen & Speak</h1><p>组词造句连读 · 中文完整句</p></div>

<!-- API 设置 -->
<div class="api-settings">
  <input id="apiKeyInput" type="password" placeholder="API Key (DeepSeek/OpenAI)" style="flex:2;">
  <input id="apiBaseInput" type="url" placeholder="API Base URL" value="https://api.deepseek.com/v1" style="flex:1.5;">
  <button class="save-btn" onclick="saveApiConfig()">💾 保存</button>
  <span class="api-status" id="apiStatus">未设置</span>
</div>

<!-- 搜索 -->
<div class="search-wrapper">
  <select id="sceneSelect"><option value="">📂 全部场景</option></select>
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="Search English or Chinese" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<!-- 主卡片 -->
<div class="card">
  <div class="avatar-wrap"><canvas id="avatarCanvas" width="220" height="220"></canvas></div>

  <div id="scene" class="scene">Basic Needs</div>
  <div id="progress" class="progress">Chunk 1 / 600+</div>
  <div class="chunk-label">母句语块 (Core Chunk)</div>
  <div id="chunk" class="chunk">I want to...</div>

  <div class="english"><span id="english">I want to eat.</span></div>
  <div id="chinese" class="chinese">我想吃东西。</div>
  <div class="sentence-hint" id="sentenceHint">💡 点击替换词 → 造句连读</div>

  <div class="replace-title">🔁 替换词 (点击造句连读)</div>
  <div id="replaceList" class="replace-list"></div>

  <div class="player-controls">
    <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
    <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
  </div>
  <div id="cnStatus" class="cn-status">Chinese audio available: first 50 sentences</div>
  <div class="extra-buttons">
    <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
    <button onclick="playPattern()">🧩 Pattern</button>
    <button onclick="randomSentence()">🎲 Random</button>
    <button id="micBtn" class="mic-toggle" onclick="toggleMic()">🎤 Voice</button>
    <button id="aiToggle" class="ai-toggle" onclick="toggleChat()">💬 AI Chat</button>
    <button id="unlockCnBtn" class="unlock-cn-btn" onclick="showUnlockDialog()">🔓 Unlock Chinese</button>
    <button class="get-code-btn" onclick="getUnlockCode()">🔑 Get Code</button>
    <button class="reset-audio-btn" onclick="resetAudio()">🔊 修复音频</button>
  </div>
  <div id="chatBox" class="chat-box"></div>
  <div id="chatInputArea" class="chat-input-area">
    <input id="chatInput" type="text" placeholder="输入消息，Enter 发送" autocomplete="off">
    <button onclick="sendTextMessage()">Send</button>
  </div>
  <div id="status" class="status">Ready</div>
  <div id="adminPanel" class="admin-panel">
    <h4>🔐 Admin Panel</h4>
    <input type="password" id="adminPwd" placeholder="Enter admin password">
    <button onclick="adminLogin()">Login</button>
    <div id="adminContent" style="display:none; margin-top:12px;">
        <select id="levelSelect"><option value="20">Unlock 20</option><option value="50">Unlock 50</option><option value="100">Unlock 100</option></select>
        <button onclick="generateCnCode()">Generate Unlock Code</button>
        <div class="code-box" id="generatedCode">Click generate</div>
        <button onclick="hideAdmin()" style="background:#ef4444;">Close Panel</button>
    </div>
  </div>
</div>
<div style="text-align:center;margin-top:16px;font-size:13px;color:#b9c2d0;">点击替换词 → 自动造句连读</div>
</div>

<script>
// ========================================================================
// 1. 完整的 112 个核心模板（内容同前，此处省略以节省篇幅，实际代码会包含全部）
// 注意：在实际部署时，coreChunks 数组必须完整（112个模板），否则短句数量不足。
// 为了确保代码可运行，此处仅保留结构，实际使用请从上一版本复制完整数据。
// ========================================================================
// 由于回答长度限制，我将 coreChunks 精简为前3个示例，实际请替换为完整数据。
// 您可从我上一回复中复制完整的 coreChunks。
// ⚠️ 警告：以下 coreChunks 仅为示例，实际必须包含全部112个。
// ========================================================================
const coreChunks = [
// ----- 基础需求 -----
["基础需求","我想……","I want to...","I want to eat.","我想吃东西。",["eat|吃","go|去","sleep|睡觉","work|工作","learn English|学英语","drink water|喝水","read|阅读","write|写作","cook|做饭","travel|旅行","sing|唱歌","dance|跳舞","run|跑步","swim|游泳","drive|开车"]],
["基础需求","我需要……","I need...","I need some water.","我需要一些水。",["water|水","help|帮助","money|钱","time|时间","food|食物","rest|休息","space|空间","information|信息","advice|建议","support|支持","luck|运气","energy|精力","confidence|信心","change|零钱"]],
["基础需求","我要……","I want...","I want some food.","我要一些食物。",["food|食物","water|水","coffee|咖啡","money|钱","help|帮助","a break|休息","a chance|机会","a job|工作","a car|汽车","a phone|电话","a ticket|票","a gift|礼物"]],
// ... 请补充完整的 112 个模板
];
// 警告：上述 coreChunks 仅包含前3个，实际必须替换为完整的112个。
// ========================================================================

// ========================================================================
// 2. 工具函数
// ========================================================================
function cleanSpeechText(text) {
    if (!text) return '';
    return text.replace(/\.{3,}/g, '').replace(/…/g, '').replace(/\s+/g, ' ').trim() || text;
}

// ========================================================================
// 3. 展开模板
// ========================================================================
function expandTemplates(templates) {
    const result = [];
    templates.forEach(tpl => {
        const [scene, chunk, pattern, en, cn, replacements] = tpl;
        result.push({ scene, chunk, pattern, en: cleanSpeechText(en), cn, replace: replacements, isPremium: false });
        if (replacements && replacements.length) {
            replacements.forEach(r => {
                const parts = r.split('|');
                if (parts.length < 2) return;
                const enWord = parts[0].trim();
                const cnWord = parts[1].trim();
                let newEn = en;
                let newCn = cn;
                if (pattern.includes('...')) {
                    newEn = pattern.replace(/\.{3}/g, enWord);
                } else {
                    const words = en.split(' ');
                    if (words.length > 0) { words[words.length - 1] = enWord; newEn = words.join(' '); }
                    else { newEn = enWord; }
                }
                if (cn.includes('……')) {
                    newCn = cn.replace(/……/g, cnWord);
                } else {
                    // 改进中文处理：保留完整句子，替换最后一个"词"（用正则匹配最后一个汉字词）
                    // 简单做法：去掉末尾标点后替换最后一个词，再补回标点
                    const punctuation = cn.match(/[，,、。.！!？?]+$/); // 末尾标点
                    const punc = punctuation ? punctuation[0] : '';
                    let base = cn.replace(/[，,、。.！!？?]+$/, '');
                    // 尝试替换 base 中最后一个词（以空格或汉字分隔）
                    const words_cn = base.match(/[\u4e00-\u9fa5]+/g) || [];
                    if (words_cn.length > 0) {
                        const lastWord = words_cn[words_cn.length - 1];
                        base = base.replace(lastWord, cnWord);
                    } else {
                        base += cnWord;
                    }
                    newCn = base + punc;
                }
                newEn = cleanSpeechText(newEn);
                if (!newEn) newEn = enWord;
                result.push({
                    scene,
                    chunk: chunk + ' (' + enWord + ')',
                    pattern: newEn,
                    en: newEn,
                    cn: newCn,
                    replace: replacements,
                    isPremium: false
                });
            });
        }
    });
    return result;
}
let lessons = expandTemplates(coreChunks);
console.log('✅ 总短句数:', lessons.length);

// ========================================================================
// 4. DOM 引用 & 人像绘制（与之前相同，此处略）
// ========================================================================
const dom = {
    scene: document.getElementById("scene"),
    progress: document.getElementById("progress"),
    chunk: document.getElementById("chunk"),
    english: document.getElementById("english"),
    chinese: document.getElementById("chinese"),
    replaceList: document.getElementById("replaceList"),
    status: document.getElementById("status"),
    playPauseBtn: document.getElementById("playPauseBtn"),
    repeatBtn: document.getElementById("repeatBtn"),
    searchInput: document.getElementById("searchInput"),
    results: document.getElementById("results"),
    toast: document.getElementById("toast"),
    micBtn: document.getElementById("micBtn"),
    chatBox: document.getElementById("chatBox"),
    chatInput: document.getElementById("chatInput"),
    aiToggle: document.getElementById("aiToggle"),
    sentenceHint: document.getElementById("sentenceHint")
};
let toastTimer;
function showToast(t) {
    dom.toast.textContent = t;
    dom.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => dom.toast.classList.remove("show"), 1800);
}

// 人像绘制（简略，实际使用时包含精细绘制）
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const w = 220, h = 220;
function drawDetailedFace() {
    ctx.clearRect(0, 0, w, h);
    const cx = w/2, cy = h/2 - 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 80, 0, Math.PI*2);
    ctx.fillStyle = '#f5d0b0';
    ctx.fill();
    ctx.strokeStyle = '#dbb098';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}
drawDetailedFace();
let baseImageData = ctx.getImageData(0, 0, w, h);
const mouthX = w/2, mouthY = h/2 + 30, mouthW = 32, mouthHBase = 10;
function drawMouth(open) {
    ctx.putImageData(baseImageData, 0, 0);
    const h = mouthHBase + open * 28;
    const x = mouthX - 3;
    ctx.beginPath();
    ctx.ellipse(x, mouthY, mouthW, h, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(200, 130, 140, 0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(160, 90, 100, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (open > 0.6) {
        ctx.beginPath();
        ctx.ellipse(x, mouthY + 8, 10, 6, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(232, 112, 122, 0.4)';
        ctx.fill();
    }
}
let mouthOpen = 0.1, isSpeakingState = false, mouthTimer = null;
function updateMouth(target) {
    mouthOpen += (target - mouthOpen) * 0.15;
    drawMouth(mouthOpen);
}
function startSpeaking() {
    isSpeakingState = true;
    if (mouthTimer) clearInterval(mouthTimer);
    let phase = 0;
    mouthTimer = setInterval(() => {
        phase += 0.3;
        const target = (Math.sin(phase) * 0.5 + 0.5) * 0.8 + 0.2;
        updateMouth(target);
    }, 50);
}
function stopSpeaking() {
    isSpeakingState = false;
    if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
    let closeStep = 0;
    function closeMouth() {
        if (closeStep < 15) {
            mouthOpen *= 0.9;
            if (mouthOpen < 0.05) mouthOpen = 0.05;
            drawMouth(mouthOpen);
            closeStep++;
            setTimeout(closeMouth, 25);
        } else {
            mouthOpen = 0.05;
            drawMouth(0.05);
        }
    }
    closeMouth();
}
document.getElementById('photoInput')?.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
            const size = Math.min(img.width, img.height);
            const sx = (img.width - size) / 2;
            const sy = (img.height - size) / 2;
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, sx, sy, size, size, 0, 0, w, h);
            baseImageData = ctx.getImageData(0, 0, w, h);
            drawMouth(0.05);
            showToast('✅ 照片已应用');
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});
setTimeout(() => {
    baseImageData = ctx.getImageData(0, 0, w, h);
    drawMouth(0.05);
}, 100);

// ========================================================================
// 5. 语音引擎（与之前相同，略）
// ========================================================================
let currentIndex = 0, isSpeaking = false, currentUtterance = null;
let isRepeating = false, repeatCount = 0, repeatTimer = null;
let playQueue = [], isProcessingQueue = false, retryCount = 0;
const MAX_RETRY = 2, REPEAT_TIMES = 5;

function getAvailableLessons() { return lessons; }
function getCurrentItem() {
    const a = getAvailableLessons();
    if (!a.length) return null;
    if (currentIndex >= a.length) currentIndex = 0;
    const item = a[currentIndex];
    if (!item || !item.en) { currentIndex = 0; return a[0] || null; }
    return item;
}
function stopSpeech() {
    if (currentUtterance) { try { window.speechSynthesis.cancel(); } catch(e) {} currentUtterance = null; }
    isSpeaking = false;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    playQueue = [];
    isProcessingQueue = false;
    stopSpeaking();
}
function speakNative(text, cb) {
    if (!text || text.trim() === '') { cb(false, 'Empty'); return; }
    if (!window.speechSynthesis) { cb(false, 'No speechSynthesis'); return; }
    let voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) {
        window.speechSynthesis.onvoiceschanged = function() {
            voices = window.speechSynthesis.getVoices();
            doSpeak();
        };
        setTimeout(() => {
            voices = window.speechSynthesis.getVoices();
            if (voices && voices.length > 0) doSpeak();
            else doSpeak();
        }, 500);
        return;
    }
    doSpeak();
    function doSpeak() {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.7;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        let ended = false;
        const timeoutId = setTimeout(() => {
            if (!ended) { ended = true; window.speechSynthesis.cancel(); currentUtterance = null; isSpeaking = false; dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused"); cb(false, 'Timeout'); stopSpeaking(); }
        }, 8000);
        utterance.onstart = function() {
            if (currentUtterance !== utterance) return;
            isSpeaking = true;
            dom.playPauseBtn.textContent = "⏸";
            dom.playPauseBtn.classList.add("paused");
            dom.status.textContent = "🎧 Speaking...";
            dom.status.className = "status speaking";
            startSpeaking();
        };
        utterance.onend = function() {
            if (ended) return;
            ended = true; clearTimeout(timeoutId);
            isSpeaking = false; currentUtterance = null;
            dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
            dom.status.textContent = "✅ Done"; dom.status.className = "status done";
            stopSpeaking();
            cb(true);
        };
        utterance.onerror = function(e) {
            if (ended) return;
            ended = true; clearTimeout(timeoutId);
            isSpeaking = false; currentUtterance = null;
            dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
            stopSpeaking();
            cb(false, 'TTS error: ' + e.error);
        };
        currentUtterance = utterance;
        try { window.speechSynthesis.speak(utterance); }
        catch(err) { clearTimeout(timeoutId); ended = true; isSpeaking = false; currentUtterance = null; cb(false, 'Exception: ' + err.message); stopSpeaking(); }
    }
}
function speakText(text, cb) {
    const clean = cleanSpeechText(text);
    if (!clean) { if (cb) cb(false); return; }
    playQueue.push({ text: clean, cb, retries: 0 });
    processQueue();
}
function processQueue() {
    if (isProcessingQueue || playQueue.length === 0) return;
    isProcessingQueue = true;
    const task = playQueue.shift();
    const { text, cb, retries } = task;
    function onResult(success, msg) {
        if (success) {
            isProcessingQueue = false; if (cb) cb(true);
            if (playQueue.length > 0) processQueue();
        } else {
            if (retries < MAX_RETRY) {
                task.retries = retries + 1;
                playQueue.unshift(task);
                isProcessingQueue = false;
                setTimeout(processQueue, 500);
            } else {
                isProcessingQueue = false; if (cb) cb(false);
                dom.status.textContent = "⚠️ Playback failed."; dom.status.className = "status error";
                if (playQueue.length > 0) processQueue();
            }
        }
    }
    speakNative(text, onResult);
}

// ========================================================================
// 6. 核心功能：组词造句连读（中文完整句）
// ========================================================================
function buildFullSentence(item, enWord, cnWord) {
    let newEn = item.en;
    let newCn = item.cn;
    // 英文处理：优先用 pattern 中的 ...
    if (item.pattern.includes('...')) {
        newEn = item.pattern.replace(/\.{3}/g, enWord);
    } else {
        const words = item.en.split(' ');
        if (words.length > 0) {
            words[words.length - 1] = enWord;
            newEn = words.join(' ');
        }
    }
    // ★★★ 中文处理：保证完整一句话 ★★★
    if (item.cn.includes('……')) {
        newCn = item.cn.replace(/……/g, cnWord);
    } else {
        // 提取末尾标点，保留
        const punctuation = item.cn.match(/[，,、。.！!？?]+$/);
        const punc = punctuation ? punctuation[0] : '';
        let base = item.cn.replace(/[，,、。.！!？?]+$/, '');
        // 尝试替换 base 中最后一个汉字词（保留前面的内容）
        const words_cn = base.match(/[\u4e00-\u9fa5]+/g) || [];
        if (words_cn.length > 0) {
            const lastWord = words_cn[words_cn.length - 1];
            // 替换最后一个词，但注意避免替换到标点
            const lastIndex = base.lastIndexOf(lastWord);
            if (lastIndex !== -1) {
                base = base.substring(0, lastIndex) + cnWord + base.substring(lastIndex + lastWord.length);
            } else {
                base += cnWord;
            }
        } else {
            base += cnWord;
        }
        newCn = base + punc;
    }
    newEn = cleanSpeechText(newEn);
    if (!newEn) newEn = enWord;
    return { en: newEn, cn: newCn };
}

function playReplaceWord(word) {
    if (!word) return;
    const parts = word.split('|');
    if (parts.length < 2) return;
    const enWord = parts[0].trim();
    const cnWord = parts[1].trim();

    const item = getCurrentItem();
    if (!item) return;

    const full = buildFullSentence(item, enWord, cnWord);
    if (!full.en) return;

    dom.english.textContent = full.en;
    dom.chinese.textContent = full.cn;
    dom.sentenceHint.innerHTML = `✅ 造句连读：<span class="highlight">${enWord}</span> (${cnWord})`;

    document.querySelectorAll('.replace-item').forEach(el => el.classList.remove('active'));
    const items = dom.replaceList.querySelectorAll('.replace-item');
    items.forEach(el => {
        if (el.textContent === word) el.classList.add('active');
    });

    stopSpeech();
    setTimeout(() => {
        dom.status.textContent = `🔊 连读造句: ${full.en}`;
        dom.status.className = 'status speaking';
        speakText(full.en, function(success) {
            if (!success) {
                dom.status.textContent = "⚠️ 连读失败";
                dom.status.className = "status error";
            }
        });
    }, 150);
}

function restoreOriginalSentence() {
    const item = getCurrentItem();
    if (!item) return;
    dom.english.textContent = item.en;
    dom.chinese.textContent = item.cn;
    dom.sentenceHint.innerHTML = '💡 点击替换词 → 造句连读';
    document.querySelectorAll('.replace-item').forEach(el => el.classList.remove('active'));
}

function showSentence() {
    const item = getCurrentItem();
    if (!item) return;
    const a = getAvailableLessons();
    dom.scene.textContent = item.scene || 'Unknown';
    dom.progress.textContent = `Chunk ${currentIndex+1} / ${a.length}`;
    dom.chunk.textContent = item.chunk || '';
    restoreOriginalSentence();
    dom.replaceList.innerHTML = "";
    if (item.replace && item.replace.length) {
        item.replace.forEach(function(word) {
            const span = document.createElement("span");
            span.className = "replace-item";
            span.textContent = word;
            span.title = "点击造句连读";
            span.onclick = function(e) {
                e.stopPropagation();
                playReplaceWord(word);
            };
            dom.replaceList.appendChild(span);
        });
    }
    dom.status.textContent = "Ready";
    dom.status.className = "status";
    updateCnStatus();
}

function playCurrent() {
    if (isSpeaking) { stopSpeech(); setTimeout(playCurrent, 200); return; }
    const item = getCurrentItem();
    if (!item || !item.en) { dom.status.textContent = "⚠️ No valid sentence"; dom.status.className = "status error"; showToast('No valid sentence'); return; }
    restoreOriginalSentence();
    const cleanText = cleanSpeechText(item.en);
    if (!cleanText) { dom.status.textContent = "⚠️ Empty sentence"; dom.status.className = "status error"; showToast('Empty sentence'); return; }
    dom.status.textContent = "⏳ Loading..."; dom.status.className = "status";
    if (playQueue.length > 0) { playQueue = []; isProcessingQueue = false; }
    speakText(cleanText, function(success) {
        if (!success) {
            dom.status.textContent = "⚠️ Playback failed"; dom.status.className = "status error";
        }
    });
}

    repeatCount++; dom.status.textContent = `🔁 Repeat ${repeatCount}/${REPEAT_TIMES}`; dom.status.className = "status";
    const item = getCurrentItem(); if (!item) { stopSpeech(); return; }

        repeatTimer = setTimeout(doRepeat, 600);

// 搜索、场景筛选（与之前相同）
function searchSentence() {
    const keyword = dom.searchInput.value.trim().toLowerCase();
    dom.results.innerHTML = "";
    if (!keyword) { showToast("Enter a keyword"); return; }
    const available = getAvailableLessons();
    const matches = available.filter(item =>
        (item.chunk && item.chunk.toLowerCase().includes(keyword)) ||
        (item.pattern && item.pattern.toLowerCase().includes(keyword)) ||
        (item.en && item.en.toLowerCase().includes(keyword)) ||
        (item.cn && item.cn.includes(keyword)) ||
        (item.scene && item.scene.toLowerCase().includes(keyword))
    );
    if (matches.length === 0) { dom.results.innerHTML = `<div class="no-result">🔍 No matching chunks found</div>`; return; }
    matches.slice(0, 30).forEach(function(item) {
        const box = document.createElement("div");
        box.className = "result";
        box.innerHTML = `<div class="result-en">${item.chunk || ''} · ${item.pattern || ''}${item.isPremium ? ' ⭐' : ''}</div><div class="result-cn">${item.cn || ''}</div>`;
        box.onclick = function() {
            stopSpeech();
            const idx = available.indexOf(item);
            if (idx !== -1) currentIndex = idx;
            showSentence();
            dom.results.innerHTML = "";
            dom.searchInput.value = "";
            setTimeout(playCurrent, 150);
            showToast("Jumped to chunk");
        };
        dom.results.appendChild(box);
    });
}
function populateSceneSelect() {
    const select = document.getElementById('sceneSelect');
    if (!select) return;
    const scenes = new Set();
    lessons.forEach(item => {
        let scene = item.scene || 'Unknown';
        scene = scene.replace(/^⭐\s*/, '').trim();
        if (scene) scenes.add(scene);
    });
    select.innerHTML = '<option value="">📂 全部场景</option>';
    Array.from(scenes).sort().forEach(scene => {
        const opt = document.createElement('option');
        opt.value = scene;
        opt.textContent = scene;
        select.appendChild(opt);
    });
    select.removeEventListener('change', select._changeHandler);
    select._changeHandler = function() {
        dom.searchInput.value = this.value;
        searchSentence();
    };
    select.addEventListener('change', select._changeHandler);
}
