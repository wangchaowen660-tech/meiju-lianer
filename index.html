<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学英语 · 逛好物</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fa;color:#1e293b;}
.container{max-width:900px;margin:0 auto;padding:0 14px;}

/* 顶部导航 */
header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.04);position:sticky;top:0;z-index:100;}
.header-inner{display:flex;justify-content:space-between;align-items:center;padding:12px 0;flex-wrap:wrap;gap:10px;}
.logo{font-size:22px;font-weight:800;color:#0f172a;}
.logo span{color:#e94560;}
.nav-tabs{display:flex;gap:6px;background:#f1f5f9;border-radius:30px;padding:3px;}
.nav-tab{padding:7px 22px;border:0;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:#64748b;transition:0.2s;}
.nav-tab.active{background:#0f172a;color:#fff;}

/* 通用卡片 */
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #e2e8f0;margin-bottom:14px;}

/* ===== 英语学习 ===== */
.scene-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.scene-bar label{font-weight:600;font-size:14px;white-space:nowrap;}
.scene-bar select{flex:1;min-width:120px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff;outline:none;cursor:pointer;}
.badge{background:#e94560;color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;}

.dialog-item{background:#f8fafc;border-radius:14px;padding:14px;border-left:4px solid #e94560;margin-bottom:12px;}
.dialog-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;}
.dialog-row.answer{border-top:1px dashed #e2e8f0;margin-top:6px;padding-top:10px;}
.dialog-label{font-weight:700;font-size:13px;min-width:36px;padding-top:3px;}
.dialog-label.q{color:#e94560;}
.dialog-label.a{color:#8b5cf6;}
.dialog-text{flex:1;}
.line-en{font-size:17px;font-weight:600;color:#0f172a;line-height:1.4;}
.line-cn{font-size:14px;color:#64748b;margin-top:2px;}
.speak-btn{flex-shrink:0;width:34px;height:34px;border:0;border-radius:50%;background:#e2e8f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.15s;}
.speak-btn:hover{background:#cbd5e1;}
.speak-btn.speaking{background:#e94560;color:#fff;}
.speak-btn.cn{background:#fef3c7;}
.speak-btn.cn:hover{background:#fde68a;}

.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.btn{padding:8px 18px;border:0;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;background:#e2e8f0;color:#1e293b;transition:0.15s;}
.btn:hover{background:#cbd5e1;}
.btn.primary{background:#e94560;color:#fff;}
.btn.primary:hover{background:#c73a54;}
.btn.dark{background:#0f172a;color:#fff;}
.btn.dark:hover{background:#1e293b;}

.status{text-align:center;font-size:12px;color:#94a3b8;margin-top:8px;min-height:18px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}

/* ===== 商品城 ===== */
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cat-btn{padding:6px 18px;border:1px solid #e2e8f0;border-radius:30px;background:#fff;font-size:13px;font-weight:500;color:#475569;cursor:pointer;transition:0.15s;}
.cat-btn:hover{background:#f1f5f9;}
.cat-btn.active{background:#0f172a;color:#fff;border-color:#0f172a;}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.product-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;cursor:pointer;transition:0.15s;}
.product-card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,0.07);}
.product-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);}
.product-body{padding:10px 12px 12px;}
.product-name{font-size:14px;font-weight:700;color:#0f172a;line-height:1.3;}
.product-name-en{font-size:11px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-price{margin-top:6px;color:#e94560;font-weight:800;font-size:16px;}
.product-price small{font-size:11px;font-weight:500;color:#94a3b8;text-decoration:line-through;margin-left:4px;}

/* 商品详情弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:200;justify-content:center;align-items:center;padding:16px;}
.modal.open{display:flex;}
.modal-box{background:#fff;border-radius:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative;}
.modal-close{position:absolute;top:14px;right:18px;font-size:26px;border:0;background:transparent;cursor:pointer;color:#94a3b8;}
.modal-close:hover{color:#0f172a;}
.modal-img{height:170px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);border-radius:16px;}
.modal-name{font-size:20px;font-weight:800;margin-top:14px;}
.modal-name-en{font-size:14px;color:#94a3b8;margin-top:2px;}
.modal-price{color:#e94560;font-weight:800;font-size:24px;margin-top:8px;}
.modal-price small{font-size:14px;color:#94a3b8;text-decoration:line-through;font-weight:500;margin-left:6px;}
.modal-section{margin-top:14px;}
.modal-section h4{font-size:13px;font-weight:700;color:#64748b;margin-bottom:6px;letter-spacing:0.5px;}
.modal-section .en{font-size:15px;color:#0f172a;line-height:1.5;}
.modal-section .cn{font-size:14px;color:#64748b;margin-top:4px;line-height:1.5;}

/* 询盘表单 */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.form-row .full{grid-column:1/-1;}
input,textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;font-family:inherit;transition:0.15s;}
input:focus,textarea:focus{border-color:#e94560;box-shadow:0 0 0 3px rgba(233,69,96,0.08);}
textarea{resize:vertical;min-height:80px;}
.form-success{display:none;background:#dcfce7;color:#166534;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:10px;}
.form-success.show{display:block;}

.empty-tip{text-align:center;padding:30px 10px;color:#94a3b8;font-size:14px;}
footer{text-align:center;padding:24px 0;color:#94a3b8;font-size:12px;}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr;}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .product-img{height:110px;font-size:44px;}
  .line-en{font-size:15px;}
}
</style>

  </div>

    <div class="product-grid" id="productGrid"></div>

    <!-- 询盘 -->
    <div class="card" id="inquiry" style="margin-top:20px;">

      <p style="color:#64748b;font-size:13px;margin-top:4px;">留下您的需求，我们会尽快联系您。</p>
      <form id="inquiryForm" onsubmit="submitInquiry(event)">
        <div class="form-row">
          <input type="text" placeholder="您的姓名 *" required>
          <input type="tel" placeholder="手机号 *" required>
          <input type="text" placeholder="微信号 / 邮箱" class="full">
          <textarea placeholder="您感兴趣的商品或需求..." class="full"></textarea>
          <div class="full">
            <button type="submit" class="btn primary" style="width:100%;padding:12px;">提交询盘</button>
          </div>
        </div>
      </form>
      <div class="form-success" id="formSuccess">✅ 已收到您的询盘，我们会尽快联系您！</div>
    </div>
  </div>

</div>

<footer>© 2026 学英语·逛好物 · 边学边买</footer>

<!-- 商品详情弹窗 -->
<div class="modal" id="productModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-img" id="mImg"></div>
    <div class="modal-name" id="mName"></div>
    <div class="modal-name-en" id="mNameEn"></div>
    <div class="modal-price" id="mPrice"></div>

    <div class="modal-section">

      <button class="btn dark" id="mSpeakBtn" style="margin-top:8px;" onclick="speakProductDesc()">🔊 朗读英文描述</button>
    </div>

    <div class="controls" style="margin-top:18px;">
      <button class="btn primary" onclick="scrollToInquiry()">📩 立即询盘</button>
      <button class="btn" onclick="closeModal()">继续逛逛</button>
    </div>
  </div>
</div>

  { scene:"工作", qEn:"Do you need any help?", qCn:"你需要帮忙吗？", aEn:"No, I'm fine, thank you.", aCn:"不用，我很好，谢谢。" },
  { scene:"工作", qEn:"Great job on the presentation!", qCn:"演示做得很好！", aEn:"Thank you! I appreciate it.", aCn:"谢谢！我很感激。" },

  { scene:"学习", qEn:"How do you spell 'necessary'?", qCn:"'necessary'怎么拼写？", aEn:"It's n-e-c-e-s-s-a-r-y.", aCn:"n-e-c-e-s-s-a-r-y。" },

const categoryNames = {
  all: "全部",
  home: "家居用品",

// ========================================================================
// 三、英语学习模块逻辑
// ========================================================================
let currentScene = "";
let dialogList = [];
let currentDialogIndex = 0;

const sceneSelect = document.getElementById("sceneSelect");
const dialogArea = document.getElementById("dialogArea");
const dialogCount = document.getElementById("dialogCount");
const statusEl = document.getElementById("status");

// 获取所有场景
function getAllScenes() {
  const set = new Set();
  dialogPool.forEach(d => set.add(d.scene));
  return Array.from(set);
}

// 初始化场景下拉
function initScenes() {
  const scenes = getAllScenes();
  sceneSelect.innerHTML = "";
  scenes.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    sceneSelect.appendChild(opt);
  });
  sceneSelect.value = scenes[0] || "";
  currentScene = scenes[0] || "";
  loadScene(currentScene);
}

// 加载场景
function loadScene(scene) {
  currentScene = scene;
  dialogList = dialogPool.filter(d => d.scene === scene);
  currentDialogIndex = 0;
  dialogCount.textContent = dialogList.length + " 组";
  renderDialog();
}

// 渲染当前对话
function renderDialog() {
  if (!dialogList.length) {
    dialogArea.innerHTML = '<div class="empty-tip">该场景暂无对话</div>';
    return;
  }
  if (currentDialogIndex >= dialogList.length) currentDialogIndex = 0;
  if (currentDialogIndex < 0) currentDialogIndex = dialogList.length - 1;

  const d = dialogList[currentDialogIndex];
  dialogArea.innerHTML = `
    <div class="dialog-item">
      <div class="dialog-row">
        <span class="dialog-label q">问</span>
        <div class="dialog-text">
          <div class="line-en">${d.qEn}</div>
          <div class="line-cn">${d.qCn}</div>
        </div>
        <button class="speak-btn" onclick="speak('${escapeQuote(d.qEn)}','en-US')">🔊</button>
        <button class="speak-btn cn" onclick="speak('${escapeQuote(d.qCn)}','zh-CN')">中</button>
      </div>
      <div class="dialog-row answer">
        <span class="dialog-label a">答</span>
        <div class="dialog-text">
          <div class="line-en">${d.aEn}</div>
          <div class="line-cn">${d.aCn}</div>
        </div>
        <button class="speak-btn" onclick="speak('${escapeQuote(d.aEn)}','en-US')">🔊</button>
        <button class="speak-btn cn" onclick="speak('${escapeQuote(d.aCn)}','zh-CN')">中</button>
      </div>
    </div>
    <div style="text-align:center;color:#94a3b8;font-size:12px;">第 ${currentDialogIndex + 1} / ${dialogList.length} 组</div>
  `;
}

// 转义引号，避免内联onclick出错
function escapeQuote(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// 上一组 / 下一组
function prevDialog() {
  if (!dialogList.length) return;
  currentDialogIndex = (currentDialogIndex - 1 + dialogList.length) % dialogList.length;
  renderDialog();
}
function nextDialog() {
  if (!dialogList.length) return;
  currentDialogIndex = (currentDialogIndex + 1) % dialogList.length;
  renderDialog();
}

// 整组朗读：先英文问句 → 中文问句 → 英文答句 → 中文答句
function playAll() {
  if (!dialogList.length) return;
  const d = dialogList[currentDialogIndex];
  speak(d.qEn, "en-US", () => {
    speak(d.qCn, "zh-CN", () => {
      speak(d.aEn, "en-US", () => {
        speak(d.aCn, "zh-CN");
      });
    });
  });
}

// ========================================================================
// 四、语音引擎（稳定版）
// ========================================================================
function speak(text, lang, callback) {
  if (!window.speechSynthesis) {
    statusEl.textContent = "❌ 浏览器不支持语音";
    statusEl.className = "status";
    if (callback) callback();
    return;
  }
  try { window.speechSynthesis.cancel(); } catch (e) {}

  const clean = String(text).replace(/[.…]{2,}/g, "").trim();
  if (!clean) { if (callback) callback(); return; }

  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = lang || (/[\u4e00-\u9fa5]/.test(clean) ? "zh-CN" : "en-US");
    u.rate = 0.95;
    u.pitch = 1.0;
    u.volume = 1.0;

    let ended = false;
    u.onstart = () => {
      statusEl.textContent = "🔊 朗读中...";
      statusEl.className = "status speaking";
    };
    u.onend = () => {
      if (ended) return; ended = true;
      statusEl.textContent = "✅ 播放完成";
      statusEl.className = "status done";
      if (callback) callback();
    };
    u.onerror = () => {
      if (ended) return; ended = true;
      statusEl.textContent = "⚠️ 播放失败";
      statusEl.className = "status";
      if (callback) callback();
    };
    try { window.speechSynthesis.speak(u); } catch (e) {
      if (callback) callback();
    }
  }, 60);
}

// ========================================================================
// 五、商品城模块逻辑
// ========================================================================
let currentCategory = "all";

// 初始化分类
function initCategories() {
  const box = document.getElementById("categories");
  box.innerHTML = "";
  Object.keys(categoryNames).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (key === "all" ? " active" : "");
    btn.dataset.cat = key;
    btn.textContent = categoryNames[key];
    btn.onclick = () => {
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = key;
      renderProducts();
    };
    box.appendChild(btn);
  });
}

// 渲染商品网格
function renderProducts() {
  const grid = document.getElementById("productGrid");
  const list = currentCategory === "all"
    ? products
    : products.filter(p => p.category === currentCategory);

  if (!list.length) {
    grid.innerHTML = '<div class="empty-tip" style="grid-column:1/-1;">该分类暂无商品，敬请期待～</div>';
    return;
  }

  grid.innerHTML = list.map(p => `
    <div class="product-card" onclick="openProduct(${p.id})">
      <div class="product-img">${p.emoji}</div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-name-en">${p.nameEn}</div>
        <div class="product-price">¥${p.price} ${p.originalPrice ? `<small>¥${p.originalPrice}</small>` : ""}</div>
      </div>
    </div>
  `).join("");
}

// ========================================================================
// 六、商品详情弹窗
// ========================================================================
let currentProduct = null;

function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;
  document.getElementById("mImg").textContent = p.emoji;
  document.getElementById("mName").textContent = p.name;
  document.getElementById("mNameEn").textContent = p.nameEn;
  document.getElementById("mPrice").innerHTML = `¥${p.price} ${p.originalPrice ? `<small>¥${p.originalPrice}</small>` : ""}`;
  document.getElementById("mDescEn").textContent = p.descEn;
  document.getElementById("mDescCn").textContent = p.descCn;
  document.getElementById("productModal").classList.add("open");
  resetProductSpeakBtn();
}

function closeModal() {
  document.getElementById("productModal").classList.remove("open");
  stopSpeech();
}

function scrollToInquiry() {
  closeModal();
  document.getElementById("shopModule").scrollIntoView({ behavior: "smooth" });
}

// 商品描述语音
let productSpeaking = false;

function resetProductSpeakBtn() {
  const btn = document.getElementById("mSpeakBtn");
  btn.textContent = "🔊 朗读英文描述";
  btn.classList.remove("primary");
  productSpeaking = false;
}

function stopSpeech() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  productSpeaking = false;
  resetProductSpeakBtn();
}

function speakProductDesc() {
  if (!currentProduct) return;
  if (productSpeaking) { stopSpeech(); return; }
  if (!window.speechSynthesis) { alert("您的浏览器不支持语音"); return; }

  try { window.speechSynthesis.cancel(); } catch (e) {}

  const u = new SpeechSynthesisUtterance(currentProduct.descEn);
  u.lang = "en-US";
  u.rate = 0.95;
  u.pitch = 1.0;
  u.volume = 1.0;

  const btn = document.getElementById("mSpeakBtn");
  btn.textContent = "⏹ 停止朗读";
  btn.classList.add("primary");
  productSpeaking = true;

  u.onend = () => { productSpeaking = false; resetProductSpeakBtn(); };
  u.onerror = () => { productSpeaking = false; resetProductSpeakBtn(); };

  window.speechSynthesis.speak(u);
}

// ========================================================================
// 七、询盘表单
// ========================================================================
function submitInquiry(e) {
  e.preventDefault();
  const box = document.getElementById("formSuccess");
  box.classList.add("show");
  e.target.reset();
  setTimeout(() => box.classList.remove("show"), 5000);
}

// ========================================================================
// 八、顶部导航切换
// ========================================================================
document.querySelectorAll(".nav-tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.tab;
    document.getElementById("learnModule").style.display = target === "learn" ? "block" : "none";
    document.getElementById("shopModule").style.display = target === "shop" ? "block" : "none";
    stopSpeech();
    if (target === "shop") renderProducts();
  };
});

// ========================================================================
// 九、初始化
// ========================================================================
function initApp() {
  // 英语学习
  initScenes();
  sceneSelect.onchange = () => loadScene(sceneSelect.value);

  // 商品城
  initCategories();
  renderProducts();

  // 预加载语音
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // ESC 关闭弹窗
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if (e.key === "ArrowLeft" && document.getElementById("learnModule").style.display !== "none") prevDialog();
    if (e.key === "ArrowRight" && document.getElementById("learnModule").style.display !== "none") nextDialog();
  });

  // 点击弹窗外部关闭
  document.getElementById("productModal").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });

  console.log("✅ 学英语·逛好物 已启动");
  console.log("📚 对话总数:", dialogPool.length, "组");
  console.log("🛍️ 商品总数:", products.length, "件");
}

initApp();
</script>
