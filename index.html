<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学英语 · 逛好物</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fa;color:#1e293b;-webkit-text-size-adjust:100%;}
.container{max-width:900px;margin:0 auto;padding:0 14px;}

/* 顶部导航 */
header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.04);position:sticky;top:0;z-index:100;}
.header-inner{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:8px;flex-wrap:wrap;}
.logo{font-size:19px;font-weight:800;color:#0f172a;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.logo .brand-shop{color:#e94560;position:relative;}
.logo .brand-shop .shop-badge{position:absolute;top:-8px;right:-24px;background:#22c55e;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;}

.nav-tabs{display:flex;gap:5px;background:#f1f5f9;border-radius:30px;padding:3px;}
.nav-tab{padding:7px 14px;border:0;border-radius:30px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#64748b;transition:0.2s;display:flex;align-items:center;gap:4px;}
.nav-tab.active{background:#0f172a;color:#fff;}
.nav-tab.shop-tab.active{background:#e94560;color:#fff;}
.nav-tab .tab-badge{background:#e94560;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:20px;text-align:center;}
.nav-tab.shop-tab.active .tab-badge{background:#fff;color:#e94560;}

.shop-entry-btn{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#e94560,#f97316);color:#fff;border:0;border-radius:30px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(233,69,96,0.25);transition:0.2s;}
.shop-entry-btn:hover{transform:translateY(-1px);}
.shop-entry-btn .mini-badge{background:#fff;color:#e94560;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;}

.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #e2e8f0;margin-bottom:14px;}

/* 英语学习 */
.scene-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.scene-bar label{font-weight:600;font-size:14px;white-space:nowrap;}
.scene-bar select{flex:1;min-width:120px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;}
.badge{background:#e94560;color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;}

.dialog-item{background:#f8fafc;border-radius:14px;padding:14px;border-left:4px solid #e94560;margin-bottom:12px;}
.dialog-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;}
.dialog-row.answer{border-top:1px dashed #e2e8f0;margin-top:6px;padding-top:10px;}
.dialog-label{font-weight:700;font-size:13px;min-width:36px;padding-top:3px;}
.dialog-label.q{color:#e94560;}
.dialog-label.a{color:#8b5cf6;}
.dialog-text{flex:1;min-width:0;}
.line-en{font-size:17px;font-weight:600;color:#0f172a;line-height:1.4;word-break:break-word;}
.line-cn{font-size:14px;color:#64748b;margin-top:2px;word-break:break-word;}
.speak-btn{flex-shrink:0;width:36px;height:36px;border:0;border-radius:50%;background:#e2e8f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.15s;-webkit-user-select:none;user-select:none;}
.speak-btn:active{transform:scale(0.92);}
.speak-btn.speaking{background:#e94560;color:#fff;}
.speak-btn.cn{background:#fef3c7;font-size:13px;font-weight:700;color:#92400e;}
.speak-btn.cn.speaking{background:#f59e0b;color:#fff;}

.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.btn{padding:9px 18px;border:0;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;background:#e2e8f0;color:#1e293b;transition:0.15s;}
.btn:active{transform:scale(0.96);}
.btn.primary{background:#e94560;color:#fff;}
.btn.dark{background:#0f172a;color:#fff;}

.status{text-align:center;font-size:12px;color:#94a3b8;margin-top:8px;min-height:18px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}

/* 商品城 */
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cat-btn{padding:7px 18px;border:1px solid #e2e8f0;border-radius:30px;background:#fff;font-size:13px;font-weight:500;color:#475569;cursor:pointer;}
.cat-btn.active{background:#0f172a;color:#fff;border-color:#0f172a;}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.product-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;cursor:pointer;transition:0.15s;}
.product-card:active{transform:scale(0.98);}
.product-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);}
.product-body{padding:10px 12px 12px;}
.product-name{font-size:14px;font-weight:700;color:#0f172a;line-height:1.3;}
.product-name-en{font-size:11px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-price{margin-top:6px;color:#e94560;font-weight:800;font-size:16px;}
.product-price small{font-size:11px;font-weight:500;color:#94a3b8;text-decoration:line-through;margin-left:4px;}

/* 弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:200;justify-content:center;align-items:center;padding:16px;}
.modal.open{display:flex;}
.modal-box{background:#fff;border-radius:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative;-webkit-overflow-scrolling:touch;}
.modal-close{position:absolute;top:14px;right:18px;font-size:26px;border:0;background:transparent;cursor:pointer;color:#94a3b8;line-height:1;}
.modal-img{height:170px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);border-radius:16px;}
.modal-name{font-size:20px;font-weight:800;margin-top:14px;}
.modal-name-en{font-size:14px;color:#94a3b8;margin-top:2px;}
.modal-price{color:#e94560;font-weight:800;font-size:24px;margin-top:8px;}
.modal-price small{font-size:14px;color:#94a3b8;text-decoration:line-through;font-weight:500;margin-left:6px;}
.modal-section{margin-top:14px;}
.modal-section h4{font-size:13px;font-weight:700;color:#64748b;margin-bottom:6px;letter-spacing:0.5px;}
.modal-section .en{font-size:15px;color:#0f172a;line-height:1.5;}
.modal-section .cn{font-size:14px;color:#64748b;margin-top:4px;line-height:1.5;}

/* 询盘 */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.form-row .full{grid-column:1/-1;}
input,textarea{width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;font-family:inherit;transition:0.15s;-webkit-appearance:none;appearance:none;}
input:focus,textarea:focus{border-color:#e94560;box-shadow:0 0 0 3px rgba(233,69,96,0.08);}
textarea{resize:vertical;min-height:80px;}
.form-success{display:none;background:#dcfce7;color:#166534;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:10px;}
.form-success.show{display:block;}

.empty-tip{text-align:center;padding:30px 10px;color:#94a3b8;font-size:14px;}
footer{text-align:center;padding:24px 0;color:#94a3b8;font-size:12px;}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr;}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .product-img{height:110px;font-size:44px;}
  .line-en{font-size:15px;}
  .logo{font-size:16px;}
  .nav-tab{padding:6px 10px;font-size:12px;}
  .shop-entry-btn{padding:6px 10px;font-size:12px;}
  .header-inner{gap:6px;}
}
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="logo">
      <span>学英语</span><span style="color:#e94560;font-weight:900;">·</span>
      <span class="brand-shop">逛好物<span class="shop-badge">商城</span></span>
    </div>
    <button class="shop-entry-btn" onclick="switchTab('shop')">
      🛍️ 商城 <span class="mini-badge">新品</span>
    </button>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="learn" onclick="switchTab('learn')">📚 学习</button>
      <button class="nav-tab shop-tab" data-tab="shop" onclick="switchTab('shop')">🛍️ 商品城 <span class="tab-badge" id="tabShopBadge">0</span></button>
    </div>
  </div>
</header>

<div class="container" style="padding-top:14px;padding-bottom:20px;">

  <div id="learnModule">
    <div class="card">
      <div class="scene-bar">
        <label>📌 场景</label>
        <select id="sceneSelect"></select>
        <span class="badge" id="dialogCount">0 组</span>
      </div>
      <div id="dialogArea"></div>
      <div class="controls">
        <button class="btn" onclick="prevDialog()">⏮ 上一组</button>
        <button class="btn primary" onclick="playAll()">▶ 整组朗读</button>
        <button class="btn" onclick="nextDialog()">下一组 ⏭</button>
      </div>
      <div class="status" id="status">就绪</div>
    </div>
  </div>

  <div id="shopModule" style="display:none;">
    <div class="categories" id="categories"></div>
    <div class="product-grid" id="productGrid"></div>
    <div class="card" style="margin-top:20px;">
      <h3 style="font-size:18px;font-weight:700;">📩 发送询盘</h3>
      <p style="color:#64748b;font-size:13px;margin-top:4px;">留下您的需求，我们会尽快联系您。</p>
      <form id="inquiryForm" onsubmit="submitInquiry(event)">
        <div class="form-row">
          <input type="text" placeholder="您的姓名 *" required>
          <input type="tel" placeholder="手机号 *" required>
          <input type="text" placeholder="微信号 / 邮箱" class="full">
          <textarea placeholder="您感兴趣的商品或需求..." class="full"></textarea>
          <div class="full">
            <button type="submit" class="btn primary" style="width:100%;padding:12px;">提交询盘</button>
          </div>
        </div>
      </form>
      <div class="form-success" id="formSuccess">✅ 已收到您的询盘，我们会尽快联系您！</div>
    </div>
  </div>

</div>

<footer>© 2026 学英语·逛好物 · 边学边买</footer>

<div class="modal" id="productModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-img" id="mImg"></div>
    <div class="modal-name" id="mName"></div>
    <div class="modal-name-en" id="mNameEn"></div>
    <div class="modal-price" id="mPrice"></div>
    <div class="modal-section">
      <h4>📖 商品英文描述（可朗读学习）</h4>
      <div class="en" id="mDescEn"></div>
      <div class="cn" id="mDescCn"></div>
      <button class="btn dark" id="mSpeakBtn" style="margin-top:8px;" onclick="speakProductDesc()">🔊 朗读英文描述</button>
    </div>
    <div class="controls" style="margin-top:18px;">
      <button class="btn primary" onclick="scrollToInquiry()">📩 立即询盘</button>
      <button class="btn" onclick="closeModal()">继续逛逛</button>
    </div>
  </div>
</div>

<script>
// ========================================================================
// 一、对话数据（200+组，16场景）
// ========================================================================
const dialogPool = [
  // 问候 (15)
  { scene:"问候", qEn:"Hello, how are you?", qCn:"你好，你好吗？", aEn:"I'm fine, thank you. And you?", aCn:"我很好，谢谢。你呢？" },
  { scene:"问候", qEn:"Good morning!", qCn:"早上好！", aEn:"Good morning! Did you sleep well?", aCn:"早上好！你睡得好吗？" },

  { scene:"问候", qEn:"How's your day going?", qCn:"你今天过得怎么样？", aEn:"It's going well, thanks!", aCn:"很好，谢谢！" },
  { scene:"问候", qEn:"What have you been up to?", qCn:"你最近在忙什么？", aEn:"I've been traveling a lot.", aCn:"我一直在旅行。" },
  { scene:"问候", qEn:"Where are you from?", qCn:"你来自哪里？", aEn:"I'm from China.", aCn:"我来自中国。" },
  { scene:"问候", qEn:"How old are you?", qCn:"你多大了？", aEn:"I'm twenty-five years old.", aCn:"我二十五岁。" },
  { scene:"问候", qEn:"Do you speak English?", qCn:"你会说英语吗？", aEn:"Yes, I speak a little.", aCn:"是的，我会说一点。" },

  // 餐厅 (15)
  { scene:"餐厅", qEn:"Could we have a table for two?", qCn:"我们可以要一张两人的桌子吗？", aEn:"Sure, this way please.", aCn:"当然，这边请。" },
  { scene:"餐厅", qEn:"What do you recommend?", qCn:"你推荐什么？", aEn:"The grilled fish is very popular.", aCn:"烤鱼很受欢迎。" },

  // 旅行 (15)
  { scene:"旅行", qEn:"Where is the nearest metro station?", qCn:"最近的地铁站在哪里？", aEn:"It's about five minutes' walk.", aCn:"步行大约五分钟。" },

  { scene:"旅行", qEn:"How do I get to the train station?", qCn:"我怎么去火车站？", aEn:"Take bus number 10.", aCn:"坐10路公交车。" },

// ========================================================================
// 四、【核心】iPad优化语音引擎
// ========================================================================
let speechReady = false;       // 是否已预热
let currentUtterance = null;   // 当前语音对象
let speakQueue = [];           // 播放队列
let isSpeaking = false;        // 是否正在播放

/**
 * 首次用户交互时调用，预热语音引擎
 * iOS 必须在用户手势中触发一次语音，后续才能正常播放
 */
function warmUpSpeech() {
  if (speechReady) return;
  if (!window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    u.rate = 1;
    u.onend = () => { speechReady = true; };
    u.onerror = () => { speechReady = true; };
    window.speechSynthesis.speak(u);
    speechReady = true;
  } catch (e) {
    speechReady = true;
  }
}

/**
 * 过滤 iOS 导致崩溃的特殊字符
 */
function cleanText(text) {
  return String(text)
    .replace(/[<>]/g, "")        // 移除尖括号
    .replace(/[.…]{2,}/g, "")    // 移除连续省略号
    .replace(/&[a-z]+;/gi, "")   // 移除HTML实体
    .replace(/\s+/g, " ")
    .trim();
}

/**
 * 将长文本拆分为短句（iOS 长文本容易卡顿）
 */
function splitText(text, maxLen = 120) {
  const clean = cleanText(text);
  if (clean.length <= maxLen) return [clean];
  // 按标点拆句
  const parts = clean.split(/(?<=[.!?。！？])\s*/);
  const result = [];
  let buf = "";
  for (const p of parts) {
    if ((buf + " " + p).trim().length > maxLen) {
      if (buf) result.push(buf.trim());
      buf = p;
    } else {
      buf = (buf + " " + p).trim();
    }
  }
  if (buf) result.push(buf.trim());
  return result.filter(x => x.length > 0);
}

/**
 * 播放一段文本（原子播放）
 */
function speakOne(text, lang) {
  return new Promise((resolve) => {
    const clean = cleanText(text);
    if (!clean) { resolve(); return; }

    const u = new SpeechSynthesisUtterance(clean);
    u.lang = lang || (/[\u4e00-\u9fa5]/.test(clean) ? "zh-CN" : "en-US");
    // iOS 语速限制在 0.5-1.5
    u.rate = Math.min(1.5, Math.max(0.5, 0.95));
    u.pitch = 1.0;
    u.volume = 1.0;

    let ended = false;
    const finish = () => {
      if (ended) return;
      ended = true;
      resolve();
    };
    u.onend = finish;
    u.onerror = finish;

    currentUtterance = u;
    try {
      window.speechSynthesis.speak(u);
    } catch (e) {
      finish();
    }
    // 安全超时：15秒未结束则强制 resolve
    setTimeout(finish, 15000);
  });
}

/**
 * 播放主函数（支持队列，串行播放，避免卡顿）
 */
async function speak(text, lang, callback) {
  if (!window.speechSynthesis) {
    statusEl.textContent = "❌ 浏览器不支持语音";
    statusEl.className = "status error";
    if (callback) callback();
    return;
  }

  // 首次播放时预热
  warmUpSpeech();

  // 打断当前播放
  try { window.speechSynthesis.cancel(); } catch (e) {}
  isSpeaking = true;

  const parts = splitText(text, 120);
  statusEl.textContent = "🔊 朗读中...";
  statusEl.className = "status speaking";

  for (let i = 0; i < parts.length; i++) {
    if (!isSpeaking) break; // 被新的播放打断
    await speakOne(parts[i], lang);
    // 多段之间加 80ms 间隔，避免 iOS 引擎忙不过来
    if (i < parts.length - 1) {
      await new Promise(r => setTimeout(r, 80));
    }
  }

  isSpeaking = false;
  statusEl.textContent = "✅ 播放完成";
  statusEl.className = "status done";
  if (callback) callback();
}

/**
 * 停止播放
 */
function stopSpeech() {
  isSpeaking = false;
  if (window.speechSynthesis) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  currentUtterance = null;
}

function getAllScenes() {
  const set = new Set();
  dialogPool.forEach(d => set.add(d.scene));
  return Array.from(set);
}

function initScenes() {
  const scenes = getAllScenes();
  sceneSelect.innerHTML = "";
  scenes.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    sceneSelect.appendChild(opt);
  });
  sceneSelect.value = scenes[0] || "";
  currentScene = scenes[0] || "";
  loadScene(currentScene);
}

function loadScene(scene) {
  currentScene = scene;
  dialogList = dialogPool.filter(d => d.scene === scene);
  currentDialogIndex = 0;
  dialogCount.textContent = dialogList.length + " 组";
  renderDialog();
}

function escapeQuote(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function renderDialog() {
  if (!dialogList.length) {
    dialogArea.innerHTML = '<div class="empty-tip">该场景暂无对话</div>';
    return;
  }
  if (currentDialogIndex >= dialogList.length) currentDialogIndex = 0;
  if (currentDialogIndex < 0) currentDialogIndex = dialogList.length - 1;

  const d = dialogList[currentDialogIndex];
  dialogArea.innerHTML = `
    <div class="dialog-item">
      <div class="dialog-row">
        <span class="dialog-label q">问</span>
        <div class="dialog-text">
          <div class="line-en">${d.qEn}</div>
          <div class="line-cn">${d.qCn}</div>
        </div>
        <button class="speak-btn" onclick="onSpeak('${escapeQuote(d.qEn)}','en-US',this)">🔊</button>
        <button class="speak-btn cn" onclick="onSpeak('${escapeQuote(d.qCn)}','zh-CN',this)">中</button>
      </div>
      <div class="dialog-row answer">
        <span class="dialog-label a">答</span>
        <div class="dialog-text">
          <div class="line-en">${d.aEn}</div>
          <div class="line-cn">${d.aCn}</div>
        </div>
        <button class="speak-btn" onclick="onSpeak('${escapeQuote(d.aEn)}','en-US',this)">🔊</button>
        <button class="speak-btn cn" onclick="onSpeak('${escapeQuote(d.aCn)}','zh-CN',this)">中</button>
      </div>
    </div>
    <div style="text-align:center;color:#94a3b8;font-size:12px;">第 ${currentDialogIndex + 1} / ${dialogList.length} 组</div>
  `;
}

// 按钮点击处理（含高亮状态）
function onSpeak(text, lang, btn) {
  // 清除所有按钮的高亮
  document.querySelectorAll(".speak-btn").forEach(b => b.classList.remove("speaking"));
  if (btn) btn.classList.add("speaking");

  speak(text, lang, () => {
    if (btn) btn.classList.remove("speaking");
  });
}

function prevDialog() {
  if (!dialogList.length) return;
  stopSpeech();
  currentDialogIndex = (currentDialogIndex - 1 + dialogList.length) % dialogList.length;
  renderDialog();
}
function nextDialog() {
  if (!dialogList.length) return;
  stopSpeech();
  currentDialogIndex = (currentDialogIndex + 1) % dialogList.length;
  renderDialog();
}

/**
 * 整组朗读：问英 → 问中 → 答英 → 答中
 * 使用异步串行，避免 iOS 卡顿
 */
async function playAll() {
  if (!dialogList.length) return;
  stopSpeech();
  const d = dialogList[currentDialogIndex];

  // 清除高亮
  document.querySelectorAll(".speak-btn").forEach(b => b.classList.remove("speaking"));

  const steps = [
    { text: d.qEn, lang: "en-US" },
    { text: d.qCn, lang: "zh-CN" },
    { text: d.aEn, lang: "en-US" },
    { text: d.aCn, lang: "zh-CN" }
  ];

  for (const step of steps) {
    await new Promise(resolve => {
      speak(step.text, step.lang, resolve);
    });
    await new Promise(r => setTimeout(r, 150));
    if (!isSpeaking) break;
  }
}

// ========================================================================
// 十、初始化
// ========================================================================
function initApp() {
  initScenes();
  sceneSelect.onchange = () => loadScene(sceneSelect.value);
  initCategories();
  renderProducts();

  // 首次点击页面任意处，预热语音引擎（iOS必须）
  document.addEventListener("touchstart", function onFirstTouch() {
    warmUpSpeech();
    document.removeEventListener("touchstart", onFirstTouch);
  }, { passive: true });

  document.addEventListener("click", function onFirstClick() {
    warmUpSpeech();
    document.removeEventListener("click", onFirstClick);
  }, { once: false });

  // 从后台返回时，重新初始化语音引擎（iOS常见问题）
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      // 重置状态
      isSpeaking = false;
    }
  });

  // 页面隐藏时停止播放（iOS切后台会强制停止）
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopSpeech();
    }
  });

  // 键盘快捷键
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if (document.getElementById("learnModule").style.display !== "none") {
      if (e.key === "ArrowLeft") prevDialog();
      if (e.key === "ArrowRight") nextDialog();
    }
  });

  document.getElementById("productModal").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });

  // 预加载语音列表
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  console.log("✅ 学英语·逛好物 已启动（iPad优化版）");
  console.log("📚 对话总数:", dialogPool.length, "组");
  console.log("🛍️ 商品总数:", products.length, "件");
}

initApp();
</script>
