<style>

.container{max-width:560px;width:100%;margin:0 auto;}
.header{text-align:center;padding:6px 0 20px;}
.header h1{margin:0;font-size:30px;font-weight:700;}

.chat-box{background:#f8fafc;border-radius:16px;padding:16px;margin-top:12px;max-height:350px;overflow-y:auto;text-align:left;border:1px solid #e2e8f0;display:none;}

<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header"><h1>🎧 Listen & Speak</h1><p>自然语音 · 可选音色 · 完整词块</p></div>

<!-- API 设置 -->
<div class="api-settings">
  <input id="apiKeyInput" type="password" placeholder="API Key (DeepSeek/OpenAI)" style="flex:2;">
  <input id="apiBaseInput" type="url" placeholder="API Base URL" value="https://api.deepseek.com/v1" style="flex:1.5;">
  <button class="save-btn" onclick="saveApiConfig()">💾 保存</button>
  <span class="api-status" id="apiStatus">未设置</span>
</div>

<!-- 语音设置 -->
<div class="voice-settings">
  <label>音色 <select id="voiceSelect"><option value="">请选择语音</option></select></label>
  <label>语速 <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="0.8"><span class="val" id="rateVal">0.8</span></label>
  <label>音调 <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.1" value="1.0"><span class="val" id="pitchVal">1.0</span></label>
  <button class="preset-btn" onclick="applyPreset('natural')">🌿 自然</button>
  <button class="preset-btn" onclick="applyPreset('clear')">🔊 清晰</button>
  <button class="preset-btn" onclick="applyPreset('fast')">⚡ 快速</button>
  <button onclick="saveVoiceSettings()" style="background:#22c55e;color:#fff;border:0;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;">保存</button>
</div>

<!-- 搜索 -->
<div class="search-wrapper">
  <select id="sceneSelect"><option value="">📂 全部场景</option></select>
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="Search English or Chinese" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<!-- 主卡片 -->
<div class="card">
<div id="scene" class="scene">Basic Needs</div>
<div id="progress" class="progress">Chunk 1 / 600+</div>
<div class="chunk-label">Core Chunk</div>
<div id="chunk" class="chunk">I want to...</div>
<div class="english"><span id="english">I want to eat.</span></div>
<div id="chinese" class="chinese">我想吃东西。</div>
<div class="replace-title">Replace & Practice (点击替换词听发音)</div>
<div id="replaceList" class="replace-list"></div>
<div class="player-controls">
<button class="ctrl-btn" onclick="prevTrack()">⏮</button>
<button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
<button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
<button class="ctrl-btn" onclick="nextTrack()">⏭</button>
</div>
<div id="cnStatus" class="cn-status">Chinese audio available: first 50 sentences</div>
<div class="extra-buttons">
<button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
<button onclick="playPattern()">🧩 Pattern</button>
<button onclick="randomSentence()">🎲 Random</button>
<button id="hdToggle" class="hd-toggle" onclick="toggleHD()">✨ HD</button>
<button id="micBtn" class="mic-toggle" onclick="toggleMic()">🎤 Voice</button>
<button id="aiToggle" class="ai-toggle" onclick="toggleChat()">💬 AI Chat</button>
<button id="unlockCnBtn" class="unlock-cn-btn" onclick="showUnlockDialog()">🔓 Unlock Chinese</button>
<button class="get-code-btn" onclick="getUnlockCode()">🔑 Get Code</button>
<button class="reset-audio-btn" onclick="resetAudio()">🔊 修复音频</button>
<button class="test-voice-btn" onclick="testVoice()">🔊 测试语音</button>
</div>

    <button onclick="hideAdmin()" style="background:#ef4444;">Close Panel</button>

</div>
</div>
<div style="text-align:center;margin-top:16px;font-size:13px;color:#b9c2d0;">Listen to Pattern → Full Sentence → Replace → Speak</div>

<script>
// ========================================================================
// 1. API 配置
// ========================================================================
let apiKey = localStorage.getItem('ai_api_key') || '';
let apiBase = localStorage.getItem('ai_api_base') || 'https://api.deepseek.com/v1';
let chatHistory = [];
const MAX_HISTORY = 10;

function loadApiConfig() {
    document.getElementById('apiKeyInput').value = apiKey;
    document.getElementById('apiBaseInput').value = apiBase;
    updateApiStatus();
}
function updateApiStatus() {
    const el = document.getElementById('apiStatus');
    if (apiKey) { el.textContent = '✅ 已配置'; el.style.color = '#22c55e'; }
    else { el.textContent = '⚠️ 请设置 API Key'; el.style.color = '#ef4444'; }
}
function saveApiConfig() {
    const key = document.getElementById('apiKeyInput').value.trim();
    const base = document.getElementById('apiBaseInput').value.trim();
    if (key) { apiKey = key; localStorage.setItem('ai_api_key', key); }
    if (base) { apiBase = base; localStorage.setItem('ai_api_base', base); }
    updateApiStatus();
    showToast('✅ API 设置已保存');
}

// ========================================================================
// 2. 语音设置（含音色选择、参数、预设）
// ========================================================================
let selectedVoiceName = localStorage.getItem('voice_name') || '';
let voiceRate = parseFloat(localStorage.getItem('voice_rate')) || 0.8;
let voicePitch = parseFloat(localStorage.getItem('voice_pitch')) || 1.0;
let voiceVolume = 1.0; // 固定

function loadVoiceSettings() {
    document.getElementById('rateSlider').value = voiceRate;
    document.getElementById('pitchSlider').value = voicePitch;
    document.getElementById('rateVal').textContent = voiceRate.toFixed(1);
    document.getElementById('pitchVal').textContent = voicePitch.toFixed(1);
    // 语音列表稍后填充
}
function saveVoiceSettings() {
    voiceRate = parseFloat(document.getElementById('rateSlider').value);
    voicePitch = parseFloat(document.getElementById('pitchSlider').value);
    const voiceSelect = document.getElementById('voiceSelect');
    selectedVoiceName = voiceSelect.value;
    localStorage.setItem('voice_rate', voiceRate);
    localStorage.setItem('voice_pitch', voicePitch);
    localStorage.setItem('voice_name', selectedVoiceName);
    document.getElementById('rateVal').textContent = voiceRate.toFixed(1);
    document.getElementById('pitchVal').textContent = voicePitch.toFixed(1);
    showToast('✅ 语音设置已保存');
}

// 预设模式
function applyPreset(mode) {
    let rate, pitch;
    if (mode === 'natural') { rate = 0.85; pitch = 1.0; }
    else if (mode === 'clear') { rate = 0.7; pitch = 1.2; }
    else if (mode === 'fast') { rate = 1.2; pitch = 0.9; }
    document.getElementById('rateSlider').value = rate;
    document.getElementById('pitchSlider').value = pitch;
    document.getElementById('rateVal').textContent = rate.toFixed(1);
    document.getElementById('pitchVal').textContent = pitch.toFixed(1);
    voiceRate = rate; voicePitch = pitch;
    localStorage.setItem('voice_rate', voiceRate);
    localStorage.setItem('voice_pitch', voicePitch);
    showToast(`✅ 预设 "${mode}" 已应用`);
    if (isSpeaking) { stopSpeech(); setTimeout(playCurrent, 200); }
}

// 填充语音列表
function populateVoiceList() {
    const select = document.getElementById('voiceSelect');
    if (!window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    const enVoices = voices.filter(v => v.lang.startsWith('en'));
    if (enVoices.length === 0) {
        select.innerHTML = '<option value="">无英语语音</option>';
        return;
    }
    select.innerHTML = '';
    // 优先推荐自然度高的语音
    const preferred = ['Google UK', 'Samantha', 'Zira', 'Alex', 'Tessa', 'Veena', 'Fred', 'Daniel', 'Karen'];
    const sorted = enVoices.sort((a, b) => {
        const aScore = preferred.some(p => a.name.includes(p)) ? -1 : 1;
        const bScore = preferred.some(p => b.name.includes(p)) ? -1 : 1;
        return aScore - bScore;
    });
    sorted.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        if (v.name === selectedVoiceName) opt.selected = true;
        select.appendChild(opt);
    });
    // 如果之前没有保存，默认选第一个
    if (!selectedVoiceName && sorted.length > 0) {
        select.value = sorted[0].name;
        selectedVoiceName = sorted[0].name;
    }
}
// 监听 voices 变化
if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function() {
        populateVoiceList();
    };
    // 立即填充一次
    setTimeout(populateVoiceList, 200);
}

function cleanSpeechText(text) {
    if (!text) return '';
    return text.replace(/\.{3,}/g, '').replace(/…/g, '').replace(/\s+/g, ' ').trim() || text;
}

// ========================================================================
// 5. 展开模板（生成 600+ 短句）
// ========================================================================
function expandTemplates(templates) {
    const result = [];
    templates.forEach(tpl => {
        const [scene, chunk, pattern, en, cn, replacements] = tpl;
        result.push({ scene, chunk, pattern, en: cleanSpeechText(en), cn, replace: replacements, isPremium: false });
        if (replacements && replacements.length) {
            replacements.forEach(r => {
                const parts = r.split('|');
                if (parts.length < 2) return;
                const enWord = parts[0].trim();
                const cnWord = parts[1].trim();
                let newEn = en;
                let newCn = cn;
                if (pattern.includes('...')) {
                    newEn = pattern.replace(/\.{3}/g, enWord);
                } else {
                    const words = en.split(' ');
                    if (words.length > 0) { words[words.length - 1] = enWord; newEn = words.join(' '); }
                    else { newEn = enWord; }
                }
                if (cn.includes('……')) { newCn = cn.replace(/……/g, cnWord); }
                else {
                    const cnWords = cn.split(/[，,、。.]/);
                    if (cnWords.length > 0) {
                        const last = cnWords[cnWords.length - 1];
                        if (last.length > 0) newCn = cn.replace(last, cnWord);
                        else newCn = cn + cnWord;
                    } else newCn = cnWord;
                }
                newEn = cleanSpeechText(newEn);
                if (!newEn) newEn = enWord;
                result.push({
                    scene,
                    chunk: chunk + ' (' + enWord + ')',
                    pattern: newEn,
                    en: newEn,
                    cn: newCn,
                    replace: replacements,
                    isPremium: false
                });
            });
        }
    });
    return result;
}

// ----- 原生语音（应用选择音色 + 参数）-----
function speakNative(text, cb) {
    if (!text || text.trim() === '') { cb(false, 'Empty'); return; }
    if (!window.speechSynthesis) { cb(false, 'No speechSynthesis'); return; }
    let voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) {
        window.speechSynthesis.onvoiceschanged = function() {
            voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) doSpeak();
            else setTimeout(() => { voices = window.speechSynthesis.getVoices(); if (voices.length > 0) doSpeak(); }, 500);
        };
        window.speechSynthesis.getVoices();
        setTimeout(() => { voices = window.speechSynthesis.getVoices(); if (voices && voices.length > 0) doSpeak(); }, 1000);
        return;
    }
    doSpeak();

    function doSpeak() {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = voiceRate;
        utterance.pitch = voicePitch;
        utterance.volume = voiceVolume;
        // 选择用户指定的音色
        if (selectedVoiceName) {
            const selected = voices.find(v => v.name === selectedVoiceName);
            if (selected) utterance.voice = selected;
        } else {
            // 默认选择自然度高的
            const preferred = voices.find(v => /Google UK|Samantha|Zira|Alex|Tessa|Veena|Fred|Daniel|Karen/i.test(v.name)) ||
                              voices.find(v => v.lang.startsWith('en'));
            if (preferred) utterance.voice = preferred;
        }
        let ended = false;
        const timeoutId = setTimeout(() => {
            if (!ended) { ended = true; window.speechSynthesis.cancel(); currentUtterance = null; isSpeaking = false; dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused"); cb(false, 'Timeout'); }
        }, 10000);

        utterance.onstart = function() {
            if (currentUtterance !== utterance) return;
            isSpeaking = true;
            dom.playPauseBtn.textContent = "⏸";
            dom.playPauseBtn.classList.add("paused");
            dom.status.textContent = "🎧 Playing (native)";
            dom.status.className = "status speaking";
        };
        utterance.onend = function() {
            if (ended) return;
            ended = true; clearTimeout(timeoutId);
            isSpeaking = false; currentUtterance = null;
            dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
            dom.status.textContent = "✅ Playback done"; dom.status.className = "status done";
            cb(true);
        };
        utterance.onerror = function(e) {
            if (ended) return;
            ended = true; clearTimeout(timeoutId);
            isSpeaking = false; currentUtterance = null;
            dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
            cb(false, 'TTS error: ' + e.error);
        };
        currentUtterance = utterance;
        try { window.speechSynthesis.speak(utterance); }
        catch(err) { clearTimeout(timeoutId); ended = true; isSpeaking = false; currentUtterance = null; cb(false, 'Exception: ' + err.message); }
    }
}

// ----- HD 语音（谷歌翻译）作为备选，音质清晰但不可选音色-----
function speakGoogle(text, cb) {
    if (!text || text.trim() === '') { cb(false, 'Empty'); return; }
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
    const audio = new Audio(url);
    currentAudio = audio;
    let ended = false;
    const timeoutId = setTimeout(() => {
        if (!ended) { ended = true; audio.pause(); audio.src = ''; currentAudio = null; cb(false, 'Timeout'); }
    }, 10000);

    audio.oncanplaythrough = function() {
        audio.play().catch(err => { if (!ended) { clearTimeout(timeoutId); ended = true; currentAudio = null; cb(false, 'Play error: ' + err.message); } });
    };
    audio.onplay = function() {
        isSpeaking = true;
        dom.playPauseBtn.textContent = "⏸";
        dom.playPauseBtn.classList.add("paused");
        dom.status.textContent = "🎧 Playing (HD)";
        dom.status.className = "status speaking";
    };
    audio.onended = function() {
        if (ended) return;
        clearTimeout(timeoutId); ended = true; isSpeaking = false; currentAudio = null;
        dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
        dom.status.textContent = "✅ Playback done"; dom.status.className = "status done";
        cb(true);
    };
    audio.onerror = function() {
        if (ended) return;
        clearTimeout(timeoutId); ended = true; isSpeaking = false; currentAudio = null;
        cb(false, 'Google TTS failed');
    };
    audio.load();
}

// ----- 统一入口（优先 HD，如网络失败则 fallback 到原生）-----
function speakText(text, cb) {
    const clean = cleanSpeechText(text);
    if (!clean) { if (cb) cb(false); return; }
    playQueue.push({ text: clean, cb, retries: 0 });
    processQueue();
}

function processQueue() {
    if (isProcessingQueue || playQueue.length === 0) return;
    isProcessingQueue = true;
    const task = playQueue.shift();
    const { text, cb, retries } = task;
    const useGoogle = hdMode && navigator.onLine;

    function onResult(success, msg) {
        if (success) {
            isProcessingQueue = false; if (cb) cb(true);
            if (playQueue.length > 0) processQueue();
        } else {
            if (retries < MAX_RETRY) {
                task.retries = retries + 1;
                playQueue.unshift(task);
                isProcessingQueue = false;
                setTimeout(processQueue, 500);
            } else {
                isProcessingQueue = false; if (cb) cb(false);
                dom.status.textContent = "⚠️ Playback failed."; dom.status.className = "status error";
                if (playQueue.length > 0) processQueue();
            }
        }
    }

    if (useGoogle) speakGoogle(text, onResult);
    else speakNative(text, onResult);
}

// ----- 播放与测试 -----
function playCurrent() {
    if (isSpeaking) { stopSpeech(); setTimeout(playCurrent, 200); return; }
    const item = getCurrentItem();
    if (!item || !item.en) { dom.status.textContent = "⚠️ No valid sentence"; dom.status.className = "status error"; showToast('No valid sentence'); return; }
    const cleanText = cleanSpeechText(item.en);
    if (!cleanText) { dom.status.textContent = "⚠️ Empty sentence"; dom.status.className = "status error"; showToast('Empty sentence'); return; }
    dom.status.textContent = "⏳ Loading..."; dom.status.className = "status";
    if (playQueue.length > 0) { playQueue = []; isProcessingQueue = false; }
    speakText(cleanText, function(success) {
        if (!success) {
            dom.status.textContent = "⚠️ Playback failed"; dom.status.className = "status error";
            if (hdMode) { hdMode = false; dom.hdToggle.textContent = "✨ HD"; dom.hdToggle.style.background = "#8b5cf6"; showToast('Switched to native'); setTimeout(playCurrent, 500); }
        }
    });
}

function doRepeat() {
    if (!isRepeating) return;
    repeatCount++; dom.status.textContent = `🔁 Repeat ${repeatCount}/${REPEAT_TIMES}`; dom.status.className = "status";
    const item = getCurrentItem(); if (!item) { stopSpeech(); return; }
    const cleanText = cleanSpeechText(item.en); if (!cleanText) { stopSpeech(); return; }
    speakText(cleanText, function(success) {
        if (!isRepeating) return;
        if (!success) { isRepeating = false; dom.repeatBtn.textContent = "🔁 Repeat"; dom.repeatBtn.classList.remove("active"); dom.status.textContent = "⚠️ Repeat interrupted"; dom.status.className = "status error"; return; }
        if (repeatCount >= REPEAT_TIMES) { isRepeating = false; dom.repeatBtn.textContent = "🔁 Repeat"; dom.repeatBtn.classList.remove("active"); dom.status.textContent = "✅ Repeat done"; dom.status.className = "status done"; return; }
        repeatTimer = setTimeout(doRepeat, 600);
    });
}

function searchSentence() {
    const keyword = dom.searchInput.value.trim().toLowerCase();
    dom.results.innerHTML = "";
    if (!keyword) { showToast("Enter a keyword"); return; }
    const available = getAvailableLessons();
    const matches = available.filter(item =>
        (item.chunk && item.chunk.toLowerCase().includes(keyword)) ||
        (item.pattern && item.pattern.toLowerCase().includes(keyword)) ||
        (item.en && item.en.toLowerCase().includes(keyword)) ||
        (item.cn && item.cn.includes(keyword)) ||
        (item.scene && item.scene.toLowerCase().includes(keyword))
    );
    if (matches.length === 0) { dom.results.innerHTML = `<div class="no-result">🔍 No matching chunks found</div>`; return; }
    matches.slice(0, 30).forEach(function(item) {
        const box = document.createElement("div");
        box.className = "result";
        box.innerHTML = `<div class="result-en">${item.chunk || ''} · ${item.pattern || ''}${item.isPremium ? ' ⭐' : ''}</div><div class="result-cn">${item.cn || ''}</div>`;
        box.onclick = function() {
            stopSpeech();
            const idx = available.indexOf(item);
            if (idx !== -1) currentIndex = idx;
            showSentence();
            dom.results.innerHTML = "";
            dom.searchInput.value = "";
            setTimeout(playCurrent, 150);
            showToast("Jumped to chunk");
        };
        dom.results.appendChild(box);
    });
}
function populateSceneSelect() {
    const select = document.getElementById('sceneSelect');
    if (!select) return;
    const scenes = new Set();
    lessons.forEach(item => {
        let scene = item.scene || 'Unknown';
        scene = scene.replace(/^⭐\s*/, '').trim();
        if (scene) scenes.add(scene);
    });
    select.innerHTML = '<option value="">📂 全部场景</option>';
    Array.from(scenes).sort().forEach(scene => {
        const opt = document.createElement('option');
        opt.value = scene;
        opt.textContent = scene;
        select.appendChild(opt);
    });
    select.removeEventListener('change', select._changeHandler);
    select._changeHandler = function() {
        dom.searchInput.value = this.value;
        searchSentence();
    };
    select.addEventListener('change', select._changeHandler);
}
