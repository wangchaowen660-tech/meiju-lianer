<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 双语学习 · 手动播放器（1600句）</title>
    <style>
        /* ===== 全局 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 780px;
            width: 100%;
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 44px;
            padding: 30px 32px 36px;
            box-shadow: 0 30px 60px -12px rgba(0,20,40,0.30), 0 0 0 1px rgba(255,255,255,0.6) inset;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1e2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #4f6b84;
        }
        .badge {
            background: rgba(45,75,101,0.10);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            color: #1a2e3f;
            border: 1px solid rgba(45,75,101,0.08);
            white-space: nowrap;
        }

        /* ===== 句子卡片 ===== */
        .card {
            background: rgba(255,255,255,0.60);
            border-radius: 32px;
            padding: 28px 28px 24px;
            margin: 8px 0 16px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
        }
        .row .label {
            font-size: 13px;
            font-weight: 600;
            color: #6a7f94;
            min-width: 42px;
            padding-top: 2px;
        }
        .row .text {
            flex: 1;
            font-size: 24px;
            font-weight: 500;
            color: #0b1e2e;
            line-height: 1.6;
            word-break: break-word;
        }
        .row .text.zh {
            font-size: 22px;
            font-weight: 450;
            color: #1f3a4e;
        }
        .row .speak-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(59,130,246,0.08);
            color: #1a2e3f;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .row .speak-btn.zh-btn {
            background: rgba(234,88,12,0.08);
        }
        .row .speak-btn:hover {
            background: rgba(59,130,246,0.18);
            transform: scale(1.05);
        }
        .row .speak-btn.zh-btn:hover {
            background: rgba(234,88,12,0.18);
        }
        .row .speak-btn:active { transform: scale(0.92); }
        .row .speak-btn.speaking {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 0 0 8px rgba(59,130,246,0.12);
            animation: pulse 1s ease-in-out infinite;
        }
        .row .speak-btn.zh-btn.speaking {
            background: #ea580c;
            box-shadow: 0 0 0 8px rgba(234,88,12,0.12);
            animation-name: pulse-orange;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(59,130,246,0.10); }
            50% { box-shadow: 0 0 0 14px rgba(59,130,246,0.02); }
        }
        @keyframes pulse-orange {
            0%, 100% { box-shadow: 0 0 0 4px rgba(234,88,12,0.10); }
            50% { box-shadow: 0 0 0 14px rgba(234,88,12,0.02); }
        }
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(45,75,101,0.08), transparent);
            margin: 8px 0 6px;
        }

        /* ===== 控制栏 ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .ctrl-btn {
            width: 54px;
            height: 54px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            color: #1a2e3f;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(45,75,101,0.06);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover {
            background: rgba(255,255,255,0.95);
            border-color: rgba(45,75,101,0.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,20,40,0.06);
        }
        .ctrl-btn:active { transform: scale(0.94); }
        .ctrl-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .ctrl-btn.loop {
            font-size: 18px;
            width: 50px;
            height: 50px;
        }
        .ctrl-btn.loop.active {
            background: rgba(59,130,246,0.12);
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .ctrl-btn.loop.active-single {
            background: rgba(234,88,12,0.12);
            border-color: #ea580c;
            color: #ea580c;
        }
        .ctrl-btn.loop .badge {
            font-size: 10px;
            font-weight: 700;
            margin-left: 2px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 14px;
            color: #4f6b84;
            padding: 0 4px;
        }
        .footer .counter { font-weight: 500; }
        .footer .status { opacity: 0.7; }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .app { padding: 20px 16px 24px; border-radius: 32px; }
            .header h1 { font-size: 22px; }
            .header h1 small { font-size: 14px; }
            .card { padding: 20px 16px 18px; }
            .row .text { font-size: 20px; }
            .row .text.zh { font-size: 18px; }
            .row .speak-btn { width: 38px; height: 38px; font-size: 17px; }
            .ctrl-btn { width: 46px; height: 46px; font-size: 18px; }
            .ctrl-btn.loop { width: 42px; height: 42px; font-size: 16px; }
        }
        @media (max-width: 420px) {
            .header { flex-direction: column; align-items: flex-start; }
            .row .text { font-size: 17px; }
            .row .text.zh { font-size: 16px; }
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #4f6b84;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="header">
        <h1>
            🎵 双语学习
            <small>手动播放 · 1600句</small>
        </h1>
        <div class="badge" id="progressBadge">生成中...</div>
    </div>

    <div class="card fade-in" id="card">
        <div class="row">
            <span class="label">🇬🇧 EN</span>
            <span class="text" id="enText">正在生成句子库...</span>
            <button class="speak-btn" id="enSpeak" title="朗读英文" disabled>🔊</button>
        </div>
        <div class="divider"></div>
        <div class="row">
            <span class="label">🇨🇳 中</span>
            <span class="text zh" id="zhText">请稍候...</span>
            <button class="speak-btn zh-btn" id="zhSpeak" title="朗读中文" disabled>🔊</button>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn" title="上一句" disabled>⏮️</button>
        <button class="ctrl-btn" id="replayBtn" title="重听英文" disabled>🔁</button>
        <button class="ctrl-btn" id="nextBtn" title="下一句" disabled>⏭️</button>
        <button class="ctrl-btn loop" id="loopBtn" title="循环模式" disabled>🔂 <span class="badge" id="loopBadge">1</span></button>
    </div>

    <div class="footer">
        <span class="counter" id="counterDisplay">加载中...</span>
        <span class="status" id="statusDisplay">就绪</span>
    </div>
</div>

<script>
    // ================================================================
    //  1. 准确的中英文模板生成器（修复中文翻译错误）
    // ================================================================
    function generateSentences() {
        const sentences = [];

        // ---------- 词汇表（中英对照） ----------
        const subjects = [
            { en: "I", zh: "我" },
            { en: "You", zh: "你" },
            { en: "He", zh: "他" },
            { en: "She", zh: "她" },
            { en: "We", zh: "我们" },
            { en: "They", zh: "他们" },
            { en: "My friend", zh: "我的朋友" },
            { en: "My family", zh: "我的家人" },
            { en: "My brother", zh: "我的兄弟" },
            { en: "My sister", zh: "我的姐妹" },
            { en: "My mother", zh: "我的母亲" },
            { en: "My father", zh: "我的父亲" }
        ];

        const verbs = [
            { en: "like", zh: "喜欢" },
            { en: "love", zh: "爱" },
            { en: "want", zh: "想要" },
            { en: "need", zh: "需要" },
            { en: "have", zh: "有" },
            { en: "get", zh: "得到" },
            { en: "make", zh: "做" },
            { en: "cook", zh: "烹饪" },
            { en: "eat", zh: "吃" },
            { en: "drink", zh: "喝" },
            { en: "buy", zh: "买" },
            { en: "sell", zh: "卖" },
            { en: "see", zh: "看见" },
            { en: "go", zh: "去" },
            { en: "come", zh: "来" },
            { en: "take", zh: "拿" },
            { en: "bring", zh: "带来" },
            { en: "give", zh: "给" },
            { en: "find", zh: "找到" },
            { en: "lose", zh: "丢失" },
            { en: "use", zh: "使用" },
            { en: "put", zh: "放" },
            { en: "keep", zh: "保持" },
            { en: "hold", zh: "握住" }
        ];

        const objects = [
            { en: "food", zh: "食物" },
            { en: "water", zh: "水" },
            { en: "coffee", zh: "咖啡" },
            { en: "tea", zh: "茶" },
            { en: "juice", zh: "果汁" },
            { en: "milk", zh: "牛奶" },
            { en: "bread", zh: "面包" },
            { en: "rice", zh: "米饭" },
            { en: "noodles", zh: "面条" },
            { en: "vegetables", zh: "蔬菜" },
            { en: "fruit", zh: "水果" },
            { en: "meat", zh: "肉" },
            { en: "book", zh: "书" },
            { en: "pen", zh: "笔" },
            { en: "phone", zh: "电话" },
            { en: "computer", zh: "电脑" },
            { en: "car", zh: "汽车" },
            { en: "house", zh: "房子" },
            { en: "job", zh: "工作" },
            { en: "money", zh: "钱" },
            { en: "time", zh: "时间" },
            { en: "help", zh: "帮助" },
            { en: "advice", zh: "建议" },
            { en: "information", zh: "信息" }
        ];

        const places = [
            { en: "home", zh: "家" },
            { en: "school", zh: "学校" },
            { en: "work", zh: "工作场所" },
            { en: "the market", zh: "市场" },
            { en: "the restaurant", zh: "餐厅" },
            { en: "the hospital", zh: "医院" },
            { en: "the station", zh: "车站" },
            { en: "the airport", zh: "机场" },
            { en: "the hotel", zh: "酒店" }
        ];

        const timeWords = [
            { en: "today", zh: "今天" },
            { en: "tomorrow", zh: "明天" },
            { en: "yesterday", zh: "昨天" },
            { en: "now", zh: "现在" },
            { en: "soon", zh: "很快" },
            { en: "later", zh: "稍后" }
        ];

        // ---------- 辅助函数 ----------
        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        // ---------- 模板生成器 ----------
        // 1) 陈述句：S + V + O.
        for (let s of subjects) {
            for (let v of verbs) {
                for (let o of objects) {
                    let en = `${s.en} ${v.en} ${o.en}.`;
                    let zh = `${s.zh} ${v.zh} ${o.zh}。`;
                    sentences.push({ en, zh });
                }
            }
        }

        // 2) 疑问句：Do/Does + S + V + O?
        for (let s of subjects) {
            for (let v of verbs) {
                for (let o of objects) {
                    let helper = (s.en === 'He' || s.en === 'She' || s.en === 'My friend' || s.en === 'My brother' || s.en === 'My sister' || s.en === 'My mother' || s.en === 'My father') ? 'Does' : 'Do';
                    let en = `${helper} ${s.en} ${v.en} ${o.en}?`;
                    let zh = `${s.zh} ${v.zh} ${o.zh} 吗？`;
                    sentences.push({ en, zh });
                }
            }
        }

        // 3) 否定句：S + do/does not + V + O.
        for (let s of subjects) {
            for (let v of verbs) {
                for (let o of objects) {
                    let aux = (s.en === 'He' || s.en === 'She' || s.en === 'My friend' || s.en === 'My brother' || s.en === 'My sister' || s.en === 'My mother' || s.en === 'My father') ? 'does not' : 'do not';
                    let en = `${s.en} ${aux} ${v.en} ${o.en}.`;
                    let zh = `${s.zh} 不 ${v.zh} ${o.zh}。`;
                    sentences.push({ en, zh });
                }
            }
        }

        // 4) 地点句：S + V + O + at/place.
        const preps = ['at', 'in', 'on'];
        for (let s of subjects.slice(0, 4)) {
            for (let v of verbs.slice(0, 4)) {
                for (let o of objects.slice(0, 4)) {
                    for (let p of places) {
                        let prep = preps[Math.floor(Math.random() * preps.length)];
                        let en = `${s.en} ${v.en} ${o.en} ${prep} ${p.en}.`;
                        // 中文: S 在 P V O.
                        let zh = `${s.zh} 在 ${p.zh} ${v.zh} ${o.zh}。`;
                        sentences.push({ en, zh });
                    }
                }
            }
        }

        // 5) 时间状语：S + V + O + time.
        for (let s of subjects.slice(0, 4)) {
            for (let v of verbs.slice(0, 4)) {
                for (let o of objects.slice(0, 4)) {
                    for (let t of timeWords) {
                        let en = `${s.en} ${v.en} ${o.en} ${t.en}.`;
                        let zh = `${s.zh} ${t.zh} ${v.zh} ${o.zh}。`;
                        sentences.push({ en, zh });
                    }
                }
            }
        }

        // 6) 固定常用语（手工准确翻译）
        const fixed = [
            { en: "Hello, how are you?", zh: "你好，你好吗？" },
            { en: "I'm fine, thank you.", zh: "我很好，谢谢。" },
            { en: "What's your name?", zh: "你叫什么名字？" },
            { en: "My name is Alex.", zh: "我叫亚历克斯。" },
            { en: "Nice to meet you.", zh: "很高兴见到你。" },
            { en: "Where are you from?", zh: "你来自哪里？" },
            { en: "I'm from China.", zh: "我来自中国。" },
            { en: "How old are you?", zh: "你多大年纪？" },
            { en: "I'm twenty-five years old.", zh: "我二十五岁。" },
            { en: "What do you do for a living?", zh: "你做什么工作？" },
            { en: "I'm a chef.", zh: "我是一名厨师。" },
            { en: "I work in a restaurant.", zh: "我在一家餐厅工作。" },
            { en: "Do you like your job?", zh: "你喜欢你的工作吗？" },
            { en: "Yes, I love cooking.", zh: "是的，我喜欢烹饪。" },
            { en: "What's today's special?", zh: "今天的特色菜是什么？" },
            { en: "We have fresh fish.", zh: "我们有新鲜的鱼。" },
            { en: "How would you like your steak?", zh: "您的牛排要几分熟？" },
            { en: "Medium rare, please.", zh: "三分熟，谢谢。" },
            { en: "Could you pass me the salt?", zh: "能把盐递给我吗？" },
            { en: "Here you are.", zh: "给你。" },
            { en: "I need more garlic.", zh: "我需要更多大蒜。" },
            { en: "The soup is too salty.", zh: "汤太咸了。" },
            { en: "Add some pepper.", zh: "加一些胡椒。" },
            { en: "How long does it take to cook?", zh: "做这道菜需要多长时间？" },
            { en: "It takes about twenty minutes.", zh: "大约需要二十分钟。" },
            { en: "The kitchen is busy today.", zh: "厨房今天很忙。" },
            { en: "I need to prepare the vegetables.", zh: "我需要准备蔬菜。" },
            { en: "Is the oven preheated?", zh: "烤箱预热了吗？" },
            { en: "Yes, it's ready.", zh: "是的，准备好了。" },
            { en: "Can I have the menu, please?", zh: "请给我菜单。" },
            { en: "I'd like a glass of water.", zh: "我想要一杯水。" },
            { en: "What would you recommend?", zh: "你推荐什么？" },
            { en: "The pasta is very good.", zh: "意大利面很好吃。" },
            { en: "I'll have the chicken salad.", zh: "我要鸡肉沙拉。" },
            { en: "How much is the bill?", zh: "账单多少钱？" },
            { en: "It's thirty dollars in total.", zh: "总共三十美元。" },
            { en: "Can I pay by credit card?", zh: "我可以用信用卡支付吗？" },
            { en: "Yes, of course.", zh: "当然可以。" },

            { en: "Could I get a wake-up call at 6 AM?", zh: "能在早上6点叫醒我吗？" },

            { en: "Go straight ahead.", zh: "一直往前走。" },
            { en: "Is it far from here?", zh: "离这里远吗？" },
            { en: "No, it's about five minutes.", zh: "不远，大约五分钟。" },
            { en: "Which way should I go?", zh: "我该走哪条路？" },
            { en: "Turn left at the traffic lights.", zh: "在红绿灯左转。" },
            { en: "I don't feel well.", zh: "我觉得不舒服。" },
            { en: "I need to see a doctor.", zh: "我需要看医生。" },
            { en: "Where is the nearest hospital?", zh: "最近的医院在哪里？" },
            { en: "What are your symptoms?", zh: "你有什么症状？" },
            { en: "I have a headache and a fever.", zh: "我头疼而且发烧。" },
            { en: "Please take a seat and wait.", zh: "请坐下等候。" },
            { en: "The doctor will see you now.", zh: "医生现在可以看你了。" },
            { en: "I need a prescription.", zh: "我需要一个处方。" },
            { en: "Take this medicine twice a day.", zh: "这种药一天吃两次。" },
            { en: "I live with my family.", zh: "我和家人住在一起。" },
            { en: "My parents are very kind.", zh: "我的父母很和蔼。" },
            { en: "I have a brother and a sister.", zh: "我有一个哥哥和一个姐姐。" },
            { en: "My son is a student.", zh: "我的儿子是学生。" },
            { en: "We have a lovely house.", zh: "我们有一所漂亮的房子。" },
            { en: "What's the weather like today?", zh: "今天天气怎么样？" },
            { en: "It's sunny and warm.", zh: "晴朗而温暖。" },
            { en: "Is it going to rain?", zh: "会下雨吗？" },
            { en: "It's very cold outside.", zh: "外面很冷。" },
            { en: "What time is it?", zh: "现在几点了？" },
            { en: "It's half past seven.", zh: "七点半了。" },
            { en: "Do you speak English?", zh: "你会说英语吗？" },
            { en: "I speak a little English.", zh: "我会说一点英语。" },
            { en: "Could you repeat that?", zh: "你能重复一遍吗？" },
            { en: "Please speak slowly.", zh: "请说慢一点。" },
            { en: "What does this word mean?", zh: "这个词是什么意思？" },
            { en: "I don't understand.", zh: "我不明白。" },
            { en: "That's a good idea.", zh: "那是个好主意。" },
            { en: "I agree with you.", zh: "我同意你的看法。" },
            { en: "I'm not sure.", zh: "我不确定。" },
            { en: "It doesn't matter.", zh: "没关系。" },
            { en: "Have a nice day!", zh: "祝你有愉快的一天！" },
            { en: "Goodbye!", zh: "再见！" },
            { en: "See you later.", zh: "回头见。" },
            { en: "Take care.", zh: "保重。" },
            { en: "I'm happy to meet you.", zh: "我很高兴认识你。" },
            { en: "I hope everything goes well.", zh: "我希望一切顺利。" },
            { en: "Please give me a call.", zh: "请给我打电话。" },
            { en: "I'll send you an email.", zh: "我会给你发邮件。" },
            { en: "Let's keep in touch.", zh: "让我们保持联系。" }
        ];
        for (let f of fixed) sentences.push(f);

        // ---------- 去重 ----------
        const unique = new Map();
        for (let s of sentences) {
            const key = s.en.trim();
            if (!unique.has(key)) {
                unique.set(key, s);
            }
        }

        let result = Array.from(unique.values());

        // 如果不足1600，继续补充（通过循环增加组合）
        while (result.length < 1600) {
            // 随机取词汇生成
            let s = subjects[Math.floor(Math.random() * subjects.length)];
            let v = verbs[Math.floor(Math.random() * verbs.length)];
            let o = objects[Math.floor(Math.random() * objects.length)];
            let en = `${s.en} ${v.en} ${o.en}.`;
            let zh = `${s.zh} ${v.zh} ${o.zh}。`;
            if (!unique.has(en)) {
                unique.set(en, { en, zh });
                result = Array.from(unique.values());
            }
        }

        // 随机打乱
        for (let i = result.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [result[i], result[j]] = [result[j], result[i]];
        }

        // 截取前1600
        if (result.length > 1600) result = result.slice(0, 1600);

        return result;
    }

    // ================================================================
    //  2. 主程序
    // ================================================================
    let SENTENCES = [];
    let currentIndex = 0;
    let total = 0;
    let loopMode = 0;          // 0: 顺序一次, 1: 全部循环, 2: 单曲循环
    const LOOP_LABELS = ['➡️', '🔁', '🔂'];
    const LOOP_BADGES = ['1', '∞', '1'];

    let isSpeaking = false;
    let currentUtterance = null;

    // DOM
    const enText = document.getElementById('enText');
    const zhText = document.getElementById('zhText');
    const enSpeak = document.getElementById('enSpeak');
    const zhSpeak = document.getElementById('zhSpeak');
    const prevBtn = document.getElementById('prevBtn');
    const replayBtn = document.getElementById('replayBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loopBtn = document.getElementById('loopBtn');
    const loopBadge = document.getElementById('loopBadge');
    const counterDisplay = document.getElementById('counterDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const progressBadge = document.getElementById('progressBadge');
    const card = document.getElementById('card');

    function setControlsEnabled(enabled) {
        enSpeak.disabled = !enabled;
        zhSpeak.disabled = !enabled;
        prevBtn.disabled = !enabled;
        replayBtn.disabled = !enabled;
        nextBtn.disabled = !enabled;
        loopBtn.disabled = !enabled;
    }

    function render(index) {
        if (!SENTENCES.length) return;
        const data = SENTENCES[index];
        enText.textContent = data.en;
        zhText.textContent = data.zh;
        progressBadge.textContent = `${index + 1} / ${total}`;
        counterDisplay.textContent = `第 ${index + 1} 句`;
        card.classList.remove('fade-in');
        void card.offsetWidth;
        card.classList.add('fade-in');

        resetSpeakBtn(enSpeak);
        resetSpeakBtn(zhSpeak);

        const isLoopAll = (loopMode === 1);
        const isLoopSingle = (loopMode === 2);
        prevBtn.disabled = (!isLoopAll && !isLoopSingle && index === 0);
        nextBtn.disabled = (!isLoopAll && !isLoopSingle && index === total - 1);

        statusDisplay.textContent = '就绪';
        setControlsEnabled(true);
    }

    function resetSpeakBtn(btn) {
        btn.classList.remove('speaking');
        btn.textContent = '🔊';
        btn.disabled = false;
    }

    function setSpeakBtnActive(btn) {
        btn.classList.add('speaking');
        btn.textContent = '⏹';
        btn.disabled = false;
    }

    function stopAllSpeech() {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        isSpeaking = false;
        if (currentUtterance) currentUtterance = null;
        resetSpeakBtn(enSpeak);
        resetSpeakBtn(zhSpeak);
    }

    function speakText(text, lang, onStart, onEnd) {
        return new Promise((resolve) => {
            if (!window.speechSynthesis) { resolve(); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.95;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            const voices = window.speechSynthesis.getVoices();
            let preferred = null;
            if (lang.startsWith('zh')) {
                preferred = voices.find(v => v.lang.startsWith('zh') && (v.name.includes('Tingting') || v.name.includes('Microsoft')));
            } else {
                preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('David')));
            }
            if (preferred) utterance.voice = preferred;

            currentUtterance = utterance;
            isSpeaking = true;
            if (onStart) onStart();
            utterance.onend = () => {
                isSpeaking = false;
                currentUtterance = null;
                if (onEnd) onEnd();
                resolve();
            };
            utterance.onerror = () => {
                isSpeaking = false;
                currentUtterance = null;
                if (onEnd) onEnd();
                resolve();
            };
            window.speechSynthesis.speak(utterance);
        });
    }

    async function speakEn() {
        if (isSpeaking) { stopAllSpeech(); return; }
        const data = SENTENCES[currentIndex];
        setSpeakBtnActive(enSpeak);
        await speakText(data.en, 'en-US', null, () => { resetSpeakBtn(enSpeak); });
    }

    async function speakZh() {
        if (isSpeaking) { stopAllSpeech(); return; }
        const data = SENTENCES[currentIndex];
        setSpeakBtnActive(zhSpeak);
        await speakText(data.zh, 'zh-CN', null, () => { resetSpeakBtn(zhSpeak); });
    }

    function goPrev() {
        if (isSpeaking) stopAllSpeech();
        let newIndex = currentIndex - 1;
        if (loopMode === 1) {
            if (newIndex < 0) newIndex = total - 1;
        } else if (loopMode === 2) {
            newIndex = currentIndex;
        } else {
            if (newIndex < 0) newIndex = 0;
        }
        if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            render(currentIndex);
        }
    }

    function goNext() {
        if (isSpeaking) stopAllSpeech();
        let newIndex = currentIndex + 1;
        if (loopMode === 1) {
            if (newIndex >= total) newIndex = 0;
        } else if (loopMode === 2) {
            newIndex = currentIndex;
        } else {
            if (newIndex >= total) newIndex = total - 1;
        }
        if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            render(currentIndex);
        }
    }

    function replayCurrent() {
        if (isSpeaking) stopAllSpeech();
        setTimeout(() => speakEn(), 100);
    }

    function toggleLoop() {
        loopMode = (loopMode + 1) % 3;
        loopBtn.textContent = LOOP_LABELS[loopMode];
        loopBadge.textContent = LOOP_BADGES[loopMode];
        loopBtn.className = 'ctrl-btn loop';
        if (loopMode === 1) loopBtn.classList.add('active');
        else if (loopMode === 2) loopBtn.classList.add('active-single');
        render(currentIndex);
    }

    function initSpeech() {
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    }

    function initApp() {
        setControlsEnabled(false);
        statusDisplay.textContent = '生成句子库...';
        setTimeout(() => {
            try {
                SENTENCES = generateSentences();
                total = SENTENCES.length;
                currentIndex = 0;
                render(0);
                updateLoopUI();
                setControlsEnabled(true);
                statusDisplay.textContent = '就绪';
                console.log(`✅ 已生成 ${total} 个句子`);
            } catch (e) {
                console.error(e);
                statusDisplay.textContent = '生成失败，请刷新重试';
            }
        }, 100);
    }

    function updateLoopUI() {
        loopBtn.textContent = LOOP_LABELS[loopMode];
        loopBadge.textContent = LOOP_BADGES[loopMode];
        loopBtn.className = 'ctrl-btn loop';
        if (loopMode === 1) loopBtn.classList.add('active');
        else if (loopMode === 2) loopBtn.classList.add('active-single');
    }

    // 绑定事件
    enSpeak.addEventListener('click', speakEn);
    zhSpeak.addEventListener('click', speakZh);
    prevBtn.addEventListener('click', goPrev);
    replayBtn.addEventListener('click', replayCurrent);
    nextBtn.addEventListener('click', goNext);
    loopBtn.addEventListener('click', toggleLoop);

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
        if (e.key === 'r' || e.key === 'R') { replayCurrent(); }
        if (e.key === 'e' || e.key === 'E') { speakEn(); }
        if (e.key === 'c' || e.key === 'C') { speakZh(); }
    });

    window.addEventListener('beforeunload', () => { stopAllSpeech(); });

    initSpeech();
    initApp();
</script>
</body>
</html>
