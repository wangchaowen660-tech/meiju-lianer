<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中英双语 · 英文付费版（可导入词块）</title>
  <style>
    /* 样式与之前一致，略... 保持简洁 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .app { max-width: 480px; width: 100%; background: #fff; border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); padding: 24px 20px 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge { background: #eef2f6; padding: 4px 14px; border-radius: 30px; font-size: 12px; color: #2c3e50; font-weight: 600; }
    .badge.vip { background: #ffd700; color: #7a5f00; }
    .lang-toggle { display: flex; background: #eef2f6; border-radius: 30px; padding: 4px; margin-bottom: 20px; }
    .lang-toggle button { flex: 1; border: none; background: transparent; padding: 10px 0; border-radius: 30px; font-size: 16px; font-weight: 600; color: #7f8c8d; cursor: pointer; transition: 0.3s; }
    .lang-toggle button.active { background: #fff; color: #1a2634; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .sentence-box { background: #f8faff; border-radius: 20px; padding: 28px 16px; min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 24px; font-weight: 600; color: #1a2634; line-height: 1.5; margin-bottom: 16px; border: 1px solid #edf2f7; }
    .chunk-area { margin-bottom: 16px; padding: 12px 0; border-top: 1px solid #f0f4f8; border-bottom: 1px solid #f0f4f8; }
    .chunk-title { font-size: 13px; font-weight: 700; color: #7f8c8d; letter-spacing: 1px; margin-bottom: 10px; }
    .chunk-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chunk-item { background: #eef6ff; padding: 6px 16px; border-radius: 30px; font-size: 14px; color: #1a2634; border: 1px solid #d6e4ff; }
    .chunk-item span { font-weight: 300; color: #7f8c8d; margin-left: 6px; }
    .no-chunk { color: #b0bcc9; font-size: 14px; }
    .drill-area { background: #fafbfc; border-radius: 16px; padding: 16px; margin-bottom: 20px; border: 1px dashed #dce3ec; }
    .drill-title { font-size: 13px; font-weight: 700; color: #7f8c8d; letter-spacing: 1px; margin-bottom: 10px; }
    .drill-template { font-size: 18px; font-weight: 500; color: #2c3e50; padding: 8px 0 12px; border-bottom: 1px solid #e9edf2; margin-bottom: 12px; }
    .drill-template .highlight { color: #2a7de1; background: #e6f0ff; padding: 0 8px; border-radius: 6px; font-weight: 700; }
    .drill-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .drill-options button { background: white; border: 1px solid #dce3ec; padding: 8px 20px; border-radius: 40px; font-size: 15px; font-weight: 500; color: #2c3e50; cursor: pointer; transition: all 0.15s; flex: 1 0 auto; }
    .drill-options button:active { background: #2a7de1; color: white; border-color: #2a7de1; transform: scale(0.96); }
    .no-drill { color: #b0bcc9; font-size: 14px; }
    .progress-area { margin: 16px 0 12px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 13px; color: #5a6b7c; margin-bottom: 4px; }
    .bar-bg { width: 100%; height: 6px; background: #e9edf2; border-radius: 10px; overflow: hidden; }
    .bar-fill { height: 100%; background: #4a90d9; border-radius: 10px; width: 0%; transition: width 0.3s; }
    .btn-primary { width: 100%; padding: 16px; background: #1a2634; color: white; border: none; border-radius: 60px; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(26,38,52,0.15); transition: 0.2s; margin-bottom: 10px; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-secondary { width: 100%; padding: 12px; background: #eef2f6; color: #2c3e50; border: none; border-radius: 60px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .paywall { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
    .paywall.show { display: flex; }
    .pay-card { background: white; max-width: 360px; width: 100%; border-radius: 32px; padding: 32px 24px; text-align: center; animation: pop 0.3s ease; }
    @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .pay-card h2 { font-size: 24px; margin-bottom: 6px; }
    .pay-card .price { font-size: 38px; font-weight: 800; color: #1a2634; margin: 8px 0; }
    .pay-card .desc { color: #5a6b7c; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .pay-btn { width: 100%; padding: 16px; background: #ffd700; border: none; border-radius: 60px; font-size: 18px; font-weight: 700; color: #1a2634; cursor: pointer; box-shadow: 0 4px 12px rgba(255,215,0,0.4); }
    .close-pay { margin-top: 16px; background: none; border: none; color: #9aa6b2; text-decoration: underline; font-size: 14px; cursor: pointer; }
    .admin-hint { margin-top: 16px; text-align: center; font-size: 11px; color: #c0c8d2; user-select: none; }
    .import-trigger { text-align: right; font-size: 10px; color: #ccc; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <span class="badge" id="levelBadge">🔓 中文免费 · 英文限10句</span>
    <span class="badge" id="countBadge">📖 0 / 300</span>
  </div>
  <div class="lang-toggle">
    <button class="active" data-lang="zh">🇨🇳 中文 (免费)</button>
    <button data-lang="en">🇺🇸 英文 (付费)</button>
  </div>
  <div class="sentence-box" id="sentenceDisplay">点击下方开始学习</div>
  <div class="chunk-area" id="chunkArea">
    <div class="chunk-title">📦 核心词块</div>
    <div class="chunk-list" id="chunkList"><span class="no-chunk">加载中...</span></div>
  </div>
  <div class="drill-area" id="drillArea">
    <div class="drill-title">🔄 替换练习</div>
    <div class="drill-template" id="drillTemplate">暂无练习</div>
    <div class="drill-options" id="drillOptions"><span class="no-drill">敬请期待</span></div>
  </div>
  <div class="progress-area">
    <div class="progress-text"><span>学习进度</span><span id="progressPercent">0%</span></div>
    <div class="bar-bg"><div class="bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <button class="btn-primary" id="playBtn">🔊 播放 & 下一句</button>
  <button class="btn-secondary" id="resetBtn">↺ 重置进度</button>
  <div class="admin-hint">👆 双击空白处 → 输入 admin888 解锁英文</div>
  <div class="import-trigger" id="importTrigger">⚙️ 管理员导入词块</div>
</div>

<!-- 付费弹窗 -->
<div class="paywall" id="paywall">
  <div class="pay-card">
    <h2>🇺🇸 解锁全部英文</h2>
    <div class="price">$5</div>
    <div class="desc">解锁全部300句英文 + 词块 + 替换练习</div>
    <button class="pay-btn" id="payConfirmBtn">💳 立即支付 (模拟)</button>
    <button class="close-pay" id="payCloseBtn">暂时跳过</button>
  </div>
</div>

<script>
// ============================================================
// 1. 基础语料（前10句带示例词块，其余为空，等待导入）
// ============================================================
const TOTAL = 300;
const PREMIUM = 10;

// 生成空词块的句子（用于后续导入）
function makeEmptySentences(baseText, count, lang) {
  const arr = [];
  for (let i = 0; i < count; i++) {
    const num = i + 1;
    const text = lang === 'zh' ? `中文句子 ${num}：坚持学习，每天进步。` : `English sentence ${num}: Keep learning every day.`;
    arr.push({
      text: text,
      chunks: [],
      drill: null
    });
  }
  return arr;
}

// 前10句带词块和练习（中文和英文各10句，与之前一致）
const zhPremium = [
  { text: "我喜欢吃苹果。", chunks: [{word:"喜欢",meaning:"like"},{word:"吃",meaning:"eat"},{word:"苹果",meaning:"apple"}], drill: { template: "我喜欢吃 [fruit]。", slots: [{key:"fruit", options:["香蕉","橙子","西瓜"]}] } },
  { text: "她正在看书。", chunks: [{word:"她",meaning:"she"},{word:"看",meaning:"read"},{word:"书",meaning:"book"}], drill: { template: "她正在 [action]。", slots: [{key:"action", options:["写字","画画","听歌"]}] } },
  { text: "今天天气真好。", chunks: [{word:"今天",meaning:"today"},{word:"天气",meaning:"weather"},{word:"好",meaning:"good"}], drill: { template: "今天天气真 [adj]。", slots: [{key:"adj", options:["热","冷","舒服"]}] } },
  { text: "我想去旅行。", chunks: [{word:"我",meaning:"I"},{word:"想",meaning:"want"},{word:"去",meaning:"go"},{word:"旅行",meaning:"travel"}], drill: { template: "我想去 [activity]。", slots: [{key:"activity", options:["游泳","跑步","爬山"]}] } },
  { text: "他是一名老师。", chunks: [{word:"他",meaning:"he"},{word:"是",meaning:"is"},{word:"老师",meaning:"teacher"}], drill: { template: "他是一名 [job]。", slots: [{key:"job", options:["医生","工程师","设计师"]}] } },
  { text: "我们去看电影吧。", chunks: [{word:"我们",meaning:"we"},{word:"看",meaning:"watch"},{word:"电影",meaning:"movie"}], drill: { template: "我们去看 [media]。", slots: [{key:"media", options:["音乐会","展览","比赛"]}] } },
  { text: "这个菜很好吃。", chunks: [{word:"这个",meaning:"this"},{word:"菜",meaning:"dish"},{word:"好吃",meaning:"delicious"}], drill: { template: "这个菜很 [adj]。", slots: [{key:"adj", options:["辣","咸","淡"]}] } },
  { text: "你会说英语吗？", chunks: [{word:"你",meaning:"you"},{word:"会",meaning:"can"},{word:"说",meaning:"speak"},{word:"英语",meaning:"English"}], drill: { template: "你会说 [lang] 吗？", slots: [{key:"lang", options:["法语","日语","西班牙语"]}] } },
  { text: "我住在中国。", chunks: [{word:"我",meaning:"I"},{word:"住",meaning:"live"},{word:"中国",meaning:"China"}], drill: { template: "我住在 [country]。", slots: [{key:"country", options:["美国","英国","澳大利亚"]}] } },
  { text: "周末愉快！", chunks: [{word:"周末",meaning:"weekend"},{word:"愉快",meaning:"happy"}], drill: null }
];
const enPremium = [
  { text: "I like eating apples.", chunks: [{word:"like",meaning:"喜欢"},{word:"eating",meaning:"吃"},{word:"apples",meaning:"苹果"}], drill: { template: "I like eating [fruit].", slots: [{key:"fruit", options:["bananas","oranges","watermelons"]}] } },
  { text: "She is reading a book.", chunks: [{word:"She",meaning:"她"},{word:"reading",meaning:"阅读"},{word:"book",meaning:"书"}], drill: { template: "She is [action].", slots: [{key:"action", options:["writing a letter","drawing a picture","listening to music"]}] } },
  { text: "The weather is nice today.", chunks: [{word:"weather",meaning:"天气"},{word:"nice",meaning:"好"},{word:"today",meaning:"今天"}], drill: { template: "The weather is [adj] today.", slots: [{key:"adj", options:["hot","cold","comfortable"]}] } },
  { text: "I want to travel.", chunks: [{word:"I",meaning:"我"},{word:"want",meaning:"想"},{word:"travel",meaning:"旅行"}], drill: { template: "I want to [activity].", slots: [{key:"activity", options:["swim","run","climb mountains"]}] } },
  { text: "He is a teacher.", chunks: [{word:"He",meaning:"他"},{word:"teacher",meaning:"老师"}], drill: { template: "He is a [job].", slots: [{key:"job", options:["doctor","engineer","designer"]}] } },
  { text: "Let's go to the movies.", chunks: [{word:"Let's",meaning:"我们"},{word:"go",meaning:"去"},{word:"movies",meaning:"电影"}], drill: { template: "Let's go to the [place].", slots: [{key:"place", options:["concert","exhibition","game"]}] } },
  { text: "This dish is delicious.", chunks: [{word:"This",meaning:"这个"},{word:"dish",meaning:"菜"},{word:"delicious",meaning:"好吃"}], drill: { template: "This dish is [adj].", slots: [{key:"adj", options:["spicy","salty","bland"]}] } },
  { text: "Can you speak English?", chunks: [{word:"Can",meaning:"能"},{word:"speak",meaning:"说"},{word:"English",meaning:"英语"}], drill: { template: "Can you speak [lang]?", slots: [{key:"lang", options:["French","Japanese","Spanish"]}] } },
  { text: "I live in China.", chunks: [{word:"I",meaning:"我"},{word:"live",meaning:"住"},{word:"China",meaning:"中国"}], drill: { template: "I live in [country].", slots: [{key:"country", options:["USA","UK","Australia"]}] } },
  { text: "Have a nice weekend!", chunks: [{word:"weekend",meaning:"周末"},{word:"nice",meaning:"愉快"}], drill: null }
];

// 生成剩余的290句（空词块）
const zhExtra = makeEmptySentences('中文', TOTAL - PREMIUM, 'zh');
const enExtra = makeEmptySentences('英文', TOTAL - PREMIUM, 'en');

// 合并得到完整语料库
const SENTENCES = {
  zh: [...zhPremium, ...zhExtra],
  en: [...enPremium, ...enExtra]
};

// ============================================================
// 2. 状态管理
// ============================================================
const STORAGE_KEY = 'bilingual_en_pay_v3';
let state = {
  level: 'free',          // 'free' 或 'en_unlocked'
  currentLang: 'zh',
  currentIndex: 0,
  customChunks: null      // 存储用户导入的词块数据（覆盖原有）
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

// ============================================================
// 3. 核心UI元素
// ============================================================
const langBtns = document.querySelectorAll('.lang-toggle button');
const displayEl = document.getElementById('sentenceDisplay');
const chunkList = document.getElementById('chunkList');
const drillTemplate = document.getElementById('drillTemplate');
const drillOptions = document.getElementById('drillOptions');
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
const countBadge = document.getElementById('countBadge');
const levelBadge = document.getElementById('levelBadge');
const progressFill = document.getElementById('progressFill');
const progressPercent = document.getElementById('progressPercent');
const paywall = document.getElementById('paywall');
const payConfirmBtn = document.getElementById('payConfirmBtn');
const payCloseBtn = document.getElementById('payCloseBtn');
const importTrigger = document.getElementById('importTrigger');

// ============================================================
// 4. 数据获取（支持自定义词块）
// ============================================================
function getCurrentData() {
  const lang = state.currentLang;
  const list = SENTENCES[lang];
  if (state.currentIndex >= list.length) state.currentIndex = 0;
  let item = list[state.currentIndex];
  // 如果存在自定义词块数据，则覆盖该句的chunks
  if (state.customChunks && state.customChunks[lang] && state.customChunks[lang][state.currentIndex]) {
    const custom = state.customChunks[lang][state.currentIndex];
    if (custom.chunks) item = { ...item, chunks: custom.chunks };
    if (custom.drill) item = { ...item, drill: custom.drill };
  }
  return {
    list,
    item,
    index: state.currentIndex
  };
}

// ============================================================
// 5. 语音播放
// ============================================================
function speakText(text) {
  if (!('speechSynthesis' in window)) return alert('浏览器不支持语音');
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = state.currentLang === 'zh' ? 'zh-CN' : 'en-US';
  utterance.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const voice = state.currentLang === 'zh' 
    ? voices.find(v => v.lang.includes('zh')) 
    : voices.find(v => v.lang.includes('en-US') && v.name.includes('Google')) || voices.find(v => v.lang.includes('en'));
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}

// ============================================================
// 6. 界面更新
// ============================================================
function updateUI() {
  const { item, index, list } = getCurrentData();
  const lang = state.currentLang;
  const total = list.length;

  displayEl.textContent = item.text || '无内容';

  // 词块
  if (item.chunks && item.chunks.length > 0) {
    chunkList.innerHTML = item.chunks.map(c => 
      `<div class="chunk-item">${c.word} <span>${c.meaning}</span></div>`
    ).join('');
  } else {
    chunkList.innerHTML = '<span class="no-chunk">✨ 暂无词块，可导入或解锁更多</span>';
  }

  // 替换练习
  if (item.drill && item.drill.slots && item.drill.slots.length > 0) {
    const slotKey = item.drill.slots[0].key;
    const options = item.drill.slots[0].options || [];
    const templateHtml = item.drill.template.replace(`[${slotKey}]`, `<span class="highlight">___</span>`);
    drillTemplate.innerHTML = templateHtml;
    drillOptions.innerHTML = options.map(opt => 
      `<button data-opt="${opt}">${opt}</button>`
    ).join('');
    drillOptions.querySelectorAll('button').forEach(btn => {
      btn.onclick = function(e) {
        e.stopPropagation();
        const opt = this.dataset.opt;
        const newText = item.drill.template.replace(`[${item.drill.slots[0].key}]`, opt);
        displayEl.textContent = newText;
        speakText(newText);
        this.style.background = '#2a7de1';
        this.style.color = '#fff';
        setTimeout(() => { this.style.background = ''; this.style.color = ''; }, 300);
      };
    });
  } else {
    drillTemplate.textContent = '🚀 无替换练习，后续可导入';
    drillOptions.innerHTML = '<span class="no-drill">敬请期待</span>';
  }

  // 等级徽章
  const isEnUnlocked = state.level === 'en_unlocked';
  if (lang === 'zh') {
    levelBadge.innerHTML = '🇨🇳 中文 (全部免费)';
    levelBadge.className = 'badge';
  } else {
    if (isEnUnlocked) {
      levelBadge.innerHTML = '🇺🇸 英文 (已解锁)';
      levelBadge.className = 'badge vip';
    } else {
      levelBadge.innerHTML = '🇺🇸 英文 (限前10句)';
      levelBadge.className = 'badge';
    }
  }

  countBadge.textContent = `📖 ${index + 1} / ${total}`;
  const progress = ((index + 1) / total) * 100;
  progressFill.style.width = progress + '%';
  progressPercent.textContent = Math.round(progress) + '%';

  langBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === state.currentLang);
  });

  saveState();
}

// ============================================================
// 7. 播放逻辑（含付费拦截）
// ============================================================
function handlePlay() {
  const lang = state.currentLang;
  const { item, index, list } = getCurrentData();
  const total = list.length;

  if (lang === 'en' && state.level !== 'en_unlocked' && index >= 10) {
    paywall.classList.add('show');
    return;
  }

  let textToSpeak = displayEl.textContent;
  if (!textToSpeak || textToSpeak.includes('点击') || textToSpeak.includes('无内容')) {
    textToSpeak = item.text;
  }
  speakText(textToSpeak);

  state.currentIndex = (index + 1) % total;
  saveState();
  updateUI();
}

// ============================================================
// 8. 付费弹窗
// ============================================================
payConfirmBtn.onclick = function() {
  if (confirm('💳 模拟支付 $5 成功！')) {
    state.level = 'en_unlocked';
    saveState();
    updateUI();
    paywall.classList.remove('show');
    alert('🎉 英文全部内容已永久解锁！');
  }
};
payCloseBtn.onclick = () => paywall.classList.remove('show');
paywall.onclick = (e) => { if (e.target === paywall) paywall.classList.remove('show'); };

// ============================================================
// 9. 管理员功能：导入词块数据
// ============================================================
importTrigger.addEventListener('click', function() {
  const jsonStr = prompt('📥 请粘贴您准备好的词块JSON数据（格式见说明）：\n\n{\n  "zh": [ { "chunks": [{"word":"喜欢","meaning":"like"}, ...] }, ... ],\n  "en": [ ... ]\n}\n\n注意：数组长度必须为300，且顺序与句子顺序一致。');
  if (!jsonStr) return;
  try {
    const imported = JSON.parse(jsonStr);
    // 验证格式
    if (!imported.zh || !imported.en || imported.zh.length !== TOTAL || imported.en.length !== TOTAL) {
      alert('❌ 数据格式错误：必须包含 zh 和 en 两个数组，且长度均为 300。');
      return;
    }
    // 保存到 state
    state.customChunks = {
      zh: imported.zh.map(item => ({ chunks: item.chunks || [], drill: item.drill || null })),
      en: imported.en.map(item => ({ chunks: item.chunks || [], drill: item.drill || null }))
    };
    saveState();
    updateUI();
    alert('✅ 词块导入成功！共 ' + (imported.zh.reduce((acc,cur) => acc + (cur.chunks?cur.chunks.length:0), 0) + imported.en.reduce((acc,cur) => acc + (cur.chunks?cur.chunks.length:0), 0)) + ' 个词块。');
  } catch (e) {
    alert('❌ JSON解析失败：' + e.message);
  }
});

// ============================================================
// 10. 管理员后门 (admin888)
// ============================================================
document.addEventListener('dblclick', function(e) {
  if (e.target.closest('.app')) {
    const pwd = prompt('🔐 管理员激活码：');
    if (pwd === 'admin888') {
      state.level = 'en_unlocked';
      saveState();
      updateUI();
      alert('👑 英文已永久解锁！中文始终免费。');
    } else if (pwd !== null) alert('❌ 错误');
  }
});

// ============================================================
// 11. 事件绑定与启动
// ============================================================
langBtns.forEach(btn => {
  btn.addEventListener('click', function() {
    const lang = this.dataset.lang;
    if (state.currentLang !== lang) {
      state.currentLang = lang;
      state.currentIndex = 0;
      saveState();
      updateUI();
      window.speechSynthesis.cancel();
    }
  });
});

playBtn.addEventListener('click', handlePlay);
resetBtn.addEventListener('click', function() {
  if (confirm('重置进度？(解锁状态保留)')) {
    state.currentIndex = 0;
    saveState();
    updateUI();
    alert('已重置到第一句');
  }
});

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

loadState();
updateUI();
console.log('🚀 双语学习 · 英文付费版 (可导入词块) 已启动！');
</script>
</body>
</html>
