<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🎧 每句练耳 · Chaowen AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f7fa;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
               "Segoe UI","PingFang SC",
               "Microsoft YaHei",sans-serif;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:12px;
}

/* 顶部 */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.sub{
  font-size:12px;
  color:#888;
}

/* 小卡片 */
.card{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.title{
  font-size:14px;
  font-weight:700;
  margin-bottom:9px;
}

.progress{
  font-size:12px;
  color:#888;
}

/* 词族 */
.family{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.word{
  border:0;
  border-radius:10px;
  background:#f1f3f5;
  padding:10px 3px;
  font-size:16px;
  font-weight:600;
}

.word.active{
  background:#222;
  color:white;
}

/* 当前单词 */
.current{
  text-align:center;
  padding:4px 0;
}

.currentWord{
  font-size:38px;
  font-weight:800;
  letter-spacing:1px;
}

.meaning{
  color:#777;
  font-size:15px;
  margin-top:3px;
}

.playMain{
  margin-top:10px;
  border:0;
  border-radius:10px;
  padding:10px 22px;
  background:#222;
  color:white;
  font-size:15px;
}

/* 拼读 */
.blend{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:10px;
}

.block{
  background:#f0f2f5;
  border-radius:8px;
  padding:7px 10px;
  font-weight:600;
}

.arrow{
  color:#999;
}

/* 词块 */
.chunks{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chunk{
  border:0;
  background:#f0f2f5;
  border-radius:9px;
  padding:8px 11px;
  font-size:14px;
}

/* 母句型 */
.pattern{
  font-size:20px;
  font-weight:700;
  text-align:center;
  margin:5px 0;
}

.cn{
  text-align:center;
  color:#777;
  font-size:13px;
}

.sentences{
  margin-top:9px;
}

.sentence{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 0;
  border-top:1px solid #eee;
  font-size:15px;
}

.sentence button{
  border:0;
  background:#f0f2f5;
  border-radius:8px;
  padding:6px 9px;
}

/* 听力 */
.listenBox{
  text-align:center;
}

.listenText{
  min-height:26px;
  font-size:18px;
  font-weight:600;
  margin:8px 0;
}

.listenCN{
  color:#888;
  font-size:13px;
  min-height:20px;
}

/* 底部控制 */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.controls button{
  border:0;
  border-radius:10px;
  padding:11px 5px;
  font-size:14px;
  background:#eef0f3;
}

.controls .primary{
  background:#222;
  color:white;
}

.speed{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.speed button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:7px;
  background:#f0f2f5;
  font-size:12px;
}

.speed button.active{
  background:#222;
  color:white;
}

/* 手机优化 */
@media(max-width:380px){
  .app{
    padding:9px;
  }

  .card{
    padding:11px;
    margin-bottom:8px;
  }

  .currentWord{
    font-size:34px;
  }

  .sentence{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- 顶部 -->
  <div class="header">
    <div>
      <div class="logo">🎧 每句练耳</div>
      <div class="sub">Chaowen AI · 词族 × 词块 × 句子</div>
    </div>

    <div class="progress" id="progress">
      1 / 8
    </div>
  </div>


  <!-- ① 词族 -->
  <div class="card">

    <div class="title">
      今天的词族：<b>-at</b>
    </div>

    <div class="family" id="family"></div>

  </div>


  <!-- ② 当前单词 -->
  <div class="card">

    <div class="current">

      <div class="currentWord" id="currentWord">
        cat
      </div>

      <div class="meaning" id="meaning">
        猫
      </div>

      <button class="playMain" onclick="speakCurrent()">
        🔊 听单词
      </button>

      <div class="blend" id="blend"></div>

    </div>

  </div>


  <!-- ③ 词块 -->
  <div class="card">

    <div class="title">词块</div>

    <div class="chunks" id="chunks"></div>

  </div>


  <!-- ④ 母句型 -->
  <div class="card">

    <div class="title">母句型</div>

    <div class="pattern">
      I want to ...
    </div>

    <div class="cn">
      我想……
    </div>

    <div class="sentences" id="sentences"></div>

  </div>


  <!-- ⑤ 听力 -->
  <div class="card">

    <div class="title">🎧 先听英语</div>

    <div class="listenBox">

      <button
        class="playMain"
        onclick="listenFirst()">
        🔊 听句子
      </button>

      <div class="listenText" id="listenText"></div>

      <div class="listenCN" id="listenCN"></div>

    </div>

  </div>


  <!-- ⑥ 控制 -->
  <div class="card">

    <div class="controls">

      <button onclick="previousWord()">
        ← 上一个
      </button>

      <button
        class="primary"
        onclick="nextWord()">
        下一个 →
      </button>

      <button onclick="repeatCurrent()">
        🔁 重复
      </button>

      <button onclick="stopSpeech()">
        ■ 停止
      </button>

    </div>

    <div class="speed">

      <button
        id="slowBtn"
        onclick="setSpeed(.68,this)">
        慢速
      </button>

      <button
        class="active"
        onclick="setSpeed(.85,this)">
        正常
      </button>

      <button
        onclick="setSpeed(1,this)">
        自然
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   数据
===================================================== */

const words = [

  {
    word:"at",
    cn:"在",
    start:"",
    chunks:["at","at home"],
    sentences:[
      ["I want to stay at home.","我想待在家里。"]
    ]
  },

  {
    word:"bat",
    cn:"蝙蝠；球棒",
    start:"b",
    chunks:["bat","a bat"],
    sentences:[
      ["I want to see a bat.","我想看一只蝙蝠。"]
    ]
  },

  {
    word:"cat",
    cn:"猫",
    start:"c",
    chunks:["cat","the cat","my cat"],
    sentences:[
      ["I want to see the cat.","我想看看那只猫。"],
      ["I want to feed my cat.","我想喂我的猫。"]
    ]
  },

  {
    word:"fat",
    cn:"胖的",
    start:"f",
    chunks:["fat","a fat cat"],
    sentences:[
      ["I want to see a fat cat.","我想看看一只胖猫。"]
    ]
  },

  {
    word:"hat",
    cn:"帽子",
    start:"h",
    chunks:["hat","my hat","a red hat"],
    sentences:[
      ["I want to buy a hat.","我想买一顶帽子。"]
    ]
  },

  {
    word:"mat",
    cn:"垫子",
    start:"m",
    chunks:["mat","the mat","on the mat"],
    sentences:[
      ["The cat is on the mat.","猫在垫子上。"]
    ]
  },

  {
    word:"rat",
    cn:"老鼠",
    start:"r",
    chunks:["rat","a rat"],
    sentences:[
      ["I see a rat.","我看到一只老鼠。"]
    ]
  },

  {
    word:"sat",
    cn:"坐下；坐着",
    start:"s",
    chunks:["sat","sat down","the cat sat"],
    sentences:[
      ["The cat sat on the mat.","猫坐在垫子上。"]
    ]
  }

];


/* =====================================================
   状态
===================================================== */

let index = 2;
let speed = .85;
let speaking = false;
let speechToken = 0;


/* =====================================================
   安全停止
===================================================== */

function stopSpeech(){

  speechToken++;

  speaking = false;

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

}


/* =====================================================
   稳定播放
===================================================== */

function speak(text, rate=speed){

  if(!text) return;

  const token = ++speechToken;

  stopNativeOnly();

  setTimeout(()=>{

    if(token !== speechToken) return;

    const u = new SpeechSynthesisUtterance(text);

    u.lang = "en-US";
    u.rate = rate;
    u.pitch = 1;
    u.volume = 1;

    u.onstart = ()=>{
      speaking = true;
    };

    u.onend = ()=>{
      if(token === speechToken){
        speaking = false;
      }
    };

    u.onerror = ()=>{
      if(token === speechToken){
        speaking = false;
      }
    };

    speechSynthesis.speak(u);

  },80);

}


function stopNativeOnly(){

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

}


/* =====================================================
   当前单词
===================================================== */

function render(){

  const item = words[index];

  document.getElementById("progress").textContent =
    `${index+1} / ${words.length}`;

  document.getElementById("currentWord").textContent =
    item.word;

  document.getElementById("meaning").textContent =
    item.cn;

  renderFamily();
  renderBlend();
  renderChunks();
  renderSentences();

  document.getElementById("listenText").textContent="";
  document.getElementById("listenCN").textContent="";
}


/* =====================================================
   词族
===================================================== */

function renderFamily(){

  const box =
    document.getElementById("family");

  box.innerHTML="";

  words.forEach((item,i)=>{

    const btn =
      document.createElement("button");

    btn.className =
      "word " + (i===index ? "active":"");

    btn.textContent =
      item.word;

    btn.onclick=()=>{

      stopSpeech();

      index=i;

      render();

      setTimeout(()=>{
        speak(words[index].word);
      },120);

    };

    box.appendChild(btn);

  });

}


/* =====================================================
   拼读块
===================================================== */

function renderBlend(){

  const item=words[index];

  const box=document.getElementById("blend");

  if(!item.start){

    box.innerHTML=
      `<div class="block">${item.word}</div>`;

    return;
  }

  box.innerHTML=`

    <button class="block"
      onclick="speak('${item.start}')">
      ${item.start}
    </button>

    <div class="arrow">+</div>

    <button class="block"
      onclick="speak('at')">
      at
    </button>

    <div class="arrow">→</div>

    <button class="block"
      onclick="speak('${item.word}')">
      ${item.word}
    </button>

  `;

}


/* =====================================================
   词块
===================================================== */

function renderChunks(){

  const box=document.getElementById("chunks");

  box.innerHTML="";

  words[index].chunks.forEach(chunk=>{

    const btn=
      document.createElement("button");

    btn.className="chunk";

    btn.textContent=chunk;

    btn.onclick=()=>{
      speak(chunk);
    };

    box.appendChild(btn);

  });

}


/* =====================================================
   母句型
===================================================== */

function renderSentences(){

  const box=document.getElementById("sentences");

  box.innerHTML="";

  words[index].sentences.forEach(item=>{

    const row=document.createElement("div");

    row.className="sentence";

    row.innerHTML=`

      <div>
        <div>${item[0]}</div>
        <div style="font-size:12px;color:#999;margin-top:2px">
          ${item[1]}
        </div>
      </div>

      <button>🔊</button>

    `;

    row.querySelector("button")
       .onclick=()=>{
         speak(item[0]);
       };

    box.appendChild(row);

  });

}


/* =====================================================
   当前单词播放
===================================================== */

function speakCurrent(){

  speak(words[index].word);

}


/* =====================================================
   重复
===================================================== */

function repeatCurrent(){

  const item=words[index];

  speak(item.word);

}


/* =====================================================
   上一个
===================================================== */

function previousWord(){

  stopSpeech();

  index--;

  if(index<0){
    index=words.length-1;
  }

  render();

  setTimeout(()=>{
    speak(words[index].word);
  },120);

}


/* =====================================================
   下一个
===================================================== */

function nextWord(){

  stopSpeech();

  index++;

  if(index>=words.length){
    index=0;
  }

  render();

  setTimeout(()=>{
    speak(words[index].word);
  },120);

}


/* =====================================================
   听力优先
===================================================== */

function listenFirst(){

  const item=words[index];

  if(!item.sentences.length) return;

  const sentence=item.sentences[0];

  document.getElementById("listenText").textContent=
    "••••••••";

  document.getElementById("listenCN").textContent=
    "";

  speak(sentence[0],.72);

  setTimeout(()=>{

    document.getElementById("listenText").textContent=
      sentence[0];

    document.getElementById("listenCN").textContent=
      sentence[1];

  },1800);

}


/* =====================================================
   速度
===================================================== */

function setSpeed(value,button){

  speed=value;

  document
    .querySelectorAll(".speed button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

}


/* =====================================================
   初始化
===================================================== */

render();


/* =====================================================
   页面隐藏时停止，防止 iPhone 音频乱掉
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){
      stopSpeech();
    }

  }
);

</script>

</body>
</html>
