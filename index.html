分<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每句练耳</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px 14px 40px;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,
    "Microsoft YaHei",Arial,sans-serif;
}

.container{
    max-width:560px;
    margin:auto;
}

.header{
    text-align:center;
    padding:10px 0 20px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
    color:#888;
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.search input{
    flex:1;
    min-width:0;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search button{
    width:auto;
    margin:0;
    padding:12px 18px;
    background:#222;
    color:white;
}

.results{
    margin-bottom:15px;
}

.result{
    background:white;
    padding:13px;
    margin-bottom:8px;
    border-radius:12px;
    cursor:pointer;
}

.result-en{
    font-weight:bold;
    font-size:17px;
}

.result-cn{
    margin-top:5px;
    color:#777;
}

.card{
    background:white;
    border-radius:22px;
    padding:25px 18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    text-align:center;
}

.scene{
    color:#888;
    font-size:14px;
}

.progress{
    color:#aaa;
    margin-top:6px;
    font-size:14px;
}

.english{
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    font-size:30px;
    font-weight:bold;
    line-height:1.4;
}

.chinese{
    min-height:50px;
    font-size:20px;
    color:#666;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    font-size:17px;
    cursor:pointer;
}

.play{
    background:#222;
    color:white;
}

.normal{
    background:#eee;
}

.nav{
    display:flex;
    gap:8px;
}

.status{
    min-height:24px;
    margin-top:15px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>🎧 每句练耳</h1>

<p>听清 · 听懂 · 开口</p>

</div>


<!-- 搜索 -->

<div class="search">

<input
id="searchInput"
type="search"
placeholder="输入中文或英文"
autocomplete="off"
>

<button onclick="searchSentence()">
搜索
</button>

</div>

<div id="results" class="results"></div>


<!-- 主卡片 -->

<div class="card">

<div id="scene" class="scene">
日常
</div>

<div id="progress" class="progress">
第 1 / 5 句
</div>

<div id="english" class="english">
Good morning.
</div>

<div id="chinese" class="chinese">
早上好。
</div>


<button
class="play"
onclick="playCurrent()">
▶ 播放英语
</button>


<button
class="normal"
onclick="repeatCurrent()">
🔁 重听
</button>


<div class="nav">

<button
class="normal"
onclick="previousSentence()">
⬅ 上一句
</button>

<button
class="normal"
onclick="nextSentence()">
下一句 ➡
</button>

</div>


<button
class="normal"
onclick="randomSentence()">
🎲 随机一句
</button>


<div id="status" class="status">
准备好了
</div>

</div>

</div>


<script>

/* =================================
   句库
================================= */

const lessons = [

{
    scene:"日常",
    en:"Good morning.",
    cn:"早上好。"
},

{
    scene:"日常",
    en:"How are you?",
    cn:"你好吗？"
},

{
    scene:"日常",
    en:"What are you doing?",
    cn:"你在做什么？"
},

{
    scene:"日常",
    en:"Where are you going?",
    cn:"你要去哪里？"
},

{
    scene:"日常",
    en:"Where do you live?",
    cn:"你住在哪里？"
}

];


let current = 0;


/* =================================
   语音状态
================================= */

let speaking = false;


/* =================================
   元素
================================= */

const status =
document.getElementById("status");


/* =================================
   停止所有语音
================================= */

function stopSpeech(){

    try{

        window.speechSynthesis.cancel();

    }catch(e){}

    speaking = false;

}


/* =================================
   播放当前句
================================= */


/* =================================
   重听
================================= */
const item = lessons[current];

// 彻底清空上一条语音
try {
    speechSynthesis.cancel();
} catch(e) {}

speaking = false;

// 重新创建语音对象
const utterance =
    new SpeechSynthesisUtterance(item.en);

// 固定英语
utterance.lang = "en-US";

// 关键：速度保持已经验证有效的 0.85
utterance.rate = 0.85;

utterance.pitch = 1;
utterance.volume = 1;

utterance.onstart = function(){
    speaking = true;
    status.innerText = "🎧 正在播放……";
};

utterance.onend = function(){
    speaking = false;
    status.innerText = "✅ 播放完成";
};

utterance.onerror = function(){
    speaking = false;
    status.innerText = "⚠️ 播放失败";
};

// 关键：
// 先让系统完成 cancel，
// 再重新 speak
setTimeout(function(){

    try {

        speechSynthesis.cancel();

        setTimeout(function(){

            speechSynthesis.speak(
                utterance
            );

        }, 50);

    } catch(e) {

        status.innerText =
            "⚠️ 播放失败";

    }

}, 50);
function repeatCurrent(){

    stopSpeech();

    setTimeout(
        function(){

            playCurrent();

        },
        100
    );

}


/* =================================
   下一句
================================= */

function nextSentence(){

    stopSpeech();

    current++;

    if(
        current >=
        lessons.length
    ){

        current = 0;

    }

    showSentence();

    status.innerText =
    "准备好了";

}


/* =================================
   上一句
================================= */




/* =================================
   随机一句
================================= */
const item = lessons[current];

const utterance =
    new SpeechSynthesisUtterance(item.en);

utterance.lang = "en-US";
utterance.rate = 0.85;
utterance.pitch = 1;
utterance.volume = 1;

utterance.onstart = function(){
    speaking = true;
    status.innerText = "🎧 正在播放……";
};

utterance.onend = function(){
    speaking = false;
    status.innerText = "✅ 播放完成";
};

utterance.onerror = function(){
    speaking = false;
    status.innerText = "⚠️ 播放失败";
};

// 关键实验：
// 不 cancel
// 不 setTimeout
// 直接播放

window.speechSynthesis.speak(utterance);
function randomSentence(){

    stopSpeech();

    current =
    Math.floor(
        Math.random() *
        lessons.length
    );

    showSentence();

    status.innerText =
    "🎲 已选择随机句子";

}


/* =================================
   显示句子
================================= */

function showSentence(){

    const item =
    lessons[current];


    document.getElementById("scene")
    .innerText =
    item.scene;


    document.getElementById("english")
    .innerText =
    item.en;


    document.getElementById("chinese")
    .innerText =
    item.cn;


    document.getElementById("progress")
    .innerText =
    "第 " +
    (current + 1) +
    " / " +
    lessons.length +
    " 句";

}


/* =================================
   搜索
================================= */

function searchSentence(){

    const input =
    document.getElementById(
        "searchInput"
    );


    const keyword =
    input.value
    .trim()
    .toLowerCase();


    const results =
    document.getElementById(
        "results"
    );


    results.innerHTML =
    "";


    if(!keyword){

        return;

    }


    lessons.forEach(
        function(item,index){

            const en =
            item.en
            .toLowerCase();


            const cn =
            item.cn;


            if(
                en.includes(keyword)
                ||
                cn.includes(keyword)
            ){

                const box =
                document.createElement(
                    "div"
                );


                box.className =
                "result";


                box.innerHTML =

                "<div class='result-en'>" +
                item.en +
                "</div>" +

                "<div class='result-cn'>" +
                item.cn +
                "</div>";


                box.onclick =
                function(){

                    stopSpeech();

                    current =
                    index;

                    showSentence();

                    results.innerHTML =
                    "";

                    input.value =
                    "";

                };


                results.appendChild(
                    box
                );

            }

        }
    );


    if(
        results.innerHTML === ""
    ){

        results.innerHTML =
        "<div class='result'>" +
        "没有找到相关句子" +
        "</div>";

    }

}


/* =================================
   回车搜索
================================= */

document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            searchSentence();

        }

    }
);


/* =================================
   初始化
================================= */

showSentence();

</script>

</body>
</html>
