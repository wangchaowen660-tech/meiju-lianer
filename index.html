* {

}

body {
    margin: 0;
    background: #f5f7fa;

        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    color: #18202a;
}

.container {
    max-width: 600px;

    padding: 20px 16px 40px;
}

.header {
    text-align: center;
    padding: 15px 0 20px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
}

.brand {
    margin-top: 5px;
    color: #53606e;
    font-size: 14px;
}

.progress-box {
    margin-top: 10px;
}

.progress-text {
    font-size: 14px;
    color: #687482;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 7px;
    background: #dfe4ea;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #18202a;
    transition: width 0.3s ease;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 28px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    text-align: center;
    margin-top: 20px;
}

.category {
    display: inline-block;
    background: #eef1f5;
    color: #53606e;
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 13px;
    margin-bottom: 25px;
}

.listen-icon {
    font-size: 58px;
    margin: 5px 0 15px;
}

.instruction {
    font-size: 15px;
    color: #697583;
    line-height: 1.6;
    min-height: 48px;
}

.sentence {
    display: none;
    font-size: 27px;
    line-height: 1.45;
    font-weight: 700;
    margin: 25px 5px 15px;
}

.translation {
    display: none;
    font-size: 17px;
    color: #687482;
    line-height: 1.6;
    margin-top: 12px;
}

/* ---------- 解密提示面板 ---------- */

.hint-panel {
    display: none;
    margin-top: 18px;
    padding: 18px 16px 16px;
    background: #fffdf5;
    border: 1px solid #f0e5c0;
    border-radius: 16px;
    text-align: left;
}

.hint-panel.show {
    display: block;
}

.hint-label {
    font-size: 12px;
    font-weight: 700;
    color: #a08a3c;
    letter-spacing: 0.6px;
    margin: 14px 0 6px;
}

.hint-label:first-child {
    margin-top: 0;
}

.hint-original {
    font-size: 16px;
    color: #18202a;
    line-height: 1.55;
}

.hint-decoded {
    font-size: 18px;
    font-weight: 700;
    color: #c9770a;
    line-height: 1.55;
    letter-spacing: 0.2px;
}

.hint-decoded.empty {
    color: #9aa3ad;
    font-weight: 400;
    font-size: 14px;
    font-style: italic;
}

.hint-notes {
    font-size: 14px;
    color: #5e6673;
    line-height: 1.85;
}

.hint-notes div {
    padding-left: 2px;
}

.hint-note-title {
    font-weight: 700;
    color: #8a7530;
}

/* ---------- 按钮 ---------- */

button {
    border: none;
    border-radius: 15px;
    font-size: 17px;
    font-weight: 600;
    padding: 15px 18px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.2s ease;
    font-family: inherit;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.main-btn {
    width: 100%;
    background: #18202a;
    color: white;
    margin-top: 18px;
}

.secondary-btn {
    width: 100%;
    background: #eef1f5;
    color: #18202a;
    margin-top: 12px;
}

.hint-btn {
    width: 100%;
    background: #fff6dd;
    color: #8a6d1a;
    margin-top: 12px;
    border: 1px solid #f0e0a8;
}

.hint-btn.active {
    background: #f7e9b4;
}

.controls {
    margin-top: 20px;
}

.row {
    display: flex;
    gap: 10px;
}

.row button {
    flex: 1;
}

.speed-title {
    margin-top: 25px;
    color: #697583;
    font-size: 14px;
}

.speed-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.speed-btn {
    flex: 1;
    background: #eef1f5;
    color: #18202a;
    padding: 11px 5px;
    font-size: 14px;
}

.speed-btn.active {
    background: #18202a;
    color: white;
}

.jump-box {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    align-items: center;
}

.jump-box input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #dfe4ea;
    font-size: 15px;
    font-family: inherit;
    color: #18202a;
    background: #f7f9fb;
    outline: none;
    text-align: center;
}

.jump-box input:focus {
    border-color: #18202a;
}

.jump-box button {
    flex: 0 0 auto;
    padding: 12px 18px;
    font-size: 15px;
    background: #eef1f5;
    color: #18202a;
}

.tip {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: #f1f4f7;
    color: #687482;
    font-size: 13px;
    line-height: 1.7;
    text-align: left;
}

.status {
    margin-top: 15px;
    min-height: 22px;
    color: #687482;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #9aa3ad;
    font-size: 12px;
    margin-top: 30px;
}

@media (max-width: 380px) {
    .sentence { font-size: 23px; }
    button { font-size: 16px; }
    .hint-decoded { font-size: 16px; }
}
</style>
</head>

<div class="container">

    <div class="header">
        <div class="logo">🎧 每句练耳</div>
        <div class="brand">Chaowen AI · 真实英语听力训练</div>

        <div class="progress-box">
            <div class="progress-text" id="progressText">

            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <div class="card">

        <div class="category" id="category">Daily</div>

        <div class="listen-icon" id="listenIcon">🎧</div>

        </div>

        <div class="sentence" id="sentence"></div>
        <div class="translation" id="translation"></div>

        <button class="main-btn" id="listenBtn">🎧 听句子</button>
        <button class="secondary-btn" id="showEnglishBtn">👀 显示英文</button>
        <button class="secondary-btn" id="showChineseBtn">🇨🇳 显示中文意思</button>
        <button class="hint-btn" id="hintBtn">🔍 解密提示</button>

        <!-- 解密提示面板 -->
        <div class="hint-panel" id="hintPanel">

            <div class="hint-original" id="hintOriginal"></div>

            <div class="hint-label">🎧 真实语流</div>
            <div class="hint-decoded" id="hintDecoded"></div>

            <div class="hint-label">📝 解密要点</div>
            <div class="hint-notes" id="hintNotes"></div>

        </div>

        <div class="controls">

            <div class="row">
                <button class="secondary-btn" id="prevBtn">← 上一句</button>
                <button class="secondary-btn" id="repeatBtn">🔁 再听一次</button>
            </div>

            <div class="row" style="margin-top:10px;">

            <div class="speed-title">语速</div>

                <button class="speed-btn" data-speed="1">1.0×</button>
            </div>

            <div class="jump-box">
                <input type="number" id="jumpInput" min="1" placeholder="跳到第几号">
                <button id="jumpBtn">跳转</button>
            </div>

            <button class="main-btn" id="nextBtn">下一句 →</button>

        </div>

        <div class="status" id="status"></div>

        <div class="tip">
            💡 <strong>训练方法：</strong><br>
            ① 第一次：不看英文，只听。<br>
            ② 第二次：再听一遍，尝试抓住整体意思。<br>
            ③ 卡住了：点「🔍 解密提示」，看看真实语流里发生了哪些变化。<br>
            ④ 最后：跟着声音说一遍。
        </div>

    </div>

    <div class="footer">
        Chaowen AI · 每一句都是一次听力训练
    </div>

</div>

/* =========================================================
   2. 解密规则库
   ---------------------------------------------------------
   把母语者实际发音的变化，用规则从原句推导出来。
   ========================================================= */

/* 连读/缩略/同化规则：{原样 → 真实语流} */
const DECODE_RULES = [
    { re: /\bwant to\b/gi,      to: "wanna",    note: "want to → wanna /ˈwɑːnə/（连读 + 弱读）" },
    { re: /\bgoing to\b/gi,     to: "gonna",    note: "going to → gonna /ˈɡɔːnə/（连读 + 弱读）" },
    { re: /\bgot to\b/gi,       to: "gotta",    note: "got to → gotta /ˈɡɑːtə/" },
    { re: /\bhave to\b/gi,      to: "hafta",    note: "have to → hafta（v 清化为 f）" },
    { re: /\bhas to\b/gi,       to: "hasta",    note: "has to → hasta" },
    { re: /\bkind of\b/gi,      to: "kinda",    note: "kind of → kinda /ˈkaɪndə/" },
    { re: /\bsort of\b/gi,      to: "sorta",    note: "sort of → sorta /ˈsɔːrtə/" },
    { re: /\blot of\b/gi,       to: "lotta",    note: "lot of → lotta /ˈlɑːtə/" },
    { re: /\blots of\b/gi,      to: "lotsa",    note: "lots of → lotsa" },
    { re: /\bdon't know\b/gi,   to: "dunno",    note: "don't know → dunno /dəˈnoʊ/" },
    { re: /\blet me\b/gi,       to: "lemme",    note: "let me → lemme /ˈlɛmi/" },
    { re: /\bgive me\b/gi,      to: "gimme",    note: "give me → gimme /ˈɡɪmi/" },
    { re: /\bwhat do you\b/gi,  to: "whaddaya", note: "what do you → whaddaya" },
    { re: /\bwhat are you\b/gi, to: "whaddaya", note: "what are you → whaddaya" },
    { re: /\bdid you\b/gi,      to: "didja",    note: "did you → didja（d + y 同化）" },
    { re: /\bwould you\b/gi,    to: "wouldja",  note: "would you → wouldja" },
    { re: /\bcould you\b/gi,    to: "couldja",  note: "could you → couldja" },
    { re: /\bshould you\b/gi,   to: "shouldja", note: "should you → shouldja" },
    { re: /\bcan you\b/gi,      to: "canya",    note: "can you → canya" },
    { re: /\bare you\b/gi,      to: "arya",     note: "are you → arya /ˈɑːrjə/" }
];

/* 弱读规则（独立提示，不改写句子） */
const WEAK_FORMS = [
    { re: /\bto\b/i,   note: "to → /tə/（弱读）" },
    { re: /\bfor\b/i,  note: "for → /fər/（弱读）" },
    { re: /\bof\b/i,   note: "of → /əv/ 或 /ə/（弱读）" },
    { re: /\band\b/i,  note: "and → /ən/ 或 /n/（弱读）" },
    { re: /\byou\b/i,  note: "you → /jə/（弱读）" },
    { re: /\byour\b/i, note: "your → /jər/（弱读）" },
    { re: /\bcan\b/i,  note: "can → /kən/（弱读，比 can't 弱很多）" },
    { re: /\bfrom\b/i, note: "from → /frəm/（弱读）" },
    { re: /\bthe\b/i,  note: "the → /ðə/（元音前变 /ði/）" },
    { re: /\bhim\b/i,  note: "him → /ɪm/（h 常省音）" },
    { re: /\bher\b/i,  note: "her → /ər/（h 常省音）" },
    { re: /\bthem\b/i, note: "them → /əm/（th 常省音）" }
];

/* 只在没有匹配到任何规则时，给出通用提示 */
const FALLBACK_NOTE =
    "· 本句语速较慢，没有明显的连读或缩略，注意句子的重音和节奏。";


/* =========================================================
   3. 生成解密提示
   ========================================================= */

function buildHint(en) {

    let decoded = en;
    const notes = [];

    /* 第一层：连读 / 缩略 / 同化 */
    DECODE_RULES.forEach(rule => {

        const before = decoded;
        decoded = decoded.replace(rule.re, rule.to);

        /* 只有真正替换成功，才记录提示，且不重复 */
        if (decoded !== before && !notes.includes(rule.note)) {
            notes.push(rule.note);
        }
    });

    /* 第二层：弱读（不改写句子，只追加提示） */
    WEAK_FORMS.forEach(rule => {

        /* 用没有 g 标志的临时正则，避免 lastIndex 干扰 */
        const testRe = new RegExp(rule.re.source, "i");

        if (testRe.test(en) && !notes.includes(rule.note)) {
            notes.push(rule.note);
        }
    });

    /* 第三层：兜底 */
    if (notes.length === 0) {
        notes.push(FALLBACK_NOTE);
        return { decoded: null, notes };
    }

    /* 如果 decoded 没有被任何规则修改过，就不显示“真实语流” */
    if (decoded === en) {
        return { decoded: null, notes };
    }

    return { decoded, notes };
}

   ========================================================= */

function loadVoices() {

    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return;

    currentVoice = voices.find(v =>
        v.lang && v.lang.toLowerCase() === "en-us"
    );

    if (!currentVoice) {
        currentVoice = voices.find(v =>
            v.lang && v.lang.toLowerCase().startsWith("en")
        );
    }
}


/* =========================================================
   7. 页面初始化
   ========================================================= */

function init() {

    loadVoices();

    try {
        const saved = parseInt(localStorage.getItem("cw_listen_index"), 10);
        if (!isNaN(saved) && saved >= 0 && saved < lessons.length) {
            currentIndex = saved;
        }
    } catch (e) { /* 隐私模式忽略 */ }

    showLesson();
    statusEl.textContent = "准备好了。先听，不要看英文。";
}

    hideHint();

    instruction.innerHTML =
        "先不要看英文。<br>戴上耳朵，听完整句话。";

    listenIcon.textContent = "🎧";
    listenBtn.textContent  = "🎧 听句子";

    showEnglishBtn.textContent = "👀 显示英文";
    showChineseBtn.textContent = "🇨🇳 显示中文意思";

    updateProgress();

    try {
        localStorage.setItem("cw_listen_index", currentIndex);
    } catch (e) { /* 忽略 */ }
}


/* =========================================================
   9. 更新进度
   ========================================================= */

function updateProgress() {

    const total  = lessons.length;
    const number = currentIndex + 1;

    progressText.textContent = `第 ${number} / ${total} 句`;
    progressBar.style.width  = ((number / total) * 100) + "%";
}


/* =========================================================
   10. 播放句子
   ========================================================= */

function speakCurrent() {

    if (!("speechSynthesis" in window)) {
        statusEl.textContent = "你的设备暂不支持语音播放。";
        return;
    }

    const token = ++speakToken;

    /* 收起英文/中文/解密面板，回到“先听不看” */
    sentence.style.display    = "none";
    translation.style.display = "none";
    showEnglishBtn.textContent = "👀 显示英文";
    showChineseBtn.textContent = "🇨🇳 显示中文意思";
    hideHint();

    window.speechSynthesis.cancel();

    const lesson    = lessons[currentIndex];
    const utterance = new SpeechSynthesisUtterance(lesson.e);

    utterance.lang   = "en-US";
    utterance.rate   = currentSpeed;
    utterance.pitch  = 1;
    utterance.volume = 1;

    if (currentVoice) utterance.voice = currentVoice;

    utterance.onstart = function () {
        if (token !== speakToken) return;
        listenIcon.textContent = "🔊";
        statusEl.textContent   = "正在播放……";
        listenBtn.textContent  = "🔊 播放中";
    };

    utterance.onend = function () {
        if (token !== speakToken) return;
        listenIcon.textContent = "🎧";
        statusEl.textContent   = "播放完成。现在试着自己说一遍。";
        listenBtn.textContent  = "🎧 再听一次";
    };

    utterance.onerror = function () {
        if (token !== speakToken) return;
        listenIcon.textContent = "⚠️";
        statusEl.textContent   = "语音播放出现问题，请再点一次。";
        listenBtn.textContent  = "🎧 听句子";
    };

    setTimeout(function () {
        if (token !== speakToken) return;
        window.speechSynthesis.speak(utterance);
    }, 80);
}


/* =========================================================
   11. 停止播放
   ========================================================= */

function stopSpeaking() {

    speakToken++;
    window.speechSynthesis.cancel();

    listenIcon.textContent = "🎧";
    listenBtn.textContent  = "🎧 听句子";
    statusEl.textContent   = "已停止。";
}


/* =========================================================
   12. 显示英文
   ========================================================= */

function showEnglish() {

    const isHidden = sentence.style.display === "none";

    if (isHidden) {
        sentence.style.display = "block";
        instruction.innerHTML =
            "现在看看你刚才听到的声音。<br>不要逐词翻译，先整体看。";
        showEnglishBtn.textContent = "🙈 隐藏英文";
    } else {
        sentence.style.display = "none";
        instruction.innerHTML = "先不要看英文。<br>再听一次。";
        showEnglishBtn.textContent = "👀 显示英文";
    }
}


/* =========================================================
   13. 显示中文
   ========================================================= */

function showChinese() {

    const isHidden = translation.style.display === "none";

    if (isHidden) {
        translation.style.display = "block";
        showChineseBtn.textContent = "🙈 隐藏中文";
    } else {
        translation.style.display = "none";
        showChineseBtn.textContent = "🇨🇳 显示中文意思";
    }
}


/* =========================================================
   14. 解密提示
   ========================================================= */

function showHint() {

    const lesson = lessons[currentIndex];
    const hint   = buildHint(lesson.e);

    hintOriginal.textContent = lesson.e;

    if (hint.decoded) {
        hintDecoded.textContent = hint.decoded;
        hintDecoded.classList.remove("empty");
    } else {
        hintDecoded.textContent = "（和原句一致，没有明显的连读或缩略）";
        hintDecoded.classList.add("empty");
    }

    /* 逐条渲染要点 */
    hintNotes.innerHTML = "";

    hint.notes.forEach(n => {
        const div = document.createElement("div");
        div.textContent = n;
        hintNotes.appendChild(div);
    });

    hintPanel.classList.add("show");
    hintBtn.textContent = "🙈 收起解密";
    hintBtn.classList.add("active");
}

function hideHint() {

    hintPanel.classList.remove("show");
    hintBtn.textContent = "🔍 解密提示";
    hintBtn.classList.remove("active");
}

function toggleHint() {

    if (hintPanel.classList.contains("show")) {
        hideHint();
    } else {
        showHint();
    }
}


/* =========================================================
   15. 上一句 / 下一句 / 跳转
   ========================================================= */

function goToIndex(index, message) {

    stopSpeaking();

    if (index < 0) index = 0;
    if (index >= lessons.length) index = lessons.length - 1;

    currentIndex = index;
    showLesson();

    statusEl.textContent = message;
}

function nextLesson() {

    if (currentIndex + 1 >= lessons.length) {
        goToIndex(0, "🎉 1000 句全部完成！重新开始。");
    } else {
        goToIndex(currentIndex + 1, "下一句，先听，不要看英文。");
    }
}

function prevLesson() {

    if (currentIndex === 0) {
        statusEl.textContent = "已经是第一句了。";
        return;
    }
    goToIndex(currentIndex - 1, "上一句，先听，不要看英文。");
}

function jumpTo() {

    const n = parseInt(jumpInput.value, 10);

    if (isNaN(n) || n < 1 || n > lessons.length) {
        statusEl.textContent = `请输入 1 到 ${lessons.length} 之间的数字。`;
        return;
    }

    jumpInput.value = "";
    goToIndex(n - 1, `已跳到第 ${n} 句，先听，不要看英文。`);
}


/* =========================================================
   16. 语速选择
   ========================================================= */

const speedButtons = document.querySelectorAll(".speed-btn");

speedButtons.forEach(button => {

    button.addEventListener("click", function () {

        speedButtons.forEach(b => b.classList.remove("active"));
        this.classList.add("active");

        currentSpeed = parseFloat(this.dataset.speed);
        statusEl.textContent = `语速已调整为 ${currentSpeed}×`;

        /* 正在播放时立即用新语速重播 */
        if (window.speechSynthesis && window.speechSynthesis.speaking) {
            speakCurrent();
        }
    });
});


/* =========================================================
   17. 按钮事件
   ========================================================= */

listenBtn.addEventListener("click", speakCurrent);
repeatBtn.addEventListener("click", speakCurrent);
stopBtn.addEventListener("click", stopSpeaking);
nextBtn.addEventListener("click", nextLesson);
prevBtn.addEventListener("click", prevLesson);
showEnglishBtn.addEventListener("click", showEnglish);
showChineseBtn.addEventListener("click", showChinese);
hintBtn.addEventListener("click", toggleHint);
jumpBtn.addEventListener("click", jumpTo);

jumpInput.addEventListener("keydown", e => {
    if (e.key === "Enter") jumpTo();
});


/* =========================================================
   18. 键盘快捷键
   ========================================================= */

document.addEventListener("keydown", function (e) {

    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;

    if (e.code === "Space") {
        e.preventDefault();
        speakCurrent();
    } else if (e.code === "ArrowRight") {
        nextLesson();
    } else if (e.code === "ArrowLeft") {
        prevLesson();
    } else if (e.key === "h" || e.key === "H") {
        toggleHint();
    } else if (e.code === "Escape") {
        stopSpeaking();
    }
});


/* =========================================================
   19. 切到后台时停止
   ========================================================= */

document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopSpeaking();
});


/* =========================================================
   20. 语音加载
   ========================================================= */

if ("speechSynthesis" in window) {
    window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
}


/* =========================================================
   21. 启动
   ========================================================= */

init();

</script>

</body>
</html>
