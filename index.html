<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>每句练耳</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:18px 12px 40px;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif;
}

.card{
    width:100%;
    max-width:540px;
    margin:auto;
    background:white;
    border-radius:22px;
    padding:22px 17px 25px;
    box-shadow:0 5px 22px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin:0;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin:6px 0 20px;
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

#searchInput{
    flex:1;
    min-width:0;
    border:1px solid #ddd;
    border-radius:11px;
    padding:13px;
    font-size:16px;
    outline:none;
}

.searchBtn{
    width:auto;
    margin:0;
    padding:13px 16px;
    background:#222;
    color:white;
}

#results{
    margin-bottom:15px;
}

.result{
    padding:12px;
    margin:7px 0;
    border-radius:10px;
    background:#f1f1f1;
}

.resultEnglish{
    font-weight:bold;
    font-size:17px;
}

.resultChinese{
    margin-top:5px;
    color:#666;
}

.scene{
    text-align:center;
    color:#777;
    margin-top:8px;
}

.progress{
    text-align:center;
    color:#999;
    margin:8px 0;
}

.sentence{
    min-height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    line-height:1.4;
    padding:10px;
}

.meaning{
    min-height:45px;
    text-align:center;
    color:#666;
    font-size:20px;
    line-height:1.5;
    margin-bottom:10px;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin-top:9px;
    font-size:17px;
}

.play{
    background:#222;
    color:white;
}

.repeat{
    background:#e5e5e5;
}

.nav{
    display:flex;
    gap:8px;
}

.nav button{
    flex:1;
    background:#eee;
}

.random{
    background:#eee;
}

.status{
    text-align:center;
    min-height:24px;
    margin-top:13px;
    color:#777;
    font-size:15px;
}

.sceneSelect{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    margin-bottom:8px;
    background:white;
}

</style>
</head>


<body>

<div class="card">

<h1>🎧 每句练耳</h1>

<div class="subtitle">
每一句都是干货
</div>


<!-- 搜索 -->

<div class="search">

<input
id="searchInput"
type="text"
placeholder="输入中文或英文搜索"
oninput="searchLessons()"
>

<button
class="searchBtn"
onclick="searchLessons()">
搜索
</button>

</div>


<div id="results"></div>


<!-- 场景 -->

<select
id="sceneSelect"
class="sceneSelect"
onchange="changeScene()">

<option value="全部">全部场景</option>

<option value="日常">👋 日常</option>

<option value="餐厅">🍽️ 餐厅</option>

<option value="购物">🛒 购物</option>

<option value="酒店">🏨 酒店</option>

<option value="交通">🚕 交通</option>

<option value="机场">✈️ 机场</option>

<option value="厨房">👨‍🍳 厨房</option>

<option value="工作">💼 工作</option>

<option value="实用">🆘 实用</option>

</select>


<!-- 当前句子 -->

<div
id="scene"
class="scene">
👋 日常
</div>

<div
id="progress"
class="progress">
第 1 / 1000 句
</div>


<div
id="sentence"
class="sentence">
Good morning.
</div>


<div
id="meaning"
class="meaning">
早上好。
</div>


<!-- 播放 -->

<button
class="play"
onclick="playSentence()">
▶ 播放英语
</button>


<button
class="repeat"
onclick="playSentence()">
🔁 再听一遍
</button>


<div class="nav">

<button onclick="previousSentence()">
⬅ 上一句
</button>

<button onclick="nextSentence()">
下一句 ➡
</button>

</div>


<button
class="random"
onclick="randomSentence()">
🎲 随机一句
</button>


<div
id="status"
class="status">
准备好了
</div>

</div>

["工作","Are you ready?","你准备好了吗？"],

/* ===== 实用 ===== */

["实用","Please write it down.","请把它写下来。"],
["实用","I need some help.","我需要一些帮助。"],
["实用","One more time, please.","请再来一次。"],
["实用","Can you show me?","你可以给我看看吗？"],
["实用","Please speak more slowly.","请说慢一点。"],
["实用","Please say it again.","请再说一遍。"],
["实用","I need water.","我需要水。"],
["实用","I need a minute.","我需要一点时间。"],
["实用","I want to learn English.","我想学英语。"],

/* =====================================================
   当前状态
===================================================== */

let current = 0;

let currentList = lessons;


/* =====================================================
   显示句子
===================================================== */

function showSentence(){

    const item =
        currentList[current];

    if(!item){
        return;
    }

    document.getElementById("scene").innerText =
        item[0];

    document.getElementById("sentence").innerText =
        item[1];

    document.getElementById("meaning").innerText =
        item[2];

    document.getElementById("progress").innerText =
        "第 " +
        (current + 1) +
        " / " +
        currentList.length +
        " 句";
}


/* =====================================================
   播放
===================================================== */

function playSentence(){

    window.speechSynthesis.cancel();

    document.getElementById("status").innerText =
        "🎧 正在准备……";

    setTimeout(function(){

        const item =
            currentList[current];

        if(!item){
            return;
        }

        const english =
            item[1];

        const voice =
            new SpeechSynthesisUtterance(
                english
            );

        voice.lang =
            "en-US";

        voice.rate =
            0.72;

        voice.pitch =
            1.0;

        voice.volume =
            1.0;

        voice.onstart =
            function(){

                document.getElementById("status").innerText =
                    "🎧 正在播放英语……";

            };

        voice.onend =
            function(){

                document.getElementById("status").innerText =
                    "✅ 听完了";

            };

        voice.onerror =
            function(){

                document.getElementById("status").innerText =
                    "⚠️ 播放失败，请再试一次";

            };

        window.speechSynthesis.speak(
            voice
        );

    },350);
}


/* =====================================================
   下一句
===================================================== */

function nextSentence(){

    window.speechSynthesis.cancel();

    current++;

    if(
        current >=
        currentList.length
    ){

        current = 0;

    }

    showSentence();
}


/* =====================================================
   上一句
===================================================== */

function previousSentence(){

    window.speechSynthesis.cancel();

    current--;

    if(current < 0){

        current =
            currentList.length - 1;

    }

    showSentence();
}


/* =====================================================
   随机一句
===================================================== */

function randomSentence(){

    window.speechSynthesis.cancel();

    current =
        Math.floor(
            Math.random() *
            currentList.length
        );

    showSentence();

    document.getElementById("status").innerText =
        "🎲 已随机选择";
}


/* =====================================================
   场景筛选
===================================================== */

function changeScene(){

    const scene =
        document.getElementById("sceneSelect").value;

    window.speechSynthesis.cancel();

    if(scene === "全部"){

        currentList =
            lessons;

    }else{

        currentList =
            lessons.filter(
                function(item){

                    return item[0] === scene;

                }
            );

    }

    current = 0;

    showSentence();
}


/* =====================================================
   中文 / 英文搜索
===================================================== */

function searchLessons(){

    const keyword =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if(keyword === ""){
        return;
    }


    const found =
        lessons.filter(
            function(item){

                return (
                    item[0]
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    item[1]
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    item[2]
                    .toLowerCase()
                    .includes(keyword)
                );

            }
        );


    const title =
        document.createElement("div");

    title.innerText =
        "🔎 找到 " +
        found.length +
        " 句";

    title.style.marginBottom =
        "8px";

    results.appendChild(title);


    if(found.length === 0){

        const none =
            document.createElement("div");

        none.className =
            "noResult";

        none.innerText =
            "没有找到相关句子";

        results.appendChild(none);

        return;
    }


    found.forEach(
        function(item){

            const box =
                document.createElement("div");

            box.className =
                "result";


            const english =
                document.createElement("div");

            english.className =
                "resultEnglish";

            english.innerText =
                item[1];


            const chinese =
                document.createElement("div");

            chinese.className =
                "resultChinese";

            chinese.innerText =
                item[2];


            box.appendChild(
                english
            );

            box.appendChild(
                chinese
            );


            box.onclick =
                function(){

                    window.speechSynthesis.cancel();

                    currentList =
                        lessons;

                    current =
                        lessons.indexOf(item);

                    document.getElementById("sceneSelect")
                        .value =
                        "全部";

                    showSentence();

                    results.innerHTML = "";

                    document.getElementById("searchInput")
                        .value = "";

                    document.getElementById("status")
                        .innerText =
                        "✅ 已找到这句话";

                    window.scrollTo({
                        top:0,
                        behavior:"smooth"
                    });

                };


            results.appendChild(
                box
            );

        }
    );
}


/* =====================================================
   页面启动
===================================================== */

showSentence();

</script>

</body>
</html>
