<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<title>🎧 每句练耳 · Chaowen AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:9px;
}

/* 顶部 */
.header{
  text-align:center;
  padding:5px 0 10px;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.sub{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

/* 搜索 */
.search{
  margin-bottom:8px;
}

.search input{
  width:100%;
  height:42px;
  border:1px solid #ddd;
  border-radius:11px;
  padding:0 12px;
  outline:none;
  background:#fff;
  font-size:14px;
}

.search-results{
  margin-top:5px;
  background:#fff;
  border-radius:11px;
  overflow:hidden;
}

.result{
  padding:8px 11px;
  border-bottom:1px solid #eee;
}

.result:last-child{
  border-bottom:0;
}

.result-word{
  font-weight:700;
}

.result-info{
  margin-top:2px;
  color:#888;
  font-size:11px;
}

/* 通用卡片 */
.card{
  background:#fff;
  border-radius:14px;
  padding:12px;
  margin-bottom:8px;
  box-shadow:0 1px 6px rgba(0,0,0,.035);
}

/* 声音状态 */
.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.status{
  color:#999;
  font-size:11px;
}

.status.ok{
  color:#16833a;
}

.test{
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:5px 8px;
  font-size:11px;
}

/* 词族 */
.family-top{
  display:flex;
  align-items:center;
  gap:7px;
}

.arrow{
  width:33px;
  height:33px;
  border:0;
  border-radius:9px;
  background:#f0f1f3;
  font-size:20px;
}

.family-center{
  flex:1;
  text-align:center;
}

.family-name{
  font-size:17px;
  font-weight:800;
}

.family-info{
  color:#999;
  font-size:10px;
  margin-top:2px;
}

.word-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.word-chip{
  border:1px solid #e1e1e1;
  background:#fafafa;
  border-radius:8px;
  padding:5px 8px;
  font-size:13px;
}

.word-chip.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.current{
  text-align:center;
  padding:13px 0 9px;
}

.current-word{
  font-size:40px;
  line-height:1;
  font-weight:800;
  cursor:pointer;
}

.current-pos{
  display:inline-block;
  margin-top:6px;
  color:#999;
  font-size:11px;
}

.current-zh{
  margin-top:3px;
  font-size:17px;
  font-weight:600;
}

/* 极简播放区 */
.player{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:9px;
}

.play-main{
  min-width:120px;
  height:39px;
  border:0;
  border-radius:20px;
  background:#222;
  color:#fff;
  padding:0 18px;
  font-size:13px;
  font-weight:700;
}

.replay{
  width:39px;
  height:39px;
  border:1px solid #ddd;
  border-radius:50%;
  background:#fff;
  font-size:15px;
}

/* 当前学习链 */
.chain{
  padding:12px;
}

.chain-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:9px;
  border-bottom:1px solid #eee;
}

.chain-title strong{
  font-size:15px;
}

.chain-title span{
  color:#aaa;
  font-size:10px;
}

/* 每一步 */
.step{
  padding:11px 0;
  border-bottom:1px solid #eee;
}

.step:last-child{
  border-bottom:0;
  padding-bottom:1px;
}

.step-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}

.step-name{
  font-size:13px;
  font-weight:800;
}

.step-tip{
  color:#aaa;
  font-size:10px;
}

/* 二块音 */
.blend-box{
  background:#f7f7f8;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.blend-parts{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.sound-part{
  border:0;
  background:#fff;
  border-radius:8px;
  padding:6px 11px;
  font-size:17px;
  font-weight:800;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}

.plus{
  color:#aaa;
  font-size:15px;
}

.blend-result{
  margin-top:7px;
  font-size:17px;
  font-weight:800;
}

.blend-arrow{
  color:#aaa;
  margin:0 4px;
}

.blend-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.blend-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.blend-mini{
  border:1px solid #e2e2e2;
  background:#fff;
  border-radius:7px;
  padding:5px 8px;
  font-weight:700;
  font-size:13px;
}

.blend-word{
  border:0;
  background:#222;
  color:#fff;
  border-radius:7px;
  padding:5px 9px;
  font-weight:700;
  font-size:13px;
}

/* 词块 */
.chunk-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chunk{
  border:1px solid #e1e1e1;
  background:#fafafa;
  border-radius:8px;
  padding:6px 9px;
  text-align:left;
}

.chunk-en{
  font-size:13px;
  font-weight:700;
}

.chunk-zh{
  color:#888;
  font-size:10px;
  margin-top:2px;
}

/* 母句 */
.sentence{
  padding:7px 0;
  border-bottom:1px solid #f0f0f0;
  cursor:pointer;
}

.sentence:last-child{
  border-bottom:0;
}

.sentence-en{
  font-size:15px;
  font-weight:700;
  line-height:1.4;
}

.sentence-zh{
  color:#777;
  font-size:12px;
  margin-top:2px;
}

.sentence-hint{
  color:#aaa;
  font-size:10px;
  margin-top:3px;
}

/* 听力 */
.listen-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.listen-title strong{
  font-size:15px;
}

.listen-title span{
  color:#aaa;
  font-size:10px;
}

.listen-display{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:8px;
  border-radius:10px;
  background:#f6f7f8;
  font-size:16px;
  font-weight:700;
}

.listen-meaning{
  text-align:center;
  color:#777;
  font-size:12px;
  min-height:18px;
  margin-top:5px;
}

.listen-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.listen-actions button{
  flex:1;
  height:36px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fff;
  font-size:12px;
}

.listen-actions .primary{
  background:#222;
  color:#fff;
  border-color:#222;
}

/* 语速 */
.speed{
  display:flex;
  gap:6px;
}

.speed button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  height:34px;
  font-size:11px;
}

.speed button.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

/* 上下一个 */
.nav{
  display:flex;
  gap:6px;
}

.nav button{
  flex:1;
  height:36px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  font-size:12px;
}

.data{
  text-align:center;
  color:#aaa;
  font-size:10px;
  padding:2px 0 12px;
}

.empty{
  text-align:center;
  color:#999;
  padding:12px;
  font-size:12px;
}

@media(max-width:400px){

  .app{
    padding:7px;
  }

  .current-word{
    font-size:36px;
  }

  .sound-part{
    padding:5px 9px;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     顶部
========================= -->

<header class="header">

  <div class="logo">
    🎧 每句练耳
  </div>

  <div class="sub">
    Chaowen AI · 声音 → 单词 → 词块 → 母句 → 听力
  </div>

</header>


<!-- =========================
     搜索
========================= -->

<div class="search">

  <input
    id="searchInput"
    type="search"
    placeholder="搜索单词或中文，例如 cat / 猫"
    autocomplete="off"
  >

  <div
    id="searchResults"
    class="search-results">
  </div>

</div>


<!-- =========================
     声音状态
========================= -->

<div class="card">

  <div class="status-row">

    <div
      id="soundStatus"
      class="status">
      🟡 正在准备英语声音……
    </div>

    <button
      class="test"
      onclick="testSound()">
      测试
    </button>

  </div>

</div>


<!-- =========================
     词族 + 当前单词
========================= -->

<div class="card">

  <div class="family-top">

    <button
      class="arrow"
      onclick="previousFamily()">
      ‹
    </button>

    <div class="family-center">

      <div
        id="familyName"
        class="family-name">
      </div>

      <div
        id="familyInfo"
        class="family-info">
      </div>

    </div>

    <button
      class="arrow"
      onclick="nextFamily()">
      ›
    </button>

  </div>


  <div
    id="wordList"
    class="word-list">
  </div>


  <div class="current">

    <div
      id="currentWord"
      class="current-word"
      onclick="speakCurrentWord()">
    </div>

    <div
      id="currentPOS"
      class="current-pos">
    </div>

    <div
      id="currentZH"
      class="current-zh">
    </div>


    <!-- 极简播放 -->
    <div class="player">

      <button
        class="play-main"
        onclick="playLearningChain()">
        ▶ 播放学习链
      </button>

      <button
        class="replay"
        onclick="speakCurrentWord()"
        title="重听单词">
        🔊
      </button>

    </div>

  </div>


  <div class="nav">

    <button onclick="previousWord()">
      ← 上一个
    </button>

    <button onclick="nextWord()">
      下一个 →
    </button>

  </div>

</div>


<!-- =====================================================
     核心学习链
====================================================== -->

<div class="card chain">

  <div class="chain-title">

    <strong>
      🧩 单词学习链
    </strong>

    <span>
      声音 → 词块 → 母句
    </span>

  </div>


  <!-- =====================
       ① 二块音 / 多块音
  ====================== -->

  <div class="step">

    <div class="step-head">

      <div class="step-name">
        ① 🧩 声音块
      </div>

      <div class="step-tip">
        二块音 / 多块音
      </div>

    </div>

    <div
      id="blendArea">
    </div>

  </div>


  <!-- =====================
       ② 高频词块
  ====================== -->

  <div class="step">

    <div class="step-head">

      <div class="step-name">
        ② 🧱 高频词块
      </div>

      <div class="step-tip">
        英语真实组合
      </div>

    </div>

    <div
      id="chunkList"
      class="chunk-list">
    </div>

  </div>


  <!-- =====================
       ③ 母句型
  ====================== -->

  <div class="step">

    <div class="step-head">

      <div class="step-name">
        ③ 🏠 母句型
      </div>

      <div class="step-tip">
        一句带出很多句
      </div>

    </div>

    <div
      id="sentenceList">
    </div>

  </div>

</div>


<!-- =========================
     听力
========================= -->

<div class="card">

  <div class="listen-title">

    <strong>
      🎧 听力训练
    </strong>

    <span>
      先听 → 想 → 看
    </span>

  </div>


  <div
    id="listenDisplay"
    class="listen-display">
    先听英语，不看答案
  </div>


  <div
    id="listenMeaning"
    class="listen-meaning">
    听懂后再看中文
  </div>


  <div class="listen-actions">

    <button
      class="primary"
      onclick="playListening()">
      ▶ 先听
    </button>

    <button
      onclick="showListeningAnswer()">
      👁 看答案
    </button>

  </div>

</div>


<!-- =========================
     语速
========================= -->

<div class="card">

  <div class="listen-title">

    <strong>
      ⚙️ 语速
    </strong>

    <span id="speedLabel">
      正常
    </span>

  </div>


  <div class="speed">

    <button
      id="slowBtn"
      onclick="setSpeed('slow')">
      慢速
    </button>

    <button
      id="normalBtn"
      class="active"
      onclick="setSpeed('normal')">
      正常
    </button>

    <button
      id="naturalBtn"
      onclick="setSpeed('natural')">
      自然
    </button>

  </div>

</div>


<div
  id="dataInfo"
  class="data">
</div>

</div>

/* =========================================================
   语音引擎
========================================================= */

const synth =
  window.speechSynthesis;

let voices = [];

let currentRate = 0.85;


function loadVoices(){

  if(!synth){

    updateSoundStatus();

    return;

  }

  voices =
    synth.getVoices() || [];

  updateSoundStatus();

}


if(synth){

  loadVoices();

  synth.onvoiceschanged =
    function(){

      loadVoices();

    };

}


function getEnglishVoice(){

  if(!voices.length){
    return null;
  }

  return (

    voices.find(
      v=>/^en-US/i.test(v.lang)
    )

    ||

    voices.find(
      v=>/^en-GB/i.test(v.lang)
    )

    ||

    voices.find(
      v=>/^en/i.test(v.lang)
    )

    ||

    null

  );

}


function speakText(text){

  if(!text){
    return;
  }

  if(!synth){

    alert(
      "当前浏览器不支持英语语音播放。"
    );

    return;

  }

  try{

    synth.cancel();

    const utter =
      new SpeechSynthesisUtterance(
        text
      );

    const voice =
      getEnglishVoice();

    if(voice){

      utter.voice =
        voice;

      utter.lang =
        voice.lang;

    }else{

      utter.lang =
        "en-US";

    }

    utter.rate =
      currentRate;

    utter.pitch =
      1;

    utter.volume =
      1;

    synth.speak(
      utter
    );

  }catch(error){

    console.log(error);

  }

}


function updateSoundStatus(){

  const el =
    document.getElementById(
      "soundStatus"
    );

  if(!el){
    return;
  }

  if(!synth){

    el.textContent =
      "🔴 浏览器不支持语音";

    return;

  }

  if(voices.length){

    el.textContent =
      "🟢 英语声音已准备好";

    el.className =
      "status ok";

  }else{

    el.textContent =
      "🟡 正在准备英语声音……";

    el.className =
      "status";

  }

}

  );

}


/* =========================================================
   当前状态
========================================================= */

let familyIndex = 0;
let wordIndex = 2;


/* =========================================================
   数据取得
========================================================= */

function getFamily(){

  return FAMILY_DATA[
    familyIndex
  ];

}


function getWordData(){

  return getFamily()
    .words[wordIndex];

}


function getWord(){

  return getWordData()[0]
    .toLowerCase();

}


/* =========================================================
   渲染
========================================================= */

function render(){

  const family =
    getFamily();

  if(!family){
    return;
  }

  if(
    wordIndex >=
    family.words.length
  ){

    wordIndex = 0;

  }

  renderFamily();

  renderWordList();

  renderCurrent();

  renderBlend();

  renderChunks();

  renderSentences();

  resetListening();

  updateData();

}


/* =========================================================
   词族
========================================================= */

function renderFamily(){

  const family =
    getFamily();

  document.getElementById(
    "familyName"
  ).textContent =
    family.family +
    " 词族";

  document.getElementById(
    "familyInfo"
  ).textContent =
    family.type +
    " · " +
    (familyIndex + 1) +
    " / " +
    FAMILY_DATA.length;

}


function renderWordList(){

  const box =
    document.getElementById(
      "wordList"
    );

  box.innerHTML = "";

  getFamily()
    .words
    .forEach(
      (item,index)=>{

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "word-chip" +
          (
            index === wordIndex
            ? " active"
            : ""
          );

        button.textContent =
          item[0];

        button.onclick =

/* =========================================================
   当前单词
========================================================= */

function renderCurrent(){

    "currentWord"

/* =========================================================
   二块音 / 多块音
========================================================= */

function getBlendData(word){

  if(
    BLEND_LIBRARY[word]
  ){

    return BLEND_LIBRARY[word];

  }

  /* 没有专门数据时，
     至少保持真实单词整体播放 */

  return [
    [word[0],word.slice(1),word]
  ];

}


function renderBlend(){

  const area =
    document.getElementById(
      "blendArea"
    );

  area.innerHTML = "";

  const word =
    getWord();

  const data =
    getBlendData(word);


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "blend-list";


  data.forEach(
    item=>{

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "blend-row";


      const first =
        document.createElement(
          "button"
        );

      first.className =
        "blend-mini";

      first.textContent =
        item[0];

      first.onclick =
        function(){

          speakText(
            item[0]
          );

        };


      const plus =
        document.createElement(
          "span"
        );

      plus.textContent =
        "+";

      plus.className =
        "plus";


      const second =
        document.createElement(
          "button"
        );

      second.className =
        "blend-mini";

      second.textContent =
        item[1];

      second.onclick =
        function(){

          speakText(
            item[1]
          );

        };


      const arrow =
        document.createElement(
          "span"
        );

      arrow.textContent =
        "→";

      arrow.className =
        "blend-arrow";


      const result =
        document.createElement(
          "button"
        );

      result.className =
        "blend-word";

      result.textContent =
        item[2];

      result.onclick =
        function(){

          speakText(
            item[2]
          );

        };


      row.appendChild(
        first
      );

      row.appendChild(
        plus
      );

      row.appendChild(
        second
      );

      row.appendChild(
        arrow
      );

      row.appendChild(
        result
      );

      box.appendChild(
        row
      );

    }
  );


  area.appendChild(
    box

/* =========================================================
   一键播放学习链
========================================================= */

function playLearningChain(){

  const word =
    getWord();

  const chunks =
    getChunks(word);

  const sentences =
    getSentences(word);

  const firstBlend =
    getBlendData(word)[0];


  const sequence = [

    firstBlend[0],

    firstBlend[1],

    word,

    chunks[0][0],

    sentences[0][0]

  ];


  playSequence(
    sequence,
    0
  );

}


function playSequence(
  list,
  index
){

  if(
    index >= list.length
  ){

    return;

  }

  if(!synth){

    return;

  }

  synth.cancel();


  const utter =
    new SpeechSynthesisUtterance(
      list[index]
    );

  const voice =
    getEnglishVoice();

  if(voice){

    utter.voice =
      voice;

    utter.lang =
      voice.lang;

  }else{

    utter.lang =
      "en-US";

  }

  utter.rate =
    currentRate;

  utter.pitch =
    1;

  utter.volume =
    1;


  utter.onend =
    function(){

      setTimeout(
        function(){

          playSequence(
            list,
            index + 1
          );

        },
        220
      );

    };


  synth.speak(
    utter
  );

}

/* =========================================================
   单词导航
========================================================= */

function nextWord(){

  wordIndex++;

  if(
    wordIndex >=
    getFamily().words.length
  ){

    wordIndex = 0;

  }

  render();

}


function previousWord(){

  wordIndex--;

  if(
    wordIndex < 0
  ){

    wordIndex =
      getFamily().words.length - 1;

  }

  render();

}


/* =========================================================
   词族导航
========================================================= */

function nextFamily(){

  familyIndex++;

  if(
    familyIndex >=
    FAMILY_DATA.length
  ){

    familyIndex = 0;

  }

  wordIndex = 0;

  render();

}


function previousFamily(){

  familyIndex--;

  if(
    familyIndex < 0
  ){

    familyIndex =
      FAMILY_DATA.length - 1;

  }

  wordIndex = 0;

  render();

}


/* =========================================================
   语速
========================================================= */

function setSpeed(type){

  const buttons = {

    slow:
      document.getElementById(
        "slowBtn"
      ),

    normal:
      document.getElementById(
        "normalBtn"
      ),

    natural:
      document.getElementById(
        "naturalBtn"
      )

  };


  Object.values(buttons)
    .forEach(
      button=>{
        button.classList.remove(
          "active"
        );
      }
    );


  if(type === "slow"){

    currentRate =
      0.68;

    buttons.slow
      .classList.add(
        "active"
      );

    document.getElementById(
      "speedLabel"
    ).textContent =
      "慢速";

  }


  if(type === "normal"){

    currentRate =
      0.85;

    buttons.normal
      .classList.add(
        "active"
      );

    document.getElementById(
      "speedLabel"
    ).textContent =
      "正常";

  }


  if(type === "natural"){

    currentRate =
      1.0;

    buttons.natural
      .classList.add(
        "active"
      );

    document.getElementById(
      "speedLabel"
    ).textContent =
      "自然";

  }

}


/* =========================================================
   搜索
========================================================= */

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchResults =
  document.getElementById(
    "searchResults"
  );


searchInput.addEventListener(
  "input",
  function(){

    const keyword =
      this.value
        .trim()
        .toLowerCase();

    searchResults.innerHTML =
      "";

    if(!keyword){
      return;
    }


    const results = [];


    FAMILY_DATA.forEach(
      (family,fIndex)=>{

        family.words.forEach(
          (data,wIndex)=>{

            const word =
              data[0]
                .toLowerCase();

            const zh =
              data[2];

            if(
              word.includes(
                keyword
              )
              ||
              zh.includes(
                keyword
              )
            ){

              results.push({

                familyIndex:
                  fIndex,

                wordIndex:
                  wIndex,

                family:
                  family.family,

                word:
                  data[0],

                pos:
                  data[1],

                zh:
                  data[2]

              });

            }

          }
        );

      }
    );


    if(!results.length){

      searchResults.innerHTML =
        "<div class='empty'>" +
        "没有找到这个单词" +
        "</div>";

      return;

    }


    results
      .slice(0,15)
      .forEach(
        result=>{

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "result";

          item.innerHTML =

            "<div class='result-word'>" +
            result.word +
            "</div>" +

            "<div class='result-info'>" +
            result.pos +
            " · " +
            result.zh +
            " · " +
            result.family +
            "</div>";


          item.onclick =
            function(){

              familyIndex =
                result.familyIndex;

              wordIndex =
                result.wordIndex;

              searchInput.value =
                "";

              searchResults.innerHTML =
                "";

              render();

              speakCurrentWord();

            };


          searchResults.appendChild(
            item
          );

        }
      );

  }
);


/* =========================================================
   数据统计
========================================================= */

function updateData(){

  let total = 0;

  FAMILY_DATA.forEach(
    family=>{

      total +=
        family.words.length;

    }
  );


  document.getElementById(
    "dataInfo"
  ).textContent =

    FAMILY_DATA.length +
    " 个词族 · " +
    total +
    " 个单词 · " +
    "结构预留 2000 词";

}


/* =========================================================
   键盘
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "ArrowRight"
    ){

      nextWord();

    }

    if(
      event.key ===
      "ArrowLeft"
    ){

      previousWord();

    }

  }
);


/* =========================================================
   启动
========================================================= */

render();

updateSoundStatus();

</script>
