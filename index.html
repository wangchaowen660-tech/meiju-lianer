<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学英语 · 逛好物</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7fa;color:#1e293b;}
.container{max-width:900px;margin:0 auto;padding:0 14px;}
header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.04);position:sticky;top:0;z-index:100;}
.header-inner{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:8px;flex-wrap:wrap;}
.logo{font-size:19px;font-weight:800;color:#0f172a;display:flex;align-items:center;gap:5px;}
.logo .brand-shop{color:#e94560;position:relative;}
.logo .brand-shop .shop-badge{position:absolute;top:-8px;right:-24px;background:#22c55e;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;}
.nav-tabs{display:flex;gap:5px;background:#f1f5f9;border-radius:30px;padding:3px;}
.nav-tab{padding:7px 14px;border:0;border-radius:30px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#64748b;transition:0.2s;display:flex;align-items:center;gap:4px;}
.nav-tab.active{background:#0f172a;color:#fff;}
.nav-tab.shop-tab.active{background:#e94560;color:#fff;}
.nav-tab .tab-badge{background:#e94560;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:20px;text-align:center;}
.nav-tab.shop-tab.active .tab-badge{background:#fff;color:#e94560;}
.shop-entry-btn{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#e94560,#f97316);color:#fff;border:0;border-radius:30px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(233,69,96,0.25);}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #e2e8f0;margin-bottom:14px;}
.scene-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.scene-bar label{font-weight:600;font-size:14px;white-space:nowrap;}
.scene-bar select{flex:1;min-width:120px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;background:#fff;outline:none;cursor:pointer;}
.badge{background:#e94560;color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.group-header{background:linear-gradient(135deg,#e0e7ff,#f1f5f9);padding:8px 14px;border-radius:12px;margin-bottom:10px;font-size:13px;font-weight:600;color:#475569;display:flex;justify-content:space-between;align-items:center;}
.group-header .group-title{color:#0f172a;font-weight:700;}
.group-header .group-tag{background:#e94560;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;}
.dialog-item{background:#f8fafc;border-radius:14px;padding:12px 14px;border-left:4px solid #e94560;margin-bottom:10px;}
.dialog-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;}
.dialog-row.answer{border-top:1px dashed #e2e8f0;margin-top:5px;padding-top:8px;}
.dialog-label{font-weight:700;font-size:13px;min-width:36px;padding-top:3px;}
.dialog-label.q{color:#e94560;}
.dialog-label.a{color:#8b5cf6;}
.dialog-text{flex:1;min-width:0;}
.line-en{font-size:16px;font-weight:600;color:#0f172a;line-height:1.4;word-break:break-word;}
.line-cn{font-size:13px;color:#64748b;margin-top:2px;word-break:break-word;}
.speak-btn{flex-shrink:0;width:34px;height:34px;border:0;border-radius:50%;background:#e2e8f0;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.15s;}
.speak-btn:active{transform:scale(0.92);}
.speak-btn.speaking{background:#e94560;color:#fff;}
.speak-btn.cn{background:#fef3c7;font-size:12px;font-weight:700;color:#92400e;}
.speak-btn.cn.speaking{background:#f59e0b;color:#fff;}
.related-box{background:#fffbeb;border-radius:12px;padding:10px 14px;margin-top:8px;border-left:3px solid #f59e0b;}
.related-box h5{font-size:12px;color:#92400e;margin-bottom:6px;font-weight:700;}
.related-box .rel-item{font-size:13px;color:#475569;padding:2px 0;}
.related-box .rel-item strong{color:#0f172a;}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.btn{padding:9px 18px;border:0;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;background:#e2e8f0;color:#1e293b;transition:0.15s;}
.btn:active{transform:scale(0.96);}
.btn.primary{background:#e94560;color:#fff;}
.btn.dark{background:#0f172a;color:#fff;}
.btn.small{padding:6px 12px;font-size:12px;}
.btn.danger{background:#ef4444;color:#fff;}
.status{text-align:center;font-size:12px;color:#94a3b8;margin-top:8px;min-height:18px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cat-btn{padding:7px 18px;border:1px solid #e2e8f0;border-radius:30px;background:#fff;font-size:13px;font-weight:500;color:#475569;cursor:pointer;}
.cat-btn.active{background:#0f172a;color:#fff;border-color:#0f172a;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.product-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;cursor:pointer;transition:0.15s;}
.product-card:active{transform:scale(0.98);}
.product-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);overflow:hidden;}
.product-img img{width:100%;height:100%;object-fit:cover;}
.product-body{padding:10px 12px 12px;}
.product-name{font-size:14px;font-weight:700;color:#0f172a;line-height:1.3;}
.product-name-en{font-size:11px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-price{margin-top:6px;color:#e94560;font-weight:800;font-size:16px;}
.product-price small{font-size:11px;font-weight:500;color:#94a3b8;text-decoration:line-through;margin-left:4px;}
.empty-tip{text-align:center;padding:30px 10px;color:#94a3b8;font-size:14px;}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:200;justify-content:center;align-items:center;padding:16px;}
.modal.open{display:flex;}
.modal-box{background:#fff;border-radius:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative;}
.modal-close{position:absolute;top:14px;right:18px;font-size:26px;border:0;background:transparent;cursor:pointer;color:#94a3b8;line-height:1;}
.modal-img{height:170px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);border-radius:16px;overflow:hidden;}
.modal-img img{width:100%;height:100%;object-fit:cover;}
.modal-name{font-size:20px;font-weight:800;margin-top:14px;}
.modal-name-en{font-size:14px;color:#94a3b8;margin-top:2px;}
.modal-price{color:#e94560;font-weight:800;font-size:24px;margin-top:8px;}
.modal-price small{font-size:14px;color:#94a3b8;text-decoration:line-through;font-weight:500;margin-left:6px;}
.modal-section{margin-top:14px;}
.modal-section h4{font-size:13px;font-weight:700;color:#64748b;margin-bottom:6px;}
.modal-section .en{font-size:15px;color:#0f172a;line-height:1.5;}
.modal-section .cn{font-size:14px;color:#64748b;margin-top:4px;line-height:1.5;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.form-row .full{grid-column:1/-1;}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;font-family:inherit;background:#fff;}
input:focus,textarea:focus,select:focus{border-color:#e94560;box-shadow:0 0 0 3px rgba(233,69,96,0.08);}
textarea{resize:vertical;min-height:70px;}
label.field-label{font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:3px;margin-top:6px;}
.form-success{display:none;background:#dcfce7;color:#166534;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:10px;}
.form-success.show{display:block;}
.admin-item{background:#f8fafc;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;border:1px solid #e2e8f0;}
.admin-item .ai-img{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;}
.admin-item .ai-img img{width:100%;height:100%;object-fit:cover;}
.admin-item .ai-info{flex:1;min-width:0;}
.admin-item .ai-name{font-size:14px;font-weight:700;}
.admin-item .ai-sub{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-item .ai-actions{display:flex;gap:4px;flex-shrink:0;}
.admin-item .ai-actions button{padding:4px 10px;font-size:11px;border:0;border-radius:8px;cursor:pointer;}
.admin-empty{text-align:center;color:#94a3b8;padding:20px;font-size:13px;}
footer{text-align:center;padding:24px 0;color:#94a3b8;font-size:12px;}
@media(max-width:600px){
  .form-row{grid-template-columns:1fr;}
  .product-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .product-img{height:110px;font-size:44px;}
  .line-en{font-size:15px;}
  .line-cn{font-size:12px;}
  .logo{font-size:16px;}
  .nav-tab{padding:6px 10px;font-size:12px;}
  .shop-entry-btn{padding:6px 10px;font-size:12px;}
  .speak-btn{width:30px;height:30px;font-size:14px;}
  .speak-btn.cn{font-size:11px;}
}
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="logo">
      <span>学英语</span><span style="color:#e94560;font-weight:900;">·</span>
      <span class="brand-shop">逛好物<span class="shop-badge">商城</span></span>
    </div>
    <button class="shop-entry-btn" onclick="switchTab('shop')">🛍️ 商城 <span style="background:#fff;color:#e94560;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;">新品</span></button>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="learn" onclick="switchTab('learn')">📚 学习</button>
      <button class="nav-tab shop-tab" data-tab="shop" onclick="switchTab('shop')">🛍️ 商品城 <span class="tab-badge" id="tabShopBadge">0</span></button>
    </div>
  </div>
</header>

<div class="container" style="padding-top:14px;padding-bottom:20px;">

  <!-- 学习模块 -->
  <div id="learnModule">
    <div class="card">
      <div class="scene-bar">
        <label>📌 场景</label>
        <select id="sceneSelect"></select>
        <span class="badge" id="dialogCount">0 组</span>
      </div>
      <div id="dialogArea"></div>
      <div class="controls">
        <button class="btn" onclick="prevGroup()">⏮ 上一组</button>
        <button class="btn primary" onclick="playGroup()">▶ 整组朗读</button>
        <button class="btn" onclick="nextGroup()">下一组 ⏭</button>
      </div>
      <div class="status" id="status">就绪</div>
    </div>
  </div>

  <!-- 商品城 -->
  <div id="shopModule" style="display:none;">
    <div class="categories" id="categories"></div>
    <div class="product-grid" id="productGrid"></div>

    <div class="controls" style="margin-top:16px;">
      <button class="btn dark" onclick="openAdmin()">⚙️ 管理商品</button>
    </div>

    <div class="card" style="margin-top:20px;">
      <h3 style="font-size:18px;font-weight:700;">📩 发送询盘</h3>
      <p style="color:#64748b;font-size:13px;margin-top:4px;">留下您的需求，我们会尽快联系您。</p>
      <form onsubmit="submitInquiry(event)">
        <div class="form-row">
          <input type="text" placeholder="您的姓名 *" required>
          <input type="tel" placeholder="手机号 *" required>
          <input type="text" placeholder="微信号 / 邮箱" class="full">
          <textarea placeholder="您感兴趣的商品或需求..." class="full"></textarea>
          <div class="full">
            <button type="submit" class="btn primary" style="width:100%;padding:12px;">提交询盘</button>
          </div>
        </div>
      </form>
      <div class="form-success" id="formSuccess">✅ 已收到您的询盘，我们会尽快联系您！</div>
    </div>
  </div>

</div>

<footer>© 2026 学英语·逛好物 · 边学边买</footer>

<!-- 商品详情弹窗 -->
<div class="modal" id="productModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('productModal')">&times;</button>
    <div class="modal-img" id="mImg"></div>
    <div class="modal-name" id="mName"></div>
    <div class="modal-name-en" id="mNameEn"></div>
    <div class="modal-price" id="mPrice"></div>
    <div class="modal-section">
      <h4>📖 商品英文描述（可朗读学习）</h4>
      <div class="en" id="mDescEn"></div>
      <div class="cn" id="mDescCn"></div>
      <button class="btn dark" id="mSpeakBtn" style="margin-top:8px;" onclick="speakProductDesc()">🔊 朗读英文描述</button>
    </div>
    <div class="controls" style="margin-top:18px;">
      <button class="btn primary" onclick="scrollToInquiry()">📩 立即询盘</button>
      <button class="btn" onclick="closeModal('productModal')">继续逛逛</button>
    </div>
  </div>
</div>

<!-- 商品编辑弹窗 -->
<div class="modal" id="productFormModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('productFormModal')">&times;</button>
    <h3 style="font-size:19px;font-weight:800;margin-bottom:6px;" id="formTitle">添加商品</h3>
    <p style="font-size:12px;color:#94a3b8;">填写商品信息，保存后立即上架</p>
    <input type="hidden" id="fId">
    <label class="field-label">商品名称（中文）*</label>
    <input type="text" id="fName" placeholder="如：陶瓷咖啡杯套装">
    <label class="field-label">商品名称（英文）</label>
    <input type="text" id="fNameEn" placeholder="如：Ceramic Coffee Mug Set">
    <div class="form-row">
      <div>
        <label class="field-label">现价（元）*</label>
        <input type="number" id="fPrice" placeholder="39.9" step="0.01">
      </div>
      <div>
        <label class="field-label">原价（元，可空）</label>
        <input type="number" id="fOriginalPrice" placeholder="59.9" step="0.01">
      </div>
    </div>
    <label class="field-label">分类 *</label>
    <select id="fCategory"></select>
    <label class="field-label">商品图标（emoji 或 图片URL）</label>
    <input type="text" id="fEmoji" placeholder="☕ 或 https://...jpg">
    <label class="field-label">英文描述（可朗读）</label>
    <textarea id="fDescEn" placeholder="English description..."></textarea>
    <label class="field-label">中文描述</label>
    <textarea id="fDescCn" placeholder="中文描述..."></textarea>
    <div class="form-row">
      <div>
        <label class="field-label">库存</label>
        <input type="number" id="fStock" placeholder="100">
      </div>
      <div>
        <label class="field-label">销量</label>
        <input type="number" id="fSales" placeholder="0">
      </div>
    </div>
    <div class="controls" style="margin-top:18px;">
      <button class="btn primary" onclick="saveProduct()">💾 保存商品</button>
      <button class="btn" onclick="closeModal('productFormModal')">取消</button>
    </div>
  </div>
</div>

<!-- 管理商品列表弹窗 -->
<div class="modal" id="adminModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('adminModal')">&times;</button>
    <h3 style="font-size:19px;font-weight:800;margin-bottom:10px;">⚙️ 商品管理</h3>
    <p style="font-size:12px;color:#94a3b8;margin-bottom:12px;">共 <span id="adminCount">0</span> 件商品 · 数据保存在本地</p>
    <div id="adminList"></div>
    <div class="controls" style="margin-top:14px;flex-wrap:wrap;">
      <button class="btn primary" onclick="closeModal('adminModal');openProductForm()">➕ 添加商品</button>
      <button class="btn" onclick="exportData()">📤 导出</button>
      <button class="btn" onclick="closeModal('adminModal');document.getElementById('changePasswordModal').classList.add('open')">🔑 改密码</button>
      <button class="btn danger" onclick="adminLogout()">🔒 退出管理</button>
      <button class="btn" onclick="closeModal('adminModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 管理员登录弹窗 -->
<div class="modal" id="adminLoginModal">
  <div class="modal-box" style="max-width:360px;">
    <button class="modal-close" onclick="closeModal('adminLoginModal')">&times;</button>
    <div style="text-align:center;padding:6px 0 10px;">
      <div style="font-size:52px;">🔐</div>
      <h3 style="font-size:19px;font-weight:800;margin-top:6px;">管理员身份验证</h3>
      <p style="font-size:12px;color:#94a3b8;margin-top:4px;">此入口仅限开发者本人操作</p>
    </div>
    <label class="field-label">管理员密码</label>
    <input type="password" id="adminPasswordInput" placeholder="请输入密码" onkeydown="if(event.key==='Enter')verifyAdmin()" autocomplete="off">
    <div id="loginError" style="color:#ef4444;font-size:12px;margin-top:8px;min-height:18px;text-align:center;"></div>
    <div class="controls" style="margin-top:12px;">
      <button class="btn primary" onclick="verifyAdmin()">🔓 进入管理</button>
      <button class="btn" onclick="closeModal('adminLoginModal')">取消</button>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal" id="changePasswordModal">
  <div class="modal-box" style="max-width:380px;">
    <button class="modal-close" onclick="closeModal('changePasswordModal')">&times;</button>
    <h3 style="font-size:18px;font-weight:800;margin-bottom:10px;">🔑 修改管理员密码</h3>
    <label class="field-label">当前密码</label>
    <input type="password" id="oldPassword" autocomplete="off">
    <label class="field-label">新密码（至少6位）</label>
    <input type="password" id="newPassword" autocomplete="off">
    <label class="field-label">确认新密码</label>
    <input type="password" id="confirmPassword" autocomplete="off">
    <div id="changePasswordError" style="color:#ef4444;font-size:12px;margin-top:8px;min-height:18px;text-align:center;"></div>
    <div class="controls" style="margin-top:12px;">
      <button class="btn primary" onclick="changePassword()">确认修改</button>
      <button class="btn" onclick="closeModal('changePasswordModal')">取消</button>
    </div>
  </div>
</div>

<script>
// ========================================================================
// 一、管理员认证系统
// ========================================================================
const ADMIN_DEFAULT_PASSWORD = "admin888";

function simpleHash(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return (hash >>> 0).toString(16);
}

function getAdminPasswordHash() {
  let stored = localStorage.getItem("admin_pwd_hash");
  if (!stored) {
    stored = simpleHash(ADMIN_DEFAULT_PASSWORD);
    localStorage.setItem("admin_pwd_hash", stored);
  }
  return stored;
}

function isAdminLoggedIn() {
  return sessionStorage.getItem("admin_logged_in") === "yes";
}
function setAdminLoggedIn(v) {
  if (v) sessionStorage.setItem("admin_logged_in", "yes");
  else sessionStorage.removeItem("admin_logged_in");
}

let _pendingAdminAction = null;
function requireAdmin(action) {
  if (isAdminLoggedIn()) {
    if (typeof action === "function") action();
    return;
  }
  _pendingAdminAction = action;
  document.getElementById("adminPasswordInput").value = "";
  document.getElementById("loginError").textContent = "";
  document.getElementById("adminLoginModal").classList.add("open");
  setTimeout(() => document.getElementById("adminPasswordInput").focus(), 300);
}

let _loginAttempts = 0;
let _lockUntil = 0;

function verifyAdmin() {
  const now = Date.now();
  if (now < _lockUntil) {
    const secs = Math.ceil((_lockUntil - now) / 1000);
    document.getElementById("loginError").textContent = "⏳ 请" + secs + "秒后再试";
    return;
  }
  const pwd = document.getElementById("adminPasswordInput").value;
  const errorEl = document.getElementById("loginError");
  if (!pwd) { errorEl.textContent = "请输入密码"; return; }

  if (simpleHash(pwd) === getAdminPasswordHash()) {
    setAdminLoggedIn(true);
    _loginAttempts = 0;
    closeModal("adminLoginModal");
    errorEl.textContent = "";
    const action = _pendingAdminAction;
    _pendingAdminAction = null;
    if (typeof action === "function") action();
    showToast("✅ 验证成功，欢迎回来");
  } else {
    _loginAttempts++;
    if (_loginAttempts >= 3) {
      _lockUntil = Date.now() + 30000;
      _loginAttempts = 0;
      errorEl.textContent = "❌ 密码错误过多，已锁定30秒";
    } else {
      errorEl.textContent = "❌ 密码错误，还可尝试 " + (3 - _loginAttempts) + " 次";
    }
    document.getElementById("adminPasswordInput").value = "";
    document.getElementById("adminPasswordInput").focus();
  }
}

function adminLogout() {
  setAdminLoggedIn(false);
  closeModal("adminModal");
  showToast("🔒 已退出管理模式");
}

function changePassword() {
  const oldPwd = document.getElementById("oldPassword").value;
  const newPwd = document.getElementById("newPassword").value;
  const confirmPwd = document.getElementById("confirmPassword").value;
  const errEl = document.getElementById("changePasswordError");

  if (simpleHash(oldPwd) !== getAdminPasswordHash()) {
    errEl.textContent = "当前密码错误"; return;
  }
  if (newPwd.length < 6) { errEl.textContent = "新密码至少6位"; return; }
  if (newPwd !== confirmPwd) { errEl.textContent = "两次输入不一致"; return; }

  localStorage.setItem("admin_pwd_hash", simpleHash(newPwd));
  errEl.textContent = "";
  document.getElementById("oldPassword").value = "";
  document.getElementById("newPassword").value = "";
  document.getElementById("confirmPassword").value = "";
  closeModal("changePasswordModal");
  showToast("✅ 密码已修改，请牢记");
}

  all: "全部", home: "家居用品", digital: "数码电子",
  fashion: "服饰箱包", food: "食品", other: "其他"
};

// ========================================================================
// 四、状态
// ========================================================================
let currentScene = "";
let dialogList = [];
let currentGroupIndex = 0;
let allGroups = [];
let currentCategory = "all";
let currentProduct = null;
const GROUP_SIZE = 3;

const sceneSelect = document.getElementById("sceneSelect");
const dialogArea = document.getElementById("dialogArea");
const dialogCount = document.getElementById("dialogCount");
const statusEl = document.getElementById("status");

// ========================================================================
// 五、iPad优化语音引擎
// ========================================================================
let speechReady = false;
let isSpeaking = false;

function warmUpSpeech() {
  if (speechReady) return;
  if (!window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    u.onend = () => { speechReady = true; };
    u.onerror = () => { speechReady = true; };
    window.speechSynthesis.speak(u);
    speechReady = true;
  } catch (e) { speechReady = true; }
}

function cleanText(text) {
  return String(text)
    .replace(/[<>]/g, "")
    .replace(/[.…]{2,}/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function splitText(text, maxLen) {
  maxLen = maxLen || 120;
  const clean = cleanText(text);
  if (clean.length <= maxLen) return [clean];
  const parts = clean.split(/(?<=[.!?。！？])\s*/);
  const result = [];
  let buf = "";
  for (const p of parts) {
    if ((buf + " " + p).trim().length > maxLen) {
      if (buf) result.push(buf.trim());
      buf = p;
    } else {
      buf = (buf + " " + p).trim();
    }
  }
  if (buf) result.push(buf.trim());
  return result.filter(x => x.length > 0);
}

function speakOne(text, lang) {
  return new Promise((resolve) => {
    const clean = cleanText(text);
    if (!clean) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = lang || (/[\u4e00-\u9fa5]/.test(clean) ? "zh-CN" : "en-US");
    u.rate = 0.95;
    u.pitch = 1.0;
    u.volume = 1.0;
    let ended = false;
    const finish = () => { if (ended) return; ended = true; resolve(); };
    u.onend = finish;
    u.onerror = finish;
    try { window.speechSynthesis.speak(u); } catch (e) { finish(); }
    setTimeout(finish, 15000);
  });
}

async function speak(text, lang, callback) {
  if (!window.speechSynthesis) {
    statusEl.textContent = "❌ 不支持语音";
    statusEl.className = "status error";
    if (callback) callback();
    return;
  }
  warmUpSpeech();
  try { window.speechSynthesis.cancel(); } catch (e) {}
  isSpeaking = true;

  const parts = splitText(text, 120);
  statusEl.textContent = "🔊 朗读中...";
  statusEl.className = "status speaking";

  for (let i = 0; i < parts.length; i++) {
    if (!isSpeaking) break;
    await speakOne(parts[i], lang);
    if (i < parts.length - 1) await new Promise(r => setTimeout(r, 80));
  }
  isSpeaking = false;
  statusEl.textContent = "✅ 播放完成";
  statusEl.className = "status done";
  if (callback) callback();
}

function stopSpeech() {
  isSpeaking = false;
  if (window.speechSynthesis) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

// ========================================================================
// 六、英语学习模块
// ========================================================================
function getAllScenes() {
  const set = new Set();
  dialogPool.forEach(d => set.add(d.scene));
  return Array.from(set);
}

function initScenes() {
  const scenes = getAllScenes();
  sceneSelect.innerHTML = "";
  scenes.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    sceneSelect.appendChild(opt);
  });
  sceneSelect.value = scenes[0] || "";
  loadScene(scenes[0] || "");
}

function loadScene(scene) {
  currentScene = scene;
  dialogList = dialogPool.filter(d => d.scene === scene);
  allGroups = [];
  for (let i = 0; i < dialogList.length; i += GROUP_SIZE) {
    allGroups.push(dialogList.slice(i, i + GROUP_SIZE));
  }
  currentGroupIndex = 0;
  dialogCount.textContent = allGroups.length + " 组";
  renderGroup();
}

function escapeQuote(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, "&quot;");
}

function renderGroup() {
  if (!allGroups.length) {
    dialogArea.innerHTML = '<div class="empty-tip">该场景暂无对话</div>';
    return;
  }
  if (currentGroupIndex >= allGroups.length) currentGroupIndex = 0;
  if (currentGroupIndex < 0) currentGroupIndex = allGroups.length - 1;

  const group = allGroups[currentGroupIndex];

  let html = '<div class="group-header">' +
    '<span class="group-title">📖 对话组 ' + (currentGroupIndex + 1) + ' / ' + allGroups.length + '</span>' +
    '<span class="group-tag">' + group.length + ' 轮对话</span>' +
    '</div>';

  group.forEach((d, idx) => {
    html += '<div class="dialog-item">' +
      '<div class="dialog-row">' +
        '<span class="dialog-label q">问' + (idx+1) + '</span>' +
        '<div class="dialog-text">' +
          '<div class="line-en">' + d.qEn + '</div>' +
          '<div class="line-cn">' + d.qCn + '</div>' +
        '</div>' +
        '<button class="speak-btn" onclick="onSpeak(\'' + escapeQuote(d.qEn) + '\',\'en-US\',this)">🔊</button>' +
        '<button class="speak-btn cn" onclick="onSpeak(\'' + escapeQuote(d.qCn) + '\',\'zh-CN\',this)">中</button>' +
      '</div>' +
      '<div class="dialog-row answer">' +
        '<span class="dialog-label a">答' + (idx+1) + '</span>' +
        '<div class="dialog-text">' +
          '<div class="line-en">' + d.aEn + '</div>' +
          '<div class="line-cn">' + d.aCn + '</div>' +
        '</div>' +
        '<button class="speak-btn" onclick="onSpeak(\'' + escapeQuote(d.aEn) + '\',\'en-US\',this)">🔊</button>' +
        '<button class="speak-btn cn" onclick="onSpeak(\'' + escapeQuote(d.aCn) + '\',\'zh-CN\',this)">中</button>' +
      '</div>' +
    '</div>';
  });

  html += '<div class="related-box">' +
    '<h5>💡 学习提示</h5>' +
    '<div class="rel-item"><strong>话题：</strong>本组对话围绕"' + currentScene + '"场景展开，建议先听后说。</div>' +
    '<div class="rel-item"><strong>练习：</strong>点击每句的 🔊 听英文，点击"中"听中文，跟读模仿。</div>' +
    '<div class="rel-item"><strong>整组：</strong>点击下方"整组朗读"可以连续听完整对话。</div>' +
  '</div>';

  dialogArea.innerHTML = html;
}

function onSpeak(text, lang, btn) {
  document.querySelectorAll(".speak-btn").forEach(b => b.classList.remove("speaking"));
  if (btn) btn.classList.add("speaking");
  speak(text, lang, () => {
    if (btn) btn.classList.remove("speaking");
  });
}

function prevGroup() {
  if (!allGroups.length) return;
  stopSpeech();
  currentGroupIndex = (currentGroupIndex - 1 + allGroups.length) % allGroups.length;
  renderGroup();
}
function nextGroup() {
  if (!allGroups.length) return;
  stopSpeech();
  currentGroupIndex = (currentGroupIndex + 1) % allGroups.length;
  renderGroup();
}

async function playGroup() {
  if (!allGroups.length) return;
  stopSpeech();
  const group = allGroups[currentGroupIndex];
  document.querySelectorAll(".speak-btn").forEach(b => b.classList.remove("speaking"));

  for (const d of group) {
    await new Promise(r => speak(d.qEn, "en-US", r));
    await new Promise(r => setTimeout(r, 200));
    await new Promise(r => speak(d.qCn, "zh-CN", r));
    await new Promise(r => setTimeout(r, 200));
    await new Promise(r => speak(d.aEn, "en-US", r));
    await new Promise(r => setTimeout(r, 200));
    await new Promise(r => speak(d.aCn, "zh-CN", r));
    await new Promise(r => setTimeout(r, 300));
    if (!isSpeaking) break;
  }
}

// ========================================================================
// 七、商品城模块
// ========================================================================
function initCategories() {
  const box = document.getElementById("categories");
  box.innerHTML = "";
  Object.keys(categoryNames).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (key === "all" ? " active" : "");
    btn.dataset.cat = key;
    btn.textContent = categoryNames[key];
    btn.onclick = () => {
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCategory = key;
      renderProducts();
    };
    box.appendChild(btn);
  });
}

function renderProducts() {
  const grid = document.getElementById("productGrid");
  const list = currentCategory === "all"
    ? products
    : products.filter(p => p.category === currentCategory);

  if (!list.length) {
    grid.innerHTML = '<div class="empty-tip" style="grid-column:1/-1;">该分类暂无商品，点下方"⚙️ 管理商品"上架</div>';
    document.getElementById("tabShopBadge").textContent = products.length;
    return;
  }

  grid.innerHTML = list.map(p => {
    const imgHtml = p.emoji && (p.emoji.startsWith("http") || p.emoji.startsWith("data:"))
      ? '<img src="' + p.emoji + '" alt="' + p.name + '" onerror="this.parentNode.textContent=\'📦\'">'
      : (p.emoji || "📦");
    return '<div class="product-card" onclick="openProduct(' + p.id + ')">' +
      '<div class="product-img">' + imgHtml + '</div>' +
      '<div class="product-body">' +
        '<div class="product-name">' + p.name + '</div>' +
        '<div class="product-name-en">' + (p.nameEn || "") + '</div>' +
        '<div class="product-price">¥' + p.price + ' ' + (p.originalPrice ? '<small>¥' + p.originalPrice + '</small>' : '') + '</div>' +
      '</div>' +
    '</div>';
  }).join("");

  document.getElementById("tabShopBadge").textContent = products.length;
}

// ========================================================================
// 八、商品详情
// ========================================================================
function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProduct = p;
  const imgHtml = p.emoji && (p.emoji.startsWith("http") || p.emoji.startsWith("data:"))
    ? '<img src="' + p.emoji + '" alt="' + p.name + '">'
    : (p.emoji || "📦");
  document.getElementById("mImg").innerHTML = imgHtml;
  document.getElementById("mName").textContent = p.name;
  document.getElementById("mNameEn").textContent = p.nameEn || "";
  document.getElementById("mPrice").innerHTML = '¥' + p.price + ' ' + (p.originalPrice ? '<small>¥' + p.originalPrice + '</small>' : '');
  document.getElementById("mDescEn").textContent = p.descEn || "";
  document.getElementById("mDescCn").textContent = p.descCn || "";
  document.getElementById("productModal").classList.add("open");
  resetProductSpeakBtn();
}

function closeModal(id) {
  document.getElementById(id).classList.remove("open");
  if (id === "productModal") {
    stopSpeech();
    resetProductSpeakBtn();
  }
}

function scrollToInquiry() {
  closeModal("productModal");
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

let productSpeaking = false;
function resetProductSpeakBtn() {
  const btn = document.getElementById("mSpeakBtn");
  if (!btn) return;
  btn.textContent = "🔊 朗读英文描述";
  btn.classList.remove("primary");
  productSpeaking = false;
}
function speakProductDesc() {
  if (!currentProduct) return;
  if (productSpeaking) { stopSpeech(); resetProductSpeakBtn(); return; }
  if (!window.speechSynthesis) { alert("浏览器不支持语音"); return; }
  const btn = document.getElementById("mSpeakBtn");
  btn.textContent = "⏹ 停止朗读";
  btn.classList.add("primary");
  productSpeaking = true;
  speak(currentProduct.descEn || "", "en-US", () => {
    productSpeaking = false;
    resetProductSpeakBtn();
  });
}

// ========================================================================
// 九、商品管理（带密码保护）
// ========================================================================
function openAdmin() {
  requireAdmin(() => {
    renderAdminList();
    document.getElementById("adminModal").classList.add("open");
  });
}

function renderAdminList() {
  const box = document.getElementById("adminList");
  document.getElementById("adminCount").textContent = products.length;
  if (!products.length) {
    box.innerHTML = '<div class="admin-empty">还没有商品，点击下方"添加商品"开始上架</div>';
    return;
  }
  box.innerHTML = products.map(p => {
    const imgHtml = p.emoji && (p.emoji.startsWith("http") || p.emoji.startsWith("data:"))
      ? '<img src="' + p.emoji + '" alt="">'
      : (p.emoji || "📦");
    return '<div class="admin-item">' +
      '<div class="ai-img">' + imgHtml + '</div>' +
      '<div class="ai-info">' +
        '<div class="ai-name">' + p.name + '</div>' +
        '<div class="ai-sub">' + (categoryNames[p.category] || p.category) + ' · ¥' + p.price + ' · 库存' + (p.stock || 0) + '</div>' +
      '</div>' +
      '<div class="ai-actions">' +
        '<button style="background:#dbeafe;color:#1e40af;" onclick="closeModal(\'adminModal\');openProductForm(' + p.id + ')">编辑</button>' +
        '<button style="background:#fee2e2;color:#991b1b;" onclick="deleteProduct(' + p.id + ')">删除</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

function openProductForm(id) {
  if (!isAdminLoggedIn()) {
    requireAdmin(() => openProductForm(id));
    return;
  }

  const formTitle = document.getElementById("formTitle");
  const fId = document.getElementById("fId");
  const fName = document.getElementById("fName");
  const fNameEn = document.getElementById("fNameEn");
  const fPrice = document.getElementById("fPrice");
  const fOriginalPrice = document.getElementById("fOriginalPrice");
  const fCategory = document.getElementById("fCategory");
  const fEmoji = document.getElementById("fEmoji");
  const fDescEn = document.getElementById("fDescEn");
  const fDescCn = document.getElementById("fDescCn");
  const fStock = document.getElementById("fStock");
  const fSales = document.getElementById("fSales");

  fCategory.innerHTML = "";
  Object.keys(categoryNames).forEach(key => {
    if (key === "all") return;
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = categoryNames[key];
    fCategory.appendChild(opt);
  });

  if (id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    formTitle.textContent = "编辑商品";
    fId.value = p.id;
    fName.value = p.name || "";
    fNameEn.value = p.nameEn || "";
    fPrice.value = p.price || "";
    fOriginalPrice.value = p.originalPrice || "";
    fCategory.value = p.category || "home";
    fEmoji.value = p.emoji || "";
    fDescEn.value = p.descEn || "";
    fDescCn.value = p.descCn || "";
    fStock.value = p.stock || 0;
    fSales.value = p.sales || 0;
  } else {
    formTitle.textContent = "添加商品";
    fId.value = "";
    fName.value = "";
    fNameEn.value = "";
    fPrice.value = "";
    fOriginalPrice.value = "";
    fCategory.value = "home";
    fEmoji.value = "";
    fDescEn.value = "";
    fDescCn.value = "";
    fStock.value = 100;
    fSales.value = 0;
  }
  document.getElementById("productFormModal").classList.add("open");
}

function saveProduct() {
  if (!isAdminLoggedIn()) { showToast("请先验证身份"); return; }

  const fId = document.getElementById("fId").value;
  const fName = document.getElementById("fName").value.trim();
  const fNameEn = document.getElementById("fNameEn").value.trim();
  const fPrice = parseFloat(document.getElementById("fPrice").value);
  const fOriginalPrice = parseFloat(document.getElementById("fOriginalPrice").value) || 0;
  const fCategory = document.getElementById("fCategory").value;
  const fEmoji = document.getElementById("fEmoji").value.trim();
  const fDescEn = document.getElementById("fDescEn").value.trim();
  const fDescCn = document.getElementById("fDescCn").value.trim();
  const fStock = parseInt(document.getElementById("fStock").value) || 0;
  const fSales = parseInt(document.getElementById("fSales").value) || 0;

  if (!fName) { showToast("请填写商品名称"); return; }
  if (isNaN(fPrice) || fPrice <= 0) { showToast("请填写有效的价格"); return; }

  if (fId) {
    const p = products.find(x => x.id === parseInt(fId));
    if (p) {
      p.name = fName;
      p.nameEn = fNameEn;
      p.price = fPrice;
      p.originalPrice = fOriginalPrice;
      p.category = fCategory;
      p.emoji = fEmoji || "📦";
      p.descEn = fDescEn;
      p.descCn = fDescCn;
      p.stock = fStock;
      p.sales = fSales;
    }
    showToast("✅ 商品已更新");
  } else {
    const newId = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;
    products.push({
      id: newId,
      category: fCategory,
      name: fName,
      nameEn: fNameEn,
      price: fPrice,
      originalPrice: fOriginalPrice,
      emoji: fEmoji || "📦",
      descEn: fDescEn,
      descCn: fDescCn,
      stock: fStock,
      sales: fSales
    });
    showToast("✅ 商品已上架");
  }

  saveProducts();
  closeModal("productFormModal");
  renderProducts();
  renderAdminList();
  switchTab("shop");
}

function deleteProduct(id) {
  if (!isAdminLoggedIn()) { showToast("请先验证身份"); return; }
  if (!confirm("确定要删除这个商品吗？")) return;
  products = products.filter(p => p.id !== id);
  saveProducts();
  renderProducts();
  renderAdminList();
  showToast("🗑️ 商品已删除");
}

function exportData() {
  if (!isAdminLoggedIn()) { showToast("请先验证身份"); return; }
  const data = JSON.stringify(products, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "products_backup.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("📤 数据已导出");
}

// ========================================================================
// 十、询盘
// ========================================================================
function submitInquiry(e) {
  e.preventDefault();
  const box = document.getElementById("formSuccess");
  box.classList.add("show");
  e.target.reset();
  setTimeout(() => box.classList.remove("show"), 5000);
}

// ========================================================================
// 十一、导航 & 工具
// ========================================================================
function switchTab(tab) {
  document.querySelectorAll(".nav-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === tab);
  });
  document.getElementById("learnModule").style.display = tab === "learn" ? "block" : "none";
  document.getElementById("shopModule").style.display = tab === "shop" ? "block" : "none";
  stopSpeech();
  if (tab === "shop") renderProducts();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showToast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 20px;border-radius:30px;font-size:13px;opacity:0;transition:0.3s;z-index:999;pointer-events:none;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  setTimeout(() => t.style.opacity = "0", 1800);
}

// ========================================================================
// 十二、初始化
// ========================================================================
function initApp() {
  loadProducts();
  initScenes();
  sceneSelect.onchange = () => loadScene(sceneSelect.value);
  initCategories();
  renderProducts();

  document.addEventListener("touchstart", function onFirst() {
    warmUpSpeech();
    document.removeEventListener("touchstart", onFirst);
  }, { passive: true });
  document.addEventListener("click", function onFirst() {
    warmUpSpeech();
    document.removeEventListener("click", onFirst);
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      isSpeaking = false;
    }
    if (document.hidden) stopSpeech();
  });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "Escape") {
      document.querySelectorAll(".modal").forEach(m => m.classList.remove("open"));
      stopSpeech();
    }
    if (document.getElementById("learnModule").style.display !== "none") {
      if (e.key === "ArrowLeft") prevGroup();
      if (e.key === "ArrowRight") nextGroup();
    }
  });

  document.querySelectorAll(".modal").forEach(m => {
    m.addEventListener("click", function(e) {
      if (e.target === this) closeModal(this.id);
    });
  });

  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  console.log("✅ 学英语·逛好物 完整版已启动");
  console.log("📚 对话组:", allGroups.length, "组 × 每组", GROUP_SIZE, "轮");
  console.log("🛍️ 商品:", products.length, "件");
  console.log("🔐 管理员默认密码: admin888 （请登录后立即修改）");
}

initApp();
