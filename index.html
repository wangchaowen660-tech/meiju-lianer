<style>

@media(max-width:480px){.english{font-size:25px;}.chunk{font-size:24px;}.ctrl-btn{width:50px;height:50px;font-size:28px;}.ctrl-btn.play-btn{width:70px;height:70px;font-size:36px;}.ctrl-btn.cn-btn{width:50px;height:50px;font-size:24px;}#sceneSelect{font-size:13px;padding:0 8px;min-width:90px;}.search-wrapper .input-group input{font-size:14px;}}

<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header"><h1>🎧 Listen & Speak</h1><p>Learn English · 600+ 实用短句 · 发音已修复</p></div>
<div class="search-wrapper">
  <select id="sceneSelect"><option value="">📂 全部场景</option></select>
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="Search English or Chinese" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>
<div class="card">
<div id="scene" class="scene">Basic Needs</div>
<div id="progress" class="progress">Chunk 1 / 600+</div>
<div class="chunk-label">Core Chunk</div>
<div id="chunk" class="chunk">I want to...</div>
<div class="english"><span id="english">I want to eat.</span></div>
<div id="chinese" class="chinese">我想吃东西。</div>
<div class="replace-title">Replace & Practice (点击替换词听发音)</div>
<div id="replaceList" class="replace-list"></div>
<div class="player-controls">
<button class="ctrl-btn" onclick="prevTrack()">⏮</button>
<button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
<button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
<button class="ctrl-btn" onclick="nextTrack()">⏭</button>
</div>
<div id="cnStatus" class="cn-status">Chinese audio available: first 50 sentences</div>
<div class="extra-buttons">
<button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
<button onclick="playPattern()">🧩 Pattern</button>
<button onclick="randomSentence()">🎲 Random</button>
<button id="hdToggle" class="hd-toggle" onclick="toggleHD()">✨ HD</button>
<button id="micBtn" class="mic-toggle" onclick="toggleMic()">🎤 Voice</button>
<button id="aiToggle" class="ai-toggle" onclick="toggleChat()">💬 Chat</button>
<button id="unlockCnBtn" class="unlock-cn-btn" onclick="showUnlockDialog()">🔓 Unlock Chinese</button>
<button class="get-code-btn" onclick="getUnlockCode()">🔑 Get Code</button>
<button class="reset-audio-btn" onclick="resetAudio()">🔊 修复音频</button>
</div>
<div id="chatBox" class="chat-box"></div>
<div id="chatInputArea" class="chat-input-area">
<input id="chatInput" type="text" placeholder="Type English or Chinese, press Enter" autocomplete="off">
<button onclick="sendTextMessage()">Send</button>
</div>
<div id="status" class="status">Ready</div>
<div id="adminPanel" class="admin-panel">

<input type="password" id="adminPwd" placeholder="Enter admin password">
<button onclick="adminLogin()">Login</button>
<div id="adminContent" style="display:none; margin-top:12px;">
    <select id="levelSelect"><option value="20">Unlock 20</option><option value="50">Unlock 50</option><option value="100">Unlock 100</option></select>
    <button onclick="generateCnCode()">Generate Unlock Code</button>
    <div class="code-box" id="generatedCode">Click generate</div>
    <button onclick="hideAdmin()" style="background:#ef4444;">Close Panel</button>
</div>
</div>
</div>
<div style="text-align:center;margin-top:16px;font-size:13px;color:#b9c2d0;">Listen to Pattern → Full Sentence → Replace → Speak</div>
</div>

<script>
// ========================================================================
// 1. 核心模板库（与之前完全相同，112个模板）
// ========================================================================
// 为节省篇幅，此处省略 coreChunks 定义（您可沿用之前版本），
// 但为了完整性，我将包含全部。实际开发中请确保此处有完整的 coreChunks。
// 注意：由于回答长度限制，我将在下方提供简化版（仅含前几个），
// 您应复制您之前完整的 coreChunks 替换此部分。
// ========================================================================
// 实际使用时，请将您之前完整的 coreChunks 数组粘贴到这里。
// 这里为示范，仅保留几个条目以保证代码结构完整。
// 您务必用您的完整 coreChunks 替换下面这个简化数组。
const coreChunks = [
["基础需求","我想……","I want to...","I want to eat.","我想吃东西。",["eat|吃","go|去","sleep|睡觉"]],
["基础需求","我需要……","I need...","I need some water.","我需要一些水。",["water|水","help|帮助","money|钱"]],
// ... 请用您的完整 112 个模板替换此处 ...
];
// 警告：上面 coreChunks 仅是示例，您必须替换为您的完整数据！
// ========================================================================

// ========================================================================
// 2. 文本清洗函数（修复发音异常）
// ========================================================================
function cleanSpeechText(text) {
    if (!text) return '';
    let cleaned = text
        .replace(/\.{3,}/g, '')      // 移除连续点
        .replace(/…/g, '')           // 移除中文省略号
        .replace(/\s+/g, ' ')        // 合并空格
        .trim();
    return cleaned || text;          // 防止为空
}

// ========================================================================
// 3. 展开模板 → 生成 600+ 独立短句（清洗每个 en）
// ========================================================================
function expandTemplates(templates) {
    const result = [];
    templates.forEach(tpl => {
        const [scene, chunk, pattern, en, cn, replacements] = tpl;
        // 主句加入，清洗英文
        result.push({
            scene,
            chunk,
            pattern,
            en: cleanSpeechText(en),
            cn,
            replace: replacements,
            isPremium: false
        });
        // 对每个替换词生成变体
        if (replacements && replacements.length) {
            replacements.forEach(r => {
                const parts = r.split('|');
                if (parts.length < 2) return;
                const enWord = parts[0].trim();
                const cnWord = parts[1].trim();
                let newEn = en;
                let newCn = cn;
                if (pattern.includes('...')) {
                    newEn = pattern.replace(/\.{3}/g, enWord);
                } else {
                    const words = en.split(' ');
                    if (words.length > 0) {
                        words[words.length - 1] = enWord;
                        newEn = words.join(' ');
                    } else {
                        newEn = enWord;
                    }
                }
                // 中文处理
                if (cn.includes('……')) {
                    newCn = cn.replace(/……/g, cnWord);
                } else {
                    const cnWords = cn.split(/[，,、。.]/);
                    if (cnWords.length > 0) {
                        const last = cnWords[cnWords.length - 1];
                        if (last.length > 0) {
                            newCn = cn.replace(last, cnWord);
                        } else {
                            newCn = cn + cnWord;
                        }
                    } else {
                        newCn = cnWord;
                    }
                }
                newEn = cleanSpeechText(newEn);
                if (!newEn) newEn = enWord;
                result.push({
                    scene,
                    chunk: chunk + ' (' + enWord + ')',
                    pattern: newEn,
                    en: newEn,
                    cn: newCn,
                    replace: replacements,
                    isPremium: false
                });
            });
        }
    });
    return result;
}

let lessons = expandTemplates(coreChunks);
console.log('✅ 总短句数:', lessons.length);

// ========================================================================
// 4. 核心功能代码（播放、搜索等，已加入清洗）
// ========================================================================
let currentIndex = 0;
let isSpeaking = false;
let isPaused = false;
let currentUtterance = null;
let currentAudio = null;
let isRepeating = false;
let repeatCount = 0;
let repeatTimer = null;
let hdMode = false;
let playQueue = [];
let isProcessingQueue = false;
let retryCount = 0;
const MAX_RETRY = 2;
const REPEAT_TIMES = 5;
const TIMEOUT_SEC = 8;

const dom = {
    scene: document.getElementById("scene"),
    progress: document.getElementById("progress"),
    chunk: document.getElementById("chunk"),
    english: document.getElementById("english"),
    chinese: document.getElementById("chinese"),
    replaceList: document.getElementById("replaceList"),
    status: document.getElementById("status"),
    playPauseBtn: document.getElementById("playPauseBtn"),
    repeatBtn: document.getElementById("repeatBtn"),
    searchInput: document.getElementById("searchInput"),
    results: document.getElementById("results"),
    toast: document.getElementById("toast"),
    hdToggle: document.getElementById("hdToggle"),
    micBtn: document.getElementById("micBtn"),
    chatBox: document.getElementById("chatBox"),
    chatInput: document.getElementById("chatInput"),
    aiToggle: document.getElementById("aiToggle")
};

let toastTimer;
function showToast(t) {
    dom.toast.textContent = t;
    dom.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => dom.toast.classList.remove("show"), 1800);
}

function getAvailableLessons() { return lessons; }

function getCurrentItem() {
    const available = getAvailableLessons();
    if (available.length === 0) return null;
    if (currentIndex >= available.length) currentIndex = 0;
    const item = available[currentIndex];
    if (!item || !item.en) {
        console.warn('当前条目无效，重置索引');
        currentIndex = 0;
        return available[0] || null;
    }
    return item;
}

function stopSpeech() {
    if (currentUtterance) {
        try { window.speechSynthesis.cancel(); } catch(e) {}
        currentUtterance = null;
    }
    if (currentAudio) {
        try { currentAudio.pause(); currentAudio.src = ''; } catch(e) {}
        currentAudio = null;
    }
    isSpeaking = false;
    isPaused = false;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    playQueue = [];
    isProcessingQueue = false;
    retryCount = 0;
}

function isSpeechSupported() {
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
}

// ----- 语音播放（原生）-----
function speakNative(text, cb) {
    if (!text || text.trim() === '') {
        cb(false, 'Empty text');
        return;
    }
    if (!isSpeechSupported()) {
        cb(false, 'Browser does not support TTS');
        return;
    }
    let voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) {
        window.speechSynthesis.onvoiceschanged = function() {
            voices = window.speechSynthesis.getVoices();
            doSpeak();
        };
        setTimeout(function() {
            if (!voices || voices.length === 0) {
                voices = window.speechSynthesis.getVoices();
            }
            if (voices && voices.length > 0) {
                doSpeak();
            } else {
                cb(false, 'No voices available');
            }
        }, 1000);
        return;
    }
    doSpeak();

    function doSpeak() {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.6;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        const preferred = voices.find(v => /Google UK|David|Zira|Samantha/i.test(v.name)) ||
                          voices.find(v => v.lang.startsWith('en'));
        if (preferred) utterance.voice = preferred;

        let ended = false;
        const timeoutId = setTimeout(function() {
            if (!ended) {
                ended = true;
                window.speechSynthesis.cancel();
                currentUtterance = null;
                isSpeaking = false;
                dom.playPauseBtn.textContent = "▶";
                dom.playPauseBtn.classList.remove("paused");
                cb(false, 'Timeout');
            }
        }, 8000);

        utterance.onstart = function() {
            if (currentUtterance !== utterance) return;
            isSpeaking = true;
            dom.playPauseBtn.textContent = "⏸";
            dom.playPauseBtn.classList.add("paused");
            dom.status.textContent = "🎧 Playing (native)";
            dom.status.className = "status speaking";
        };

        utterance.onend = function() {
            if (ended) return;
            ended = true;
            clearTimeout(timeoutId);
            isSpeaking = false;
            currentUtterance = null;
            dom.playPauseBtn.textContent = "▶";
            dom.playPauseBtn.classList.remove("paused");
            dom.status.textContent = "✅ Playback done";
            dom.status.className = "status done";
            cb(true);
        };

        utterance.onerror = function(e) {
            if (ended) return;
            ended = true;
            clearTimeout(timeoutId);
            isSpeaking = false;
            currentUtterance = null;
            dom.playPauseBtn.textContent = "▶";
            dom.playPauseBtn.classList.remove("paused");
            if (e.error === 'canceled' || e.error === 'interrupted') {
                cb(false, 'Canceled');
            } else {
                cb(false, 'Native TTS error: ' + e.error);
            }
        };

        currentUtterance = utterance;
        try {
            window.speechSynthesis.speak(utterance);
        } catch (err) {
            clearTimeout(timeoutId);
            ended = true;
            isSpeaking = false;
            currentUtterance = null;
            cb(false, 'Exception: ' + err.message);
        }
    }
}

// ----- 语音播放（HD）-----
function speakGoogle(text, cb) {
    if (!text || text.trim() === '') {
        cb(false, 'Empty text');
        return;
    }
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
    const audio = new Audio(url);
    currentAudio = audio;
    let ended = false;
    const timeoutId = setTimeout(function() {
        if (!ended) {
            ended = true;
            audio.pause();
            audio.src = '';
            currentAudio = null;
            cb(false, 'Network timeout');
        }
    }, 8000);

    audio.oncanplaythrough = function() {
        audio.play().catch(function(err) {
            if (ended) return;
            clearTimeout(timeoutId);
            ended = true;
            currentAudio = null;
            cb(false, 'Play error: ' + err.message);
        });
    };

    audio.onplay = function() {
        isSpeaking = true;
        dom.playPauseBtn.textContent = "⏸";
        dom.playPauseBtn.classList.add("paused");
        dom.status.textContent = "🎧 Playing (HD)";
        dom.status.className = "status speaking";
    };

    audio.onended = function() {
        if (ended) return;
        clearTimeout(timeoutId);
        ended = true;
        isSpeaking = false;
        currentAudio = null;
        dom.playPauseBtn.textContent = "▶";
        dom.playPauseBtn.classList.remove("paused");
        dom.status.textContent = "✅ Playback done";
        dom.status.className = "status done";
        cb(true);
    };

    audio.onerror = function() {
        if (ended) return;
        clearTimeout(timeoutId);
        ended = true;
        isSpeaking = false;
        currentAudio = null;
        cb(false, 'Google TTS failed (network restriction)');
    };

    audio.load();
}

// ----- 语音入口（含清洗）-----
function speakText(text, cb) {
    const cleanText = cleanSpeechText(text);
    if (!cleanText) {
        if (cb) cb(false);
        return;
    }
    playQueue.push({ text: cleanText, cb, retries: 0 });
    processQueue();
}

function processQueue() {
    if (isProcessingQueue || playQueue.length === 0) return;
    isProcessingQueue = true;
    const task = playQueue.shift();
    const { text, cb, retries } = task;
    const useGoogle = hdMode && navigator.onLine;

    function onResult(success, msg) {
        if (success) {
            isProcessingQueue = false;
            if (cb) cb(true);
            if (playQueue.length > 0) processQueue();
        } else {
            if (retries < MAX_RETRY) {
                if (useGoogle && msg.includes('network')) {
                    task.retries = retries + 1;
                    playQueue.unshift(task);
                    isProcessingQueue = false;
                    setTimeout(processQueue, 500);
                    return;
                } else {
                    task.retries = retries + 1;
                    playQueue.unshift(task);
                    isProcessingQueue = false;
                    setTimeout(processQueue, 800);
                    return;
                }
            } else {
                isProcessingQueue = false;
                if (cb) cb(false);
                dom.status.textContent = "⚠️ Playback failed.";
                dom.status.className = "status error";
                if (playQueue.length > 0) processQueue();
            }
        }
    }

    if (useGoogle) {
        speakGoogle(text, onResult);
    } else {
        speakNative(text, onResult);
    }
}

// ----- 播放当前句子（已清洗）-----
function playCurrent() {
    if (isSpeaking) {
        stopSpeech();
        setTimeout(playCurrent, 200);
        return;
    }
    const item = getCurrentItem();
    if (!item || !item.en) {
        dom.status.textContent = "⚠️ No valid sentence";
        dom.status.className = "status error";
        showToast('No valid sentence');
        return;
    }
    const cleanText = cleanSpeechText(item.en);
    if (!cleanText) {
        dom.status.textContent = "⚠️ Empty sentence";
        dom.status.className = "status error";
        showToast('Empty sentence');
        return;
    }
    dom.status.textContent = "⏳ Loading...";
    dom.status.className = "status";
    if (playQueue.length > 0) {
        playQueue = [];
        isProcessingQueue = false;
    }
    speakText(cleanText, function(success) {
        if (!success) {
            dom.status.textContent = "⚠️ Playback failed, retry native...";
            dom.status.className = "status error";
            if (hdMode) {
                hdMode = false;
                dom.hdToggle.textContent = "✨ HD";
                dom.hdToggle.style.background = "#8b5cf6";
                showToast('Switched to native voice');
                setTimeout(playCurrent, 500);
            }
        }
    });
}

// ----- 其他播放函数（也使用清洗）-----
function playPattern() {
    const item = getCurrentItem();
    if (!item) return;
    const text = item.pattern.replace(/\.{3}|…/g, "").trim();
    const clean = cleanSpeechText(text);
    if (!clean) return;
    stopSpeech();
    setTimeout(() => {
        dom.status.textContent = "🧩 Pattern...";
        speakText(clean);
    }, 100);
}

function playReplaceWord(word) {
    if (!word) return;
    const enPart = word.split('|')[0] || word;
    const clean = cleanSpeechText(enPart);
    if (!clean) {
        showToast('⚠️ 发音词为空');
        return;
    }
    speakText(clean, function(success) {
        if (success) showToast("🔊 " + clean);
        else showToast("⚠️ 发音失败");
    });
}

// 其他函数（prevTrack, nextTrack, randomSentence, toggleRepeat, doRepeat, toggleHD等）与之前相同，但都需调用 playCurrent 或 speakText，已自动清洗。
// 为保持完整，以下提供这些函数（与之前逻辑一致）。
function togglePlayPause() {
    if (isSpeaking) {
        stopSpeech();
        dom.status.textContent = "⏸ Paused";
        dom.status.className = "status paused";
    } else {
        playCurrent();
    }
}
function prevTrack() {
    stopSpeech();
    const available = getAvailableLessons();
    if (available.length === 0) return;
    currentIndex = (currentIndex - 1 + available.length) % available.length;
    showSentence();
    setTimeout(playCurrent, 150);
}
function nextTrack() {
    stopSpeech();
    const available = getAvailableLessons();
    if (available.length === 0) return;
    currentIndex = (currentIndex + 1) % available.length;
    showSentence();
    setTimeout(playCurrent, 150);
}
function randomSentence() {
    stopSpeech();
    const available = getAvailableLessons();
    if (available.length === 0) return;
    currentIndex = Math.floor(Math.random() * available.length);
    showSentence();
    setTimeout(playCurrent, 150);
}
function toggleRepeat() {
    if (isRepeating) {
        isRepeating = false;
        clearTimeout(repeatTimer);
        stopSpeech();
        dom.repeatBtn.textContent = "🔁 Repeat";
        dom.repeatBtn.classList.remove("active");
        dom.status.textContent = "⏸ Repeat stopped";
        dom.status.className = "status paused";
        return;
    }
    isRepeating = true;
    repeatCount = 0;
    dom.repeatBtn.textContent = "⏹ Stop Repeat";
    dom.repeatBtn.classList.add("active");
    doRepeat();
}
function doRepeat() {
    if (!isRepeating) return;
    repeatCount++;
    dom.status.textContent = `🔁 Repeat ${repeatCount}/${REPEAT_TIMES}`;
    dom.status.className = "status";
    const item = getCurrentItem();
    if (!item) { stopSpeech(); return; }
    const cleanText = cleanSpeechText(item.en);
    if (!cleanText) { stopSpeech(); return; }
    speakText(cleanText, function(success) {
        if (!isRepeating) return;
        if (!success) {
            isRepeating = false;
            dom.repeatBtn.textContent = "🔁 Repeat";
            dom.repeatBtn.classList.remove("active");
            dom.status.textContent = "⚠️ Repeat interrupted";
            dom.status.className = "status error";
            return;
        }
        if (repeatCount >= REPEAT_TIMES) {
            isRepeating = false;
            dom.repeatBtn.textContent = "🔁 Repeat";
            dom.repeatBtn.classList.remove("active");
            dom.status.textContent = "✅ Repeat done";
            dom.status.className = "status done";
            return;
        }
        repeatTimer = setTimeout(doRepeat, 600);
    });
}
function toggleHD() {
    if (isOffline) {
        showToast('HD mode unavailable offline');
        return;
    }
    hdMode = !hdMode;
    dom.hdToggle.textContent = hdMode ? "✨ HD(ON)" : "✨ HD";
    dom.hdToggle.style.background = hdMode ? "#22c55e" : "#8b5cf6";
    showToast(hdMode ? "HD voice enabled" : "Switched to native voice");
    if (isSpeaking) {
        stopSpeech();
        setTimeout(playCurrent, 200);
    }
}
function showSentence() {
    const item = getCurrentItem();
    if (!item) return;
    const available = getAvailableLessons();
    dom.scene.textContent = item.scene || 'Unknown';
    dom.progress.textContent = `Chunk ${currentIndex+1} / ${available.length}`;
    dom.chunk.textContent = item.chunk || '';
    dom.english.textContent = item.en || '';
    dom.chinese.textContent = item.cn || '';
    dom.replaceList.innerHTML = "";
    if (item.replace && item.replace.length) {
        item.replace.forEach(function(word) {
            const span = document.createElement("span");
            span.className = "replace-item";
            span.textContent = word;
            span.title = "Click to hear pronunciation";
            span.onclick = function(e) {
                e.stopPropagation();
                playReplaceWord(word);
            };
            dom.replaceList.appendChild(span);
        });
    }
    dom.status.textContent = "Ready";
    dom.status.className = "status";
    updateCnStatus();
}
