<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟人像 · 开口说话</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:20px;background:#1a1a2e;font-family:sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.container{max-width:800px;width:100%;}
h1{text-align:center;font-size:28px;margin-bottom:10px;}
.sub{text-align:center;color:#aaa;font-size:14px;margin-bottom:20px;}
.upload-area{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;justify-content:center;}
.upload-area input[type=file]{background:#fff;border-radius:8px;padding:6px;color:#000;}
.upload-area input[type=url]{flex:1;min-width:200px;padding:8px 12px;border-radius:8px;border:0;font-size:14px;}
.upload-area button{padding:8px 20px;border-radius:8px;border:0;background:#e94560;color:#fff;font-weight:bold;cursor:pointer;}
.video-wrapper{position:relative;background:#16213e;border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;}
#videoPlayer{width:100%;height:100%;display:block;background:#000;}
#avatarCanvas{position:absolute;bottom:10%;right:5%;width:160px;height:160px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 20px rgba(233,69,96,0.5);background:#0f3460;}
.controls{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
.controls button{padding:10px 24px;border-radius:40px;border:0;background:#e94560;color:#fff;font-weight:bold;cursor:pointer;font-size:16px;}
.controls button:disabled{opacity:0.5;cursor:not-allowed;}
.speak-text{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
.speak-text input{flex:1;min-width:200px;padding:10px;border-radius:8px;border:0;font-size:15px;}
.speak-text button{background:#1a8cff;border:0;border-radius:8px;padding:10px 20px;color:#fff;font-weight:bold;cursor:pointer;}
.status{margin-top:10px;color:#aaa;font-size:14px;text-align:center;}
</style>
</head>
<body>
<div class="container">
  <h1>🎤 虚拟人像 · 开口说话</h1>
  <p class="sub">上传视频或输入链接，播放时头像嘴部会随音频开合</p>

  <!-- 媒体源 -->
  <div class="upload-area">
    <input type="file" id="fileInput" accept="video/*,audio/*">
    <input type="url" id="urlInput" placeholder="输入视频/音频 URL (如 .mp4 .mp3)">
    <button onclick="loadMedia()">加载</button>
  </div>

  <!-- 播放器 -->
  <div class="video-wrapper">
    <video id="videoPlayer" controls></video>
    <canvas id="avatarCanvas" width="200" height="200"></canvas>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <button id="playBtn" onclick="togglePlay()">▶ 播放</button>
    <button onclick="resetMedia()">⏹ 停止</button>
  </div>

  <!-- TTS 文字输入（模拟说话内容） -->
  <div class="speak-text">
    <input id="ttsInput" placeholder="输入要说的话，点击说话" value="Hello, welcome to my channel!">
    <button onclick="speakTTS()">🗣️ 说话</button>
  </div>

  <div class="status" id="status">就绪</div>
</div>

<script>
// ============================================================
//  1. 获取 DOM 元素
// ============================================================
const video = document.getElementById('videoPlayer');
const canvas = document.getElementById('avatarCanvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

let audioContext = null;
let analyser = null;
let animationId = null;
let isPlaying = false;

// ============================================================
//  2. 绘制虚拟头像（带嘴部动态）
// ============================================================
function drawAvatar(mouthOpen) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // 背景圆形 (皮肤)
  const cx = w/2, cy = h/2 - 10, radius = 80;
  const grad = ctx.createRadialGradient(cx-20, cy-20, 20, cx, cy, radius);
  grad.addColorStop(0, '#f7d9b0');
  grad.addColorStop(1, '#e3b48c');
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#c99a7a';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 眼睛 (白色)
  function drawEye(offsetX, offsetY) {
    ctx.beginPath();
    ctx.ellipse(cx + offsetX, cy + offsetY, 14, 16, 0, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 瞳孔
    ctx.beginPath();
    ctx.arc(cx + offsetX + 4, cy + offsetY + 2, 6, 0, Math.PI*2);
    ctx.fillStyle = '#2c3e50';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + offsetX + 7, cy + offsetY, 2, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
  drawEye(-26, -10);
  drawEye(26, -10);

  // 眉毛
  ctx.beginPath();
  ctx.moveTo(cx-34, cy-30);
  ctx.lineTo(cx-18, cy-28);
  ctx.moveTo(cx+34, cy-30);
  ctx.lineTo(cx+18, cy-28);
  ctx.strokeStyle = '#5a3d2b';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 嘴 (根据 mouthOpen 0~1 控制开合)
  const mouthY = cy + 22;
  const mouthW = 36;
  const mouthH = 8 + mouthOpen * 22; // 最大高度 30

  // 嘴唇
  ctx.beginPath();
  ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2);
  ctx.fillStyle = '#d55a6a';
  ctx.fill();
  ctx.strokeStyle = '#b3475a';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 牙齿（如果嘴张开较大）
  if (mouthOpen > 0.3) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx-12, mouthY-4, 24, 6);
    // 牙齿分割线
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, mouthY-4);
    ctx.lineTo(cx, mouthY+2);
    ctx.stroke();
  }

  // 腮红（装饰）
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(cx-40, cy+20, 12, 0, Math.PI*2);
  ctx.fillStyle = '#f5a3b8';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx+40, cy+20, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

// ============================================================
//  3. 音频分析：获取实时音量
// ============================================================
function setupAudioAnalyser(source) {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  const sourceNode = audioContext.createMediaElementSource(source);
  sourceNode.connect(analyser);
  analyser.connect(audioContext.destination);
  // 开始绘制动画
  animateMouth();
}

function animateMouth() {
  if (!analyser) return;
  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);
  // 计算平均音量（0-255）
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    sum += dataArray[i];
  }
  const avg = sum / dataArray.length;
  const normalized = Math.min(avg / 128, 1); // 0~1
  // 平滑处理，使嘴动更自然
  const smoothOpen = normalized * 0.8 + 0.1; // 最小也微张
  drawAvatar(smoothOpen);
  animationId = requestAnimationFrame(animateMouth);
}

// ============================================================
//  4. 媒体加载与控制
// ============================================================
function loadMedia() {
  const file = document.getElementById('fileInput').files[0];
  const url = document.getElementById('urlInput').value.trim();

  if (file) {
    const objectURL = URL.createObjectURL(file);
    video.src = objectURL;
  } else if (url) {
    video.src = url;
  } else {
    status.textContent = '⚠️ 请选择文件或输入 URL';
    return;
  }

  video.load();
  video.onloadedmetadata = function() {
    status.textContent = '✅ 媒体加载成功';
    // 为了分析音频，需要等用户点击播放后建立 AudioContext（需用户手势）
    video.onplay = function() {
      if (!analyser) {
        // 首次播放时建立分析器
        try {
          setupAudioAnalyser(video);
        } catch(e) {
          console.warn('无法创建音频分析器', e);
        }
      }
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
    };
    video.onpause = function() {
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ 播放';
    };
    video.onended = function() {
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶ 播放';
      if (animationId) cancelAnimationFrame(animationId);
      drawAvatar(0); // 闭嘴
    };
    // 如果视频没有音频，我们仍然可以手动用 TTS 模拟
  };
  video.onerror = function() {
    status.textContent = '❌ 无法加载媒体';
  };
}

function togglePlay() {
  if (video.paused) {
    video.play();
  } else {
    video.pause();
  }
}

function resetMedia() {
  video.pause();
  video.currentTime = 0;
  document.getElementById('playBtn').textContent = '▶ 播放';
  isPlaying = false;
  if (animationId) cancelAnimationFrame(animationId);
  drawAvatar(0);
  status.textContent = '已停止';
}

// ============================================================
//  5. TTS 语音合成（让头像“开口说话”）
// ============================================================
function speakTTS() {
  const text = document.getElementById('ttsInput').value.trim();
  if (!text) return;
  if (!window.speechSynthesis) {
    status.textContent = '❌ 浏览器不支持 TTS';
    return;
  }

  // 先暂停当前播放
  if (!video.paused) video.pause();

  // 创建语音合成
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.8;
  utterance.pitch = 1;

  // 模拟嘴部动画：利用 speechSynthesis 的事件无法直接获取音频数据，
  // 我们改为用 setInterval 模拟随机张嘴（更自然），或者用 Web Audio 分析（但 TTS 不输出到 AudioContext）
  // 简单方案：播放期间嘴部有节奏开合
  let mouthTimer = null;
  let phase = 0;

  // 停止之前的动画
  if (animationId) cancelAnimationFrame(animationId);
  if (mouthTimer) clearInterval(mouthTimer);

  // 开始说话时显示动态嘴
  utterance.onstart = function() {
    status.textContent = '🗣️ 说话中...';
    // 用定时器模拟嘴部动态
    mouthTimer = setInterval(() => {
      phase += 0.3;
      const open = (Math.sin(phase) * 0.5 + 0.5) * 0.9 + 0.1; // 0.1~1.0
      drawAvatar(open);
    }, 80);
  };

  utterance.onend = function() {
    if (mouthTimer) clearInterval(mouthTimer);
    drawAvatar(0);
    status.textContent = '✅ 说话结束';
    // 恢复视频播放（可选）
  };

  utterance.onerror = function() {
    if (mouthTimer) clearInterval(mouthTimer);
    drawAvatar(0);
    status.textContent = '⚠️ 语音合成失败';
  };

  window.speechSynthesis.speak(utterance);
}

// ============================================================
//  6. 初始化
// ============================================================
drawAvatar(0);
status.textContent = '就绪，加载媒体或输入文字说话';

// 如果页面无交互，用户点击时先激活 AudioContext
document.addEventListener('click', function() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
}, { once: true });
</script>
</body>
</html>
