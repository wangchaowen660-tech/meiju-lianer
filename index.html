<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>🎧 每句练耳 · Chaowen AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f6f8;
  color:#222;
  font-family:
    -apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC",
    "Microsoft YaHei",sans-serif;
}

.app{
  max-width:620px;
  margin:auto;
  padding:9px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.logo{
  font-size:19px;
  font-weight:800;
}

.sub{
  font-size:11px;
  color:#888;
}

.card{
  background:#fff;
  border-radius:13px;
  padding:11px;
  margin-bottom:8px;
  box-shadow:0 2px 9px rgba(0,0,0,.05);
}

.label{
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

/* 搜索 */
.search{
  display:flex;
  gap:6px;
}

.search input{
  flex:1;
  border:1px solid #ddd;
  border-radius:9px;
  padding:9px 10px;
  font-size:14px;
  outline:none;
}

.search button{
  border:0;
  border-radius:9px;
  padding:0 13px;
  background:#222;
  color:#fff;
}

/* 词族 */
.familyBar{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
}

.familyBar button{
  flex:0 0 auto;
  border:0;
  background:#f0f1f3;
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
}

.familyBar button.active{
  background:#222;
  color:#fff;
}

/* 单词 */
.wordGrid{
  display:grid;
  grid-template-columns:
    repeat(5,1fr);
  gap:5px;
}

.wordBtn{
  border:0;
  background:#f0f1f3;
  border-radius:8px;
  padding:8px 2px;
  font-size:14px;
}

.wordBtn.active{
  background:#222;
  color:#fff;
}

/* 当前 */
.current{
  text-align:center;
}

.bigWord{
  font-size:38px;
  font-weight:850;
  line-height:1.1;
}

.meaning{
  color:#777;
  font-size:14px;
  margin-top:3px;
}

.mainPlay{
  border:0;
  background:#222;
  color:#fff;
  border-radius:9px;
  padding:9px 17px;
  margin-top:8px;
  font-size:14px;
}

/* 拼读 */
.blend{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  margin-top:9px;
}

.blend button{
  border:0;
  background:#f0f1f3;
  border-radius:7px;
  padding:6px 9px;
  font-weight:700;
}

/* 词块 */
.chunks{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chunk{
  border:0;
  background:#f0f1f3;
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
}

/* 母句 */
.pattern{
  font-size:20px;
  font-weight:750;
  text-align:center;
}

.patternCN{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:2px;
}

.sentence{
  border-top:1px solid #eee;
  padding:8px 0;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.sentenceText{
  font-size:14px;
  line-height:1.35;
}

.sentenceCN{
  color:#888;
  font-size:12px;
  margin-top:2px;
}

.speak{
  flex:0 0 auto;
  border:0;
  background:#f0f1f3;
  border-radius:7px;
  padding:6px 8px;
}

/* 听力 */
.listen{
  text-align:center;
}

.listenText{
  min-height:24px;
  margin-top:8px;
  font-size:17px;
  font-weight:650;
}

.listenCN{
  min-height:18px;
  color:#888;
  font-size:12px;
}

/* 底部 */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.controls button{
  border:0;
  border-radius:9px;
  padding:9px;
  background:#eef0f2;
}

.controls .next{
  background:#222;
  color:#fff;
}

.speed{
  display:flex;
  gap:5px;
  margin-top:6px;
}

.speed button{
  flex:1;
  border:0;
  background:#eef0f2;
  border-radius:7px;
  padding:6px;
  font-size:11px;
}

.speed .active{
  background:#222;
  color:#fff;
}
</style>
</head>

<body>

<div class="app">

<!-- 顶部 -->
<div class="header">

  <div>
    <div class="logo">🎧 每句练耳</div>
    <div class="sub">
      Chaowen AI · 词族 × 词块 × 母句
    </div>
  </div>

  <div id="progress">
    1 / 2000
  </div>

</div>


<!-- 搜索 -->
<div class="card">

  <div class="search">

    <input
      id="searchInput"
      placeholder="搜索单词，例如 make / home">

    <button onclick="searchWord()">
      搜索
    </button>

  </div>

</div>


<!-- 词族 -->
<div class="card">

  <div class="label">
    📚 词族
  </div>

  <div
    class="familyBar"
    id="familyBar">
  </div>

  <div style="height:7px"></div>

  <div
    class="wordGrid"
    id="wordGrid">
  </div>

</div>


<!-- 当前单词 -->
<div class="card">

  <div class="current">

    <div
      class="bigWord"
      id="bigWord">
      make
    </div>

    <div
      class="meaning"
      id="meaning">
      制作；使
    </div>

    <button
      class="mainPlay"
      onclick="speakCurrent()">
      🔊 听单词
    </button>

    <div
      class="blend"
      id="blend">
    </div>

  </div>

</div>


<!-- 词块 -->
<div class="card">

  <div class="label">
    🧩 高频词块
  </div>

  <div
    class="chunks"
    id="chunks">
  </div>

</div>


<!-- 母句型 -->
<div class="card">

  <div class="label">
    🗣 母句型
  </div>

  <div
    class="pattern"
    id="pattern">
    I want to ...
  </div>

  <div
    class="patternCN"
    id="patternCN">
    我想……
  </div>

  <div
    id="sentences">
  </div>

</div>


<!-- 听力 -->
<div class="card">

  <div class="label">
    🎧 先听英语
  </div>

  <div class="listen">

    <button
      class="mainPlay"
      onclick="listenFirst()">
      🔊 听句子
    </button>

    <div
      class="listenText"
      id="listenText">
    </div>

    <div
      class="listenCN"
      id="listenCN">
    </div>

  </div>

</div>


<!-- 控制 -->
<div class="card">

  <div class="controls">

    <button onclick="previousWord()">
      ← 上一个
    </button>

    <button
      class="next"
      onclick="nextWord()">
      下一个 →
    </button>

    <button onclick="repeatSentence()">
      🔁 重复
    </button>

    <button onclick="stopSpeech()">
      ■ 停止
    </button>

  </div>

  <div class="speed">

    <button
      onclick="setSpeed(.68,this)">
      🐢 慢
    </button>

    <button
      class="active"
      onclick="setSpeed(.85,this)">
      正常
    </button>

    <button
      onclick="setSpeed(1,this)">
      自然
    </button>

  </div>

</div>

</div>

/* =========================================================

========================================================= */

/* =========================================================
   高频词块生成
========================================================= */

function makeChunks(word){

  return [

    word,

    `the ${word}`,

    `my ${word}`,

    `your ${word}`,

    `a ${word}`,

    `this ${word}`,

    `that ${word}`,

    `one ${word}`,

    `I need ${word}`,

    `I want ${word}`,

    `I like ${word}`,

    `I have ${word}`

  ];

}


/* =========================================================
   状态
========================================================= */

let currentIndex=0;
let speed=.85;
let speechToken=0;


/* =========================================================
   词族
========================================================= */

function getFamilies(){

  const set=[...new Set(
    WORDS.map(x=>x[2])
  )];

  return set;

}


function renderFamilies(){

  const box=
    document.getElementById("familyBar");

  box.innerHTML="";

  getFamilies().forEach(family=>{

    const b=
      document.createElement("button");

    b.textContent=family;

    b.onclick=()=>{

      const i=
        WORDS.findIndex(x=>x[2]===family);

      if(i>=0){

        currentIndex=i;

        render();

      }

    };

    box.appendChild(b);

  });

}


/* =========================================================
   当前词
========================================================= */

function current(){

  return WORDS[currentIndex];

}


/* =========================================================
   单词网格
========================================================= */

function renderWords(){

  const box=
    document.getElementById("wordGrid");

  box.innerHTML="";

  const family=
    current()[2];

  const list=
    WORDS
      .map((x,i)=>[x,i])
      .filter(x=>x[0][2]===family);

  list.forEach(pair=>{

    const item=pair[0];
    const index=pair[1];

    const b=
      document.createElement("button");

    b.className="wordBtn";

    if(index===currentIndex){
      b.classList.add("active");
    }

    b.textContent=item[0];

    b.onclick=()=>{

      currentIndex=index;

      render();

      speakCurrent();

    };

    box.appendChild(b);

  });

}


/* =========================================================
   当前单词
========================================================= */

function renderCurrent(){

  const item=current();

  document.getElementById("bigWord")
    .textContent=item[0];

  document.getElementById("meaning")
    .textContent=item[1];

  document.getElementById("progress")
    .textContent=
      `${currentIndex+1} / ${WORDS.length}`;

}


/* =========================================================
   拼读
========================================================= */

function renderBlend(){

  const item=current();

  const word=item[0];

  const family=item[2];

  const box=
    document.getElementById("blend");

  if(family==="核心"){

    box.innerHTML="";

    return;

  }

  const ending=
    family.substring(1);

  const start=
    word.endsWith(ending)
      ? word.slice(
          0,
          word.length-ending.length
        )
      : "";

  if(!start){

    box.innerHTML="";

    return;

  }

  box.innerHTML=`

    <button
      onclick="speak('${start}')">
      ${start}
    </button>

    <span>+</span>

    <button
      onclick="speak('${ending}')">
      ${ending}
    </button>

    <span>→</span>

    <button
      onclick="speak('${word}')">
      ${word}
    </button>

  `;

}


/* =========================================================
   词块
========================================================= */

function renderChunks(){

  const box=
    document.getElementById("chunks");

  box.innerHTML="";

  makeChunks(current()[0])
    .forEach(text=>{

      const b=
        document.createElement("button");

      b.className="chunk";

      b.textContent=text;

      b.onclick=()=>{
        speak(text);
      };

      box.appendChild(b);

    });

}


/* =========================================================
   母句
========================================================= */

function renderSentences(){

  const word=current()[0];

  const box=
    document.getElementById("sentences");

  box.innerHTML="";

  /*
    一个词直接生成20种母句结构。
    这样每个词不是1句话，而是一整组练习。
  */

  PATTERNS.forEach(pattern=>{

    const sentence=
      pattern.build(word);

    const row=
      document.createElement("div");

    row.className="sentence";

    row.innerHTML=`

      <div>

        <div class="sentenceText">
          ${sentence}
        </div>

        <div class="sentenceCN">
          ${pattern.cn}
        </div>

      </div>

      <button class="speak">
        🔊
      </button>

    `;

    row.querySelector(".speak")
      .onclick=()=>{
        speak(sentence);
      };

    box.appendChild(row);

  });

  document.getElementById("pattern")
    .textContent=
      "20种母句型 × 当前词";

  document.getElementById("patternCN")
    .textContent=
      "一个词，进入大量真实句子";

}


/* =========================================================
   全部刷新
========================================================= */

function render(){

  renderFamilies();

  renderWords();

  renderCurrent();

  renderBlend();

  renderChunks();

  renderSentences();

  document.getElementById("listenText")
    .textContent="";

  document.getElementById("listenCN")
    .textContent="";

}


/* =========================================================
   稳定语音
========================================================= */

function stopSpeech(){

  speechToken++;

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

  }

}


function speak(text,rate=speed){

  if(!text) return;

  const token=
    ++speechToken;

  speechSynthesis.cancel();

  setTimeout(()=>{

    if(token!==speechToken) return;

    const u=
      new SpeechSynthesisUtterance(text);

    u.lang="en-US";

    u.rate=rate;

    u.pitch=1;

    u.volume=1;

    speechSynthesis.speak(u);

  },80);

}


/* =========================================================
   当前单词
========================================================= */

function speakCurrent(){

  speak(current()[0]);

}


/* =========================================================
   听力
========================================================= */

function listenFirst(){

  const word=current()[0];

  const pattern=
    PATTERNS[0];

  const sentence=
    pattern.build(word);

  document.getElementById("listenText")
    .textContent="••••••••••";

  document.getElementById("listenCN")
    .textContent="";

  speak(sentence,.68);

  setTimeout(()=>{

    document.getElementById("listenText")
      .textContent=sentence;

    document.getElementById("listenCN")
      .textContent=pattern.cn;

  },1800);

}


/* =========================================================
   重复句子
========================================================= */

function repeatSentence(){

  const word=current()[0];

  speak(
    PATTERNS[0].build(word)
  );

}


/* =========================================================
   上一个
========================================================= */

function previousWord(){

  stopSpeech();

  currentIndex--;

  if(currentIndex<0){

    currentIndex=
      WORDS.length-1;

  }

  render();

  setTimeout(
    speakCurrent,
    100
  );

}


/* =========================================================
   下一个
========================================================= */

function nextWord(){

  stopSpeech();

  currentIndex++;

  if(currentIndex>=WORDS.length){

    currentIndex=0;

  }

  render();

  setTimeout(
    speakCurrent,
    100
  );

}


/* =========================================================
   搜索
========================================================= */

function searchWord(){

  const value=
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();

  if(!value) return;

  const index=
    WORDS.findIndex(
      x=>x[0].toLowerCase()===value
    );

  if(index>=0){

    currentIndex=index;

    render();

    speakCurrent();

  }

}


/* =========================================================
   回车搜索
========================================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    e=>{
      if(e.key==="Enter"){
        searchWord();
      }
    }
  );


/* =========================================================
   速度
========================================================= */

function setSpeed(value,button){

  speed=value;

  document
    .querySelectorAll(".speed button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

}


/* =========================================================
   页面离开停止声音
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stopSpeech();

    }

  }
);


/* =========================================================
   启动
========================================================= */

render();

</script>

</body>
</html>
