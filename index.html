<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen & Speak · 高清语音版</title>
<style>
/* ===== 全局变量与主题 ===== */
:root {
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text: #1e293b;
  --text-light: #475569;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --input-bg: #ffffff;
  --shadow: 0 2px 8px rgba(0,0,0,0.04);
  --chunk-bg: #eef2f6;
  --chunk-hover: #dce2ea;
  --primary: #e94560;
  --primary-hover: #c73a54;
  --secondary: #8b5cf6;
  --hd-color: #22c55e;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --text: #e2e8f0;
  --text-light: #cbd5e1;
  --text-muted: #94a3b8;
  --border: #334155;
  --input-bg: #1e293b;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --chunk-bg: #2d3748;
  --chunk-hover: #4a5568;
  --primary: #f87171;
  --primary-hover: #ef4444;
  --secondary: #a78bfa;
  --hd-color: #34d399;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:12px 10px 28px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);min-height:100vh;transition:background .2s;}
.container{max-width:500px;width:100%;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px;}
.header-left{display:flex;align-items:center;gap:8px;}
.header-left h1{margin:0;font-size:24px;font-weight:700;color:var(--text);}
.header-left p{margin:0;color:var(--text-muted);font-size:13px;background:var(--chunk-bg);padding:2px 12px;border-radius:30px;}
.header-right{display:flex;align-items:center;gap:6px;}
.theme-btn{background:transparent;border:0;font-size:22px;cursor:pointer;padding:0 4px;color:var(--text);}
.fav-count{cursor:pointer;background:var(--primary);color:#fff;padding:0 10px;border-radius:20px;font-size:13px;font-weight:600;line-height:24px;display:flex;align-items:center;gap:4px;border:0;transition:background .2s;}
.fav-count:hover{background:var(--primary-hover);}
.pattern-selector{background:var(--card-bg);border-radius:12px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;box-shadow:var(--shadow);border:1px solid var(--border);}
.pattern-selector label{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;}
.pattern-selector select{flex:1;min-width:100px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none;cursor:pointer;}
.pattern-selector .badge{background:var(--primary);color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.custom-chunk{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.custom-chunk input{flex:1;min-width:60px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--input-bg);color:var(--text);}
.custom-chunk button{padding:3px 10px;background:var(--secondary);color:#fff;border:0;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;}
.custom-chunk button:hover{opacity:.85;}
.search-wrapper{display:flex;gap:4px;margin-bottom:8px;}
.search-wrapper .input-group{flex:1;display:flex;align-items:center;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:0 4px;height:34px;}
.search-wrapper .input-group:focus-within{border-color:var(--primary);}
.search-wrapper .input-group input{flex:1;border:0;outline:none;font-size:13px;padding:0 4px;background:transparent;color:var(--text);height:100%;}
.search-wrapper .input-group button{background:transparent;border:0;font-size:16px;cursor:pointer;padding:0 6px;color:var(--text-muted);display:flex;align-items:center;height:100%;}
.search-wrapper .input-group button:hover{color:var(--text);}
.results{margin-bottom:8px;}
.result{background:var(--card-bg);padding:8px 12px;margin-bottom:4px;border-radius:10px;cursor:pointer;border:1px solid var(--border);color:var(--text);}
.result-en{font-weight:600;font-size:15px;}
.result-cn{margin-top:2px;color:var(--text-light);font-size:13px;}
.no-result{padding:12px;text-align:center;color:var(--text-muted);background:var(--card-bg);border-radius:10px;font-size:14px;}
.card{background:var(--card-bg);border-radius:16px;padding:16px 12px 12px;box-shadow:var(--shadow);text-align:center;position:relative;border:1px solid var(--border);}
.avatar-wrap{position:absolute;top:8px;right:8px;width:64px;height:64px;border-radius:50%;border:2px solid var(--border);overflow:hidden;background:var(--chunk-bg);}
#avatarCanvas{width:100%;height:100%;display:block;}
.scene{color:var(--text-muted);font-size:12px;font-weight:500;padding-right:64px;text-align:left;}
.progress{color:var(--text-muted);font-size:11px;margin-top:1px;text-align:left;}
.pattern-display{background:var(--chunk-bg);padding:4px 12px;border-radius:8px;margin:8px 0 2px;display:inline-block;}
.pattern-display .label{font-size:10px;color:var(--text-muted);}
.pattern-display .text{font-size:18px;font-weight:700;color:var(--text);}
.flow-arrow{color:var(--text-muted);font-size:14px;margin:2px 0;}
.english{min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px 4px;font-size:22px;font-weight:700;line-height:1.3;color:var(--text);background:var(--bg);border-radius:8px;margin:4px 0;position:relative;}
.english .fav-btn{background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--text-muted);padding:0 4px;transition:color .2s;}
.english .fav-btn.active{color:#f59e0b;}
.english .copy-btn{background:transparent;border:0;font-size:18px;cursor:pointer;color:var(--text-muted);padding:0 4px;transition:color .2s;}
.english .copy-btn:hover{color:var(--text);}
.english .action-buttons{display:flex;gap:2px;margin-left:4px;}
.chinese{min-height:28px;font-size:16px;color:var(--text-light);padding:4px 8px;background:var(--bg);border-radius:8px;}
.sentence-hint{font-size:11px;color:var(--text-muted);margin-top:2px;}
.sentence-hint .highlight{color:var(--primary);font-weight:600;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
.ctrl-btn{background:var(--chunk-bg);border:0;padding:0;cursor:pointer;font-size:22px;color:var(--text);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;touch-action:manipulation;transition:background .15s;}
.ctrl-btn:active{transform:scale(.90);}
.ctrl-btn.play-btn{width:52px;height:52px;font-size:28px;background:var(--primary);color:#fff;}
.ctrl-btn.play-btn:hover{background:var(--primary-hover);}
.ctrl-btn.cn-btn{background:#f59e0b;color:#fff;width:38px;height:38px;font-size:18px;}
.speed-control{display:flex;align-items:center;gap:4px;}
.speed-btn{background:var(--chunk-bg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;}
.speed-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.extra-buttons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;justify-content:center;}
.extra-buttons button{flex:0 1 auto;padding:4px 10px;border:0;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:var(--chunk-bg);color:var(--text);transition:background .15s;}
.extra-buttons button.active{background:#ef4444;color:#fff;}
.extra-buttons .ai-toggle{background:#10b981;color:#fff;}
.extra-buttons .ai-toggle:hover{background:#059669;}
.extra-buttons .mic-toggle{background:#f59e0b;color:#fff;}
.extra-buttons .mic-toggle:hover{background:#d97706;}
.extra-buttons .mic-toggle.listening{background:#ef4444;}
.extra-buttons .mic-toggle:disabled{opacity:0.5;cursor:not-allowed;}
.extra-buttons .reset-audio-btn{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn:hover{background:#dc2626;}
.extra-buttons .chunk-toggle-btn{background:var(--secondary);color:#fff;}
.extra-buttons .chunk-toggle-btn:hover{background:#7c3aed;}
.extra-buttons .hd-toggle{background:#8b5cf6;color:#fff;}
.extra-buttons .hd-toggle:hover{background:#7c3aed;}
.status{min-height:20px;margin-top:4px;color:var(--text-muted);font-size:12px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}
.status.paused{color:#f59e0b;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:6px 16px;border-radius:40px;opacity:0;pointer-events:none;transition:.3s;z-index:999;font-size:13px;font-weight:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.api-settings{background:var(--card-bg);border-radius:10px;padding:4px 10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--border);}
.api-settings input{flex:2;min-width:60px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--input-bg);color:var(--text);}
.api-settings input#apiBaseInput{flex:1.5;}
.api-settings button{padding:3px 10px;background:var(--text);color:var(--bg);border:0;border-radius:6px;font-weight:500;cursor:pointer;font-size:12px;}
.api-settings button.save-btn{background:#22c55e;color:#fff;}
.api-status{font-size:11px;color:var(--text-muted);margin-left:2px;}
.chunk-area-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.3s ease, opacity 0.2s ease;margin:0;}
.chunk-area-wrap.open{max-height:400px;opacity:1;margin-top:8px;}
.chunk-area{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px;background:var(--bg);border-radius:10px;border:1px solid var(--border);max-height:200px;overflow-y:auto;}
.chunk-item{cursor:pointer;padding:3px 10px;background:var(--chunk-bg);border-radius:14px;font-size:13px;color:var(--text);border:1px solid transparent;transition:all 0.15s;user-select:none;}
.chunk-item:hover{background:var(--chunk-hover);}
.chunk-item.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.chunk-item.custom{background:var(--secondary);color:#fff;}
.chunk-item.custom:hover{background:#7c3aed;}
.chat-box{background:var(--bg);border-radius:12px;padding:10px;margin-top:8px;max-height:280px;overflow-y:auto;text-align:left;border:1px solid var(--border);display:none;}
.chat-msg{margin:4px 0;padding:5px 10px;border-radius:10px;max-width:90%;word-break:break-word;font-size:14px;color:var(--text);}
.chat-msg.user{background:#dbeafe;margin-left:auto;}
.chat-msg.ai{background:var(--chunk-bg);margin-right:auto;}
.chat-msg .time{font-size:10px;color:var(--text-muted);margin-top:2px;}
.chat-input-area{display:flex;gap:4px;margin-top:4px;display:none;}
.chat-input-area input{flex:1;padding:6px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none;}
.chat-input-area button{padding:4px 12px;background:#10b981;color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
.chat-input-area .example-btn{background:var(--secondary);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;padding:4px 10px;}
.chat-input-area .example-btn:hover{background:#7c3aed;}
.admin-panel{display:none;margin-top:12px;padding:10px;background:var(--card-bg);border-radius:12px;border:1px solid var(--border);text-align:left;}
.admin-panel input{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:13px;background:var(--input-bg);color:var(--text);}
.admin-panel .code-box{background:var(--bg);padding:6px;border-radius:6px;font-family:monospace;font-size:14px;margin:6px 0;word-break:break-all;color:var(--text);}
.admin-panel button{background:var(--text);color:var(--bg);border:0;padding:6px;border-radius:6px;cursor:pointer;font-size:13px;}
@media(max-width:480px){.english{font-size:18px;}.chunk-item{font-size:12px;padding:2px 8px;}.ctrl-btn{width:34px;height:34px;font-size:18px;}.ctrl-btn.play-btn{width:46px;height:46px;font-size:24px;}.ctrl-btn.cn-btn{width:34px;height:34px;font-size:16px;}.pattern-display .text{font-size:16px;}.avatar-wrap{width:52px;height:52px;top:4px;right:4px;}.pattern-selector select{font-size:12px;padding:2px 6px;min-width:70px;}.extra-buttons button{font-size:11px;padding:3px 8px;}.header-left h1{font-size:20px;}.header-left p{font-size:11px;}.speed-btn{font-size:10px;padding:1px 5px;}.english .copy-btn{font-size:16px;}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header">
  <div class="header-left">
    <h1>🧩 Listen & Speak</h1>
    <p>高清语音</p>
  </div>
  <div class="header-right">
    <button class="theme-btn" id="themeToggle" title="切换主题">🌙</button>
    <button class="fav-count" id="favCountBtn" title="查看收藏">⭐ 0</button>
  </div>
</div>

<div class="api-settings">
  <input id="apiKeyInput" type="password" placeholder="API Key" style="flex:2;">
  <input id="apiBaseInput" type="url" placeholder="API Base URL" value="https://api.deepseek.com/v1" style="flex:1.5;">
  <button class="save-btn" onclick="saveApiConfig()">💾</button>
  <span class="api-status" id="apiStatus">未设置</span>
</div>

<div class="pattern-selector">
  <label>📌 母句</label>
  <select id="patternSelect"></select>
  <span class="badge" id="chunkCount">0</span>
</div>
<div class="custom-chunk">
  <input id="customChunkEn" placeholder="英文词块 (e.g. run fast)" style="flex:1;">
  <input id="customChunkCn" placeholder="中文释义 (e.g. 快跑)" style="flex:0.8;">
  <button onclick="addCustomChunk()">➕</button>
</div>

<div class="search-wrapper">
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="搜索句子" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<div class="card">
  <div class="avatar-wrap"><canvas id="avatarCanvas" width="220" height="220"></canvas></div>
  <div class="scene" id="scene">日常表达</div>
  <div class="progress" id="progress">总句数: 2500+</div>
  <div class="pattern-display">
    <div class="label">母句</div>
    <div class="text" id="patternDisplay">I want to...</div>
  </div>
  <div class="flow-arrow">▼ 当前整句</div>
  <div class="english" id="englishContainer">
    <span id="english">I want to eat.</span>
    <span class="action-buttons">
      <button class="copy-btn" id="copyBtn" onclick="copySentence()" title="复制句子">📋</button>
      <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆</button>
    </span>
  </div>
  <div class="chinese" id="chinese">我想吃饭。</div>
  <div class="sentence-hint" id="sentenceHint">💡 点击 ⬅️ ➡️ 切换词块</div>

  <div class="player-controls">
    <button class="ctrl-btn" onclick="prevChunk()">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
    <button class="ctrl-btn" onclick="nextChunk()">⏭</button>
    <div class="speed-control">
      <button class="speed-btn" data-speed="0.7" onclick="setSpeed(0.7)">0.7×</button>
      <button class="speed-btn active" data-speed="1.0" onclick="setSpeed(1.0)">1.0×</button>
      <button class="speed-btn" data-speed="1.3" onclick="setSpeed(1.3)">1.3×</button>
    </div>
  </div>

  <div class="extra-buttons">
    <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
    <button onclick="playPatternOnly()">🧩 母句</button>
    <button onclick="randomChunk()">🎲 随机</button>
    <button id="micBtn" class="mic-toggle" onclick="toggleMic()">🎤 Voice</button>
    <button id="aiToggle" class="ai-toggle" onclick="toggleChat()">💬 AI</button>
    <button class="reset-audio-btn" onclick="resetAudio()">🔊 修复</button>
    <button class="chunk-toggle-btn" id="chunkToggleBtn" onclick="toggleChunkList()">📋 词块</button>
    <button class="hd-toggle" id="hdToggleBtn" onclick="toggleHD()">✨ HD</button>
  </div>

  <div class="chunk-area-wrap" id="chunkAreaWrap">
    <div class="chunk-area" id="chunkArea"></div>
  </div>

  <div id="chatBox" class="chat-box"></div>
  <div id="chatInputArea" class="chat-input-area">
    <input id="chatInput" type="text" placeholder="输入消息" autocomplete="off">
    <button onclick="sendTextMessage()">Send</button>
    <button class="example-btn" onclick="fillExample()">💡 示例</button>
  </div>
  <div id="status" class="status">Ready</div>
</div>
<div style="text-align:center;margin-top:6px;font-size:11px;color:var(--text-muted);">← 上一词块 · 下一词块 →</div>
</div>

<script>
// ========================================================================

// ========================================================================

// 自定义词块存储
let customChunks = JSON.parse(localStorage.getItem('customChunks')) || {};

function getChunksForPattern(patternId) {
  const p = patternList[patternId];
  const end = Math.min(p.start + p.count, chunkPool.length);
  const base = [];
  for (let i = p.start; i < end; i++) {
    base.push({ index: i, ...chunkPool[i], custom: false });
  }
  const custom = (customChunks[patternId] || []).map((c, idx) => ({ ...c, custom: true, index: 1000 + idx }));
  return [...base, ...custom];
}

function buildAllLessons() {
  const result = [];
  patternList.forEach((p) => {
    const end = Math.min(p.start + p.count, chunkPool.length);
    for (let i = p.start; i < end; i++) {
      const chunk = chunkPool[i];
      const fullEn = p.pattern.replace(/\.{3}/g, chunk.en);
      const fullCn = p.cnPrefix + chunk.cn;
      result.push({
        id: result.length + 1,
        pattern: p.pattern,
        en: fullEn,
        cn: fullCn,
        chunkEn: chunk.en,
        chunkCn: chunk.cn,
        patternId: p.id,
        chunkIndex: i,
        custom: false
      });
    }
    const customs = customChunks[p.id] || [];
    customs.forEach((c) => {
      const fullEn = p.pattern.replace(/\.{3}/g, c.en);
      const fullCn = p.cnPrefix + c.cn;
      result.push({
        id: result.length + 1,
        pattern: p.pattern,
        en: fullEn,
        cn: fullCn,
        chunkEn: c.en,
        chunkCn: c.cn,
        patternId: p.id,
        chunkIndex: 1000 + result.length,
        custom: true
      });
    });
  });
  return result;
}

let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

function updateFavUI() {
  dom.favCountBtn.textContent = '⭐ ' + favorites.length;
  const currentText = dom.english.textContent;
  const isFav = favorites.some(f => f.en === currentText);
  dom.favBtn.textContent = isFav ? '★' : '☆';
  dom.favBtn.classList.toggle('active', isFav);
}
function toggleFav() {
  const en = dom.english.textContent;
  const cn = dom.chinese.textContent;
  const chunkEn = getCurrentChunkEn();
  const pattern = patternList[currentPatternId].pattern;
  const idx = favorites.findIndex(f => f.en === en);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    showToast('已取消收藏');
  } else {
    favorites.push({ en, cn, chunkEn, pattern, patternId: currentPatternId });
    showToast('⭐ 已收藏');
  }
  localStorage.setItem('favorites', JSON.stringify(favorites));
  updateFavUI();
}
function getCurrentChunkEn() {
  const active = dom.chunkArea.querySelector('.chunk-item.active');
  return active ? active.dataset.en : '';
}
dom.favCountBtn.addEventListener('click', function() {
  if (favorites.length === 0) { showToast('暂无收藏'); return; }
  dom.results.innerHTML = '<div style="text-align:center;font-weight:600;margin:4px 0;">⭐ 收藏列表</div>';
  favorites.slice().reverse().forEach((f, idx) => {
    const box = document.createElement('div');
    box.className = 'result';
    box.innerHTML = `<div class="result-en">${f.en}</div><div class="result-cn">${f.cn}</div>`;
    box.onclick = function() {
      const pid = f.patternId || 0;
      dom.patternSelect.value = pid;
      loadPattern(pid);
      setTimeout(() => {
        const items = dom.chunkArea.querySelectorAll('.chunk-item');
        let target = null;
        items.forEach(el => {
          if (el.dataset.en === f.chunkEn) target = el;
        });
        if (target) playChunk(target);
        else showToast('词块已不存在');
      }, 200);
      dom.results.innerHTML = '';
    };

  const h=mouthHBase+open*28;
  const x=mouthX-3;
  ctx.beginPath();ctx.ellipse(x,mouthY,mouthW,h,0,0,Math.PI*2);
  ctx.fillStyle='rgba(200,130,140,0.55)';ctx.fill();ctx.strokeStyle='rgba(160,90,100,0.45)';ctx.lineWidth=1.5;ctx.stroke();
  if(open>0.6){ctx.beginPath();ctx.ellipse(x,mouthY+8,10,6,0,0,Math.PI*2);ctx.fillStyle='rgba(232,112,122,0.4)';ctx.fill();}
}
let mouthOpen=0.1, isSpeakingState=false, mouthTimer=null;
function updateMouth(target){mouthOpen+=(target-mouthOpen)*0.15;drawMouth(mouthOpen);}
function startSpeakingMouth(){
  isSpeakingState=true;
  if(mouthTimer)clearInterval(mouthTimer);
  let phase=0;
  mouthTimer=setInterval(()=>{phase+=0.3;const target=(Math.sin(phase)*0.5+0.5)*0.8+0.2;updateMouth(target);},50);
}
function stopSpeakingMouth(){
  isSpeakingState=false;
  if(mouthTimer){clearInterval(mouthTimer);mouthTimer=null;}
  let closeStep=0;
  function closeMouth(){
    if(closeStep<15){
      mouthOpen*=0.9;if(mouthOpen<0.05)mouthOpen=0.05;
      drawMouth(mouthOpen);closeStep++;
      setTimeout(closeMouth,25);
    }else{mouthOpen=0.05;drawMouth(0.05);}
  }
  closeMouth();
}

// HD 语音（使用 Google TTS）
function speakGoogle(text, cb) {
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
  const audio = new Audio(url);
  currentAudio = audio;
  let ended = false;
  const timeoutId = setTimeout(() => {
    if (!ended) { ended = true; audio.pause(); audio.src = ''; currentAudio = null; cb(false, 'Network timeout'); }
  }, 8000);

  audio.oncanplaythrough = function() {
    audio.play().catch(err => { if (!ended) { clearTimeout(timeoutId); ended = true; currentAudio = null; cb(false, 'Play error: ' + err.message); } });
  };
  audio.onplay = function() {
    isSpeaking = true; isPlayingLock = true;
    dom.playPauseBtn.textContent = "⏸"; dom.playPauseBtn.classList.add("paused");
    dom.status.textContent = "🎧 HD 语音..."; dom.status.className = "status speaking";
    startSpeakingMouth();
  };
  audio.onended = function() {
    if (ended) return;
    clearTimeout(timeoutId); ended = true; isSpeaking = false; isPlayingLock = false;
    currentAudio = null;
    dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
    dom.status.textContent = "✅ 播放完成"; dom.status.className = "status done";
    stopSpeakingMouth(); cb(true);
  };
  audio.onerror = function() {
    if (ended) return;
    clearTimeout(timeoutId); ended = true; isSpeaking = false; isPlayingLock = false;
    currentAudio = null;
    cb(false, 'Google TTS 失败');
  };
  audio.load();
}

// 原生语音（回退）
function speakNative(text, cb) {
  if(!text||text.trim()===''){cb(false,'Empty');return;}
  if(!window.speechSynthesis){cb(false,'No speechSynthesis');return;}
  try{window.speechSynthesis.cancel();}catch(e){}
  playQueue=[];isProcessingQueue=false;

  let voices=window.speechSynthesis.getVoices();
  if(!voices||voices.length===0){
    let waited=false;
    const onVoices=function(){
      voices=window.speechSynthesis.getVoices();
      if(voices&&voices.length>0&&!waited){waited=true;doSpeak();}
    };
    window.speechSynthesis.onvoiceschanged=onVoices;
    setTimeout(()=>{if(!waited){waited=true;voices=window.speechSynthesis.getVoices();doSpeak();}},200);
    return;
  }
  doSpeak();

  function doSpeak(){
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang='en-US';
    utterance.rate=speechRate;
    utterance.pitch=1.0;
    utterance.volume=1.0;
    const preferred=voices.find(v=>/Google UK|David|Zira|Samantha|Alex|Veena/i.test(v.name))||
      voices.find(v=>v.lang&&v.lang.startsWith('en'));
    if(preferred)utterance.voice=preferred;

    let ended=false;
    const timeoutId=setTimeout(()=>{
      if(!ended){
        ended=true;
        try{window.speechSynthesis.cancel();}catch(e){}
        currentUtterance=null;isSpeaking=false;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
        isPlayingLock=false;cb(false,'Timeout');stopSpeakingMouth();
      }
    },5000);

    utterance.onstart=function(){
      if(currentUtterance!==utterance)return;
      isSpeaking=true;isPlayingLock=true;
      dom.playPauseBtn.textContent="⏸";dom.playPauseBtn.classList.add("paused");
      dom.status.textContent="🎧 系统语音...";dom.status.className="status speaking";
      startSpeakingMouth();
    };
    utterance.onend=function(){
      if(ended)return;
      ended=true;clearTimeout(timeoutId);
      isSpeaking=false;currentUtterance=null;
      dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
      dom.status.textContent="✅ 播放完成";dom.status.className="status done";
      isPlayingLock=false;stopSpeakingMouth();cb(true);
    };
    utterance.onerror=function(e){
      if(ended)return;
      ended=true;clearTimeout(timeoutId);
      isSpeaking=false;currentUtterance=null;
      dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
      isPlayingLock=false;stopSpeakingMouth();
      if(e.error==='canceled'||e.error==='interrupted'){cb(false,'Canceled');}
      else{cb(false,'TTS error: '+e.error);}
    };
    currentUtterance=utterance;
    try{window.speechSynthesis.speak(utterance);}catch(err){
      clearTimeout(timeoutId);ended=true;isSpeaking=false;currentUtterance=null;isPlayingLock=false;
      cb(false,'Exception: '+err.message);stopSpeakingMouth();
    }
  }
}

function speakText(text, cb){
  const clean=text.replace(/\.{3,}/g,'').replace(/…/g,'').replace(/\s+/g,' ').trim();
  if(!clean){if(cb)cb(false);return;}
  if(isPlayingLock||isSpeaking){
    try{window.speechSynthesis.cancel();}catch(e){}
    isSpeaking=false;currentUtterance=null;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
    playQueue=[];isProcessingQueue=false;isPlayingLock=false;stopSpeakingMouth();
  }
  // 使用 HD 或原生
  const useHD = hdMode && navigator.onLine;
  setTimeout(()=>{
    if (useHD) {
      speakGoogle(clean, function(success) {
        if (cb) cb(success);
        if (!success) {
          // HD 失败，回退到原生
          setTimeout(()=>{ speakNative(clean, cb); }, 300);
        }
      });
    } else {
      speakNative(clean, cb);
    }
  },50);
}

function loadPattern(patternId){
  currentPatternId=patternId;
  currentChunkIndex=0;
  const p=patternList[patternId];

  dom.patternDisplay.textContent=p.pattern;
  dom.chunkCount.textContent=chunks.length;

  dom.chunkArea.innerHTML='';
  chunks.forEach((chunk,idx)=>{
    const span=document.createElement('span');
    span.className='chunk-item' + (chunk.custom ? ' custom' : '');
    span.textContent=chunk.en;
    span.dataset.index=idx;
    span.dataset.en=chunk.en;
    span.dataset.cn=chunk.cn;
    span.dataset.custom=chunk.custom ? 'true' : 'false';
    span.onclick=function(e){e.stopPropagation();playChunk(this);};

  });

  const first=dom.chunkArea.querySelector('.chunk-item');

  updateFavUI();
}

let playDebounceTimer=null;
let currentAudio = null; // 用于 HD 模式

function playChunk(el){
  if(playDebounceTimer){clearTimeout(playDebounceTimer);playDebounceTimer=null;}
  if(isSpeaking||isPlayingLock){
    try{window.speechSynthesis.cancel();}catch(e){}
    if(currentAudio){currentAudio.pause();currentAudio.src='';currentAudio=null;}
    isSpeaking=false;currentUtterance=null;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
    playQueue=[];isProcessingQueue=false;isPlayingLock=false;stopSpeakingMouth();
  }
  playDebounceTimer=setTimeout(()=>{
    playDebounceTimer=null;
    dom.chunkArea.querySelectorAll('.chunk-item').forEach(item=>item.classList.remove('active'));
    el.classList.add('active');

    const enWord=el.dataset.en;
    const cnWord=el.dataset.cn;
    const p=patternList[currentPatternId];
    const fullEn=p.pattern.replace(/\.{3}/g,enWord);
    const fullCn=p.cnPrefix+cnWord;

    dom.english.textContent=fullEn;
    dom.chinese.textContent=fullCn;
    dom.sentenceHint.innerHTML='✅ 造句连读：<span class="highlight">'+enWord+'</span> ('+cnWord+')';

    const items=dom.chunkArea.querySelectorAll('.chunk-item');
    items.forEach((item,idx)=>{if(item===el)currentChunkIndex=idx;});

    dom.status.textContent='🔊 整句朗读: '+fullEn;
    dom.status.className='status speaking';
    updateFavUI();
    speakText(fullEn,function(success){
      if(!success){
        dom.status.textContent="⚠️ 播放失败，重试...";
        dom.status.className="status error";
        setTimeout(()=>{speakText(fullEn,function(s2){if(!s2)dom.status.textContent="⚠️ 播放失败";});},300);
      }
    });
  },100);
}

function doRepeat(){

  const text=dom.english.textContent;

function searchSentence(){
  const keyword=dom.searchInput.value.trim().toLowerCase();
  dom.results.innerHTML="";
  if(!keyword){showToast("输入关键词搜索");return;}
  const matches=lessons.filter(item=>
    (item.en&&item.en.toLowerCase().includes(keyword))||
    (item.cn&&item.cn.includes(keyword))
  );
  if(matches.length===0){
    dom.results.innerHTML='<div class="no-result">🔍 未找到匹配句子</div>';
    return;
  }
  matches.slice(0,30).forEach(function(item){
    const box=document.createElement("div");
    box.className="result";
    box.innerHTML='<div class="result-en">'+item.en+'</div><div class="result-cn">'+item.cn+'</div>';
    box.onclick=function(){
      const pid=item.patternId;
      const p=patternList[pid];
      const chunks=getChunksForPattern(pid);
      let targetIdx=0;
      chunks.forEach((ch,idx)=>{
        const full=p.pattern.replace(/\.{3}/g,ch.en);
        if(full===item.en)targetIdx=idx;
      });
      dom.patternSelect.value=pid;
      loadPattern(pid);
      setTimeout(()=>{
        const items=dom.chunkArea.querySelectorAll('.chunk-item');
        if(items[targetIdx])playChunk(items[targetIdx]);
      },200);
      dom.results.innerHTML="";
      dom.searchInput.value="";
      showToast("跳转到句子");
    };
    dom.results.appendChild(box);
  });
}

let chatMode=false, isListening=false;
let apiKey=localStorage.getItem('ai_api_key')||'';
let apiBase=localStorage.getItem('ai_api_base')||'https://api.deepseek.com/v1';
let chatHistory=[];
const MAX_HISTORY=10;

function loadApiConfig(){

function buildMessages(userInput) {
  const systemMsg = {
    role: 'system',
    content: `You are an expert English teacher and conversation partner. Follow these rules strictly:

1. **If user writes in Chinese**: Translate their thought into natural, fluent English. Then explain the translation briefly (why that word/phrase works). If the input is vague, ask a clarifying question (e.g., "Do you mean...?").

2. **If user writes in English**: Check for grammar, word choice, and naturalness. Provide corrections and suggest more natural alternatives. If the sentence is already perfect, praise and offer a related follow-up question.

3. **If user's input is unclear or incomplete**: Ask one or two simple questions to understand their intention before replying.

4. **Keep responses concise (1-3 sentences for explanation, plus the translation/correction). Use the same language as the user's input (Chinese reply to Chinese, English reply to English).**

5. **Be encouraging and patient. The user is learning.`
  };
  const history = chatHistory.slice(-MAX_HISTORY);
  const messages = [systemMsg, ...history];
  if (userInput) messages.push({ role: 'user', content: userInput });
  return messages;
}

async function callAI(userInput){
  if(!apiKey){showToast('⚠️ 请先设置 API Key');return null;}
  const messages=buildMessages(userInput);
  const url=apiBase+'/chat/completions';
  const body={model:'deepseek-chat',messages,temperature:0.7,max_tokens:500,stream:false};
  try{
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify(body)});
    if(!resp.ok){const err=await resp.text();throw new Error('API 错误: '+resp.status+' '+err);}
    const data=await resp.json();
    const reply=data.choices[0].message.content;
    chatHistory.push({role:'user',content:userInput});
    chatHistory.push({role:'assistant',content:reply});
    if(chatHistory.length>MAX_HISTORY*2)chatHistory=chatHistory.slice(-MAX_HISTORY*2);
    return reply;
  }catch(e){showToast('❌ AI 请求失败: '+e.message);return null;}
}

function appendMessage(role,content){
  const div=document.createElement('div');div.className='chat-msg '+role;div.textContent=content;
  const time=document.createElement('div');time.className='time';time.textContent=new Date().toLocaleTimeString();div.appendChild(time);
  dom.chatBox.appendChild(div);dom.chatBox.scrollTop=dom.chatBox.scrollHeight;
}

async function processUserInput(text){
  if(!text.trim())return;
  appendMessage('user',text);
  dom.status.textContent='🤔 AI 正在理解...';
  dom.status.className='status speaking';
  const reply=await callAI(text);
  if(reply){
    const isChinese = /[\u4e00-\u9fa5]/.test(reply);
    appendMessage('ai',reply);
    dom.status.textContent='✅ 已回复';
    dom.status.className='status done';
    if(window.speechSynthesis){
      const utter=new SpeechSynthesisUtterance(reply);
      utter.lang=isChinese?'zh-CN':'en-US';
      utter.rate=0.8;
      window.speechSynthesis.speak(utter);
    }
  }else{
    dom.status.textContent='⚠️ 回复失败，请检查网络或 API 设置';
    dom.status.className='status error';
  }
}

function toggleChat(){
  chatMode=!chatMode;const btn=dom.aiToggle;
  if(chatMode){dom.chatBox.style.display='block';document.getElementById('chatInputArea').style.display='flex';btn.textContent='❌ 关闭';btn.style.background='#ef4444';if(dom.chatBox.children.length===0){appendMessage('ai',"👋 你好！我是你的 AI 英语学习助手。你可以用中文或英文随意输入，我会帮你翻译、纠错或引导。");}}else{dom.chatBox.style.display='none';document.getElementById('chatInputArea').style.display='none';btn.textContent='💬 AI';btn.style.background='#10b981';if(isListening){try{recognition.stop();}catch(e){}dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}}
}

function sendTextMessage(){
  const text=dom.chatInput.value.trim();if(!text)return;dom.chatInput.value='';processUserInput(text);
}
dom.chatInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendTextMessage();}});

function fillExample(){
  const examples = [
    "我今天很累，但是还要工作。",
    "How to say '我饿了' naturally?",
    "I want to improve my listening. Any tips?",
    "What's the difference between 'listen' and 'hear'?",
    "Can you correct this sentence: 'I am go to school yesterday'?",
    "Tell me a joke in English."
  ];
  const randomExample = examples[Math.floor(Math.random() * examples.length)];
  dom.chatInput.value = randomExample;
  dom.chatInput.focus();
}

const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;
function toggleMic(){
  if(isListening){recognition.stop();dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;return;}
  if(!chatMode)toggleChat();
  try{recognition.start();dom.micBtn.textContent='⏺ Recording...';dom.micBtn.classList.add('listening');dom.status.textContent='🎤 请说话...';dom.status.className='status speaking';isListening=true;}catch(e){showToast('❌ 麦克风访问被拒绝。');dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}
}
recognition.onresult=function(event){
  let finalText='';
  for(let i=event.resultIndex;i<event.results.length;i++){if(event.results[i].isFinal){finalText=event.results[i][0].transcript;break;}}
  if(finalText){dom.status.textContent='✅ 识别: '+finalText;dom.status.className='status done';processUserInput(finalText);recognition.stop();dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}
};
recognition.onerror=function(event){dom.status.textContent='⚠️ 识别错误: '+event.error;dom.status.className='status error';dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;showToast('语音识别失败，请尝试输入。');};
recognition.onend=function(){if(isListening){dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}};

function generateCnCode(){const amount=parseInt(document.getElementById('levelSelect').value);const random=Math.random().toString(36).substring(2,6).toUpperCase();const code='CN-'+amount+'-'+random;document.getElementById('generatedCode').textContent=code;const codes=JSON.parse(localStorage.getItem('cn_valid_codes'))||{};codes[code]=amount;localStorage.setItem('cn_valid_codes',JSON.stringify(codes));showToast('✅ 解锁码已生成 ('+amount+' 句)');}

document.addEventListener("keydown",function(e){
  if(document.activeElement===dom.searchInput||document.activeElement===dom.chatInput)return;
  if(e.key==="ArrowLeft"){e.preventDefault();prevChunk();}
  if(e.key==="ArrowRight"){e.preventDefault();nextChunk();}
  if(e.key===" "){e.preventDefault();togglePlayPause();}
  if(e.key==="r"||e.key==="R"){e.preventDefault();toggleRepeat();}
});
