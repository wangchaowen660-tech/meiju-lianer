<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen & Speak · 对话版</title>
<style>
/* ===== 全局变量与主题 ===== */
:root {
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text: #1e293b;
  --text-light: #475569;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --input-bg: #ffffff;
  --shadow: 0 2px 8px rgba(0,0,0,0.04);
  --chunk-bg: #eef2f6;
  --chunk-hover: #dce2ea;
  --primary: #e94560;
  --primary-hover: #c73a54;
  --secondary: #8b5cf6;
  --hd-color: #22c55e;
  --mode-bg: #e2e8f0;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --text: #e2e8f0;
  --text-light: #cbd5e1;
  --text-muted: #94a3b8;
  --border: #334155;
  --input-bg: #1e293b;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --chunk-bg: #2d3748;
  --chunk-hover: #4a5568;
  --primary: #f87171;
  --primary-hover: #ef4444;
  --secondary: #a78bfa;
  --hd-color: #34d399;
  --mode-bg: #334155;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:12px 10px 28px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);min-height:100vh;transition:background .2s;}
.container{max-width:500px;width:100%;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px;}
.header-left{display:flex;align-items:center;gap:8px;}
.header-left h1{margin:0;font-size:24px;font-weight:700;color:var(--text);}
.header-left p{margin:0;color:var(--text-muted);font-size:13px;background:var(--chunk-bg);padding:2px 12px;border-radius:30px;}
.header-right{display:flex;align-items:center;gap:6px;}
.theme-btn{background:transparent;border:0;font-size:22px;cursor:pointer;padding:0 4px;color:var(--text);}
.fav-count{cursor:pointer;background:var(--primary);color:#fff;padding:0 10px;border-radius:20px;font-size:13px;font-weight:600;line-height:24px;display:flex;align-items:center;gap:4px;border:0;transition:background .2s;}
.fav-count:hover{background:var(--primary-hover);}
.mode-selector{background:var(--card-bg);border-radius:12px;padding:4px 8px;margin-bottom:8px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);border:1px solid var(--border);}
.mode-selector label{font-weight:600;font-size:13px;color:var(--text);}
.mode-selector .mode-btn{flex:1;padding:4px 0;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--mode-bg);color:var(--text);transition:all .2s;}
.mode-selector .mode-btn.active{background:var(--primary);color:#fff;}
.pattern-selector{background:var(--card-bg);border-radius:12px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;box-shadow:var(--shadow);border:1px solid var(--border);}
.pattern-selector label{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;}
.pattern-selector select{flex:1;min-width:100px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none;cursor:pointer;}
.pattern-selector .badge{background:var(--primary);color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.custom-chunk{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.custom-chunk input{flex:1;min-width:60px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--input-bg);color:var(--text);}
.custom-chunk button{padding:3px 10px;background:var(--secondary);color:#fff;border:0;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;}
.custom-chunk button:hover{opacity:.85;}
.search-wrapper{display:flex;gap:4px;margin-bottom:8px;}
.search-wrapper .input-group{flex:1;display:flex;align-items:center;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:0 4px;height:34px;}
.search-wrapper .input-group:focus-within{border-color:var(--primary);}
.search-wrapper .input-group input{flex:1;border:0;outline:none;font-size:13px;padding:0 4px;background:transparent;color:var(--text);height:100%;}
.search-wrapper .input-group button{background:transparent;border:0;font-size:16px;cursor:pointer;padding:0 6px;color:var(--text-muted);display:flex;align-items:center;height:100%;}
.search-wrapper .input-group button:hover{color:var(--text);}
.results{margin-bottom:8px;}
.result{background:var(--card-bg);padding:8px 12px;margin-bottom:4px;border-radius:10px;cursor:pointer;border:1px solid var(--border);color:var(--text);}
.result-en{font-weight:600;font-size:15px;}
.result-cn{margin-top:2px;color:var(--text-light);font-size:13px;}
.no-result{padding:12px;text-align:center;color:var(--text-muted);background:var(--card-bg);border-radius:10px;font-size:14px;}
.card{background:var(--card-bg);border-radius:16px;padding:16px 12px 12px;box-shadow:var(--shadow);text-align:center;position:relative;border:1px solid var(--border);}
.avatar-wrap{position:absolute;top:8px;right:8px;width:64px;height:64px;border-radius:50%;border:2px solid var(--border);overflow:hidden;background:var(--chunk-bg);}
#avatarCanvas{width:100%;height:100%;display:block;}
.scene{color:var(--text-muted);font-size:12px;font-weight:500;padding-right:64px;text-align:left;}
.progress{color:var(--text-muted);font-size:11px;margin-top:1px;text-align:left;}
.pattern-display{background:var(--chunk-bg);padding:4px 12px;border-radius:8px;margin:8px 0 2px;display:inline-block;}
.pattern-display .label{font-size:10px;color:var(--text-muted);}
.pattern-display .text{font-size:18px;font-weight:700;color:var(--text);}
.dialog-area{margin:8px 0;}
.dialog-item{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:6px;border-left:3px solid var(--primary);text-align:left;}
.dialog-item .q{font-weight:600;font-size:16px;color:var(--text);}
.dialog-item .a{font-weight:400;font-size:16px;color:var(--text-light);margin-top:2px;}
.dialog-item .cn{font-size:14px;color:var(--text-muted);margin-top:2px;}
.dialog-controls{display:flex;gap:8px;justify-content:center;margin-top:4px;}
.dialog-controls button{background:var(--chunk-bg);border:0;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text);}
.dialog-controls button:hover{background:var(--chunk-hover);}
.flow-arrow{color:var(--text-muted);font-size:14px;margin:2px 0;}
.english{min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px 4px;font-size:22px;font-weight:700;line-height:1.3;color:var(--text);background:var(--bg);border-radius:8px;margin:4px 0;position:relative;}
.english .fav-btn{background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--text-muted);padding:0 4px;transition:color .2s;}
.english .fav-btn.active{color:#f59e0b;}
.english .copy-btn{background:transparent;border:0;font-size:18px;cursor:pointer;color:var(--text-muted);padding:0 4px;transition:color .2s;}
.english .copy-btn:hover{color:var(--text);}
.english .action-buttons{display:flex;gap:2px;margin-left:4px;}
.chinese{min-height:28px;font-size:16px;color:var(--text-light);padding:4px 8px;background:var(--bg);border-radius:8px;}
.sentence-hint{font-size:11px;color:var(--text-muted);margin-top:2px;}
.sentence-hint .highlight{color:var(--primary);font-weight:600;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
.ctrl-btn{background:var(--chunk-bg);border:0;padding:0;cursor:pointer;font-size:22px;color:var(--text);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;touch-action:manipulation;transition:background .15s;}
.ctrl-btn:active{transform:scale(.90);}
.ctrl-btn.play-btn{width:52px;height:52px;font-size:28px;background:var(--primary);color:#fff;}
.ctrl-btn.play-btn:hover{background:var(--primary-hover);}
.ctrl-btn.cn-btn{background:#f59e0b;color:#fff;width:38px;height:38px;font-size:18px;}
.speed-control{display:flex;align-items:center;gap:4px;}
.speed-btn{background:var(--chunk-bg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;}
.speed-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.extra-buttons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;justify-content:center;}
.extra-buttons button{flex:0 1 auto;padding:4px 10px;border:0;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:var(--chunk-bg);color:var(--text);transition:background .15s;}
.extra-buttons button.active{background:#ef4444;color:#fff;}
.extra-buttons .ai-toggle{background:#10b981;color:#fff;}
.extra-buttons .ai-toggle:hover{background:#059669;}
.extra-buttons .mic-toggle{background:#f59e0b;color:#fff;}
.extra-buttons .mic-toggle:hover{background:#d97706;}
.extra-buttons .mic-toggle.listening{background:#ef4444;}
.extra-buttons .mic-toggle:disabled{opacity:0.5;cursor:not-allowed;}
.extra-buttons .reset-audio-btn{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn:hover{background:#dc2626;}
.extra-buttons .chunk-toggle-btn{background:var(--secondary);color:#fff;}
.extra-buttons .chunk-toggle-btn:hover{background:#7c3aed;}
.extra-buttons .hd-toggle{background:#8b5cf6;color:#fff;}
.extra-buttons .hd-toggle:hover{background:#7c3aed;}
.status{min-height:20px;margin-top:4px;color:var(--text-muted);font-size:12px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}
.status.paused{color:#f59e0b;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:6px 16px;border-radius:40px;opacity:0;pointer-events:none;transition:.3s;z-index:999;font-size:13px;font-weight:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.api-settings{background:var(--card-bg);border-radius:10px;padding:4px 10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--border);}
.api-settings input{flex:2;min-width:60px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--input-bg);color:var(--text);}
.api-settings input#apiBaseInput{flex:1.5;}
.api-settings button{padding:3px 10px;background:var(--text);color:var(--bg);border:0;border-radius:6px;font-weight:500;cursor:pointer;font-size:12px;}
.api-settings button.save-btn{background:#22c55e;color:#fff;}
.api-status{font-size:11px;color:var(--text-muted);margin-left:2px;}
.chunk-area-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.3s ease, opacity 0.2s ease;margin:0;}
.chunk-area-wrap.open{max-height:400px;opacity:1;margin-top:8px;}
.chunk-area{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px;background:var(--bg);border-radius:10px;border:1px solid var(--border);max-height:200px;overflow-y:auto;}
.chunk-item{cursor:pointer;padding:3px 10px;background:var(--chunk-bg);border-radius:14px;font-size:13px;color:var(--text);border:1px solid transparent;transition:all 0.15s;user-select:none;}
.chunk-item:hover{background:var(--chunk-hover);}
.chunk-item.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.chunk-item.custom{background:var(--secondary);color:#fff;}
.chunk-item.custom:hover{background:#7c3aed;}
.chat-box{background:var(--bg);border-radius:12px;padding:10px;margin-top:8px;max-height:280px;overflow-y:auto;text-align:left;border:1px solid var(--border);display:none;}
.chat-msg{margin:4px 0;padding:5px 10px;border-radius:10px;max-width:90%;word-break:break-word;font-size:14px;color:var(--text);}
.chat-msg.user{background:#dbeafe;margin-left:auto;}
.chat-msg.ai{background:var(--chunk-bg);margin-right:auto;}
.chat-msg .time{font-size:10px;color:var(--text-muted);margin-top:2px;}
.chat-input-area{display:flex;gap:4px;margin-top:4px;display:none;}
.chat-input-area input{flex:1;padding:6px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);outline:none;}
.chat-input-area button{padding:4px 12px;background:#10b981;color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
.chat-input-area .example-btn{background:var(--secondary);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;padding:4px 10px;}
.chat-input-area .example-btn:hover{background:#7c3aed;}
.admin-panel{display:none;margin-top:12px;padding:10px;background:var(--card-bg);border-radius:12px;border:1px solid var(--border);text-align:left;}
.admin-panel input{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:13px;background:var(--input-bg);color:var(--text);}
.admin-panel .code-box{background:var(--bg);padding:6px;border-radius:6px;font-family:monospace;font-size:14px;margin:6px 0;word-break:break-all;color:var(--text);}
.admin-panel button{background:var(--text);color:var(--bg);border:0;padding:6px;border-radius:6px;cursor:pointer;font-size:13px;}
@media(max-width:480px){.english{font-size:18px;}.chunk-item{font-size:12px;padding:2px 8px;}.ctrl-btn{width:34px;height:34px;font-size:18px;}.ctrl-btn.play-btn{width:46px;height:46px;font-size:24px;}.ctrl-btn.cn-btn{width:34px;height:34px;font-size:16px;}.pattern-display .text{font-size:16px;}.avatar-wrap{width:52px;height:52px;top:4px;right:4px;}.pattern-selector select{font-size:12px;padding:2px 6px;min-width:70px;}.extra-buttons button{font-size:11px;padding:3px 8px;}.header-left h1{font-size:20px;}.header-left p{font-size:11px;}.speed-btn{font-size:10px;padding:1px 5px;}.english .copy-btn{font-size:16px;}.dialog-item .q,.dialog-item .a{font-size:14px;}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header">
  <div class="header-left">
    <h1>🧩 Listen & Speak</h1>
    <p>对话版</p>
  </div>
  <div class="header-right">
    <button class="theme-btn" id="themeToggle" title="切换主题">🌙</button>
    <button class="fav-count" id="favCountBtn" title="查看收藏">⭐ 0</button>
  </div>
</div>

<div class="api-settings">
  <input id="apiKeyInput" type="password" placeholder="API Key" style="flex:2;">
  <input id="apiBaseInput" type="url" placeholder="API Base URL" value="https://api.deepseek.com/v1" style="flex:1.5;">
  <button class="save-btn" onclick="saveApiConfig()">💾</button>
  <span class="api-status" id="apiStatus">未设置</span>
</div>

<!-- 模式切换 -->
<div class="mode-selector">
  <label>📌 模式</label>
  <button class="mode-btn active" data-mode="single" onclick="setMode('single')">单句</button>
  <button class="mode-btn" data-mode="dialog" onclick="setMode('dialog')">对话</button>
</div>

<!-- 单句模式：母句选择器 + 词块 -->
<div id="singleModeArea">
  <div class="pattern-selector">
    <label>📌 母句</label>
    <select id="patternSelect"></select>
    <span class="badge" id="chunkCount">0</span>
  </div>
  <div class="custom-chunk">
    <input id="customChunkEn" placeholder="英文词块 (e.g. run fast)" style="flex:1;">
    <input id="customChunkCn" placeholder="中文释义 (e.g. 快跑)" style="flex:0.8;">
    <button onclick="addCustomChunk()">➕</button>
  </div>
</div>

<!-- 对话模式：场景选择器 + 问答列表 -->
<div id="dialogModeArea" style="display:none;">
  <div class="pattern-selector">
    <label>📌 场景</label>
    <select id="dialogSceneSelect"></select>
    <span class="badge" id="dialogCount">0 组</span>
  </div>
</div>

<!-- 搜索 -->
<div class="search-wrapper">
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="搜索句子" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<div class="card">
  <div class="avatar-wrap"><canvas id="avatarCanvas" width="220" height="220"></canvas></div>
  <div class="scene" id="scene">日常表达</div>
  <div class="progress" id="progress">总句数: 2500+</div>

  <!-- 单句模式显示区域 -->
  <div id="singleDisplay">
    <div class="pattern-display">
      <div class="label">母句</div>
      <div class="text" id="patternDisplay">I want to...</div>
    </div>
    <div class="flow-arrow">▼ 当前整句</div>
    <div class="english" id="englishContainer">
      <span id="english">I want to eat.</span>
      <span class="action-buttons">
        <button class="copy-btn" id="copyBtn" onclick="copySentence()" title="复制句子">📋</button>
        <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆</button>
      </span>
    </div>
    <div class="chinese" id="chinese">我想吃饭。</div>
    <div class="sentence-hint" id="sentenceHint">💡 点击 ⬅️ ➡️ 切换词块</div>
  </div>

  <!-- 对话模式显示区域 -->
  <div id="dialogDisplay" style="display:none;">
    <div class="dialog-area" id="dialogArea"></div>
    <div class="dialog-controls">
      <button onclick="playDialog()">▶ 播放完整对话</button>
      <button onclick="playDialogQ()">🔊 问</button>
      <button onclick="playDialogA()">🔊 答</button>
      <button onclick="prevDialog()">⏮ 上一组</button>
      <button onclick="nextDialog()">⏭ 下一组</button>
    </div>
  </div>

  <div class="player-controls">
    <button class="ctrl-btn" id="prevBtn" onclick="prevChunk()">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
    <button class="ctrl-btn" id="nextBtn" onclick="nextChunk()">⏭</button>
    <div class="speed-control">
      <button class="speed-btn" data-speed="0.7" onclick="setSpeed(0.7)">0.7×</button>
      <button class="speed-btn active" data-speed="1.0" onclick="setSpeed(1.0)">1.0×</button>
      <button class="speed-btn" data-speed="1.3" onclick="setSpeed(1.3)">1.3×</button>
    </div>
  </div>

  <div class="extra-buttons">
    <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
    <button onclick="playPatternOnly()" id="patternBtn">🧩 母句</button>
    <button onclick="randomChunk()" id="randomBtn">🎲 随机</button>
    <button id="micBtn" class="mic-toggle" onclick="toggleMic()">🎤 Voice</button>
    <button id="aiToggle" class="ai-toggle" onclick="toggleChat()">💬 AI</button>
    <button class="reset-audio-btn" onclick="resetAudio()">🔊 修复</button>
    <button class="chunk-toggle-btn" id="chunkToggleBtn" onclick="toggleChunkList()">📋 词块</button>
    <button class="hd-toggle" id="hdToggleBtn" onclick="toggleHD()">✨ HD</button>
  </div>

  <div class="chunk-area-wrap" id="chunkAreaWrap">
    <div class="chunk-area" id="chunkArea"></div>
  </div>

  <div id="chatBox" class="chat-box"></div>
  <div id="chatInputArea" class="chat-input-area">
    <input id="chatInput" type="text" placeholder="输入消息" autocomplete="off">
    <button onclick="sendTextMessage()">Send</button>
    <button class="example-btn" onclick="fillExample()">💡 示例</button>
  </div>
  <div id="status" class="status">Ready</div>
</div>
<div style="text-align:center;margin-top:6px;font-size:11px;color:var(--text-muted);">← 上一 · 下一 →</div>
</div>

<script>
// ========================================================================
// 1. 核心数据：单句（母句 + 词块池）
// ========================================================================
const chunkPool = [
  { en: "eat", cn: "吃饭" }, { en: "drink", cn: "喝" }, { en: "sleep", cn: "睡觉" },
  { en: "work", cn: "工作" }, { en: "rest", cn: "休息" }, { en: "cook", cn: "做饭" },
  { en: "clean", cn: "打扫" }, { en: "study", cn: "学习" }, { en: "read", cn: "阅读" },
  { en: "write", cn: "写作" }, { en: "listen", cn: "听" }, { en: "speak", cn: "说话" },
  { en: "walk", cn: "走路" }, { en: "run", cn: "跑步" }, { en: "swim", cn: "游泳" },
  { en: "drive", cn: "开车" }, { en: "fly", cn: "飞行" }, { en: "sing", cn: "唱歌" },
  { en: "dance", cn: "跳舞" }, { en: "travel", cn: "旅行" }, { en: "shop", cn: "购物" },
  { en: "exercise", cn: "锻炼" }, { en: "relax", cn: "放松" }, { en: "laugh", cn: "笑" },

// 自定义词块存储
let customChunks = JSON.parse(localStorage.getItem('customChunks')) || {};

function getChunksForPattern(patternId) {
  const p = patternList[patternId];
  const end = Math.min(p.start + p.count, chunkPool.length);
  const base = [];
  for (let i = p.start; i < end; i++) {
    base.push({ index: i, ...chunkPool[i], custom: false });
  }
  const custom = (customChunks[patternId] || []).map((c, idx) => ({ ...c, custom: true, index: 1000 + idx }));
  return [...base, ...custom];
}

function buildAllLessons() {
  const result = [];
  patternList.forEach((p) => {
    const end = Math.min(p.start + p.count, chunkPool.length);
    for (let i = p.start; i < end; i++) {
      const chunk = chunkPool[i];
      const fullEn = p.pattern.replace(/\.{3}/g, chunk.en);
      const fullCn = p.cnPrefix + chunk.cn;
      result.push({
        id: result.length + 1,
        pattern: p.pattern,
        en: fullEn,
        cn: fullCn,
        chunkEn: chunk.en,
        chunkCn: chunk.cn,
        patternId: p.id,
        chunkIndex: i,
        custom: false
      });
    }
    const customs = customChunks[p.id] || [];
    customs.forEach((c) => {
      const fullEn = p.pattern.replace(/\.{3}/g, c.en);
      const fullCn = p.cnPrefix + c.cn;
      result.push({
        id: result.length + 1,
        pattern: p.pattern,
        en: fullEn,
        cn: fullCn,
        chunkEn: c.en,
        chunkCn: c.cn,
        patternId: p.id,
        chunkIndex: 1000 + result.length,
        custom: true
      });
    });
  });
  return result;
}
let lessons = buildAllLessons();
