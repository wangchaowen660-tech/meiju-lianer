<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>🎧 每句练耳 · Chaowen AI</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f5f7fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    color: #18202a;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 40px;
}

.header {
    text-align: center;
    padding: 15px 0 20px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
}

.brand {
    margin-top: 5px;
    color: #53606e;
    font-size: 14px;
}

.progress-box {
    margin-top: 10px;
}

.progress-text {
    font-size: 14px;
    color: #687482;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 7px;
    background: #dfe4ea;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #18202a;
    transition: width 0.3s ease;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 28px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    text-align: center;
    margin-top: 20px;
}

.category {
    display: inline-block;
    background: #eef1f5;
    color: #53606e;
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 13px;
    margin-bottom: 25px;
}

.listen-icon {
    font-size: 58px;
    margin: 5px 0 15px;
}

.instruction {
    font-size: 15px;
    color: #697583;
    line-height: 1.6;
    min-height: 48px;
}

.sentence {
    display: none;
    font-size: 27px;
    line-height: 1.45;
    font-weight: 700;
    margin: 25px 5px 15px;
}

.translation {
    display: none;
    font-size: 17px;
    color: #687482;
    line-height: 1.6;
    margin-top: 12px;
}

button {
    border: none;
    border-radius: 15px;
    font-size: 17px;
    font-weight: 600;
    padding: 15px 18px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.2s ease;
}

button:active {
    transform: scale(0.97);
}

.main-btn {
    width: 100%;
    background: #18202a;
    color: white;
    margin-top: 18px;
}

.secondary-btn {
    width: 100%;
    background: #eef1f5;
    color: #18202a;
    margin-top: 12px;
}

.controls {
    margin-top: 20px;
}

.row {
    display: flex;
    gap: 10px;
}

.row button {
    flex: 1;
}

.speed-title {
    margin-top: 25px;
    color: #697583;
    font-size: 14px;
}

.speed-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.speed-btn {
    flex: 1;
    background: #eef1f5;
    color: #18202a;
    padding: 11px 5px;
    font-size: 14px;
}

.speed-btn.active {
    background: #18202a;
    color: white;
}

.tip {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: #f1f4f7;
    color: #687482;
    font-size: 13px;
    line-height: 1.7;
    text-align: left;
}

.status {
    margin-top: 15px;
    min-height: 22px;
    color: #687482;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #9aa3ad;
    font-size: 12px;
    margin-top: 30px;
}

@media (max-width: 380px) {
    .sentence {
        font-size: 23px;
    }

    button {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🎧 每句练耳</div>
        <div class="brand">Chaowen AI · 真实英语听力训练</div>

        <div class="progress-box">
            <div class="progress-text" id="progressText">
                第 1 / 30 句
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>


    <div class="card">

        <div class="category" id="category">
            Daily
        </div>

        <div class="listen-icon" id="listenIcon">
            🎧
        </div>

        <div class="instruction" id="instruction">
            先不要看英文。<br>
            戴上耳朵，听完整句话。
        </div>

        <div class="sentence" id="sentence"></div>

        <div class="translation" id="translation"></div>


        <button class="main-btn" id="listenBtn">
            🎧 听句子
        </button>

        <button class="secondary-btn" id="showEnglishBtn">
            👀 显示英文
        </button>

        <button class="secondary-btn" id="showChineseBtn">
            🇨🇳 显示中文意思
        </button>


        <div class="controls">

            <div class="row">

                <button
                    class="secondary-btn"
                    id="repeatBtn">
                    🔁 再听一次
                </button>

                <button
                    class="secondary-btn"
                    id="stopBtn">
                    ⏹️ 停止
                </button>

            </div>


            <div class="speed-title">
                语速
            </div>

            <div class="speed-buttons">

                <button
                    class="speed-btn active"
                    data-speed="0.7">
                    0.7×
                </button>

                <button
                    class="speed-btn"
                    data-speed="0.85">
                    0.85×
                </button>

                <button
                    class="speed-btn"
                    data-speed="1">
                    1.0×
                </button>

            </div>


            <button
                class="main-btn"
                id="nextBtn">
                下一句 →
            </button>

        </div>


        <div class="status" id="status"></div>


        <div class="tip">
            💡 <strong>训练方法：</strong><br>
            第一次：不看英文，只听。<br>
            第二次：再听一遍，尝试抓住整体意思。<br>
            第三次：显示英文，确认自己听到了什么。<br>
            最后：跟着声音说一遍。
        </div>

    </div>


    <div class="footer">
        Chaowen AI · 每一句都是一次听力训练
    </div>

</div>


<script>

/* =========================================================
   1. 课程数据
   ========================================================= */

const lessons = [

    {
        category: "Daily",
        en: "Good morning.",
        zh: "早上好。"
    },

    {
        category: "Daily",
        en: "How are you?",
        zh: "你好吗？"
    },

    {
        category: "Daily",
        en: "I'm fine.",
        zh: "我很好。"
    },

    {
        category: "Daily",
        en: "I want to eat.",
        zh: "我想吃东西。"
    },

    {
        category: "Daily",
        en: "I want to drink water.",
        zh: "我想喝水。"
    },

    {
        category: "Daily",
        en: "I want to go home.",
        zh: "我想回家。"
    },

    {
        category: "Daily",
        en: "I'm going to work.",
        zh: "我要去上班。"
    },

    {
        category: "Daily",
        en: "I need some water.",
        zh: "我需要一些水。"
    },

    {
        category: "Daily",
        en: "Please wait for me.",
        zh: "请等我。"
    },

    {
        category: "Daily",
        en: "Come with me.",
        zh: "跟我来。"
    },

    {
        category: "Daily",
        en: "Follow me.",
        zh: "跟我来。"
    },

    {
        category: "Daily",
        en: "Let's go home.",
        zh: "我们回家吧。"
    },

    {
        category: "Airport",
        en: "May I see your passport?",
        zh: "我可以看看你的护照吗？"
    },

    {
        category: "Airport",
        en: "Sure. Here is my passport.",
        zh: "当然。这是我的护照。"
    },

    {
        category: "Airport",
        en: "Where are you going?",
        zh: "你要去哪里？"
    },

    {
        category: "Airport",
        en: "I'm going to China.",
        zh: "我要去中国。"
    },

    {
        category: "Airport",
        en: "Do you have any bags?",
        zh: "你有行李吗？"
    },

    {
        category: "Airport",
        en: "Yes, I have one bag.",
        zh: "是的，我有一个包。"
    },

    {
        category: "Airport",
        en: "Do you want a window seat?",
        zh: "你想要靠窗的座位吗？"
    },

    {
        category: "Airport",
        en: "Yes, please.",
        zh: "好的，谢谢。"
    },

    {
        category: "Restaurant",
        en: "I want some food.",
        zh: "我想要一些食物。"
    },

    {
        category: "Restaurant",
        en: "Can I have some water?",
        zh: "可以给我一些水吗？"
    },

    {
        category: "Restaurant",
        en: "I would like some rice.",
        zh: "我想要一些米饭。"
    },

    {
        category: "Shopping",
        en: "How much is it?",
        zh: "多少钱？"
    },

    {
        category: "Shopping",
        en: "I want to buy it.",
        zh: "我想买它。"
    },

    {
        category: "Shopping",
        en: "Can you help me?",
        zh: "你可以帮我吗？"
    },

    {
        category: "Transport",
        en: "Where are you going?",
        zh: "你要去哪里？"
    },

    {
        category: "Transport",
        en: "I'm going to work.",
        zh: "我要去上班。"
    },

    {
        category: "Basic",
        en: "The cat sat on the mat.",
        zh: "猫坐在垫子上。"
    },

    {
        category: "Basic",
        en: "I want to learn English.",
        zh: "我想学英语。"
    }

];


/* =========================================================
   2. 当前状态
   ========================================================= */

let currentIndex = 0;

let currentSpeed = 0.7;

let currentVoice = null;

let isSpeaking = false;


/* =========================================================
   3. 获取页面元素
   ========================================================= */

const category =
    document.getElementById("category");

const sentence =
    document.getElementById("sentence");

const translation =
    document.getElementById("translation");

const instruction =
    document.getElementById("instruction");

const progressText =
    document.getElementById("progressText");

const progressBar =
    document.getElementById("progressBar");

const listenBtn =
    document.getElementById("listenBtn");

const repeatBtn =
    document.getElementById("repeatBtn");

const stopBtn =
    document.getElementById("stopBtn");

const nextBtn =
    document.getElementById("nextBtn");

const showEnglishBtn =
    document.getElementById("showEnglishBtn");

const showChineseBtn =
    document.getElementById("showChineseBtn");

const status =
    document.getElementById("status");

const listenIcon =
    document.getElementById("listenIcon");


/* =========================================================
   4. 找英语语音
   ========================================================= */

function loadVoices() {

    const voices =
        window.speechSynthesis.getVoices();

    if (!voices || voices.length === 0) {
        return;
    }

    /*
       优先寻找美式英语
    */

    currentVoice =
        voices.find(v =>
            v.lang &&
            v.lang.toLowerCase() === "en-us"
        );

    /*
       找不到美式，就找任何英语
    */

    if (!currentVoice) {

        currentVoice =
            voices.find(v =>
                v.lang &&
                v.lang.toLowerCase().startsWith("en")
            );

    }
}


/* =========================================================
   5. 页面初始化
   ========================================================= */

function init() {

    loadVoices();

    showLesson();

    status.textContent =
        "准备好了。先听，不要看英文。";

}


/* =========================================================
   6. 显示当前句子
   ========================================================= */

function showLesson() {

    const lesson =
        lessons[currentIndex];

    category.textContent =
        lesson.category;

    sentence.textContent =
        lesson.en;

    translation.textContent =
        lesson.zh;

    /*
       每换一句，重新隐藏英文和中文
    */

    sentence.style.display = "none";

    translation.style.display = "none";

    instruction.innerHTML =
        "先不要看英文。<br>" +
        "戴上耳朵，听完整句话。";

    listenIcon.textContent = "🎧";

    updateProgress();

    showEnglishBtn.textContent =
        "👀 显示英文";

    showChineseBtn.textContent =
        "🇨🇳 显示中文意思";

}


/* =========================================================
   7. 更新进度
   ========================================================= */

function updateProgress() {

    const total =
        lessons.length;

    const number =
        currentIndex + 1;

    progressText.textContent =
        `第 ${number} / ${total} 句`;

    const percent =
        (number / total) * 100;

    progressBar.style.width =
        percent + "%";

}


/* =========================================================
   8. 播放句子
   ========================================================= */

function speakCurrent() {

    if (
        !("speechSynthesis" in window)
    ) {

        status.textContent =
            "你的设备暂不支持语音播放。";

        return;

    }

    /*
       先彻底停止上一段。
       解决连续播放时声音重叠、
       第二句异常等问题。
    */

    window.speechSynthesis.cancel();

    const lesson =
        lessons[currentIndex];

    const utterance =
        new SpeechSynthesisUtterance(
            lesson.en
        );

    utterance.lang = "en-US";

    utterance.rate =
        currentSpeed;

    utterance.pitch = 1;

    utterance.volume = 1;

    if (currentVoice) {
        utterance.voice =
            currentVoice;
    }

    utterance.onstart = function() {

        isSpeaking = true;

        listenIcon.textContent =
            "🔊";

        status.textContent =
            "正在播放……";

        listenBtn.textContent =
            "🔊 播放中";

    };


    utterance.onend = function() {

        isSpeaking = false;

        listenIcon.textContent =
            "🎧";

        status.textContent =
            "播放完成。现在试着自己说一遍。";

        listenBtn.textContent =
            "🎧 再听一次";

    };


    utterance.onerror = function(event) {

        isSpeaking = false;

        listenIcon.textContent =
            "⚠️";

        status.textContent =
            "语音播放出现问题，请再点一次。";

        listenBtn.textContent =
            "🎧 听句子";

    };


    /*
       iPhone / iPad Safari 某些情况下
       需要延迟一点再 speak，
       可以减少 cancel 后立即播放的异常。
    */

    setTimeout(function() {

        window.speechSynthesis
            .speak(utterance);

    }, 80);

}


/* =========================================================
   9. 停止播放
   ========================================================= */

function stopSpeaking() {

    window.speechSynthesis.cancel();

    isSpeaking = false;

    listenIcon.textContent =
        "🎧";

    listenBtn.textContent =
        "🎧 听句子";

    status.textContent =
        "已停止。";

}


/* =========================================================
   10. 显示英文
   ========================================================= */

function showEnglish() {

    const isHidden =
        sentence.style.display === "none";

    if (isHidden) {

        sentence.style.display =
            "block";

        instruction.innerHTML =
            "现在看看你刚才听到的声音。<br>" +
            "不要逐词翻译，先整体看。";

        showEnglishBtn.textContent =
            "🙈 隐藏英文";

    } else {

        sentence.style.display =
            "none";

        instruction.innerHTML =
            "先不要看英文。<br>" +
            "再听一次。";

        showEnglishBtn.textContent =
            "👀 显示英文";

    }

}


/* =========================================================
   11. 显示中文
   ========================================================= */

function showChinese() {

    const isHidden =
        translation.style.display === "none";

    if (isHidden) {

        translation.style.display =
            "block";

        showChineseBtn.textContent =
            "🙈 隐藏中文";

    } else {

        translation.style.display =
            "none";

        showChineseBtn.textContent =
            "🇨🇳 显示中文意思";

    }

}


/* =========================================================
   12. 下一句
   ========================================================= */

function nextLesson() {

    stopSpeaking();

    currentIndex++;

    if (
        currentIndex >= lessons.length
    ) {

        currentIndex = 0;

        status.textContent =
            "🎉 第一轮完成！重新开始。";

    } else {

        status.textContent =
            "下一句，先听，不要看英文。";

    }

    showLesson();

}


/* =========================================================
   13. 语速选择
   ========================================================= */

const speedButtons =
    document.querySelectorAll(
        ".speed-btn"
    );

speedButtons.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            speedButtons.forEach(btn =>
                btn.classList.remove(
                    "active"
                )
            );

            this.classList.add("active");

            currentSpeed =
                parseFloat(
                    this.dataset.speed
                );

            status.textContent =
                `语速已调整为 ${currentSpeed}×`;

        }
    );

});


/* =========================================================
   14. 按钮事件
   ========================================================= */

listenBtn.addEventListener(
    "click",
    speakCurrent
);

repeatBtn.addEventListener(
    "click",
    speakCurrent
);

stopBtn.addEventListener(
    "click",
    stopSpeaking
);

nextBtn.addEventListener(
    "click",
    nextLesson
);

showEnglishBtn.addEventListener(
    "click",
    showEnglish
);

showChineseBtn.addEventListener(
    "click",
    showChinese
);


/* =========================================================
   15. 语音加载
   ========================================================= */

if (
    "speechSynthesis" in window
) {

    window.speechSynthesis
        .addEventListener(
            "voiceschanged",
            loadVoices
        );

}


/* =========================================================
   16. 启动
   ========================================================= */

init();

</script>

</body>
</html>
