    <button class="listen" onclick="speakCurrent()">

  </div>

  </div>

</div>

<!-- 词块 -->
<div class="card">

  <div class="section-title">
    🧩 正确词块 · 点击听音
  </div>

  <div class="section-title">

<script>

/* =========================================================
   语音系统
========================================================= */

let speechToken = 0;
let speed = .85;

function stopSpeech(){

  speechToken++;

  try{
    window.speechSynthesis.cancel();
  }catch(e){}

}

function speak(text,rate=speed){

  if(!text) return;

  stopSpeech();

  const token = speechToken;

  setTimeout(()=>{

    if(token !== speechToken) return;

    const u = new SpeechSynthesisUtterance(text);

    u.lang = "en-US";
    u.rate = rate;
    u.pitch = 1;
    u.volume = 1;

    window.speechSynthesis.speak(u);

  },100);
}

function setSpeed(v,btn){

  speed = v;

  document
    .querySelectorAll(".speed button")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");
}

  const special = {

      ["the cat","这只猫"],

      ["a black cat","一只黑猫"],
      ["feed the cat","喂猫"],

      ["make a plan","制定计划"],
      ["make money","赚钱"],
      ["make a decision","做决定"],
      ["make a mistake","犯错误"]
    ],

    go:[
      ["go home","回家"],
      ["go to work","去上班"],
      ["go outside","出去"],
      ["go with me","跟我走"]
    ],

    learn:[
      ["learn English","学习英语"],
      ["learn to speak","学习说"],
      ["learn more","学习更多"],
      ["learn from you","向你学习"]
    ],

    work:[
      ["go to work","去上班"],
      ["at work","在工作"],
      ["work hard","努力工作"],
      ["work together","一起工作"]
    ],

    help:[
      ["help me","帮助我"],
      ["help you","帮助你"],
      ["help with work","帮忙工作"],
      ["can you help me?","你能帮我吗？"]
    ],

    water:[
      ["drink water","喝水"],
      ["some water","一些水"],
      ["cold water","冷水"],
      ["hot water","热水"]
    ],

    home:[
      ["go home","回家"],
      ["at home","在家"],
      ["my home","我的家"],
      ["stay home","待在家里"]
    ]

  };

  if(special[word]){
    return special[word];
  }

  const cn = detail(word)[0];

  if(pos.includes("verb") || pos.includes("动词")){

    return [
      [`${word} it`,`做/用它`],
      [`${word} this`,`做这个`],
      [`${word} with me`,`和我一起${word}`],
      [`I ${word}`,`我${cn}`]
    ];

  }

  return [
    [`the ${word}`,`这个${cn}`],
    [`my ${word}`,`我的${cn}`],
    [`a ${word}`,`一个${cn}`],
    [`this ${word}`,`这个${cn}`]
  ];

}

/* =========================================================
   声音块
========================================================= */

function getSoundBlocks(word,family){

  /*
    对最典型的词族进行声音块拆分。
    后续可以继续加入精确 phonics 数据。
  */

  const rimeFamilies = [
    "at","an","ap","am","ad","ag","ab","ax",
    "et","en","ed","eg",
    "it","in","ip","ig",
    "ot","op","og","ob",
    "ug","un","up","ub"
  ];

  for(const r of rimeFamilies){

    if(word.endsWith(r) && word.length > r.length){

      return [
        word.slice(0,word.length-r.length),
        r
      ];

    }

  }

  const digraphs = [
    "ch","sh","th","wh","ck","ng","nk",
    "bl","br","cl","cr","dr","fl","fr",
    "gl","gr","pl","pr","sk","sl","sm",
    "sn","sp","st","sw","tr","tw"
  ];

  for(const d of digraphs){

    if(word.startsWith(d) && word.length>d.length){

      return [
        d,
        word.slice(d.length)
      ];

    }

  }

  return [word];
}


/* =========================================================
   渲染词族
========================================================= */

function renderFamily(){

  const f = families[familyIndex];

  currentFamily = f;

  document.getElementById("familyName").textContent =
    `${f.family} 词族`;

  document.getElementById("familyMeta").textContent =
    `${f.words.length} 个示例词`;

  document.getElementById("familyType").textContent =
    f.type;

  const box = document.getElementById("familyWords");

  box.innerHTML = "";

  f.words.forEach((w,i)=>{

    const d = detail(w);

    const btn = document.createElement("button");

    btn.className =
      "word-btn " +
      (i===wordIndex ? "active":"");

    btn.innerHTML = `
      <div class="word-en">${w}</div>
      <div class="word-cn">${d[0]}</div>
    `;

    btn.onclick = ()=>{

      wordIndex=i;

      renderFamily();

      renderCurrent();

    };

    box.appendChild(btn);

  });

  document.getElementById("familyProgress").textContent =
    `第 ${familyIndex+1} / ${families.length} 组`;

}

function renderCurrent(){

  const f = families[familyIndex];

  const word = f.words[wordIndex];

  const d = detail(word);

  document.getElementById("currentWord").textContent =
    word;

  document.getElementById("currentCn").textContent =
    d[0];

  document.getElementById("currentPos").textContent =
    d[1];

  /* 声音块 */

  const sounds = getSoundBlocks(word,f);

  const box = document.getElementById("soundBlocks");

  box.innerHTML="";

  sounds.forEach((s,i)=>{

    if(i>0){

      const arrow=document.createElement("span");

      arrow.className="arrow";

      arrow.textContent="+";

      box.appendChild(arrow);

    }

    const btn=document.createElement("button");

    btn.className="sound";

    btn.textContent=s;

    btn.onclick=()=>speak(s);

    box.appendChild(btn);

  });


  /* 词块 */

  const chunks = makeChunks(word,d[1]);

  const chunkBox =
    document.getElementById("chunks");

  chunkBox.innerHTML="";

  chunks.forEach(x=>{

    const div=document.createElement("div");

    div.className="chunk";

    div.innerHTML=`
      <div class="en">${x[0]} 🔊</div>
      <div class="zh">${x[1]}</div>
    `;

    div.onclick=()=>speak(x[0]);

    chunkBox.appendChild(div);

  });


  /* 母句 */

  const sentences =
    makeSentences(word,d[1]);

  const motherBox =
    document.getElementById("motherSentences");

  motherBox.innerHTML="";

  sentences.forEach(x=>{

    const div=document.createElement("div");

    div.className="sentence";

    div.innerHTML=`
      <div class="en">${x[0]} 🔊</div>
      <div class="zh">${x[1]}</div>
    `;

    div.onclick=()=>speak(x[0]);

    motherBox.appendChild(div);

  });


  /* 完整句子 */

  const sentenceBox =
    document.getElementById("sentences");

  sentenceBox.innerHTML="";

  sentences.forEach(x=>{

    const div=document.createElement("div");

    div.className="sentence";

    div.innerHTML=`
      <div class="en">${x[0]}</div>
      <div class="zh">${x[1]}</div>
    `;

    div.onclick=()=>speak(x[0]);

    sentenceBox.appendChild(div);

  });


  document.getElementById("listenReveal")
    .style.display="none";

}


/* =========================================================
   当前词发音
========================================================= */

function speakCurrent(){

  const word =
    families[familyIndex].words[wordIndex];

  speak(word);

}


/* =========================================================
   当前句子
========================================================= */

function currentSentence(){

  const word =
    families[familyIndex].words[wordIndex];

  const d=detail(word);

  const list=makeSentences(word,d[1]);

  return list[0];

}

function speakCurrentSentence(){

  const s=currentSentence();

  speak(s[0]);

}

function listenFirst(){

  const s=currentSentence();

  speak(s[0]);

  setTimeout(()=>{

    document.getElementById("listenEnglish")
      .textContent=s[0];

    document.getElementById("listenChinese")
      .textContent=s[1];

    document.getElementById("listenReveal")
      .style.display="block";

  },Math.max(1300,s[0].length*70));

}


/* =========================================================
   词族上下
========================================================= */

function nextFamily(){

  stopSpeech();

  familyIndex++;

  if(familyIndex>=families.length){
    familyIndex=0;
  }

  wordIndex=0;

  renderFamily();
  renderCurrent();

}

function prevFamily(){

  stopSpeech();

  familyIndex--;

  if(familyIndex<0){
    familyIndex=families.length-1;
  }

  wordIndex=0;

  renderFamily();
  renderCurrent();

}


/* =========================================================
   单词上下
========================================================= */

function nextWord(){

  stopSpeech();

  wordIndex++;

  if(wordIndex >= families[familyIndex].words.length){

    familyIndex++;

    if(familyIndex>=families.length){
      familyIndex=0;
    }

    wordIndex=0;

  }

  renderFamily();
  renderCurrent();

}

function prevWord(){

  stopSpeech();

  wordIndex--;

  if(wordIndex<0){

    familyIndex--;

    if(familyIndex<0){
      familyIndex=families.length-1;
    }

    wordIndex =
      families[familyIndex].words.length-1;

  }

  renderFamily();
  renderCurrent();

}


/* =========================================================
   搜索
========================================================= */

document.getElementById("search")
.addEventListener("input",function(){

  const q=this.value.trim().toLowerCase();

  if(!q){

    renderFamily();
    renderCurrent();

    return;

  }

  let found=null;

  for(let i=0;i<families.length;i++){

    const index =
      families[i].words.findIndex(w=>
        w.toLowerCase()===q ||
        w.toLowerCase().includes(q)
      );

    if(index!==-1){

      found={
        family:i,
        word:index
      };

      break;

    }

  }

  if(found){

    familyIndex=found.family;

    wordIndex=found.word;

    renderFamily();
    renderCurrent();

  }

});


/* =========================================================
   初始化
========================================================= */

renderFamily();
renderCurrent();

</script>
