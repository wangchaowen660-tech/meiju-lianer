<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>每句练耳</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px 14px 40px;
    background:#f5f5f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

.container{
    width:100%;
    max-width:560px;
    margin:auto;
}

.header{
    text-align:center;
    padding:10px 0 20px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
    color:#888;
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.search input{
    flex:1;
    min-width:0;
    padding:13px 14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search button{
    width:auto;
    margin:0;
    padding:12px 18px;
    background:#222;
    color:#fff;
}

.results{
    margin-bottom:15px;
}

.result{
    background:#fff;
    padding:13px;
    margin-bottom:8px;
    border-radius:12px;
    cursor:pointer;
}

.result-en{
    font-size:17px;
    font-weight:bold;
}

.result-cn{
    margin-top:5px;
    color:#777;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:24px 18px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.scene{
    text-align:center;
    color:#888;
    font-size:14px;
}

.progress{
    text-align:center;
    margin-top:6px;
    color:#aaa;
    font-size:14px;
}

.english{
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:15px;
    font-size:30px;
    line-height:1.4;
    font-weight:bold;
}

.chinese{
    min-height:50px;
    text-align:center;
    font-size:20px;
    color:#666;
}

audio{
    width:100%;
    margin-top:20px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
}

.play{
    background:#222;
    color:#fff;
}

.repeat{
    background:#eee;
}

.nav{
    display:flex;
    gap:8px;
}

.nav button{
    background:#eee;
}

.random{
    background:#eee;
}

.status{
    min-height:24px;
    margin-top:14px;
    text-align:center;
    font-size:14px;
    color:#777;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>🎧 每句练耳</h1>

<p>听清 · 听懂 · 开口</p>

</div>


<!-- 搜索 -->

<div class="search">

<input
id="searchInput"
type="search"
placeholder="输入中文或英文"
autocomplete="off"
>

<button onclick="searchSentence()">
搜索
</button>

</div>


<div
id="results"
class="results">
</div>


<!-- 主卡片 -->

<div class="card">

<div
id="scene"
class="scene">
日常
</div>

<div
id="progress"
class="progress">
第 1 / 5 句
</div>


<div
id="english"
class="english">
Good morning.
</div>


<div
id="chinese"
class="chinese">
早上好。
</div>


<!-- 核心 MP3 播放器 -->

<audio
id="player"
controls
preload="metadata"
playsinline>
</audio>


<button
class="play"
onclick="playCurrent()">
▶ 播放英语
</button>


<button
class="repeat"
onclick="repeatCurrent()">
🔁 重听
</button>


<div class="nav">

<button onclick="previousSentence()">
⬅ 上一句
</button>

<button onclick="nextSentence()">
下一句 ➡
</button>

</div>


<button
class="random"
onclick="randomSentence()">
🎲 随机一句
</button>


<div
id="status"
class="status">
准备好了
</div>

</div>

</div>


<script>


/* =========================
   句库
========================= */

const lessons = [

{
    scene:"日常",
    en:"Good morning.",
    cn:"早上好。",
    audio:"001.mp3"
},

{
    scene:"日常",
    en:"How are you?",
    cn:"你好吗？",
    audio:"002.mp3"
},

{
    scene:"日常",
    en:"What are you doing?",
    cn:"你在做什么？",
    audio:"003.mp3"
},

{
    scene:"日常",
    en:"Where are you going?",
    cn:"你要去哪里？",
    audio:"004.mp3"
},

{
    scene:"日常",
    en:"Where do you live?",
    cn:"你住在哪里？",
    audio:"005.mp3"
}

];


let current = 0;


const player =
document.getElementById("player");

const status =
document.getElementById("status");


/* =========================
   显示句子
========================= */

function showSentence(){

    const item =
    lessons[current];

    document.getElementById("scene")
    .innerText =
    item.scene;

    document.getElementById("english")
    .innerText =
    item.en;

    document.getElementById("chinese")
    .innerText =
    item.cn;

    document.getElementById("progress")
    .innerText =
    "第 " +
    (current + 1) +
    " / " +
    lessons.length +
    " 句";

}


/* =========================
   停止播放器
========================= */

function stopPlayer(){

    player.pause();

    player.currentTime = 0;

}


/* =========================
   播放当前 MP3
========================= */

function playCurrent(){

    stopPlayer();

    const item =
    lessons[current];

    const source =
    "audio/" + item.audio;


    status.innerText =
    "🎧 正在读取 " +
    item.audio;


    player.src =
    source;

    player.load();


    player.play()

    .then(function(){

        status.innerText =
        "🎧 正在播放……";

    })

    .catch(function(error){

        console.log(error);

        status.innerText =
        "❌ 播放失败：" +
        item.audio;

    });

}


/* =========================
   重听
========================= */

function repeatCurrent(){

    if(!player.src){

        playCurrent();

        return;

    }

    player.currentTime = 0;

    player.play()

    .then(function(){

        status.innerText =
        "🔁 重听中……";

    })

    .catch(function(){

        playCurrent();

    });

}


/* =========================
   下一句
========================= */

function nextSentence(){

    stopPlayer();

    current++;

    if(
        current >=
        lessons.length
    ){

        current = 0;

    }

    showSentence();

    status.innerText =
    "准备好了";

}


/* =========================
   上一句
========================= */

function previousSentence(){

    stopPlayer();

    current--;

    if(current < 0){

        current =
        lessons.length - 1;

    }

    showSentence();

    status.innerText =
    "准备好了";

}


/* =========================
   随机
========================= */

function randomSentence(){

    stopPlayer();

    current =
    Math.floor(
        Math.random() *
        lessons.length
    );

    showSentence();

    status.innerText =
    "🎲 已选择随机句子";

}


/* =========================
   搜索
========================= */

function searchSentence(){

    const input =
    document.getElementById(
        "searchInput"
    );

    const keyword =
    input.value
    .trim()
    .toLowerCase();

    const results =
    document.getElementById(
        "results"
    );


    results.innerHTML = "";


    if(!keyword){

        return;

    }


    const found =
    lessons
    .map(
        function(item,index){

            return {
                item:item,
                index:index
            };

        }
    )
    .filter(
        function(data){

            const item =
            data.item;

            return (

                item.en
                .toLowerCase()
                .includes(keyword)

                ||

                item.cn
                .includes(keyword)

                ||

                item.scene
                .includes(keyword)

            );

        }
    );


    if(found.length === 0){

        results.innerHTML =
        "<div class='result'>" +
        "没有找到相关句子" +
        "</div>";

        return;

    }


    found.forEach(
        function(data){

            const item =
            data.item;

            const box =
            document.createElement(
                "div"
            );

            box.className =
            "result";


            box.innerHTML =

            "<div class='result-en'>" +
            item.en +
            "</div>" +

            "<div class='result-cn'>" +
            item.cn +
            "</div>";


            box.onclick =
            function(){

                stopPlayer();

                current =
                data.index;

                showSentence();

                results.innerHTML =
                "";

                input.value =
                "";

                window.scrollTo(
                    {
                        top:0,
                        behavior:"smooth"
                    }
                );

            };


            results.appendChild(box);

        }
    );

}


/* =========================
   回车搜索
========================= */

document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            searchSentence();

        }

    }
);


/* =========================
   播放状态
========================= */

player.addEventListener(
    "playing",
    function(){

        status.innerText =
        "🎧 正在播放……";

    }
);


player.addEventListener(
    "waiting",
    function(){

        status.innerText =
        "⏳ 正在缓冲……";

    }
);


player.addEventListener(
    "ended",
    function(){

        status.innerText =
        "✅ 播放完成";

    }
);


player.addEventListener(
    "error",
    function(){

        status.innerText =
        "❌ 找不到 MP3 文件";

    }
);


/* =========================
   初始化
========================= */

showSentence();

</script>

</body>
</html>
