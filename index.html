<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🎧 每句练耳 · Chaowen AI</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:#f5f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}

.app{
  max-width:620px;
  margin:auto;
  padding:9px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.logo{
  font-size:19px;
  font-weight:800;
}

.sub{
  font-size:11px;
  color:#888;
}

.card{
  background:#fff;
  border-radius:13px;
  padding:11px;
  margin-bottom:8px;
  box-shadow:0 2px 9px rgba(0,0,0,.05);
}

.label{
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

/* 搜索 */
.search{
  display:flex;
  gap:6px;
}

.search input{
  flex:1;
  border:1px solid #ddd;
  border-radius:9px;
  padding:9px 10px;
  font-size:14px;
  outline:none;
}

.search button{
  border:0;
  border-radius:9px;
  padding:0 13px;
  background:#222;
  color:white;
}

/* 分类 */
.filters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:8px;
}

.filters button{
  flex:0 0 auto;
  border:0;
  background:#eef0f2;
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
}

.filters button.active{
  background:#222;
  color:#fff;
}

/* 词 */
.wordGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.wordBtn{
  border:0;
  background:#f0f1f3;
  border-radius:8px;
  padding:8px 2px;
  font-size:14px;
}

.wordBtn.active{
  background:#222;
  color:#fff;
}

/* 当前词 */
.current{
  text-align:center;
}

.bigWord{
  font-size:38px;
  line-height:1.1;
  font-weight:850;
}

.meaning{
  color:#777;
  font-size:14px;
  margin-top:3px;
}

.pos{
  display:inline-block;
  margin-top:5px;
  background:#f0f1f3;
  border-radius:7px;
  padding:4px 8px;
  font-size:11px;
  color:#666;
}

.mainPlay{
  border:0;
  background:#222;
  color:white;
  border-radius:9px;
  padding:9px 17px;
  margin-top:8px;
  font-size:14px;
}

/* 拼读 */
.blend{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-top:9px;
}

.blend button{
  border:0;
  background:#f0f1f3;
  border-radius:7px;
  padding:6px 9px;
  font-weight:700;
}

/* 词块 */
.chunks{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chunk{
  border:0;
  background:#f0f1f3;
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
}

.chunkCN{
  font-size:11px;
  color:#888;
  margin-left:4px;
}

/* 母句 */
.sentence{
  border-top:1px solid #eee;
  padding:8px 0;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.sentenceText{
  font-size:14px;
  line-height:1.4;
}

.sentenceCN{
  color:#888;
  font-size:12px;
  margin-top:2px;
}

.speak{
  flex:0 0 auto;
  border:0;
  background:#f0f1f3;
  border-radius:7px;
  padding:6px 8px;
}

/* 听力 */
.listen{
  text-align:center;
}

.listenText{
  min-height:24px;
  margin-top:8px;
  font-size:17px;
  font-weight:650;
}

.listenCN{
  min-height:18px;
  color:#888;
  font-size:12px;
}

.listenBtns{
  display:flex;
  gap:6px;
  justify-content:center;
  margin-top:7px;
}

.listenBtns button{
  border:0;
  background:#eef0f2;
  border-radius:8px;
  padding:7px 11px;
}

/* 控制 */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.controls button{
  border:0;
  border-radius:9px;
  padding:9px;
  background:#eef0f2;
}

.controls .next{
  background:#222;
  color:#fff;
}

.speed{
  display:flex;
  gap:5px;
  margin-top:6px;
}

.speed button{
  flex:1;
  border:0;
  background:#eef0f2;
  border-radius:7px;
  padding:6px;
  font-size:11px;
}

.speed button.active{
  background:#222;
  color:#fff;
}

.empty{
  text-align:center;
  color:#999;
  padding:12px;
  font-size:13px;
}

@media(max-width:380px){
  .wordGrid{
    grid-template-columns:repeat(4,1fr);
  }

  .bigWord{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= 顶部 ================= -->

<div class="header">

  <div>
    <div class="logo">🎧 每句练耳</div>
    <div class="sub">
      Chaowen AI · 2000词 × 母句语块
    </div>
  </div>

  <div id="progress">1 / 2000</div>

</div>


<!-- ================= 搜索 ================= -->

<div class="card">

  <div class="search">

    <input
      id="searchInput"
      placeholder="搜索：make / home / happy">

    <button onclick="searchWord()">
      搜索
    </button>

  </div>

</div>


<!-- ================= 筛选 ================= -->

<div class="card">

  <div class="filters" id="filters"></div>

  <div class="wordGrid" id="wordGrid"></div>

</div>


<!-- ================= 当前单词 ================= -->

<div class="card">

  <div class="current">

    <div class="bigWord" id="bigWord">
      cat
    </div>

    <div class="meaning" id="meaning">
      猫
    </div>

    <div class="pos" id="pos">
      noun · 名词
    </div>

    <br>

    <button
      class="mainPlay"
      onclick="speakCurrent()">
      🔊 听单词
    </button>

    <div
      class="blend"
      id="blend">
    </div>

  </div>

</div>


<!-- ================= 正确词块 ================= -->

<div class="card">

  <div class="label">
    🧩 正确词块
  </div>

  <div
    class="chunks"
    id="chunks">
  </div>

</div>


<!-- ================= 母句 ================= -->

<div class="card">

  <div class="label">
    🗣 母句
  </div>

  <div id="sentences"></div>

</div>


<!-- ================= 听力 ================= -->

<div class="card">

  <div class="label">
    🎧 听力训练
  </div>

  <div class="listen">

    <button
      class="mainPlay"
      onclick="listenFirst()">
      🔊 先听英语
    </button>

    <div
      class="listenText"
      id="listenText">
    </div>

    <div
      class="listenCN"
      id="listenCN">
    </div>

    <div class="listenBtns">

      <button onclick="showEnglish()">
        显示英文
      </button>

      <button onclick="showChinese()">
        显示中文
      </button>

    </div>

  </div>

</div>


<!-- ================= 控制 ================= -->

<div class="card">

  <div class="controls">

    <button onclick="previousWord()">
      ← 上一个
    </button>

    <button
      class="next"
      onclick="nextWord()">
      下一个 →
    </button>

    <button onclick="repeatSentence()">
      🔁 重复句子
    </button>

    <button onclick="stopSpeech()">
      ■ 停止
    </button>

  </div>

  <div class="speed">

    <button
      onclick="setSpeed(.68,this)">
      🐢 慢速
    </button>

    <button
      class="active"
      onclick="setSpeed(.85,this)">
      正常
    </button>

    <button
      onclick="setSpeed(1,this)">
      自然
    </button>

  </div>

</div>

</div>

/* =========================================================
   状态
========================================================= */

let currentIndex=0;
let speed=.85;
let speechToken=0;
let currentSentenceIndex=0;


/* =========================================================
   渲染筛选
========================================================= */

function renderFilters(){

  const box=
    document.getElementById("filters");

  box.innerHTML="";

  const types=[
    ["all","全部"],
    ["noun","名词"],
    ["verb","动词"],
    ["adjective","形容词"],
    ["pronoun","代词"],
    ["adverb","副词"]
  ];

  types.forEach(type=>{

    const b=
      document.createElement("button");

    b.textContent=type[1];

    b.onclick=()=>{

      if(type[0]==="all"){

        currentIndex=0;

      }else{

        const i=
          WORDS.findIndex(
            x=>x.pos.startsWith(type[0])
          );

        if(i>=0) currentIndex=i;

      }

      render();

    };

    box.appendChild(b);

  });

}


/* =========================================================
   词族 / 词列表
========================================================= */

function renderWords(){

  const box=
    document.getElementById("wordGrid");

  box.innerHTML="";

  const family=
    current().family;

  let list=
    WORDS.map((x,i)=>[x,i])
    .filter(x=>x[0].family===family);

  /*
    如果当前词族只有一个词，
    显示全部核心词，方便继续学习。
  */

  if(list.length<=1){

    list=
      WORDS.map((x,i)=>[x,i])
      .filter(x=>x[0].family==="core")
      .slice(0,20);

  }

  list.forEach(pair=>{

    const item=pair[0];
    const index=pair[1];

    const b=
      document.createElement("button");

    b.className="wordBtn";

    if(index===currentIndex){
      b.classList.add("active");
    }

    b.textContent=item.word;

    b.onclick=()=>{

      stopSpeech();

      currentIndex=index;

      render();

      setTimeout(
        speakCurrent,
        100
      );

    };

    box.appendChild(b);

  });

}


/* =========================================================
   当前词
========================================================= */

function current(){

  return WORDS[currentIndex];

}


function renderCurrent(){

  const item=current();

  document.getElementById("bigWord")
    .textContent=item.word;

  document.getElementById("meaning")
    .textContent=item.cn;

  document.getElementById("pos")
    .textContent=item.pos;

  document.getElementById("progress")
    .textContent=
      `${currentIndex+1} / 2000`;

}


/* =========================================================
   拼读
========================================================= */

function renderBlend(){

  const box=
    document.getElementById("blend");

  const item=current();

  if(!item.phonics ||
     item.phonics.length!==2){

    box.innerHTML="";

    return;

  }

  const a=item.phonics[0];
  const b=item.phonics[1];

  box.innerHTML=`

    <button onclick="speak('${a}')">
      ${a}
    </button>

    <span>+</span>

    <button onclick="speak('${b}')">
      ${b}
    </button>

    <span>→</span>

    <button onclick="speak('${item.word}')">
      ${item.word}
    </button>

  `;

}


/* =========================================================
   正确词块
========================================================= */

function renderChunks(){

  const box=
    document.getElementById("chunks");

  box.innerHTML="";

  current().chunks.forEach(item=>{

    const b=
      document.createElement("button");

    b.className="chunk";

    b.innerHTML=
      `${item[0]}
       <span class="chunkCN">
       ${item[1]}
       </span>`;

    b.onclick=()=>{
      speak(item[0]);
    };

    box.appendChild(b);

  });

}


/* =========================================================
   正确母句
========================================================= */

function renderSentences(){

  const box=
    document.getElementById("sentences");

  box.innerHTML="";

  current().sentences.forEach(
    (item,index)=>{

      const row=
        document.createElement("div");

      row.className="sentence";

      row.innerHTML=`

        <div>

          <div class="sentenceText">
            ${item[0]}
          </div>

          <div class="sentenceCN">
            ${item[1]}
          </div>

        </div>

        <button class="speak">
          🔊
        </button>

      `;

      row.querySelector(".speak")
        .onclick=()=>{

          currentSentenceIndex=index;

          speak(item[0]);

        };

      box.appendChild(row);

    }
  );

}


/* =========================================================
   总刷新
========================================================= */

function render(){

  renderFilters();

  renderWords();

  renderCurrent();

  renderBlend();

  renderChunks();

  renderSentences();

  document.getElementById("listenText")
    .textContent="";

  document.getElementById("listenCN")
    .textContent="";

}


/* =========================================================
   稳定语音
========================================================= */

function stopSpeech(){

  speechToken++;

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

  }

}


function speak(text,rate=speed){

  if(!text) return;

  const token=
    ++speechToken;

  speechSynthesis.cancel();

  setTimeout(()=>{

    if(token!==speechToken) return;

    const u=
      new SpeechSynthesisUtterance(text);

    u.lang="en-US";
    u.rate=rate;
    u.pitch=1;
    u.volume=1;

    speechSynthesis.speak(u);

  },80);

}


/* =========================================================
   当前单词
========================================================= */

function speakCurrent(){

  speak(current().word);

}


/* =========================================================
   听力训练
========================================================= */

function listenFirst(){

  const item=current();

  if(!item.sentences.length) return;

  currentSentenceIndex=0;

  const sentence=
    item.sentences[0];

  document.getElementById("listenText")
    .textContent="••••••••••";

  document.getElementById("listenCN")
    .textContent="";

  speak(sentence[0],.68);

}


/* =========================================================
   显示英文
========================================================= */

function showEnglish(){

  const item=current();

  if(!item.sentences.length) return;

  const sentence=
    item.sentences[currentSentenceIndex];

  document.getElementById("listenText")
    .textContent=sentence[0];

}


/* =========================================================
   显示中文
========================================================= */

function showChinese(){

  const item=current();

  if(!item.sentences.length) return;

  const sentence=
    item.sentences[currentSentenceIndex];

  document.getElementById("listenCN")
    .textContent=sentence[1];

}


/* =========================================================
   重复句子
========================================================= */

function repeatSentence(){

  const item=current();

  if(!item.sentences.length) return;

  speak(
    item.sentences[currentSentenceIndex][0]
  );

}


/* =========================================================
   上一个
========================================================= */

function previousWord(){

  stopSpeech();

  currentIndex--;

  if(currentIndex<0){
    currentIndex=WORDS.length-1;
  }

  render();

  setTimeout(
    speakCurrent,
    100
  );

}


/* =========================================================
   下一个
========================================================= */

function nextWord(){

  stopSpeech();

  currentIndex++;

  if(currentIndex>=WORDS.length){
    currentIndex=0;
  }

  render();

  setTimeout(
    speakCurrent,
    100
  );

}


/* =========================================================
   搜索
========================================================= */

function searchWord(){

  const value=
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  if(!value) return;

  const index=
    WORDS.findIndex(
      item=>
        item.word.toLowerCase()===value
    );

  if(index>=0){

    stopSpeech();

    currentIndex=index;

    render();

    setTimeout(
      speakCurrent,
      100
    );

  }else{

    alert("暂时没有找到这个词。");

  }

}


/* =========================================================
   回车搜索
========================================================= */

document
.getElementById("searchInput")
.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter"){
      searchWord();
    }

  }
);


/* =========================================================
   速度
========================================================= */

function setSpeed(value,button){

  speed=value;

  document
    .querySelectorAll(".speed button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

}


/* =========================================================
   页面离开
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){
      stopSpeech();
    }

  }
);


/* =========================================================
   启动
========================================================= */

render();

</script>

</body>
</html>
