<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>每句练耳</title>

<style>

body {
    margin: 0;
    padding: 20px 15px;
    background: #f5f5f5;

}

.card {

    background: white;
    padding: 22px 18px;

}

h1 {
    text-align: center;
    margin: 0 0 5px 0;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 20px;
}

.searchBox {

    margin-bottom: 15px;
}

#searchInput {

    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;

    box-sizing: border-box;
}

.searchButton {

    padding: 12px 16px;

    background: #222;
    color: white;
}

.scene {
    text-align: center;
    color: #777;
    margin-top: 10px;
}

.progress {
    text-align: center;
    color: #999;
    margin: 10px 0 15px;
}

.sentence {
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 29px;
    font-weight: bold;
    line-height: 1.4;
}

.meaning {
    min-height: 45px;
    text-align: center;
    color: #666;
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 9px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
}

.play {
    background: #222;
    color: white;
}

.repeat {
    background: #ddd;
}

.next {
    background: #eee;
}

.status {
    text-align: center;
    min-height: 24px;
    margin-top: 12px;
    color: #777;
}

.results {
    margin-top: 18px;
}

.resultTitle {
    font-weight: bold;
    margin-bottom: 8px;
}

.resultItem {
    padding: 13px;
    margin-bottom: 8px;
    background: #f1f1f1;
    border-radius: 10px;
    cursor: pointer;
}

.resultEnglish {
    font-weight: bold;
    font-size: 17px;
}

.resultChinese {
    color: #666;
    margin-top: 4px;
}

.noResult {
    color: #999;
    text-align: center;
    padding: 10px;
}

</style>

</head>


<body>


<div class="card">


<h1>🎧 每句练耳</h1>


<div class="subtitle">
每一句都是干货
</div>


<!-- 搜索 -->

<div class="searchBox">

<input
id="searchInput"
type="text"
placeholder="输入中文或英文搜索，例如：早上好 / morning"
oninput="searchLessons()"
>

<button
class="searchButton"
onclick="searchLessons()">
搜索
</button>

</div>


<!-- 当前场景 -->

<div
id="scene"
class="scene">
日常
</div>


<!-- 进度 -->

<div
id="progress"
class="progress">
第 1 / 100 句
</div>


<!-- 英文 -->

<div
id="sentence"
class="sentence">
Good morning.
</div>


<!-- 中文 -->

<div
id="meaning"
class="meaning">
早上好。
</div>


<!-- 播放 -->

<button
class="play"
onclick="playSentence()">
▶ 播放英语
</button>


<button
class="repeat"
onclick="playSentence()">
🔁 再听一遍
</button>


<button
class="next"
onclick="nextSentence()">
➡️ 下一句
</button>


<div
id="status"
class="status">
准备好了
</div>


<!-- 搜索结果 -->

<div
id="results"
class="results">
</div>


</div>

/* =================================
   当前句子
================================= */

let current = 0;


/* =================================
   显示句子
================================= */

function showSentence() {

    document.getElementById("scene").innerText =
        lessons[current][0];

    document.getElementById("sentence").innerText =
        lessons[current][1];

    document.getElementById("meaning").innerText =
        lessons[current][2];

    document.getElementById("progress").innerText =
        "第 " + (current + 1) +
        " / " + lessons.length + " 句";

    document.getElementById("status").innerText =
        "准备好了";

}


/* =================================
   播放英语
   注意：只播放 lessons[current][1]
================================= */
function playSentence() {

    // 先彻底清空语音队列
    window.speechSynthesis.cancel();

    document.getElementById("status").innerText =
        "🎧 正在准备……";

    setTimeout(function() {

        const english = lessons[current][1];

        const voice =
            new SpeechSynthesisUtterance(english);

        // 英语发音
        voice.lang = "en-US";

        // 清晰慢速
        voice.rate = 0.65;

        // 正常音调
        voice.pitch = 1.0;

        // 最大音量
        voice.volume = 1.0;

        voice.onstart = function() {

            document.getElementById("status").innerText =
                "🎧 正在播放……";

        };

        voice.onend = function() {

            document.getElementById("status").innerText =
                "✅ 听完了";

        };

        voice.onerror = function() {

            document.getElementById("status").innerText =
                "⚠️ 播放出现问题，请再试一次";

        };

        // 开始播放
        window.speechSynthesis.speak(voice);

        /*
           iPhone / Safari 有时会让语音暂停。
           定时 resume 可以减少这种情况。
        */

        const keepAlive = setInterval(function() {

            if (!window.speechSynthesis.speaking) {

                clearInterval(keepAlive);

                return;

            }

            window.speechSynthesis.resume();

        }, 1000);

    }, 400);
}

function nextSentence() {

    window.speechSynthesis.cancel();

    current++;

    if (current >= lessons.length) {

        current = 0;

    }

    showSentence();

}


/* =================================
   中文 / 英文搜索
================================= */

function searchLessons() {

    const keyword =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const results =
        document.getElementById("results");


    results.innerHTML = "";


    if (keyword === "") {

        return;

    }


    const found = lessons.filter(function(item) {

        const scene =
            item[0].toLowerCase();

        const english =
            item[1].toLowerCase();

        const chinese =
            item[2].toLowerCase();


        return (
            scene.includes(keyword) ||
            english.includes(keyword) ||
            chinese.includes(keyword)
        );

    });


    const title =
        document.createElement("div");

    title.className = "resultTitle";

    title.innerText =
        "🔎 找到 " + found.length + " 句";

    results.appendChild(title);


    if (found.length === 0) {

        const noResult =
            document.createElement("div");

        noResult.className = "noResult";

        noResult.innerText =
            "没有找到相关句子";

        results.appendChild(noResult);

        return;

    }


    found.forEach(function(item) {

        const index =
            lessons.indexOf(item);


        const box =
            document.createElement("div");

        box.className =
            "resultItem";


        const english =
            document.createElement("div");

        english.className =
            "resultEnglish";

        english.innerText =
            item[1];


        const chinese =
            document.createElement("div");

        chinese.className =
            "resultChinese";

        chinese.innerText =
            item[2];


        box.appendChild(english);

        box.appendChild(chinese);


        /*
           点击搜索结果
           直接跳到对应句子
        */

        box.onclick = function() {

            current = index;

            showSentence();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


        results.appendChild(box);

    });

}


/* =================================
   启动
================================= */

showSentence();

</script>
