<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每句练耳 · 最终稳定版</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px 14px 40px;
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", Arial, sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 6px 0 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .header p {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 15px;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search input {
            flex: 1;
            padding: 13px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            background: #fff;
        }

        .search input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .search button {
            flex-shrink: 0;
            padding: 12px 20px;
            background: #1e293b;
            color: #fff;
            border: 0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .search button:hover {
            background: #0f172a;
        }

        .results {
            margin-bottom: 16px;
        }

        .result {
            background: #fff;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid #edf2f7;
        }

        .result:hover {
            background: #f8fafc;
        }

        .result-en {
            font-weight: 700;
            font-size: 17px;
            color: #0f172a;
        }

        .result-cn {
            margin-top: 4px;
            color: #64748b;
            font-size: 15px;
        }

        .no-result {
            padding: 18px;
            text-align: center;
            color: #94a3b8;
            background: #fff;
            border-radius: 14px;
            border: 1px dashed #d1d9e6;
        }

        .card {
            background: #fff;
            border-radius: 24px;
            padding: 26px 20px 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .scene {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        .progress {
            color: #b9c2d0;
            margin-top: 4px;
            font-size: 14px;
        }

        .english {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 8px 10px;
            font-size: 30px;
            font-weight: 700;
            line-height: 1.4;
            color: #0f172a;
            word-break: break-word;
        }

        .chinese {
            min-height: 44px;
            font-size: 20px;
            color: #475569;
            padding: 0 4px 6px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.97);
        }

        .play {
            background: #1e293b;
            color: #fff;
        }
        .play:hover {
            background: #0f172a;
        }

        .normal {
            background: #f1f4f9;
            color: #1e293b;
        }
        .normal:hover {
            background: #e6eaef;
        }

        .repeat-btn {
            background: #8b5cf6;
            color: #fff;
        }
        .repeat-btn:hover {
            background: #7c3aed;
        }
        .repeat-btn.active {
            background: #ef4444;
        }
        .repeat-btn.active:hover {
            background: #dc2626;
        }

        .engine-toggle {
            background: #f59e0b;
            color: #fff;
        }
        .engine-toggle:hover {
            background: #d97706;
        }

        .test-btn {
            background: #06b6d4;
            color: #fff;
        }
        .test-btn:hover {
            background: #0891b2;
        }

        .nav {
            display: flex;
            gap: 10px;
        }
        .nav button {
            flex: 1;
            margin-top: 12px;
        }

        .status {
            min-height: 28px;
            margin-top: 18px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 400;
        }
        .status.speaking {
            color: #3b82f6;
            font-weight: 500;
        }
        .status.done {
            color: #22c55e;
            font-weight: 500;
        }
        .status.error {
            color: #ef4444;
            font-weight: 500;
        }
        .status.repeating {
            color: #8b5cf6;
            font-weight: 500;
        }
        .status.warning {
            color: #f59e0b;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.35s, transform 0.35s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .english {
                font-size: 25px;
                min-height: 80px;
            }
            .chinese {
                font-size: 18px;
                min-height: 38px;
            }
            button {
                font-size: 16px;
                padding: 13px;
            }
        }
        @media (max-width: 380px) {
            .english {
                font-size: 21px;
            }
            .chinese {
                font-size: 16px;
            }
            .nav {
                flex-direction: column;
                gap: 0;
            }
            .nav button {
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>

    <div id="toast" class="toast"></div>

    <div class="container">

        <div class="header">
            <h1>🎧 每句练耳</h1>
            <p>听清 · 听懂 · 开口 · 复读</p>
        </div>

        <div class="search">
            <input id="searchInput" type="search" placeholder="输入中文或英文" autocomplete="off">
            <button onclick="searchSentence()">搜索</button>
        </div>

        <div id="results" class="results"></div>

        <div class="card">

            <div id="scene" class="scene">日常</div>
            <div id="progress" class="progress">第 1 / 5 句</div>

            <div id="english" class="english">Good morning.</div>
            <div id="chinese" class="chinese">早上好。</div>

            <button class="play" onclick="playCurrent()">▶ 播放英语</button>
            <button class="normal" onclick="repeatCurrent()">🔁 重听</button>

            <button id="repeatBtn" class="repeat-btn" onclick="toggleRepeat()">🔁 复读（5次）</button>

            <button id="engineBtn" class="engine-toggle" onclick="toggleEngine()">
                🌐 当前：自动（Google优先）
            </button>

            <button class="test-btn" onclick="testEngine()">🔧 测试当前引擎</button>

            <div class="nav">
                <button class="normal" onclick="previousSentence()">⬅ 上一句</button>
                <button class="normal" onclick="nextSentence()">下一句 ➡</button>
            </div>

            <button class="normal" onclick="randomSentence()">🎲 随机一句</button>

            <div id="status" class="status">准备好了</div>

        </div>

        <div style="text-align:center;margin-top:16px;font-size:13px;color:#b9c2d0;">
            ⌨ 左右方向键切换 · 空格键播放/停止 · R 键复读
        </div>

    </div>

    <script>
        /* ==============================================================
               句库
               ============================================================== */

        const lessons = [
            { scene: "日常", en: "Good morning.", cn: "早上好。" },
            { scene: "日常", en: "How are you?", cn: "你好吗？" },
            { scene: "日常", en: "What are you doing?", cn: "你在做什么？" },
            { scene: "日常", en: "Where are you going?", cn: "你要去哪里？" },
            { scene: "日常", en: "Where do you live?", cn: "你住在哪里？" },
            { scene: "日常", en: "I love you.", cn: "我爱你。" },
            { scene: "日常", en: "Thank you very much.", cn: "非常感谢。" },
            { scene: "日常", en: "Excuse me.", cn: "打扰一下。" },
            { scene: "日常", en: "I don't understand.", cn: "我不明白。" },
            { scene: "日常", en: "Could you help me?", cn: "你能帮我吗？" },
            { scene: "旅行", en: "Where is the train station?", cn: "火车站在哪里？" },
            { scene: "旅行", en: "How much is this?", cn: "这个多少钱？" },
            { scene: "旅行", en: "I'd like a cup of coffee.", cn: "我想要一杯咖啡。" },
            { scene: "旅行", en: "Can I have the bill?", cn: "请给我账单。" },
            { scene: "旅行", en: "What time is it?", cn: "现在几点了？" },
        ];


        /* ==============================================================
               状态
               ============================================================== */

        let currentIndex = 0;
        let isSpeaking = false;
        let currentAudio = null;
        let currentUtterance = null;
        let statusResetTimer = null;
        let isPlayLocked = false;

        // 引擎模式：'auto'（Google优先，失败降级）, 'web'（强制原生）, 'google'（强制Google）
        let engineMode = 'auto';

        // 复读
        let isRepeating = false;
        let repeatCount = 0;
        let repeatMax = 5;
        let repeatTimer = null;

        const dom = {
            scene: document.getElementById('scene'),
            progress: document.getElementById('progress'),
            english: document.getElementById('english'),
            chinese: document.getElementById('chinese'),
            status: document.getElementById('status'),
            results: document.getElementById('results'),
            searchInput: document.getElementById('searchInput'),
            repeatBtn: document.getElementById('repeatBtn'),
            engineBtn: document.getElementById('engineBtn'),
            toast: document.getElementById('toast'),
        };

        // ===== Toast =====
        let toastTimer = null;

        function showToast(msg, duration) {
            duration = duration || 1800;
            const el = dom.toast;
            el.textContent = msg;
            el.className = 'toast show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.className = 'toast'; }, duration);
        }

        // ===== 停止所有 =====
        function stopAll() {
            if (isRepeating) {
                isRepeating = false;
                dom.repeatBtn.textContent = '🔁 复读（5次）';
                dom.repeatBtn.classList.remove('active');
                if (repeatTimer) { clearTimeout(repeatTimer);
                    repeatTimer = null; }
            }
            if (currentUtterance) {
                try { window.speechSynthesis.cancel(); } catch (_) {}
                currentUtterance = null;
            }
            if (currentAudio) {
                try { currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio.src = ''; } catch (_) {}
                currentAudio = null;
            }
            isSpeaking = false;
            isPlayLocked = false;
            if (statusResetTimer) { clearTimeout(statusResetTimer);
                statusResetTimer = null; }
            if (!isRepeating) {
                dom.status.textContent = '准备好了';
                dom.status.className = 'status';
            }
        }

        // ===== 重置 Web Speech 引擎 =====
        function resetSpeechEngine() {
            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.pause();
                window.speechSynthesis.resume();
            } catch (_) {}
            return new Promise((resolve) => {
                let count = 0;

                function check() {
                    if (count > 30) { resolve(); return; }
                    if (!window.speechSynthesis.pending && !window.speechSynthesis.speaking) {
                        resolve();
                    } else {
                        count++;
                        setTimeout(check, 100);
                    }
                }
                check();
            });
        }

        // ===== 原生语音播放 =====
        function playWebSpeech(callback) {
            if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
                callback(false, '浏览器不支持原生语音');
                return;
            }
            const item = lessons[currentIndex];
            if (!item) { callback(false, '句子不存在'); return; }

            stopAll();
            resetSpeechEngine().then(() => {
                // 再次检查引擎状态
                if (window.speechSynthesis.pending || window.speechSynthesis.speaking) {
                    setTimeout(() => {
                        if (window.speechSynthesis.pending || window.speechSynthesis.speaking) {
                            callback(false, '引擎忙碌，请稍后重试');
                            return;
                        }
                        doSpeak(callback);
                    }, 400);
                } else {
                    doSpeak(callback);
                }
            });

            function doSpeak(cb) {
                const utterance = new SpeechSynthesisUtterance(item.en);
                currentUtterance = utterance;
                utterance.lang = 'en-US';
                utterance.rate = 0.6;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                let ended = false;

                utterance.onstart = function() {
                    if (currentUtterance !== utterance) return;
                    isSpeaking = true;
                    if (!isRepeating) {
                        dom.status.textContent = '🎧 正在播放……';
                        dom.status.className = 'status speaking';
                    }
                };

                utterance.onend = function() {
                    if (ended) return;
                    ended = true;
                    isSpeaking = false;
                    currentUtterance = null;
                    setTimeout(() => { cb(true, '播放完成'); }, 600);
                };

                utterance.onerror = function(ev) {
                    if (ended) return;
                    ended = true;
                    isSpeaking = false;
                    currentUtterance = null;
                    if (ev.error === 'canceled' || ev.error === 'interrupted') {
                        cb(false, '播放被取消');
                        return;
                    }
                    cb(false, '原生语音错误: ' + ev.error);
                };

                try {
                    window.speechSynthesis.speak(utterance);
                } catch (err) {
                    ended = true;
                    isSpeaking = false;
                    currentUtterance = null;
                    cb(false, '原生语音异常: ' + err.message);
                }
            }
        }

        // ===== Google TTS 播放 =====
        function playGoogleTTS(callback) {
            const item = lessons[currentIndex];
            if (!item) { callback(false, '句子不存在'); return; }

            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(item.en)}&tl=en&client=tw-ob`;
            const audio = new Audio(url);
            currentAudio = audio;
            let ended = false;

            audio.oncanplaythrough = function() {
                audio.play().catch(err => {
                    ended = true;
                    currentAudio = null;
                    callback(false, 'Google TTS 播放失败: ' + err.message);
                });
            };

            audio.onplay = function() {
                isSpeaking = true;
                if (!isRepeating) {
                    dom.status.textContent = '🎧 正在播放……';
                    dom.status.className = 'status speaking';
                }
            };

            audio.onended = function() {
                if (ended) return;
                ended = true;
                isSpeaking = false;
                currentAudio = null;
                setTimeout(() => { callback(true, '播放完成'); }, 200);
            };

            audio.onerror = function() {
                if (ended) return;
                ended = true;
                isSpeaking = false;
                currentAudio = null;
                callback(false, 'Google TTS 加载失败（网络限制或服务不可用）');
            };

            audio.load();
        }

        // ===== 播放主入口（自动降级） =====
        function playCurrent() {
            if (isPlayLocked) {
                showToast('请稍候，正在播放中...');
                return;
            }
            if (isRepeating) { stopAll(); }
            if (isSpeaking) {
                stopAll();
                setTimeout(() => { playCurrent(); }, 400);
                return;
            }

            isPlayLocked = true;
            dom.status.textContent = '⏳ 加载中...';
            dom.status.className = 'status';

            let engineUsed = '';

            // 根据模式选择引擎
            function tryPlay(engine) {
                if (engine === 'google') {
                    engineUsed = 'Google TTS';
                    playGoogleTTS(function(success, msg) {
                        if (success) {
                            finish(true, msg);
                        } else {
                            // 如果是自动模式，降级到原生
                            if (engineMode === 'auto') {
                                dom.status.textContent = '⚠️ Google TTS 失败，切换至原生语音...';
                                dom.status.className = 'status warning';
                                setTimeout(() => {
                                    tryPlay('web');
                                }, 300);
                            } else {
                                finish(false, msg);
                            }
                        }
                    });
                } else if (engine === 'web') {
                    engineUsed = '原生语音';
                    playWebSpeech(function(success, msg) {
                        if (success) {
                            finish(true, msg);
                        } else {
                            // 如果是自动模式且原生失败，尝试一次Google（兜底）
                            if (engineMode === 'auto' && engine === 'web') {
                                dom.status.textContent = '⚠️ 原生语音失败，尝试 Google TTS...';
                                dom.status.className = 'status warning';
                                setTimeout(() => {
                                    tryPlay('google');
                                }, 300);
                            } else {
                                finish(false, msg);
                            }
                        }
                    });
                }
            }

            function finish(success, msg) {
                isPlayLocked = false;
                if (success) {
                    dom.status.textContent = '✅ 播放完成 (' + engineUsed + ')';
                    dom.status.className = 'status done';
                    clearTimeout(statusResetTimer);
                    statusResetTimer = setTimeout(() => {
                        if (!isSpeaking && !currentAudio && !currentUtterance && !isRepeating) {
                            dom.status.textContent = '准备好了';
                            dom.status.className = 'status';
                        }
                        statusResetTimer = null;
                    }, 2000);
                } else {
                    dom.status.textContent = '⚠️ ' + msg;
                    dom.status.className = 'status error';
                    showToast('播放失败: ' + msg);
                }
            }

            // 根据模式决定首次尝试
            if (engineMode === 'google') {
                tryPlay('google');
            } else if (engineMode === 'web') {
                tryPlay('web');
            } else { // auto
                // 优先 Google，失败降级原生
                tryPlay('google');
            }
        }

        // ===== 重听 =====
        function repeatCurrent() {
            if (isRepeating) stopAll();
            stopAll();
            setTimeout(() => { playCurrent(); }, 400);
        }

        // ===== 复读 =====
        function toggleRepeat() {
            if (isRepeating) {
                stopAll();
                dom.status.textContent = '⏸ 已停止复读';
                dom.status.className = 'status';
                showToast('已停止复读');
                return;
            }
            if (isSpeaking) stopAll();
            repeatCount = 0;
            isRepeating = true;
            dom.repeatBtn.textContent = '⏹ 停止复读';
            dom.repeatBtn.classList.add('active');
            dom.status.textContent = `🔁 正在复读 (${repeatCount + 1}/${repeatMax})...`;
            dom.status.className = 'status repeating';
            doRepeatPlay();
        }

        function doRepeatPlay() {
            if (!isRepeating) return;
            dom.status.textContent = `🔁 正在复读 (${repeatCount + 1}/${repeatMax})...`;
            dom.status.className = 'status repeating';

            // 复读时使用当前的 engineMode，但需要自行处理播放逻辑（直接调用 play 内部函数不太方便，我们复用 playCurrent 但需要控制锁）
            // 由于 playCurrent 有锁，我们直接使用内部播放函数，但为了简化，我们直接调用 playCurrent 但提前释放锁?
            // 更好的方式：复制播放逻辑，但为了代码简洁，我们用 playCurrent 并强制解锁
            // 我们封装一个内部播放函数，不使用锁
            function repeatPlay(cb) {
                // 直接使用引擎
                function doPlay(engine) {
                    if (engine === 'google') {
                        playGoogleTTS(function(success, msg) {
                            cb(success);
                        });
                    } else {
                        playWebSpeech(function(success, msg) {
                            cb(success);
                        });
                    }
                }
                if (engineMode === 'google') {
                    doPlay('google');
                } else if (engineMode === 'web') {
                    doPlay('web');
                } else {
                    // auto: 先 google，失败降级
                    playGoogleTTS(function(success, msg) {
                        if (success) {
                            cb(true);
                        } else {
                            playWebSpeech(function(s2, m2) {
                                cb(s2);
                            });
                        }
                    });
                }
            }

            repeatPlay(function(success) {
                if (!isRepeating) return;
                if (!success) {
                    isRepeating = false;
                    dom.repeatBtn.textContent = '🔁 复读（5次）';
                    dom.repeatBtn.classList.remove('active');
                    dom.status.textContent = '⚠️ 复读中断';
                    dom.status.className = 'status error';
                    showToast('复读失败，请检查网络或切换引擎');
                    return;
                }
                repeatCount++;
                if (repeatCount >= repeatMax) {
                    isRepeating = false;
                    dom.repeatBtn.textContent = '🔁 复读（5次）';
                    dom.repeatBtn.classList.remove('active');
                    dom.status.textContent = `✅ 复读完成 (${repeatMax}次)`;
                    dom.status.className = 'status done';
                    clearTimeout(statusResetTimer);
                    statusResetTimer = setTimeout(() => {
                        if (!isSpeaking && !currentAudio && !currentUtterance && !isRepeating) {
                            dom.status.textContent = '准备好了';
                            dom.status.className = 'status';
                        }
                        statusResetTimer = null;
                    }, 2000);
                    return;
                }
                repeatTimer = setTimeout(() => {
                    if (isRepeating) doRepeatPlay();
                }, 800);
            });
        }

        // ===== 引擎切换 =====
        function toggleEngine() {
            stopAll();
            if (engineMode === 'auto') {
                engineMode = 'web';
                dom.engineBtn.textContent = '🌐 当前：强制原生语音';
                showToast('已切换至强制原生语音');
            } else if (engineMode === 'web') {
                engineMode = 'google';
                dom.engineBtn.textContent = '🌐 当前：强制 Google TTS';
                showToast('已切换至强制 Google TTS');
            } else {
                engineMode = 'auto';
                dom.engineBtn.textContent = '🌐 当前：自动（Google优先）';
                showToast('已切换至自动模式');
            }
            dom.status.textContent = '准备好了';
            dom.status.className = 'status';
        }

        // ===== 测试引擎 =====
        function testEngine() {
            stopAll();
            dom.status.textContent = '🧪 正在测试引擎...';
            dom.status.className = 'status warning';
            const currentIdx = currentIndex;
            // 保存当前句子，测试播放“Hello”
            const testSentence = { en: "Hello.", cn: "你好。" };
            // 临时替换
            const original = lessons[currentIndex];
            lessons[currentIndex] = testSentence;
            // 播放
            isPlayLocked = false; // 解锁
            playCurrent();
            // 恢复
            setTimeout(() => {
                lessons[currentIndex] = original;
                showSentence();
                dom.status.textContent = '✅ 引擎测试完成，请查看上方状态';
                dom.status.className = 'status done';
            }, 3000);
        }

        // ===== 显示句子 =====
        function showSentence() {
            const item = lessons[currentIndex];
            if (!item) return;
            dom.scene.textContent = item.scene;
            dom.progress.textContent = `第 ${currentIndex + 1} / ${lessons.length} 句`;
            dom.english.textContent = item.en;
            dom.chinese.textContent = item.cn;
            if (!isSpeaking && !currentAudio && !currentUtterance && !isRepeating) {
                dom.status.textContent = '准备好了';
                dom.status.className = 'status';
            }
        }

        // ===== 导航 =====
        function nextSentence() { stopAll();
            currentIndex = (currentIndex + 1) % lessons.length;
            showSentence(); }

        function previousSentence() { stopAll();
            currentIndex = (currentIndex - 1 + lessons.length) % lessons.length;
            showSentence(); }

        function randomSentence() { stopAll();
            currentIndex = Math.floor(Math.random() * lessons.length);
            showSentence();
            dom.status.textContent = '🎲 已选择随机句子';
            dom.status.className = 'status';
            showToast('🎲 随机跳转'); }

        // ===== 搜索 =====
        function searchSentence() {
            const keyword = dom.searchInput.value.trim();
            const resultsEl = dom.results;
            if (!keyword) { resultsEl.innerHTML = '';
                showToast('请输入关键词'); return; }
            const lower = keyword.toLowerCase();
            const matches = [];
            lessons.forEach((item, idx) => {
                if (item.en.toLowerCase().includes(lower) || item.cn.includes(keyword)) {
                    matches.push({ ...item, index: idx });
                }
            });
            if (!matches.length) {
                resultsEl.innerHTML = `<div class="no-result">🔍 没有找到相关句子</div>`;
                return;
            }
            let html = '';
            matches.forEach(m => {
                html += `<div class="result" data-index="${m.index}">
                                <div class="result-en">${m.en}</div>
                                <div class="result-cn">${m.cn}</div>
                            </div>`;
            });
            resultsEl.innerHTML = html;
            resultsEl.querySelectorAll('.result').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < lessons.length) {
                        stopAll();
                        currentIndex = idx;
                        showSentence();
                        resultsEl.innerHTML = '';
                        dom.searchInput.value = '';
                        dom.searchInput.blur();
                        dom.status.textContent = '准备好了';
                        dom.status.className = 'status';
                        showToast('已跳转');
                    }
                });
            });
            resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', function(e) {
            if (document.activeElement === dom.searchInput) return;
            switch (e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousSentence();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextSentence();
                    break;
                case ' ':
                    e.preventDefault();
                    if (isSpeaking) {
                        stopAll();
                        dom.status.textContent = '⏸ 已停止';
                        dom.status.className = 'status';
                        showToast('⏸ 已停止');
                    } else {
                        playCurrent();
                    }
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    toggleRepeat();
                    break;
            }
        });
        dom.searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault();
                searchSentence(); }
        });

        // ===== 初始化 =====
        if (currentIndex >= lessons.length) currentIndex = 0;
        showSentence();

        // 检测原生语音支持
        if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
            // 原生不可用，强制 Google
            engineMode = 'google';
            dom.engineBtn.textContent = '🌐 当前：强制 Google TTS';
            showToast('原生语音不可用，已切换至 Google TTS', 3000);
        }

        // 暴露全局
        window.playCurrent = playCurrent;
        window.repeatCurrent = repeatCurrent;
        window.nextSentence = nextSentence;
        window.previousSentence = previousSentence;
        window.randomSentence = randomSentence;
        window.searchSentence = searchSentence;
        window.toggleRepeat = toggleRepeat;
        window.toggleEngine = toggleEngine;
        window.testEngine = testEngine;

        console.log('🎧 每句练耳 · 最终稳定版 已加载');
        console.log(`📚 共 ${lessons.length} 个句子`);
        console.log(`⚙️ 引擎模式: ${engineMode}`);
        console.log('⌨ 快捷键: 左右方向键切换 · 空格键播放/停止 · R 键复读');
    </script>

</body>

</html>
