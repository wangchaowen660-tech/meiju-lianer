.stage-icon{font-size:42px;line-height:1;margin-bottom:14px}
.instruction{font-size:14px;color:#8895a4;line-height:1.6}
.sentence{display:none;font-size:26px;font-weight:700;line-height:1.35;letter-spacing:-.3px;color:#1a202c}
.sentence.show{display:block}
.translation{display:none;font-size:15px;color:#6b7684;line-height:1.6;margin-top:10px}
.translation.show{display:block}
.hint-panel{display:none;margin-top:18px;text-align:left;background:#fffaf0;border-radius:14px;padding:16px}
.hint-panel.show{display:block}

.hint-notes{font-size:13px;color:#7a6b4a;line-height:1.9}
.hint-notes div::before{content:"· ";color:#c9b375;font-weight:700}
.chunk-panel{display:none;margin-top:18px;text-align:left;background:#f0f5ff;border-radius:14px;padding:14px}
.chunk-panel.show{display:block}
.chunk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.chunk-title{font-size:12px;font-weight:700;color:#4a6fa5;letter-spacing:.5px;flex:1}
.chunk-actions{display:flex;gap:5px}
.chunk-act{font-size:11.5px;font-weight:600;padding:6px 10px;background:#1a202c;color:#fff;border:none;border-radius:9px;cursor:pointer;font-family:inherit;transition:transform .12s ease;white-space:nowrap}
.chunk-act.alt{background:#4a6fa5}
.chunk-act:active{transform:scale(.94)}
.chunk-list{display:flex;flex-wrap:wrap;gap:6px}
.chunk-item{padding:8px 12px;background:#fff;border:1px solid #dae5f5;border-radius:10px;font-size:14px;font-weight:600;color:#2c4a75;cursor:pointer;font-family:inherit;transition:all .15s ease;line-height:1.3;text-align:left}
.chunk-item:active{transform:scale(.96)}
.chunk-item.playing{background:#1a202c;color:#fff;border-color:#1a202c}
.chunk-item.chain{background:#4a6fa5;color:#fff;border-color:#4a6fa5}
.chunk-note{margin-top:10px;font-size:11.5px;color:#7a8aa0;line-height:1.6}
.chips{display:flex;gap:8px;margin-top:22px;margin-bottom:12px}
.chip{flex:1;padding:11px 6px;font-size:13px;font-weight:600;background:#f3f5f8;color:#4a5563;border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:all .15s ease}
.chip:active{transform:scale(.97)}
.chip.active{background:#1a202c;color:#fff}
.play{width:100%;padding:17px;font-size:17px;font-weight:700;background:#1a202c;color:#fff;border:none;border-radius:16px;cursor:pointer;font-family:inherit;letter-spacing:.2px;transition:all .15s ease}

.nav-btn:active{transform:scale(.95)}
.speed-group{display:flex;flex:1;gap:3px;background:#fff;padding:4px;border-radius:13px;box-shadow:0 2px 8px rgba(20,30,50,.04)}

.speed.active{background:#1a202c;color:#fff}

.status{margin-top:14px;text-align:center;font-size:12.5px;color:#8895a4;min-height:18px;line-height:1.5}
.footer{text-align:center;font-size:11px;color:#b8c2ce;margin-top:28px;letter-spacing:.3px}
@media(max-width:380px){.sentence{font-size:22px}.stage-icon{font-size:36px}.chip{font-size:12px;padding:10px 4px}.chunk-act{font-size:11px;padding:5px 8px}}

  <button class="play" id="playBtn">🎧 听句子</button>

<nav class="nav">

<div class="status" id="status"></div>
<footer class="footer">Chaowen AI</footer>
</div>
