<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 对话版 · 场景 + 造句</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f0f4f8;padding:12px 10px 28px;color:#1e293b;}
.container{max-width:500px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px;}
.header-left{display:flex;align-items:center;gap:8px;}
.header-left h1{font-size:24px;font-weight:700;}
.header-left p{color:#94a3b8;font-size:13px;background:#eef2f6;padding:2px 12px;border-radius:30px;}
.header-right{display:flex;gap:6px;}
.fav-count{cursor:pointer;background:#e94560;color:#fff;padding:0 10px;border-radius:20px;font-size:13px;font-weight:600;line-height:24px;border:0;}
.pattern-selector{background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid #e2e8f0;}
.pattern-selector label{font-weight:600;font-size:13px;white-space:nowrap;}
.pattern-selector select{flex:1;min-width:100px;padding:4px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;outline:none;cursor:pointer;}
.pattern-selector .badge{background:#e94560;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.custom-chunk{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.custom-chunk input{flex:1;min-width:60px;padding:3px 6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;}
.custom-chunk button{padding:3px 10px;background:#8b5cf6;color:#fff;border:0;border-radius:6px;font-size:12px;cursor:pointer;}
.search-wrapper{display:flex;gap:4px;margin-bottom:8px;}
.search-wrapper .input-group{flex:1;display:flex;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:0 4px;height:34px;}
.search-wrapper .input-group input{flex:1;border:0;outline:none;font-size:13px;padding:0 4px;background:transparent;height:100%;}
.search-wrapper .input-group button{background:transparent;border:0;font-size:16px;cursor:pointer;padding:0 6px;color:#94a3b8;}
.search-wrapper .input-group button:hover{color:#1e293b;}
.results{margin-bottom:8px;}
.result{background:#fff;padding:8px 12px;margin-bottom:4px;border-radius:10px;cursor:pointer;border:1px solid #e2e8f0;}
.result-en{font-weight:600;font-size:15px;}
.result-cn{margin-top:2px;color:#475569;font-size:13px;}
.card{background:#fff;border-radius:16px;padding:16px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #e2e8f0;}
.scene{color:#94a3b8;font-size:12px;font-weight:500;}
.progress{color:#94a3b8;font-size:11px;margin-top:1px;}
.dialog-area{margin:8px 0;max-height:320px;overflow-y:auto;}
.dialog-item{display:flex;flex-direction:column;margin-bottom:8px;border-radius:12px;padding:8px 12px;background:#f8fafc;border-left:3px solid #e94560;}
.dialog-item .q-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.dialog-item .q-label{font-weight:700;font-size:13px;color:#e94560;}
.dialog-item .q-text{font-weight:600;font-size:15px;color:#1e293b;flex:1;}
.dialog-item .a-row{display:flex;align-items:center;gap:6px;margin-top:2px;padding-left:16px;border-left:2px solid #e2e8f0;}
.dialog-item .a-label{font-weight:700;font-size:13px;color:#8b5cf6;}
.dialog-item .a-text{font-size:15px;color:#475569;flex:1;}
.dialog-item .cn-text{font-size:13px;color:#94a3b8;margin-top:4px;padding-left:16px;}
.dialog-item .play-btns{display:flex;gap:4px;flex-shrink:0;}
.dialog-item .play-btns button{background:transparent;border:0;font-size:18px;cursor:pointer;color:#94a3b8;padding:0 2px;}
.dialog-item .play-btns button:hover{color:#1e293b;}
.dialog-controls{display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap;}
.dialog-controls button{background:#e2e8f0;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;color:#1e293b;}
.dialog-controls button:hover{background:#cbd5e1;}
.dialog-controls .play-all{background:#e94560;color:#fff;}
.dialog-controls .play-all:hover{background:#c73a54;}
.english{min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px 4px;font-size:22px;font-weight:700;background:#f8fafc;border-radius:8px;margin:4px 0;position:relative;}
.english .fav-btn{background:transparent;border:0;font-size:20px;cursor:pointer;color:#94a3b8;padding:0 4px;}
.english .fav-btn.active{color:#f59e0b;}
.english .copy-btn{background:transparent;border:0;font-size:18px;cursor:pointer;color:#94a3b8;padding:0 4px;}
.english .copy-btn:hover{color:#1e293b;}
.chinese{min-height:28px;font-size:16px;color:#475569;padding:4px 8px;background:#f8fafc;border-radius:8px;}
.sentence-hint{font-size:11px;color:#94a3b8;margin-top:2px;}
.sentence-hint .highlight{color:#e94560;font-weight:600;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
.ctrl-btn{background:#e2e8f0;border:0;padding:0;cursor:pointer;font-size:22px;color:#1e293b;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:active{transform:scale(0.9);}
.ctrl-btn.play-btn{width:52px;height:52px;font-size:28px;background:#e94560;color:#fff;}
.ctrl-btn.cn-btn{background:#f59e0b;color:#fff;width:38px;height:38px;font-size:18px;}
.speed-control{display:flex;align-items:center;gap:4px;}
.speed-btn{background:#e2e8f0;border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;cursor:pointer;}
.speed-btn.active{background:#e94560;color:#fff;border-color:#e94560;}
.extra-buttons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;justify-content:center;}
.extra-buttons button{padding:4px 10px;border:0;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:#e2e8f0;color:#1e293b;}
.extra-buttons button.active{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn:hover{background:#dc2626;}
.extra-buttons .chunk-toggle-btn{background:#8b5cf6;color:#fff;}
.chunk-area-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.3s ease, opacity 0.2s ease;margin:0;}
.chunk-area-wrap.open{max-height:400px;opacity:1;margin-top:8px;}
.chunk-area{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;max-height:200px;overflow-y:auto;}
.chunk-item{cursor:pointer;padding:3px 10px;background:#eef2f6;border-radius:14px;font-size:13px;border:1px solid transparent;transition:0.15s;user-select:none;}
.chunk-item:hover{background:#dce2ea;}
.chunk-item.active{background:#e94560;color:#fff;border-color:#e94560;}
.chunk-item.custom{background:#8b5cf6;color:#fff;}
.chunk-item.custom:hover{background:#7c3aed;}
.status{min-height:20px;margin-top:4px;color:#94a3b8;font-size:12px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}
.status.paused{color:#f59e0b;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:6px 16px;border-radius:40px;opacity:0;pointer-events:none;transition:0.3s;z-index:999;font-size:13px;font-weight:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.divider{height:1px;background:#e2e8f0;margin:12px 0;}
@media(max-width:480px){.english{font-size:18px;}.chunk-item{font-size:12px;padding:2px 8px;}.ctrl-btn{width:34px;height:34px;font-size:18px;}.ctrl-btn.play-btn{width:46px;height:46px;font-size:24px;}.ctrl-btn.cn-btn{width:34px;height:34px;font-size:16px;}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header">
  <div class="header-left"><h1>🧩 对讲机</h1><p>场景对话 + 造句</p></div>
  <div class="header-right">
    <button class="fav-count" id="favCountBtn">⭐ 0</button>
  </div>
</div>

<!-- 场景选择 -->
<div class="pattern-selector">
  <label>📌 场景</label>
  <select id="dialogSceneSelect"></select>
  <span class="badge" id="dialogCount">0 组</span>
</div>

<!-- 搜索 -->
<div class="search-wrapper">
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="搜索对话或句子">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<!-- 主卡片 -->
<div class="card">
  <div class="scene" id="scene">对话场景</div>
  <div class="progress" id="progress">加载中...</div>

  <!-- 对话区域 -->
  <div class="dialog-area" id="dialogArea"></div>

  <!-- 对话控制 -->
  <div class="dialog-controls">
    <button onclick="prevDialog()">⏮ 上一</button>
    <button class="play-all" onclick="playDialogAll()">▶ 整组</button>
    <button onclick="playDialogQ()">🔊 问</button>
    <button onclick="playDialogA()">🔊 答</button>
    <button onclick="nextDialog()">下一 ⏭</button>
  </div>

  <div class="divider"></div>

  <!-- 造句练习 -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0;">
    <span style="font-weight:600;font-size:15px;">📝 造句练习</span>
    <button class="chunk-toggle-btn" onclick="toggleChunkList()" style="border:0;border-radius:20px;padding:2px 12px;font-size:12px;cursor:pointer;">📋 词块</button>
  </div>
  <div style="background:#f8fafc;padding:4px 10px;border-radius:8px;margin-bottom:6px;">
    <span id="patternDisplay" style="font-weight:bold;font-size:16px;">I want to...</span>
    <span style="color:#94a3b8;font-size:12px;margin-left:6px;" id="chunkCount">0 词块</span>
  </div>
  <div class="chunk-area-wrap" id="chunkAreaWrap">
    <div class="chunk-area" id="chunkArea"></div>
  </div>

  <div class="english" id="englishContainer">
    <span id="english">选择词块造句</span>
    <span class="action-buttons">
      <button class="copy-btn" onclick="copySentence()">📋</button>
      <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆</button>
    </span>
  </div>
  <div class="chinese" id="chinese">点击词块生成句子</div>
  <div class="sentence-hint" id="sentenceHint">💡 点击下方词块组合完整句</div>

  <div class="player-controls">
    <button class="ctrl-btn" onclick="prevChunk()">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
    <button class="ctrl-btn" onclick="nextChunk()">⏭</button>
    <div class="speed-control">
      <button class="speed-btn" data-speed="0.7" onclick="setSpeed(0.7)">0.7×</button>
      <button class="speed-btn active" data-speed="1.0" onclick="setSpeed(1.0)">1.0×</button>
      <button class="speed-btn" data-speed="1.3" onclick="setSpeed(1.3)">1.3×</button>
    </div>
  </div>

  <div class="extra-buttons">
    <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
    <button onclick="randomChunk()">🎲 随机</button>
    <button class="reset-audio-btn" onclick="resetAudio()">🔊 修复</button>
  </div>

  <div id="status" class="status">就绪</div>
</div>
<div style="text-align:center;margin-top:6px;font-size:11px;color:#94a3b8;">← 上一 · 下一 →</div>
</div>

];

// ========================================================================
// 4. 核心状态
// ========================================================================
let currentPatternId = 0;
let currentChunkIndex = 0;
let currentDialogIndex = 0;
let dialogList = [];
let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
let customChunks = JSON.parse(localStorage.getItem('customChunks')) || {};
let isSpeaking = false, isRepeating = false, repeatCount = 0, repeatTimer = null;
let speechRate = 1.0;
const REPEAT_TIMES = 5;

const dom = {
  scene: document.getElementById("scene"),
  progress: document.getElementById("progress"),
  patternDisplay: document.getElementById("patternDisplay"),
  chunkArea: document.getElementById("chunkArea"),
  chunkAreaWrap: document.getElementById("chunkAreaWrap"),
  chunkCount: document.getElementById("chunkCount"),
  english: document.getElementById("english"),
  chinese: document.getElementById("chinese"),
  sentenceHint: document.getElementById("sentenceHint"),
  status: document.getElementById("status"),
  playPauseBtn: document.getElementById("playPauseBtn"),
  favBtn: document.getElementById("favBtn"),
  favCountBtn: document.getElementById("favCountBtn"),
  searchInput: document.getElementById("searchInput"),
  results: document.getElementById("results"),
  dialogArea: document.getElementById("dialogArea"),
  dialogSceneSelect: document.getElementById("dialogSceneSelect"),
  dialogCount: document.getElementById("dialogCount"),
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ========================================================================
// 5. 语音引擎 - 稳定版
// ========================================================================
function speakText(text, callback) {
  if (!window.speechSynthesis) {
    dom.status.textContent = "❌ 不支持语音";
    dom.status.className = "status error";
    if (callback) callback(false);
    return;
  }

  try { window.speechSynthesis.cancel(); } catch(e) {}
  isSpeaking = false;
  dom.playPauseBtn.textContent = "▶";

  const clean = text.replace(/[.…]{2,}/g, '').trim();
  if (!clean) { if (callback) callback(false); return; }

  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = /[\u4e00-\u9fa5]/.test(clean) ? 'zh-CN' : 'en-US';
    utterance.rate = speechRate;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    let ended = false;
    utterance.onstart = function() {
      isSpeaking = true;
      dom.playPauseBtn.textContent = "⏸";
      dom.status.textContent = "🔊 朗读中...";
      dom.status.className = "status speaking";
    };
    utterance.onend = function() {
      if (ended) return;
      ended = true;
      isSpeaking = false;
      dom.playPauseBtn.textContent = "▶";
      dom.status.textContent = "✅ 播放完成";
      dom.status.className = "status done";
      if (callback) callback(true);
    };
    utterance.onerror = function(e) {
      if (ended) return;
      ended = true;
      isSpeaking = false;
      dom.playPauseBtn.textContent = "▶";
      dom.status.textContent = "⚠️ 错误: " + (e.error || '未知');
      dom.status.className = "status error";
      if (callback) callback(false);
    };
    try { window.speechSynthesis.speak(utterance); } catch(err) {
      dom.status.textContent = "❌ 异常: " + err.message;
      dom.status.className = "status error";
      if (callback) callback(false);
    }
  }, 50);
}

// ========================================================================
// 6. 造句练习
// ========================================================================
function getChunksForPattern(pid) {
  const p = patternList[pid];
  const end = Math.min(p.start + p.count, chunkPool.length);
  const base = [];
  for (let i = p.start; i < end; i++) base.push({ index: i, ...chunkPool[i], custom: false });
  const custom = (customChunks[pid] || []).map((c, idx) => ({ ...c, custom: true, index: 1000 + idx }));
  return [...base, ...custom];
}

function loadPattern(pid) {
  currentPatternId = pid;
  const p = patternList[pid];
  const chunks = getChunksForPattern(pid);
  dom.patternDisplay.textContent = p.pattern;
  dom.chunkCount.textContent = chunks.length;
  dom.chunkArea.innerHTML = '';
  chunks.forEach((chunk, idx) => {
    const span = document.createElement('span');
    span.className = 'chunk-item' + (chunk.custom ? ' custom' : '');
    span.textContent = chunk.en;
    span.dataset.index = idx;
    span.dataset.en = chunk.en;
    span.dataset.cn = chunk.cn;
    span.dataset.custom = chunk.custom ? 'true' : 'false';
    span.onclick = function(e) { e.stopPropagation(); playChunk(this); };
    dom.chunkArea.appendChild(span);
  });
  // 默认选中第一个
  const first = dom.chunkArea.querySelector('.chunk-item');
  if (first) setTimeout(() => playChunk(first), 100);
}

function playChunk(el) {
  try { window.speechSynthesis.cancel(); } catch(e) {}
  isSpeaking = false;
  dom.playPauseBtn.textContent = "▶";

  dom.chunkArea.querySelectorAll('.chunk-item').forEach(item => item.classList.remove('active'));
  el.classList.add('active');

  const en = el.dataset.en;
  const cn = el.dataset.cn;
  const p = patternList[currentPatternId];
  const fullEn = p.pattern.replace(/\.{3}/g, en);
  const fullCn = p.cnPrefix + cn;

  dom.english.textContent = fullEn;
  dom.chinese.textContent = fullCn;
  dom.sentenceHint.innerHTML = '✅ 造句连读：<span class="highlight">' + en + '</span> (' + cn + ')';
  updateFavUI();

  speakText(fullEn);
}

function prevChunk() {
  const items = dom.chunkArea.querySelectorAll('.chunk-item');
  if (!items.length) return;
  let idx = 0;
  items.forEach((el, i) => { if (el.classList.contains('active')) idx = i; });
  const newIdx = (idx - 1 + items.length) % items.length;
  playChunk(items[newIdx]);
}

function nextChunk() {
  const items = dom.chunkArea.querySelectorAll('.chunk-item');
  if (!items.length) return;
  let idx = 0;
  items.forEach((el, i) => { if (el.classList.contains('active')) idx = i; });
  const newIdx = (idx + 1) % items.length;
  playChunk(items[newIdx]);
}

function togglePlayPause() {
  if (isSpeaking) {
    try { window.speechSynthesis.cancel(); } catch(e) {}
    isSpeaking = false;
    dom.playPauseBtn.textContent = "▶";
    dom.status.textContent = "⏸ 暂停";
    dom.status.className = "status paused";
  } else {
    const active = dom.chunkArea.querySelector('.chunk-item.active');
    if (active) playChunk(active);
    else {
      const first = dom.chunkArea.querySelector('.chunk-item');
      if (first) playChunk(first);
    }
  }
}

function playChinese() {
  const text = dom.chinese.textContent;
  if (!text) return;
  speakText(text);
}

function randomChunk() {
  const items = dom.chunkArea.querySelectorAll('.chunk-item');
  if (!items.length) return;
  const idx = Math.floor(Math.random() * items.length);
  playChunk(items[idx]);
}

function toggleRepeat() {
  if (isRepeating) {
    isRepeating = false;
    clearTimeout(repeatTimer);
    dom.status.textContent = "⏸ Repeat stopped";
    dom.status.className = "status paused";
    return;
  }
  isRepeating = true;
  repeatCount = 0;
  doRepeat();
}

function doRepeat() {
  if (!isRepeating) return;
  repeatCount++;
  dom.status.textContent = `🔁 Repeat ${repeatCount}/${REPEAT_TIMES}`;
  dom.status.className = "status speaking";
  const text = dom.english.textContent;
  if (!text) { isRepeating = false; return; }
  speakText(text, function(success) {
    if (!success || !isRepeating) { isRepeating = false; return; }
    if (repeatCount >= REPEAT_TIMES) {
      isRepeating = false;
      dom.status.textContent = "✅ Repeat done";
      dom.status.className = "status done";
      return;
    }
    repeatTimer = setTimeout(doRepeat, 500);
  });
}

function setSpeed(rate) {
  speechRate = rate;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === rate));
  localStorage.setItem('speechRate', rate);
}
const savedRate = parseFloat(localStorage.getItem('speechRate')) || 1.0;
setSpeed(savedRate);

function resetAudio() {
  try { window.speechSynthesis.cancel(); } catch(e) {}
  isSpeaking = false;
  dom.playPauseBtn.textContent = "▶";
  dom.status.textContent = "🔄 音频重置完成";
  dom.status.className = "status done";
  showToast("音频已重置");
}

function toggleChunkList() {
  dom.chunkAreaWrap.classList.toggle('open');
}

function copySentence() {
  const text = dom.english.textContent + '\n' + dom.chinese.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('📋 已复制'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 已复制');
  }
}

// ========================================================================
// 7. 收藏
// ========================================================================
function updateFavUI() {
  dom.favCountBtn.textContent = '⭐ ' + favorites.length;
  const cur = dom.english.textContent;
  const isFav = favorites.some(f => f.en === cur);
  dom.favBtn.textContent = isFav ? '★' : '☆';
  dom.favBtn.classList.toggle('active', isFav);
}

function toggleFav() {
  const en = dom.english.textContent;
  const cn = dom.chinese.textContent;
  const chunkEn = dom.chunkArea.querySelector('.chunk-item.active')?.dataset.en || '';
  const idx = favorites.findIndex(f => f.en === en);
  if (idx >= 0) {
    favorites.splice(idx, 1);
    showToast('已取消收藏');
  } else {
    favorites.push({ en, cn, chunkEn, pattern: patternList[currentPatternId].pattern, patternId: currentPatternId });
    showToast('⭐ 已收藏');
  }
  localStorage.setItem('favorites', JSON.stringify(favorites));
  updateFavUI();
}

dom.favCountBtn.addEventListener('click', function() {
  if (!favorites.length) { showToast('暂无收藏'); return; }
  dom.results.innerHTML = '<div style="text-align:center;font-weight:600;margin:4px 0;">⭐ 收藏列表</div>';
  favorites.slice().reverse().forEach(f => {
    const box = document.createElement('div');
    box.className = 'result';
    box.innerHTML = `<div class="result-en">${f.en}</div><div class="result-cn">${f.cn}</div>`;
    box.onclick = function() {
      const pid = f.patternId || 0;
      // 切换到对应母句（但无需切换场景，只改词块）
      const select = document.createElement('select'); // 模拟选择
      // 直接加载母句
      loadPattern(pid);
      setTimeout(() => {
        const items = dom.chunkArea.querySelectorAll('.chunk-item');
        let target = null;
        items.forEach(el => { if (el.dataset.en === f.chunkEn) target = el; });
        if (target) playChunk(target);
        else showToast('词块已不存在');
      }, 200);
      dom.results.innerHTML = '';
    };
    dom.results.appendChild(box);
  });
});

// ========================================================================
// 8. 对话
// ========================================================================
function getDialogScenes() { const s = new Set(); dialogPool.forEach(d => s.add(d.scene)); return Array.from(s); }
function getDialogByScene(scene) { return dialogPool.filter(d => d.scene === scene); }

function populateDialogScenes() {
  const select = dom.dialogSceneSelect;
  const scenes = getDialogScenes();
  select.innerHTML = '';
  scenes.forEach(scene => {
    const opt = document.createElement('option');
    opt.value = scene;
    opt.textContent = scene + ' (' + getDialogByScene(scene).length + '组)';
    select.appendChild(opt);
  });
  select.value = '问候';
  select.addEventListener('change', function() {
    currentDialogScene = this.value;
    currentDialogIndex = 0;
    loadDialogScene(currentDialogScene);
  });
  loadDialogScene('问候');
}

let currentDialogScene = '问候';
function loadDialogScene(scene) {
  dialogList = getDialogByScene(scene);
  dom.dialogCount.textContent = dialogList.length + ' 组';
  if (!dialogList.length) { dom.dialogArea.innerHTML = '<div style="padding:12px;color:#94a3b8;">暂无对话</div>'; return; }
  if (currentDialogIndex >= dialogList.length) currentDialogIndex = 0;
  showDialogItem(currentDialogIndex);
}

function showDialogItem(index) {
  if (!dialogList.length) return;
  if (index >= dialogList.length) index = 0;
  if (index < 0) index = dialogList.length - 1;
  currentDialogIndex = index;
  const d = dialogList[index];
  dom.dialogArea.innerHTML = `
    <div class="dialog-item">
      <div class="q-row">
        <span class="q-label">问</span>
        <span class="q-text">${d.q}</span>
        <span class="play-btns"><button onclick="playSingleQ('${d.q}')">🔊</button></span>
      </div>
      <div class="a-row">
        <span class="a-label">答</span>
        <span class="a-text">${d.a}</span>
        <span class="play-btns"><button onclick="playSingleA('${d.a}')">🔊</button></span>
      </div>
      <div class="cn-text">${d.cn}</div>
    </div>
  `;
  dom.scene.textContent = '对讲机 · ' + d.scene;
  dom.progress.textContent = '第 ' + (index+1) + '/' + dialogList.length + ' 组';
}

function playSingleQ(t) { speakText(t); }
function playSingleA(t) { speakText(t); }

function prevDialog() {
  if (!dialogList.length) return;
  currentDialogIndex = (currentDialogIndex - 1 + dialogList.length) % dialogList.length;
  showDialogItem(currentDialogIndex);
}
function nextDialog() {
  if (!dialogList.length) return;
  currentDialogIndex = (currentDialogIndex + 1) % dialogList.length;
  showDialogItem(currentDialogIndex);
}
function playDialogQ() {
  if (!dialogList.length || currentDialogIndex >= dialogList.length) return;
  speakText(dialogList[currentDialogIndex].q);
}
function playDialogA() {
  if (!dialogList.length || currentDialogIndex >= dialogList.length) return;
  speakText(dialogList[currentDialogIndex].a);
}
function playDialogAll() {
  if (!dialogList.length || currentDialogIndex >= dialogList.length) return;
  const d = dialogList[currentDialogIndex];
  speakText(d.q, function() { setTimeout(function() { speakText(d.a); }, 300); });
}

// ========================================================================
// 9. 搜索
// ========================================================================
function searchSentence() {
  const kw = dom.searchInput.value.trim().toLowerCase();
  dom.results.innerHTML = "";
  if (!kw) { showToast("输入关键词搜索"); return; }
  // 搜索对话
  const dialogMatches = dialogPool.filter(d => d.q.toLowerCase().includes(kw) || d.a.toLowerCase().includes(kw) || d.cn.includes(kw));
  // 搜索造句（从词库中匹配）
  const chunkMatches = chunkPool.filter(c => c.en.includes(kw) || c.cn.includes(kw));
  if (!dialogMatches.length && !chunkMatches.length) { dom.results.innerHTML = '<div class="no-result">🔍 未找到匹配</div>'; return; }
  dialogMatches.slice(0, 15).forEach(d => {
    const box = document.createElement('div');
    box.className = 'result';
    box.innerHTML = `<div class="result-en">💬 Q: ${d.q}<br>A: ${d.a}</div><div class="result-cn">${d.cn}</div>`;
    box.onclick = function() {
      const scenes = getDialogScenes();
      if (scenes.includes(d.scene)) {
        dom.dialogSceneSelect.value = d.scene;
        loadDialogScene(d.scene);
        const idx = dialogList.findIndex(item => item.q === d.q && item.a === d.a);
        if (idx >= 0) showDialogItem(idx);
      }
      dom.results.innerHTML = '';
      dom.searchInput.value = '';
      showToast("跳转到对话");
    };
    dom.results.appendChild(box);
  });
  chunkMatches.slice(0, 10).forEach(c => {
    const box = document.createElement('div');
    box.className = 'result';
    box.innerHTML = `<div class="result-en">🧩 ${c.en}</div><div class="result-cn">${c.cn}</div>`;
    box.onclick = function() {
      // 在当前母句下高亮该词块
      const items = dom.chunkArea.querySelectorAll('.chunk-item');
      let target = null;
      items.forEach(el => { if (el.dataset.en === c.en) target = el; });
      if (target) playChunk(target);
      else showToast('当前母句无此词块，请切换母句');
      dom.results.innerHTML = '';
      dom.searchInput.value = '';
    };
    dom.results.appendChild(box);
  });
}

// ========================================================================
// 10. 自定义词块
// ========================================================================
function addCustomChunk() {
  const enInput = document.getElementById('customChunkEn');
  const cnInput = document.getElementById('customChunkCn');
  const en = enInput.value.trim(), cn = cnInput.value.trim();
  if (!en || !cn) { showToast('请输入英文和中文'); return; }
  const pid = currentPatternId;
  if (!customChunks[pid]) customChunks[pid] = [];
  if (customChunks[pid].some(c => c.en === en)) { showToast('该词块已存在'); return; }
  customChunks[pid].push({ en, cn });
  localStorage.setItem('customChunks', JSON.stringify(customChunks));
  enInput.value = ''; cnInput.value = '';
  loadPattern(pid);
  showToast('✅ 已添加自定义词块');
}

// ========================================================================
// 11. 初始化
// ========================================================================
function initApp() {
  // 加载第一个母句
  loadPattern(0);

  // 加载对话场景
  populateDialogScenes();

  // 预加载语音
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
  }

  // 键盘快捷键
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevChunk(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); nextChunk(); }
    if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
    if (e.key === 'r' || e.key === 'R') { toggleRepeat(); }
    if (e.key === 'c' || e.key === 'C') { playChinese(); }
  });

  console.log('🧩 统一对话版启动，对话场景:', getDialogScenes().length);
}

window.addEventListener('load', initApp);
</script>
