<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 中英双语 · 英语播放器</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e3ecf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 44px;
            padding: 30px 32px 36px;
            box-shadow: 0 30px 60px -12px rgba(0, 20, 40, 0.30),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: all 0.2s ease;
        }

        /* ===== 标题 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1e2e;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #4f6b84;
            letter-spacing: 0;
        }

        .progress-badge {
            background: rgba(45, 75, 101, 0.10);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            color: #1a2e3f;
            border: 1px solid rgba(45, 75, 101, 0.08);
            white-space: nowrap;
        }

        /* ===== 句子卡片 ===== */
        .sentence-card {
            background: rgba(255, 255, 255, 0.65);
            border-radius: 32px;
            padding: 28px 28px 24px;
            margin: 8px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .sentence-card .lang-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
        }

        .sentence-card .lang-row .label {
            font-size: 13px;
            font-weight: 600;
            color: #6a7f94;
            min-width: 42px;
            letter-spacing: 0.5px;
            padding-top: 2px;
        }

        .sentence-card .lang-row .text {
            flex: 1;
            font-size: 24px;
            font-weight: 500;
            color: #0b1e2e;
            line-height: 1.6;
            word-break: break-word;
        }

        .sentence-card .lang-row .text.zh {
            font-size: 22px;
            font-weight: 450;
            color: #1f3a4e;
        }

        .sentence-card .lang-row .speak-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.08);
            color: #1a2e3f;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sentence-card .lang-row .speak-btn.zh-btn {
            background: rgba(234, 88, 12, 0.08);
        }

        .sentence-card .lang-row .speak-btn:hover {
            background: rgba(59, 130, 246, 0.18);
            transform: scale(1.05);
        }

        .sentence-card .lang-row .speak-btn.zh-btn:hover {
            background: rgba(234, 88, 12, 0.18);
        }

        .sentence-card .lang-row .speak-btn:active {
            transform: scale(0.92);
        }

        .sentence-card .lang-row .speak-btn.speaking {
            background: #3b82f6;
            color: #fff;
            box-shadow: 0 0 0 8px rgba(59, 130, 246, 0.12);
            animation: pulse-ring 1s ease-in-out infinite;
        }

        .sentence-card .lang-row .speak-btn.zh-btn.speaking {
            background: #ea580c;
            box-shadow: 0 0 0 8px rgba(234, 88, 12, 0.12);
            animation-name: pulse-ring-orange;
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.10); }
            50% { box-shadow: 0 0 0 14px rgba(59, 130, 246, 0.02); }
        }
        @keyframes pulse-ring-orange {
            0%, 100% { box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.10); }
            50% { box-shadow: 0 0 0 14px rgba(234, 88, 12, 0.02); }
        }

        .sentence-card .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(45, 75, 101, 0.08), transparent);
            margin: 8px 0 6px;
        }

        /* ===== 控制栏 ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 18px;
            padding: 6px 0;
        }

        .controls .ctrl-btn {
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            color: #1a2e3f;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(45, 75, 101, 0.06);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(45, 75, 101, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 20, 40, 0.06);
        }

        .controls .ctrl-btn:active {
            transform: scale(0.94);
        }

        .controls .ctrl-btn.primary {
            background: #1a2e3f;
            color: #fff;
            border-color: #1a2e3f;
        }

        .controls .ctrl-btn.primary:hover {
            background: #243e54;
            border-color: #243e54;
        }

        .controls .ctrl-btn.primary.playing {
            background: #3b82f6;
            border-color: #3b82f6;
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.25);
        }

        .controls .ctrl-btn.primary.playing:hover {
            background: #2563eb;
        }

        .controls .ctrl-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .controls .ctrl-btn.loop {
            font-size: 18px;
            background: rgba(255, 255, 255, 0.5);
            width: 48px;
            height: 48px;
        }

        .controls .ctrl-btn.loop.active {
            background: rgba(59, 130, 246, 0.12);
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .controls .ctrl-btn.loop.active-single {
            background: rgba(234, 88, 12, 0.12);
            border-color: #ea580c;
            color: #ea580c;
        }

        .controls .ctrl-btn.loop .badge {
            font-size: 10px;
            font-weight: 700;
            margin-left: 1px;
        }

        /* ===== 底部进度信息 ===== */
        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 14px;
            color: #4f6b84;
            padding: 0 4px;
        }

        .footer-info .counter {
            font-weight: 500;
        }

        .footer-info .status {
            font-weight: 400;
            opacity: 0.7;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .app-container {
                padding: 20px 16px 24px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header h1 small {
                font-size: 14px;
            }
            .sentence-card {
                padding: 20px 16px 18px;
            }
            .sentence-card .lang-row .text {
                font-size: 20px;
            }
            .sentence-card .lang-row .text.zh {
                font-size: 18px;
            }
            .sentence-card .lang-row .speak-btn {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
            .controls .ctrl-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .controls .ctrl-btn.loop {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 420px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .sentence-card .lang-row .text {
                font-size: 17px;
            }
            .sentence-card .lang-row .text.zh {
                font-size: 16px;
            }
        }

        /* ===== 淡入动画 ===== */
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- 标题 -->
    <div class="header">
        <h1>
            🎵 双语播放器
            <small>中 · 英</small>
        </h1>
        <div class="progress-badge" id="progressBadge">1 / 30</div>
    </div>

    <!-- 句子卡片 -->
    <div class="sentence-card fade-in" id="sentenceCard">
        <!-- 英文行 -->
        <div class="lang-row">
            <span class="label">🇬🇧 EN</span>
            <span class="text" id="enText">Hello, how are you?</span>
            <button class="speak-btn" id="enSpeakBtn" aria-label="朗读英文">🔊</button>
        </div>
        <div class="divider"></div>
        <!-- 中文行 -->
        <div class="lang-row">
            <span class="label">🇨🇳 中</span>
            <span class="text zh" id="zhText">你好，你好吗？</span>
            <button class="speak-btn zh-btn" id="zhSpeakBtn" aria-label="朗读中文">🔊</button>
        </div>
    </div>

    <!-- 控制栏 -->
    <div class="controls">
        <button class="ctrl-btn" id="prevBtn" title="上一句">⏮️</button>
        <button class="ctrl-btn" id="replayBtn" title="重听当前英文">🔁</button>
        <button class="ctrl-btn primary" id="playBtn" title="播放 / 暂停">▶️</button>
        <button class="ctrl-btn" id="nextBtn" title="下一句">⏭️</button>
        <button class="ctrl-btn loop" id="loopBtn" title="循环模式">🔂 <span class="badge" id="loopBadge">1</span></button>
    </div>

    <!-- 底部信息 -->
    <div class="footer-info">
        <span class="counter" id="counterDisplay">第 1 句</span>
        <span class="status" id="statusDisplay">就绪</span>
    </div>
</div>

<script>
    // ============================================================
    //  1. 句子库（中英双语，30 句）
    // ============================================================
    const SENTENCES = [
        { en: "Hello, how are you?", zh: "你好，你好吗？" },
        { en: "I'm fine, thank you.", zh: "我很好，谢谢。" },
        { en: "What's your name?", zh: "你叫什么名字？" },
        { en: "My name is Alex.", zh: "我叫亚历克斯。" },
        { en: "Where are you from?", zh: "你来自哪里？" },
        { en: "I'm from China.", zh: "我来自中国。" },
        { en: "How old are you?", zh: "你多大年纪？" },
        { en: "I'm twenty years old.", zh: "我二十岁。" },
        { en: "What do you do?", zh: "你是做什么的？" },
        { en: "I'm a student.", zh: "我是一名学生。" },
        { en: "Do you like music?", zh: "你喜欢音乐吗？" },
        { en: "Yes, I love it.", zh: "是的，我很喜欢。" },
        { en: "What time is it?", zh: "现在几点了？" },
        { en: "It's three o'clock.", zh: "现在三点钟。" },
        { en: "Can you help me?", zh: "你能帮我吗？" },
        { en: "Sure, no problem.", zh: "当然，没问题。" },
        { en: "Where is the station?", zh: "车站在哪里？" },
        { en: "Go straight ahead.", zh: "一直往前走。" },
        { en: "How much is this?", zh: "这个多少钱？" },
        { en: "It's ten dollars.", zh: "十美元。" },
        { en: "I like this color.", zh: "我喜欢这个颜色。" },
        { en: "It looks great on you.", zh: "你穿起来很好看。" },
        { en: "What's your hobby?", zh: "你的爱好是什么？" },
        { en: "I like reading books.", zh: "我喜欢读书。" },
        { en: "Let's go for a walk.", zh: "我们去散步吧。" },
        { en: "That's a good idea.", zh: "那是个好主意。" },
        { en: "I'm hungry.", zh: "我饿了。" },
        { en: "Let's eat something.", zh: "我们吃点东西吧。" },
        { en: "Thank you very much.", zh: "非常感谢。" },
        { en: "You're welcome.", zh: "不客气。" }
    ];

    // ============================================================
    //  2. 状态管理
    // ============================================================
    let currentIndex = 0;
    const total = SENTENCES.length;

    // 播放状态
    let isPlaying = false;          // 自动播放是否运行中
    let isPaused = false;           // 暂停标志（暂未使用，用isPlaying控制）
    let loopMode = 0;              // 0: 顺序一次, 1: 全部循环, 2: 单曲循环
    const LOOP_LABELS = ['➡️', '🔁', '🔂'];
    const LOOP_BADGES = ['1', '∞', '1'];

    // 语音控制
    let isSpeaking = false;
    let currentUtterance = null;
    let autoTimer = null;
    let isStoppedByUser = false;    // 标记是否用户手动停止

    // DOM 元素
    const enText = document.getElementById('enText');
    const zhText = document.getElementById('zhText');
    const enSpeakBtn = document.getElementById('enSpeakBtn');
    const zhSpeakBtn = document.getElementById('zhSpeakBtn');
    const prevBtn = document.getElementById('prevBtn');
    const replayBtn = document.getElementById('replayBtn');
    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loopBtn = document.getElementById('loopBtn');
    const loopBadge = document.getElementById('loopBadge');
    const counterDisplay = document.getElementById('counterDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const progressBadge = document.getElementById('progressBadge');
    const sentenceCard = document.getElementById('sentenceCard');

    // ============================================================
    //  3. 核心函数
    // ============================================================

    /** 更新界面显示当前句子 */
    function renderSentence(index) {
        const data = SENTENCES[index];
        enText.textContent = data.en;
        zhText.textContent = data.zh;
        progressBadge.textContent = `${index + 1} / ${total}`;
        counterDisplay.textContent = `第 ${index + 1} 句`;
        // 动画
        sentenceCard.classList.remove('fade-in');
        void sentenceCard.offsetWidth;
        sentenceCard.classList.add('fade-in');

        // 重置发音按钮状态
        resetSpeakBtn(enSpeakBtn);
        resetSpeakBtn(zhSpeakBtn);

        // 更新按钮状态
        prevBtn.disabled = (index === 0 && loopMode !== 1 && loopMode !== 2);
        nextBtn.disabled = (index === total - 1 && loopMode !== 1 && loopMode !== 2);

        // 更新状态文本
        if (isPlaying) {
            statusDisplay.textContent = '▶ 播放中';
        } else {
            statusDisplay.textContent = '⏸ 暂停';
        }
    }

    /** 重置发音按钮 */
    function resetSpeakBtn(btn) {
        btn.classList.remove('speaking');
        btn.textContent = '🔊';
    }

    /** 设置发音按钮为激活状态 */
    function setSpeakBtnActive(btn) {
        btn.classList.add('speaking');
        btn.textContent = '⏹';
    }

    /** 停止所有语音及定时器 */
    function stopAllSpeech() {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        if (autoTimer) {
            clearTimeout(autoTimer);
            autoTimer = null;
        }
        isSpeaking = false;
        if (currentUtterance) {
            currentUtterance = null;
        }
        resetSpeakBtn(enSpeakBtn);
        resetSpeakBtn(zhSpeakBtn);
    }

    /** 朗读文本 (返回 Promise) */
    function speakText(text, lang = 'en-US', onStart = null, onEnd = null) {
        return new Promise((resolve) => {
            if (!window.speechSynthesis) {
                console.warn('浏览器不支持语音');
                resolve();
                return;
            }

            // 停止当前语音
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.95;
            utterance.pitch = 1.0;
            utterance.volume = 1;

            // 选择合适的声音
            const voices = window.speechSynthesis.getVoices();
            let preferred = null;
            if (lang.startsWith('zh')) {
                preferred = voices.find(v => v.lang.startsWith('zh') && (v.name.includes('Tingting') || v.name.includes('Microsoft')));
            } else {
                preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('David')));
            }
            if (preferred) utterance.voice = preferred;

            currentUtterance = utterance;
            isSpeaking = true;

            if (onStart) onStart();

            utterance.onend = () => {
                isSpeaking = false;
                currentUtterance = null;
                if (onEnd) onEnd();
                resolve();
            };

            utterance.onerror = () => {
                isSpeaking = false;
                currentUtterance = null;
                if (onEnd) onEnd();
                resolve();
            };

            window.speechSynthesis.speak(utterance);
        });
    }

    /** 播放英文 */
    async function speakEn() {
        if (isSpeaking) {
            stopAllSpeech();
            // 如果正在播放，则只停止，不继续
            if (isPlaying) {
                // 暂停自动播放
                pauseAutoPlay();
            }
            return;
        }
        const data = SENTENCES[currentIndex];
        setSpeakBtnActive(enSpeakBtn);
        await speakText(
            data.en,
            'en-US',
            () => {},
            () => { resetSpeakBtn(enSpeakBtn); }
        );
        // 如果自动播放中，且没有停止，则继续
        if (isPlaying && !isStoppedByUser) {
            // 播放完英文后，自动播放下一个（延时）
            scheduleNext();
        }
    }

    /** 播放中文 (按需) */
    async function speakZh() {
        if (isSpeaking) {
            stopAllSpeech();
            // 暂停自动播放
            if (isPlaying) {
                pauseAutoPlay();
            }
            return;
        }
        const data = SENTENCES[currentIndex];
        setSpeakBtnActive(zhSpeakBtn);
        await speakText(
            data.zh,
            'zh-CN',
            () => {},
            () => { resetSpeakBtn(zhSpeakBtn); }
        );
        // 如果自动播放中，且没有停止，则继续
        if (isPlaying && !isStoppedByUser) {
            scheduleNext();
        }
    }

    /** 安排播放下一个（自动播放） */
    function scheduleNext() {
        if (autoTimer) clearTimeout(autoTimer);
        autoTimer = setTimeout(() => {
            if (isPlaying && !isSpeaking) {
                // 根据循环模式决定下一句
                let nextIndex = currentIndex + 1;
                if (loopMode === 2) {
                    // 单曲循环：重复当前句
                    nextIndex = currentIndex;
                } else if (loopMode === 1) {
                    // 全部循环
                    if (nextIndex >= total) nextIndex = 0;
                } else {
                    // 顺序一次
                    if (nextIndex >= total) {
                        // 播放完毕，停止自动播放
                        stopAutoPlay();
                        return;
                    }
                }
                // 如果索引变化，更新并播放
                if (nextIndex !== currentIndex) {
                    currentIndex = nextIndex;
                    renderSentence(currentIndex);
                }
                // 播放英文
                speakEn();
            }
        }, 600); // 间隔 0.6 秒
    }

    /** 启动自动播放 */
    function startAutoPlay() {
        if (isPlaying) return;
        stopAllSpeech();
        isPlaying = true;
        isStoppedByUser = false;
        playBtn.textContent = '⏸️';
        playBtn.classList.add('playing');
        statusDisplay.textContent = '▶ 播放中';
        // 如果当前是最后一首且顺序模式，从头开始
        if (loopMode === 0 && currentIndex === total - 1) {
            currentIndex = 0;
            renderSentence(currentIndex);
        }
        // 开始播放当前句英文
        speakEn();
    }

    /** 暂停自动播放 */
    function pauseAutoPlay() {
        if (isPlaying) {
            isPlaying = false;
            isStoppedByUser = true;
            stopAllSpeech();
            playBtn.textContent = '▶️';
            playBtn.classList.remove('playing');
            statusDisplay.textContent = '⏸ 暂停';
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
        }
    }

    /** 停止自动播放（完全停止） */
    function stopAutoPlay() {
        isPlaying = false;
        isStoppedByUser = true;
        stopAllSpeech();
        playBtn.textContent = '▶️';
        playBtn.classList.remove('playing');
        statusDisplay.textContent = '⏸ 暂停';
        if (autoTimer) {
            clearTimeout(autoTimer);
            autoTimer = null;
        }
    }

    /** 切换播放/暂停 */
    function togglePlay() {
        if (isPlaying) {
            pauseAutoPlay();
        } else {
            startAutoPlay();
        }
    }

    /** 重听当前句英文 */
    function replayCurrent() {
        if (isPlaying) {
            // 如果正在自动播放，暂停并重听
            pauseAutoPlay();
        }
        stopAllSpeech();
        // 播放英文
        speakEn();
    }

    /** 上一句 */
    function goPrev() {
        if (isPlaying) pauseAutoPlay();
        stopAllSpeech();
        let newIndex = currentIndex - 1;
        if (loopMode === 1) {
            if (newIndex < 0) newIndex = total - 1;
        } else if (loopMode === 2) {
            newIndex = currentIndex; // 单曲循环不变
        } else {
            if (newIndex < 0) newIndex = 0;
        }
        if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            renderSentence(currentIndex);
        }
        // 如果自动播放已停止，则保持
    }

    /** 下一句 */
    function goNext() {
        if (isPlaying) pauseAutoPlay();
        stopAllSpeech();
        let newIndex = currentIndex + 1;
        if (loopMode === 1) {
            if (newIndex >= total) newIndex = 0;
        } else if (loopMode === 2) {
            newIndex = currentIndex;
        } else {
            if (newIndex >= total) newIndex = total - 1;
        }
        if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            renderSentence(currentIndex);
        }
    }

    /** 切换循环模式 */
    function toggleLoop() {
        loopMode = (loopMode + 1) % 3; // 0->1->2->0
        updateLoopUI();
        // 更新按钮禁用状态
        prevBtn.disabled = (currentIndex === 0 && loopMode !== 1 && loopMode !== 2);
        nextBtn.disabled = (currentIndex === total - 1 && loopMode !== 1 && loopMode !== 2);
    }

    function updateLoopUI() {
        loopBtn.textContent = LOOP_LABELS[loopMode];
        loopBadge.textContent = LOOP_BADGES[loopMode];
        loopBtn.className = 'ctrl-btn loop';
        if (loopMode === 1) loopBtn.classList.add('active');
        else if (loopMode === 2) loopBtn.classList.add('active-single');
    }

    // ============================================================
    //  4. 事件绑定
    // ============================================================
    enSpeakBtn.addEventListener('click', speakEn);
    zhSpeakBtn.addEventListener('click', speakZh);
    prevBtn.addEventListener('click', goPrev);
    replayBtn.addEventListener('click', replayCurrent);
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', goNext);
    loopBtn.addEventListener('click', toggleLoop);

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
        if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        if (e.key === 'r' || e.key === 'R') { replayCurrent(); }
    });

    // ============================================================
    //  5. 初始化语音
    // ============================================================
    function initSpeech() {
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    }

    // ============================================================
    //  6. 启动
    // ============================================================
    renderSentence(0);
    updateLoopUI();
    initSpeech();

    // 页面关闭时停止语音
    window.addEventListener('beforeunload', () => {
        stopAllSpeech();
    });

    // 可见性变化时暂停
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && isSpeaking) {
            stopAllSpeech();
            if (isPlaying) {
                // 暂停自动播放
                pauseAutoPlay();
            }
        }
    });

    console.log('🎵 双语播放器已启动！');
    console.log('快捷键: ← 上一句  → 下一句  空格 播放/暂停  R 重听');
</script>

</body>
