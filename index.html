<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每句练耳 - 声音测试</title>

<style>
body{
    margin:0;
    padding:30px 16px;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
}

.card{
    max-width:520px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:25px 18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    text-align:center;
}

h1{
    margin-top:0;
}

.english{
    font-size:30px;
    font-weight:bold;
    margin:35px 0 15px;
}

.chinese{
    font-size:20px;
    color:#666;
    margin-bottom:25px;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    margin-top:10px;
    font-size:18px;
}

.play{
    background:#222;
    color:white;
}

.next{
    background:#e8e8e8;
}

#status{
    margin-top:18px;
    color:#777;
    min-height:25px;
}
</style>
</head>

<body>

<div class="card">

<h1>🎧 每句练耳</h1>

<div class="english" id="english">
Good morning.
</div>

<div class="chinese" id="chinese">
早上好。
</div>

<button class="play" onclick="playSentence()">
▶ 播放英语
</button>

<button class="next" onclick="nextSentence()">
➡ 下一句
</button>

<div id="status">
准备好了
</div>

</div>

<script>

const lessons = [
    ["Good morning.","早上好。"],
    ["How are you?","你好吗？"],
    ["What are you doing?","你在做什么？"],
    ["Where are you going?","你要去哪里？"],
    ["Where do you live?","你住在哪里？"]
];

let current = 0;

function showSentence(){

    document.getElementById("english").innerText =
        lessons[current][0];

    document.getElementById("chinese").innerText =
        lessons[current][1];

}

function playSentence(){

    speechSynthesis.cancel();

    const text =
        lessons[current][0];

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";
    utterance.rate = 0.72;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onstart = function(){
        document.getElementById("status").innerText =
            "🎧 正在播放……";
    };

    utterance.onend = function(){
        document.getElementById("status").innerText =
            "✅ 播放完成";
    };

    utterance.onerror = function(){
        document.getElementById("status").innerText =
            "⚠️ 播放失败";
    };

    speechSynthesis.speak(utterance);
}

function nextSentence(){

    speechSynthesis.cancel();

    current++;

    if(current >= lessons.length){
        current = 0;
    }

    showSentence();
}

showSentence();

</script>

</body>
</html>
