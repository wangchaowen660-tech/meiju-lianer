<body>
<h2>美句连读｜口语练习工具</h2>
<div class="desc">场景对话 + I want to 句型跟读｜离线1022句</div>

<div class="tab-wrap" id="tabWrap"></div>

<div class="card">
  <div class="info-tip" id="sceneInfo"></div>
  <div class="qa-block" id="qaBlock"></div>
  <div class="speed-group">
    <span>朗读速度：</span>
    <button class="speed-btn" data-rate="0.7">0.7x</button>
    <button class="speed-btn active" data-rate="1.0">1.0x</button>
    <button class="speed-btn" data-rate="1.3">1.3x</button>
  </div>
  <div class="btn-group">
    <button class="btn btn-gray" onclick="prevGroup()">上一组</button>
    <button class="btn" onclick="playQuestion()">朗读问句</button>
    <button class="btn" onclick="playAnswer()">朗读答句</button>
    <button class="btn btn-gray" onclick="nextGroup()">下一组</button>
  </div>
</div>

<div class="card">
  <h3>造句练习｜I want to …</h3>
  <div class="info-tip" id="verbInfo"></div>
  <div id="sentence-box"></div>
  <div class="btn-group">
    <button class="btn" onclick="genRandomSentence()">随机造句</button>
    <button class="btn" onclick="playMakeSentence()">朗读句子</button>
  </div>
</div>

{"name":"健康身体","list":[{"q":"I feel a little sick.","qzh":"我感觉有点不舒服。","a":"You should have a good rest.","azh":"你应该好好休息。"},{"q":"My head hurts.","qzh":"我头疼。","a":"Drink more clean water.","azh":"多喝点干净的水。"},{"q":"Where is the nearest hospital?","qzh":"最近的医院在哪里？","a":"It is not far away from here.","azh":"离这里不算远。"},{"q":"Do you have some medicine?","qzh":"你有一些药吗？","a":"Sorry I do not carry medicine.","azh":"抱歉我没有带药。"},{"q":"I hope you get well soon.","qzh":"希望你早日康复。","a":"Thank you very much for your care.","azh":"非常感谢你的关心。"},{"q":"My skin is itchy.","qzh":"我的皮肤发痒。","a":"Try not to scratch your skin.","azh":"尽量不要抓挠皮肤。"},{"q":"I have a stomachache.","qzh":"我肚子痛。","a":"Please do not eat cold food.","azh":"请不要吃生冷食物。"},{"q":"I cannot sleep well.","qzh":"我睡不好觉。","a":"Try to relax yourself before sleeping.","azh":"睡觉前尽量放松自己。"}]},
{"name":"打电话网络","list":[{"q":"Can I use your Wi‑Fi?","qzh":"我可以用你的无线网络吗？","a":"Wi‑Fi password is on this paper.","azh":"WiFi密码写在这张纸上。"},{"q":"My phone has no signal.","qzh":"我的手机没有信号。","a":"You can try outside of the room.","azh":"你可以到房间外面试试。"},{"q":"Please call me later.","qzh":"稍后请打给我。","a":"All right, I will call you later.","azh":"好的，我稍后打给你。"},{"q":"Could you send me message?","qzh":"可以给我发消息吗？","a":"Sure I will send you message.","azh":"没问题我会给你发消息。"},{"q":"How can I buy mobile data?","qzh":"我怎么购买手机流量？","a":"You can buy SIM card at local shop.","azh":"你可以在本地商店买手机卡。"},{"q":"My battery runs out quickly.","qzh":"我的电池耗电很快。","a":"Please turn off hot‑spot function.","azh":"请关闭热点功能。"}]},

{"name":"感谢道歉","list":[{"q":"Thank you very much.","qzh":"非常感谢你。","a":"You are welcome. It’s my pleasure.","azh":"不客气，这是我的荣幸。"},{"q":"Thanks for your help.","qzh":"谢谢你的帮助。","a":"Do not mention it.","azh":"不用客气。"},{"q":"Sorry.","qzh":"对不起。","a":"It is all right. Never mind.","azh":"没关系，别放在心上。"},{"q":"I am very sorry.","qzh":"我非常抱歉。","a":"No problem, everything is OK.","azh":"没事，一切都还好。"},{"q":"Excuse me.","qzh":"打扰一下。","a":"Yes, what do you need?","azh":"嗯，你需要什么？"},{"q":"Pardon me.","qzh":"麻烦再说一遍。","a":"Sure, I repeat that sentence.","azh":"好，我重复那句话。"}]},
