<style>

.card {

    margin: auto;
    background: white;
    padding: 25px 20px;
    border-radius: 20px;
}

h1 {
    margin-bottom: 5px;
}

.scene {
    color: #777;
    margin: 15px;
}

.progress {
    color: #888;
}

.sentence {
    font-size: 30px;
    font-weight: bold;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    width: 100%;
    padding: 15px;
    margin: 6px 0;
    border: 0;
    border-radius: 12px;
    font-size: 18px;
}

.play {
    background: #222;
    color: white;
}

</style>
</head>

<div class="card">

<div class="scene" id="scene">

<div class="progress" id="progress">

</div>

<button class="play" onclick="playSentence()">

let current = 0;


function showSentence() {

document.getElementById("scene").innerText =
lessons[current][0];

document.getElementById("sentence").innerText =
lessons[current][1];

document.getElementById("progress").innerText =
"第 " + (current + 1) + " / " + lessons.length + " 句";

}


function playSentence() {

speechSynthesis.cancel();

let voice =
new SpeechSynthesisUtterance(
lessons[current][1]
);

voice.lang = "en-US";

voice.rate = 0.75;

voice.volume = 1;

speechSynthesis.speak(voice);

}


function nextSentence() {

speechSynthesis.cancel();

current++;

if (current >= lessons.length) {

current = 0;

}

showSentence();

}


showSentence();
