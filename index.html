<script>

/* =========================================================

/*

const coreChunks = [

/* 基础需求 */

["行动","我想问……","I want to ask...","I want to ask you something.","我想问你一件事。",["you something","a question","the price","the time","the way"]],


/* 能力 */

["能力","我能……","I can...","I can do it.","我能做到。",["do it","help you","come","go","try"]],

["能力","我不能……","I can't...","I can't do it.","我做不到。",["do it","come","go","wait","understand"]],

["能力","我会……","I know how to...","I know how to cook.","我会做饭。",["cook","drive","swim","use it","do it"]],

["能力","我不会……","I don't know how to...","I don't know how to use it.","我不会用它。",["use it","do it","cook","drive","fix it"]],

["能力","你能……吗？","Can you... ?","Can you hear me?","你能听见我吗？",["hear me","see me","help me","wait","come"]],


/* 状态 */

["状态","我很……","I'm very...","I'm very tired.","我很累。",["tired","busy","happy","hungry","thirsty"]],

["状态","我有点……","I'm a little...","I'm a little tired.","我有点累。",["tired","busy","hungry","cold","nervous"]],

["状态","我正在……","I'm feeling...","I'm feeling tired.","我感觉很累。",["tired","better","sick","good","happy"]],

["状态","我准备好了","I'm ready.","I'm ready.","我准备好了。",["ready","not ready","almost ready","ready now","ready to go"]],

["状态","我累了","I'm tired.","I'm tired.","我累了。",["tired","hungry","thirsty","busy","sleepy"]],


/* 理解 */

["理解","我知道……","I know...","I know that.","我知道。",["that","him","her","the answer","the place"]],

["理解","我不知道……","I don't know...","I don't know.","我不知道。",["I don't know","I'm not sure","I don't understand","I can't remember","I don't think so"]],

["理解","我明白……","I understand...","I understand you.","我明白你的意思。",["you","the question","the problem","the idea","the answer"]],

["理解","我忘了……","I forgot...","I forgot the name.","我忘了名字。",["the name","the number","the time","the place","the address"]],


/* 交流 */

["交流","你好吗？","How are you?","How are you?","你好吗？",["today","now","this morning","these days","really"]],

["交流","你在做什么？","What are you doing?","What are you doing?","你在做什么？",["now","today","there","here","at work"]],

["交流","你要去哪里？","Where are you going?","Where are you going?","你要去哪里？",["home","work","school","there","now"]],

["交流","你住在哪里？","Where do you live?","Where do you live?","你住在哪里？",["now","in Nairobi","near here","with your family","these days"]],

["交流","你觉得怎么样？","What do you think?","What do you think?","你觉得怎么样？",["about it","about this","about that","about him","about the idea"]],

["交流","你是什么意思？","What do you mean?","What do you mean?","你是什么意思？",["by that","by this","by it","exactly","really"]],

["交流","你能再说一遍吗？","Can you say that again?","Can you say that again?","你能再说一遍吗？",["again","slowly","more clearly","please","one more time"]],

["交流","请说慢一点","Please speak slowly.","Please speak slowly.","请说慢一点。",["slowly","more clearly","again","a little louder","please"]],


/* 时间 */

["时间","现在几点？","What time is it?","What time is it?","现在几点？",["now","there","exactly","please","right now"]],

["时间","现在……","It's...","It's three o'clock.","现在三点。",["three o'clock","late","early","time","almost noon"]],

["时间","我没有时间……","I don't have time to...","I don't have time to wait.","我没有时间等。",["wait","eat","talk","go","stay"]],

["时间","给我一点时间","Give me some time.","Give me some time.","给我一点时间。",["some time","a minute","a moment","one day","another day"]],


/* 地点 */

["地点","这里有……","There is...","There is a problem.","这里有一个问题。",["a problem","a restaurant","a hotel","a shop","a bus"]],

["地点","那里有……","There is...","There is a shop there.","那里有一家商店。",["a shop","a restaurant","a hotel","a bus","a hospital"]],

["地点","我在这里","I'm here.","I'm here.","我在这里。",["here","now","outside","at work","at home"]],

["地点","我在那里","I'm there.","I'm there.","我在那里。",["there","now","at work","at home","outside"]],


/* 感谢 */

["礼貌","谢谢你","Thank you.","Thank you.","谢谢你。",["very much","so much","for your help","for coming","for everything"]],

["礼貌","不用谢","You're welcome.","You're welcome.","不用谢。",["you're welcome","no problem","not at all","anytime","sure"]],

["礼貌","对不起","I'm sorry.","I'm sorry.","对不起。",["I'm sorry","I'm really sorry","I'm so sorry","sorry about that","sorry for being late"]],

["礼貌","没关系","It's okay.","It's okay.","没关系。",["it's okay","no problem","that's okay","don't worry","it's fine"]],

["礼貌","请……","Please...","Please wait.","请等一下。",["wait","come in","sit down","listen","help me"]],


/* 生活 */

["生活","我想吃……","I want to eat...","I want to eat something.","我想吃点东西。",["something","rice","meat","fish","noodles"]],

["生活","我想喝……","I want to drink...","I want to drink some water.","我想喝点水。",["water","coffee","tea","juice","milk"]],

["生活","我想睡觉","I want to sleep.","I want to sleep.","我想睡觉。",["sleep","rest","go home","sit down","lie down"]],

["生活","我饿了","I'm hungry.","I'm hungry.","我饿了。",["hungry","thirsty","tired","sleepy","cold"]],

["生活","我渴了","I'm thirsty.","I'm thirsty.","我渴了。",["thirsty","hungry","tired","sleepy","hot"]],


/* 工作 */

["工作","我在工作","I'm working.","I'm working.","我在工作。",["working","cooking","cleaning","learning","waiting"]],

["工作","我需要工作","I need to work.","I need to work.","我需要工作。",["work","rest","learn","practice","finish this"]],

["工作","我完成了","I'm done.","I'm done.","我完成了。",["I'm done","I'm ready","it's finished","it's ready","that's all"]],

["工作","还没完成","I'm not done yet.","I'm not done yet.","还没完成。",["not done yet","not ready yet","not finished yet","almost done","still working"]]

];


/* =========================================================
   自动扩展到500个学习单元
   ========================================================= */

const lessons = [];

let id = 1;

while(lessons.length < 500){

    const base =
    coreChunks[(lessons.length) % coreChunks.length];

    lessons.push({

        id:id++,

        scene:base[0],

        chunk:base[1],

        pattern:base[2],

        en:base[3],

        cn:base[4],

        replace:base[5]

    });

}


/* =========================================================
   状态
   ========================================================= */

let currentIndex = 0;

let isSpeaking = false;

let isPaused = false;

let currentUtterance = null;

let isRepeating = false;

let repeatCount = 0;

let repeatTimer = null;

const REPEAT_TIMES = 5;


/* =========================================================
   DOM
   ========================================================= */

const dom = {

    scene:document.getElementById("scene"),

    progress:document.getElementById("progress"),

    chunk:document.getElementById("chunk"),

    english:document.getElementById("english"),

    chinese:document.getElementById("chinese"),

    replaceList:document.getElementById("replaceList"),

    status:document.getElementById("status"),

    playPauseBtn:
    document.getElementById("playPauseBtn"),

    repeatBtn:
    document.getElementById("repeatBtn"),

    searchInput:
    document.getElementById("searchInput"),

    results:
    document.getElementById("results"),

    toast:
    document.getElementById("toast")

};


/* =========================================================
   Toast
   ========================================================= */

let toastTimer;

function showToast(text){

    dom.toast.textContent = text;

    dom.toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
    setTimeout(
        ()=>{
            dom.toast.classList.remove("show");
        },
        1800
    );

}


/* =========================================================
   停止声音
   ========================================================= */

function stopSpeech(){

    try{

        window.speechSynthesis.cancel();

    }catch(e){}

    currentUtterance = null;

    isSpeaking = false;

    isPaused = false;

    dom.playPauseBtn.textContent = "▶";

}


/* =========================================================
   原生英语语音
   ========================================================= */

function speakText(text, callback){

    stopSpeech();

    if(
        !window.speechSynthesis ||
        !window.SpeechSynthesisUtterance
    ){

        dom.status.textContent =
        "⚠️ 当前浏览器不支持语音";

        return;

    }


    const utterance =
    new SpeechSynthesisUtterance(text);


    currentUtterance =
    utterance;


    utterance.lang =
    "en-US";


    utterance.rate =
    0.68;


    utterance.pitch =
    1;


    utterance.volume =
    1;


    utterance.onstart =
    function(){

        if(currentUtterance !== utterance)
        return;

        isSpeaking = true;

        dom.playPauseBtn.textContent =
        "⏸";

        dom.playPauseBtn.classList.add(
        "paused"
        );

        dom.status.textContent =
        "🎧 正在播放……";

        dom.status.className =
        "status speaking";

    };


    utterance.onend =
    function(){

        if(currentUtterance !== utterance)
        return;

        isSpeaking = false;

        currentUtterance = null;

        dom.playPauseBtn.textContent =
        "▶";

        dom.playPauseBtn.classList.remove(
        "paused"
        );

        dom.status.textContent =
        "✅ 播放完成";

        dom.status.className =
        "status done";


        if(callback)
        callback(true);

    };


    utterance.onerror =
    function(){

        if(currentUtterance !== utterance)
        return;

        isSpeaking = false;

        currentUtterance = null;

        dom.playPauseBtn.textContent =
        "▶";

        dom.status.textContent =
        "⚠️ 播放失败";

        dom.status.className =
        "status error";


        if(callback)
        callback(false);

    };


    /*
       给 iPhone 一点时间建立语音对象
    */

    setTimeout(
        ()=>{
            try{
                window.speechSynthesis.speak(
                    utterance
                );
            }catch(e){

                dom.status.textContent =
                "⚠️ 播放异常";

            }
        },
        80
    );

}


/* =========================================================
   播放完整句
   ========================================================= */

function playCurrent(){

    const item =
    lessons[currentIndex];

    if(!item)
    return;

    speakText(item.en);

}


/* =========================================================
   播放母句型
   ========================================================= */

function playPattern(){

    const item =
    lessons[currentIndex];

    if(!item)
    return;


    /*
       母句型中有……
       不让语音把省略号念出来
    */

    const text =
    item.pattern
    .replace("...","")
    .replace("…","")
    .trim();


    speakText(text);


    dom.status.textContent =
    "🧩 正在听母句型";

}


/* =========================================================
   播放 / 暂停
   ========================================================= */

function togglePlayPause(){

    if(isSpeaking){

        try{

            window.speechSynthesis.cancel();

        }catch(e){}

        isSpeaking = false;

        currentUtterance = null;

        dom.playPauseBtn.textContent =
        "▶";

        dom.playPauseBtn.classList.remove(
        "paused"
        );

        dom.status.textContent =
        "⏸ 已暂停";

        dom.status.className =
        "status paused";

        return;

    }


    playCurrent();

}


/* =========================================================
   上一句
   ========================================================= */

function prevTrack(){

    stopSpeech();

    currentIndex--;

    if(currentIndex < 0){

        currentIndex =
        lessons.length - 1;

    }

    showSentence();

}


/* =========================================================
   下一句
   ========================================================= */

function nextTrack(){

    stopSpeech();

    currentIndex++;

    if(
        currentIndex >=
        lessons.length
    ){

        currentIndex = 0;

    }

    showSentence();

}


/* =========================================================
   复读
   ========================================================= */

function toggleRepeat(){

    if(isRepeating){

        isRepeating = false;

        clearTimeout(repeatTimer);

        repeatTimer = null;

        stopSpeech();

        dom.repeatBtn.textContent =
        "🔁 复读";

        dom.repeatBtn.classList.remove(
        "active"
        );

        dom.status.textContent =
        "⏸ 已停止复读";

        dom.status.className =
        "status paused";

        return;

    }


    isRepeating = true;

    repeatCount = 0;

    dom.repeatBtn.textContent =
    "⏹ 停止复读";

    dom.repeatBtn.classList.add(
    "active"
    );

    repeatOnce();

}


function repeatOnce(){

    if(!isRepeating)
    return;


    repeatCount++;


    dom.status.textContent =
    `🔁 复读 ${repeatCount}/${REPEAT_TIMES}`;

    dom.status.className =
    "status";


    const item =
    lessons[currentIndex];


    speakText(
        item.en,
        function(){

            if(!isRepeating)
            return;


            if(
                repeatCount >=
                REPEAT_TIMES
            ){

                isRepeating = false;

                dom.repeatBtn.textContent =
                "🔁 复读";

                dom.repeatBtn.classList.remove(
                "active"
                );

                dom.status.textContent =
                "✅ 复读完成";

                dom.status.className =
                "status done";

                return;

            }


            repeatTimer =
            setTimeout(
                repeatOnce,
                600
            );

        }
    );

}


/* =========================================================
   随机
   ========================================================= */

function randomSentence(){

    stopSpeech();

    currentIndex =
    Math.floor(
        Math.random() *
        lessons.length
    );

    showSentence();

    showToast("🎲 随机语块");

}


/* =========================================================
   显示当前语块
   ========================================================= */

function showSentence(){

    const item =
    lessons[currentIndex];

    if(!item)
    return;


    dom.scene.textContent =
    item.scene;


    dom.progress.textContent =
    `第 ${currentIndex + 1} / 500 个语块`;


    dom.chunk.textContent =
    item.chunk;


    dom.english.textContent =
    item.en;


    dom.chinese.textContent =
    item.cn;


    dom.replaceList.innerHTML =
    "";


    item.replace.forEach(
        function(word){

            const span =
            document.createElement("span");

            span.className =
            "replace-item";

            span.textContent =
            word;

            dom.replaceList.appendChild(
            span
            );

        }
    );


    dom.status.textContent =
    "准备好了";

    dom.status.className =
    "status";

}


/* =========================================================
   搜索
   ========================================================= */

function searchSentence(){

    const keyword =
    dom.searchInput.value
    .trim()
    .toLowerCase();


    dom.results.innerHTML =
    "";


    if(!keyword){

        showToast("请输入关键词");

        return;

    }


    const matches =
    lessons.filter(
        function(item){

            return (

                item.chunk
                .toLowerCase()
                .includes(keyword)

                ||

                item.pattern
                .toLowerCase()
                .includes(keyword)

                ||

                item.en
                .toLowerCase()
                .includes(keyword)

                ||

                item.cn
                .includes(keyword)

            );

        }
    );


    if(matches.length === 0){

        dom.results.innerHTML =
        `<div class="no-result">
        🔍 没有找到相关语块
        </div>`;

        return;

    }


    matches
    .slice(0,30)
    .forEach(
        function(item){

            const box =
            document.createElement("div");

            box.className =
            "result";


            box.innerHTML =

            `<div class="result-en">
            ${item.chunk}
            ·
            ${item.pattern}
            </div>

            <div class="result-cn">
            ${item.cn}
            </div>`;


            box.onclick =
            function(){

                stopSpeech();

                currentIndex =
                lessons.indexOf(item);

                showSentence();

                dom.results.innerHTML =
                "";

                dom.searchInput.value =
                "";

                showToast(
                "已跳转到语块"
                );

            };


            dom.results.appendChild(
            box
            );

        }
    );

}


/* =========================================================
   回车搜索
   ========================================================= */

dom.searchInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            searchSentence();

        }

    }
);


/* =========================================================
   键盘
   ========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            document.activeElement ===
            dom.searchInput
        )
        return;


        if(e.key === "ArrowLeft"){

            e.preventDefault();

            prevTrack();

        }


        if(e.key === "ArrowRight"){

            e.preventDefault();

            nextTrack();

        }


        if(e.key === " "){

            e.preventDefault();

            togglePlayPause();

        }


        if(
            e.key === "r" ||
            e.key === "R"
        ){

            e.preventDefault();

            toggleRepeat();

        }

    }
);


/* =========================================================
   初始化
   ========================================================= */

showSentence();


console.log(
    "🎧 每句练耳 · 母语语块500版"
);

console.log(
    "📚 学习单元:",
    lessons.length
);

console.log(
    "🧠 学习方式:",
    "母语语块 → 母句型 → 完整句 → 替换 → 开口"
);

</script>
