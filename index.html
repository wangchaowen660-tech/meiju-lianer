<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"

<title>🎧 每句练耳 · Chaowen AI V6.0</title>
<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
body{
    margin:0;
    background:#f5f7fa;
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#172033;
}
.player{
    width:min(720px,94vw);
    margin:25px auto;
    background:white;
    border-radius:24px;
    padding:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}
.brand{
    text-align:center;
    font-size:14px;
    color:#718096;
    margin-bottom:4px;
}
.title{
    text-align:center;
    font-size:25px;
    font-weight:800;
    margin-bottom:20px;
}
.progress{
    height:6px;
    background:#e7ebf0;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}
.progressBar{
    height:100%;
    width:0%;
    background:#222;
    transition:.25s;
}
.stage{
    text-align:center;
    font-size:13px;
    color:#7a8495;
    margin-bottom:10px;
}
.mainWord{
    text-align:center;
    font-size:42px;
    font-weight:800;
    letter-spacing:.5px;
    margin:8px 0;
}
.ipa{
    text-align:center;
    font-size:21px;
    color:#64748b;
    margin-bottom:10px;
}
.chinese{
    text-align:center;
    font-size:17px;
    color:#667085;
    min-height:26px;
}
.chain{
    margin-top:20px;
    border-top:1px solid #edf0f4;
    padding-top:18px;
}
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 4px;
    border-bottom:1px solid #f0f2f5;
}
.itemLeft{
    display:flex;
    align-items:center;
    gap:10px;
}
.badge{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eef1f5;
    font-size:12px;
}
.itemText{
    font-size:16px;
}
.itemSub{
    font-size:12px;
    color:#9aa3b2;
    margin-top:2px;
}
.listenBtn{
    border:0;
    background:#f0f2f5;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:17px;
}
.sentence{
    margin-top:20px;
    padding:18px;
    background:#f7f8fa;
    border-radius:17px;
}
.sentenceEN{
    font-size:24px;
    line-height:1.45;
    font-weight:700;
}
.sentenceCN{
    margin-top:8px;
    color:#667085;
    font-size:16px;
}
.controls{
    display:grid;
    grid-template-columns:1fr 1.5fr 1fr;
    gap:10px;
    margin-top:20px;
}
button{
    border:0;
    border-radius:14px;
    padding:13px 10px;
    font-size:15px;
    cursor:pointer;
}
.prev,.next{
    background:#eef1f5;
}
.play{
    background:#111827;
    color:white;
    font-weight:700;
}
.tools{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    margin-top:15px;
}
.tool{
    background:#f0f2f5;
    padding:9px 13px;
    border-radius:12px;
    font-size:13px;
}
.status{
    text-align:center;
    margin-top:16px;
    font-size:13px;
    color:#7a8495;
    min-height:20px;
}
.phonemeGrid{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}
.phonemeBtn{
    background:#f5f7fa;
    border:1px solid #e8ebef;
    border-radius:12px;
    padding:10px 4px;
    font-size:14px;
}
.phonemeBtn.active{
    background:#111827;
    color:white;
}
.credit{
    margin-top:18px;
    text-align:center;
    font-size:11px;
    line-height:1.5;
    color:#a0a7b4;
}
@media(max-width:500px){
    .player{
        margin:10px auto;
        padding:16px;
        border-radius:20px;
    }
    .mainWord{
        font-size:36px;
    }
    .sentenceEN{
        font-size:20px;
    }
    .phonemeGrid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>
<body>
<div class="player">
<div class="brand">🎋 Chaowen AI</div>
<div class="title">🎧 每句练耳 V6.0</div>
<div class="progress">
    <div class="progressBar" id="progressBar"></div>
</div>
<div class="stage" id="stage">
    音素 → 拼读 → 单词 → 词族 → 词块 → 母句
</div>
<div class="mainWord" id="mainWord">cat</div>
<div class="ipa" id="ipa">/kæt/</div>
<div class="chinese" id="chinese">猫</div>
<div class="chain">
    <div class="item">
        <div class="itemLeft">
            <div class="badge">1</div>
            <div>
                <div class="itemText" id="phonemeText">/k/</div>
                <div class="itemSub">真人音素</div>
            </div>
        </div>
        <button class="listenBtn" onclick="playCurrentPhoneme()">🔊</button>
    </div>
    <div class="item">
        <div class="itemLeft">
            <div class="badge">2</div>
            <div>
                <div class="itemText" id="blendText">k + at</div>
                <div class="itemSub">拼读块</div>
            </div>
        </div>
        <button class="listenBtn" onclick="playWord()">🔊</button>
    </div>
    <div class="item">
        <div class="itemLeft">
            <div class="badge">3</div>
            <div>
                <div class="itemText" id="wordText">cat</div>
                <div class="itemSub">当前单词</div>
            </div>
        </div>
        <button class="listenBtn" onclick="speakWord()">🔊</button>
    </div>
    <div class="item">
        <div class="itemLeft">
            <div class="badge">4</div>
            <div>
                <div class="itemText" id="familyText">cat · bat · fat · hat</div>
                <div class="itemSub">词族</div>
            </div>
        </div>
        <button class="listenBtn" onclick="playFamily()">🔊</button>
    </div>
    <div class="item">
        <div class="itemLeft">
            <div class="badge">5</div>
            <div>
                <div class="itemText">I · you · the · a · to · can</div>
                <div class="itemSub">高频词</div>
            </div>
        </div>
        <button class="listenBtn" onclick="playHighFrequency()">🔊</button>
    </div>
    <div class="item">
        <div class="itemLeft">
            <div class="badge">6</div>
            <div>
                <div class="itemText" id="chunkText">sit on the mat</div>
                <div class="itemSub">词块</div>
            </div>
        </div>
        <button class="listenBtn" onclick="speakChunk()">🔊</button>
    </div>
</div>
<div class="sentence">
    <div class="sentenceEN" id="sentenceEN">
        The cat sat on the mat.
    </div>
    <div class="sentenceCN" id="sentenceCN">
        那只猫坐在垫子上。
    </div>
</div>
<div class="controls">
    <button class="prev" onclick="prevLesson()">← 上一句</button>
    <button class="play" onclick="playEverything()" id="playBtn">
        ▶ 开始整条训练
    </button>
    <button class="next" onclick="nextLesson()">下一句 →</button>
</div>
<div class="tools">
    <button class="tool" onclick="stopAll()">⏹ 停止</button>
    <button class="tool" onclick="toggleChinese()" id="cnBtn">
        🇨🇳 中文：开
    </button>
    <button class="tool" onclick="toggleRepeat()" id="repeatBtn">
        🔁 循环：关
    </button>
    <button class="tool" onclick="changeSpeed()">
        ⚡ <span id="speedText">0.8x</span>
    </button>
</div>
<div class="status" id="status">
    准备开始
</div>
<div class="phonemeGrid" id="phonemeGrid"></div>
<div class="credit">
    V6.0 · 真人音素文件由 audio/phonemes/ 提供<br>
    本播放器不会用 TTS 冒充真人音素

</div>

/* =========================================================
   4. 状态
========================================================= */
let familyIndex = 0;
let wordIndex = 0;
let speed = 0.8;
let chineseVisible = true;
let repeatMode = false;
let playing = false;
let token = 0;
let currentAudio = null;
/* =========================================================
   5. 工具
========================================================= */
function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}
function stopAudio(){
    if(currentAudio){
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }
}
function stopAll(){
    token++;
    playing = false;
    stopAudio();
    speechSynthesis.cancel();
    document.getElementById("status").textContent =
        "已停止";
    document.getElementById("playBtn").textContent =
        "▶ 开始整条训练";
}
/* =========================================================
   6. 真人音频播放器
========================================================= */
function playHumanPhoneme(symbol){
    return new Promise(resolve => {
        stopAudio();
        const data = phonemes[symbol];
        if(!data){
            document.getElementById("status").textContent =
                "找不到音素：" + symbol;
            resolve(false);
            return;
        }
        const audio = new Audio(data.file);
        currentAudio = audio;
        audio.playbackRate = speed;
        audio.onended = () => {
            currentAudio = null;
            resolve(true);
        };
        audio.onerror = () => {
            currentAudio = null;
            document.getElementById("status").textContent =
                "⚠ 缺少真人音频：" + data.file;
            resolve(false);
        };
        audio.play().catch(() => {
            document.getElementById("status").textContent =
                "⚠ 无法播放：" + data.file;
            resolve(false);
        });
    });
}
/* =========================================================
   7. TTS只负责单词、词块、句子
      不负责冒充真人音素
========================================================= */
function speak(text){
    return new Promise(resolve => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.rate = speed;
        u.pitch = 1;
        u.volume = 1;
        u.onend = () => resolve();
        u.onerror = () => resolve();
        speechSynthesis.speak(u);
    });
}
/* =========================================================
   8. 当前课程
========================================================= */
function getCurrent(){
    const family = families[familyIndex];
    const word = family.words[wordIndex];
    return {
        family,
        word
    };
}
/* =========================================================
   9. 页面刷新
========================================================= */
function render(){
    const current = getCurrent();
    const family = current.family;
    const word = current.word;
    document.getElementById("mainWord").textContent =
        word[0];
    document.getElementById("ipa").textContent =
        word[1];
    document.getElementById("chinese").textContent =
        word[2];
    document.getElementById("phonemeText").textContent =
        "/" + onsetToIPA(word[3]) + "/";
    document.getElementById("blendText").textContent =
        word[3] + " + " + family.rime;
    document.getElementById("wordText").textContent =
        word[0];
    document.getElementById("familyText").textContent =
        family.words.map(x => x[0]).join(" · ");
    document.getElementById("chunkText").textContent =
        family.chunk;
    document.getElementById("sentenceEN").textContent =
        family.sentence;
    document.getElementById("sentenceCN").textContent =
        family.cn;
    document.getElementById("chinese").style.visibility =
        chineseVisible ? "visible" : "hidden";
    document.getElementById("sentenceCN").style.visibility =
        chineseVisible ? "visible" : "hidden";
    document.getElementById("progressBar").style.width =
        ((familyIndex + 1) / families.length * 100) + "%";
    document.getElementById("stage").textContent =
        `词族 ${familyIndex + 1} / ${families.length} · 单词 ${wordIndex + 1} / ${family.words.length}`;
}
/* =========================================================
   10. 字母 → IPA
========================================================= */
function onsetToIPA(letter){
    const map = {
        b:"b",
        c:"k",
        d:"d",
        f:"f",
        g:"ɡ",
        h:"h",
        j:"dʒ",
        k:"k",
        l:"l",
        m:"m",
        n:"n",
        p:"p",
        r:"r",
        s:"s",
        t:"t",
        v:"v",
        w:"w",
        y:"j"
    };
    return map[letter] || letter;
}
/* =========================================================
   11. 播放当前真人音素
========================================================= */
async function playCurrentPhoneme(){
    const current = getCurrent();
    const ipa = onsetToIPA(current.word[3]);
    document.getElementById("status").textContent =
        "🎙 真人音素 " + ipa;
    await playHumanPhoneme(ipa);
}
/* =========================================================
   12. 播放单词
========================================================= */
async function playWord(){
    const current = getCurrent();
    document.getElementById("status").textContent =
        "🔊 拼读：" +
        current.word[3] +
        " + " +
        current.family.rime;
    await playCurrentPhoneme();
    await sleep(180);
    await speak(current.word[0]);
}
/* =========================================================
   13. 单词 TTS
========================================================= */
async function speakWord(){
    const current = getCurrent();
    document.getElementById("status").textContent =
        "🔊 当前单词";
    await speak(current.word[0]);
}
/* =========================================================
   14. 播放词族
========================================================= */
async function playFamily(){
    const current = getCurrent();
    document.getElementById("status").textContent =
        "📚 词族：" + current.family.rime;
    for(const item of current.family.words){
        await speak(item[0]);
        await sleep(180);
    }
}
/* =========================================================
   15. 高频词
========================================================= */
const highFrequency = [
    "I",
    "you",
    "the",
    "a",
    "to",
    "is",
    "it",
    "can",
    "want",
    "go"
];
async function playHighFrequency(){
    document.getElementById("status").textContent =
        "⭐ 高频词";
    for(const word of highFrequency){
        await speak(word);
        await sleep(160);
    }
}
/* =========================================================
   16. 词块
========================================================= */
async function speakChunk(){
    const current = getCurrent();
    document.getElementById("status").textContent =
        "🧩 词块";
    await speak(current.family.chunk);
}
/* =========================================================
   17. 母句
========================================================= */
async function playSentence(){
    const current = getCurrent();
    document.getElementById("status").textContent =
        "🗣 母句";
    await speak(current.family.sentence);
}
/* =========================================================
   18. 整条训练
========================================================= */
async function playEverything(){
    if(playing){
        stopAll();
        return;
    }
    playing = true;
    const myToken = ++token;
    document.getElementById("playBtn").textContent =
        "⏸ 暂停";
    const current = getCurrent();
    const word = current.word;
    const family = current.family;
    try{
        /* 1 音素 */
        document.getElementById("status").textContent =
            "① 真人音素";
        await playHumanPhoneme(
            onsetToIPA(word[3])
        );
        if(myToken !== token) return;
        await sleep(250);
        /* 2 拼读 */
        document.getElementById("status").textContent =
            "② 拼读块";
        await speak(
            word[3] + " " + family.rime
        );
        if(myToken !== token) return;
        await sleep(250);
        /* 3 单词 */
        document.getElementById("status").textContent =
            "③ 完整单词";
        await speak(word[0]);
        if(myToken !== token) return;
        await sleep(300);
        /* 4 词族 */
        document.getElementById("status").textContent =
            "④ 词族";
        for(const item of family.words){
            if(myToken !== token) return;
            await speak(item[0]);
            await sleep(150);
        }
        /* 5 高频词 */
        document.getElementById("status").textContent =
            "⑤ 高频词";
        for(const word2 of highFrequency){
            if(myToken !== token) return;
            await speak(word2);
            await sleep(120);
        }
        /* 6 词块 */
        document.getElementById("status").textContent =
            "⑥ 词块";
        await speak(family.chunk);
        if(myToken !== token) return;
        await sleep(400);
        /* 7 母句 */
        document.getElementById("status").textContent =
            "⑦ 母句";
        await speak(family.sentence);
        if(myToken !== token) return;
        await sleep(700);
        /* 8 再听 */
        document.getElementById("status").textContent =
            "⑧ 再听一遍";
        await speak(family.sentence);
        if(myToken !== token) return;
        await sleep(700);
        /* 9 隐藏中文 */
        document.getElementById("status").textContent =
            "⑨ 现在只听英语";
        const oldCN = chineseVisible;
        chineseVisible = false;
        render();
        await speak(family.sentence);
        if(myToken !== token) return;
        await sleep(800);
        /* 10 跟读等待 */
        document.getElementById("status").textContent =
            "⑩ 现在你来说";
        await sleep(3000);
        chineseVisible = oldCN;
        render();
        /* 循环 */
        if(repeatMode && myToken === token){
            await sleep(500);
            playing = false;
            return playEverything();
        }
        document.getElementById("status").textContent =
            "✅ 本轮完成";
    }
    finally{
        if(myToken === token){
            playing = false;
            document.getElementById("playBtn").textContent =
                "▶ 开始整条训练";
        }
    }
}
/* =========================================================
   19. 上一句
========================================================= */
function prevLesson(){
    stopAll();
    wordIndex--;
    if(wordIndex < 0){
        familyIndex--;
        if(familyIndex < 0){
            familyIndex = families.length - 1;
        }
        wordIndex =
            families[familyIndex].words.length - 1;
    }
    render();
}
/* =========================================================
   20. 下一句
========================================================= */
function nextLesson(){
    stopAll();
    wordIndex++;
    if(
        wordIndex >=
        families[familyIndex].words.length
    ){
        wordIndex = 0;
        familyIndex++;
        if(familyIndex >= families.length){
            familyIndex = 0;
        }
    }
    render();
}
/* =========================================================
   21. 中文
========================================================= */
function toggleChinese(){
    chineseVisible = !chineseVisible;
    document.getElementById("cnBtn").textContent =
        chineseVisible
        ? "🇨🇳 中文：开"
        : "🇨🇳 中文：关";
    render();
}
/* =========================================================
   22. 循环
========================================================= */
function toggleRepeat(){
    repeatMode = !repeatMode;
    document.getElementById("repeatBtn").textContent =
        repeatMode
        ? "🔁 循环：开"
        : "🔁 循环：关";
}
/* =========================================================
   23. 速度
========================================================= */
function changeSpeed(){
    const speeds = [
        0.6,
        0.7,
        0.8,
        0.9,
        1.0
    ];
    let i = speeds.indexOf(speed);
    i++;
    if(i >= speeds.length){
        i = 0;
    }
    speed = speeds[i];
    document.getElementById("speedText").textContent =
        speed + "x";
}
/* =========================================================
   24. 44音素按钮
========================================================= */
function createPhonemeGrid(){
    const grid =
        document.getElementById("phonemeGrid");
    grid.innerHTML = "";
    Object.keys(phonemes).forEach(symbol => {
        const button =
            document.createElement("button");
        button.className =
            "phonemeBtn";
        button.textContent =
            phonemes[symbol].name;
        button.onclick = async () => {
            document.querySelectorAll(
                ".phonemeBtn"
            ).forEach(b =>
                b.classList.remove("active")
            );
            button.classList.add("active");
            document.getElementById("status").textContent =
                "🎙 真人音素 " +
                phonemes[symbol].name +
                " · " +
                phonemes[symbol].example;
            await playHumanPhoneme(symbol);
        };
        grid.appendChild(button);
    });
}
/* =========================================================
   25. 初始化
========================================================= */
render();
createPhonemeGrid();
