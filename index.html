<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Chaowen AI English Player V5.0</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f5f7;
  color:#17202a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.player{
  width:min(620px,100%);
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding:16px 16px 28px;
}
/* 顶部 */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.logo{
  font-size:18px;
  font-weight:750;
}
.version{
  color:#9aa1a8;
  font-size:11px;
}
/* 进度 */
.lesson{
  text-align:center;
  color:#9299a0;
  font-size:12px;
  margin:8px 0;
}
.progress{
  height:4px;
  background:#e8ebee;
  border-radius:4px;
  overflow:hidden;
}
.progressBar{
  width:0%;
  height:100%;
  background:#17202a;
}
/* 当前阶段 */
.stage{
  text-align:center;
  font-size:12px;
  color:#8b949e;
  margin-top:17px;
}
.stage strong{
  color:#17202a;
}
/* 单词 */
.word{
  text-align:center;
  font-size:50px;
  font-weight:800;
  margin-top:6px;
  letter-spacing:-1px;
}
.ipa{
  text-align:center;
  font-size:18px;
  color:#6d747b;
}
.meaning{
  text-align:center;
  color:#555;
  margin-top:4px;
}
/* 拼读 */
.blend{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:18px 0 13px;
}
.sound{
  min-width:54px;
  padding:10px 13px;
  background:#f1f3f5;
  border-radius:10px;
  text-align:center;
  font-size:21px;
  font-weight:700;
  cursor:pointer;
}
.plus,
.arrow{
  color:#a0a6ac;
}
/* 词族 */
.label{
  color:#9299a0;
  font-size:11px;
  margin-top:8px;
}
.family{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:7px 0 5px;
  scrollbar-width:none;
}
.family::-webkit-scrollbar{
  display:none;
}
.family button{
  flex:none;
  border:1px solid #e1e5e8;
  background:#fff;
  border-radius:8px;
  padding:7px 11px;
  font-size:13px;
}
.family button.active{
  background:#17202a;
  color:#fff;
}
/* 高频词 */
.highWords{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
}
.highWords span{
  background:#f5f6f7;
  border-radius:7px;
  padding:5px 8px;
  font-size:12px;
}
/* 母句 */
.sentenceBox{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid #edf0f2;
}
.sentence{
  text-align:center;
  font-size:25px;
  font-weight:700;
  line-height:1.45;
}
.chinese{
  text-align:center;
  color:#8a9198;
  font-size:14px;
  margin-top:7px;
}
.chunks{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:13px;
}
.chunk{
  border:0;
  background:#f1f3f5;
  border-radius:8px;
  padding:7px 9px;
  font-size:13px;
}
/* 当前播放 */
.now{
  margin-top:15px;
  text-align:center;
  min-height:18px;
  color:#737b83;
  font-size:12px;
}
/* 主控制 */
.controls{
  margin-top:13px;
}
.controlRow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin-top:13px;
}
.control{
  border:0;
  background:transparent;
  font-size:21px;
  cursor:pointer;
}
.play{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#17202a;
  color:#fff;
  font-size:24px;
}
/* 速度 */
.speed{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:14px;
}
.speed button{
  border:0;
  background:#f1f3f5;
  border-radius:7px;
  padding:6px 10px;
  font-size:12px;
}
.speed button.active{
  background:#17202a;
  color:white;
}
/* 全链路 */
.chain{
  width:100%;
  border:0;
  background:#17202a;
  color:white;
  border-radius:11px;
  padding:13px;
  margin-top:15px;
  font-size:15px;
  font-weight:650;
}
/* 听力 */
.listenRow{
  display:flex;
  gap:7px;
  margin-top:8px;
}
.listenRow button{
  flex:1;
  border:1px solid #e0e4e7;
  background:white;
  border-radius:10px;
  padding:10px 4px;
  font-size:12px;
}
/* 1000课 */
.jump{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:14px;
}
.jump input{
  width:90px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:center;
  padding:8px;
}
.jump button{
  border:0;
  border-radius:8px;
  padding:8px 12px;
  background:#eef1f3;
}
/* 隐藏中文 */
.hide{
  visibility:hidden;
}
/* 手机 */
@media(max-width:430px){
  .word{
    font-size:44px;
  }
  .sentence{
    font-size:22px;
  }
}
</style>
</head>

<div class="jump">

/* =========================================================
   二、母句基础库
========================================================= */
const baseLessons = [

["I am going home.","我要回家。",["I am going","home"]],

/* =========================================================

========================================================= */
const actions=[
"go home",
"go to work",
"eat",
"drink water",
"learn English",
"buy it",
"see it",
"try it",
"help you",
"help me",

const places=[
"home",

];
const things=[
"some water",

/* =========================================================
   四、1000母句
========================================================= */
function buildLessons(){
  const arr=baseLessons.map(x=>({
    en:x[0],
    cn:x[1],
    chunks:x[2]
  }));
  let i=0;
  while(arr.length<1000){
    const a=actions[i%actions.length];
    const p=places[i%places.length];
    const o=things[i%things.length];
    const type=i%10;
    if(type===0){
      arr.push({
        en:`I want to ${a}.`,
        cn:`我想${a}。`,
        chunks:["I want to",a]
      });
    }
    if(type===1){
      arr.push({
        en:`I need to ${a}.`,
        cn:`我需要${a}。`,
        chunks:["I need to",a]
      });
    }
    if(type===2){
      arr.push({
        en:`I am going to ${p}.`,
        cn:`我要去${p}。`,
        chunks:["I am going to",p]
      });
    }
    if(type===3){
      arr.push({
        en:`I want ${o}.`,
        cn:`我想要${o}。`,
        chunks:["I want",o]
      });
    }
    if(type===4){
      arr.push({
        en:`I can ${a}.`,
        cn:`我可以${a}。`,
        chunks:["I can",a]
      });
    }
    if(type===5){
      arr.push({
        en:`I like to ${a}.`,
        cn:`我喜欢${a}。`,
        chunks:["I like to",a]
      });
    }
    if(type===6){
      arr.push({
        en:`Can you bring ${o}?`,
        cn:`你能带${o}吗？`,
        chunks:["Can you bring",o+"?"]
      });
    }
    if(type===7){
      arr.push({
        en:`Can you take me to ${p}?`,
        cn:`你能带我去${p}吗？`,
        chunks:["Can you take me to",p+"?"]
      });
    }
    if(type===8){
      arr.push({
        en:`Please ${a}.`,
        cn:`请${a}。`,
        chunks:["Please",a+"."]
      });
    }
    if(type===9){
      arr.push({
        en:`Do you want to ${a}?`,
        cn:`你想${a}吗？`,
        chunks:["Do you want to",a+"?"]
      });
    }
    i++;
  }
  return arr.slice(0,1000);
}
const lessons=buildLessons();
/* =========================================================
   五、状态
========================================================= */
let lessonIndex=0;
let familyIndex=0;
let wordIndex=0;
let speed=.8;
let playing=false;
let chainRunning=false;
let token=0;
/* =========================================================
   六、语音
========================================================= */
const synth=window.speechSynthesis;
let voices=[];
function loadVoices(){
  voices=synth.getVoices();
  const us=voices.find(v=>v.lang==="en-US");
  const gb=voices.find(v=>v.lang==="en-GB");
  const en=voices.find(v=>v.lang.startsWith("en"));
  window.chaowenVoice=us||gb||en||voices[0];
}
loadVoices();
if("onvoiceschanged" in synth){
  synth.onvoiceschanged=loadVoices;
}
/* =========================================================
   七、稳定语音函数
========================================================= */
function speak(text,rate=speed){
  return new Promise(resolve=>{
    if(!text){
      resolve();
      return;
    }
    const myToken=token;
    synth.cancel();
    setTimeout(()=>{
      if(myToken!==token){
        resolve();
        return;
      }
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-US";
      u.rate=rate;
      u.pitch=1;
      u.volume=1;
      if(window.chaowenVoice){
        u.voice=window.chaowenVoice;
      }
      let done=false;
      const finish=()=>{
        if(done)return;
        done=true;
        resolve();
      };
      u.onend=finish;
      u.onerror=finish;
      synth.speak(u);
    },120);
  });
}
/* =========================================================
   八、DOM
========================================================= */
const $=id=>document.getElementById(id);
const wordEl=$("word");
const ipaEl=$("ipa");
const meaningEl=$("meaning");
const onsetEl=$("onset");
const rimeEl=$("rime");
const wholeEl=$("whole");
const familyEl=$("family");
const highWordsEl=$("highWords");
const sentenceEl=$("sentence");
const chineseEl=$("chinese");
const chunksEl=$("chunks");
const stageEl=$("stage");
const nowEl=$("now");
const playBtn=$("play");
const progressEl=$("progress");
const lessonEl=$("lesson");
/* =========================================================
   九、当前数据
========================================================= */
function family(){
  return families[familyIndex];
}
function currentWord(){
  return family().words[wordIndex];
}
/* =========================================================
   十、渲染
========================================================= */
function render(){
  const f=family();
  const w=currentWord();
  wordEl.textContent=w[0];
  ipaEl.textContent=w[1];
  meaningEl.textContent=w[2];
  onsetEl.textContent=w[3];
  rimeEl.textContent=f.rime;
  wholeEl.textContent=w[0];
  lessonEl.textContent=
    `第 ${lessonIndex+1} / 1000 课`;
  progressEl.style.width=
    `${(lessonIndex+1)/10}%`;
  /* 词族 */
  familyEl.innerHTML="";
  f.words.forEach((item,i)=>{
    const b=document.createElement("button");
    b.textContent=item[0];
    if(i===wordIndex){
      b.classList.add("active");
    }
    b.onclick=()=>{
      wordIndex=i;
      render();
      speak(item[0]);
    };
    familyEl.appendChild(b);
  });
  /* 高频词 */
  const high=[
    "I",
    "you",
    "the",
    "a",
    "to",
    "is",
    "it",
    "can",
    "want",
    "go"
  ];
  highWordsEl.innerHTML="";
  high.forEach(x=>{
    const s=document.createElement("span");
    s.textContent=x;
    s.onclick=()=>speak(x);
    highWordsEl.appendChild(s);
  });
  /* 母句 */
  sentenceEl.textContent=f.sentence;
  chineseEl.textContent=f.chinese;
  chunksEl.innerHTML="";
  f.chunks.forEach(chunk=>{
    const b=document.createElement("button");
    b.className="chunk";
    b.textContent=chunk;
    b.onclick=()=>{
      token++;
      speak(chunk);
    };
    chunksEl.appendChild(b);
  });
}
/* =========================================================
   十一、阶段显示
========================================================= */
function stage(text){
  stageEl.textContent=text;
  nowEl.textContent=text;
}
/* =========================================================
   十二、拼读
========================================================= */
const onsetSound={
  b:"buh",
  c:"kuh",
  d:"duh",
  f:"fuh",
  g:"guh",
  h:"huh",
  j:"juh",
  k:"kuh",
  l:"luh",
  m:"muh",
  n:"nuh",
  p:"puh",
  r:"ruh",
  s:"sss",
  t:"tuh",
  v:"vuh",
  w:"wuh",
  y:"yuh",
  z:"zuh"
};
function onsetVoice(letter){
  return onsetSound[letter]||letter;
}
/* =========================================================
   十三、单词
========================================================= */
async function playWord(){
  token++;
  const my=token;
  playing=true;
  playBtn.textContent="Ⅱ";
  stage("拼读：第一个声音");
  await speak(onsetVoice(currentWord()[3]));
  if(my!==token)return;
  stage("拼读：第二块音");
  await speak(family().rime);
  if(my!==token)return;
  stage("完整单词");
  await speak(currentWord()[0]);
  playing=false;
  playBtn.textContent="▶";
}
/* =========================================================
   十四、词族
========================================================= */
async function playFamily(){
  token++;
  const my=token;
  playing=true;
  playBtn.textContent="Ⅱ";
  stage("词族连续练习");
  for(const w of family().words){
    if(my!==token)return;
    await speak(w[0]);
  }
  playing=false;
  playBtn.textContent="▶";
}
/* =========================================================
   十五、词块
========================================================= */
async function playChunks(){
  token++;
  const my=token;
  stage("母句词块");
  for(const chunk of family().chunks){
    if(my!==token)return;
    await speak(chunk);
  }
}
/* =========================================================
   十六、完整母句
========================================================= */
async function playSentence(){
  token++;
  const my=token;
  playing=true;
  playBtn.textContent="Ⅱ";
  stage("完整母句");
  await speak(family().sentence);
  if(my!==token)return;
  playing=false;
  playBtn.textContent="▶";
}
/* =========================================================
   十七、听力
========================================================= */
async function listening(){
  token++;
  const my=token;
  playing=true;
  playBtn.textContent="Ⅱ";
  chineseEl.classList.add("hide");
  stage("先听，不看中文");
  await speak(family().sentence);
  if(my!==token)return;
  await wait(1200);
  if(my!==token)return;
  chineseEl.classList.remove("hide");
  stage("中文出现");
  playing=false;
  playBtn.textContent="▶";
}
/* =========================================================
   十八、等待
========================================================= */
function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}
/* =========================================================
   十九、跟读等待
========================================================= */
async function shadowing(){
  token++;
  const my=token;
  stage("现在你说");
  await wait(2500);
  if(my!==token)return;
  stage("再听一次");
  await speak(family().sentence);
}
/* =========================================================
   二十、全部学习
========================================================= */
async function playEverything(){
  if(chainRunning){
    stop();
    return;
  }
  chainRunning=true;
  playing=true;
  playBtn.textContent="Ⅱ";
  token++;
  const my=token;
  const f=family();
  const w=currentWord();
  /* 1 */
  stage("① 第一个声音");
  await speak(onsetVoice(w[3]));
  if(my!==token)return finishChain();
  /* 2 */
  stage("② 第二块音");
  await speak(f.rime);
  if(my!==token)return finishChain();
  /* 3 */
  stage("③ 拼成单词");
  await speak(w[0]);
  if(my!==token)return finishChain();
  /* 4 */
  stage("④ 整个词族");
  for(const item of f.words){
    if(my!==token)return finishChain();
    await speak(item[0]);
  }
  /* 5 */
  stage("⑤ 高频词");
  const high=[
    "I",
    "you",
    "the",
    "a",
    "to",
    "is",
    "it",
    "can",
    "want",
    "go"
  ];
  for(const h of high){
    if(my!==token)return finishChain();
    await speak(h);
  }
  /* 6 */
  stage("⑥ 母句词块");
  for(const c of f.chunks){
    if(my!==token)return finishChain();
    await speak(c);
  }
  /* 7 */
  stage("⑦ 完整母句");
  await speak(f.sentence);
  if(my!==token)return finishChain();
  /* 8 */
  stage("⑧ 再听一次");
  await wait(500);
  await speak(f.sentence);
  if(my!==token)return finishChain();
  /* 9 */
  stage("⑨ 听力：隐藏中文");
  chineseEl.classList.add("hide");
  await wait(500);
  await speak(f.sentence);
  if(my!==token)return finishChain();
  /* 10 */
  stage("⑩ 轮到你说");
  await wait(3000);
  if(my!==token)return finishChain();
  chineseEl.classList.remove("hide");
  stage("完成 ✓");
  chainRunning=false;
  playing=false;
  playBtn.textContent="▶";
}
function finishChain(){
  chainRunning=false;
  playing=false;
  playBtn.textContent="▶";
  chineseEl.classList.remove("hide");
}
/* =========================================================
   二十一、停止
========================================================= */
function stop(){
  token++;
  chainRunning=false;
  playing=false;
  synth.cancel();
  chineseEl.classList.remove("hide");
  stage("已暂停");
  playBtn.textContent="▶";
}
/* =========================================================
   二十二、主播放
========================================================= */
playBtn.onclick=()=>{
  if(playing){
    stop();
  }else{
    playEverything();
  }
};
/* =========================================================
   二十三、左右
========================================================= */
$("prev").onclick=()=>{
  stop();
  lessonIndex--;
  if(lessonIndex<0){
    lessonIndex=999;
  }
  familyIndex=(familyIndex-1+families.length)%families.length;
  wordIndex=0;
  render();
};
$("next").onclick=()=>{
  stop();
  lessonIndex++;
  if(lessonIndex>999){
    lessonIndex=0;
  }
  familyIndex=(familyIndex+1)%families.length;
  wordIndex=0;
  render();
};
/* =========================================================
   二十四、速度
========================================================= */
document.querySelectorAll("[data-speed]").forEach(btn=>{
  btn.onclick=()=>{
    speed=parseFloat(btn.dataset.speed);
    document.querySelectorAll("[data-speed]")
      .forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  };
});
/* =========================================================
   二十五、单独播放
========================================================= */
$("wordPlay").onclick=()=>{
  stop();
  playWord();
};
$("familyPlay").onclick=()=>{
  stop();
  playFamily();
};
$("sentencePlay").onclick=()=>{
  stop();
  playSentence();
};
$("listenPlay").onclick=()=>{
  stop();
  listening();
};
/* =========================================================
   二十六、拼读块点击
========================================================= */
onsetEl.onclick=()=>{
  token++;
  speak(onsetVoice(currentWord()[3]));
};
rimeEl.onclick=()=>{
  token++;
  speak(family().rime);
};
wholeEl.onclick=()=>{
  token++;
  speak(currentWord()[0]);
};
/* =========================================================
   二十七、1000课跳转
========================================================= */
$("jump").onclick=()=>{
  let n=parseInt($("jumpInput").value);
  if(!n)return;
  n=Math.max(1,Math.min(1000,n));
  stop();
  lessonIndex=n-1;
  familyIndex=(n-1)%families.length;
  wordIndex=0;
  render();
};
/* =========================================================
   二十八、空格播放
========================================================= */
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    e.preventDefault();
    if(playing){
      stop();
    }else{
      playEverything();
    }
  }
});
/* =========================================================
   二十九、初始化
========================================================= */
render();
</script>
