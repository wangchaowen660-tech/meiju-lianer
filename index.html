<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaowen AI · 拼读词族</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
              "PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f7fa;
  color:#20252b;
}

.app{
  max-width:720px;
  margin:auto;
  padding:18px 15px 45px;
}

/* 顶部 */
.header{
  text-align:center;
  padding:8px 0 18px;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:.5px;
}

.sub{
  color:#7b8490;
  font-size:13px;
  margin-top:5px;
}

/* 分类 */
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 0 12px;
}

.tab{
  border:0;
  background:#fff;
  padding:9px 15px;
  border-radius:20px;
  white-space:nowrap;
  font-size:14px;
  color:#66707c;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.tab.active{
  background:#20252b;
  color:#fff;
}

/* 主卡片 */
.card{
  background:#fff;
  border-radius:22px;
  padding:22px;
  margin-top:10px;
  box-shadow:0 8px 28px rgba(30,40,50,.07);
}

.section-title{
  font-size:13px;
  color:#8a929c;
  margin-bottom:10px;
}

/* 单词 */
.word{
  text-align:center;
  font-size:58px;
  font-weight:800;
  letter-spacing:3px;
  margin:4px 0 0;
}

.meaning{
  text-align:center;
  font-size:18px;
  margin-top:5px;
}

.ipa{
  text-align:center;
  color:#737d89;
  font-size:16px;
  margin-top:7px;
}

/* 播放 */
.play-main{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  margin-top:18px;
  background:#20252b;
  color:white;
  font-size:17px;
  font-weight:700;
}

.play-main:active{
  transform:scale(.98);
}

/* 音块 */
.blocks{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  margin:18px 0 4px;
  flex-wrap:wrap;
}

.block{
  min-width:58px;
  padding:12px 14px;
  border-radius:13px;
  background:#f0f3f6;
  text-align:center;
  font-size:24px;
  font-weight:750;
  cursor:pointer;
}

.plus{
  color:#9aa2ac;
  font-size:20px;
}

/* 合音 */
.blend-box{
  background:#f7f8fa;
  border-radius:16px;
  padding:17px;
  margin-top:15px;
  text-align:center;
}

.blend-label{
  font-size:12px;
  color:#929aa4;
  margin-bottom:6px;
}

.blend{
  font-size:28px;
  font-weight:800;
  letter-spacing:1px;
}

/* 词族 */
.family{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.family-word{
  padding:9px 12px;
  background:#f1f3f5;
  border-radius:11px;
  font-size:16px;
  cursor:pointer;
}

.family-word.current{
  background:#20252b;
  color:#fff;
}

/* 高频词 */
.high{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.high span{
  background:#f2f4f6;
  border-radius:10px;
  padding:9px 12px;
  font-size:15px;
}

/* 母句 */
.sentence{
  font-size:23px;
  line-height:1.5;
  font-weight:650;
}

.chinese{
  color:#737c87;
  margin-top:7px;
  font-size:15px;
}

/* 控制 */
.controls{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  flex:1;
  border:0;
  padding:13px;
  border-radius:14px;
  background:#eef1f4;
  font-size:15px;
  font-weight:650;
}

.btn.primary{
  background:#20252b;
  color:white;
}

/* 练习 */
.practice{
  display:none;
}

.practice.show{
  display:block;
}

.answer{
  width:100%;
  border:1px solid #e1e5e9;
  border-radius:13px;
  padding:13px;
  font-size:16px;
  margin-top:10px;
  outline:none;
}

.result{
  margin-top:10px;
  font-size:15px;
  min-height:22px;
}

/* 底部 */
.progress{
  text-align:center;
  color:#8a929c;
  font-size:13px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🎧 Chaowen AI</div>
    <div class="sub">拼读词族 · 声音块 · 高频词 · 母句</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="selectFamily('at')">-at</button>
    <button class="tab" onclick="selectFamily('an')">-an</button>
    <button class="tab" onclick="selectFamily('ap')">-ap</button>
    <button class="tab" onclick="selectFamily('it')">-it</button>
    <button class="tab" onclick="selectFamily('in')">-in</button>
    <button class="tab" onclick="selectFamily('ig')">-ig</button>
  </div>

  <!-- 单词 -->
  <div class="card">

    <div class="section-title">① 当前单词</div>

    <div class="word" id="word">cat</div>

    <div class="meaning" id="meaning">猫</div>

    <div class="ipa" id="ipa">/kæt/</div>

    <button class="play-main" onclick="speakWord()">
      🔊 听单词
    </button>

    <!-- 声音块 -->
    <div class="section-title" style="margin-top:22px;">
      ② 声音块
    </div>

    <div class="blocks" id="blocks"></div>

    <!-- 合音 -->
    <div class="blend-box">
      <div class="blend-label">③ 二块音合起来</div>
      <div class="blend" id="blend">c + at → cat</div>
    </div>

  </div>

  <!-- 词族 -->
  <div class="card">

    <div class="section-title">④ 同一个声音家族</div>

    <div class="family" id="family"></div>

  </div>

  <!-- 高频词 -->
  <div class="card">

    <div class="section-title">⑤ 高频词</div>

    <div class="high">
      <span>I</span>
      <span>the</span>
      <span>on</span>
      <span>my</span>
      <span>is</span>
    </div>

  </div>

  <!-- 母句 -->
  <div class="card">

    <div class="section-title">⑥ 母句</div>

    <div class="sentence" id="sentence">
      The cat sat on the mat.
    </div>

    <div class="chinese" id="sentenceCn">
      那只猫坐在垫子上。
    </div>

    <button class="play-main" onclick="speakSentence()">
      🔊 听整句
    </button>

    <div class="controls">
      <button class="btn" onclick="speakSentenceSlow()">
        🐢 慢速
      </button>

      <button class="btn" onclick="speakSentenceNormal()">
        ▶ 正常
      </button>
    </div>

  </div>

  <!-- 听力练习 -->
  <div class="card">

    <div class="section-title">⑦ 听音 → 开口</div>

    <button class="play-main" onclick="startListening()">
      🎧 先听，不看答案
    </button>

    <div id="practice" class="practice">

      <input
        class="answer"
        id="answer"
        placeholder="听完后，把你听到的英文输入这里"
        autocomplete="off"
      >

      <button
        class="btn primary"
        style="width:100%;margin-top:10px;"
        onclick="checkAnswer()"
      >
        检查
      </button>

      <div class="result" id="result"></div>

    </div>

  </div>

  <div class="progress" id="progress">
    第 1 组 · -at 词族
  </div>

</div>


<script>

/* =========================
   词族数据
========================= */

const families = {

  at:{
    words:[
      ["cat","猫","/kæt/"],
      ["bat","蝙蝠","/bæt/"],
      ["fat","胖的","/fæt/"],
      ["hat","帽子","/hæt/"],
      ["mat","垫子","/mæt/"],
      ["rat","老鼠","/ræt/"],
      ["sat","坐","/sæt/"]
    ],
    sentence:"The cat sat on the mat.",
    cn:"那只猫坐在垫子上。"
  },

  an:{
    words:[
      ["can","能够；罐头","/kæn/"],
      ["fan","风扇；粉丝","/fæn/"],
      ["man","男人","/mæn/"],
      ["pan","平底锅","/pæn/"],
      ["ran","跑","/ræn/"],
      ["van","面包车","/væn/"]
    ],
    sentence:"The man ran to the van.",
    cn:"那个男人跑向面包车。"
  },

  ap:{
    words:[
      ["cap","帽子","/kæp/"],
      ["map","地图","/mæp/"],
      ["nap","小睡","/næp/"],
      ["tap","轻敲；水龙头","/tæp/"],
      ["lap","膝盖；大腿","/læp/"]
    ],
    sentence:"I have a map and a cap.",
    cn:"我有一张地图和一顶帽子。"
  },

  it:{
    words:[
      ["bit","一点","/bɪt/"],
      ["fit","适合","/fɪt/"],
      ["hit","击打","/hɪt/"],
      ["kit","工具包","/kɪt/"],
      ["sit","坐","/sɪt/"]
    ],
    sentence:"Sit and wait a bit.",
    cn:"坐下来等一会儿。"
  },

  in:{
    words:[
      ["bin","箱子","/bɪn/"],
      ["fin","鳍","/fɪn/"],
      ["pin","别针","/pɪn/"],
      ["win","赢","/wɪn/"],
      ["tin","罐头","/tɪn/"]
    ],
    sentence:"Put it in the bin.",
    cn:"把它放进箱子里。"
  },

  ig:{
    words:[
      ["big","大的","/bɪɡ/"],
      ["dig","挖","/dɪɡ/"],
      ["fig","无花果","/fɪɡ/"],
      ["pig","猪","/pɪɡ/"],
      ["wig","假发","/wɪɡ/"]
    ],
    sentence:"The pig is big.",
    cn:"这头猪很大。"
  }

};


/* =========================
   当前状态
========================= */

let currentFamily = "at";
let currentIndex = 0;

let currentData = families[currentFamily].words[currentIndex];


/* =========================
   初始化
========================= */

function init(){

  renderFamily();

  renderWord();

}

init();


/* =========================
   显示当前单词
========================= */

function renderWord(){

  currentData =
    families[currentFamily].words[currentIndex];

  const word = currentData[0];

  document.getElementById("word").textContent =
    word;

  document.getElementById("meaning").textContent =
    currentData[1];

  document.getElementById("ipa").textContent =
    currentData[2];

  /*
    核心：
    把单词拆成
    第一个音块 + 词族音块
  */

  const first = word.charAt(0);
  const ending = word.slice(1);

  document.getElementById("blocks").innerHTML = `

    <div class="block"
         onclick="speakPart('${first}')">
      ${first}
    </div>

    <div class="plus">+</div>

    <div class="block"
         onclick="speakPart('${ending}')">
      ${ending}
    </div>

  `;

  document.getElementById("blend").textContent =
    `${first} + ${ending} → ${word}`;

  const family =
    families[currentFamily];

  document.getElementById("sentence").textContent =
    family.sentence;

  document.getElementById("sentenceCn").textContent =
    family.cn;

  document.getElementById("progress").textContent =
    `第 ${currentIndex + 1} / ${family.words.length} 个 · -${currentFamily} 词族`;

}


/* =========================
   显示词族
========================= */

function renderFamily(){

  const box =
    document.getElementById("family");

  box.innerHTML = "";

  families[currentFamily].words.forEach(
    (item,index)=>{

      const div =
        document.createElement("div");

      div.className =
        "family-word " +
        (index === currentIndex ? "current" : "");

      div.textContent =
        item[0];

      div.onclick = ()=>{
        currentIndex = index;
        renderFamily();
        renderWord();
      };

      box.appendChild(div);

    }
  );

}


/* =========================
   切换词族
========================= */

function selectFamily(name){

  currentFamily = name;
  currentIndex = 0;

  document.querySelectorAll(".tab")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  event.target.classList.add("active");

  renderFamily();
  renderWord();

}


/* =========================
   语音引擎
========================= */

function getVoice(){

  const voices =
    speechSynthesis.getVoices();

  return voices.find(v =>
    v.lang === "en-US"
  ) ||
  voices.find(v =>
    v.lang.startsWith("en")
  ) ||
  voices[0];

}


/* =========================
   通用播放
========================= */

function speak(text,rate=0.78){

  speechSynthesis.cancel();

  setTimeout(()=>{

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = rate;

    utterance.pitch = 1;

    const voice = getVoice();

    if(voice){
      utterance.voice = voice;
    }

    speechSynthesis.speak(utterance);

  },80);

}


/* =========================
   单词
========================= */

function speakWord(){

  speak(currentData[0],0.68);

}


/* =========================
   音块
========================= */

function speakPart(part){

  /*
    这里先使用系统语音模拟声音块。
    后续可以替换成真正的 phoneme 音频。
  */

  speak(part,0.58);

}


/* =========================
   句子
========================= */

function speakSentence(){

  speak(
    families[currentFamily].sentence,
    0.78
  );

}

function speakSentenceSlow(){

  speak(
    families[currentFamily].sentence,
    0.55
  );

}

function speakSentenceNormal(){

  speak(
    families[currentFamily].sentence,
    0.9
  );

}


/* =========================
   听力训练
========================= */

function startListening(){

  const practice =
    document.getElementById("practice");

  practice.classList.add("show");

  document.getElementById("answer").value = "";

  document.getElementById("result").textContent = "";

  /*
    先隐藏文字，再播放
  */

  speak(
    families[currentFamily].sentence,
    0.72
  );

}


/* =========================
   检查答案
========================= */

function checkAnswer(){

  const input =
    document.getElementById("answer")
      .value
      .trim()
      .toLowerCase();

  const answer =
    families[currentFamily].sentence
      .toLowerCase();

  const result =
    document.getElementById("result");

  if(input === answer){

    result.textContent =
      "✅ 对了！你已经听出来了。";

  }else{

    result.innerHTML =
      "再听一次 👂<br>" +
      "<span style='color:#777'>" +
      "听清声音后再写，不急着看答案。" +
      "</span>";

  }

}


/* =========================
   加载语音
========================= */

speechSynthesis.onvoiceschanged =
  ()=>{
    speechSynthesis.getVoices();
  };

</script>

</body>
</html>
