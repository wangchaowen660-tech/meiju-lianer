<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>极速词块闯关</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: #1a202c; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { padding: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; }
    .score { color: #f6e05e; }
    .level { color: #63b3ed; }
    .timer-bg { width: 100%; height: 6px; background: #2d3748; }
    .timer-fill { height: 100%; background: #48bb78; width: 100%; transition: width 0.1s linear; }
    .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    .question-cn { font-size: 32px; font-weight: 800; margin-bottom: 40px; line-height: 1.4; color: #e2e8f0; }
    .options { width: 100%; display: flex; flex-direction: column; gap: 15px; }
    .option-btn { width: 100%; padding: 18px; border-radius: 16px; border: 2px solid #4a5568; background: #2d3748; color: #fff; font-size: 18px; font-weight: bold; transition: all 0.1s; }
    .option-btn:active { transform: scale(0.97); }
    .option-btn.correct { background: #48bb78; border-color: #48bb78; }
    .option-btn.wrong { background: #f56565; border-color: #f56565; }
    .combo { position: absolute; top: 30%; font-size: 40px; font-weight: 900; color: #f6e05e; opacity: 0; pointer-events: none; transform: scale(0.5); transition: all 0.3s; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
    .combo.show { opacity: 1; transform: scale(1.2) translateY(-20px); }
    
    /* 遮罩层 */
    .overlay { position: absolute; inset: 0; background: rgba(26,32,44,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 10; text-align: center; backdrop-filter: blur(5px); }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 32px; margin-bottom: 10px; color: #f6e05e; }
    .overlay p { font-size: 16px; color: #a0aec0; margin-bottom: 30px; line-height: 1.6; }
    .btn-main { width: 100%; max-width: 300px; padding: 18px; border-radius: 30px; background: linear-gradient(135deg, #e94560, #f97316); color: #fff; font-size: 20px; font-weight: bold; border: none; box-shadow: 0 8px 20px rgba(233,69,96,0.4); }
    .btn-main:active { transform: scale(0.95); }
    
    /* 付费墙特别样式 */
    .paywall-box { background: #fff; border-radius: 20px; padding: 25px 20px; color: #333; width: 100%; max-width: 320px; }
    .paywall-box h2 { color: #0f172a; margin-bottom: 5px; font-size: 22px; }
    
    /* 醒目的 9.9 价格标签 */
    .price-tag { 
        background: linear-gradient(135deg, #fff1f3, #fffbeb); 
        border: 2px dashed #fecdd3; 
        border-radius: 12px; 
        padding: 12px; 
        display: inline-block; 
        color: #e94560; 
        margin: 10px 0 15px 0;
        box-shadow: 0 4px 10px rgba(233,69,96,0.1);
    }
    .price-tag span { font-size: 18px; font-weight: bold; }
    .price-tag strong { font-size: 38px; font-weight: 900; letter-spacing: -1px; }
    .price-tag small { display: block; font-size: 12px; color: #b8730a; margin-top: 2px; font-weight: bold; }
    
    /* 醒目微信号 */
    .wechat-card { background: #fff1f3; border: 1px solid #fecdd3; border-radius: 12px; padding: 12px; margin-bottom: 20px; }
    .wechat-card span { display: block; font-size: 13px; color: #e94560; margin-bottom: 5px; }
    .wechat-card strong { font-size: 22px; color: #e94560; user-select: all; letter-spacing: 1px; }
    
    .input-box { width:100%; padding:14px; border:2px solid #e2e8f0; border-radius:10px; margin-bottom:15px; font-size:16px; text-align:center; outline:none; font-weight:bold; }
    .input-box:focus { border-color: #e94560; }
</style>
</head>
<body>

    <div class="top-bar">
        <div class="level" id="ui-level">第 1 关</div>
        <div class="score" id="ui-score">0 分</div>
    </div>
    <div class="timer-bg"><div class="timer-fill" id="ui-timer"></div></div>

    <div class="game-area">
        <div class="combo" id="ui-combo">Perfect!</div>
        <div class="question-cn" id="ui-question">点击开始游戏</div>
        <div class="options" id="ui-options"></div>
    </div>

    <div class="overlay" id="start-screen">
        <h1>⚡️ 极速词块</h1>
        <p>内含 1000+ 核心词库。<br>短句与单词交替，挑战你的极限反应！</p>
        <button class="btn-main" onclick="startGame()">开始闯关</button>
    </div>

    <div class="overlay hidden" id="gameover-screen">
        <h1>游戏结束</h1>
        <p>你的最终得分：<span id="final-score" style="color:#f6e05e; font-size:24px;">0</span> 分</p>
        <button class="btn-main" onclick="restartGame()">再来一次</button>
    </div>

    <div class="overlay hidden" id="paywall-screen">
        <div class="paywall-box">
            <h2>🎉 突破 200 分！</h2>
            <p style="font-size:14px; color:#64748b;">你的语感非常棒！仅需支付：</p>
            
            <div class="price-tag">
                <span>¥</span><strong>9.9</strong>
                <small>终身解锁 · 无限挑战</small>
            </div>

            <p style="font-size:13px; color:#94a3b8; margin-bottom:10px;">请添加下方微信转账，备注“英语”</p>
            
            <div class="wechat-card">
                <span>👇 长按复制微信号 👇</span>
                <strong>king13142786</strong>
            </div>
            
            <input type="text" id="code-input" class="input-box" placeholder="在此输入激活码">
            <button class="btn-main" onclick="checkCode()" style="font-size:18px; padding:14px;">立即激活并继续</button>
        </div>
    </div>

    <script>
        // ================= 核心题库 =================
        const rawSentences = [
            ["我想点这个", "I'd like to order this"],["我不知道去哪", "I have no idea where to go"],["你能帮我一下吗", "Can you help me with this"],
            ["你是什么意思", "What do you mean"],["我该去哪里", "Where should I visit"],["现在几点了", "What time is it now"],
            ["请再说一遍", "Could you say that again"],["我马上就到", "I'll be there soon"],["我想预订房间", "I'd like to book a room"],
            ["这个多少钱", "How much does it cost"],["我不明白", "I don't understand"],["随便看看", "I'm just looking, thanks"],
            ["很高兴认识你", "Nice to meet you"],["祝你有美好的一天", "Have a nice day"],["好久不见", "Long time no see"],
            ["你最近怎么样", "How have you been"],["我同意你的看法", "I agree with you"],["没问题", "No problem"],
            ["别担心", "Don't worry about it"],["小心点", "Be careful"],["我非常喜欢它", "I like it very much"],
            ["这太难了", "This is too difficult"],["这非常简单", "This is very easy"],["我饿了", "I am hungry"],
            ["我渴了", "I am thirsty"],["我很累", "I am tired"],["我现在很忙", "I am busy now"],
            ["我马上回来", "I will be right back"],["请等一下", "Please wait a moment"],["路上小心", "Drive safely"],
            ["祝你好运", "Good luck"],["恭喜你", "Congratulations"],["生日快乐", "Happy birthday"],
            ["新年快乐", "Happy new year"],["圣诞快乐", "Merry Christmas"],["对不起，我迟到了", "Sorry, I am late"],
            ["没关系", "It doesn't matter"],["不要客气", "You are welcome"],["我很抱歉", "I am so sorry"],
            ["请给我菜单", "Please give me the menu"],["买单", "Check, please"],["可以刷卡吗", "Can I pay by card"],
            ["我要打包", "I want to take it away"],["不要放辣", "No spicy please"],["我对海鲜过敏", "I am allergic to seafood"],
            ["洗手间在哪里", "Where is the restroom"],["出口在哪里", "Where is the exit"],["我迷路了", "I am lost"],
            ["可以帮我拍张照吗", "Can you take a photo for me"],["我看不懂这个", "I can't read this"],["这里可以停车吗", "Can I park here"]
        ];

        const rawWords = [
            ["水", "water"],["咖啡", "coffee"],["食物", "food"],["钱", "money"],["时间", "time"],["工作", "work"],["家", "home"],["手机", "phone"],
            ["朋友", "friend"],["城市", "city"],["酒店", "hotel"],["机场", "airport"],["护照", "passport"],["票", "ticket"],["行李", "luggage"],
            ["天气", "weather"],["问题", "question"],["答案", "answer"],["电脑", "computer"],["网络", "internet"],["密码", "password"],
            ["医生", "doctor"],["老师", "teacher"],["学生", "student"],["警察", "police"],["苹果", "apple"],["香蕉", "banana"],
            ["橙子", "orange"],["鸡蛋", "egg"],["牛奶", "milk"],["面包", "bread"],["米饭", "rice"],["鸡肉", "chicken"],["牛肉", "beef"],
            ["鱼", "fish"],["蔬菜", "vegetable"],["水果", "fruit"],["茶", "tea"],["果汁", "juice"],["啤酒", "beer"],["红酒", "wine"],
            ["桌子", "table"],["椅子", "chair"],["床", "bed"],["门", "door"],["窗户", "window"],["车", "car"],["公交车", "bus"],
            ["火车", "train"],["飞机", "airplane"],["自行车", "bicycle"],["路", "road"],["街道", "street"],["公园", "park"],
            ["商店", "store"],["超市", "supermarket"],["医院", "hospital"],["银行", "bank"],["学校", "school"],["公司", "company"],
            ["办公室", "office"],["房间", "room"],["厨房", "kitchen"],["卫生间", "bathroom"],["书", "book"],["笔", "pen"],
            ["纸", "paper"],["包", "bag"],["衣服", "clothes"],["鞋子", "shoes"],["帽子", "hat"],["手表", "watch"],["钥匙", "key"],
            ["吃", "eat"],["喝", "drink"],["睡觉", "sleep"],["走路", "walk"],["跑", "run"],["买", "buy"],["卖", "sell"],["说", "speak"],
            ["听", "listen"],["看", "watch"],["阅读", "read"],["写", "write"],["学习", "study"],["休息", "rest"],["帮助", "help"],
            ["寻找", "find"],["丢失", "lose"],["支付", "pay"],["等待", "wait"],["开始", "start"],["结束", "finish"],["打开", "open"],
            ["关闭", "close"],["来", "come"],["去", "go"],["坐", "sit"],["站", "stand"],["给", "give"],["拿", "take"],
            ["知道", "know"],["认为", "think"],["理解", "understand"],["记得", "remember"],["忘记", "forget"],["爱", "love"],
            ["喜欢", "like"],["讨厌", "hate"],["想要", "want"],["需要", "need"],["使用", "use"],["工作", "work"],["玩", "play"],
            ["唱歌", "sing"],["跳舞", "dance"],["做饭", "cook"],["打扫", "clean"],["洗", "wash"],["穿", "wear"],["脱", "take off"],
            ["开车", "drive"],["飞", "fly"],["游泳", "swim"],["笑", "laugh"],["哭", "cry"],["尝试", "try"],["改变", "change"],
            ["好的", "good"],["坏的", "bad"],["大的", "big"],["小的", "small"],["热的", "hot"],["冷的", "cold"],["开心的", "happy"],
            ["伤心的", "sad"],["贵的", "expensive"],["便宜的", "cheap"],["快的", "fast"],["慢的", "slow"],["简单的", "easy"],
            ["困难的", "difficult"],["重要", "important"],["美丽的", "beautiful"],["丑陋的", "ugly"],["干净的", "clean"],["脏的", "dirty"],
            ["新的", "new"],["旧的", "old"],["年轻的", "young"],["长的", "long"],["短的", "short"],["高的", "tall"],["矮的", "short"],
            ["胖的", "fat"],["瘦的", "thin"],["聪明", "smart"],["愚蠢", "stupid"],["强壮", "strong"],["虚弱", "weak"],["累的", "tired"],
            ["无聊的", "boring"],["有趣的", "interesting"],["危险的", "dangerous"],["安全的", "safe"],["安静的", "quiet"],["吵闹的", "noisy"],
            ["明亮的", "bright"],["黑暗的", "dark"],["正确的", "right"],["错误的", "wrong"],["真的", "true"],["假的", "false"],
            ["在...里面", "inside"],["在...上面", "on"],["在...下面", "under"],["在...旁边", "beside"],["在...前面", "in front of"],
            ["在...后面", "behind"],["因为", "because"],["但是", "but"],["而且", "and"],["或者", "or"],["如果", "if"],["虽然", "although"],
            ["为了", "for"],["从...来", "from"],["去往", "to"],["和...一起", "with"],["没有", "without"],["关于", "about"],["在...之间", "between"]
        ];

        const sentences = rawSentences.map(item => ({ cn: item[0], en: item[1] }));
        const words = rawWords.map(item => ({ cn: item[0], en: item[1] }));

        let currentScore = 0;
        let currentLevel = 1;
        let comboCount = 0;
        let timeLeft = 100; 
        let timerInterval = null;
        let currentQuestion = null;
        let isLocked = false; 
        let isSentenceTurn = true; 

        let sentencePool = [];
        let wordPool = [];

        // ================= 音频引擎 (音效 + BGM) =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmInterval = null;

        // 播放短音效
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // 生成 8-bit 街机风 BGM (纯代码，无需加载)
        function playBGM() {
            if (bgmInterval) return; // 防止重复
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let step = 0;
            // 经典动感 Bassline 旋律音高
            const notes = [130.81, 130.81, 164.81, 130.81, 146.83, 130.81, 196.00, 164.81]; 
            
            bgmInterval = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'triangle'; // 柔和一点的电子音
                osc.frequency.value = notes[step % notes.length];
                
                // BGM 音量调小，不抢答题音效
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
                step++;
            }, 150); // 150ms 一拍，速度很快
        }

        function stopBGM() {
            clearInterval(bgmInterval);
            bgmInterval = null;
        }

        // ================= 游戏逻辑 =================
        const $ = id => document.getElementById(id);

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startGame() {
            $("start-screen").classList.add("hidden");
            $("gameover-screen").classList.add("hidden");
            $("paywall-screen").classList.add("hidden");
            
            currentScore = 0;
            currentLevel = 1;
            comboCount = 0;
            isLocked = false;
            isSentenceTurn = true; 
            timeLeft = 100;
            
            sentencePool = [...sentences];
            wordPool = [...words];
            shuffleArray(sentencePool);
            shuffleArray(wordPool);
            
            updateUI();
            nextQuestion();
            startTimer();
            
            // 开始 BGM
            playBGM();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= (0.15 + currentLevel * 0.02); 
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateUI();
                    gameOver();
                } else {
                    updateUI();
                }
            }, 100);
        }

        function nextQuestion() {
            currentLevel = Math.floor(currentScore / 100) + 1;
            $("ui-level").textContent = "第 " + currentLevel + " 关";
            
            if (currentScore >= 200 && !isLocked) {
                pauseGame();
                $("paywall-screen").classList.remove("hidden");
                return;
            }

            let sourceDB = isSentenceTurn ? sentencePool : wordPool;
            
            if (sourceDB.length === 0) {
                sourceDB = isSentenceTurn ? [...sentences] : [...words];
                shuffleArray(sourceDB);
            }

            const correctAnswer = sourceDB.shift(); 
            currentQuestion = correctAnswer;

            let allOptions = isSentenceTurn ? sentences : words;
            let options = [correctAnswer];
            while (options.length < 4) {
                const randomWrong = allOptions[Math.floor(Math.random() * allOptions.length)];
                if (!options.find(o => o.en === randomWrong.en)) {
                    options.push(randomWrong);
                }
            }
            shuffleArray(options);

            $("ui-question").textContent = correctAnswer.cn;
            const optBox = $("ui-options");
            optBox.innerHTML = "";
            
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.en;
                btn.onclick = () => checkAnswer(btn, opt.en === correctAnswer.en);
                optBox.appendChild(btn);
            });
        }

        function checkAnswer(btn, isCorrect) {
            document.querySelectorAll(".option-btn").forEach(b => b.style.pointerEvents = "none");

            if (isCorrect) {
                playSound('correct');
                btn.classList.add("correct");
                comboCount++;
                currentScore += 10 + (comboCount * 2);
                timeLeft = Math.min(100, timeLeft + 20);
                
                if (comboCount >= 3) showCombo(comboCount + " Combo!");
                isSentenceTurn = !isSentenceTurn; 

                setTimeout(() => nextQuestion(), 300);
            } else {
                playSound('wrong');
                btn.classList.add("wrong");
                comboCount = 0;
                timeLeft = Math.max(0, timeLeft - 8);
                
                document.querySelectorAll(".option-btn").forEach(b => {
                    if (b.textContent === currentQuestion.en) b.classList.add("correct");
                });

                isSentenceTurn = !isSentenceTurn;
                setTimeout(() => {
                    if (timeLeft <= 0) { gameOver(); } else { nextQuestion(); }
                }, 700);
            }
            updateUI();
        }

        function showCombo(text) {
            const el = $("ui-combo");
            el.textContent = text;
            el.classList.add("show");
            setTimeout(() => el.classList.remove("show"), 800);
        }

        function updateUI() {
            $("ui-score").textContent = currentScore + " 分";
            const timerEl = $("ui-timer");
            timerEl.style.width = timeLeft + "%";
            timerEl.style.background = timeLeft < 30 ? "#f56565" : "#48bb78";
        }

        function pauseGame() {
            if (timerInterval) clearInterval(timerInterval);
            stopBGM(); // 暂停游戏时，BGM 也暂停
        }

        function gameOver() {
            pauseGame();
            $("final-score").textContent = currentScore;
            $("gameover-screen").classList.remove("hidden");
        }

        function restartGame() {
            startGame();
        }

        function checkCode() {
            const code = document.getElementById("code-input").value.trim();
            // 你的万能测试码
            if (code === "VIP888") {
                isLocked = true;
                $("paywall-screen").classList.add("hidden");
                timeLeft = 100;
                updateUI();
                startTimer();
                playBGM(); // 激活成功后，BGM 继续响
                nextQuestion();
            } else {
                alert("激活码错误，请检查是否输入正确~");
            }
        }
    </script>
</body>
</html>
