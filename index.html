.player{

}

.number{
  font-size:11px;

}


/* 当前词块 */

.chunk{
  margin-top:25px;
  min-height:45px;
  font-size:31px;
  font-weight:800;
  line-height:1.3;
}

.chunk-cn{
  margin-top:7px;

}


/* 整句 */

.sentence{
  margin-top:22px;
  padding-top:19px;
  border-top:1px solid #f0f1f2;
  font-size:20px;
  line-height:1.5;
  font-weight:650;
}

.sentence-cn{
  margin-top:5px;
  color:#999fa5;

}


/* 播放 */

.play{

  border-radius:50%;

  background:#17191c;
  color:white;

}

.play:active{
  transform:scale(.94);
}


/* 进度 */

  margin-top:25px;
}

.track{
  width:100%;
  height:5px;
  background:#e5e7e9;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  width:0%;
  height:100%;
  background:#17191c;
}

.time{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:#9ca1a7;
  font-size:11px;
}


/* 上下一句 */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:32px;
  margin-top:20px;
}

.control{
  border:0;

}

.control.repeat{

}


/* 速度 */

  justify-content:center;
  gap:7px;
  margin-top:18px;
}

.speed button{
  border:0;
  border-radius:12px;

  background:#f0f1f3;
  color:#737981;
  font-size:12px;

.speed button.active{

/* 模式 */

}

  flex:1;
  border:0;
  border-radius:12px;

  color:#747b82;
  font-size:12px;
}

.modes button.active{

  color:#fff;
}

const actions = [

  ["there","那里"],
  ["here","这里"]
];


function createGeneratedLessons(){

  const result=[];

  subjects.forEach(s=>{

    actions.forEach(a=>{

      places.forEach(p=>{

        let english =
          s[0] + " " +
          a[0] + " " +
          p[0] + ".";

        let chinese =
          s[1] +
          a[1] +
          p[1] +
          "。";

        result.push({
          en:english,
          cn:chinese,
          chunk:s[0]+" "+a[0],
          chunkCn:a[1],
          category:"Daily"
        });

      });

    });

  });

  return result;
}

/* =========================================================
   ⑤ 最重要：稳定语音引擎
========================================================= */

function speak(text,rate){

  return new Promise(resolve=>{

    /*
      每一次播放都创建全新的 utterance
    */

    speechSynthesis.cancel();

    currentUtterance=null;

    setTimeout(()=>{

      const utterance =
        new SpeechSynthesisUtterance(text);

      currentUtterance=utterance;

      utterance.lang="en-US";

      utterance.rate=rate;

      utterance.pitch=1;

      utterance.volume=1;

      /*
        iPhone / iPad 有时 voices 还没有准备好。
        如果没有指定声音，也可以正常使用系统默认英语声音。
      */

      const voices=
        speechSynthesis.getVoices();

      let voice=
        voices.find(v =>
          v.lang.toLowerCase()==="en-us"
        );

      if(!voice){

        voice=
          voices.find(v =>
            v.lang.toLowerCase().startsWith("en")
          );

      }

      if(voice){
        utterance.voice=voice;
      }

      let finished=false;

      function done(){

        if(finished)return;

        finished=true;

        currentUtterance=null;

        resolve();

      }

      utterance.onend=done;

      utterance.onerror=done;

      /*
        某些 iOS 环境 speechSynthesis
        会出现长时间不启动。
      */

      speechSynthesis.speak(utterance);

      /*
        保活机制
      */

      let keepAlive=
        setInterval(()=>{

          if(!playing){

            clearInterval(keepAlive);

            return;

          }

          /*
            某些浏览器需要 resume()
          */

          if(speechSynthesis.paused){

            speechSynthesis.resume();

          }

        },1000);

      utterance.onend=()=>{
        clearInterval(keepAlive);
        done();
      };

      utterance.onerror=()=>{
        clearInterval(keepAlive);
        done();
      };

    },120);

  });

}

      speed
    );

    if(!valid(myToken))return;

    await wait(350);

    updateProgress(45);

    await speak(
      lesson.en,
      speed
    );

  }


  else if(mode==="sentence"){

    updateProgress(15);

    await speak(
      lesson.en,
      speed
    );

  }


  else if(mode==="listen"){

    hideText();

    await speak(
      lesson.en,
      speed
    );

    showText();

  }


  else if(mode==="speak"){

    updateProgress(20);

    await speak(
      lesson.en,
      speed
    );

    if(!valid(myToken))return;

    updateProgress(45);

    /*
      留出时间让用户自己开口
    */

    await wait(2500);

    if(!valid(myToken))return;

    await speak(
      lesson.en,
      speed
    );

  }


  if(!valid(myToken))return;


  updateProgress(100);

  playing=false;

  document.getElementById("playButton")
    .textContent="▶";


  if(repeat){

    setTimeout(()=>{

      if(!playing){
        playCurrent();
      }

    },600);

  }

}


/* =========================================================
   ⑦ 播放安全检查
========================================================= */

function valid(token){

  return (
    playing &&
    token===playToken
  );

}


/* =========================================================
   ⑧ 停止
========================================================= */

function stop(){

  playing=false;

  playToken++;

  speechSynthesis.cancel();

  if(
    speechSynthesis.paused
  ){

    speechSynthesis.resume();

  }

  currentUtterance=null;

  document.getElementById("playButton")
    .textContent="▶";

}


/* =========================================================
   ⑨ 等待
========================================================= */

function wait(ms){

  return new Promise(resolve=>{
    setTimeout(resolve,ms);
  });

}


/* =========================================================
   ⑩ 下一句
========================================================= */

function nextLesson(){

  stop();

  index++;

  if(index>=1000){

    index=0;

  }

  render();

}


/* =========================================================
   ⑪ 上一句
========================================================= */

function previousLesson(){

  stop();

  index--;

  if(index<0){

    index=999;

  }

  render();

}


/* =========================================================
   ⑫ 重复
========================================================= */

function toggleRepeat(){

  repeat=!repeat;

  const button=
    document.getElementById("repeatButton");

  button.style.opacity=
    repeat ? "1" : ".45";

}


/* =========================================================
   ⑬ 速度
========================================================= */

function changeSpeed(value,button){

  speed=value;

  document
    .querySelectorAll(".speed button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

}


/* =========================================================
   ⑭ 模式
========================================================= */

function changeMode(newMode,button){

  stop();

  mode=newMode;

  document
    .querySelectorAll(".modes button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

  /*
    听力模式进入时不立即隐藏。
    点击播放以后再隐藏。
  */

  showText();

}


/* =========================================================
   ⑮ 跳转
========================================================= */

function jumpToLesson(){

  const input=
    document.getElementById("jumpInput");

  const value=
    parseInt(input.value,10);

  if(
    !Number.isInteger(value) ||
    value<1 ||
    value>1000
  ){

    input.focus();

    return;

  }

  stop();

  index=value-1;

  render();

  input.value="";

}


/* =========================================================
   ⑯ 隐藏 / 显示
========================================================= */

function hideText(){

  document.getElementById("chunk")
    .style.visibility="hidden";

  document.getElementById("chunkCn")
    .style.visibility="hidden";

  document.getElementById("sentence")
    .style.visibility="hidden";

  document.getElementById("sentenceCn")
    .style.visibility="hidden";

}


function showText(){

  document.getElementById("chunk")
    .style.visibility="visible";

  document.getElementById("chunkCn")
    .style.visibility="visible";

  document.getElementById("sentence")
    .style.visibility="visible";

  document.getElementById("sentenceCn")
    .style.visibility="visible";

}


/* =========================================================
   ⑰ 进度
========================================================= */

function updateProgress(percent){

  document.getElementById("bar")
    .style.width=
    percent+"%";

  const seconds=
    Math.round(
      percent*0.08
    );

  document.getElementById("currentTime")
    .textContent=
    "00:"+
    String(seconds)
      .padStart(2,"0");

}


/* =========================================================
   ⑱ 听力检查
========================================================= */

function checkAnswer(){

  const input=
    document
      .getElementById("answer")
      .value
      .trim()
      .toLowerCase();

  const answer=
    lessons[index]
      .en
      .toLowerCase();

  const result=
    document.getElementById("result");


  if(!input){

    result.textContent=
      "先写下你听到的内容。";

    return;

  }


  if(input===answer){

    result.textContent=
      "✅ 对了！";

  }else{

    result.textContent=
      "再听一次 👂";

  }

}


/* =========================================================
   ⑲ 快速句子
========================================================= */

function createQuickNav(){

  const box=
    document.getElementById("quickNav");

  /*
    只显示几个常用入口，
    不把1000句全部塞到页面。
  */

  const numbers=[
    1,2,3,4,5,
    10,20,50,100,
    200,500,800,1000
  ];

  numbers.forEach(n=>{

    const button=
      document.createElement("button");

    button.textContent=
      n;

    button.onclick=()=>{

      stop();

      index=n-1;

      render();

    };

    box.appendChild(button);

  });

}


/* =========================================================
   ⑳ 初始化
========================================================= */

createQuickNav();

render();


/* =========================================================
   ㉑ 预加载语音
========================================================= */

function loadVoices(){

  speechSynthesis.getVoices();

}

loadVoices();

if(
  "onvoiceschanged"
  in speechSynthesis
){

  speechSynthesis.onvoiceschanged=
    loadVoices;

}


/* =========================================================
   ㉒ 页面隐藏停止
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stop();

    }

  }
);


/* =========================================================
   ㉓ 空格 / 左右键
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.target.tagName==="INPUT"
    ){

      return;

    }

    if(e.code==="Space"){

      e.preventDefault();

      togglePlay();

    }

    if(e.code==="ArrowRight"){

      nextLesson();

    }

    if(e.code==="ArrowLeft"){

      previousLesson();

    }

  }
);

</script>
