/* ================================
   状态
================================ */

let current = 0;


/* ================================
   显示
================================ */

function showSentence(){

    const item =
        lessons[current];

    document.getElementById("scene").innerText =
        item[0];

    document.getElementById("sentence").innerText =
        item[1];

    document.getElementById("meaning").innerText =
        item[2];

    document.getElementById("progress").innerText =
        "第 " +
        (current + 1) +
        " / " +
        lessons.length +
        " 句";
}


/* ================================
   播放器
   现在只使用干净的单次语音调用
================================ */

function playSentence(){

    window.speechSynthesis.cancel();

    const english =
        lessons[current][1];

    const voice =
        new SpeechSynthesisUtterance(
            english
        );

    voice.lang =
        "en-US";

    voice.rate =
        0.72;

    voice.pitch =
        1.0;

    voice.volume =
        1.0;

    voice.onstart =
        function(){

            document.getElementById("status").innerText =
                "🎧 正在播放……";

        };

    voice.onend =
        function(){

            document.getElementById("status").innerText =
                "✅ 听完了";

        };

    voice.onerror =
        function(){

            document.getElementById("status").innerText =
                "⚠️ 播放失败";

        };

    window.speechSynthesis.speak(
        voice
    );
}


/* ================================
   下一句
================================ */

function nextSentence(){

    window.speechSynthesis.cancel();

    current++;

    if(
        current >=
        lessons.length
    ){

        current = 0;

    }

    showSentence();
}


/* ================================
   上一句
================================ */

function previousSentence(){

    window.speechSynthesis.cancel();

    current--;

    if(current < 0){

        current =
            lessons.length - 1;

    }

    showSentence();
}


/* ================================
   随机
================================ */

function randomSentence(){

    window.speechSynthesis.cancel();

    current =
        Math.floor(
            Math.random() *
            lessons.length
        );

    showSentence();

    document.getElementById("status").innerText =
        "🎲 已随机选择";
}


/* ================================
   中文 + 英文搜索
================================ */

function searchLessons(){

    const keyword =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if(keyword === ""){
        return;
    }

    const found =
        lessons.filter(
            function(item){

                return (
                    item[0]
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    item[1]
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    item[2]
                    .toLowerCase()
                    .includes(keyword)
                );

            }
        );


    if(found.length === 0){

        results.innerHTML =
            "<div class='result'>没有找到相关句子</div>";

        return;
    }


    found.forEach(
        function(item){

            const box =
                document.createElement("div");

            box.className =
                "result";

            box.innerHTML =
                "<div class='resultEnglish'>" +
                item[1] +
                "</div>" +

                "<div class='resultChinese'>" +
                item[2] +
                "</div>";


            box.onclick =
                function(){

                    current =
                        lessons.indexOf(item);

                    showSentence();

                    results.innerHTML = "";

                    document.getElementById("searchInput")
                        .value = "";

                    window.scrollTo({
                        top:0,
                        behavior:"smooth"
                    });

                };


            results.appendChild(box);

        }
    );
}


/* ================================
   启动
================================ */

showSentence();

</script>

/* ================================
   状态
================================ */

let current = 0;


/* ================================
   显示
================================ */

function showSentence(){

    const item =
        lessons[current];

    document.getElementById("scene").innerText =
        item[0];

    document.getElementById("sentence").innerText =
        item[1];

    document.getElementById("meaning").innerText =
        item[2];

    document.getElementById("progress").innerText =
        "第 " +
        (current + 1) +
        " / " +
        lessons.length +
        " 句";
}


/* ================================
   播放器
   现在只使用干净的单次语音调用
================================ */

function playSentence(){

    window.speechSynthesis.cancel();

    const english =
        lessons[current][1];

    const voice =
        new SpeechSynthesisUtterance(
            english
        );

    voice.lang =
        "en-US";

    voice.rate =
        0.72;

    voice.pitch =
        1.0;

    voice.volume =
        1.0;

    voice.onstart =
        function(){

            document.getElementById("status").innerText =
                "🎧 正在播放……";

        };

    voice.onend =
        function(){

            document.getElementById("status").innerText =
                "✅ 听完了";

        };

    voice.onerror =
        function(){

            document.getElementById("status").innerText =
                "⚠️ 播放失败";

        };

    window.speechSynthesis.speak(
        voice
    );
}


/* ================================
   下一句
================================ */

function nextSentence(){

    window.speechSynthesis.cancel();

    current++;

    if(
        current >=
        lessons.length
    ){

        current = 0;

    }

    showSentence();
}


/* ================================
   上一句
================================ */

function previousSentence(){

    window.speechSynthesis.cancel();

    current--;

    if(current < 0){

        current =
            lessons.length - 1;

    }

    showSentence();
}


/* ================================
   随机
================================ */

function randomSentence(){

    window.speechSynthesis.cancel();

    current =
        Math.floor(
            Math.random() *
            lessons.length
        );

    showSentence();

    document.getElementById("status").innerText =
        "🎲 已随机选择";
}


/* ================================
   中文 + 英文搜索
================================ */

function searchLessons(){

    const keyword =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if(keyword === ""){
        return;
    }

    const found =
        lessons.filter(
            function(item){

                return (
                    item[0]
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    item[1]
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    item[2]
                    .toLowerCase()
                    .includes(keyword)
                );

            }
        );


    if(found.length === 0){

        results.innerHTML =
            "<div class='result'>没有找到相关句子</div>";

        return;
    }


    found.forEach(
        function(item){

            const box =
                document.createElement("div");

            box.className =
                "result";

            box.innerHTML =
                "<div class='resultEnglish'>" +
                item[1] +
                "</div>" +

                "<div class='resultChinese'>" +
                item[2] +
                "</div>";


            box.onclick =
                function(){

                    current =
                        lessons.indexOf(item);

                    showSentence();

                    results.innerHTML = "";

                    document.getElementById("searchInput")
                        .value = "";

                    window.scrollTo({
                        top:0,
                        behavior:"smooth"
                    });

                };


            results.appendChild(box);

        }
    );
}


/* ================================
   启动
================================ */

showSentence();

</script>
