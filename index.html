<!DOCTYPE html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f0f2f5;color:#1a202c;min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:500px;margin:0 auto;padding:22px 16px 40px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:18px;font-weight:800;letter-spacing:-.3px}
.counter{font-size:13px;color:#8895a4;font-weight:600}
.progress{height:3px;background:#e2e6eb;border-radius:3px;overflow:hidden;margin-bottom:22px}
.progress-bar{height:100%;width:0%;background:#1a202c;border-radius:3px;transition:width .35s ease}
.card{background:#fff;border-radius:24px;padding:30px 22px 20px;box-shadow:0 4px 24px rgba(20,30,50,.05)}
.category{display:block;text-align:center;font-size:11px;font-weight:700;letter-spacing:1.4px;color:#a0aab6;text-transform:uppercase;margin-bottom:22px}
.stage{min-height:120px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.stage-icon{font-size:42px;line-height:1;margin-bottom:14px}
.instruction{font-size:14px;color:#8895a4;line-height:1.6}
.sentence{display:none;font-size:26px;font-weight:700;line-height:1.35;color:#1a202c}
.sentence.show{display:block}
.translation{display:none;font-size:15px;color:#6b7684;line-height:1.6;margin-top:10px}
.translation.show{display:block}
.hint-panel{display:none;margin-top:18px;text-align:left;background:#fffaf0;border-radius:14px;padding:16px}
.hint-panel.show{display:block}
.hint-decoded{font-size:17px;font-weight:700;color:#b8730a;line-height:1.5;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f5e6c3}
.hint-decoded.empty{font-style:italic;font-weight:400;font-size:13px;color:#a89974}
.hint-notes{font-size:13px;color:#7a6b4a;line-height:1.9}
.hint-notes div::before{content:"· ";color:#c9b375;font-weight:700}
.chunk-panel{display:none;margin-top:18px;text-align:left;background:#f0f5ff;border-radius:14px;padding:14px}
.chunk-panel.show{display:block}
.chunk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.chunk-title{font-size:12px;font-weight:700;color:#4a6fa5;letter-spacing:.5px;flex:1}
.chunk-actions{display:flex;gap:5px}
.chunk-act{font-size:11.5px;font-weight:600;padding:6px 10px;background:#1a202c;color:#fff;border:none;border-radius:9px;cursor:pointer;font-family:inherit;transition:transform .12s ease;white-space:nowrap}
.chunk-act.alt{background:#4a6fa5}
.chunk-act:active{transform:scale(.94)}
.chunk-list{display:flex;flex-wrap:wrap;gap:6px}
.chunk-item{padding:8px 12px;background:#fff;border:1px solid #dae5f5;border-radius:10px;font-size:14px;font-weight:600;color:#2c4a75;cursor:pointer;font-family:inherit;transition:all .15s ease;line-height:1.3;text-align:left}
.chunk-item:active{transform:scale(.96)}
.chunk-item.playing{background:#1a202c;color:#fff;border-color:#1a202c}
.chunk-item.chain{background:#4a6fa5;color:#fff;border-color:#4a6fa5}
.chunk-note{margin-top:10px;font-size:11.5px;color:#7a8aa0;line-height:1.6}
.chips{display:flex;gap:8px;margin-top:22px;margin-bottom:12px}
.chip{flex:1;padding:11px 6px;font-size:13px;font-weight:600;background:#f3f5f8;color:#4a5563;border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:all .15s ease}
.chip:active{transform:scale(.97)}
.chip.active{background:#1a202c;color:#fff}
.play{width:100%;padding:17px;font-size:17px;font-weight:700;background:#1a202c;color:#fff;border:none;border-radius:16px;cursor:pointer;font-family:inherit;transition:all .15s ease}
.play:active{transform:scale(.98)}
.play.playing{background:#2d3748}
.nav{display:flex;align-items:center;gap:10px;margin-top:16px}
.nav-btn{width:46px;height:46px;flex:0 0 auto;background:#fff;color:#1a202c;border:none;border-radius:13px;font-size:18px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(20,30,50,.04);transition:all .15s ease}
.nav-btn:active{transform:scale(.95)}
.speed-group{display:flex;flex:1;gap:3px;background:#fff;padding:4px;border-radius:13px;box-shadow:0 2px 8px rgba(20,30,50,.04)}
.speed{flex:1;padding:10px 4px;font-size:13px;font-weight:600;background:transparent;color:#6b7684;border:none;border-radius:10px;cursor:pointer;font-family:inherit}
.speed.active{background:#1a202c;color:#fff}
.jump-row{display:flex;gap:6px;margin-top:10px}
.jump-row input{flex:1;padding:11px 14px;font-size:13px;border:1px solid #e5e9ee;border-radius:13px;background:#fff;font-family:inherit;color:#4a5563;outline:none;text-align:center}
.jump-row input:focus{border-color:#1a202c}
.jump-row button{padding:11px 20px;font-size:13px;font-weight:600;background:#fff;color:#4a5563;border:1px solid #e5e9ee;border-radius:13px;font-family:inherit;cursor:pointer}
.status{margin-top:14px;text-align:center;font-size:12.5px;color:#8895a4;min-height:18px}
.footer{text-align:center;font-size:11px;color:#b8c2ce;margin-top:28px}
@media(max-width:380px){.sentence{font-size:22px}.stage-icon{font-size:36px}.chip{font-size:12px;padding:10px 4px}}
</style>
</head>

<div class="app">

<header class="header">

    <div class="chunk-panel" id="chunkPanel">

    </div>
  </div>
  <div class="chips">

    <button class="chip" id="hintBtn">🔍 解密</button>

  <button class="play" id="playBtn">🎧 听句子</button>
</div>

<nav class="nav">
  <button class="nav-btn" id="prevBtn">←</button>
  <div class="speed-group">
    <button class="speed active" data-speed="0.7">0.7×</button>

    <button class="speed" data-speed="1">1.0×</button>
  </div>
  <button class="nav-btn" id="nextBtn">→</button>
</nav>

<div class="jump-row">

</div>
<div class="status" id="status"></div>
<footer class="footer">Chaowen AI</footer>

    { re:/\bgoing to\b/gi,     to:"gonna",    note:"going to → gonna /ˈɡɔːnə/（连读 + 弱读）" },
    { re:/\bgot to\b/gi,       to:"gotta",    note:"got to → gotta /ˈɡɑːtə/" },
    { re:/\bhave to\b/gi,      to:"hafta",    note:"have to → hafta（v 清化为 f）" },
    { re:/\bkind of\b/gi,      to:"kinda",    note:"kind of → kinda /ˈkaɪndə/" },
    { re:/\bsort of\b/gi,      to:"sorta",    note:"sort of → sorta /ˈsɔːrtə/" },
    { re:/\blot of\b/gi,       to:"lotta",    note:"lot of → lotta /ˈlɑːtə/" },
    { re:/\bdon't know\b/gi,   to:"dunno",    note:"don't know → dunno /dəˈnoʊ/" },
    { re:/\blet me\b/gi,       to:"lemme",    note:"let me → lemme /ˈlɛmi/" },
    { re:/\bgive me\b/gi,      to:"gimme",    note:"give me → gimme /ˈɡɪmi/" },
    { re:/\bwhat do you\b/gi,  to:"whaddaya", note:"what do you → whaddaya" },
    { re:/\bwhat are you\b/gi, to:"whaddaya", note:"what are you → whaddaya" },
    { re:/\bdid you\b/gi,      to:"didja",    note:"did you → didja（d + y 同化）" },
    { re:/\bwould you\b/gi,    to:"wouldja",  note:"would you → wouldja" },
    { re:/\bcould you\b/gi,    to:"couldja",  note:"could you → couldja" },
    { re:/\bcan you\b/gi,      to:"canya",    note:"can you → canya" },
    { re:/\bare you\b/gi,      to:"arya",     note:"are you → arya /ˈɑːrjə/" }
];

const WEAK_FORMS = [
    { re:/\bto\b/i,   note:"to → /tə/（弱读）" },
    { re:/\bfor\b/i,  note:"for → /fər/（弱读）" },
    { re:/\bof\b/i,   note:"of → /əv/ 或 /ə/（弱读）" },
    { re:/\band\b/i,  note:"and → /ən/ 或 /n/（弱读）" },
    { re:/\byou\b/i,  note:"you → /jə/（弱读）" },
    { re:/\byour\b/i, note:"your → /jər/（弱读）" },
    { re:/\bcan\b/i,  note:"can → /kən/（弱读）" },
    { re:/\bfrom\b/i, note:"from → /frəm/（弱读）" },
    { re:/\bthe\b/i,  note:"the → /ðə/（元音前变 /ði/）" },
    { re:/\bhim\b/i,  note:"him → /ɪm/（h 常省音）" },
    { re:/\bher\b/i,  note:"her → /ər/（h 常省音）" },
    { re:/\bthem\b/i, note:"them → /əm/（th 常省音）" }
];

const FALLBACK_NOTE = "本句语速较慢，没有明显的连读或缩略，注意句子的重音和节奏。";

function buildHint(en) {

    let decoded = en;
    const notes = [];

    DECODE_RULES.forEach(rule => {
        const before = decoded;
        decoded = decoded.replace(rule.re, rule.to);
        if (decoded !== before && !notes.includes(rule.note)) {
            notes.push(rule.note);
        }
    });

    WEAK_FORMS.forEach(rule => {
        const testRe = new RegExp(rule.re.source, "i");
        if (testRe.test(en) && !notes.includes(rule.note)) {
            notes.push(rule.note);
        }
    });

    if (notes.length === 0) {
        notes.push(FALLBACK_NOTE);
        return { decoded: null, notes };
    }
    if (decoded === en) {
        return { decoded: null, notes };
    }
    return { decoded, notes };
}


/* =========================================================
   3. 语块切分引擎（升级版：语法 + 语义单元）
   ---------------------------------------------------------
   优先级：
   1) 标点主切
   2) 动词短语边界（want to / would like / can I ...）
   3) 介词短语边界（at / in / on / with ...）
   4) 从属连词边界（that / if / when / because ...）
   5) 长短兜底
   ========================================================= */

/* 动词短语起始词——这些词是「新的语块」的开头 */
const VP_START = new Set([
    "want","need","like","love","hate",
    "go","come","get","take","give","make","have","has","had",
    "say","tell","ask","try","help","let","put","keep",
    "know","think","feel","look","watch","see","hear",
    "eat","drink","sleep","work","play","read","write",
    "buy","sell","pay","call","send","meet","wait"
]);

/* 介词——连接介词短语，通常开启新块 */
const PREPS = new Set([
    "at","in","on","of","to","for","with","from","by",
    "about","into","over","under","through","between",
    "near","next","across","around","before","after"
]);

/* 从属连词——开启从句，新块 */
const SUBORD = new Set([
    "that","if","when","while","because","since","although",
    "though","unless","until","as","so","but","and","or"
]);

/* 助动词——开新块 */
const AUX = new Set([
    "can","could","will","would","shall","should",
    "may","might","must","do","does","did"
]);

function isWord(s) {
    return /^[a-zA-Z']/.test(s);
}

function chunkSentence(en) {

    /* 1. 标点主切 */
    const segs = en.trim().split(/\s*[,;:]\s*/).filter(Boolean);
    const chunks = [];

    segs.forEach(function (seg) {

        const words = seg.split(/\s+/).filter(Boolean);
        if (words.length === 0) return;

        /* 短段整块 */
        if (words.length <= 4) {
            chunks.push(words.join(" "));
            return;
        }

        /* 逐词扫描，识别语法边界 */
        const result = [];
        let cur = [words[0]];

        for (let i = 1; i < words.length; i++) {

            const w = words[i].toLowerCase().replace(/[^\w']/g, "");
            const prev = words[i - 1].toLowerCase().replace(/[^\w']/g, "");

            /* 判断是否应该在此处开新块 */
            let shouldBreak = false;

            /* 条件 A：当前词是助动词 / 从属连词，且前面已有 ≥2 词 */
            if ((AUX.has(w) || SUBORD.has(w)) && cur.length >= 2) {
                shouldBreak = true;
            }

            /* 条件 B：当前词是动词，前面是代词/名词（主语 + 谓语边界） */
            if (
                VP_START.has(w) &&
                cur.length >= 2 &&
                (prev === "i" || prev === "you" || prev === "we" ||
                 prev === "they" || prev === "he" || prev === "she" ||
                 prev === "it" || prev.endsWith("'s"))
            ) {
                /* 但如果当前词正好是 "to"，作为动词短语延续，不切 */
                if (w !== "to") shouldBreak = true;
            }

            /* 条件 C：当前词是介词，且前面已有 ≥3 词，切 */
            if (PREPS.has(w) && cur.length >= 3) {
                /* "a lot of" 之类不切 */
                if (!(prev === "lot" || prev === "lots")) {
                    shouldBreak = true;
                }
            }

            /* 条件 D：当前词后面跟宾语从句标志 —— 保持在一个块内更自然 */
            if (prev === "to" && (VP_START.has(w) || w === "be")) {
                /* "want to go" → 应在一块 */
                shouldBreak = false;
            }

            /* 若切后剩 1 词，则不合，取消切 */
            if (shouldBreak && (words.length - i) <= 1 && cur.length > 2) {
                shouldBreak = false;
            }

            if (shouldBreak) {
                result.push(cur.join(" "));
                cur = [words[i]];
            } else {
                cur.push(words[i]);
            }
        }

        if (cur.length) result.push(cur.join(" "));

        /* 兜底：整段 >8 词且只切出一块 → 对半切 */
        if (result.length === 1 && words.length > 8) {
            const mid = Math.ceil(words.length / 2);
            result.length = 0;
            result.push(
                words.slice(0, mid).join(" "),
                words.slice(mid).join(" ")
            );
        }

        chunks.push.apply(chunks, result);
    });

    return chunks;
}


/* =========================================================
   4. 状态
   ========================================================= */

let currentIndex   = 0;
let currentSpeed   = 0.7;
let currentVoice   = null;
let speakToken     = 0;
let currentChunks  = [];
let chunkQueue     = [];
let chunkPlaying   = false;


/* =========================================================
   5. DOM
   ========================================================= */

const counter      = document.getElementById("counter");
const progressBar  = document.getElementById("progressBar");
const category     = document.getElementById("category");
const stageIcon    = document.getElementById("stageIcon");
const instruction  = document.getElementById("instruction");
const sentence     = document.getElementById("sentence");
const translation  = document.getElementById("translation");
const hintPanel    = document.getElementById("hintPanel");
const hintDecoded  = document.getElementById("hintDecoded");
const hintNotes    = document.getElementById("hintNotes");
const chunkPanel   = document.getElementById("chunkPanel");
const chunkList    = document.getElementById("chunkList");
const chunkBtn     = document.getElementById("chunkBtn");
const chunkPlayAll = document.getElementById("chunkPlayAll");
const chunkPlayChain = document.getElementById("chunkPlayChain");
const englishBtn   = document.getElementById("englishBtn");
const chineseBtn   = document.getElementById("chineseBtn");
const hintBtn      = document.getElementById("hintBtn");
const playBtn      = document.getElementById("playBtn");
const prevBtn      = document.getElementById("prevBtn");
const nextBtn      = document.getElementById("nextBtn");
const jumpInput    = document.getElementById("jumpInput");
const jumpBtn      = document.getElementById("jumpBtn");
const statusEl     = document.getElementById("status");


/* =========================================================
   6. 语音加载
   ========================================================= */

function loadVoices() {

    if (!("speechSynthesis" in window)) return;

    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return;

    currentVoice = voices.find(v =>
        v.lang && v.lang.toLowerCase() === "en-us"
    );
    if (!currentVoice) {
        currentVoice = voices.find(v =>
            v.lang && v.lang.toLowerCase().startsWith("en")
        );
    }
}


/* =========================================================
   7. 初始化
   ========================================================= */

function init() {

    loadVoices();

    try {
        const saved = parseInt(localStorage.getItem("cw_listen_index"), 10);
        if (!isNaN(saved) && saved >= 0 && saved < lessons.length) {
            currentIndex = saved;
        }
    } catch (e) {}

    showLesson();
    statusEl.textContent = "准备好了。先听，不要看英文。";
}


/* =========================================================
   8. 显示句子
   ========================================================= */

function showLesson() {

    const lesson = lessons[currentIndex];

    category.textContent    = lesson.c;
    sentence.textContent    = lesson.e;
    translation.textContent = lesson.z;

    sentence.classList.remove("show");
    translation.classList.remove("show");
    hintPanel.classList.remove("show");
    chunkPanel.classList.remove("show");
    englishBtn.classList.remove("active");
    chineseBtn.classList.remove("active");
    hintBtn.classList.remove("active");
    chunkBtn.classList.remove("active");

    chunkPlaying = false;
    chunkQueue = [];
    currentChunks = chunkSentence(lesson.e);

    stageIcon.textContent = "🎧";
    instruction.textContent = "先不要看英文，听完整句话";
    playBtn.textContent = "🎧 听句子";
    playBtn.classList.remove("playing");

    updateProgress();

    try {
        localStorage.setItem("cw_listen_index", currentIndex);
    } catch (e) {}
}


/* =========================================================
   9. 进度
   ========================================================= */

function updateProgress() {

    const total  = lessons.length;
    const number = currentIndex + 1;

    counter.textContent = `${number} / ${total}`;
    progressBar.style.width = ((number / total) * 100) + "%";
}


/* =========================================================
   10. 通用播放（token 防重叠）
   ========================================================= */

function speakText(text, opts) {

    opts = opts || {};

    if (!("speechSynthesis" in window)) {
        statusEl.textContent = "你的设备暂不支持语音播放。";
        return;
    }

    const token = ++speakToken;

    window.speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);

    u.lang   = "en-US";
    u.rate   = currentSpeed;
    u.pitch  = 1;
    u.volume = 1;

    if (currentVoice) u.voice = currentVoice;

    u.onstart = function () {
        if (token !== speakToken) return;
        if (opts.onStart) opts.onStart();
    };
    u.onend = function () {
        if (token !== speakToken) return;
        if (opts.onEnd) opts.onEnd();
    };
    u.onerror = function () {
        if (token !== speakToken) return;
        if (opts.onError) opts.onError();
    };

    setTimeout(function () {
        if (token !== speakToken) return;
        window.speechSynthesis.speak(u);
    }, 60);
}


/* =========================================================
   11. 播放整句
   ========================================================= */

function speakCurrent() {

    if (!("speechSynthesis" in window)) {
        statusEl.textContent = "你的设备暂不支持语音播放。";
        return;
    }

    chunkPlaying = false;
    chunkQueue = [];
    highlightChunk(-1);

    sentence.classList.remove("show");
    translation.classList.remove("show");
    hintPanel.classList.remove("show");
    englishBtn.classList.remove("active");
    chineseBtn.classList.remove("active");
    hintBtn.classList.remove("active");
    instruction.textContent = "先不要看英文，听完整句话";

    speakText(lessons[currentIndex].e, {
        onStart: function () {
            stageIcon.textContent = "🔊";
            statusEl.textContent  = "正在播放……";
            playBtn.textContent   = "🔊 播放中";
            playBtn.classList.add("playing");
        },
        onEnd: function () {
            stageIcon.textContent = "🎧";
            statusEl.textContent  = "播放完成。现在试着自己说一遍。";
            playBtn.textContent   = "🎧 再听一次";
            playBtn.classList.remove("playing");
        },
        onError: function () {
            stageIcon.textContent = "⚠️";
            statusEl.textContent  = "语音播放出现问题，请再点一次。";
            playBtn.textContent   = "🎧 听句子";
            playBtn.classList.remove("playing");
        }
    });
}


/* =========================================================
   12. 停止
   ========================================================= */

function stopSpeaking() {

    speakToken++;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();

    chunkPlaying = false;
    chunkQueue = [];
    highlightChunk(-1);

    stageIcon.textContent = "🎧";
    playBtn.textContent   = "🎧 听句子";
    playBtn.classList.remove("playing");
    statusEl.textContent  = "已停止。";
}


/* =========================================================
   13. 切换显示
   ========================================================= */

function toggleEnglish() {
    const showing = sentence.classList.toggle("show");
    englishBtn.classList.toggle("active", showing);
    instruction.textContent = showing
        ? "看看你刚才听到的声音"
        : "先不要看英文，听完整句话";
}

function toggleChinese() {
    const showing = translation.classList.toggle("show");
    chineseBtn.classList.toggle("active", showing);
}

function toggleHint() {
    const showing = hintPanel.classList.toggle("show");
    hintBtn.classList.toggle("active", showing);
    if (showing) renderHint();
}

function toggleChunks() {
    const showing = chunkPanel.classList.toggle("show");
    chunkBtn.classList.toggle("active", showing);
    if (showing) {
        renderChunks();
    } else {
        chunkPlaying = false;
        chunkQueue = [];
        highlightChunk(-1);
    }
}

function renderHint() {

    const lesson = lessons[currentIndex];
    const hint   = buildHint(lesson.e);

    if (hint.decoded) {
        hintDecoded.textContent = hint.decoded;
        hintDecoded.classList.remove("empty");
    } else {
        hintDecoded.textContent = "（和原句一致，没有明显连读或缩略）";
        hintDecoded.classList.add("empty");
    }

    hintNotes.innerHTML = "";
    hint.notes.forEach(n => {
        const div = document.createElement("div");
        div.textContent = n;
        hintNotes.appendChild(div);
    });
}


/* =========================================================
   14. 语块渲染与播放
   ========================================================= */

function renderChunks() {

    chunkList.innerHTML = "";

    currentChunks.forEach(function (text, i) {
        const btn = document.createElement("button");
        btn.className = "chunk-item";
        btn.textContent = text;
        btn.addEventListener("click", function () {
            playSingleChunk(i);
        });
        chunkList.appendChild(btn);
    });
}

function highlightChunk(i, cls) {
    const items = chunkList.querySelectorAll(".chunk-item");
    items.forEach(function (el, idx) {
        el.classList.remove("playing");
        el.classList.remove("chain");
        if (idx === i) {
            el.classList.add(cls || "playing");
        }
    });
}

/* 单块播放 */
function playSingleChunk(i) {

    chunkPlaying = false;
    chunkQueue = [];

    const text = currentChunks[i];
    if (!text) return;

    highlightChunk(i, "playing");

    speakText(text, {
        onStart: function () {
            stageIcon.textContent = "🔊";
            statusEl.textContent  = `语块 ${i + 1} / ${currentChunks.length}`;
        },
        onEnd: function () {
            stageIcon.textContent = "🎧";
            statusEl.textContent  = "单块播放完毕。";
        }
    });
}

/* 逐块播放（块间短停） */
function playAllChunks() {

    if (currentChunks.length === 0) return;

    chunkPlaying = true;

    chunkQueue = currentChunks.map(function (text, i) {
        return { text: text, i: i, full: false };
    });

    playNextChunk();
}

/* 连句：先逐块 → 最后整句连读 */
function playChain() {

    if (currentChunks.length === 0) return;

    chunkPlaying = true;

    chunkQueue = currentChunks.map(function (text, i) {
        return { text: text, i: i, full: false };
    });

    /* 追加整句作为最后一项 */
    chunkQueue.push({
        text: lessons[currentIndex].e,
        i: -1,
        full: true
    });

    playNextChunk();
}

function playNextChunk() {

    if (!chunkPlaying) return;

    if (chunkQueue.length === 0) {
        chunkPlaying = false;
        highlightChunk(-1);
        stageIcon.textContent = "🎧";
        statusEl.textContent  = "播放完成。";
        return;
    }

    const item = chunkQueue.shift();

    if (item.full) {
        highlightChunk(-1);
        statusEl.textContent = "🔗 整句连读——感受块与块如何连起来";
    } else {
        highlightChunk(item.i, "chain");
        statusEl.textContent = `语块 ${item.i + 1} / ${currentChunks.length}`;
    }

    speakText(item.text, {
        onStart: function () {
            stageIcon.textContent = "🔊";
        },
        onEnd: function () {
            /* 块间短停；整句播完直接结束 */
            const delay = item.full ? 0 : 300;
            setTimeout(function () {
                if (chunkPlaying) playNextChunk();
            }, delay);
        }
    });
}


/* =========================================================
   15. 导航
   ========================================================= */

function goToIndex(index, message) {

    stopSpeaking();

    if (index < 0) index = 0;
    if (index >= lessons.length) index = lessons.length - 1;

    currentIndex = index;
    showLesson();
    statusEl.textContent = message;
}

function nextLesson() {
    if (currentIndex + 1 >= lessons.length) {
        goToIndex(0, "🎉 全部完成！重新开始。");
    } else {
        goToIndex(currentIndex + 1, "下一句，先听，不要看英文。");
    }
}

function prevLesson() {
    if (currentIndex === 0) {
        statusEl.textContent = "已经是第一句了。";
        return;
    }
    goToIndex(currentIndex - 1, "上一句，先听，不要看英文。");
}

function jumpTo() {
    const n = parseInt(jumpInput.value, 10);
    if (isNaN(n) || n < 1 || n > lessons.length) {
        statusEl.textContent = `请输入 1 到 ${lessons.length} 之间的数字。`;
        return;
    }
    jumpInput.value = "";
    goToIndex(n - 1, `已跳到第 ${n} 句。`);
}


/* =========================================================
   16. 语速
   ========================================================= */

const speedButtons = document.querySelectorAll(".speed");

speedButtons.forEach(button => {
    button.addEventListener("click", function () {

        speedButtons.forEach(b => b.classList.remove("active"));
        this.classList.add("active");

        currentSpeed = parseFloat(this.dataset.speed);
        statusEl.textContent = `语速 ${currentSpeed}×`;

        if (window.speechSynthesis && window.speechSynthesis.speaking) {
            speakCurrent();
        }
    });
});


/* =========================================================
   17. 事件绑定
   ========================================================= */

playBtn.addEventListener("click", speakCurrent);
prevBtn.addEventListener("click", prevLesson);
nextBtn.addEventListener("click", nextLesson);
englishBtn.addEventListener("click", toggleEnglish);
chineseBtn.addEventListener("click", toggleChinese);
hintBtn.addEventListener("click", toggleHint);
chunkBtn.addEventListener("click", toggleChunks);
chunkPlayAll.addEventListener("click", playAllChunks);
chunkPlayChain.addEventListener("click", playChain);
jumpBtn.addEventListener("click", jumpTo);

jumpInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") jumpTo();
});


/* =========================================================
   18. 键盘快捷键
   ========================================================= */

document.addEventListener("keydown", function (e) {

    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;

    if (e.code === "Space") {
        e.preventDefault();
        speakCurrent();
    } else if (e.code === "ArrowRight") {
        nextLesson();
    } else if (e.code === "ArrowLeft") {
        prevLesson();
    } else if (e.key === "h" || e.key === "H") {
        toggleHint();
    } else if (e.key === "c" || e.key === "C") {
        toggleChunks();
    } else if (e.code === "Escape") {
        stopSpeaking();
    }
});


/* =========================================================
   19. 切到后台停止
   ========================================================= */

document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopSpeaking();
});


/* =========================================================
   20. 语音列表异步加载 + 启动
   ========================================================= */

if ("speechSynthesis" in window) {
    window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
    /* iOS 首次需要触摸才能解锁语音 */
    document.addEventListener("touchstart", function once() {
        loadVoices();
        /* 静默播一个空字符串，解锁语音引擎 */
        const u = new SpeechSynthesisUtterance(" ");
        u.volume = 0;
        window.speechSynthesis.speak(u);
        document.removeEventListener("touchstart", once);
    }, { once: true });
}

init();

</script>
</body>
