/* =========================================================
   3. 生成语块库
   ========================================================= */
let lessons = [];
let id = 1;

// 生成 1000 个基础语块（循环核心库）
while(lessons.length < 1000){
    const base = coreChunks[lessons.length % coreChunks.length];
    lessons.push({
        id: id++,
        scene: base[0],
        chunk: base[1],
        pattern: base[2],
        en: base[3],
        cn: base[4],
        replace: base[5],
        isPremium: false
    });
}

// 生成 300 个高级语块（循环高级库）
let premiumIndex = 0;
while(lessons.length < 1300){
    const base = premiumChunks[premiumIndex % premiumChunks.length];
    lessons.push({
        id: id++,
        scene: "⭐ " + base[0],
        chunk: base[1],
        pattern: base[2],
        en: base[3],
        cn: base[4],
        replace: base[5] || ["it","this","that","one","thing"],
        isPremium: true
    });
    premiumIndex++;
}
if(lessons.length > 1300) lessons = lessons.slice(0,1300);
console.log(`总语块数: ${lessons.length}，基础 ${lessons.filter(l=>!l.isPremium).length}，高级 ${lessons.filter(l=>l.isPremium).length}`);

    if(currentUtterance){ try{ window.speechSynthesis.cancel(); }catch(e){} currentUtterance=null; }
    if(currentAudio){ try{ currentAudio.pause(); currentAudio.src=''; }catch(e){} currentAudio=null; }
    isSpeaking=false; isPaused=false; dom.playPauseBtn.textContent="▶"; dom.playPauseBtn.classList.remove("paused");
    playQueue=[]; isProcessingQueue=false; retryCount=0;
}

function getCurrentItem(){
    const available = getAvailableLessons();
    if(currentIndex >= available.length) currentIndex = 0;
    return available[currentIndex] || null;
}

function isSpeechSupported(){ return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); }

function speakNative(text, callback){
    if(!isSpeechSupported()){ callback(false, "浏览器不支持原生语音"); return; }
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /Google UK|David|Zira|Samantha/i.test(v.name)) || voices.find(v => v.lang.startsWith('en')) || null;
    const utterance = new SpeechSynthesisUtterance(text);
    currentUtterance = utterance;
    utterance.lang = 'en-US';
    utterance.rate = 0.6;
    utterance.pitch = 1.1;
    utterance.volume = 1;
    if(preferred) utterance.voice = preferred;
    let ended = false;
    let timeoutId = setTimeout(() => { if(!ended){ ended=true; try{ window.speechSynthesis.cancel(); }catch(e){} currentUtterance=null; callback(false, "播放超时"); } }, 8000);
    utterance.onstart = function(){ if(currentUtterance!==utterance) return; isSpeaking=true; dom.playPauseBtn.textContent="⏸"; dom.playPauseBtn.classList.add("paused"); dom.status.textContent="🎧 播放中（原生）"; dom.status.className="status speaking"; };
    utterance.onend = function(){ if(ended) return; ended=true; clearTimeout(timeoutId); isSpeaking=false; currentUtterance=null; dom.playPauseBtn.textContent="▶"; dom.playPauseBtn.classList.remove("paused"); dom.status.textContent="✅ 播放完成"; dom.status.className="status done"; callback(true); };
    utterance.onerror = function(ev){ if(ended) return; ended=true; clearTimeout(timeoutId); isSpeaking=false; currentUtterance=null; if(ev.error==='canceled'||ev.error==='interrupted'){ callback(false, "播放被取消"); }else{ callback(false, "原生语音错误: "+ev.error); } };
    try{ setTimeout(()=>{ window.speechSynthesis.speak(utterance); }, 100); }catch(e){ clearTimeout(timeoutId); ended=true; isSpeaking=false; currentUtterance=null; callback(false, "原生语音异常: "+e.message); }
}

function speakGoogle(text, callback){
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
    const audio = new Audio(url);
    currentAudio = audio;
    let ended = false;
    let timeoutId = setTimeout(() => { if(!ended){ ended=true; try{ audio.pause(); audio.src=''; }catch(e){} currentAudio=null; callback(false, "网络超时"); } }, 8000);
    audio.oncanplaythrough = function(){ audio.play().catch(err => { if(ended) return; clearTimeout(timeoutId); ended=true; currentAudio=null; callback(false, "Google 播放失败: "+err.message); }); };
    audio.onplay = function(){ isSpeaking=true; dom.playPauseBtn.textContent="⏸"; dom.playPauseBtn.classList.add("paused"); dom.status.textContent="🎧 播放中（高清）"; dom.status.className="status speaking"; };
    audio.onended = function(){ if(ended) return; clearTimeout(timeoutId); ended=true; isSpeaking=false; currentAudio=null; dom.playPauseBtn.textContent="▶"; dom.playPauseBtn.classList.remove("paused"); dom.status.textContent="✅ 播放完成"; dom.status.className="status done"; callback(true); };
    audio.onerror = function(){ if(ended) return; clearTimeout(timeoutId); ended=true; isSpeaking=false; currentAudio=null; callback(false, "Google 加载失败（网络限制）"); };
    audio.load();
}

function speakText(text, callback){
    if(!text){ if(callback) callback(false); return; }
    playQueue.push({ text, callback, retries: 0 });
    processQueue();
}

function processQueue(){
    if(isProcessingQueue || playQueue.length === 0) return;
    isProcessingQueue = true;
    const task = playQueue.shift();
    const { text, callback, retries } = task;
    const useGoogle = hdMode && navigator.onLine;
    function onResult(success, msg){
        if(success){
            isProcessingQueue = false;
            if(callback) callback(true);
            if(playQueue.length > 0) processQueue();
        }else{
            if(retries < MAX_RETRY){
                if(useGoogle && msg.includes('网络')){
                    task.retries = retries + 1;
                    task.engine = 'native';
                    playQueue.unshift(task);
                    isProcessingQueue = false;
                    setTimeout(processQueue, 500);
                    return;
                }else{
                    task.retries = retries + 1;
                    playQueue.unshift(task);
                    isProcessingQueue = false;
                    setTimeout(processQueue, 800);
                    return;
                }
            }else{
                isProcessingQueue = false;
                if(callback) callback(false);
                dom.status.textContent = "⚠️ 播放失败，请检查网络或切换引擎";
                dom.status.className = "status error";
                if(playQueue.length > 0) processQueue();
            }
        }
    }
    if(useGoogle){
        speakGoogle(text, onResult);
    }else{
        speakNative(text, onResult);
    }
}

function playCurrent(){
    if(isSpeaking){ stopSpeech(); setTimeout(playCurrent, 200); return; }
    const item = getCurrentItem();
    if(!item) return;
    dom.status.textContent = "⏳ 加载中...";
    dom.status.className = "status";
    speakText(item.en);
}

function playPattern(){
    const item = getCurrentItem();
    if(!item) return;
    const text = item.pattern.replace(/\.{3}|…/g, "").trim();
    if(!text) return;
    stopSpeech();
    setTimeout(() => { dom.status.textContent = "🧩 母句型..."; speakText(text); }, 100);
}

function togglePlayPause(){
    if(isSpeaking){ stopSpeech(); dom.status.textContent = "⏸ 已暂停"; dom.status.className = "status paused"; } else { playCurrent(); }
}

function prevTrack(){
    stopSpeech();
    const available = getAvailableLessons();
    if(available.length === 0) return;
    currentIndex = (currentIndex - 1 + available.length) % available.length;
    showSentence();
    setTimeout(playCurrent, 150);
}
function nextTrack(){
    stopSpeech();
    const available = getAvailableLessons();
    if(available.length === 0) return;
    currentIndex = (currentIndex + 1) % available.length;
    showSentence();
    setTimeout(playCurrent, 150);
}
function randomSentence(){
    stopSpeech();
    const available = getAvailableLessons();
    if(available.length === 0) return;
    currentIndex = Math.floor(Math.random() * available.length);
    showSentence();
    setTimeout(playCurrent, 150);
}

function toggleRepeat(){
    if(isRepeating){
        isRepeating = false;
        clearTimeout(repeatTimer);
        stopSpeech();
        dom.repeatBtn.textContent = "🔁 复读";
        dom.repeatBtn.classList.remove("active");
        dom.status.textContent = "⏸ 已停止复读";
        dom.status.className = "status paused";
        return;
    }
    isRepeating = true;
    repeatCount = 0;
    dom.repeatBtn.textContent = "⏹ 停止复读";
    dom.repeatBtn.classList.add("active");
    doRepeat();
}
function doRepeat(){
    if(!isRepeating) return;
    repeatCount++;
    dom.status.textContent = `🔁 复读 ${repeatCount}/${REPEAT_TIMES}`;
    dom.status.className = "status";
    const item = getCurrentItem();
    if(!item){ stopAll(); return; }
    speakText(item.en, function(success){
        if(!isRepeating) return;
        if(!success){ isRepeating=false; dom.repeatBtn.textContent="🔁 复读"; dom.repeatBtn.classList.remove("active"); dom.status.textContent="⚠️ 复读中断"; dom.status.className="status error"; return; }
        if(repeatCount >= REPEAT_TIMES){ isRepeating=false; dom.repeatBtn.textContent="🔁 复读"; dom.repeatBtn.classList.remove("active"); dom.status.textContent="✅ 复读完成"; dom.status.className="status done"; return; }
        repeatTimer = setTimeout(doRepeat, 600);
    });
}

function toggleHD(){
    hdMode = !hdMode;
    dom.hdToggle.textContent = hdMode ? "✨ 高清(开)" : "✨ 高清";
    dom.hdToggle.style.background = hdMode ? "#22c55e" : "#8b5cf6";
    showToast(hdMode ? "高清语音已开启（需网络）" : "已切换至原生语音");
    if(isSpeaking){ stopSpeech(); setTimeout(playCurrent, 200); }
}

// ===== 替换词点击发音（新增） =====
function playReplaceWord(word){
    if(!word) return;
    speakText(word);
    showToast("🔊 " + word);
}

function showSentence(){
    const item = getCurrentItem();
    if(!item) return;
    const available = getAvailableLessons();
    dom.scene.textContent = item.scene + (item.isPremium ? ' ⭐' : '');
    dom.progress.textContent = `第 ${currentIndex + 1} / ${available.length} 个语块${isPremiumUnlocked ? ' (含高级)' : ''}`;
    dom.chunk.textContent = item.chunk;
    dom.english.textContent = item.en;
    dom.chinese.textContent = item.cn;
    dom.replaceList.innerHTML = "";
    (item.replace || []).forEach(function(word){
        const span = document.createElement("span");
        span.className = "replace-item";
        span.textContent = word;
        // 点击发音
        span.style.cursor = "pointer";
        span.title = "点击听发音";
        span.onclick = function(e){
            e.stopPropagation();
            playReplaceWord(word);
        };
        dom.replaceList.appendChild(span);
    });
    dom.status.textContent = "准备好了";
    dom.status.className = "status";
}

function searchSentence(){
    const keyword = dom.searchInput.value.trim().toLowerCase();
    dom.results.innerHTML = "";
    if(!keyword){ showToast("请输入关键词"); return; }
    const available = getAvailableLessons();
    const matches = available.filter(item =>
        item.chunk.toLowerCase().includes(keyword) ||
        item.pattern.toLowerCase().includes(keyword) ||
        item.en.toLowerCase().includes(keyword) ||
        item.cn.includes(keyword)
    );
    if(matches.length === 0){
        dom.results.innerHTML = `<div class="no-result">🔍 没有找到相关语块</div>`;
        return;
    }
    matches.slice(0,30).forEach(function(item){
        const box = document.createElement("div");
        box.className = "result";
        box.innerHTML = `<div class="result-en">${item.chunk} · ${item.pattern}${item.isPremium ? ' ⭐' : ''}</div>
                         <div class="result-cn">${item.cn}</div>`;
        box.onclick = function(){
            stopSpeech();
            const idx = available.indexOf(item);
            if(idx !== -1) currentIndex = idx;
            showSentence();
            dom.results.innerHTML = "";
            dom.searchInput.value = "";
            setTimeout(playCurrent, 150);
            showToast("已跳转到语块");
        };
        dom.results.appendChild(box);
    });
}

// 键盘事件
document.addEventListener("keydown", function(e){
    if(document.activeElement === dom.searchInput) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); prevTrack(); }
    if(e.key === "ArrowRight"){ e.preventDefault(); nextTrack(); }
    if(e.key === " "){ e.preventDefault(); togglePlayPause(); }
    if(e.key === "r" || e.key === "R"){ e.preventDefault(); toggleRepeat(); }
});
dom.searchInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); searchSentence(); }
});

// 初始化
updatePremiumUI();
showSentence();

if(window.speechSynthesis){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function(){
        window.speechSynthesis.getVoices();
    };
}

window.addEventListener('online', function(){
    showToast("网络已恢复，高清语音可用", 1500);
    if(hdMode && isSpeaking){ stopSpeech(); setTimeout(playCurrent, 300); }
});
window.addEventListener('offline', function(){
    showToast("网络已断开，自动切换至原生语音", 1500);
    if(hdMode){
        hdMode = false;
        dom.hdToggle.textContent = "✨ 高清";
        dom.hdToggle.style.background = "#8b5cf6";
        if(isSpeaking){ stopSpeech(); setTimeout(playCurrent, 300); }
    }
});

console.log("🎧 每句练耳 · 完整版（含母语者问句）已加载");
console.log(`📚 总语块数: ${lessons.length}，基础 ${lessons.filter(l=>!l.isPremium).length}，高级 ${lessons.filter(l=>l.isPremium).length}`);
console.log("💎 高级解锁:", isPremiumUnlocked ? "已解锁" : "未解锁");
console.log("🔊 替换词点击发音已启用");
</script>
