.header-right{display:flex;gap:6px;}

.mode-selector{background:#fff;border-radius:12px;padding:4px 8px;margin-bottom:8px;display:flex;gap:6px;border:1px solid #e2e8f0;}
.mode-btn{flex:1;padding:4px 0;border:0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#e2e8f0;color:#1e293b;transition:0.2s;}
.mode-btn.active{background:#e94560;color:#fff;}
.pattern-selector{background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid #e2e8f0;}
.pattern-selector label{font-weight:600;font-size:13px;white-space:nowrap;}
.pattern-selector select{flex:1;min-width:100px;padding:4px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;outline:none;cursor:pointer;}
.pattern-selector .badge{background:#e94560;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.custom-chunk{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.custom-chunk input{flex:1;min-width:60px;padding:3px 6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;}
.custom-chunk button{padding:3px 10px;background:#8b5cf6;color:#fff;border:0;border-radius:6px;font-size:12px;cursor:pointer;}
.search-wrapper{display:flex;gap:4px;margin-bottom:8px;}
.search-wrapper .input-group{flex:1;display:flex;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:0 4px;height:34px;}
.search-wrapper .input-group input{flex:1;border:0;outline:none;font-size:13px;padding:0 4px;background:transparent;height:100%;}
.search-wrapper .input-group button{background:transparent;border:0;font-size:16px;cursor:pointer;padding:0 6px;color:#94a3b8;}
.search-wrapper .input-group button:hover{color:#1e293b;}
.results{margin-bottom:8px;}
.result{background:#fff;padding:8px 12px;margin-bottom:4px;border-radius:10px;cursor:pointer;border:1px solid #e2e8f0;}
.result-en{font-weight:600;font-size:15px;}
.result-cn{margin-top:2px;color:#475569;font-size:13px;}
.card{background:#fff;border-radius:16px;padding:16px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #e2e8f0;position:relative;}
.scene{color:#94a3b8;font-size:12px;font-weight:500;padding-right:64px;}
.progress{color:#94a3b8;font-size:11px;margin-top:1px;}
.pattern-display{background:#eef2f6;padding:4px 12px;border-radius:8px;margin:8px 0 2px;display:inline-block;}
.pattern-display .label{font-size:10px;color:#94a3b8;}
.pattern-display .text{font-size:18px;font-weight:700;}
.flow-arrow{color:#94a3b8;font-size:14px;margin:2px 0;}
.english{min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px 4px;font-size:22px;font-weight:700;background:#f8fafc;border-radius:8px;margin:4px 0;position:relative;}
.english .fav-btn{background:transparent;border:0;font-size:20px;cursor:pointer;color:#94a3b8;padding:0 4px;}
.english .fav-btn.active{color:#f59e0b;}
.english .copy-btn{background:transparent;border:0;font-size:18px;cursor:pointer;color:#94a3b8;padding:0 4px;}
.english .copy-btn:hover{color:#1e293b;}
.chinese{min-height:28px;font-size:16px;color:#475569;padding:4px 8px;background:#f8fafc;border-radius:8px;}
.sentence-hint{font-size:11px;color:#94a3b8;margin-top:2px;}
.sentence-hint .highlight{color:#e94560;font-weight:600;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
.ctrl-btn{background:#e2e8f0;border:0;padding:0;cursor:pointer;font-size:22px;color:#1e293b;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:active{transform:scale(0.9);}
.ctrl-btn.play-btn{width:52px;height:52px;font-size:28px;background:#e94560;color:#fff;}
.ctrl-btn.cn-btn{background:#f59e0b;color:#fff;width:38px;height:38px;font-size:18px;}
.speed-control{display:flex;align-items:center;gap:4px;}
.speed-btn{background:#e2e8f0;border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;cursor:pointer;}
.speed-btn.active{background:#e94560;color:#fff;border-color:#e94560;}
.extra-buttons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;justify-content:center;}

.extra-buttons .reset-audio-btn{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn:hover{background:#dc2626;}
.extra-buttons .chunk-toggle-btn{background:#8b5cf6;color:#fff;}

.chunk-area-wrap.open{max-height:400px;opacity:1;margin-top:8px;}
.chunk-area{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;max-height:200px;overflow-y:auto;}
.chunk-item{cursor:pointer;padding:3px 10px;background:#eef2f6;border-radius:14px;font-size:13px;border:1px solid transparent;transition:0.15s;user-select:none;}
.chunk-item:hover{background:#dce2ea;}
.chunk-item.active{background:#e94560;color:#fff;border-color:#e94560;}
.chunk-item.custom{background:#8b5cf6;color:#fff;}
.chunk-item.custom:hover{background:#7c3aed;}
.status{min-height:20px;margin-top:4px;color:#94a3b8;font-size:12px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}
.status.paused{color:#f59e0b;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:6px 16px;border-radius:40px;opacity:0;pointer-events:none;transition:0.3s;z-index:999;font-size:13px;font-weight:500;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

<div id="toast" class="toast"></div>
<div class="container">
<div class="header">
  <div class="header-left"><h1>🧩 对讲机</h1><p>完整版</p></div>
  <div class="header-right">
    <button class="fav-count" id="favCountBtn">⭐ 0</button>
  </div>
</div>

<div class="mode-selector">
  <label>📌 模式</label>
  <button class="mode-btn active" data-mode="single" onclick="setMode('single')">单句</button>
  <button class="mode-btn" data-mode="dialog" onclick="setMode('dialog')">对讲机</button>
</div>

<div id="singleModeArea">
  <div class="pattern-selector">
    <label>📌 母句</label>
    <select id="patternSelect"></select>
    <span class="badge" id="chunkCount">0</span>
  </div>
  <div class="custom-chunk">
    <input id="customChunkEn" placeholder="英文词块">
    <input id="customChunkCn" placeholder="中文释义">
    <button onclick="addCustomChunk()">➕</button>
  </div>
</div>

<div id="dialogModeArea" style="display:none;">
  <div class="pattern-selector">
    <label>📌 场景</label>
    <select id="dialogSceneSelect"></select>
    <span class="badge" id="dialogCount">0 组</span>
  </div>
</div>

<div class="search-wrapper">
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="搜索句子">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<div class="card">
  <div class="scene" id="scene">日常表达</div>
  <div class="progress" id="progress">总句数: 1600+</div>

  <div id="singleDisplay">
    <div class="pattern-display"><div class="label">母句</div><div class="text" id="patternDisplay">I want to...</div></div>
    <div class="flow-arrow">▼ 当前整句</div>
    <div class="english" id="englishContainer">
      <span id="english">I want to eat.</span>
      <span class="action-buttons">
        <button class="copy-btn" onclick="copySentence()">📋</button>
        <button class="fav-btn" id="favBtn" onclick="toggleFav()">☆</button>
      </span>
    </div>
    <div class="chinese" id="chinese">我想吃饭。</div>
    <div class="sentence-hint" id="sentenceHint">💡 点击词块切换</div>
  </div>

  <div id="dialogDisplay" style="display:none;">
    <div class="dialog-area" id="dialogArea" style="max-height:320px;overflow-y:auto;"></div>
    <div class="dialog-controls" style="display:flex;gap:6px;justify-content:center;margin-top:4px;flex-wrap:wrap;">
      <button class="play-all" onclick="playDialogAll()" style="background:#e94560;color:#fff;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;">▶ 整组</button>
      <button onclick="playDialogQ()" style="background:#e2e8f0;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;">🔊 问</button>
      <button onclick="playDialogA()" style="background:#e2e8f0;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;">🔊 答</button>
      <button onclick="prevDialog()" style="background:#e2e8f0;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;">⏮ 上一</button>
      <button onclick="nextDialog()" style="background:#e2e8f0;border:0;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;">⏭ 下一</button>
    </div>
  </div>

  <div class="player-controls">
    <button class="ctrl-btn" onclick="prevChunk()">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
    <button class="ctrl-btn" onclick="nextChunk()">⏭</button>
    <div class="speed-control">
      <button class="speed-btn" data-speed="0.7" onclick="setSpeed(0.7)">0.7×</button>
      <button class="speed-btn active" data-speed="1.0" onclick="setSpeed(1.0)">1.0×</button>
      <button class="speed-btn" data-speed="1.3" onclick="setSpeed(1.3)">1.3×</button>
    </div>
  </div>

  <div class="extra-buttons">
    <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
    <button onclick="randomChunk()">🎲 随机</button>
    <button class="reset-audio-btn" onclick="resetAudio()">🔊 修复</button>
    <button class="chunk-toggle-btn" onclick="toggleChunkList()">📋 词块</button>
  </div>

  <div class="chunk-area-wrap" id="chunkAreaWrap">
    <div class="chunk-area" id="chunkArea"></div>
  </div>

  <div id="status" class="status">就绪</div>
</div>
<div style="text-align:center;margin-top:6px;font-size:11px;color:#94a3b8;">← 上一 · 下一 →</div>
</div>

// 5. 语音引擎 - 极简稳定版
// ========================================================================
function speakText(text, callback) {
  if (!window.speechSynthesis) {
    dom.status.textContent = "❌ 浏览器不支持语音";
    dom.status.className = "status error";
    if (callback) callback(false);
    return;
  }

  // 取消当前播放
  try { window.speechSynthesis.cancel(); } catch(e) {}

  const clean = text.replace(/[.…]{2,}/g, '').trim();
  if (!clean) {
    if (callback) callback(false);
    return;
  }

  const utterance = new SpeechSynthesisUtterance(clean);
  // 自动检测语言
  utterance.lang = /[\u4e00-\u9fa5]/.test(clean) ? 'zh-CN' : 'en-US';
  utterance.rate = speechRate;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  // 不指定voice，让系统自动选择

  let ended = false;
  utterance.onstart = function() {
    isSpeaking = true;
    dom.playPauseBtn.textContent = "⏸";
    dom.status.textContent = "🔊 朗读中...";
    dom.status.className = "status speaking";
  };
  utterance.onend = function() {
    if (ended) return;
    ended = true;
    isSpeaking = false;
    dom.playPauseBtn.textContent = "▶";
    dom.status.textContent = "✅ 播放完成";
    dom.status.className = "status done";
    if (callback) callback(true);
  };
  utterance.onerror = function(e) {
    if (ended) return;
    ended = true;
    isSpeaking = false;
    dom.playPauseBtn.textContent = "▶";
    dom.status.textContent = "⚠️ 语音错误: " + (e.error || '未知');
    dom.status.className = "status error";
    console.warn('语音错误:', e);
    if (callback) callback(false);
  };

  try {
    window.speechSynthesis.speak(utterance);
    dom.status.textContent = "🔊 播放中...";
    dom.status.className = "status speaking";
  } catch(err) {
    dom.status.textContent = "❌ 异常: " + err.message;
    dom.status.className = "status error";
    if (callback) callback(false);
  }
}

function playChunk(el) {
  // 停止当前播放
  try { window.speechSynthesis.cancel(); } catch(e) {}
  isSpeaking = false;
  dom.playPauseBtn.textContent = "▶";

  dom.chunkArea.querySelectorAll('.chunk-item').forEach(item => item.classList.remove('active'));
  el.classList.add('active');

  const en = el.dataset.en;
  const cn = el.dataset.cn;
  const p = patternList[currentPatternId];
  const fullEn = p.pattern.replace(/\.{3}/g, en);
  const fullCn = p.cnPrefix + cn;

  dom.english.textContent = fullEn;
  dom.chinese.textContent = fullCn;
  dom.sentenceHint.innerHTML = '✅ 造句连读：<span class="highlight">' + en + '</span> (' + cn + ')';
  updateFavUI();

  // 播放
  speakText(fullEn);
}

function playCurrent() {
  if (currentMode === 'dialog') { playDialogAll(); return; }

}

function prevChunk() {
  if (currentMode === 'dialog') { prevDialog(); return; }
  const items = dom.chunkArea.querySelectorAll('.chunk-item');
  if (!items.length) return;
  let idx = 0;
  items.forEach((el, i) => { if (el.classList.contains('active')) idx = i; });
  const newIdx = (idx - 1 + items.length) % items.length;
  playChunk(items[newIdx]);
}

function nextChunk() {

  let idx = 0;

  const newIdx = (idx + 1) % items.length;
  playChunk(items[newIdx]);
}

function toggleRepeat() {
  if (isRepeating) {
    isRepeating = false;
    clearTimeout(repeatTimer);
    dom.status.textContent = "⏸ Repeat stopped";
    dom.status.className = "status paused";
    return;
  }
  isRepeating = true;
  repeatCount = 0;
  doRepeat();
}

function doRepeat() {
  if (!isRepeating) return;
  repeatCount++;
  dom.status.textContent = `🔁 Repeat ${repeatCount}/${REPEAT_TIMES}`;
  dom.status.className = "status speaking";
  const text = dom.english.textContent;
  if (!text) { isRepeating = false; return; }
  speakText(text, function(success) {
    if (!success || !isRepeating) { isRepeating = false; return; }
    if (repeatCount >= REPEAT_TIMES) {
      isRepeating = false;
      dom.status.textContent = "✅ Repeat done";
      dom.status.className = "status done";
      return;
    }
    repeatTimer = setTimeout(doRepeat, 500);
  });
}

function getChunksForPattern(pid) {
  const p = patternList[pid];
  const end = Math.min(p.start + p.count, chunkPool.length);
  const base = [];
  for (let i = p.start; i < end; i++) base.push({ index: i, ...chunkPool[i], custom: false });
  const custom = (customChunks[pid] || []).map((c, idx) => ({ ...c, custom: true, index: 1000 + idx }));
  return [...base, ...custom];
}

function buildAllLessons() {
  const res = [];
  patternList.forEach(p => {
    const end = Math.min(p.start + p.count, chunkPool.length);
    for (let i = p.start; i < end; i++) {
      const c = chunkPool[i];
      res.push({ id: res.length + 1, pattern: p.pattern, en: p.pattern.replace(/\.{3}/g, c.en), cn: p.cnPrefix + c.cn, chunkEn: c.en, chunkCn: c.cn, patternId: p.id, chunkIndex: i, custom: false });
    }
    (customChunks[p.id] || []).forEach(c => {
      res.push({ id: res.length + 1, pattern: p.pattern, en: p.pattern.replace(/\.{3}/g, c.en), cn: p.cnPrefix + c.cn, chunkEn: c.en, chunkCn: c.cn, patternId: p.id, chunkIndex: 1000 + res.length, custom: true });
    });
  });
  return res;
}
let lessons = buildAllLessons();

function loadPattern(pid) {
  currentPatternId = pid;
  const p = patternList[pid];
  const chunks = getChunksForPattern(pid);
  dom.patternDisplay.textContent = p.pattern;
  dom.chunkCount.textContent = chunks.length;
  dom.scene.textContent = '日常表达 · ' + p.cnPrefix;
  dom.chunkArea.innerHTML = '';
  chunks.forEach((chunk, idx) => {
    const span = document.createElement('span');
    span.className = 'chunk-item' + (chunk.custom ? ' custom' : '');
    span.textContent = chunk.en;
    span.dataset.index = idx;
    span.dataset.en = chunk.en;
    span.dataset.cn = chunk.cn;
    span.dataset.custom = chunk.custom ? 'true' : 'false';
    span.onclick = function(e) { e.stopPropagation(); playChunk(this); };
    dom.chunkArea.appendChild(span);
  });
  const first = dom.chunkArea.querySelector('.chunk-item');
  if (first) setTimeout(() => playChunk(first), 50);
  dom.progress.textContent = '总句数: ' + lessons.length + ' · 当前母句: ' + chunks.length + ' 词块';
  updateFavUI();
}

function getDialogScenes() { const s = new Set(); dialogPool.forEach(d => s.add(d.scene)); return Array.from(s); }
function getDialogByScene(scene) { return dialogPool.filter(d => d.scene === scene); }

function populateDialogScenes() {
  const select = dom.dialogSceneSelect;
  const scenes = getDialogScenes();
  select.innerHTML = '';
  scenes.forEach(scene => {
    const opt = document.createElement('option');
    opt.value = scene;
    opt.textContent = scene + ' (' + getDialogByScene(scene).length + '组)';
    select.appendChild(opt);
  });
  select.value = '问候';
  select.addEventListener('change', function() { currentDialogScene = this.value; currentDialogIndex = 0; loadDialogScene(currentDialogScene); });
  loadDialogScene('问候');
}

let currentDialogScene = '问候';
function loadDialogScene(scene) {
  dialogList = getDialogByScene(scene);
  dom.dialogCount.textContent = dialogList.length + ' 组';
  if (!dialogList.length) { dom.dialogArea.innerHTML = '<div style="padding:12px;color:#94a3b8;">暂无对话</div>'; return; }
  if (currentDialogIndex >= dialogList.length) currentDialogIndex = 0;
  showDialogItem(currentDialogIndex);
}

function showDialogItem(index) {
  if (!dialogList.length) return;
  if (index >= dialogList.length) index = 0;
  if (index < 0) index = dialogList.length - 1;
  currentDialogIndex = index;
  const d = dialogList[index];
  dom.dialogArea.innerHTML = `
    <div style="border-left:3px solid #e94560;padding:8px 12px;background:#f8fafc;border-radius:8px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
        <span style="font-weight:700;color:#e94560;font-size:13px;">问</span>
        <span style="font-weight:600;font-size:15px;flex:1;">${d.q}</span>
        <button style="background:transparent;border:0;font-size:18px;cursor:pointer;" onclick="playSingleQ('${d.q}')">🔊</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding-left:16px;border-left:2px solid #e2e8f0;margin-top:2px;">
        <span style="font-weight:700;color:#8b5cf6;font-size:13px;">答</span>
        <span style="font-size:15px;color:#475569;flex:1;">${d.a}</span>
        <button style="background:transparent;border:0;font-size:18px;cursor:pointer;" onclick="playSingleA('${d.a}')">🔊</button>
      </div>
      <div style="font-size:13px;color:#94a3b8;margin-top:4px;padding-left:16px;">${d.cn}</div>
    </div>
  `;
  dom.scene.textContent = '对讲机 · ' + d.scene;
  dom.progress.textContent = '第 ' + (index+1) + '/' + dialogList.length + ' 组';
}

function playSingleQ(t) { speakText(t); }
function playSingleA(t) { speakText(t); }
function prevDialog() {
  if (!dialogList.length) return;
  currentDialogIndex = (currentDialogIndex - 1 + dialogList.length) % dialogList.length;
  showDialogItem(currentDialogIndex);
}
function nextDialog() {
  if (!dialogList.length) return;
  currentDialogIndex = (currentDialogIndex + 1) % dialogList.length;
  showDialogItem(currentDialogIndex);
}
function playDialogQ() {
  if (!dialogList.length || currentDialogIndex >= dialogList.length) return;
  speakText(dialogList[currentDialogIndex].q);
}
function playDialogA() {
  if (!dialogList.length || currentDialogIndex >= dialogList.length) return;
  speakText(dialogList[currentDialogIndex].a);
}
function playDialogAll() {
  if (!dialogList.length || currentDialogIndex >= dialogList.length) return;
  const d = dialogList[currentDialogIndex];
  speakText(d.q, function() { setTimeout(() => speakText(d.a), 500); });
}

// ========================================================================
// 10. 搜索
// ========================================================================
function searchSentence() {
  const kw = dom.searchInput.value.trim().toLowerCase();
  dom.results.innerHTML = "";
  if (!kw) { showToast("输入关键词搜索"); return; }
  const matches = lessons.filter(item => (item.en && item.en.toLowerCase().includes(kw)) || (item.cn && item.cn.includes(kw)));
  const dialogMatches = dialogPool.filter(d => d.q.toLowerCase().includes(kw) || d.a.toLowerCase().includes(kw) || d.cn.includes(kw));
  if (!matches.length && !dialogMatches.length) { dom.results.innerHTML = '<div class="no-result">🔍 未找到匹配</div>'; return; }
  matches.slice(0, 20).forEach(item => {
    const box = document.createElement('div');
    box.className = 'result';
    box.innerHTML = `<div class="result-en">${item.en}</div><div class="result-cn">${item.cn}</div>`;
    box.onclick = function() {
      dom.patternSelect.value = item.patternId;
      loadPattern(item.patternId);
      setTimeout(() => {
        const items = dom.chunkArea.querySelectorAll('.chunk-item');
        let target = null;
        items.forEach(el => { if (el.dataset.en === item.chunkEn) target = el; });
        if (target) playChunk(target);
      }, 200);
      dom.results.innerHTML = '';
      dom.searchInput.value = '';
      showToast("跳转到句子");
    };
    dom.results.appendChild(box);
  });
  dialogMatches.slice(0, 10).forEach(d => {
    const box = document.createElement('div');
    box.className = 'result';
    box.innerHTML = `<div class="result-en">💬 Q: ${d.q}<br>A: ${d.a}</div><div class="result-cn">${d.cn}</div>`;
    box.onclick = function() {
      setMode('dialog');
      const scenes = getDialogScenes();
      if (scenes.includes(d.scene)) {
        dom.dialogSceneSelect.value = d.scene;
        loadDialogScene(d.scene);
        const idx = dialogList.findIndex(item => item.q === d.q && item.a === d.a);
        if (idx >= 0) showDialogItem(idx);
      }
      dom.results.innerHTML = '';
      dom.searchInput.value = '';
      showToast("跳转到对话");
    };
    dom.results.appendChild(box);
  });
}

// ========================================================================
// 11. 自定义词块
// ========================================================================
function addCustomChunk() {
  const enInput = document.getElementById('customChunkEn');
  const cnInput = document.getElementById('customChunkCn');
  const en = enInput.value.trim(), cn = cnInput.value.trim();
  if (!en || !cn) { showToast('请输入英文和中文'); return; }
  const pid = currentPatternId;
  if (!customChunks[pid]) customChunks[pid] = [];
  if (customChunks[pid].some(c => c.en === en)) { showToast('该词块已存在'); return; }
  customChunks[pid].push({ en, cn });
  localStorage.setItem('customChunks', JSON.stringify(customChunks));
  enInput.value = ''; cnInput.value = '';
  lessons = buildAllLessons();
  loadPattern(pid);
  showToast('✅ 已添加自定义词块');
}

// ========================================================================
// 12. 模式切换
// ========================================================================
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
  if (mode === 'single') {
    document.getElementById('singleModeArea').style.display = 'block';
    document.getElementById('dialogModeArea').style.display = 'none';
    document.getElementById('singleDisplay').style.display = 'block';
    document.getElementById('dialogDisplay').style.display = 'none';
  } else {
    document.getElementById('singleModeArea').style.display = 'none';
    document.getElementById('dialogModeArea').style.display = 'block';
    document.getElementById('singleDisplay').style.display = 'none';
    document.getElementById('dialogDisplay').style.display = 'block';
    if (!dialogList.length) populateDialogScenes();
    else loadDialogScene(currentDialogScene);
  }
}

// ========================================================================
// 13. 初始化
// ========================================================================
function initPatternSelect() {
  const select = dom.patternSelect;
  select.innerHTML = '';
  patternList.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.pattern + ' (' + p.cnPrefix + ')';
    select.appendChild(opt);
  });
  select.value = 0;
  select.addEventListener('change', function() { loadPattern(parseInt(this.value)); });
  loadPattern(0);
}

function initApp() {
  initPatternSelect();
  populateDialogScenes();
  setMode('single');
  dom.progress.textContent = '总句数: ' + lessons.length + ' · 词块: ' + chunkPool.length;
  updateFavUI();

  // 预加载语音
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
  }

  // 键盘快捷键
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevChunk(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); nextChunk(); }
    if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
    if (e.key === 'r' || e.key === 'R') { toggleRepeat(); }
    if (e.key === 'c' || e.key === 'C') { playChinese(); }
  });

  console.log('🧩 完整版启动，总句数:', lessons.length);
}

window.addEventListener('load', initApp);
</script>
