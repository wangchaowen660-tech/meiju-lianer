<style>
*{

body{

.player{

.top{

  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  font-size:18px;
  font-weight:800;
}

.count{
  font-size:12px;
  color:#888f98;
}


/* 主播放器 */

.screen{
  background:#fff;
  border-radius:27px;
  padding:30px 20px 24px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
}


/* 分类 */

.category{
  font-size:12px;
  color:#9aa0a8;
  margin-bottom:12px;
}


/* 编号 */

.number{
  font-size:11px;
  color:#b0b5bc;
  margin-bottom:13px;
}


/* 当前词块 */

.chunk{
  min-height:48px;
  font-size:30px;
  font-weight:800;
  line-height:1.25;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:5px;
}

.chunk.empty{
  color:#d0d3d7;
}


/* 中文 */

.cn{
  margin-top:7px;
  font-size:14px;
  color:#9298a0;
}


/* 整句 */

.sentence{
  margin-top:23px;
  padding-top:20px;
  border-top:1px solid #f0f1f2;
  font-size:20px;
  line-height:1.45;

}

.sentence-cn{
  font-size:13px;
  color:#999fa7;
  margin-top:5px;
}


/* 播放按钮 */

.play{
  width:76px;
  height:76px;
  border:0;
  border-radius:50%;
  background:#17191c;
  color:#fff;
  font-size:28px;
  margin:25px auto 0;
  display:block;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}

.play:active{
  transform:scale(.94);
}


/* 进度 */

.progress-area{
  margin-top:25px;
}

.progress{
  width:100%;
  height:5px;
  background:#e6e8eb;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  width:0%;
  height:100%;
  background:#17191c;
  transition:width .08s linear;
}

.time{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:11px;
  color:#999fa7;
}


/* 播放控制 */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:31px;
  margin-top:20px;
}

.ctrl{
  border:0;
  background:none;
  font-size:22px;
  color:#535a62;
}

.ctrl.main{
  font-size:25px;
}


/* 速度 */

.speed{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:19px;
}

.speed button{
  border:0;
  background:#f0f1f3;
  color:#727981;
  padding:7px 11px;
  border-radius:12px;
  font-size:12px;
}

.speed button.active{
  background:#17191c;
  color:#fff;
}


/* 模式 */

.modes{
  display:flex;
  gap:7px;
  margin-top:17px;
}

.modes button{
  flex:1;
  border:0;
  padding:10px 3px;
  border-radius:12px;
  background:#fff;
  color:#777e86;
  font-size:12px;
}

.modes button.active{
  background:#17191c;
  color:#fff;
}

.lesson-bar{

  align-items:center;
  gap:8px;
  margin-top:18px;

.lesson-input{
  flex:1;
  border:0;
  background:#fff;
  border-radius:13px;
  padding:11px 13px;
  font-size:14px;
  outline:none;
}

.jump{
  border:0;
  background:#17191c;
  color:#fff;
  border-radius:13px;
  padding:11px 14px;

/* 分类栏 */

.categories{

.categories::-webkit-scrollbar{

.categories button{

.categories button.active{

  color:#fff;

.practice{

  padding:16px;

.practice.show{

.practice-title{

  color:#999fa7;

.result{

/* 提示 */

.tip{

  color:#a1a6ad;
  font-size:11px;

}
</style>
</head>

    <div class="count" id="count">1 / 1000</div>
  </div>


  <!-- ===============================

  ================================ -->

  <div class="screen">

    <div class="category" id="category">
      Daily · 日常
    </div>

      Mother Sentence 001

    <div class="chunk" id="chunk">

      I want to go home.
    </div>

    <div class="sentence-cn" id="sentenceCn">

    </div>

    <button class="play"

    <div class="progress-area">

        <div class="bar" id="bar"></div>
      </div>

      <div class="time">
        <span id="time">00:00</span>
        <span id="total">00:08</span>
      </div>

    </div>


    <!-- 控制 -->

    <div class="controls">

      <button class="ctrl"
              onclick="previousLesson()">
        ⏮
      </button>

      <button class="ctrl main"
              onclick="repeatLesson()">
        🔁
      </button>

      <button class="ctrl"
              onclick="nextLesson()">
        ⏭
      </button>

    </div>


    <!-- 速度 -->

    <div class="speed">

      <button onclick="setSpeed(.55,this)">
        0.55×
      </button>

      <button class="active"

        0.75×
      </button>

      🎧 整句
    </button>

    <button onclick="setMode('listen',this)">
      👂 听力
    </button>

    <button onclick="setMode('speak',this)">
      🗣 开口
    </button>

  </div>

  ================================ -->

    <button class="jump"

  ================================ -->

  ================================ -->

    <input

/* =====================================================
   2. 扩展系统
   =====================================================

   为了让系统真正达到 1000 课，
   将高频母句进行“可理解变体”。

===================================================== */

const subjects = [
  "I",
  "You",
  "We",
  "They"
];

const actions = [
  ["want to go","想去"],
  ["want to eat","想吃"],
  ["want to learn","想学习"],
  ["need to work","需要工作"],
  ["need to wait","需要等待"],
  ["like to cook","喜欢做饭"],
  ["like to walk","喜欢走路"],
  ["want to try","想试试"],
  ["need to know","需要知道"],
  ["want to see","想看看"]
];

const places = [
  ["home","家"],
  ["work","工作地点"],
  ["the airport","机场"],
  ["the store","商店"],
  ["the hotel","酒店"],
  ["the restaurant","餐厅"],
  ["outside","外面"],
  ["inside","里面"],
  ["there","那里"],
  ["here","这里"]
];

const objects = [
  ["water","水"],
  ["food","食物"],
  ["coffee","咖啡"],
  ["this","这个"],
  ["that","那个"],
  ["it","它"],
  ["some food","一些食物"],
  ["some water","一些水"],
  ["a ticket","一张票"],
  ["a room","一个房间"]
];


/* =====================================================
   3. 生成剩余课程
===================================================== */

function makeGenerated(){

  const result=[];

  /*
    生成：
    I want to go home.
    I want to go work.
    I want to eat.
    ...
  */

  subjects.forEach(subject=>{

    actions.forEach(action=>{

      places.forEach(place=>{

        const english =
          subject + " " +
          action[0] + " " +
          place[0] + ".";

        const chinese =
          subject === "I"
          ? "我" + action[1] + place[1] + "。"
          : subject === "You"
          ? "你" + action[1] + place[1] + "。"
          : subject === "We"
          ? "我们" + action[1] + place[1] + "。"
          : "他们" + action[1] + place[1] + "。";

        const split =
          subject + " " +
          action[0];

        result.push([
          english,
          chinese,
          split,
          action[1],
          "Generated"
        ]);

      });

    });

  });


  /*
    第二组：
    Can you...
  */

  const verbs=[
    ["help me","帮我"],
    ["wait for me","等我"],
    ["call me","给我打电话"],
    ["show me","给我看看"],
    ["teach me","教我"],
    ["tell me","告诉我"],
    ["follow me","跟着我"],
    ["check this","检查这个"],
    ["open the door","打开门"],
    ["close the door","关门"]
  ];

  verbs.forEach(v=>{

    places.forEach(p=>{

      result.push([
        "Can you " + v[0] + "?",
        "你能" + v[1] + "吗？",
        "Can you",
        "你能……吗？",
        "Generated"
      ]);

    });

  });


  return result;
}


/* =====================================================
   4. 建立 1000 课程
===================================================== */

let lessons = [...base];

const generated =
  makeGenerated();

for(let item of generated){

  if(lessons.length >= 1000){
    break;
  }

  lessons.push(item);

}


/*
   如果以后修改基础库，
   仍然保证至少 1000 条。
*/

while(lessons.length < 1000){

  const source =
    lessons[lessons.length % base.length];

  lessons.push([
    source[0],
    source[1],
    source[2],
    source[3],
    source[4]
  ]);

}


/* =====================================================
   5. 状态
===================================================== */

let currentIndex=0;

let speed=.75;

let mode="chunk";

let playing=false;

let repeat=false;

let playTimer=null;


/* =====================================================
   6. 初始化
===================================================== */

render();


/* =====================================================
   7. 显示当前课
===================================================== */

function render(){

  const l =
    lessons[currentIndex];

  document.getElementById("count")
    .textContent =
    `${currentIndex+1} / 1000`;

  document.getElementById("number")
    .textContent =
    "Mother Sentence " +
    String(currentIndex+1).padStart(3,"0");

  document.getElementById("category")
    .textContent =
    l[4];

  document.getElementById("chunk")
    .textContent =
    l[2];

  document.getElementById("chunkCn")
    .textContent =
    l[3];

  document.getElementById("sentence")
    .textContent =
    l[0];

  document.getElementById("sentenceCn")
    .textContent =
    l[1];

  document.getElementById("bar")
    .style.width="0%";

  document.getElementById("time")
    .textContent="00:00";

}


/* =====================================================
   8. 语音
===================================================== */

function speak(text,rate=speed){

  speechSynthesis.cancel();

  return new Promise(resolve=>{

    setTimeout(()=>{

      const u =
        new SpeechSynthesisUtterance(text);

      u.lang="en-US";

      u.rate=rate;

      u.pitch=1;

      const voices =
        speechSynthesis.getVoices();

      const voice =
        voices.find(v=>v.lang==="en-US")
        ||
        voices.find(v=>v.lang.startsWith("en"));

      if(voice){
        u.voice=voice;
      }

      u.onend=resolve;

      u.onerror=resolve;

      speechSynthesis.speak(u);

    },80);

  });

}


/* =====================================================
   9. 播放当前母句
===================================================== */

async function playCurrent(){

  if(playing){

    stop();

    return;

  }

  playing=true;

  document.getElementById("play")
    .textContent="❚❚";

  const l=lessons[currentIndex];


  if(mode==="chunk"){

    await speak(l[2],speed);

    if(!playing)return;

    await pause(250);

    await speak(l[0],speed);

  }


  else if(mode==="sentence"){

    await speak(l[0],speed);

  }


  else if(mode==="listen"){

    /*
      听力模式：
      只播放，不显示中文提示。
    */

    hideText();

    await speak(l[0],speed);

    showText();

  }


  else if(mode==="speak"){

    /*
      开口模式：
      播放一次 → 停顿 → 再播放一次
    */

    await speak(l[0],speed);

    if(!playing)return;

    await pause(1800);

    await speak(l[0],speed);

  }


  if(!playing)return;


  finish();

}


/* =====================================================
   10. 小停顿
===================================================== */

function pause(ms){

  return new Promise(resolve=>{
    setTimeout(resolve,ms);
  });

}


/* =====================================================
   11. 完成
===================================================== */

function finish(){

  playing=false;

  document.getElementById("play")
    .textContent="▶";

  document.getElementById("bar")
    .style.width="100%";

  document.getElementById("time")
    .textContent="00:08";


  if(repeat){

    setTimeout(()=>{
      playCurrent();
    },500);

  }

}


/* =====================================================
   12. 停止
===================================================== */

function stop(){

  playing=false;

  speechSynthesis.cancel();

  clearTimeout(playTimer);

  document.getElementById("play")
    .textContent="▶";

}


/* =====================================================
   13. 上一句
===================================================== */

function previousLesson(){

  stop();

  currentIndex--;

  if(currentIndex<0){
    currentIndex=999;
  }

  render();

}


/* =====================================================
   14. 下一句
===================================================== */

function nextLesson(){

  stop();

  currentIndex++;

  if(currentIndex>=1000){
    currentIndex=0;
  }

  render();

}


/* =====================================================
   15. 重复
===================================================== */

function repeatLesson(){

  repeat=!repeat;

  const button =
    document.querySelector(".ctrl.main");

  button.style.opacity =
    repeat ? "1" : ".55";

}


/* =====================================================
   16. 速度
===================================================== */

function setSpeed(value,button){

  speed=value;

  document
    .querySelectorAll(".speed button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

}


/* =====================================================
   17. 模式
===================================================== */

function setMode(newMode,button){

  mode=newMode;

  document
    .querySelectorAll(".modes button")
    .forEach(b=>{
      b.classList.remove("active");
    });

  button.classList.add("active");

  stop();

}


/* =====================================================
   18. 跳转第几句
===================================================== */

function jumpLesson(){

  const value =
    parseInt(
      document.getElementById("lessonInput").value
    );

  if(
    isNaN(value) ||
    value<1 ||
    value>1000
  ){
    return;
  }

  stop();

  currentIndex=value-1;

  render();

  document.getElementById("lessonInput")
    .value="";

}


/* =====================================================
   19. 听力模式隐藏文字
===================================================== */

function hideText(){

  document.getElementById("chunk")
    .style.visibility="hidden";

  document.getElementById("chunkCn")
    .style.visibility="hidden";

  document.getElementById("sentence")
    .style.visibility="hidden";

  document.getElementById("sentenceCn")
    .style.visibility="hidden";

}

function showText(){

  document.getElementById("chunk")
    .style.visibility="visible";

  document.getElementById("chunkCn")
    .style.visibility="visible";

  document.getElementById("sentence")
    .style.visibility="visible";

  document.getElementById("sentenceCn")
    .style.visibility="visible";

}


/* =====================================================
   20. 键盘快捷键
===================================================== */

document.addEventListener("keydown",e=>{

  if(e.code==="Space"){

    e.preventDefault();

    playCurrent();

  }

  if(e.code==="ArrowRight"){

    nextLesson();

  }

  if(e.code==="ArrowLeft"){

    previousLesson();

  }

});


/* =====================================================
   21. 语音加载
===================================================== */

speechSynthesis.onvoiceschanged=()=>{
  speechSynthesis.getVoices();
};


/* =====================================================
   22. 页面离开时停止
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      stop();

    }

  }
);
