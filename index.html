<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>美句连读｜口语练习工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
body{max-width:760px;margin:16px auto;padding:0 14px;background:#f4f6fa;color:#222;}
h2{text-align:center;margin:16px 0;font-size:20px;}
.tab-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.tab{padding:6px 10px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;font-size:13px;cursor:pointer;}
.tab.active{background:#2563eb;color:#fff;border-color:#2563eb;}
.card{background:#ffffff;padding:20px;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 3px #00000015;}
.qa-block p{margin:8px 0;font-size:16px;line-height:1.6;}
.cn{color:#555;font-size:14px;}
.btn-group{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;}
.btn{padding:8px 12px;border:none;border-radius:8px;font-size:14px;cursor:pointer;background:#2563eb;color:#fff;}
.btn:active{opacity:0.82;}
.btn-gray{background:#64748b;}
.speed-group{margin:10px 0;display:flex;gap:6px;flex-wrap:wrap;}
.speed-btn{padding:5px 10px;border-radius:6px;border:1px solid #94a3b8;background:#fff;font-size:13px;cursor:pointer;}
.speed-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;}
.hide{display:none;}
</style>
</head>
<body>
<h2>美句连读｜口语练习</h2>

<div class="tab-wrap" id="tabWrap"></div>

<div class="card">
  <div class="qa-block" id="qaBlock"></div>
  <div class="speed-group">
    <span>播放速度：</span>
    <button class="speed-btn" data-rate="0.7">0.7x</button>
    <button class="speed-btn active" data-rate="1.0">1.0x</button>
    <button class="speed-btn" data-rate="1.3">1.3x</button>
  </div>
  <div class="btn-group">
    <button class="btn btn-gray" onclick="prevGroup()">上一组</button>
    <button class="btn" onclick="playQuestion()">播放问句</button>
    <button class="btn" onclick="playAnswer()">播放答句</button>
    <button class="btn btn-gray" onclick="nextGroup()">下一组</button>
  </div>
</div>

<div class="card">
  <h3>造句练习 I want to …</h3>
  <div id="makeSentenceBox" style="margin:12px 0;font-size:17px;min-height:44px;"></div>
  <div class="btn-group">
    <button class="btn" onclick="genRandomSentence()">随机造句</button>
    <button class="btn" onclick="playMakeSentence()">朗读句子</button>
  </div>
</div>

    ]
  },

    list:[
      {q:"I feel a little sick.",qzh:"我感觉有点不舒服。",a:"You should rest.",azh:"你应该休息。"},

      {q:"Call the police.",qzh:"报警。",a:"OK, wait a moment.",azh:"好，请等一下。"},
      {q:"I lost my wallet.",qzh:"我钱包丢了。",a:"Let’s report it.",azh:"我们去报案。"}
    ]
  }

// 造句词库
const verbList = [
  "eat","drink","go home","learn English","sleep","walk","read books",
  "watch TV","play football","take a rest","buy food","take a shower",
  "travel","cook food","call friends","listen to music","go shopping"
];

// 全局状态
let currentSceneIndex = 0;
let groupIndex = 0;
let playRate = 1.0;
let currentMakeSentence = "";
const synth = window.speechSynthesis;

// 渲染标签
function renderTabs(){
  const wrap = document.getElementById("tabWrap");
  wrap.innerHTML = "";
  sceneData.forEach((s,i)=>{
    const btn = document.createElement("button");
    btn.className = "tab"+(i===currentSceneIndex?" active":"");
    btn.innerText = s.name;
    btn.onclick = ()=>{
      currentSceneIndex = i;
      groupIndex = 0;
      renderTabs();
      renderQA();
    };
    wrap.appendChild(btn);
  })
}

//渲染问答
function renderQA(){
  const scene = sceneData[currentSceneIndex];
  const item = scene.list[groupIndex];
  const block = document.getElementById("qaBlock");
  block.innerHTML = `
    <p>Q：${item.q}</p >
    <p class="cn">${item.qzh}</p >
    <p>A：${item.a}</p >
    <p class="cn">${item.azh}</p >
  `
}

function prevGroup(){
  if(groupIndex>0){
    groupIndex--;renderQA();
  }
}
function nextGroup(){
  const arr = sceneData[currentSceneIndex].list;
  if(groupIndex < arr.length-1){
    groupIndex++;renderQA();
  }
}

function speakText(text){
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = "en‑US";
  utt.rate = playRate;
  synth.speak(utt);
}
function playQuestion(){
  const item = sceneData[currentSceneIndex].list[groupIndex];
  speakText(item.q);
}
function playAnswer(){
  const item = sceneData[currentSceneIndex].list[groupIndex];
  speakText(item.a);
}

//倍速按钮
document.querySelectorAll(".speed-btn").forEach(b=>{
  b.onclick = function(){
    document.querySelectorAll(".speed-btn").forEach(x=>x.classList.remove("active"));
    this.classList.add("active");
    playRate = Number(this.dataset.rate);
  }
})

//造句模块
function genRandomSentence(){
  const v = verbList[Math.floor(Math.random()*verbList.length)];
  currentMakeSentence = `I want to ${v}.`;
  document.getElementById("makeSentenceBox").innerText = currentMakeSentence;
}
function playMakeSentence(){
  if(!currentMakeSentence) return;
  speakText(currentMakeSentence);
}

//初始化
renderTabs();
renderQA();
genRandomSentence();
</script>
</body>
</html>
