<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>每句练耳 V2.0</title>
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px 14px 40px;
    background:#f5f5f5;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Microsoft YaHei",
    Arial,
    sans-serif;
}

.container{
    max-width:560px;
    margin:auto;
}

.header{
    text-align:center;
    padding:10px 0 20px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
    color:#888;
}

.card{
    background:white;
    border-radius:22px;
    padding:25px 18px;
    box-shadow:
    0 5px 20px rgba(0,0,0,.08);
    text-align:center;
}

.scene{
    color:#888;
    font-size:14px;
}

.progress{
    color:#aaa;
    margin-top:6px;
    font-size:14px;
}

.english{
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    font-size:30px;
    font-weight:bold;
    line-height:1.4;
}

.chinese{
    min-height:50px;
    font-size:20px;
    color:#666;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    font-size:17px;
}

.play{
    background:#222;
    color:white;
}

.normal{
    background:#eee;
}

.nav{
    display:flex;
    gap:8px;
}

.status{
    min-height:24px;
    margin-top:15px;
    color:#777;
    font-size:14px;
}

</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🎧 每句练耳</h1>
<p>听清 · 听懂 · 开口</p>
</div>
<div class="card">
<div id="scene"
class="scene">
日常
</div>
<div id="progress"
class="progress">
第 1 / 5 句
</div>
<div id="english"
class="english">
Good morning.
</div>
<div class="nav">
</button>

</button>
</div>
</button>
<div id="status"
class="status">
</div>
</div>
<script>


/* =========================
   句库
========================= */

const lessons = [

{
scene:"日常",
en:"Good morning.",
cn:"早上好。"
},

{
scene:"日常",
en:"How are you?",
cn:"你好吗？"
},

{
scene:"日常",
en:"What are you doing?",
cn:"你在做什么？"
},

{
scene:"日常",
en:"Where are you going?",
cn:"你要去哪里？"
},

{
scene:"日常",
en:"Where do you live?",
cn:"你住在哪里？"
}

];


let current = 0;

let speaking = false;


/* =========================
   页面元素
========================= */

const status =
document.getElementById("status");


/* =========================
   播放当前句
========================= */

function playCurrent(){

    const item =
    lessons[current];


    const speech =
    new SpeechSynthesisUtterance(
        item.en
    );


    speech.lang =
    "en-US";


    speech.rate =
    0.85;


    speech.pitch =
    1;


    speech.volume =
    1;


    speech.onstart =
    function(){

        speaking = true;

        status.innerText =
        "🎧 正在播放……";

    };


    speech.onend =
    function(){

        speaking = false;

        status.innerText =
        "✅ 播放完成";

    };


    speech.onerror =
    function(){

        speaking = false;

        status.innerText =
        "⚠️ 播放失败";

    };


    window.speechSynthesis
    .speak(speech);

}


/* =========================
   重听
========================= */

function repeatCurrent(){

    window.speechSynthesis
    .cancel();

    speaking = false;

    playCurrent();

}


/* =========================
   下一句
========================= */

function nextSentence(){

    window.speechSynthesis
    .cancel();

    speaking = false;


    current++;


    if(
        current >=
        lessons.length
    ){

        current = 0;

    }


    showSentence();


    status.innerText =
    "准备好了";

}


/* =========================
   上一句
========================= */

function previousSentence(){

    window.speechSynthesis
    .cancel();

    speaking = false;


    current--;


    if(current < 0){

        current =
        lessons.length - 1;

    }


    showSentence();


    status.innerText =
    "准备好了";

}


/* =========================
   随机一句
========================= */

function randomSentence(){

    window.speechSynthesis
    .cancel();

    speaking = false;


    current =
    Math.floor(
        Math.random() *
        lessons.length
    );


    showSentence();


    status.innerText =
    "🎲 已选择随机句子";

}


/* =========================
   显示句子
========================= */

function showSentence(){

    const item =
    lessons[current];


    document.getElementById(
        "scene"
    ).innerText =
    item.scene;


    document.getElementById(
        "progress"
    ).innerText =

    "第 " +
    (current + 1) +
    " / " +
    lessons.length +
    " 句";


    document.getElementById(
        "english"
    ).innerText =
    item.en;


    document.getElementById(
        "chinese"
    ).innerText =
    item.cn;

}


/* =========================
   初始化
========================= */

showSentence();


</script>

</div>
</html>

</body>
