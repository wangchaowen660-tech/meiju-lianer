<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>🎧 每句练耳 · Chaowen AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f6f8;
  color:#222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:10px;
}

/* =========================
   顶部
========================= */

.header{
  text-align:center;
  padding:7px 0 11px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.subtitle{
  margin-top:3px;
  color:#999;
  font-size:12px;
}

/* =========================
   搜索
========================= */

.search{
  margin-bottom:10px;
}

.search input{
  width:100%;
  height:43px;
  padding:0 13px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  background:#fff;
  font-size:14px;
}

.search input:focus{
  border-color:#999;
}

.search-results{
  margin-top:5px;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

.result{
  padding:9px 12px;
  border-bottom:1px solid #eee;
}

.result:last-child{
  border-bottom:0;
}

.result-word{
  font-weight:700;
}

.result-info{
  margin-top:2px;
  color:#888;
  font-size:12px;
}

/* =========================
   通用卡片
========================= */

.card{
  background:#fff;
  border-radius:15px;
  padding:13px;
  margin-bottom:10px;
  box-shadow:0 1px 7px rgba(0,0,0,.035);
}

/* =========================
   声音状态
========================= */

.sound-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.sound-status{
  color:#888;
  font-size:12px;
}

.sound-status.ok{
  color:#16833a;
}

.sound-status.warn{
  color:#a86a00;
}

.test-btn{
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:5px 9px;
  font-size:12px;
}

/* =========================
   词族 + 当前单词
========================= */

.learning-card{
  padding:13px;
}

.family-head{
  display:flex;
  align-items:center;
  gap:8px;
}

.family-arrow{
  width:34px;
  height:34px;
  flex:none;
  border:0;
  border-radius:9px;
  background:#f1f2f4;
  font-size:20px;
}

.family-title{
  flex:1;
  text-align:center;
}

.family-name{
  font-size:18px;
  font-weight:800;
}

.family-type{
  margin-top:2px;
  color:#999;
  font-size:11px;
}

.word-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.word-chip{
  border:1px solid #e2e2e2;
  background:#fafafa;
  color:#333;
  border-radius:9px;
  padding:6px 9px;
  font-size:14px;
}

.word-chip.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.current{
  text-align:center;
  padding:15px 4px 9px;
}

.current-word{
  font-size:39px;
  line-height:1.05;
  font-weight:800;
}

.current-pos{
  display:inline-block;
  margin-top:7px;
  color:#888;
  font-size:12px;
}

.current-zh{
  margin-top:3px;
  font-size:18px;
  font-weight:600;
}

.listen-word{
  margin-top:11px;
  padding:9px 17px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:14px;
}

.word-nav{
  display:flex;
  gap:7px;
}

.word-nav button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:9px;
  font-size:13px;
}

/* =========================
   核心一体化模块
========================= */

.language-module{
  padding:13px;
}

.module-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:10px;
  border-bottom:1px solid #eee;
}

.module-title{
  font-size:16px;
  font-weight:800;
}

.module-tip{
  color:#aaa;
  font-size:11px;
}

/* 学习层级 */

.learning-step{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.learning-step:last-child{
  border-bottom:0;
  padding-bottom:2px;
}

.step-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.step-title-left{
  font-size:14px;
  font-weight:800;
}

.step-title-right{
  color:#aaa;
  font-size:11px;
}

/* =========================
   声音块
========================= */

.sound-blocks{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
}

.sound-block{
  border:0;
  background:#f1f2f4;
  border-radius:9px;
  padding:8px 12px;
  font-size:16px;
  font-weight:700;
}

.sound-block:active{
  background:#ddd;
}

/* =========================
   高频词块
========================= */

.chunk-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chunk{
  border:1px solid #e2e2e2;
  background:#fafafa;
  border-radius:9px;
  padding:7px 9px;
  text-align:left;
}

.chunk-en{
  font-size:14px;
  font-weight:700;
}

.chunk-zh{
  margin-top:2px;
  color:#888;
  font-size:11px;
}

/* =========================
   母句
========================= */

.sentence{
  padding:8px 0;
  border-bottom:1px solid #f0f0f0;
}

.sentence:last-child{
  border-bottom:0;
}

.sentence-en{
  font-size:16px;
  line-height:1.45;
  font-weight:700;
}

.sentence-zh{
  margin-top:3px;
  color:#777;
  font-size:13px;
}

.sentence-play{
  margin-top:5px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:5px 9px;
  font-size:12px;
}

/* =========================
   听力
========================= */

.listen-box{
  text-align:center;
}

.listen-display{
  min-height:64px;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
  border-radius:11px;
  background:#f5f6f8;
  font-size:18px;
  font-weight:700;
  line-height:1.5;
}

.listen-meaning{
  min-height:22px;
  margin-top:6px;
  color:#777;
  font-size:13px;
}

.listen-buttons{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.listen-buttons button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:9px;
  font-size:13px;
}

.listen-buttons .primary{
  background:#222;
  color:#fff;
  border-color:#222;
}

/* =========================
   语速
========================= */

.speed-list{
  display:flex;
  gap:7px;
}

.speed-list button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:8px;
  font-size:12px;
}

.speed-list button.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.data-info{
  text-align:center;
  padding:2px 0 15px;
  color:#aaa;
  font-size:11px;
}

.empty{
  text-align:center;
  padding:15px;
  color:#999;
  font-size:13px;
}

@media(max-width:420px){

  .app{
    padding:8px;
  }

  .card{
    border-radius:14px;
  }

  .current-word{
    font-size:36px;
  }

  .word-chip{
    padding:6px 8px;
    font-size:13px;
  }

  .sentence-en{
    font-size:15px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- =====================
       顶部
  ====================== -->

  <header class="header">

    <div class="logo">
      🎧 每句练耳
    </div>

    <div class="subtitle">
      Chaowen AI · 声音 → 单词 → 词块 → 母句 → 听力
    </div>

  </header>


  <!-- =====================
       搜索
  ====================== -->

  <div class="search">

    <input
      id="searchInput"
      type="search"
      placeholder="搜索单词，例如 cat、water、go"
      autocomplete="off"
    >

    <div
      id="searchResults"
      class="search-results">
    </div>

  </div>


  <!-- =====================
       声音状态
  ====================== -->

  <div class="card">

    <div class="sound-row">

      <div
        id="soundStatus"
        class="sound-status warn">
        🟡 正在准备英语声音……
      </div>

      <button
        class="test-btn"
        onclick="testSound()">
        测试声音
      </button>

    </div>

  </div>


  <!-- =====================
       词族 + 当前单词
  ====================== -->

  <div class="card learning-card">

    <div class="family-head">

      <button
        class="family-arrow"
        onclick="previousFamily()">
        ‹
      </button>

      <div class="family-title">

        <div
          id="familyName"
          class="family-name">
          -at 词族
        </div>

        <div
          id="familyType"
          class="family-type">
          拼读词族
        </div>

      </div>

      <button
        class="family-arrow"
        onclick="nextFamily()">
        ›
      </button>

    </div>


    <div
      id="wordList"
      class="word-list">
    </div>


    <div class="current">

      <div
        id="currentWord"
        class="current-word"
        onclick="speakCurrentWord()">
        cat
      </div>

      <div
        id="currentPOS"
        class="current-pos">
        名词
      </div>

      <div
        id="currentZH"
        class="current-zh">
        猫
      </div>

      <button
        class="listen-word"
        onclick="speakCurrentWord()">
        🔊 听单词
      </button>

    </div>


    <div class="word-nav">

      <button onclick="previousWord()">
        ← 上一个
      </button>

      <button onclick="nextWord()">
        下一个 →
      </button>

    </div>

  </div>


  <!-- =================================================
       核心模块
       声音块 + 高频词块 + 母句型
       三个合成一个模块
  ================================================== -->

  <div class="card language-module">

    <div class="module-head">

      <div class="module-title">
        🧩 从声音到句子
      </div>

      <div class="module-tip">
        点哪里，哪里发音
      </div>

    </div>


    <!-- =====================
         第一层：声音块
    ====================== -->

    <div class="learning-step">

      <div class="step-title">

        <div class="step-title-left">
          ① 🧩 声音块
        </div>

        <div class="step-title-right">
          拼起来读
        </div>

      </div>

      <div
        id="soundBlocks"
        class="sound-blocks">
      </div>

    </div>


    <!-- =====================
         第二层：高频词块
    ====================== -->

    <div class="learning-step">

      <div class="step-title">

        <div class="step-title-left">
          ② 🧱 高频词块
        </div>

        <div class="step-title-right">
          英语这样组合
        </div>

      </div>

      <div
        id="chunkList"
        class="chunk-list">
      </div>

    </div>


    <!-- =====================
         第三层：母句型
    ====================== -->

    <div class="learning-step">

      <div class="step-title">

        <div class="step-title-left">
          ③ 🏠 母句型
        </div>

        <div class="step-title-right">
          一句带出很多句
        </div>

      </div>

      <div
        id="sentenceList">
      </div>

    </div>

  </div>


  <!-- =====================
       听力
  ====================== -->

  <div class="card">

    <div class="module-head">

      <div class="module-title">
        🎧 听力训练
      </div>

      <div class="module-tip">
        先听 → 想 → 看
      </div>

    </div>

    <div class="listen-box">

      <div
        id="listenDisplay"
        class="listen-display">
        先点击播放，只听英语
      </div>

      <div
        id="listenMeaning"
        class="listen-meaning">
        先不要看答案
      </div>

      <div class="listen-buttons">

        <button
          class="primary"
          onclick="playListening()">
          ▶ 播放
        </button>

        <button
          onclick="showListeningAnswer()">
          👁 看答案
        </button>

      </div>

    </div>

  </div>


  <!-- =====================
       语速
  ====================== -->

  <div class="card">

    <div class="module-head">

      <div class="module-title">
        ⚙️ 语速
      </div>

      <div
        id="speedLabel"
        class="module-tip">
        正常
      </div>

    </div>

    <div class="speed-list">

      <button
        id="slowBtn"
        onclick="setSpeed('slow')">
        慢速
      </button>

      <button
        id="normalBtn"
        class="active"
        onclick="setSpeed('normal')">
        正常
      </button>

      <button
        id="naturalBtn"
        onclick="setSpeed('natural')">
        自然
      </button>

    </div>

  </div>


  <div
    id="dataInfo"
    class="data-info">
  </div>

</div>

let familyIndex = 0;
let wordIndex = 0;

let currentRate = 0.85;

let voices = [];


/* =========================================================
   语音
========================================================= */

const synth =
  window.speechSynthesis;


function loadVoices(){

  if(!synth){
    updateSoundStatus();
    return;
  }

  voices =
    synth.getVoices() || [];

  updateSoundStatus();

}


if(synth){

  loadVoices();

  synth.onvoiceschanged =
    function(){

      loadVoices();

    };

}


function getEnglishVoice(){

  if(!voices.length){
    return null;
  }

  return (

    voices.find(
      v => /^en-US/i.test(v.lang)
    )

    ||

    voices.find(
      v => /^en-GB/i.test(v.lang)
    )

    ||

    voices.find(
      v => /^en/i.test(v.lang)
    )

    ||

    null

  );

}


function speakText(text){

  if(!text){
    return;
  }

  if(!synth){

    alert(
      "当前浏览器不支持英语语音。"
    );

    return;

  }

  try{

    synth.cancel();

    const utter =
      new SpeechSynthesisUtterance(
        text
      );

    const voice =
      getEnglishVoice();

    if(voice){

      utter.voice =
        voice;

      utter.lang =
        voice.lang;

    }else{

      utter.lang =
        "en-US";

    }

    utter.rate =
      currentRate;

    utter.pitch =
      1;

    utter.volume =
      1;

    synth.speak(
      utter
    );

  }catch(error){

    console.log(error);

  }

}


function updateSoundStatus(){

  const el =
    document.getElementById(
      "soundStatus"
    );

  if(!el){
    return;
  }

  if(!synth){

    el.textContent =
      "🔴 浏览器不支持语音";

    el.className =
      "sound-status warn";

    return;

  }

  if(voices.length){

    el.textContent =
      "🟢 英语声音已准备好";

    el.className =
      "sound-status ok";

  }else{

    el.textContent =
      "🟡 正在准备英语声音……";

    el.className =
      "sound-status warn";

  }

}

========================================================= */

function splitSoundBlocks(word){

  const groups = [

    "ight",
    "ough",
    "tion",
    "sion",

    "sh",
    "ch",
    "th",
    "ph",
    "wh",
    "ck",
    "ng",

    "ee",
    "ea",
    "oo",
    "ai",
    "ay",
    "oa",
    "ow",
    "ou",

    "ar",
    "or",
    "er",
    "ir",
    "ur",

    "ing"

  ];

  const result = [];

  let i = 0;

  while(i < word.length){

    let matched = "";

    for(
      let size = 4;
      size >= 2;
      size--
    ){

      const part =
        word.slice(
          i,
          i + size
        );

      if(
        groups.includes(part)
      ){

        matched =
          part;

        break;

      }

    }

    if(matched){

      result.push(
        matched
      );

      i +=
        matched.length;

    }else{

      result.push(
        word[i]
      );

      i++;

    }

  }

  return result;

}


function renderSoundBlocks(){

  const container =
    document.getElementById(

}

function setSpeed(type){

  const buttons = {

    slow:
      document.getElementById(
        "slowBtn"
      ),

    normal:
      document.getElementById(
        "normalBtn"
      ),

    natural:
      document.getElementById(
        "naturalBtn"
      )

  };

  Object.values(buttons)
    .forEach(
      button=>{
        button.classList.remove(
          "active"
        );
      }
    );


  if(type === "slow"){

    currentRate = 0.68;

    buttons.slow
      .classList.add(
        "active"
      );

    document.getElementById(
      "speedLabel"
    ).textContent =
      "慢速";

  }


  if(type === "normal"){

    currentRate = 0.85;

    buttons.normal
      .classList.add(
        "active"
      );

    document.getElementById(
      "speedLabel"
    ).textContent =
      "正常";

  }


  if(type === "natural"){

    currentRate = 1.0;

    buttons.natural
      .classList.add(
        "active"
      );

    document.getElementById(
      "speedLabel"
    ).textContent =
      "自然";

  }

}

  );


searchInput.addEventListener(
  "input",
  function(){

    const keyword =
      this.value
        .trim()
        .toLowerCase();

    searchResults.innerHTML =
      "";

    if(!keyword){
      return;
    }


    const results = [];


    FAMILY_DATA.forEach(
      (family,fIndex)=>{

        family.words.forEach(
          (data,wIndex)=>{

            const word =
              data[0]
                .toLowerCase();

            const zh =
              data[2];

            if(
              word.includes(
                keyword
              )
              ||
              zh.includes(
                keyword
              )
            ){

              results.push({

                familyIndex:
                  fIndex,

                wordIndex:
                  wIndex,

                family:
                  family.family,

                word:
                  data[0],

                pos:
                  data[1],

                zh:
                  data[2]

              });

            }

          }
        );

      }
    );


    if(!results.length){

      searchResults.innerHTML =
        "<div class='empty'>" +
        "没有找到这个单词" +
        "</div>";

      return;

    }


    results
      .slice(0,15)
      .forEach(
        result=>{

          const box =
            document.createElement(
              "div"
            );

          box.className =
            "result";

          box.innerHTML =

            "<div class='result-word'>" +
            result.word +
            "</div>" +

            "<div class='result-info'>" +
            result.pos +
            " · " +
            result.zh +
            " · " +
            result.family +
            "</div>";


          box.onclick =
            function(){

              familyIndex =
                result.familyIndex;

              wordIndex =
                result.wordIndex;

              searchInput.value =
                "";

              searchResults.innerHTML =
                "";

              render();

              speakCurrentWord();

            };


          searchResults.appendChild(
            box
          );

        }
      );

  }
);


/* =========================================================
   数据统计
========================================================= */

function updateDataInfo(){

  let total = 0;

  FAMILY_DATA.forEach(
    family=>{

      total +=
        family.words.length;

    }
  );

  document.getElementById(
    "dataInfo"
  ).textContent =

    FAMILY_DATA.length +
    " 个词族 · " +
    total +
    " 个单词 · " +
    "后续继续扩展到 2000 词";

}


/* =========================================================
   键盘
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "ArrowRight"
    ){

      nextWord();

    }

    if(
      event.key ===
      "ArrowLeft"
    ){

      previousWord();

    }

  }
);


/* =========================================================
   启动
========================================================= */

render();

updateSoundStatus();

</script>

</body>
</html>
