<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:12px 10px 28px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1e293b;min-height:100vh;}
.container{max-width:500px;width:100%;margin:0 auto;}
.header{text-align:center;padding:4px 0 8px;}
.header h1{margin:0;font-size:24px;font-weight:700;}

.pattern-selector{background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.pattern-selector label{font-weight:600;font-size:13px;color:#1e293b;white-space:nowrap;}
.pattern-selector select{flex:1;min-width:100px;padding:4px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;background:#fff;color:#1e293b;outline:none;cursor:pointer;}
.pattern-selector .badge{background:#e94560;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.search-wrapper{display:flex;gap:4px;margin-bottom:8px;}
.search-wrapper .input-group{flex:1;display:flex;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:0 4px;height:34px;}
.search-wrapper .input-group:focus-within{border-color:#1e293b;}
.search-wrapper .input-group input{flex:1;border:0;outline:none;font-size:13px;padding:0 4px;background:transparent;height:100%;}
.search-wrapper .input-group button{background:transparent;border:0;font-size:16px;cursor:pointer;padding:0 6px;color:#94a3b8;display:flex;align-items:center;height:100%;}
.search-wrapper .input-group button:hover{color:#1e293b;}
.results{margin-bottom:8px;}
.result{background:#fff;padding:8px 12px;margin-bottom:4px;border-radius:10px;cursor:pointer;border:1px solid #e2e8f0;}
.result-en{font-weight:600;font-size:15px;}
.result-cn{margin-top:2px;color:#64748b;font-size:13px;}
.no-result{padding:12px;text-align:center;color:#94a3b8;background:#fff;border-radius:10px;font-size:14px;}
.card{background:#fff;border-radius:16px;padding:16px 12px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04);text-align:center;position:relative;}
.avatar-wrap{position:absolute;top:8px;right:8px;width:64px;height:64px;border-radius:50%;border:2px solid #e2e8f0;overflow:hidden;background:#e2e8f0;}
#avatarCanvas{width:100%;height:100%;display:block;}
.scene{color:#94a3b8;font-size:12px;font-weight:500;padding-right:64px;text-align:left;}
.progress{color:#b9c2d0;font-size:11px;margin-top:1px;text-align:left;}
.pattern-display{background:#f1f5f9;padding:4px 12px;border-radius:8px;margin:8px 0 2px;display:inline-block;}
.pattern-display .label{font-size:10px;color:#94a3b8;}
.pattern-display .text{font-size:18px;font-weight:700;color:#0f172a;}
.flow-arrow{color:#94a3b8;font-size:14px;margin:2px 0;}
.english{min-height:40px;display:flex;align-items:center;justify-content:center;padding:6px 4px;font-size:22px;font-weight:700;line-height:1.3;color:#0f172a;background:#f8fafc;border-radius:8px;margin:4px 0;}
.chinese{min-height:28px;font-size:16px;color:#475569;padding:4px 8px;background:#f8fafc;border-radius:8px;}
.sentence-hint{font-size:11px;color:#94a3b8;margin-top:2px;}
.sentence-hint .highlight{color:#e94560;font-weight:600;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 4px;}
.ctrl-btn{background:#f1f4f9;border:0;padding:0;cursor:pointer;font-size:24px;color:#1e293b;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;touch-action:manipulation;transition:background 0.15s;}
.ctrl-btn:active{transform:scale(.90);}
.ctrl-btn.play-btn{width:56px;height:56px;font-size:30px;background:#1e293b;color:#fff;}
.ctrl-btn.cn-btn{background:#f59e0b;color:#fff;width:40px;height:40px;font-size:20px;}
.extra-buttons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;justify-content:center;}
.extra-buttons button{flex:0 1 auto;padding:4px 10px;border:0;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:#f1f4f9;color:#1e293b;transition:background 0.15s;}
.extra-buttons button.active{background:#ef4444;color:#fff;}
.extra-buttons .ai-toggle{background:#10b981;color:#fff;}
.extra-buttons .ai-toggle:hover{background:#059669;}
.extra-buttons .mic-toggle{background:#f59e0b;color:#fff;}
.extra-buttons .mic-toggle:hover{background:#d97706;}
.extra-buttons .mic-toggle.listening{background:#ef4444;}
.extra-buttons .mic-toggle:disabled{opacity:0.5;cursor:not-allowed;}
.extra-buttons .reset-audio-btn{background:#ef4444;color:#fff;}
.extra-buttons .reset-audio-btn:hover{background:#dc2626;}
.extra-buttons .chunk-toggle-btn{background:#8b5cf6;color:#fff;}
.extra-buttons .chunk-toggle-btn:hover{background:#7c3aed;}
.status{min-height:20px;margin-top:4px;color:#94a3b8;font-size:12px;}
.status.speaking{color:#3b82f6;}
.status.done{color:#22c55e;}
.status.error{color:#ef4444;}
.status.paused{color:#f59e0b;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:6px 16px;border-radius:40px;opacity:0;pointer-events:none;transition:.3s;z-index:999;font-size:13px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.api-settings{background:#f1f5f9;border-radius:10px;padding:4px 10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.api-settings input{flex:2;min-width:60px;padding:3px 6px;border:1px solid #d1d9e6;border-radius:6px;font-size:12px;background:#fff;}
.api-settings input#apiBaseInput{flex:1.5;}
.api-settings button{padding:3px 10px;background:#1e293b;color:#fff;border:0;border-radius:6px;font-weight:500;cursor:pointer;font-size:12px;}
.api-settings button.save-btn{background:#22c55e;}
.api-status{font-size:11px;color:#64748b;margin-left:2px;}
.chunk-area-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.3s ease, opacity 0.2s ease;margin:0;}
.chunk-area-wrap.open{max-height:400px;opacity:1;margin-top:8px;}
.chunk-area{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;max-height:200px;overflow-y:auto;}
.chunk-item{cursor:pointer;padding:3px 10px;background:#eef2f6;border-radius:14px;font-size:13px;color:#1e293b;border:1px solid transparent;transition:all 0.15s;user-select:none;}
.chunk-item:hover{background:#dce2ea;}
.chunk-item.active{background:#e94560;color:#fff;border-color:#e94560;}
.chat-box{background:#f8fafc;border-radius:12px;padding:10px;margin-top:8px;max-height:280px;overflow-y:auto;text-align:left;border:1px solid #e2e8f0;display:none;}
.chat-msg{margin:4px 0;padding:5px 10px;border-radius:10px;max-width:90%;word-break:break-word;font-size:14px;}
.chat-msg.user{background:#dbeafe;margin-left:auto;}
.chat-msg.ai{background:#e5e7eb;margin-right:auto;}
.chat-msg .time{font-size:10px;color:#94a3b8;margin-top:2px;}
.chat-input-area{display:flex;gap:4px;margin-top:4px;display:none;}

</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
<div class="header"><h1>🧩 Listen & Speak</h1><p>极简 · 词块可隐藏</p></div>

<!-- API 设置 -->
<div class="api-settings">
  <input id="apiKeyInput" type="password" placeholder="API Key" style="flex:2;">
  <input id="apiBaseInput" type="url" placeholder="API Base URL" value="https://api.deepseek.com/v1" style="flex:1.5;">
  <button class="save-btn" onclick="saveApiConfig()">💾</button>
  <span class="api-status" id="apiStatus">未设置</span>
</div>

<!-- 母句选择器 -->
<div class="pattern-selector">
  <label>📌 母句</label>
  <select id="patternSelect"></select>
  <span class="badge" id="chunkCount">0</span>
</div>

<!-- 搜索 -->
<div class="search-wrapper">
  <div class="input-group">
    <input id="searchInput" type="search" placeholder="搜索句子" autocomplete="off">
    <button onclick="searchSentence()">🔍</button>
  </div>
</div>
<div id="results" class="results"></div>

<!-- 主卡片 -->
<div class="card">
  <div class="avatar-wrap"><canvas id="avatarCanvas" width="220" height="220"></canvas></div>

  <div class="scene" id="scene">日常表达</div>
  <div class="progress" id="progress">总句数: 2500+</div>

  <div class="pattern-display">
    <div class="label">母句</div>
    <div class="text" id="patternDisplay">I want to...</div>
  </div>

  <div class="flow-arrow">▼ 当前整句</div>

  <div class="english"><span id="english">I want to eat.</span></div>
  <div class="chinese" id="chinese">我想吃饭。</div>
  <div class="sentence-hint" id="sentenceHint">💡 点击 ➡️ ⬅️ 切换词块</div>

  <div class="player-controls">
    <button class="ctrl-btn" onclick="prevChunk()">⏮</button>
    <button id="playPauseBtn" class="ctrl-btn play-btn" onclick="togglePlayPause()">▶</button>
    <button class="ctrl-btn cn-btn" onclick="playChinese()">🔊中</button>
    <button class="ctrl-btn" onclick="nextChunk()">⏭</button>
  </div>

  <div class="extra-buttons">
    <button id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
    <button onclick="playPatternOnly()">🧩 母句</button>
    <button onclick="randomChunk()">🎲 随机</button>
    <button id="micBtn" class="mic-toggle" onclick="toggleMic()">🎤 Voice</button>
    <button id="aiToggle" class="ai-toggle" onclick="toggleChat()">💬 AI</button>
    <button class="reset-audio-btn" onclick="resetAudio()">🔊 修复</button>
    <button class="chunk-toggle-btn" id="chunkToggleBtn" onclick="toggleChunkList()">📋 词块</button>
  </div>

  <!-- 可折叠词块列表 -->
  <div class="chunk-area-wrap" id="chunkAreaWrap">
    <div class="chunk-area" id="chunkArea"></div>
  </div>

  <div id="chatBox" class="chat-box"></div>
  <div id="chatInputArea" class="chat-input-area">
    <input id="chatInput" type="text" placeholder="输入消息" autocomplete="off">
    <button onclick="sendTextMessage()">Send</button>
  </div>
  <div id="status" class="status">Ready</div>
</div>
<div style="text-align:center;margin-top:6px;font-size:11px;color:#b9c2d0;">← 上一词块 · 下一词块 →</div>
</div>

function buildAllLessons() {
  const result = [];
  patternList.forEach((p) => {
    const end = Math.min(p.start + p.count, chunkPool.length);
    for (let i = p.start; i < end; i++) {
      const chunk = chunkPool[i];
      const fullEn = p.pattern.replace(/\.{3}/g, chunk.en);
      const fullCn = p.cnPrefix + chunk.cn;
      result.push({
        id: result.length + 1,
        pattern: p.pattern,
        en: fullEn,
        cn: fullCn,
        chunkEn: chunk.en,
        chunkCn: chunk.cn,
        patternId: p.id,
        chunkIndex: i
      });
    }
  });
  return result;
}

function drawMouth(open){
  ctx.putImageData(baseImageData,0,0);
  const h=mouthHBase+open*28;
  const x=mouthX-3;
  ctx.beginPath();ctx.ellipse(x,mouthY,mouthW,h,0,0,Math.PI*2);

let mouthOpen=0.1, isSpeakingState=false, mouthTimer=null;
function updateMouth(target){mouthOpen+=(target-mouthOpen)*0.15;drawMouth(mouthOpen);}
function startSpeakingMouth(){
  isSpeakingState=true;
  if(mouthTimer)clearInterval(mouthTimer);
  let phase=0;
  mouthTimer=setInterval(()=>{phase+=0.3;const target=(Math.sin(phase)*0.5+0.5)*0.8+0.2;updateMouth(target);},50);
}
function stopSpeakingMouth(){
  isSpeakingState=false;
  if(mouthTimer){clearInterval(mouthTimer);mouthTimer=null;}
  let closeStep=0;
  function closeMouth(){
    if(closeStep<15){
      mouthOpen*=0.9;if(mouthOpen<0.05)mouthOpen=0.05;
      drawMouth(mouthOpen);closeStep++;
      setTimeout(closeMouth,25);
    }else{mouthOpen=0.05;drawMouth(0.05);}
  }
  closeMouth();
}

let currentPatternId=0, currentChunkIndex=0;
let isSpeaking=false, currentUtterance=null, playQueue=[], isProcessingQueue=false;
let isRepeating=false, repeatCount=0, repeatTimer=null;
const REPEAT_TIMES=5;
let playTimeout=null;
let isPlayingLock=false;

function stopSpeech(){
  if(playTimeout){clearTimeout(playTimeout);playTimeout=null;}
  if(currentUtterance){try{window.speechSynthesis.cancel();}catch(e){}currentUtterance=null;}
  isSpeaking=false;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
  playQueue=[];isProcessingQueue=false;isPlayingLock=false;
  stopSpeakingMouth();
}

function speakNative(text,cb){
  if(!text||text.trim()===''){cb(false,'Empty');return;}
  if(!window.speechSynthesis){cb(false,'No speechSynthesis');return;}
  try{window.speechSynthesis.cancel();}catch(e){}
  playQueue=[];isProcessingQueue=false;

  let voices=window.speechSynthesis.getVoices();
  if(!voices||voices.length===0){
    let waited=false;
    const onVoices=function(){
      voices=window.speechSynthesis.getVoices();
      if(voices&&voices.length>0&&!waited){waited=true;doSpeak();}
    };
    window.speechSynthesis.onvoiceschanged=onVoices;
    setTimeout(()=>{if(!waited){waited=true;voices=window.speechSynthesis.getVoices();doSpeak();}},200);
    return;
  }
  doSpeak();

  function doSpeak(){
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang='en-US';utterance.rate=0.7;utterance.pitch=1.0;utterance.volume=1.0;
    const preferred=voices.find(v=>/Google UK|David|Zira|Samantha|Alex|Veena/i.test(v.name))||
      voices.find(v=>v.lang&&v.lang.startsWith('en'));
    if(preferred)utterance.voice=preferred;

    let ended=false;
    const timeoutId=setTimeout(()=>{
      if(!ended){
        ended=true;
        try{window.speechSynthesis.cancel();}catch(e){}
        currentUtterance=null;isSpeaking=false;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
        isPlayingLock=false;cb(false,'Timeout');stopSpeakingMouth();
      }
    },5000);

    utterance.onstart=function(){
      if(currentUtterance!==utterance)return;
      isSpeaking=true;isPlayingLock=true;
      dom.playPauseBtn.textContent="⏸";dom.playPauseBtn.classList.add("paused");
      dom.status.textContent="🎧 Speaking...";dom.status.className="status speaking";
      startSpeakingMouth();
    };
    utterance.onend=function(){
      if(ended)return;
      ended=true;clearTimeout(timeoutId);
      isSpeaking=false;currentUtterance=null;
      dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
      dom.status.textContent="✅ Done";dom.status.className="status done";
      isPlayingLock=false;stopSpeakingMouth();cb(true);
    };
    utterance.onerror=function(e){
      if(ended)return;
      ended=true;clearTimeout(timeoutId);
      isSpeaking=false;currentUtterance=null;
      dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
      isPlayingLock=false;stopSpeakingMouth();
      if(e.error==='canceled'||e.error==='interrupted'){cb(false,'Canceled');}
      else{cb(false,'TTS error: '+e.error);}
    };
    currentUtterance=utterance;
    try{window.speechSynthesis.speak(utterance);}catch(err){
      clearTimeout(timeoutId);ended=true;isSpeaking=false;currentUtterance=null;isPlayingLock=false;
      cb(false,'Exception: '+err.message);stopSpeakingMouth();
    }
  }
}

function speakText(text,cb){
  const clean=text.replace(/\.{3,}/g,'').replace(/…/g,'').replace(/\s+/g,' ').trim();
  if(!clean){if(cb)cb(false);return;}
  if(isPlayingLock||isSpeaking){
    try{window.speechSynthesis.cancel();}catch(e){}
    isSpeaking=false;currentUtterance=null;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
    playQueue=[];isProcessingQueue=false;isPlayingLock=false;stopSpeakingMouth();
  }
  setTimeout(()=>{
    speakNative(clean,function(success){
      if(cb)cb(success);
      if(!success){
        setTimeout(()=>{speakNative(clean,function(s2){if(cb)cb(s2);});},300);
      }
    });
  },50);
}

function getChunksForPattern(patternId){
  const p=patternList[patternId];
  const end=Math.min(p.start+p.count, chunkPool.length);
  const chunks=[];
  for(let i=p.start;i<end;i++){chunks.push({index:i,...chunkPool[i]});}
  return chunks;
}

function loadPattern(patternId){
  currentPatternId=patternId;
  currentChunkIndex=0;
  const p=patternList[patternId];
  const chunks=getChunksForPattern(patternId);

  dom.patternDisplay.textContent=p.pattern;
  dom.chunkCount.textContent=chunks.length;
  dom.scene.textContent='日常表达 · '+p.cnPrefix;

  // 渲染词块列表（即使隐藏也更新）
  dom.chunkArea.innerHTML='';
  chunks.forEach((chunk,idx)=>{
    const span=document.createElement('span');
    span.className='chunk-item';
    span.textContent=chunk.en;
    span.dataset.index=idx;
    span.dataset.en=chunk.en;
    span.dataset.cn=chunk.cn;
    span.onclick=function(e){e.stopPropagation();playChunk(this);};
    dom.chunkArea.appendChild(span);
  });

  const first=dom.chunkArea.querySelector('.chunk-item');
  if(first){setTimeout(()=>playChunk(first),50);}
  dom.progress.textContent='总句数: '+lessons.length+' · 当前母句: '+chunks.length+' 词块';
}

let playDebounceTimer=null;

function playChunk(el){
  if(playDebounceTimer){clearTimeout(playDebounceTimer);playDebounceTimer=null;}
  if(isSpeaking||isPlayingLock){
    try{window.speechSynthesis.cancel();}catch(e){}
    isSpeaking=false;currentUtterance=null;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
    playQueue=[];isProcessingQueue=false;isPlayingLock=false;stopSpeakingMouth();
  }
  playDebounceTimer=setTimeout(()=>{
    playDebounceTimer=null;
    dom.chunkArea.querySelectorAll('.chunk-item').forEach(item=>item.classList.remove('active'));
    el.classList.add('active');

    const enWord=el.dataset.en;
    const cnWord=el.dataset.cn;
    const p=patternList[currentPatternId];
    const fullEn=p.pattern.replace(/\.{3}/g,enWord);
    const fullCn=p.cnPrefix+cnWord;

    dom.english.textContent=fullEn;
    dom.chinese.textContent=fullCn;
    dom.sentenceHint.innerHTML='✅ 造句连读：<span class="highlight">'+enWord+'</span> ('+cnWord+')';

    const items=dom.chunkArea.querySelectorAll('.chunk-item');
    items.forEach((item,idx)=>{if(item===el)currentChunkIndex=idx;});

    dom.status.textContent='🔊 整句朗读: '+fullEn;
    dom.status.className='status speaking';
    speakText(fullEn,function(success){
      if(!success){
        dom.status.textContent="⚠️ 播放失败，重试...";
        dom.status.className="status error";
        setTimeout(()=>{speakText(fullEn,function(s2){if(!s2)dom.status.textContent="⚠️ 播放失败";});},300);
      }
    });
  },100);
}

function playPatternOnly(){
  const p=patternList[currentPatternId];
  const text=p.pattern.replace(/\.{3}/g,'').trim();
  if(!text)return;
  if(isSpeaking||isPlayingLock){
    try{window.speechSynthesis.cancel();}catch(e){}
    isSpeaking=false;currentUtterance=null;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
    stopSpeakingMouth();
  }
  setTimeout(()=>{dom.status.textContent="🧩 母句: "+text;speakText(text);},100);
}

function randomChunk(){
  const items=dom.chunkArea.querySelectorAll('.chunk-item');
  if(items.length===0)return;
  const randIdx=Math.floor(Math.random()*items.length);
  playChunk(items[randIdx]);
}

function prevChunk(){
  const items=dom.chunkArea.querySelectorAll('.chunk-item');
  if(items.length===0)return;
  let activeIdx=0;
  items.forEach((el,i)=>{if(el.classList.contains('active'))activeIdx=i;});
  const newIdx=(activeIdx-1+items.length)%items.length;
  playChunk(items[newIdx]);
}

function nextChunk(){
  const items=dom.chunkArea.querySelectorAll('.chunk-item');
  if(items.length===0)return;
  let activeIdx=0;
  items.forEach((el,i)=>{if(el.classList.contains('active'))activeIdx=i;});
  const newIdx=(activeIdx+1)%items.length;
  playChunk(items[newIdx]);
}

function togglePlayPause(){
  if(isSpeaking||isPlayingLock){
    try{window.speechSynthesis.cancel();}catch(e){}
    isSpeaking=false;currentUtterance=null;dom.playPauseBtn.textContent="▶";dom.playPauseBtn.classList.remove("paused");
    playQueue=[];isProcessingQueue=false;isPlayingLock=false;stopSpeakingMouth();
    dom.status.textContent="⏸ Paused";dom.status.className="status paused";
  }else{
    const text=dom.english.textContent;
    if(text&&text!=='I want to eat.'){
      dom.status.textContent="🔊 重播...";dom.status.className="status speaking";
      speakText(text);
    }else{
      const items=dom.chunkArea.querySelectorAll('.chunk-item');
      let active=dom.chunkArea.querySelector('.chunk-item.active');
      if(!active&&items.length>0)active=items[0];
      if(active)playChunk(active);
    }
  }
}

// AI对话（保留）
let chatMode=false, isListening=false;
let apiKey=localStorage.getItem('ai_api_key')||'';
let apiBase=localStorage.getItem('ai_api_base')||'https://api.deepseek.com/v1';
let chatHistory=[];
const MAX_HISTORY=10;

function loadApiConfig(){
  document.getElementById('apiKeyInput').value=apiKey;
  document.getElementById('apiBaseInput').value=apiBase;
  updateApiStatus();
}
function updateApiStatus(){
  const el=document.getElementById('apiStatus');
  if(apiKey){el.textContent='✅ 已配置';el.style.color='#22c55e';}else{el.textContent='⚠️ 请设置 API Key';el.style.color='#ef4444';}
}
function saveApiConfig(){
  const key=document.getElementById('apiKeyInput').value.trim();
  const base=document.getElementById('apiBaseInput').value.trim();
  if(key){apiKey=key;localStorage.setItem('ai_api_key',key);}
  if(base){apiBase=base;localStorage.setItem('ai_api_base',base);}
  updateApiStatus();showToast('✅ API 设置已保存');
}
const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;
function buildMessages(userInput){
  const systemMsg={role:'system',content:'You are a helpful English teacher and conversation partner. Speak naturally. If user speaks Chinese, reply in Chinese; if English, reply in English. Keep replies concise.'};
  const history=chatHistory.slice(-MAX_HISTORY);
  const messages=[systemMsg,...history];
  if(userInput)messages.push({role:'user',content:userInput});
  return messages;
}
async function callAI(userInput){
  if(!apiKey){showToast('⚠️ 请先设置 API Key');return null;}
  const messages=buildMessages(userInput);
  const url=apiBase+'/chat/completions';
  const body={model:'deepseek-chat',messages,temperature:0.7,max_tokens:500,stream:false};
  try{
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify(body)});
    if(!resp.ok){const err=await resp.text();throw new Error('API 错误: '+resp.status+' '+err);}
    const data=await resp.json();
    const reply=data.choices[0].message.content;
    chatHistory.push({role:'user',content:userInput});
    chatHistory.push({role:'assistant',content:reply});
    if(chatHistory.length>MAX_HISTORY*2)chatHistory=chatHistory.slice(-MAX_HISTORY*2);
    return reply;
  }catch(e){showToast('❌ AI 请求失败: '+e.message);return null;}
}
function appendMessage(role,content){
  const div=document.createElement('div');div.className='chat-msg '+role;div.textContent=content;
  const time=document.createElement('div');time.className='time';time.textContent=new Date().toLocaleTimeString();div.appendChild(time);
  dom.chatBox.appendChild(div);dom.chatBox.scrollTop=dom.chatBox.scrollHeight;
}
async function processUserInput(text){
  if(!text.trim())return;
  appendMessage('user',text);
  dom.status.textContent='🤖 AI 思考中...';dom.status.className='status speaking';
  const reply=await callAI(text);
  if(reply){
    appendMessage('ai',reply);
    dom.status.textContent='✅ 已回复';dom.status.className='status done';
    if(window.speechSynthesis){
      const utter=new SpeechSynthesisUtterance(reply);
      utter.lang=/[\u4e00-\u9fa5]/.test(reply)?'zh-CN':'en-US';utter.rate=0.8;
      window.speechSynthesis.speak(utter);
    }
  }else{dom.status.textContent='⚠️ 回复失败';dom.status.className='status error';}
}
function toggleChat(){
  chatMode=!chatMode;const btn=dom.aiToggle;
  if(chatMode){dom.chatBox.style.display='block';document.getElementById('chatInputArea').style.display='flex';btn.textContent='❌ 关闭';btn.style.background='#ef4444';if(dom.chatBox.children.length===0){appendMessage('ai',"👋 你好！我是你的 AI 英语学习助手。");}}else{dom.chatBox.style.display='none';document.getElementById('chatInputArea').style.display='none';btn.textContent='💬 AI';btn.style.background='#10b981';if(isListening){try{recognition.stop();}catch(e){}dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}}
}
function sendTextMessage(){
  const text=dom.chatInput.value.trim();if(!text)return;dom.chatInput.value='';processUserInput(text);
}
dom.chatInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendTextMessage();}});
function toggleMic(){
  if(isListening){recognition.stop();dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;return;}
  if(!chatMode)toggleChat();
  try{recognition.start();dom.micBtn.textContent='⏺ Recording...';dom.micBtn.classList.add('listening');dom.status.textContent='🎤 请说话...';dom.status.className='status speaking';isListening=true;}catch(e){showToast('❌ 麦克风访问被拒绝。');dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}
}
recognition.onresult=function(event){
  let finalText='';
  for(let i=event.resultIndex;i<event.results.length;i++){if(event.results[i].isFinal){finalText=event.results[i][0].transcript;break;}}
  if(finalText){dom.status.textContent='✅ 识别: '+finalText;dom.status.className='status done';processUserInput(finalText);recognition.stop();dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}
};
recognition.onerror=function(event){dom.status.textContent='⚠️ 识别错误: '+event.error;dom.status.className='status error';dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;showToast('语音识别失败，请尝试输入。');};
recognition.onend=function(){if(isListening){dom.micBtn.textContent='🎤 Voice';dom.micBtn.classList.remove('listening');isListening=false;}};
