    document.getElementById('apiKeyInput').value = apiKey;

}
function updateApiStatus() {
    const el = document.getElementById('apiStatus');
    if (apiKey) { el.textContent = '✅ 已配置'; el.style.color = '#22c55e'; }
    else { el.textContent = '⚠️ 请设置 API Key'; el.style.color = '#ef4444'; }
}
function saveApiConfig() {
    const key = document.getElementById('apiKeyInput').value.trim();
    const base = document.getElementById('apiBaseInput').value.trim();
    if (key) { apiKey = key; localStorage.setItem('ai_api_key', key); }

// 3. 工具函数

function cleanSpeechText(text) {
    if (!text) return '';
    return text.replace(/\.{3,}/g, '').replace(/…/g, '').replace(/\s+/g, ' ').trim() || text;
}

// ========================================================================
// 4. 展开模板（生成 600+ 短句）
// ========================================================================
function expandTemplates(templates) {
    const result = [];
    templates.forEach(tpl => {
        const [scene, chunk, pattern, en, cn, replacements] = tpl;
        result.push({ scene, chunk, pattern, en: cleanSpeechText(en), cn, replace: replacements, isPremium: false });
        if (replacements && replacements.length) {
            replacements.forEach(r => {
                const parts = r.split('|');
                if (parts.length < 2) return;
                const enWord = parts[0].trim();
                const cnWord = parts[1].trim();
                let newEn = en;
                let newCn = cn;
                if (pattern.includes('...')) {
                    newEn = pattern.replace(/\.{3}/g, enWord);
                } else {
                    const words = en.split(' ');
                    if (words.length > 0) { words[words.length - 1] = enWord; newEn = words.join(' '); }
                    else { newEn = enWord; }
                }
                if (cn.includes('……')) { newCn = cn.replace(/……/g, cnWord); }
                else {
                    const cnWords = cn.split(/[，,、。.]/);
                    if (cnWords.length > 0) {
                        const last = cnWords[cnWords.length - 1];
                        if (last.length > 0) newCn = cn.replace(last, cnWord);
                        else newCn = cn + cnWord;
                    } else newCn = cnWord;
                }
                newEn = cleanSpeechText(newEn);
                if (!newEn) newEn = enWord;
                result.push({
                    scene,
                    chunk: chunk + ' (' + enWord + ')',
                    pattern: newEn,
                    en: newEn,
                    cn: newCn,
                    replace: replacements,
                    isPremium: false
                });
            });
        }
    });
    return result;
}

function stopSpeech() {
    console.log('stopSpeech called');
    if (currentUtterance) {
        try { window.speechSynthesis.cancel(); } catch(e) {}
        currentUtterance = null;
    }
    if (currentAudio) {
        try { currentAudio.pause(); currentAudio.src = ''; } catch(e) {}
        currentAudio = null;
    }
    isSpeaking = false;
    dom.playPauseBtn.textContent = "▶";
    dom.playPauseBtn.classList.remove("paused");
    playQueue = [];
    isProcessingQueue = false;
}

// 原生语音
function speakNative(text, cb) {
    console.log('speakNative called:', text);
    if (!text || text.trim() === '') { cb(false, 'Empty'); return; }
    if (!window.speechSynthesis) { cb(false, 'No speechSynthesis'); return; }
    let voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) {
        window.speechSynthesis.onvoiceschanged = function() {
            voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) doSpeak();
            else setTimeout(() => { voices = window.speechSynthesis.getVoices(); if (voices.length > 0) doSpeak(); }, 500);
        };
        window.speechSynthesis.getVoices();
        setTimeout(() => { voices = window.speechSynthesis.getVoices(); if (voices && voices.length > 0) doSpeak(); }, 1000);
        return;
    }
    doSpeak();

    function doSpeak() {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.7;
        utterance.pitch = 1;
        utterance.volume = 1;
        const preferred = voices.find(v => /Google UK|David|Zira|Samantha|Alex|Fred/i.test(v.name)) ||
                          voices.find(v => v.lang.startsWith('en'));
        if (preferred) utterance.voice = preferred;
        let ended = false;
        const timeoutId = setTimeout(() => {
            if (!ended) { ended = true; window.speechSynthesis.cancel(); currentUtterance = null; isSpeaking = false; dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused"); cb(false, 'Timeout'); }
        }, 10000);

        utterance.onstart = function() {
            if (currentUtterance !== utterance) return;
            isSpeaking = true;
            dom.playPauseBtn.textContent = "⏸";
            dom.playPauseBtn.classList.add("paused");
            dom.status.textContent = "🎧 Playing (native)";
            dom.status.className = "status speaking";
        };
        utterance.onend = function() {
            if (ended) return;
            ended = true; clearTimeout(timeoutId);
            isSpeaking = false; currentUtterance = null;
            dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
            dom.status.textContent = "✅ Playback done"; dom.status.className = "status done";
            cb(true);
        };
        utterance.onerror = function(e) {
            if (ended) return;
            ended = true; clearTimeout(timeoutId);
            isSpeaking = false; currentUtterance = null;
            dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
            cb(false, 'TTS error: ' + e.error);
        };
        currentUtterance = utterance;
        try { window.speechSynthesis.speak(utterance); }
        catch(err) { clearTimeout(timeoutId); ended = true; isSpeaking = false; currentUtterance = null; cb(false, 'Exception: ' + err.message); }
    }
}

// HD 语音
function speakGoogle(text, cb) {
    if (!text || text.trim() === '') { cb(false, 'Empty'); return; }
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
    const audio = new Audio(url);
    currentAudio = audio;
    let ended = false;
    const timeoutId = setTimeout(() => {
        if (!ended) { ended = true; audio.pause(); audio.src = ''; currentAudio = null; cb(false, 'Timeout'); }
    }, 10000);

    audio.oncanplaythrough = function() {
        audio.play().catch(err => { if (!ended) { clearTimeout(timeoutId); ended = true; currentAudio = null; cb(false, 'Play error: ' + err.message); } });
    };
    audio.onplay = function() {
        isSpeaking = true;
        dom.playPauseBtn.textContent = "⏸";
        dom.playPauseBtn.classList.add("paused");
        dom.status.textContent = "🎧 Playing (HD)";
        dom.status.className = "status speaking";
    };
    audio.onended = function() {
        if (ended) return;
        clearTimeout(timeoutId); ended = true; isSpeaking = false; currentAudio = null;
        dom.playPauseBtn.textContent = "▶"; dom.playPauseBtn.classList.remove("paused");
        dom.status.textContent = "✅ Playback done"; dom.status.className = "status done";
        cb(true);
    };
    audio.onerror = function() {
        if (ended) return;
        clearTimeout(timeoutId); ended = true; isSpeaking = false; currentAudio = null;
        cb(false, 'Google TTS failed');
    };
    audio.load();
}

// 统一入口
function speakText(text, cb) {
    const clean = cleanSpeechText(text);
    if (!clean) { if (cb) cb(false); return; }
    playQueue.push({ text: clean, cb, retries: 0 });
    processQueue();
}

function processQueue() {
    if (isProcessingQueue || playQueue.length === 0) return;
    isProcessingQueue = true;
    const task = playQueue.shift();
    const { text, cb, retries } = task;
    const useGoogle = hdMode && navigator.onLine;

    function onResult(success, msg) {
        if (success) {
            isProcessingQueue = false; if (cb) cb(true);
            if (playQueue.length > 0) processQueue();
        } else {
            if (retries < MAX_RETRY) {
                task.retries = retries + 1;
                playQueue.unshift(task);
                isProcessingQueue = false;
                setTimeout(processQueue, 500);
            } else {
                isProcessingQueue = false; if (cb) cb(false);
                dom.status.textContent = "⚠️ Playback failed."; dom.status.className = "status error";
                if (playQueue.length > 0) processQueue();
            }
        }
    }

    if (useGoogle) speakGoogle(text, onResult);
    else speakNative(text, onResult);
}

function playCurrent() {
    if (isSpeaking) { stopSpeech(); setTimeout(playCurrent, 200); return; }
    const item = getCurrentItem();
    if (!item || !item.en) { dom.status.textContent = "⚠️ No valid sentence"; dom.status.className = "status error"; showToast('No valid sentence'); return; }
    const cleanText = cleanSpeechText(item.en);
    if (!cleanText) { dom.status.textContent = "⚠️ Empty sentence"; dom.status.className = "status error"; showToast('Empty sentence'); return; }
    dom.status.textContent = "⏳ Loading..."; dom.status.className = "status";
    if (playQueue.length > 0) { playQueue = []; isProcessingQueue = false; }
    speakText(cleanText, function(success) {
        if (!success) {
            dom.status.textContent = "⚠️ Playback failed"; dom.status.className = "status error";
            if (hdMode) { hdMode = false; dom.hdToggle.textContent = "✨ HD"; dom.hdToggle.style.background = "#8b5cf6"; showToast('Switched to native voice'); setTimeout(playCurrent, 500); }
        }
    });
}

function toggleRepeat() {
    if (isRepeating) { isRepeating = false; clearTimeout(repeatTimer); stopSpeech(); dom.repeatBtn.textContent = "🔁 Repeat"; dom.repeatBtn.classList.remove("active"); dom.status.textContent = "⏸ Repeat stopped"; dom.status.className = "status paused"; return; }
    isRepeating = true; repeatCount = 0; dom.repeatBtn.textContent = "⏹ Stop Repeat"; dom.repeatBtn.classList.add("active"); doRepeat();
}
function doRepeat() {
    if (!isRepeating) return;
    repeatCount++; dom.status.textContent = `🔁 Repeat ${repeatCount}/${REPEAT_TIMES}`; dom.status.className = "status";
    const item = getCurrentItem(); if (!item) { stopSpeech(); return; }
    const cleanText = cleanSpeechText(item.en); if (!cleanText) { stopSpeech(); return; }
    speakText(cleanText, function(success) {
        if (!isRepeating) return;
        if (!success) { isRepeating = false; dom.repeatBtn.textContent = "🔁 Repeat"; dom.repeatBtn.classList.remove("active"); dom.status.textContent = "⚠️ Repeat interrupted"; dom.status.className = "status error"; return; }
        if (repeatCount >= REPEAT_TIMES) { isRepeating = false; dom.repeatBtn.textContent = "🔁 Repeat"; dom.repeatBtn.classList.remove("active"); dom.status.textContent = "✅ Repeat done"; dom.status.className = "status done"; return; }
        repeatTimer = setTimeout(doRepeat, 600);
    });
}
function toggleHD() {
    if (isOffline) { showToast('HD mode unavailable offline'); return; }
    hdMode = !hdMode; dom.hdToggle.textContent = hdMode ? "✨ HD(ON)" : "✨ HD"; dom.hdToggle.style.background = hdMode ? "#22c55e" : "#8b5cf6"; showToast(hdMode ? "HD voice enabled" : "Native voice");
    if (isSpeaking) { stopSpeech(); setTimeout(playCurrent, 200); }
}
function playPattern() {
    const item = getCurrentItem(); if (!item) return;
    const text = item.pattern.replace(/\.{3}|…/g, "").trim(); const clean = cleanSpeechText(text); if (!clean) return;
    stopSpeech(); setTimeout(() => { dom.status.textContent = "🧩 Pattern..."; speakText(clean); }, 100);
}
function playReplaceWord(word) {
    if (!word) return; const enPart = word.split('|')[0] || word; const clean = cleanSpeechText(enPart); if (!clean) { showToast('⚠️ 发音词为空'); return; }
    speakText(clean, s => { if (s) showToast("🔊 "+clean); else showToast("⚠️ 发音失败"); });
}
function showSentence() {
    const item = getCurrentItem(); if (!item) return;
    const a = getAvailableLessons();
    dom.scene.textContent = item.scene || 'Unknown';
    dom.progress.textContent = `Chunk ${currentIndex+1} / ${a.length}`;
    dom.chunk.textContent = item.chunk || '';
    dom.english.textContent = item.en || '';
    dom.chinese.textContent = item.cn || '';
    dom.replaceList.innerHTML = "";
    if (item.replace && item.replace.length) {
        item.replace.forEach(function(word) {
            const span = document.createElement("span");
            span.className = "replace-item";
            span.textContent = word;
            span.title = "Click to hear pronunciation";
            span.onclick = function(e) { e.stopPropagation(); playReplaceWord(word); };
            dom.replaceList.appendChild(span);
        });
    }
    dom.status.textContent = "Ready"; dom.status.className = "status";
    updateCnStatus();
}
function searchSentence() {
    const keyword = dom.searchInput.value.trim().toLowerCase();
    dom.results.innerHTML = "";
    if (!keyword) { showToast("Enter a keyword"); return; }
    const available = getAvailableLessons();
    const matches = available.filter(item =>
        (item.chunk && item.chunk.toLowerCase().includes(keyword)) ||
        (item.pattern && item.pattern.toLowerCase().includes(keyword)) ||
        (item.en && item.en.toLowerCase().includes(keyword)) ||
        (item.cn && item.cn.includes(keyword)) ||
        (item.scene && item.scene.toLowerCase().includes(keyword))
    );
    if (matches.length === 0) { dom.results.innerHTML = `<div class="no-result">🔍 No matching chunks found</div>`; return; }
    matches.slice(0, 30).forEach(function(item) {
        const box = document.createElement("div");
        box.className = "result";
        box.innerHTML = `<div class="result-en">${item.chunk || ''} · ${item.pattern || ''}${item.isPremium ? ' ⭐' : ''}</div><div class="result-cn">${item.cn || ''}</div>`;
        box.onclick = function() {
            stopSpeech();
            const idx = available.indexOf(item);
            if (idx !== -1) currentIndex = idx;
            showSentence();
            dom.results.innerHTML = "";
            dom.searchInput.value = "";
            setTimeout(playCurrent, 150);
            showToast("Jumped to chunk");
        };
        dom.results.appendChild(box);
    });
}
function populateSceneSelect() {
    const select = document.getElementById('sceneSelect');
    if (!select) return;
    const scenes = new Set();
    lessons.forEach(item => {
        let scene = item.scene || 'Unknown';
        scene = scene.replace(/^⭐\s*/, '').trim();
        if (scene) scenes.add(scene);
    });
    select.innerHTML = '<option value="">📂 全部场景</option>';
    Array.from(scenes).sort().forEach(scene => {
        const opt = document.createElement('option');
        opt.value = scene;
        opt.textContent = scene;
        select.appendChild(opt);
    });
    select.removeEventListener('change', select._changeHandler);
    select._changeHandler = function() {
        dom.searchInput.value = this.value;
        searchSentence();
    };
    select.addEventListener('change', select._changeHandler);
}
